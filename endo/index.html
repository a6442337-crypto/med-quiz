<!DOCTYPE html>

<title>내분비학 기출 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--mute:#6b7385;--line:#e3e6ee;--pri:#1d3c6e;--pri2:#e8eef8;--ok:#2e7d4f;--okbg:#eaf6ef;--bad:#b3362f;--badbg:#fbecea;--var:#7a4bb3}

main{max-width:820px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12.5px;color:var(--mute);margin:10px 0 6px;font-weight:500}

@media(max-width:560px){.lab{grid-template-columns:1fr}}

": "⑤", "E": "① PRL은 수용성 → free로 이동. ② cortisol은 지용성 → CBG 결합, 세포질 수용체. ③ 갑상선호르몬은 핵 내 수용체. ④ progesterone은 스테로이드 → 단백 결합. ⑤ aldosterone은 단백(일부)과 운반되어 세포질 수용체에 작용 → 옳음.", "B": "강의 01 내분비계 기능과 생리", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-46", "keys": ["20-46"], "ch": 0, "g": "호르몬의 수송·수용체·반응성", "stem": "<div>호르몬의 작용을 조절하는 것을 보기에서 모두 고르시오.<\/div><div>ㄱ. 수용체에 대한 affinity<\/div><div>ㄴ. 수용체의 개수<\/div><div>ㄷ. 혈장단백질과의 결합정도<\/div><div>ㄹ. 혈장의 호르몬 농도<\/div>", "o": ["ㄱ,ㄴ,ㄷ,ㄹ", "ㄱ,ㄴ,ㄹ", "ㄷ,ㄹ", "ㄱ,ㄷ,ㄹ", "ㄴ,ㄷ,ㄹ"], "a": 0, "A": "①", "E": "호르몬 작용은 호르몬 농도, 수용체 수(responsiveness), 수용체 affinity(sensitivity), 혈장 단백 결합(유리형만 활성·반감기 결정) 모두에 의해 조절됩니다.", "B": "강의 01 내분비계 기능과 생리", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "23-13", "keys": ["23-13", "22-41"], "ch": 0, "g": "호르몬의 수송·수용체·반응성", "stem": "<div>다음은 내분비 악성 종양 환자의 지방세포 실험결과 얻어진 인슐린 용량-반응 그래프이다. 분리된 지방세포에 포도당을 투여 후 인슐린을 증량하면서 포도당 운반을 측정하였다. 실선은 대조군, 점선은 환자의 결과이다. 대조군과 비교하여 환자의 인슐린 반응도와 민감도로 옳은 것은?<\/div>", "o": ["반응도 감소 / 민감도 변화 없음", "반응도 감소 / 민감도 증가", "반응도 감소 / 민감도 감소", "반응도 변화 없음 / 민감도 감소", "반응도 변화 없음 / 민감도 증가"], "a": 3, "A": "④", "E": "최대 반응(plateau)이 같으면 반응도(responsiveness, 수용체 수) 변화 없음, 곡선이 오른쪽으로 이동하면 같은 반응에 더 높은 농도가 필요 → 민감도(sensitivity) 감소.", "B": "강의 01 내분비계 기능과 생리", "N": "", "img": ["figs/22-41.jpg"], "v": false, "y": [2022, 2023], "ok": true}, {"id": "25-19", "keys": ["25-19", "23-19", "22-24"], "ch": 1, "g": "식이·포도당 수송체·인크레틴", "stem": "<div>당뇨의 예방과 치료에는 식습관의 조절이 매우 중요하다. 다음 보기 중 당뇨를 예방하기 위한 식습관으로 가장 바람직한 것은?<\/div>", "o": ["저탄수화물 고지방의 식사", "단백질의 함량이 높은 식사", "당부하지수가 낮고 충분한 식이섬유를 포함한 식사", "소화가 잘되는 식사", "칼로리가 낮은 식사"], "a": 2, "A": "③", "E": "혈당 스파이크를 막는 것이 핵심 → 당부하지수(GI/GL)가 낮고 식이섬유가 풍부한(소화가 천천히 되는) 식사. '소화가 잘 되는 식사'는 오히려 혈당을 빨리 올립니다. (22·23·25 3년 연속 동일 출제)", "B": "강의 02 당뇨병과 대사", "N": "", "img": [], "v": false, "y": [2022, 2023, 2025], "ok": true}, {"id": "25-20", "keys": ["25-20", "22-25"], "ch": 1, "g": "식이·포도당 수송체·인크레틴", "stem": "<div>포도당은 조직마다 다른 전달체(transporter)를 발현하여 포도당의 사용을 조절합니다. 다음 포도당의 전달체 중 insulin에 의해 그 활성이 조절되는 것은 무엇인가요?<\/div>", "o": ["SGLT1", "SGLT2", "GLUT3", "GLUT4", "GLUT5"], "a": 3, "A": "④", "E": "GLUT4는 근육·지방(심근)에 있으며 인슐린 자극 시 세포막으로 이동하는 insulin-dependent transporter입니다. SGLT1/2는 장·신장의 Na 공동수송, GLUT3는 뇌, GLUT5는 fructose.", "B": "강의 02 당뇨병과 대사", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": true}, {"id": "23-20", "keys": ["23-20"], "ch": 1, "g": "식이·포도당 수송체·인크레틴", "stem": "<div>최근 테슬라의 창업자인 일론 머스크를 비롯한 많은 셀럽들이 사용하는 비만 치료 제거가 주목을 받고 있습니다. 노보 노디스크사의 위고비(Wegovy, Semagluyide), 일라이 릴리(Eli Lilly)사의 마운자로(Monunjaro)가 대표적이며 이들은 GLP-1(glucagon like peptide 1)유사페로서 몸 안에서 작용합니다. 다음중 GLP-1에 대한 설명으로 옳은 것은?<\/div>", "o": ["원래 고혈압 치료제로서 개발되었다", "글루카곤의 분비를 촉진한다", "위장관 운동을 촉진하여 소화를 돕는다", "이러한 호르몬을 Incretin이라고 한다", "반감기가 혈중에서 2시간 정도이다"], "a": 3, "A": "④", "E": "GLP-1·GIP처럼 장에서 분비되어 포도당 의존적으로 인슐린 분비를 늘리는 호르몬을 incretin이라 합니다. GLP-1은 당뇨병 치료제로 개발(①×), 글루카곤 분비 억제(②×), 위배출 지연(③×), DPP-4에 의해 반감기 약 2분(⑤×).", "B": "강의 02 당뇨병과 대사", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "20-31", "keys": ["20-31"], "ch": 2, "g": "갑상선 기능검사 해석 (TSH가 맞지 않는 상황)", "stem": "<div>37세 여자가 TSH 0.1 ulU/ml (0.34~4.25)이다. 가능성이 낮은 경우는?<\/div>", "o": ["postpartum thyroiditis", "Graves' disease로 2일 전부터 methimazole 복용 중", "뇌하수체 수술 후 hydrocortisone과 levothyroxine 복용 중", "갑상선 전절제 수술 후 levothyroxine을 복용하지 않은 경우", "뇌하수체 수술 후 levothyroxine을 복용하지 않은 경우"], "a": 3, "A": "④", "E": "갑상선 전절제 후 LT4를 안 먹으면 원발성 저하증 → TSH는 '상승'. 산후갑상선염(갑상선중독기), Graves 치료 초기(TSH 회복 지연), 뇌하수체 수술 후(중추성)에서는 TSH가 낮을 수 있습니다.", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "22-38", "keys": ["22-38"], "ch": 2, "g": "갑상선 기능검사 해석 (TSH가 맞지 않는 상황)", "stem": "<div>TSH: 0.2 uIU/ml (0.34-4.25 정상치) , free T4:1.3 (참고치 범위내). 치료나 복용 약물의 dosage 변화가 필요한 경우는?<\/div>", "o": ["임신 10주된 24세 산모", "Thyroid papillary carcinoma 로 total thyroidectomy 및 RAI Tx 후 levothyroxine 0.1mg 복용중인 45세 여자", "패혈증, 뇌출혈, 심근경색으로 중환자실에 입원중인 50세 남자", "Hashimoto thyroiditis에 의한  "Methimazole", "Methimazole + propranolol"], "a": 4, "A": "⑤", "E": "TSH R Ab(+) Graves병 + 빈맥 120 → 항갑상선제(methimazole)로 원인 치료 + 호르몬이 정상화될 때까지(2~3개월) 증상 조절용 propranolol 병용.", "B": "강의 03 갑상선기능검사 및 기능이상 · 강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2021 복원 답 ④(methimazole 단독)와 다름 — 빈맥 등 증상이 뚜렷해 β차단제 병용이 강의 원칙", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-33", "keys": ["25-33"], "ch": 2, "g": "갑상선종·Graves병·갑상선염 진단과 치료", "stem": "<div>31세 여자가 두근거림, tremor로 내원하였다. 혈압 150/90mmHg, 심박수 110회/분, 호흡수 18회/분, 체온 36.5도이다. 목의 통증은 없었다. 혈액 검사 결과는 다음과 같다. 치료로 알맞은 것은?<\/div><div class=\"lab\"><span>T3 140 mg/dL (참고치 77~135)<\/span><span>T4 3.1 mg/dL (참고치 0.8~1.7)<\/span><span>TSH 0.01 mlU/L (참고치 0.34~4.25)<\/span><span>TPO 항체 양성<\/span><span>TSH Receptor Ab 0.99 IU/L (참고치 1.75 이하)<\/span><span>ESR 4mm/시간 (참고치 0~15)<\/span><\/div>", "o": ["베타차단제", "메티마졸", "PTU", "스테로이드(프레드니솔론)", "NSAID"], "a": 0, "A": "①", "E": "갑상선중독증이지만 TSH R Ab 정상, TPO Ab 양성, 통증 없음, ESR 정상 → 무통성(silent/painless) 갑상선염. 자연 호전되므로 항갑상선제는 쓰지 않고 증상 조절로 β차단제만. (통증·ESR↑면 아급성 → NSAID)", "B": "강의 04 갑상선염 및 갑상선암", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "20-32", "keys": ["20-32"], "ch": 2, "g": "항갑상선제 부작용 – 무과립구증", "stem": "<div>34세 여자가 1일 전부터 발열과 인후통이 있다. 갑상선에 이상이 있다는 말을 들었고, 2일 전부터 propylthiouracil(PTU) 200mg/day를 복용중이었다. 체온 39.5도, 혈압 120/80 mmHg, 경부갑상선종의 소견을 보였다. 다음 조치는?<\/div>", "o": ["CBC를 검사하여 absollute neutrophil count를 확인한다.", "TSH, free T4를 검사한다.", "PTU를 methimazole로 교체한다.", "hydrocortisone을 투여한다.", "amoxicillin/sulbactam을 투여한다."], "a": 0, "A": "①", "E": "PTU 복용 중 발열·인후통 → 무과립구증 의심 → 즉시 CBC로 ANC 확인(ANC<500). 용량과 무관하게 갑자기 발생합니다.", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "21-44", "keys": ["21-44"], "ch": 2, "g": "항갑상선제 부작용 – 무과립구증", "stem": "<div>30세 여자가 발열 및 인후통으로 왔다. 2개월 전부터 prophythiouracil(PTU) 200mg/day를 복용중이다. 체온 39℃, 혈압 140/90mmHg, 경부갑상선종의 소견을 보였다. 다음 조치는?<\/div>", "o": ["PTU를 methimazole로 교체하고 propranolol을 추가한다.", "PTU를 증량하고 중독성 주기성 마비 (TPP)", "stem": "<div>Thyrotoxic periodic paralysis로 새벽에 응급실로 내원한 22세 남자가 퇴원하려고 한다. 교육할 내용을 바른 것은?<\/div>", "o": ["과일섭취를 많이 하세요.", "운동을 많이 하세요.", "밤에 탄수화물 섭취를 제한하세요.", "김,미역,다시마를 일체 드시지 마세요.", "돼지고기, 계란을 제한하세요."], "a": 2, "A": "③", "E": "갑상선호르몬이 K를 세포 내로 이동시켜 저칼륨 마비 유발. 유발요인: 낮의 과도한 운동, 밤의 고탄수화물(라면·빵·탄산음료) 섭취 → 갑상선 기능이 정상화될 때까지 이를 피하도록 교육. 요오드 제한은 TPP와 무관.", "B": "강의 03 갑상선기능검사 및 기능이상 · 강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-49", "keys": ["21-49", "20-33"], "ch": 2, "g": "갑상선 결절·갑상선암 진단", "stem": "<div>60세 여성의 갑상선 초음파 사진이다. 갑상선기능검사는 정상이다. 3개월 전, 갑상선초음파 유도하 세침흡인검사 결과 AUS였고, 3일 전 다시 시행한 결과 AUS이다. 적절한 처치는?<\/div>", "o": ["관찰한다.", "KRAS 검사", "BRAF V600E 검사", "123I whole body scan을 시행한다.", "131I whole body scan을 시행한다."], "a": 2, "A": "③", "E": "FNA에서 AUS(Bethesda III)가 반복 → 분자검사로 BRAF V600E 확인. 양성이면 유두암으로 보고 수술을 권합니다.", "B": "강의 04 갑상선염 및 갑상선암 · 강의 17 내분비계 병리 조직학", "N": "", "img": ["figs/20-33.jpg"], "v": false, "y": [2020, 2021], "ok": true}, {"id": "23-44", "keys": ["23-44"], "ch": 2, "g": "갑상선 결절·갑상선암 진단", "stem": "<div>50세 여성의 갑상선 초음파 사진은 다음과 같다. 갑상선 기능 검사는 정상이다. 갑상선 결정 세침흡인검사 (FNA) 결과 AUS, V600E mutation 양성이다. 초음파상 좌측 lateral LN (Lymph node)은 사진과 같으며 FNA 결과 papillary carcinoma이다. 향후 가장 적절한 처치는?<\/div>", "o": ["6개월 후 갑상선 초음파 및 FNA 추적검사", "Radioactive Iodine 치료", "갑상선 우엽절제", "갑상선 우엽절제 및 modified Lt. lat. neck dissection", "갑상선 전절제 및 modified Lt. lat. neck dissection"], "a": 4, "A": "⑤", "E": "AUS + BRAF V600E 양성(유두암) + 좌측 측경부 림프절 전이 확인 → 갑상선 전절제 + 전이가 확인된 쪽(좌측) 변형근치경부림프절청소술.", "B": "강의 04 갑상선염 및 갑상선암 · 강의 16 갑상선, 부갑상선 수술", "N": "", "img": ["figs/23-44.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "25-37-1", "keys": ["25-37-1"], "ch": 2, "g": "갑상선 결절·갑상선암 진단", "stem": "<div>50세 여성의 갑상선 초음파 사진은 다음과 같다. 갑상선 기능 검사는 정상이다. 갑상선 결정 세침흡인검사 (FNA) 결과 AUS, V600E mutation 양성이다. 초음파상 좌측 lateral LN (Lymph node)은 사진과 같으며 FNA 결과 papillary carcinoma이다. 향후 가장 적절한 처치는?<\/div>", "o": ["1개월 후 갑상선 초음파 추적검사", "갑상선 우엽절제 및 림파선 수술 후, radioactive iodine 치료", "갑상선 우엽절제 및 림파선 수술", "갑상선 전절제 및 modified Lt. lat. neck dissection", "Radioactive iodine 치료, TSH 억제 치료"], "a": 3, "A": "④", "E": "측경부 림프절 전이가 있으면 lobectomy 조건(편측·피막 내·림프절 전이 없음) 탈락 → 전절제 + 전이된 쪽 lateral neck dissection.", "B": "강의 04 갑상선염 및 갑상선암 · 강의 16 갑상선, 부갑상선 수술", "N": "참고 자료에 37-1/37-2 두 가지 복원(선지만 다름, 답은 둘 다 '전절제 + Lt. MRND')", "img": ["figs/25-37-1.jpg"], "v": false, "y": [2025], "ok": true}, {"id": "23-45", "keys": ["23-45"], "ch": 3, "g": "대사증후군 진단기준", "stem": "<div>50세 남자 환자가 대사 질환 검진을 위해 내원하였다. 검사 소견상 대사 증후군으로 진단할 수 없는 것은?<\/div>", "o": ["허리둘레 100cm", "중성지방 321mg/dL", "저밀도 콜레스테롤 199mg/dL", "고밀도 콜레스테롤 23mg/dL", "공복혈당 130mg/dL"], "a": 2, "A": "③", "E": "한국 기준 5개 중 3개: 허리둘레(남≥90, 여≥85), TG≥150, HDL(남<40, 여<50), 혈압≥130/85, 공복혈당≥100. LDL은 진단 기준이 아님.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-30", "keys": ["25-30"], "ch": 3, "g": "대사증후군 진단기준", "stem": "<div>37세 여자 환자의 검진 결과이다. 대사증후군의 구성 요소 중, 이상 소견에 해당되는 것은?<\/div>", "o": ["체질량지수: 26 kg/m²", "중성지방: 250 mg/dL", "고밀도 콜레스테롤(HDL): 61 mg/dL", "저밀도 콜레스테롤(LDL): 200 mg/dL", "공복혈당: 95 mg/dL"], "a": 1, "A": "②", "E": "TG 250(≥150)만 이상 소견. BMI·LDL은 구성요소가 아니고, HDL 61(여<50 아님)·공복혈당 95(<100)는 정상.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "22-05", "keys": ["22-05"], "ch": 3, "g": "2형 당뇨병의 병태생리 (ominous octet)", "stem": "<div>다음의 내용 중, 현재 알려져 있는 2형 당뇨병의 발생 기전이 아닌 것은?<\/div>", "o": ["인크레틴 효과 감소", "신장에서 포도당 재흡수 감소", "췌장 알파세포 이상", "췌장 베타세포 이상", "Gut microbiome의 변화"], "a": 1, "A": "②", "E": "2형 당뇨에서는 신장 SGLT2를 통한 포도당 재흡수가 '증가'합니다(그래서 SGLT2 억제제가 효과). 인크레틴 효과 감소, α세포 글루카곤 과분비, β세포 기능 저하, 장내 미생물 변화는 모두 기전.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "25-31", "keys": ["25-31"], "ch": 3, "g": "2형 당뇨병의 병태생리 (ominous octet)", "stem": "<div>2형 당뇨병의 병태생리와 관련한 내용 중, 틀린 것은?<\/div>", "o": ["췌장 알파세포의 글루카곤 분비 증가", "Inflammation", "Incretin 증가", "인슐린 저항성 증가", "신장에서 포도당 재흡수 증가"], "a": 2, "A": "③", "E": "2형 당뇨에서는 인크레틴 '효과 감소'가 특징 → 'Incretin 증가'가 틀림. 글루카곤 분비 증가, 염증, 인슐린 저항성, 신장 포도당 재흡수 증가는 모두 기전.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-43", "keys": ["21-43"], "ch": 3, "g": "2형 당뇨병의 병태생리 (ominous octet)", "stem": "<div>대사증후군 진단의 구성요소 중 틀린 것은?<\/div>", "o": ["Abdominal obesity based on waist circumference", "Hyperglycemia (fasting plasma glucose ≥126 mg/dL or known diabetes)", "Low HDL cholesterol (< 50 mg/dL in men and < 40 mg/dL in women)", "Hypertriglyceridemia (≥ 150 mg/dL)", "High blood pressure (BP)(systolic BP ≥ 130 or diastolic BP ≥ 85 mmHg or known hypertension)"], "a": 1, "A": "②", "E": "대사증후군의 고혈당 기준은 공복혈당 ≥100 mg/dL(또는 치료 중)이고, 126은 당뇨병 진단 기준이므로 ②가 틀림. HDL 기준(③)은 교수님 수업 설명·출제 그대로이므로 맞는 선지로 봄.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-29", "keys": ["25-29", "22-07"], "ch": 4, "g": "이차성 고혈압 감별·일차성 알도스테론증", "stem": "<div>35세 남자가 두통을 호소하며 응급실에 내원하였다. 혈압은 190/100 mmHg였고 응급처치를 시행하였다. 다음 검사 중 시행하지 않아도 되는 것은?<\/div>", "o": ["Plasma renin, aldosterone", "Serum K", "ACTH stimulating factor", "Plasma metanephrine", "24시간 소변 free cortisol"], "a": 2, "A": "③", "E": "젊은 고혈압은 이차성 원인 선별: 알도스테론/레닌(ARR)·K, 갈색세포종(plasma metanephrine), 쿠싱(24h UFC). ACTH 자극검사는 부신'부전' 진단용이라 불필요.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": ["figs/25-29.jpg"], "v": false, "y": [2022, 2025], "ok": true}, {"id": "25-39", "keys": ["25-39"], "ch": 4, "g": "이차성 고혈압 감별·일차성 알도스테론증", "stem": "<div>27세 남자가 하지 마비로 응급실에 왔다. 혈압이 180/100mmHg이고 calcium channel blocker를 복용중이다. 혈액검사 소견이 다음과 같아서 K를 투여중이다. 적절한 처치는?<\/div><div class=\"lab\"><span>Na/K 140/1.9(K저하)<\/span><\/div>", "o": ["베타차단제 투여", "Adrenal venous sampling", "Renin Aldosterone 검사", "cortisol 검사", "plasma metanephrine 검사"], "a": 2, "A": "③", "E": "젊은 남성 + 조절 안 되는 고혈압 + 저칼륨 마비 → 일차성 알도스테론증 의심 → 첫 검사는 레닌·알도스테론(ARR 선별). AVS는 CT로 종괴 확인 후, 수술 전 편측성 확인 단계.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2025 복원 답 ①(TPP로 해석)과 다름. 2021-23번(25세, CCB에도 190/100, K 1.9 → 일차성 알도스테론증)과 거의 같은 증례. 2026년 강의 자료도 CCB에도 180/100인 저항성 고혈압 + 갑상선중독 소견 없음 → 일차성 알도스테론증으로 보고 ③으로 정정", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-46", "keys": ["23-46"], "ch": 4, "g": "이차성 고혈압 감별·일차성 알도스테론증", "stem": "<div>27세 남자가 하지 마비로 응급실에 왔다. 혈압이 180/100 mmHg이고 calcium channel blocker를 복용중이다. 혈액검사 소견이 다음과 같아서 K를 투여중이다. 적절한 처치는? (Na/K 140/1.9, 해설상 aldosterone 50 ng/dL, renin 0.2 — 일부 수치 미복원)<\/div>", "o": ["알파차단제 투여", "adrenal venous sampling", "응급수술", "복부 CT", "TFT 검사"], "a": 3, "A": "④", "E": "ARR 250(>30)으로 일차성 알도스테론증 → 다음 단계는 부신 CT로 종괴 확인. 그 뒤 AVS로 편측성 확인 후 수술.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "일부 수치 미복원(해설상 aldosterone 50, renin 0.2)", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "20-34", "keys": ["20-34"], "ch": 4, "g": "이차성 고혈압 감별·일차성 알도스테론증", "stem": "<div>27세 남자가 하지 마비로 응급실에 왔다. 혈압이 180/100mmHg이고, calcium channel blocker를 복용중이었다. 응급처치를 시행하였다. 복부 ct 및 혈액검사 소견은 다음과 같다. 다음 처치는?<\/div><div class=\"lab\"><span>Na/K 140/1.9(K 저하)<\/span><span>plasma renin activity 0.2ng/mL/hr<\/span><span>aldosterome 50ng/dl<\/span><span>plasma metanephrine 0.3 (참고치 0-0.5)<\/span><span>24시간 urine metanephrine 300mg/day (참고치 52-341)<\/span><span>24시간 VMI 5mg/day (참고치 0-8)<\/span><span>24시간 urine free cortisol 25 microgram/day (참고치 &lt;60)<\/span><\/div>", "o": ["경과관찰", "응급수술", "CT 유도하 fine needle aspirtation biopsy", "spirolactone 투여", "adrenal venous sampling"], "a": 4, "A": "⑤", "E": "ARR = 50/0.2 = 250 → 일차성 알도스테론증, CT에서 종괴 확인됨 → 수술 전에 어느 쪽이 기능성인지 adrenal venous sampling.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": ["figs/20-34.jpg"], "v": false, "y": [2020], "ok": true}, {"id": "21-23", "keys": ["21-23"], "ch": 4, "g": "이차성 고혈압 감별·일차성 알도스테론증", "stem": "<div>25세 남자가 하지 마비로 응급실에 왔다. 혈압이 190/100mmHg이고, calcium channel blocker를 복용중이었다. 응급처치를 시행하였다. 복부 ct 및 혈액검사 소견은 다음과 같다. 다음 처치는?<\/div><div class=\"lab\"><span>Na/K 140/1.9(K 저하)<\/span><span>plasma renin activity 0.2ng/mL/hr<\/span><span>aldosterome 50ng/dl<\/span><span>plasma metanephrine 0.3 (참고치 0-0.5)<\/span><span>24시간 urine metanephrine 300mg/day (참고치 52-341)<\/span><span>24시간 VMI 5mg/day (참고치 0-8)<\/span><span>24시간 urine free cortisol 25 microgram/day (참고치 &lt;60)<\/span><\/div>", "o": ["6개월후 CT", "ACTH", "Adrenal venous sampling", "수술", "alpha-blocker 투여"], "a": 2, "A": "③", "E": "25세, CCB에도 190/100, K 1.9 → ARR = 50/0.2 = 250(>30)으로 일차성 알도스테론증, CT에서 종괴 확인 → 수술 전 기능성 병변 쪽을 확인하는 AVS.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2020-34와 증례는 같지만 선지가 달라 분리", "img": ["figs/21-23.jpg"], "v": false, "y": [2021], "ok": true}, {"id": "25-40", "keys": ["25-40"], "ch": 4, "g": "쿠싱증후군 진단 순서", "stem": "<div>40세 여자가 골다공증에 의한 고관절 골절로 정형외과 수술 후, 내분비내과에 협진의뢰 되었다. 160cm, 70kg이며 최근 1년간 20kg 체중증가가 있다. 팔 다리에 멍든 자국들이 있다. 다음 단계로 해야 할 일은?<\/div>", "o": ["스테로이드 투여력을 확인한다.", "24h urine free cortisol을 검사한다.", "Pituitary function test(cocktail test)를 시행한다.", "Rapid ACTH stimulation test를 시행한다.", "Overnight Dexamethasone suppression test를 시행한다."], "a": 0, "A": "①", "E": "쿠싱 의심 시 가장 먼저 외인성 스테로이드 투여력(연고·주사·한약 포함)을 확인해 iatrogenic을 배제 → 이후 선별검사(24h UFC 또는 overnight DST).", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-47", "keys": ["23-47"], "ch": 4, "g": "쿠싱증후군 진단 순서", "stem": "<div>25세 여자가 골다공증에 의한 고관절 골절로 정형외과 수술 후, 내분비내과에 협진의뢰 되었다. 160 cm, 70 kg이며, 최근 6개월간 15 kg의 체중 증가가 있다. 팔/다리에 멍든 자국들이 있고, 스테로이드 투여력은 없다. 다음 단계로 시행할 검사는?<\/div>", "o": ["TSH", "24hr urine free cortisol", "Pituitary function test (Cocktail test)", "Rapid ACTH stimulation test", "Low dose dexamethasone suppression test"], "a": 1, "A": "②", "E": "스테로이드 투여력이 이미 없음 → 다음은 선별검사(24h urine free cortisol 또는 overnight DST). Low dose DST는 확진, rapid ACTH 자극검사는 부신부전용.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "22-08", "keys": ["22-08"], "ch": 4, "g": "쿠싱증후군 진단 순서", "stem": "<div>65세 여자가 얼굴이 붓고, 2개월 동안 체중이 10kg증가하였다고 병원에 왔다. 팔/다리에 멍든 자국들이 보인다. 다음단계 처치 중, 가장 적절치 않은 것은?<\/div>", "o": ["스테로이드 투여력 확인", "복부 전산화단층촬영 (CT)", "Overnight dexamethasone suppression test", "24시간 소변 free cortisol", "TSH, free T4, T3"], "a": 4, "A": "⑤", "E": "쿠싱 work-up: 스테로이드 투여력 → 선별(24h UFC, overnight DST) → 확진(LDDST) → ACTH로 위치 결정(낮으면 복부 CT). TFT는 쿠싱 진단 과정과 무관.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-35", "keys": ["20-35"], "ch": 4, "g": "부신부전", "stem": "<div>21세 여성이 의식저하로 내원하였다. 제 1형 당뇨병과 갑상선기능저하증으로 약물치료중이었다. 얼굴에 백반증이 관찰되었다. 혈압 70/40mmHg이고, 혈액검사결과는 다음과 같다. 시행할 검사는?<\/div><div>glucose 89mg/dL, pH 7.4, HCO3- 24, Na 121mEq/L, HbA1c 7.8%, TSH 3.0mIU/L(0.34~4.25), free T4 1.4ng/dL (참고치 0.8-1.7)<\/div>", "o": ["TRH stimulation test", "rapid ACTH stimulation test", "overnight dexamethasone suppression test", "low dose dexamethasone suppression test", "plasma metanephrine"], "a": 1, "A": "②", "E": "제1형 당뇨·갑상선저하증(자가면역 동반) + 백반증 + 저혈압 + 저나트륨 → 일차성 부신부전(Addison) 의심 → rapid ACTH 자극검사(cortisol <18 μg/dL면 부전).", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "22-01", "keys": ["22-01"], "ch": 5, "g": "부신우연종 수술 적응증", "stem": "<div>45세 남자가 복부 불편감을 주소로 내원하여 시행한 복부 전산화 촬영(abdomen CT)에서 좌측 부신에 다른 장기를 침범하지 않은 6cm size의 부신 우연종(adrenal incidentaloma)이 관찰되었으며 부신 기능검사 상 특이소견은 없었다. 상기 환자의 다음 치료 혹은 처치로 옳은 것은?<\/div>", "o": ["Lt. adrenal mass biopsy", "Lt. radical nephrectomy & adrenalectomy", "Lt. adrenalectomy", "3개월 뒤 CT 추적검사", "adrenal mass tumor maker 검사"], "a": 2, "A": "③", "E": "비기능성이라도 4cm 이상(또는 1년에 1cm 이상 증가, 영상에서 악성 의심)이면 부신절제. 6cm → Lt. adrenalectomy. 부신 종괴는 생검하지 않습니다.", "B": "강의 08 부신의 외과적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "25-11", "keys": ["25-11"], "ch": 5, "g": "부신우연종 수술 적응증", "stem": "<div>부신우연종에 대한 설명으로 옳지 않은 것은?<\/div>", "o": ["부신우연종은 부신질환이 의심되지 않은 상태에서 시행한 CT 혹은 MRI에서 우연히 발견된 부신종괴를 말한다.", "영상검사에서 악성종양이 의심되더라도 크기가 작으면 12개월 후 추적관찰을 한다.", "adrenal mass function test에서 functional mass일 경우 수술한다.", "종양이 benign으로 보이고 non functioning이라도 4cm 이상이면 수술한다.", "4년 동안 추적관찰하여도 크기 변화가 없으면 추적관찰을 종료한다."], "a": 1, "A": "②", "E": "영상에서 악성이 의심되면 크기와 관계없이 수술합니다. 기능성이면 수술, 비기능성·양성이면 4cm 이상 수술, 4cm 미만은 12개월 간격 4년 추적 후 변화 없으면 종료.", "B": "강의 08 부신의 외과적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "22-02", "keys": ["22-02"], "ch": 5, "g": "부신 해부·생리", "stem": "<div>Adrenalectomy 시 결찰해야할 가장 중요한 혈관은 adrenal vein이다. 다음 중 Rt. adrenal vein이 기시하는 곳으로 올바른 것은?<\/div>", "o": ["Rt. renal vein", "IVC", "Rt. lumbar vein", "Inferior phrenic vein", "Rt. gonadal vein"], "a": 1, "A": "②", "E": "Rt. adrenal vein → IVC로 직접 유입(짧아 수술 시 주의), Lt. adrenal vein → Lt. renal vein. 부신 수술에서는 동맥보다 adrenal vein을 먼저 결찰합니다.", "B": "강의 08 부신의 외과적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "23-39", "keys": ["23-39"], "ch": 5, "g": "부신 해부·생리", "stem": "<div>Adrenalectomy 시 결찰해야 할 가장 중요한 혈관은 adrenal vein이다. 다음 중 Lt. adrenal vein이 기시하는 곳으로 올바른 것은?<\/div>", "o": ["Left renal vein", "IVC", "Inf phrenic vein", "Splenic vein", "Left lumbar vein"], "a": 0, "A": "①", "E": "Lt. adrenal vein은 left renal vein에서 기시(우측은 IVC).", "B": "강의 08 부신의 외과적 치료", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-12", "keys": ["25-12"], "ch": 5, "g": "부신 해부·생리", "stem": "<div>부신에 대한 설명이다. 옳지 않은 것은?<\/div>", "o": ["부신은 medulla와 cortex로 이루어져 있다.", "부신은 zona glomerulosa, zona fasciculata, zona reticularis로 이루어져 있다.", "부신은 nerve system에 의해 parasympathetic nerve를 통해 medulla로 신호를 전달하여 catecholamine을 분비한다.", "zona glomerulosa에서 aldosterone을 분비한다.", "zona fasciculata에서 cortisol을 분비한다."], "a": 2, "A": "③", "E": "부신수질은 '교감'신경(절전섬유)의 지배를 받아 catecholamine을 분비합니다. 피질은 사구대(aldosterone)·속상대(cortisol)·망상대(androgen).", "B": "강의 08 부신의 외과적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-26", "keys": ["21-26"], "ch": 6, "g": "호르몬 검사 해석", "stem": "<div>2번에 해당하는 것은? (그래프상 번호는 2번 외엔 임의)<\/div>", "o": ["normal", "Primary failure of target tissue", "Target hormone resistance", "Pituitary failure", "Primary target organ hyperfunction"], "a": 2, "A": "③", "E": "2번 = 자극호르몬(trophic)과 표적호르몬이 모두 높음 → 표적호르몬 저항성(또는 이소성 자극호르몬). 1번 자극↑·표적↓ = 표적기관 일차성 부전, 4번 둘 다↓ = 뇌하수체 부전, 5번 자극↓·표적↑ = 표적기관 일차성 기능항진.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": ["figs/21-26.jpg"], "v": false, "y": [2021], "ok": true}, {"id": "21-21", "keys": ["21-21"], "ch": 6, "g": "고프로락틴혈증", "stem": "<div>29세 여자환자가 3개월 전부터 발생한 유루증과 무월경, 전신쇄약감 등을 주소로 내원하였다. 내원 전 개인의원에서 시행한 검사상 혈중 prolactin 농도는 214 ng/mL 이었으며 과거력상 2년 전 첫째 아이를 분만하였고 임신반응 검사는 음성이었다. 평소에속이 안좋아서 위장약을 복용하였다고 한다. 다음 조치는?<\/div>", "o": ["Sellar MRI", "자가복용약물 중단 후 serial prolactin f/u", "Pituitary function stimulation test", "Thyroid function test", "Oral glucose tolerance test"], "a": 0, "A": "①", "E": "PRL 214 → 200 ng/mL 이상은 약물보다 prolactinoma 같은 기질적 병변을 시사 → sellar MRI. (2023-36처럼 200 미만 + 위장약이면 약물 중단 후 추적)", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "위장약 복용력이 있어도 PRL이 200 ng/mL 이상이면 MRI가 먼저", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "22-11", "keys": ["22-11"], "ch": 6, "g": "고프로락틴혈증", "stem": "<div>29세 여자환자가 3개월 전부터 발생한 유루증과 무월경, 전신쇄약감 등을 주소로 내원하였다. 내원 전 개인의원에서 시행한 검사상 혈중 prolactin 농도는 214 ng.mL 이었으며 과거력상 2년 전 첫째 아이를 분만하였고 임신반응 검사는 음성이었다. 평소에 속이 안좋아서 위장약을 복용하였다고 한다. 다음 시행해야 하는 바람직한 조치는?<\/div>", "o": ["Pituitary function stimulation test", "Sellar MRI", "Self medication 중단 후 serial prolactin f/u", "Thyroid function test", "Oral glucose tolerance test"], "a": 1, "A": "②", "E": "PRL 214로 200 ng/mL 이상 → 기질적 병변(prolactinoma) 확인을 위해 sellar MRI. (임신 반응 음성 확인됨)", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "23-36", "keys": ["23-36"], "ch": 6, "g": "고프로락틴혈증", "stem": "<div>29세 여자 환자가 3개월 전부터 발생한 유루증, 무월경, 전신 쇠약감 등을 주소로 내원하였다. 내원 전 개인 의원에서 시행한 검사상 혈중 prolactin 농도는 62ng/ml이었으며 과거력상 2년 전 첫째 아이를 분만하였고 임신 반응 검사는 음성이었다. 평소에 속이 안 좋아 위장약을 복용하였다고 한다. 적절한 처치는?<\/div>", "o": ["pituitary function stimulation test", "sellar MRI", "self medication 중단 후 serial prolactin f/u", "thyroid function test", "oral glucose tolerance test"], "a": 2, "A": "③", "E": "PRL 62로 200 미만 + 위장약(PPI·metoclopramide 등 도파민 길항) 복용 → 약제성 고프로락틴혈증 먼저 의심 → 원인 약물 중단 후 PRL 추적.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "2023 복원집 30번·36번이 같은 문항의 중복 복원(PRL 64/62) → 하나로 수록. 2022와 선지는 같으나 수치·정답이 달라 분리", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-23", "keys": ["25-23"], "ch": 6, "g": "고프로락틴혈증", "stem": "<div>28세 여성이 무월경과 유즙분비를 주소로 내원하였다. 혈청 prolactin 수치는 126 ng/mL였다. 다음 중 이 환자의 고프로락틴혈증(hyperprolactinemia)의 원인으로 가장 관련이 먼 것은?<\/div>", "o": ["Primary adrenal insufficiency", "Stress", "Pituitary stalk compression", "Atypical stalk compression", "H₂ agonist"], "a": 4, "A": "⑤", "E": "고프로락틴혈증 원인: 생리적(임신·스트레스), 약물(도파민 길항제, H2 '길항제'인 cimetidine 등), 뇌하수체 줄기 압박(종양·비전형 압박), 일차성 갑상선저하증, 부신부전·신부전 등. H2 '작용제(agonist)'는 원인이 아니므로 ⑤가 가장 관련이 멂.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-35", "keys": ["23-35", "22-12"], "ch": 6, "g": "요붕증·다뇨", "stem": "<div>38세 여자가 다음, 다뇨증으로 내원하였다. 하루 소변량은 6L였고 최근 들어 증상이 악화되었다고 한다. 수분 제한검사는 다음과 같다. 치료는?<\/div><table class=\"dt\"><caption>수분 제한 검사 (2022 복원 수치)<\/caption><tr><th>시간(hr)<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>바소프레신 1시간 후<\/th><\/tr><tr><td>혈장 오스몰(mOsm/kg)<\/td><td>295<\/td><td>290<\/td><td>296<\/td><td>300<\/td><td>312<\/td><td>330<\/td><td>328<\/td><\/tr><tr><td>소변 오스몰(mOsm/kg)<\/td><td>64<\/td><td>90<\/td><td>110<\/td><td>130<\/td><td>120<\/td><td>124<\/td><td>130<\/td><\/tr><\/table>", "o": ["리튬", "바소프레신", "데메클로사이클린", "클로로싸이아자이드", "바소프레신"], "a": 3, "A": "④", "E": "수분 제한해도, vasopressin을 줘도 소변 삼투압이 300 미만으로 농축되지 않음 → 신성 요붕증 → thiazide(chlorothiazide/HCTZ)가 1차 치료. (vasopressin에 반응하면 중추성)", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true}, {"id": "23-34", "keys": ["23-34", "22-13"], "ch": 6, "g": "요붕증·다뇨", "stem": "<div>아래 보기는 다뇨의 원인이다. 다음의 보기 중에서 기전이 다른 것은?<\/div>", "o": ["조영제", "나트륨-포도당 공동 수용체 2", "이뇨제", "고칼슘혈증", "만니톨"], "a": 3, "A": "④", "E": "조영제·SGLT2 억제제(포도당)·이뇨제·만니톨은 용질 이뇨(solute diuresis). 고칼슘혈증은 신성 요붕증을 일으키는 수분 이뇨(water diuresis)로 기전이 다릅니다.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true}, {"id": "25-24", "keys": ["25-24"], "ch": 6, "g": "요붕증·다뇨", "stem": "<div>27세 여성이 다뇨와 심한 갈증을 주소로 내원하였다. 하루 소변량은 7.5L였으며, 수분 제한 검사에서 소변 삼투압은 거의 증가하지 않았다. 이후 바소프레신(vasopressin) 투여 후에도 소변 삼투압의 유의한 증가가 관찰되지 않았다. 이 환자의 상태와 관련된 질환의 원인으로 가장 적절하지 않은 것은?<\/div>", "o": ["Lithium", "Amphotericin B", "Spironolactone", "Hypercalcemia", "Aminoglycoside"], "a": 2, "A": "③", "E": "수분 제한·바소프레신 투여에도 소변 삼투압이 오르지 않음 → 신성 요붕증. 원인: lithium, amphotericin B, 고칼슘혈증, aminoglycoside(신독성), 저칼륨혈증, demeclocycline 등. Spironolactone은 신성 요붕증의 원인이 아님.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-04", "keys": ["21-04"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>일차성 부갑상선기능항진증(primary hyperparathyroidism)의 가장 흔한 원인은?<\/div>", "o": ["신장 이식", "부갑상선종", "만성신부전", "갑상선 수술 중 부갑상선의 손상", "vitamin D 결핍"], "a": 1, "A": "②", "E": "일차성 부갑상선항진증의 가장 흔한 원인은 단일 부갑상선 선종(약 80~85%). 만성신부전·비타민 D 결핍은 이차성, 신장이식 후 지속은 삼차성, 수술 중 손상은 부갑상선 '저하증'의 원인.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "22-14", "keys": ["22-14"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>60세 여자의 검사 결과가 다음과 같다. 향후 처치 결정을 위하여 필요한 검사는?<\/div><div class=\"lab\"><span>Calcium 11.2 mg/dL (참고치 8.5-10.5), Ionized calcium 5.7mg/dL (4.5-5.5)<\/span><span>PTH 365 pg/mL (10-60)<\/span><span>BUN/Cr 17/ 0.8 mg/dL (참고치 범위내에 있음)<\/span><span>Tc-99m MIBI SPECT/CT: 사진 참조<\/span><\/div>", "o": ["비타민 D", "PTH related protein", "척추 x-ray", "혈청 P", "당뇨병, 고혈압 여부"], "a": 2, "A": "③", "E": "Ca↑ + PTH 365 + MIBI 섭취 → 일차성 부갑상선항진증. '향후 처치 결정' = 수술 적응증 평가 → 척추 X-ray로 vertebral fracture 확인(골다공증/골절은 수술 적응증).", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": ["figs/22-14.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "23-33", "keys": ["23-33"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>60세 여자의 검사 결과가 다음과 같다. 향후 처치 결정을 위해 필요한 검사는?<\/div><div class=\"lab\"><span>Calcium 11.2mg/dL(참고치 8.5-10.5), Ionized calcium 5.7mg/dL(4.5-5.5)<\/span><span>PTH 365 pg/mL(10-60)<\/span><span>BUN/Cr 17/0.8 mg/dL(참고치 범위내)<\/span><span>Tc-99m MIBI SPECT/CT<\/span><\/div>", "o": ["vit. D", "PTH related protein", "복부 전산화 단층촬영", "혈청 P", "흉부 전산화 단층촬영"], "a": 2, "A": "③", "E": "수술 적응증 평가 항목 중 신결석 확인(X-ray·초음파·CT)이 있으므로 복부 CT. 적응증: <50세, Ca 상한+1 이상, CrCl<60·24h 소변 Ca>400, 신결석, 골다공증/골절.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "22년과 선지(③⑤)가 달라 분리", "img": ["figs/23-33.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "21-25", "keys": ["21-25"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>59세 남성이 전보다 허리가 굽은 듯하며, 키가 줄었다고 한다. 검사 결과는 다음과 같다. 어떤 결과를 보일 시, 부갑상선절제술 시행을 고려할까?<\/div><div>Calcium 11.0mg/dL (참고치 8.5~10.5), Ionized calcium 6.0mg/dL (4.5~5.5), intact PTH 120pg/mL (10~60), BUN/Cr 17/1.2mg/dL (참고치 범위 내에 있음)<\/div>", "o": ["X-ray 상 요로결석 관찰", "24h urine calcium = 300mg/day", "Creatinine Clearance 75mL/min", "PTH related protein (PTHrP) 증가", "T-score = -2.0 at lumbar spine"], "a": 0, "A": "①", "E": "수술 적응증: 50세 미만, Ca 상한+1(>11.5), CrCl<60, 24h 소변 Ca>400, 신결석(X-ray·초음파·CT), T≤-2.5 또는 척추골절. 이 환자는 Ca 11.0, CrCl 75, 소변 Ca 300, T -2.0으로 해당 없음 → 요로결석이 보이면 적응증. PTHrP는 악성 고칼슘혈증 감별용.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "21-47", "keys": ["21-47"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>73세 여성이 서백(43회/분)이 관찰된다. total calcium 15mg/dL (8.5~10.5), ionized calcium 7mg/dL (4.5~5.3)이다. 지금 바로 시행할 처치는?<\/div>", "o": ["PTH 결과를 확인한다.", "PTHrP 결과를 확인한다.", "rehydration 및 furosemide를 투여한다.", "hypercalcemia의 원인감별을 위하여 parathyroid scan을 시행한다.", "hypercalcemia의 원인 중 lung cancer확인을 위하여 thorax CT를 시행한다."], "a": 2, "A": "③", "E": "Ca 15 + 서맥 = 증상 있는 중증 고칼슘혈증 → 원인 검사보다 즉시 치료가 먼저: 생리식염수로 수액 보충 후 furosemide(+ calcitonin·bisphosphonate). PTH·PTHrP·영상은 안정화 뒤 감별.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-25", "keys": ["25-25"], "ch": 6, "g": "일차성 부갑상선기능항진증", "stem": "<div>58세 여자가 건강검진에서 고칼슘혈증을 진단받아 내원하였다. 환자는 무증상이며 내분비내과에 의뢰되었다. 검사 결과는 다음과 같다. 가장 적절한 처치는?<\/div><div class=\"lab\"><span>Serum calcium: 11.4 mg/dL (정상 8.5~10.5)<\/span><span>Ionized calcium: 5.8 mg/dL (정상 4.5~5.5)<\/span><span>PTH: 125 pg/mL (정상 10~60)<\/span><span>Creatinine clearance: 65 mL/min<\/span><span>24시간 요중 칼슘: 120 mg/day<\/span><span>골밀도(DXA) T-score: -2.3<\/span><\/div><div>신장 초음파: 결석 없음<\/div>", "o": ["고칼슘혈증이 경미하고 무증상이므로 경과관찰 및 추적관찰한다.", "비스포스포네이트로 골밀도만 조절한다.", "Cinacalcet으로 PTH를 조절하고 수술은 2차적으로 고려한다.", "부갑상샘 절제술(parathyroidectomy)을 시행한다.", "MEN1 유전자검사를 시행한다."], "a": 0, "A": "①", "E": "무증상 일차성 부갑상선항진증 → 수술 적응증부터 확인: 50세 미만(58세 ×), 혈청 Ca가 상한+1 mg/dL 이상(11.4 < 11.5 ×), CrCl<60(65 ×), 24h 소변 Ca>400(120 ×), 신결석(없음 ×), 골다공증 T≤-2.5 또는 골절(-2.3 ×) → 해당 없음 → 경과관찰.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "25-28", "keys": ["25-28"], "ch": 6, "g": "골밀도 판독·골다공증 약제", "stem": "<div>52세 남성이 DXA(이중 에너지 X선 흡수 계측법)를 시행하였다. 골다공증의 진단 및 경과 관찰을 위해 참고해야 할 것은?<\/div>", "o": ["-0.9", "-1.2", "-1.3", "-1.5", "-1.7"], "a": 0, "A": "①", "E": "요추 BMD는 아래로 갈수록 하중을 많이 받아 T-score가 커지는(덜 낮은) 것이 정상. 이 패턴에서 벗어나거나 인접 척추와 T-score 차이가 1 이상이면 그 척추는 판독에서 제외하고, 남은 인접 척추를 묶은 값을 씀. 표(모두 음수)에서 L2→L4로 갈수록 T-score가 오히려 낮아지므로 L3·L4를 빼고 L1–L2 행의 값 -0.9를 봄.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "표의 T-score는 모두 음수(-)로 읽어야 함(최종검토)", "img": ["figs/25-28.jpg"], "v": false, "y": [2025], "ok": true}, {"id": "22-16", "keys": ["22-16"], "ch": 6, "g": "골밀도 판독·골다공증 약제", "stem": "<div>다음의 골다공증 약제 중 골흡수 억제 및 골형성 효과를 동시에 보이는 약제는?<\/div>", "o": ["비스포스포네이트", "선택적 여성호르몬 수용체 조절제", "로모소주맙", "부갑상선 호르몬", "데노수맙"], "a": 2, "A": "③", "E": "Romosozumab(항-sclerostin)은 골형성 촉진 + 골흡수 억제의 dual effect. PTH(teriparatide)는 골형성, bisphosphonate·denosumab·SERM은 골흡수 억제.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "23-31", "keys": ["23-31"], "ch": 6, "g": "골밀도 판독·골다공증 약제", "stem": "<div>잔존효과 있는 약물로 옳은 것은?<\/div>", "o": ["Bisphosphonate", "PTH", "Romosozumab", "선택적 에스트로젠 수용체 조절제", "Denosumab"], "a": 0, "A": "①", "E": "Bisphosphonate는 뼈에 침착되어 중단 후에도 효과가 남는(잔존효과) 약제 → drug holiday 가능. Denosumab은 중단 시 효과가 빠르게 소실(rebound)되어 끊을 때 bisphosphonate로 전환.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-27", "keys": ["25-27"], "ch": 6, "g": "골밀도 판독·골다공증 약제", "stem": "<div>72세 여자가 골다공증 치료를 원한다. 과거 요추골절의 경험이 있고, 골밀도 검사에서 현재 T-score은 -3.0이었다. 환자는 calcium channel blocker를 복용 중이다. Non-vertebral fracture 위험 감소에 대해 약제를 사용하려 할 때, 명확한 효과가 입증되지 않은 것은?<\/div>", "o": ["Zoledronic acid", "Ibandronate", "Risedronate", "Romosozumab", "Denosumab"], "a": 1, "A": "②", "E": "Ibandronate는 척추골절 감소는 입증됐지만 비척추골절 감소는 사후 하위군·고용량 메타분석에서만 보였고 일관성이 없어 '명확히 입증되지 않은' 약제로 봅니다. Zoledronic acid, risedronate, denosumab, romosozumab은 비척추골절 감소 효과가 입증됐습니다.", "B": "웹 자료 (강의 자료에 직접 근거 없음)", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-32", "keys": ["23-32", "22-15"], "ch": 6, "g": "MEN 선별검사", "stem": "<div>55세 남자가 MEN1을 진단받았다. MEN1 gene mutation이 확인되어 가족들에게 genetic testing을 시행하였다. MEN1 gene mutation이 확인된 가족에게 시행한 선별 및 추적 검사로 적절하지 않은 것은?<\/div>", "o": ["serum metanephrine", "gastrin", "IGF-1", "Fasting glucose/insulin", "Chromogranin A"], "a": 0, "A": "①", "E": "MEN1 = 부갑상선(PTH·Ca), 췌장 신경내분비종양(gastrin, fasting glucose/insulin, chromogranin A, glucagon), 뇌하수체(IGF-1, PRL). Metanephrine(갈색세포종)은 MEN2 선별 항목.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true}, {"id": "21-31", "keys": ["21-31"], "ch": 6, "g": "MEN 선별검사", "stem": "<div>43세 남성이 MEN1을 진단받았다. MEN1 gene mutation이 확인되어 가족들에게 genetic testing을 시행하였다. MEN1 gene mutation이 확인된 가족에게 시행할 선별 및 추적검사로 적절하지 않은 것은?<\/div>", "o": ["Chromgranin A", "Glucagon", "iPTH", "Gastrin", "Thyroid function test"], "a": 4, "A": "⑤", "E": "MEN1 추적: Ca·iPTH(부갑상선), gastrin·glucagon·chromogranin A·공복 혈당/인슐린(췌장 NET), PRL·IGF-1(뇌하수체), 흉부·복부 CT/MRI. 갑상선기능검사는 해당 없음.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-26", "keys": ["25-26"], "ch": 6, "g": "MEN 선별검사", "stem": "<div>40세 여성이 MEN1 유전자 돌연변이로 진단받고 다발내분비종양(MEN1 종양)이 확인되었다. MEN1 유전자 변이가 확인된 환자와 MEN1 유전자를 가진 사람들이 시행할 선별 검사로 적절하지 않은 것은?<\/div>", "o": ["iPTH", "흉부 CT", "IGF-1", "Glucagon", "Calcitonin"], "a": 4, "A": "⑤", "E": "Calcitonin은 수질암(MEN2) 선별 항목. iPTH, 흉부 CT(흉선·기관지 카르시노이드), IGF-1, glucagon은 MEN1 추적 항목.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-42", "keys": ["21-42"], "ch": 6, "g": "MEN 선별검사", "stem": "<div>56세 남성이 갑상선결절로 수술하였고, 그 결과 갑상선 수질암이 진단되었다. 향후 시행할 검사계획 중 틀린 것은?<\/div>", "o": ["total/ionized calcium", "plasma metanephrine", "RET oncogene", "prolactin", "iPTH"], "a": 3, "A": "④", "E": "수질암 → MEN2 감별: RET 유전자, plasma metanephrine(갈색세포종 — 수술 전 반드시), Ca·iPTH(MEN2A 부갑상선). Prolactin(뇌하수체)은 MEN1 항목.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "23-38", "keys": ["23-38", "22-09"], "ch": 6, "g": "이상지질혈증", "stem": "<div>60세 남자의 건강검진 결과의 이상소견으로 내원하였다. 현재 복용중인 약제는 없<\/div><div>다고 하며, 검사 결과는 아래와 같다. 일차적으로 사용해야 할 약제는?<\/div><div>Triglyceride 210mg.dL, LDL cholesterol 142mg.dL, HDL cholesterol 45mg.dL<\/div><div class=\"lab\"><span>Fasting glucose 189mg/dL, HbA1c9%<\/span><span>키 170cm, 몸무게 100kg, 혈압 150/100mmHg<\/span><span>Current smoker<\/span><\/div>", "o": ["스타틴", "오메가3 지방산", "피브린산 유도체", "에제티미브", "PCSK9 억제제"], "a": 0, "A": "①", "E": "당뇨병 + 흡연 + 고혈압 등 위험인자 → LDL 목표 미달 시 1차 약제는 statin (statin → ezetimibe → PCSK9 억제제 순).", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true}, {"id": "25-21", "keys": ["25-21"], "ch": 6, "g": "이상지질혈증", "stem": "<div>60세 남자가 건강검진 이상으로 내원하였다. 검사 결과는 다음과 같다. 다음 중 가장 우선적으로 시행해야 할 조치는 무엇인가?<\/div><div class=\"lab\"><span>Triglyceride :410mg/dL /  LDL : 142mg/dL / HDL : 45mg/dL<\/span><span>fasting glucose : 110mg/dL / HbA1C : 5.8%<\/span><span>키 :170cm / 몸무게 : 100kg / 혈압 : 130/80mmHg / 흡연자<\/span><\/div>", "o": ["스타틴", "오메가3", "피브린 유도체", "에제티미브", "생활 습관 교정"], "a": 0, "A": "①", "E": "흡연 + 비만 + 경계성 혈당 → 심혈관 위험을 낮추는 1차 약제는 statin. TG 410은 500 미만이라 fibrate 우선 아님(TG≥500이면 췌장염 예방 위해 TG 강하 우선).", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "22·23년 문항과 수치·선지(⑤ 생활습관)가 달라 분리", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-36", "keys": ["21-36"], "ch": 6, "g": "이상지질혈증", "stem": "<div>60살. LDL의 목표 target은?<\/div><div>170cm, 100kg, 혈압 150/90?, current smoker<\/div><div class=\"lab\"><span>TG 210. LDL cholesterol 126, HDL cholesterol 45<\/span><span>fasting glucose 189 HbA1c 9%<\/span><\/div><div>당뇨합병증 검사<\/div><div>non-proliferative retinopathy<\/div><div class=\"lab\"><span>urine albumin creatinine ratio 156<\/span><\/div>", "o": ["70이하", "100이하", "130이하", "160이하", "190이하"], "a": 0, "A": "①", "E": "당뇨병 + 표적장기손상(비증식성 망막병증, 알부민뇨 ACR 156) + 흡연·고혈압 → LDL 목표 <70 mg/dL(필요 시 <55 선택적 고려). 표적장기손상·위험인자 없는 유병 10년 미만 당뇨병만 <100.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "2021 복원 답 ②(100 이하)와 다름 — 2026년 강의 기준 ①", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "22-10", "keys": ["22-10"], "ch": 6, "g": "이상지질혈증", "stem": "<div>24세 남자가 건강검진상 이상소견으로 내원하였다. 검사결과는 아래와 같으며 안면사진 상 아래와 같은 소견이다. 의심되는 유전자 이상은?<\/div><div>Triglyceride 160 mg/dL, LDL cholesterol 340 mg/dL, HDL cholesterol 40 mg/dL<\/div>", "o": ["LDLR", "APOE", "APOC2", "APOA5", "LIPC"], "a": 0, "A": "①", "E": "LDL 340 + 황색판종 → 가족성 고콜레스테롤혈증 → LDLR 변이가 가장 흔함(그 외 APOB, PCSK9). APOC2·LPL은 고중성지방혈증.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": ["figs/22-10.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "23-37", "keys": ["23-37"], "ch": 6, "g": "이상지질혈증", "stem": "<div>24세 남자가 건강검진 상 이상소견으로 내원하였다. 검사 결과는 아래와 같으며 안면 사진상 아래와 같은 소견이다. 의심되는 유전자 이상이 아닌 것은?<\/div><div class=\"lab\"><span>Triglyceride 160mg/dl LDL cholesterol 340mg/dl HDL cholesterol 40mg/dl<\/span><\/div>", "o": ["LDLR", "APOB", "LPL", "PCSK9"], "a": 2, "A": "③", "E": "FH 원인 유전자: LDLR, APOB, PCSK9. LPL 결핍은 가족성 chylomicronemia(고TG).", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": ["figs/23-37.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "25-22", "keys": ["25-22"], "ch": 6, "g": "이상지질혈증", "stem": "<div>다음 중 가족성 고콜레스테롤혈증(Familial hypercholesterolemia)의 진단 및 임상적 특징으로 가장 적절한 것은?<\/div>", "o": ["Autosomal recessive", "Lipoprotein lipase deficiency", "Tendon xanthoma", "Hepatosplenomegaly", "Apolipoprotein C-II deficiency"], "a": 2, "A": "③", "E": "FH는 상염색체 '우성', 힘줄 황색종(tendon xanthoma)·황색판종이 특징. LPL/apoC-II 결핍·간비종대는 가족성 chylomicronemia 증후군.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "20-19", "keys": ["20-19"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>1개월 신생아의 갑상샘 기능검사 결과이다. 원인은?<\/div><div class=\"lab\"><span>t3 120ng/dL (n: 105~245)<\/span><span>t4 4ug/dL (n: 8.2~17)<\/span><span>free t4 0.5ng/dL (n: 0.8~2.1)<\/span><span>TSH 1.2mlU/L (n: 0.5~6.5)<\/span><\/div>", "o": ["갑상샘 저형성", "뇌하수체저하증", "갑상샘호르몬 합성 장애", "모체의 항갑상샘제 복용", "티록신 결합 글로불린(TBG) 결핍"], "a": 1, "A": "②", "E": "T4·fT4 감소인데 TSH 정상(부적절하게 낮음) → 중추성(뇌하수체저하증). 원발성이면 TSH↑, TBG 결핍이면 fT4 정상.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "21-35", "keys": ["21-35"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>생후 3주 신생아의 갑상샘 기능 검사 결과이다. 진단은?<\/div><div class=\"lab\"><span>T4: 3 μg/dL (참고치, 8.2-17)<\/span><span>유리 T4: 1.4 ng/dL (참고치, 0.8-2.0)<\/span><span>TSH: 2.5 μU/mL (참고치, 0.5-6.5)<\/span><span>T3-섭취율 검사: 70% (참고치, 25-35%)<\/span><\/div>", "o": ["TBG 결핍", "갑상샘 무형성", "뇌하수체기능저하증", "갑상샘호르몬 합성장애", "보상성 원발 갑상샘저하증"], "a": 0, "A": "①", "E": "Total T4↓, fT4·TSH 정상, T3 resin uptake↑(70%) → TBG 결핍. 치료 불필요.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-03", "keys": ["25-03"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>생후 3주된 신생아의 갑상샘기능검사이다.<\/div><div class=\"lab\"><span>T4 : 3 ng/dL (N; 8.2~17)<\/span><span>TSH : 2.5 uU/mL (N; 0.5~6.5)<\/span><span>T3 resin uptake : 65% (N; 25~35)<\/span><\/div><div>진단은?<\/div>", "o": ["갑상샘 무형성", "중추성 갑상샘 기능저하증", "갑상샘호르몬 합성장애", "보상성 원발 갑상샘기능저하증", "티록신결합글로불린 저하증"], "a": 4, "A": "⑤", "E": "T4↓ + TSH 정상 + T3RU 65%(↑) → TBG 결핍(저하증). 중추성이면 T3RU 감소, 원발성이면 TSH↑.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "22-28", "keys": ["22-28"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>생후 10일 신생아가 출생 후 시행한 선천대사이상 검사에서 갑상선호르몬의 감소가 있어 병원에 왔다. 검사 결과이다. 질환에 대한 설명으로 맞는 것은?<\/div><div class=\"lab\"><span>Total T4: 4 ug/dL (참고치, 8.2-17)<\/span><span>Free T4: 1.6 ng/dL (참고치, 0.8-2.0)<\/span><span>TSH: 3.0 uU/mL (참고치, 0.5-6.5)<\/span><span>TBG: 0.2 mg/dL (참고치, 0.6-5.0)<\/span><\/div>", "o": ["여아에서 많다.", "치료가 필요 없다.", "T3 resin uptake가 감소한다.", "치료가 늦어지면 지능 저하가 초래된다.", "엄마의 TSH 수용체 억제 항체의 태반 이행으로 발생한다."], "a": 1, "A": "②", "E": "Total T4↓, fT4·TSH 정상, TBG↓ → TBG 결핍: 실제 갑상선 기능은 정상이므로 치료가 필요 없는 유일한 '저하증'. X연관으로 남아에 많고 T3RU는 증가.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "23-07", "keys": ["23-07"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>생후 1주 신생아가 출생 후 시행한 선별검사에서 이상이 있어 병원에 왔다. 혈액 검사 결과와 갑상샘 스캔 검사이다. 원인은? T4 3.0 (6.1-14.9), T3 105 ng/dL (100-260), 유리 T4 0.5 ng/dL (0.9-2.6), TSH 80 mIU/L (1.7-9.1)<\/div>", "o": ["갑상샘염", "요오드 결핍", "딴곳 갑상샘", "뇌하수체저하증", "갑상샘호르몬 합성장애"], "a": 2, "A": "③", "E": "fT4↓, TSH 80 + 스캔에서 설하부 섭취 → 딴곳(이소성) 갑상샘에 의한 선천 갑상샘저하증(발생장애가 가장 흔한 원인).", "B": "강의 06 소아내분비질환 I", "N": "", "img": ["figs/23-07.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "25-04", "keys": ["25-04"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>4세 남아가 신생아 선별 검사에서 선천 갑상샘저하증으로 진단되어 레보티록신을 복용하고 있다. 선천 갑상샘저하증의 원인을 알아보기 위해 1개월 간 레보티록신 복용을 중단하고 갑상샘 스캔 검사를 시행하였다. 선천 갑상샘저하증의 원인은?<\/div>", "o": ["딴곳 갑상샘", "갑상샘 무형성", "중추성 갑상샘저하증", "갑상샘 호르몬 합성 장애", "티록신결합글로불린 부족"], "a": 0, "A": "①", "E": "LT4 중단 후 스캔에서 정상 위치가 아닌 곳(혀뿌리 등)에 섭취 → 딴곳 갑상샘. 이 경우 영구적이라 평생 치료.", "B": "강의 06 소아내분비질환 I", "N": "", "img": ["figs/25-04.jpg"], "v": false, "y": [2025], "ok": true}, {"id": "22-30", "keys": ["22-30"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>출생 후 선천 갑상선저하증의 확실한 원인에 대해 알지 못하고 갑상선호르몬을 투약하고 있는 환아에서 갑상선호르몬 투약을 중지하고 재평가를 시행할 수 있는 나이는?<\/div>", "o": ["생후 6개월", "생후 12개월", "생후 24개월", "생후 36개월", "생후 48개월"], "a": 3, "A": "④", "E": "원인이 불명확(정상 위치 갑상샘)한 선천 갑상샘저하증은 뇌 발달이 끝나는 만 3세(36개월)에 약을 중단하고 재평가.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "23-08", "keys": ["23-08"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>출생 후 선천 갑상샘저하증으로 진단받고 레보티록신을 복용하고 있는 36개월 남아가 갑상샘 기능의 재평가를 위해 1달 동안 레보티록신을 중단한 후 갑상샘 기능 검사를 시행하였다. 유리 T4 0.78 ng/dL (0.8-2.0), TSH 15 mIU/L (0.6-6.3). 치료는?<\/div>", "o": ["경과관찰", "메티마졸", "루골용액", "레보티록신", "갑상샘제거"], "a": 3, "A": "④", "E": "3세 재평가에서 LT4 중단 후 TSH 15(>10) → 영구적 저하증 → 레보티록신 지속.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "21-20", "keys": ["21-20"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>생후 2주 남아가 신생아 선별 검사에서 T4: 3 μg/dL (참고치, 8.2-17)으로 나와 대학병원으로 전원되었다. 갑상샘 기능 검사를 다시 시행한 결과, 유리 T4: 0.2 ng/dL (참고치, 0.8-2.1), T3: 75 ng/dL (참고치, 90-260), TSH 100 μU/mL (참고치, 0.5-6.5)이었다. 가장 흔한 원인은?<\/div>", "o": ["TBG 결핍", "갑상샘 무형성", "아이오딘 결핍", "갑상샘호르몬 합성 장애", "보상성 원발 갑상샘저하증"], "a": 1, "A": "②", "E": "fT4↓, TSH 100 → 원발성 선천 갑상샘저하증. 가장 흔한 원인은 갑상샘 발생장애(이소성 > 무형성) → 선지 중 갑상샘 무형성. TBG 결핍은 fT4·TSH 정상, 보상성은 T4 정상.", "B": "강의 06 소아내분비질환 I", "N": "선지에 '딴곳 갑상샘'이 없음", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "21-40", "keys": ["21-40"], "ch": 7, "g": "선천 갑상샘저하증·TBG 결핍", "stem": "<div>10세 여아가 목이 부어서 병원에 왔다. 키는 5백분위, 체중은 25백분위이다. 키는 6개월간 2cm정도 컸다. 갑상선이 대칭으로 커져있고 열감이나 압통은 없었다. 검사 결과이다. 치료는?<\/div><div class=\"lab\"><span>유리T4 1.0<\/span><span>TSH 20<\/span><span>항갑상샘과산화효소항체 양성, 항갑상선글로불린항체 양성<\/span><\/div>", "o": ["경과관찰", "루골용액", "레포티록신", "메티마졸", "갑상선제거"], "a": 2, "A": "③", "E": "10세 여아, 대칭성 갑상샘종, 키 성장 저하(6개월 2cm), fT4 1.0·TSH 20, TPO·Tg 항체 양성 → 하시모토 갑상샘염에 의한 갑상샘저하증 + 성장 저하 → 레보티록신.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "22-31", "keys": ["22-31"], "ch": 7, "g": "저신장 감별", "stem": "<div>10세 남아가 키가 작다는 소견으로 병원을 찾아왔다. 현재 키는 114cm(3백분위수미만)이고 몸무게는 26kg(10백분위수)이였다. 임신 38주에 48cm로 태어났으며, 1년 전 키는 111.5cm이었다. 골연령이 7세이고, 아버지와 어머니의 키가 각각 170cm ,150cm이였다. 가장 의심이 되는 진단은?<\/div>", "o": ["가족 저신장", "갑상샘저하증", "골격형성장애", "Noonan 증후군", "체질성 성장지연"], "a": 1, "A": "②", "E": "성장속도 2.5 cm/년(감소) + 골연령 지연(7세/10세) → 2차 성장장애. 체질성 지연은 성장속도가 정상이어야 하므로 배제 → 갑상샘저하증.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "22-32", "keys": ["22-32"], "ch": 7, "g": "저신장 감별", "stem": "<div>6세 여아가 키가 작아 병원에 왔다. 키는 103cm(3백분위 미만), 몸무게는 15kg(3백분위 미만)이었다. 아버지는 163cm, 어머니는 155cm 이었다. 골연령은 6세였다. 진단은?<\/div>", "o": ["영양결핍", "가족 저신장", "쿠싱 증후군", "갑상샘저하증", "체질성 성장지연"], "a": 1, "A": "②", "E": "부모 키가 작고 골연령 = 역연령 → 가족성 저신장(1차). 영양결핍·쿠싱·갑상샘저하증은 골연령 지연.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-22", "keys": ["20-22"], "ch": 7, "g": "저신장 감별", "stem": "<div>13세 남아가 키가 작아 병원에 왔다. 키는 144cm(3백분위수), 체중은 37kg(5백분위수)이었다. 양측 고환은 3cc, 음모는 성성숙도 1단계였다. 출생체중 3.4kg, 키는 50cm이었다. 부모의 키는 각각 175cm, 162cm이었다. 1년 전 키는 138cm, 뼈나이는 11세이었다. 진단은?<\/div>", "o": ["체질성 성장지연", "선천 부신 과다형성", "뇌하수체 저하증", "가족성 저신장", "진성 성조숙증"], "a": 0, "A": "①", "E": "13세, 사춘기 미발현(고환 3cc), 골연령 11세로 지연, 성장속도 6cm/년 정상, 부모 키 정상 → 체질성 성장지연.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "20-23", "keys": ["20-23", "21-30"], "ch": 7, "g": "저신장 감별", "stem": "<div>10세 남자가 키가 작아 병원에 왔다. 키는 123cm(3백분위수), 체중 26kg(25백분위수)이었다. 출생시 만삭으로 체중 3.2kg, 키 50cm로 출생하였다. 부모의 키는 아빠 163cm, 엄마 150cm이었다. 뼈나이는 10세, 지난 1년 동안 5cm 성장하였다. 성장호르몬 자극 검사 결과 GH peak 13ng/dL이었다. 진단은?<\/div>", "o": ["가족 저신장", "성장호르몬결핍증", "선천 부신 과다형성", "체질 성장지연", "Noonan 증후군"], "a": 0, "A": "①", "E": "부모 키 작음 + 골연령=역연령 + 성장속도 정상(5cm/년) + GH 자극검사 정상(13) → 가족 저신장.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2020, 2021], "ok": true}, {"id": "21-19", "keys": ["21-19"], "ch": 7, "g": "저신장 감별", "stem": "<div>12세 남아가 키가 작아 병원에 왔다. 키는 137 cm (3백분위수 미만), 체중은 39 kg (5백분위수)이었다. 양측 고환은 8 CC, 음모는 성성숙도 2단계이었다. 출생체중 3.4 kg, 키는 47 cm이었다. 부모의 키는 각각 165cm, 150cm이었다. 1년 전 키는 132 cm, 골연령은 12세이었다. 진단은?<\/div>", "o": ["가족 저신장", "진성성조숙증", "체질성 성장지연", "성장호르몬 결핍증", "선천부신과다형성"], "a": 0, "A": "①", "E": "성장속도 5cm/년 정상, 정상 시기의 사춘기 발달, 골연령=역연령, 부모 키 작음 → 가족 저신장.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-07", "keys": ["25-07"], "ch": 7, "g": "저신장 감별", "stem": "<div>13세 여아가 키가 작아 병원에 왔다. 130cm이며 2년 전에 유방 발육이 나타났고 한달 전에 초경이 있었다. 작년에 비해 7cm 성장했다. 아빠 160cm, 엄마 150cm이다. 골연령은 13세이다. 진단은?<\/div>", "o": ["가족 저신장", "진성 성조숙증", "체질성 성장지연", "뇌하수체 저하증", "선천성 부신피질 과형성증"], "a": 0, "A": "①", "E": "골연령=역연령(13세), 정상 시기 사춘기(11세 유방발육, 13세 초경), 성장속도 정상, 부모 키 작음 → 가족 저신장.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-06", "keys": ["23-06"], "ch": 7, "g": "저신장 감별", "stem": "<div>12세 남아가 키가 크지 않아서 병원에 왔다. 현재 키는 137cm로 뼈 나이는 10세이며, 작년에는 132cm라고 한다. 아버지의 키는 167cm, 어머니 키는 153cm이며 원인을 알아보기 위해 혈액검사를 진행했다. TSH 3.5 (0.5-5.0), 오후 3시 cortisol 8 μg/dL (정상), IGF-1 13 ng/mL (감소). 원인을 알기 위해 필요한 추가 검사는?<\/div>", "o": ["골밀도 검사", "수분제한 검사", "24시간 urine cortisol 측정", "아르기닌, 인슐린 투여 검사", "TRH 투여 검사"], "a": 3, "A": "④", "E": "골연령 지연 + IGF-1 감소(TSH·cortisol 정상) → 성장호르몬 결핍 의심 → 확진은 약물(인슐린, 아르기닌, 클로니딘, L-dopa 등) 2가지로 GH 자극검사(최고치 <10 ng/mL면 결핍).", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-05", "keys": ["25-05"], "ch": 7, "g": "저신장 감별", "stem": "<div>13세 남아가 성장장애를 주소로 내원했다. 키가 123cm (3백분위수 미만)이다. 음모는 정상 발달했다. 고환은 3cc/3cc이다. 아버지의 키는 170cm , 어머니의 키는 155cm 이다. 상절대 하절비가 1.0이다. 골연령은 7세이다. 인슐린 아르기닌 성장호르몬 촉진 검사에서 GH peak 4.5/2.3dl 였다. 진단은?<\/div>", "o": ["가족 저신장", "갑상샘 저하증", "연골 무형성증", "체질성 성장지연", "성장 호르몬 결핍"], "a": 4, "A": "⑤", "E": "골연령 6년 지연 + 상·하절비 1.0(정상 비율) + GH 자극검사 최고치 4.5/2.3(<10) → 성장호르몬 결핍증. 갑상샘저하증·연골무형성증은 상절비 증가.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "20-20", "keys": ["20-20"], "ch": 7, "g": "저신장 감별", "stem": "<div>12세 여자가 키가 작아서 병원에 왔다. 키는 126cm(3백분위수 이하), 체중은 31kg(10백분위수)이었다. 지난 1년 동안 2cm 성장하였다. 유방발육은 성성숙도 1단계였다. 인슐린 주사 후 성장호르몬 최고치 3.5ng/dL, free T4 1.4ng/dL, TSH 3.0mlU/L이었다. 치료는?<\/div>", "o": ["경과관찰", "갑상샘호르몬 복용", "비타민D와 칼슘 복용", "성장호르몬 주사", "일리자로프 수술"], "a": 3, "A": "④", "E": "성장속도 2cm/년, 인슐린 자극 후 GH 최고치 3.5(<10), 갑상선 기능 정상 → 성장호르몬 결핍 → 성장호르몬 주사.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "23-09", "keys": ["23-09"], "ch": 7, "g": "저신장 감별", "stem": "<div>10세 여아가 키가 안 큰다며 내원하였다. 키는 124cm, 23kg이었으며 임신 40주에 2750g으로 출생하였다. 아버지는 170cm, 어머니는 155cm였다. 혈중 호르몬: TSH 1, IGF 208, LH 24.8, FSH 48.6, 염색체 45,X/46,XX, 골연령 10세. 옳은 치료법은?<\/div>", "o": ["성장호르몬 치료", "경과관찰", "성호르몬 치료", "레보티록신", "칼슘, 비타민D 경구투여"], "a": 0, "A": "①", "E": "염색체 45,X/46,XX 모자이크 + LH·FSH 상승(난소 기능 부전) → 터너 증후군 → 1차 치료는 성장호르몬, 이후 적절한 골연령에 성호르몬 보충.", "B": "강의 06 소아내분비질환 I", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "20-21", "keys": ["20-21"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>5세 여아가 가슴에 덩이가 만져져서 병원에 왔다. 유방은 성성숙도 2단계였고, 지난 1년동안 4.5cm 성장하였다. 뼈나이는 5세였다. 호르몬 검사 결과이다. 진단은?<\/div><div class=\"lab\"><span>LH 0.03 IU/L (0.02~0.08 IU/L)<\/span><span>FSH 2 IU/L (0.26~3.0 IU/L)<\/span><span>estradiol 0.5 ng/dL (0.5~2.0ng/dL)<\/span><\/div>", "o": ["난소낭", "성조숙증", "부신 종양", "유방 조기 발육증", "에스트로겐 과다 투약"], "a": 3, "A": "④", "E": "유방 2단계, 성장속도·골연령 정상, LH·estradiol 사춘기 전 수준 → 유방 조기 발육증(premature thelarche), 경과관찰.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "25-09", "keys": ["25-09"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>6세 여아가 가슴에 덩이가 만져져서 병원에 왔다. 키는 25백분위수, 유방은 성성숙도 2단계였고 음모는 보이지 않았다. 지난 1년 동안 5cm 성장하였다. 뼈나이는 6세였다. 호르몬 검사 결과이다. 진단은?<\/div><div class=\"lab\"><span>LH 0.06 IU/L (0.02~0.08 IU/L)<\/span><span>FSH 0.12 IU/L (0.26~3.0 IU/L)<\/span><span>estradiol 0.6 ng/dL (0.5~2.0ng/dL)<\/span><\/div>", "o": ["난소낭", "진성 성조숙증", "부신종양", "유방 조기 발육증", "에스트로겐 과다 투약"], "a": 3, "A": "④", "E": "6세 유방 2단계지만 성장속도 5cm/년·골연령 6세 정상, LH·estradiol 사춘기 전 수준 → 유방 조기 발육증.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "22-29", "keys": ["22-29"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>2세 여아가 양쪽 가슴에 멍울이 만져져서 병원에 왔다. 키 50백분위수, 체중 25백분위수였다. 성성숙도는 유방 2단계, 음모 1단계이다. 황체형성호르몬과 에스라디올 농도는 정상이었고, 난포자극호르몬만 약간 상승하였다. 초음파 검사에서 난소 크기는 정상이었고 골연령은 2세였다. 치료는?<\/div>", "o": ["관찰", "갑상선호르몬", "브로모크립틴", "아로마타제 차단제", "생식샘자극호르몬방출호르몬 작용제"], "a": 0, "A": "①", "E": "2세 양측 유방 멍울, LH·E2 정상, FSH만 약간↑, 골연령·난소 정상 → 유방 조기 발육증 → 관찰.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "22-33", "keys": ["22-33"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>6세 여아가 가슴에 덩이가 만져져서 병원에 왔다. 임신나이 40주, 출생체중 3,400g으로 태어났다. 현재 키는 128cm (97백분위수), 몸무게 30kg (97백분위수)이었다. 유방의 성성숙도는 3단계이었고, 음모는 없었다. 골연령은 9세였다. 생식샘자극호르몬방출호르몬 자극 검사 결과이다. 진단은?<\/div>", "o": ["난소난종", "유방 조기 발육증", "여성화 부신 종양", "중추성 성 조숙증", "Macune-Albright 증후군"], "a": 3, "A": "④", "E": "키 97백분위, 골연령 3년 앞섬, 유방 3단계, GnRH 자극에 LH 사춘기 반응 → 중추성(진성) 성조숙증.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": ["figs/22-33.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "21-24", "keys": ["21-24"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>5세 남아가 음경이 커지고 음모가 나서 병원에 왔다. 키는 124cm (&gt;97백분위수), 고환 용적은 4 mL/5 mL이었다.<\/div><div>생식샘자극호르몬분비호르몬 자극 후<\/div><div class=\"lab\"><span>LH peak 16.2 IU/L (참고치, 0.02-0.18 IU/L)<\/span><span>FSH peak 11 IU/L (참고치, 0.26-3.0 IU/L)<\/span><span>Testosterone 14.6 ng/dL (참고치,〈10 ng/dL)<\/span><span>갑상샘자극호르몬 3.5 μIU/L (참고치, 0.5∼4.5)<\/span><span>DHEA-S 210 ng/dL (참고치, 91∼376)<\/span><\/div><div>치료는?<\/div>", "o": ["경과관찰", "갑상샘호르몬", "브로모크립틴", "하이드로코르티손", "생식샘자극호르몬분비호르몬 작용제"], "a": 4, "A": "⑤", "E": "남아 5세, 고환 4~5mL로 커짐 + GnRH 자극 LH peak 16.2 → 중추성 성조숙증 → GnRH 작용제(지속 투여로 수용체 탈감작).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-08", "keys": ["25-08"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>8. 7세 여아가 이른 유방 발달로 병원에 내원했다. 키는 130cm(97백분위수) 이고, 골연령은 10세이고 유방발달 단계는 3단계였다.<\/div><div class=\"lab\"><span>LH peak 16.2 IU/L (참고치 : 0.02-0.18 IU/L)<\/span><span>FSH peak 11 IU/L (참고치 : 0.26-3.0 IU/L)<\/span><span>Estradiol 14.6 ng/dL (N; 0.5 –2.0 ng/dL)<\/span><\/div><div>이 때, 치료는?<\/div>", "o": ["경과관찰", "갑상선호르몬", "하이드로코르티손", "아로마타제 억제제", "생식샘호르몬분비호르몬 작용제"], "a": 4, "A": "⑤", "E": "7세 여아, 골연령 10세, 유방 3단계, LH peak 16.2 → 중추성 성조숙증 → GnRH agonist(antagonist 아님).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "20-24", "keys": ["20-24"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>8세 남아가 음모가 나서 병원에 왔다. 키는 125cm(50백분위수), 골연령 8세, 고환 2cc, 음모 성성숙도 2단계였다. 진단은?<\/div><div class=\"lab\"><span>LH peak 0.05IU/L (0.02-0.18)<\/span><span>FSH peak 1.8 IU/L (0.26-3.0)<\/span><span>testosterone 0.6ng/dL (&lt;10)<\/span><span>DHEA-S 110ug/dL (13-115)<\/span><span>17-OH-progesterone 35ng/dl (3-90)<\/span><\/div>", "o": ["뇌하수체저하증", "음모조기발생증", "선천 부신 과다형성", "진성 성조숙증", "클라인펠터 증후군"], "a": 1, "A": "②", "E": "음모만 발달(고환 2cc 사춘기 전), 골연령·성장 정상, LH·testosterone 사춘기 전, DHEA-S·17-OHP 정상 → 음모 조기 발생증(premature adrenarche).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "20-25", "keys": ["20-25"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>12세 남아가 1달 전부터 시작된 한쪽 유방 발달로 병원에 왔다. 키는 148cm(50백분위수), 체중은 46kg(50백분위수)이었다. 진찰에서 한쪽 유륜 밑으로 직경이 2~3cm 정도의 종물이 만져졌다. 고환 크기는 양쪽 6cc였으며 음모는 없었다. 골연령은 12세 6개월이었다. GnRH 자극 검사에서 peak LH/FSH는 각각 5.2/11.1mIU/mL이었다. 다음으로 시행해야 하는 것은?<\/div>", "o": ["경과 관찰", "염색체 검사", "유방 초음파 검사", "뇌자기공명영상 검사", "생식샘자극호르몬방출호르몬 작용제 투여"], "a": 3, "A": "④", "E": "남아에서 LH peak 5 이상의 진성 성조숙 소견 → 남아는 기질적 원인(종양) 비율이 높아 뇌 MRI를 먼저 시행.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "22-34", "keys": ["22-34"], "ch": 7, "g": "사춘기 질환 (성조숙증·유방조기발육·사춘기 지연)", "stem": "<div>17세 남아가 사춘기 신체 발달이 없다고 병원에 왔다. 는가 또래보다 컸으며 상하지가 길었다. 고환 크기는 양쪽이 각각3cc이었고 음모는 없었다. 환아는 냄새를 구별하지 못한다고하였다. 혈중황체호르몬 농도는 0.2mIU/ml(정상치, 0.4-7.0), 난포자극호르몬 농도는 0.8mIU/ml(정상치, 2.6-11.0)이었다. 진단은?<\/div>", "o": ["갑상샘저하증", "Kallman 증후군", "성장호르몬결핍증", "Klinefelter 증후군", "Prader-willi 증후군"], "a": 1, "A": "②", "E": "사춘기 미발현 + 낮은 LH·FSH(저생식샘자극호르몬) + 후각 소실 → Kallmann 증후군. Klinefelter는 고생식샘자극호르몬.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-26", "keys": ["20-26"], "ch": 7, "g": "선천 부신 과다형성 (CAH)", "stem": "<div>3개월 된 영아가 구토와 탈수로 병원에 왔다. 피부와 잇몸이 검게 착색되어 있었고, 음핵은 커져 있어 성기가 불분명하였다. 혈액검사에서 나트륨 125mEq/L, 칼륨 6.5mEq/L, 염색체 검사 결과 46, XX이었다. 진단은?<\/div>", "o": ["당뇨병", "요붕증", "쿠싱증훙군", "갑상샘저하증", "선천 부신 과다형성"], "a": 4, "A": "⑤", "E": "46,XX 여아의 외성기 모호(음핵비대) + 색소침착 + 저Na·고K 염류소실 → 21-수산화효소 결핍 CAH.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "22-35", "keys": ["22-35"], "ch": 7, "g": "선천 부신 과다형성 (CAH)", "stem": "<div>생후 3주된 신생아가 토하고 먹지 못해서 병원에 왔다. 3일전부터 열이 있으면서 잠만 자려고 하였다. 앞숫구멍은 함몰되어 있었고 소변량은 많이 줄었다고 하나. 피부와 잇몸은 검게 착색되어 있었다.  혈액검사에서 나트륨 125mEq/L, 칼륨 6.5mEq/L이었다. 진단을 위해 시행해야할 검사는?<\/div>", "o": ["소변검사", "뇌척수액검사", "혈액배양검사", "17-하이드록시프로게스테론", "뇌 자기공명영상 촬영"], "a": 3, "A": "④", "E": "신생아 구토·탈수 + 색소침착 + 저Na·고K → 염류소실형 CAH 의심 → 17-hydroxyprogesterone 측정.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "25-06", "keys": ["25-06"], "ch": 7, "g": "선천 부신 과다형성 (CAH)", "stem": "<div>생후 3개월된 신생아가 토하고 먹지 못하여 병원에 왔다. 3일 전부터 열은 지속되었으며, 앞숫구멍은 함몰되어있고 소변량은 감소되어있다. 피부와 잇몸이 검게 착색되어있으며, 음핵의 크기가 커져 성기가 불분명하다. 나트륨은 125mEq/L, 칼륨은 6.5mEq/L이다. 염색체는 46/XX이다. 치료는?<\/div>", "o": ["인슐린", "이뇨제", "글루카곤", "갑상샘호르몬", "하이드로코티손"], "a": 4, "A": "⑤", "E": "염류소실형 CAH(외성기 모호 46,XX, 저Na·고K) → 하이드로코티손(필요 시 fludrocortisone·수액).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-41", "keys": ["21-41"], "ch": 7, "g": "선천 부신 과다형성 (CAH)", "stem": "<div>8세 남아가 음모가 나서 병원에 왔다. 키는 137cm(97백분위수), 몸무게 35kg(95백분위수), 양측 고환 2cc, 음모 성성숙도는 3단계였다. 진단은?<\/div><div class=\"lab\"><span>골연령 10세<\/span><\/div><div>GnRH 자극 후 LH, testosterone 정상<\/div><div class=\"lab\"><span>유리 T4, TSH 정상<\/span><span>17-히드록시프로게스테론 상승<\/span><\/div>", "o": ["뇌하수체저하증", "음모조기발생증", "선천 부신 과다형성", "진성 성조숙증", "클라인펠터 증후군"], "a": 2, "A": "③", "E": "8세 남아 음모 3단계 + 키 97백분위·골연령 앞섬, 고환은 2cc로 사춘기 전, GnRH 자극 LH 정상(중추성 아님), 17-OHP 상승 → 비고전형 선천 부신 과다형성.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "2020-24와 선지는 같지만 증례·정답이 달라 분리", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "25-10-1", "keys": ["25-10-1"], "ch": 7, "g": "소아 저혈당·제1형 당뇨병", "stem": "<div>3세 남아가 경련으로 응급실에 왔다. 아이는 전날 유아원에서 돌아온 뒤 6시에 잠에 들어 저녁식사를 하지 못했다고 한다. 키 93cm(25백분위수), 몸무게 12kg(10백분위수)이었고 간과 지라(spleen)는 만져지지 않았다. 혈중 암모니아는 25mcg/dL(19~60mcg/dL), 혈당 43mg/dL이었다. 진단은?<\/div>", "o": ["당원 축적병", "섬세포 샘종", "유기산 혈증", "쿠싱 증후군", "케톤성 저혈당증"], "a": 4, "A": "⑤", "E": "18개월~5세 마른 아이 + 장시간 금식(저녁 거름) 후 새벽 경련 + 저혈당, 간비종대 없음, 암모니아 정상 → 케톤성 저혈당증(가장 흔한 소아 저혈당 원인).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "25-10-2", "keys": ["25-10-2"], "ch": 7, "g": "소아 저혈당·제1형 당뇨병", "stem": "<div>64세 남자가 경련으로 응급실을 찾아왔다. 저녁밥을 먹지않고 일을 했다고 한다. 간이나 비장은 커지지 않았고 혈당은 26mg/dl였으며 소변에 케톤이 검출되었다. 진단은?<\/div>", "o": ["당원병", "췌장 소도세포 선종", "1형 당뇨병증", "쿠싱증후군", "케톤 저혈당증"], "a": 4, "A": "⑤", "E": "저혈당 + 소변 케톤 양성 → 인슐린 과다(인슐린종·외인성 인슐린)는 케톤을 억제하므로 ② 제외, 간비대 없음 → 당원병 ① 제외, 쿠싱은 고혈당 → ④ 제외. 금식 후 케톤 동반 저혈당 = 케톤 저혈당증(주로 소아).", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "2025 복원해설에서 '시험장에서 본 기억이 없는 문항'으로 표시된 10번의 다른 복원본 — 참고용", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-10", "keys": ["23-10"], "ch": 7, "g": "소아 저혈당·제1형 당뇨병", "stem": "<div>9세 남아가 저녁을 먹지 않고 잠들었다가 수면 중 경련으로 내원하였다. 92cm에 12kg이었고, 혈당은 20 mg/dL이었다. 원인 질환의 기전은?<\/div>", "o": ["혈중 알라닌 증가", "혈중 인슐린 감소", "혈중 코티솔 감소", "혈중 글루카곤 감소", "혈중 성장호르몬 감소"], "a": 1, "A": "②", "E": "케톤성 저혈당증은 특정 효소·길항호르몬 결핍이 없고, 혈장 알라닌 '감소'(당신생 기질 부족)와 저혈당에 맞는 인슐린 저하(5~10 μU/mL)·케톤 증가가 특징. 저혈당에서 코티솔·글루카곤·GH는 오히려 증가하므로 ③④⑤ ×, 알라닌은 감소이므로 ① × → ②.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "복원 답 ③(코티솔 감소)은 강의 내용과 모순 → ②. 원 선지는 '알라닌 감소'였을 가능성(복원 불완전)", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "23-05", "keys": ["23-05"], "ch": 7, "g": "소아 저혈당·제1형 당뇨병", "stem": "<div>6세 남아가 1개월 전부터 물을 많이 마시고 소변을 자주 본다고 내원했다. 체중이 2kg 정도 빠졌고 소변검사 결과 포도당 3+, ketone 2+였다. 1형 당뇨병을 시사할 수 있는 소견은?<\/div>", "o": ["GAD 항체 (-)", "흑색가시세포종", "항갑상샘 항체 양성", "HLA DR3/DR4 (+)", "혈중 C-peptide 증가"], "a": 3, "A": "④", "E": "HLA DR3/DR4는 제1형 당뇨 위험 유전형. 1형에서는 GAD 항체 양성, C-peptide 감소이며 흑색가시세포증은 인슐린 저항성(2형) 소견.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "21-46", "keys": ["21-46"], "ch": 7, "g": "소아 저혈당·제1형 당뇨병", "stem": "<div>3세 남아가 경련으로 병원에 왔다. 아이는 전날 유아원에서 돌아온 후 6시 정도에 잠이들어 저녁식사를 하지 않았다고 한다. 체중은 12kg(10백분위수), 키 93cm(25백분위수)이었다. 간과 지라(spleen)은 만져지지 않았다. 혈당은 25mg/dL, 혈액과 소변에서 케톤이 검출되었다. 진단은?<\/div>", "o": ["당원축적병", "케톤 저혈당증", "유기산 혈증", "섬세포 샘종", "쿠싱 증후군"], "a": 1, "A": "②", "E": "3세, 마른 편, 저녁을 거르고 장시간 금식 → 경련, 혈당 25, 혈액·소변 케톤 양성, 간비대 없음 → 케톤성 저혈당증.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "2025-10-1과 선지 순서·내용이 달라 분리", "img": [], "v": false, "y": [2021], "ok": true}, {"id": "20-41", "keys": ["20-41"], "ch": 8, "g": "진단·콩팥 생검 적응증", "stem": "<div>42세 남자가 2주 전부터 피로감이 발생하여 병원에 왔다. 검사는?<\/div><div>혈액 : 혈중요소질소 19mg/dL, 크레아티닌 1.2mg/dL, 혈당 382mg/dL, 혈색소 14.5 g/dL, 알부민 3.8g/dL<\/div><div class=\"lab\"><span>소변 : 백혈구 0-1/고배율시야, 잠혈(-), 적혈구 0-1/고배율시야, 요단백 2+, 1회 단백/크레아티닌 비 1.9<\/span><\/div>", "o": ["안저검사", "당화혈색소", "콩팥 생검", "콩팥 초음파", "24시간 소변 단백 정량"], "a": 3, "A": "④", "E": "당뇨병성 콩팥병 진단 근거 중 하나가 신장 크기 '증가' → 콩팥 초음파로 크기 확인(혈뇨·RBC cast 없음). 생검 적응증(혈뇨, 망막병증 없음, 신장 크기 감소, 급격한 악화)이 없음.", "B": "강의 09 당뇨병성 콩팥병", "N": "2021·2025 혈뇨 문항과 선지는 같지만 증례·정답이 달라 분리", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "25-15", "keys": ["25-15", "21-28"], "ch": 8, "g": "진단·콩팥 생검 적응증", "stem": "<div>50세 남자가 2일 전부터 육안적 혈뇨가 발생하여 병원에 왔다. 3년 전에 당뇨병 진단받고 내분비대사 내과에서 투약 중이다. 혈압은 140/90mmHg이다. 검사 결과는 다음과 같다. 추가로 해야 할 검사는?<\/div><div class=\"lab\"><span>혈액 : 혈중요소질소 21mg/dL, 크레아티닌 1.4mg/dL, 혈당 382mg/dL, 혈색소 14.5g/dL,<\/span><span>알부민 4.1g/dL<\/span><span>소변 : 백혈구 0-1/고배율시야, 잠혈 (4+), 적혈구 다수/고배율시야, 요단백 +/-,<\/span><span>적혈구원주 (+), 1회 단백/크레아티닌 비 1.9<\/span><\/div>", "o": ["안저검사", "당화혈색소", "콩팥생검", "콩팥초음파", "24시간 소변 단백 정량"], "a": 2, "A": "③", "E": "육안적 혈뇨 + 적혈구 원주 + 당뇨 3년(10년 미만) → 사구체신염 등 다른 원인 의심 → 콩팥 생검.", "B": "강의 09 당뇨병성 콩팥병", "N": "연도별 차이: 나이만 다름(2021 42세, 2025 50세), 선지·정답 동일", "img": [], "v": false, "y": [2021, 2025], "ok": true}, {"id": "22-36", "keys": ["22-36"], "ch": 8, "g": "진단·콩팥 생검 적응증", "stem": "<div>45세 여자가 2주 전부터 발생한 하지부종으로 내원하였다. 2년 전부터 당뇨병으로 진단받고 메트포르민 치료중이었다. 다음으로 진행해야하는 검사는?<\/div>", "o": ["콩팥 스캔", "콩팥 생검", "신동맥 조영술", "복부 전산화단층촬영", "기립, 앙아우 소변 단백 정량"], "a": 1, "A": "②", "E": "당뇨 2년(짧음) + 단백뇨 급증 + 현미경적 혈뇨 → 비전형적 → 콩팥 생검.", "B": "강의 09 당뇨병성 콩팥병", "N": "", "img": ["figs/22-36.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "23-49", "keys": ["23-49"], "ch": 8, "g": "진단·콩팥 생검 적응증", "stem": "<div>44세 여자가 1주 전부터 다리부종이 발생하여 병원에 왔다. 5년 전부터 당뇨병으로 메트포르민을 복용중이다. 혈압 125/70 mmHg이다. 혈액: 혈색소 9.6 g/dL, 혈청 크레아티닌 0.52 mg/dL / 소변: 백혈구 0-1/HPF, 포도당 2+, 잠혈 +, 적혈구 1-4/HPF, 요단백 4+, 24시간 단백 1800 mg/day. 콩팥 기능 악화 예측을 위해 외래 추적이 필요한 검사는?<\/div>", "o": ["당화혈색소", "혈청 알부민", "저밀도 콜레스테롤", "소변 단백-크레아티닌 비", "소변 KIM-1/크레아티닌 비"], "a": 3, "A": "④", "E": "콩팥 기능 악화 예측·추적에는 단백뇨(알부민뇨) 정량이 핵심 → 1회 소변 단백(알부민)/크레아티닌 비로 외래 추적.", "B": "강의 09 당뇨병성 콩팥병", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-16", "keys": ["25-16"], "ch": 8, "g": "치료", "stem": "<div>60세 남자가 1개월 전부터 소변에 거품이 나와서 병원에 찾아왔다. 15년 전 당뇨병으로 진단받았으며 글리메피라이드와 메트포르민을 복용 중이다. 탈수나 부종은 관찰되지 않는다. 혈압 135/85mmHg, 체온 36.5, 호흡수 18회/분, 맥박수 68회/분이다. 검사결과가 다음과 같을 때 올바른 처치는?<\/div><div class=\"lab\"><span>혈액: 혈색소 14.2g/dL, 나트륨/칼륨 140/4.4mEg/L,<\/span><span>총 이산화탄소 22mEq/L, 칼슘/인 9.5/4.2mg/dL,<\/span><span>혈중 요소질소 14mg/dL, 크레아티닌 0.8mg/dL, 당화혈색소 5.7%,<\/span><span>사구체여과 88mL/min<\/span><span>소변: 단백2+, 단백/크레아티닌 비 1.5<\/span><\/div>", "o": ["메트포르민 중지", "중탄산염 추가", "탄산칼슘 추가", "푸로세미드 추가", "로살탄 추가"], "a": 4, "A": "⑤", "E": "당뇨병성 콩팥병 + 단백뇨(UPCR 1.5)인데 RAS 차단제 미사용 → ARB(로살탄) 또는 ACEi가 1차. 혈압이 정상 범위여도 단백뇨 감소 목적으로 사용.", "B": "강의 09 당뇨병성 콩팥병", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "22-37", "keys": ["22-37"], "ch": 8, "g": "치료", "stem": "<div>70세 남자가 소변에 거품이 있어 병원에 왔다. 10년전 당뇨병을 진단받았다. 현재 메트포리민, DPP4 억제제, 티아지드, 니페디핀을 복용중이다. 혈압 130/89 mmHg, 맥박 60회/분, 호흡수 18회/분 체온 36.5도이다. 검사결과는 다음과 같다 처치는?<\/div><div>혈액: 혈색소 12.5 g/dl, Na/K 140/4.4 mEq/L , 총Co2 22mEq/L, 칼슘/인 9.2/3.5 mg/dL, 혈청 크레아티닌 1.2 mg/dL, 사구체 여과율 61 ml/min, 소변: 단백2 2+, 1회 단백/크레아티닌 비 0.9<\/div>", "o": ["중탄산염 추가", "레니프릴 추가", "니페디핀 중단", "메트포르민 중단", "티아지드를 푸로세미드로 변경"], "a": 1, "A": "②", "E": "단백뇨 있는 당뇨병성 콩팥병인데 RAS 차단제 없이 thiazide·CCB만 복용 → ACEi(레니프릴) 추가.", "B": "강의 09 당뇨병성 콩팥병", "N": "", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-42", "keys": ["20-42"], "ch": 8, "g": "치료", "stem": "<div>70세 남자가 1일 전부터 전신부종이 발생하여 병원에 왔다. 20년 전 당뇨병을 진단받았다. 현재 레니프릴, 티아지드, 니페디핀을 복용중이다. 혈압 130/80 mmHg, 맥박 68회/분, 호흡수 18회/분, 체온 36.5도였다. 혈액: 혈색소 11.5 g/dL, Na/K 140/5.4 mEq/L, 총CO2 22 mEq/L, Ca/P 9.5/4.5 mg/dL, 크레아티닌 3.0 mg/dL, eGFR 21 mL/min / 소변: 단백 2+, 1회 단백/크레아티닌 비 2.4. 처치는?<\/div>", "o": ["중탄산염을 추가한다.", "탄산칼슘을 추가한다.", "니페디핀을 추가한다.", "레니프릴을 로살탄으로 변경한다.", "티아지드를 푸로세미드로 변경한다."], "a": 4, "A": "⑤", "E": "eGFR 21(CKD 4)에서는 thiazide의 이뇨 효과가 떨어지므로 loop 이뇨제(furosemide)로 변경 [2025], "ok": true}, {"id": "20-07", "keys": ["20-07"], "ch": 9, "g": "역학·한국인 당뇨병 특징", "stem": "<div>다음은 당뇨병의 자연경과에 대한 그림이다. 그림 2에서 1에 해당하는 것으로 바른 설명은?<\/div><div class=\"lab\"><span>1<\/span><\/div>", "o": ["주로 췌장에서의 장애로 고혈당에 대한 분비능의 감소가 원인이다.", "약 20% 정도 일부의 제2형 당뇨병 환자에서 관찰되는 현상이다.", "제 2형 당뇨병의 강력한 지표로 심혈관질환의 발생과도 관련이 있다.", "진단 전부터 기능이 감소하여 진단시 이미 50% 정도의 기능 상실을 보인다.", "제 2형 당뇨병 진단시 혈중농도의 절대값이 매우 감소되어 있는 것이 특징이다."], "a": 2, "A": "③", "E": "그림의 1(인슐린 저항성): 2형 당뇨의 강력한 예측인자이자 심혈관질환의 독립 위험인자. ①④는 β세포 기능, ⑤는 인슐린 농도에 대한 설명.", "B": "강의 11 당뇨병의 진단", "N": "", "img": ["figs/20-07.jpg"], "v": false, "y": [2020], "ok": true}, {"id": "23-24", "keys": ["23-24"], "ch": 9, "g": "역학·한국인 당뇨병 특징", "stem": "<div>다음은 당뇨병의 자연경과에 대한 그림이다. 본 그림에서 1에 해당하는 것으로 올바른 설명은?<\/div>", "o": ["간, 근육과 같은 말초에서의 장애로 고혈당에 대한 분비능의 증가가 원인이다.", "인슐린 저항성은 심혈관 질환의 발생에 독립적인 위험인자이다.", "약 20% 정도 일부의 제2형 당뇨병 환자에서 관찰되는 현상이다.", "진단 전부터 기능이 감소하여 진단시 이미 50% 정도의 기능 상실을 보인다.", "진단시 혈중농도의 절댓값이 매우 증가되어 있는 것이 특징이다."], "a": 1, "A": "②", "E": "1 = 인슐린 저항성 → 심혈관질환 독립 위험인자(②). 약 80%에서 관찰되며, 진단 시 50% 기능 상실은 β세포 기능에 대한 설명.", "B": "강의 11 당뇨병의 진단", "N": "", "img": ["figs/23-24.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "22-49", "keys": ["22-49"], "ch": 9, "g": "역학·한국인 당뇨병 특징", "stem": "<div>다음은 당뇨병의 자연경과에 대한 그림이다. 본 그림에서 3에 해당하는 것으로 올바른 설명은?<\/div>", "o": ["주로 말초에서의 장애로 고혈당에 대한 분비능의 증가가 원인이다.", "약 20% 정도 일부의 제2형 당뇨병 환자에서 관찰되는 현상이다.", "비만한 환자에서 특히 증가되어 있으며 체중감소시 호전될 가능성이 높다.", "진단 전부터 감소하여 진단시 최대 50%까지 소실상태를 보인다.", "진단시 혈중농도의 절대값이 매우 증가되어 있는 것이 특징이다."], "a": 3, "A": "④", "E": "3 = β세포 기능: 진단 전부터 감소하여 진단 시 이미 약 50% 소실.", "B": "강의 11 당뇨병의 진단", "N": "", "img": ["figs/22-49.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "20-04", "keys": ["20-04"], "ch": 9, "g": "선별검사·진단·임신성 당뇨", "stem": "<div>52세 여자 환자가 고혈당을 주소로 내원하였다. 환자는 특별한 이상증상은 없었으나 최근 건강검진상 공복혈당이 123mg/dL로 측정되었다고 한다. 내원하여 시행한 공복혈당은 121mg/dL, 당화혈색소는 6.3%로 측정되었다. 본 환자에서 알맞은 조치는?<\/div>", "o": ["다른날 공복혈당 재측정", "75g 경구당부하검사 시행", "생활습관개선요법", "메트포르민 투약과 함께 생활습관개선요법", "1년 후 재검사 권고"], "a": 1, "A": "②", "E": "공복혈당 121(공복혈당장애 100~125), HbA1c 6.3%(5.7~6.4) → 당뇨 진단 기준 미충족 상태의 고위험군 → 75g 경구당부하검사로 당뇨 여부 확인.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "22-47", "keys": ["22-47", "21-05"], "ch": 9, "g": "선별검사·진단·임신성 당뇨", "stem": "<div>다음은 당뇨병의 선별검사와 진단에 대한 내용이다. 옳은 것은?<\/div>", "o": ["당뇨병 선별검사는 모든 30세 이상 성인에서 매년 시행한다.", "공복혈당이 120mg/dL이면 당뇨병전단계로 진단하고 추가적인 검사는 필요없다.", "공복혈당이 108mg/dL, 체질량지수 32kg/m2이라면 경구당부하검사를 추가적으로 시행한다.", "임신성당뇨병으로 진단받았던 환자는 출산 후 거의 정상혈당으로 돌아오므로 출산 후에는 검사가 필요 없다.", "다음, 다뇨 등 전형적인 당뇨병의 증상이 있으면서 무작위혈당이 230mg/dL인 경우 경구당부하검사를 시행한다."], "a": 2, "A": "③", "E": "공복혈당장애(100~125)이면서 비만(BMI≥25) 등 위험인자 → OGTT 시행. 선별은 35세 이상 매년(위험인자 있으면 19세 이상), 전형적 증상 + 무작위 혈당 ≥200이면 바로 진단, GDM 병력자는 출산 4~12주 후 OGTT.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": true}, {"id": "23-21", "keys": ["23-21"], "ch": 9, "g": "선별검사·진단·임신성 당뇨", "stem": "<div>다음은 당뇨병의 선별검사와 진단에 대한 내용이다. 옳은 것은?<\/div>", "o": ["당뇨병의 선별검사는 35세 이상 성인에서 2년에 한번 반드시 시행한다.", "당뇨병의 선별검사는 식후혈장포도당, 당화혈색소 또는 경구포도당 내성경사로 시행한다.", "공복혈당이 108mg/dl, 체질량지수 21kg/m2이라면 경구포도당내성검사를 추가적으로 시행한다.", "직계가족에 당뇨병이 있거나 임신당뇨병의 병력, 고혈압 등이 있는 경우 19세 이상 성인에서 부터 시행한다.", "다음, 다뇨 등 전형적인 당뇨병의 증상이 없더라도 무작위혈당이 250mg/dL 이상인 경우 경구당부하검사를 시행한다."], "a": 3, "A": "④", "E": "위험인자(가족력, 임신성 당뇨 병력, 고혈압 등)가 있으면 19세 이상부터 매년 선별. 선별은 공복혈당·HbA1c·OGTT로 하며, 전형적 증상 + 무작위 ≥200이면 즉시 진단.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "23-22", "keys": ["23-22"], "ch": 9, "g": "선별검사·진단·임신성 당뇨", "stem": "<div>16주 임산부 50g 당부하 1시간후 당 164, 공복혈당 97, 100g 당부하 혈당 (1시간후 214, 2시간후 174, 3시간 후 136) 다음 중 맞는 것을 고르시오.<\/div>", "o": ["임신성 당뇨 진단가능하다", "임신성당뇨 진단 불가하다", "당화혈색소 추가검사 필요하다", "증상 x시 검사, 치료 필요 없다", "출산 4~12주후 경구포도당부하 검사 필요하다"], "a": 0, "A": "①", "E": "2단계법: 50g 1시간 ≥140(164) 양성 → 100g OGTT에서 기준(공복 95, 1h 180, 2h 155, 3h 140) 중 2개 이상 충족(1h 214, 2h 174) → 임신성 당뇨 진단.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "20-10", "keys": ["20-10"], "ch": 9, "g": "조절 목표·생활습관·관리", "stem": "<div>다음은 당뇨병환자의 생활습관 개선에 대한 내용이다. 옳은 것을 고르시오.<\/div>", "o": ["제1형 당뇨병과 제2형 당뇨병은 병인이 달라 주된 내용을 다르게 구성한다.", "제1형 당뇨병의 식사요법은 주로 체중을 감소시키는 것에 목표를 둔다.", "당뇨병 환자의 운동시 날마다 하는 것보다는 한번 시행시 장시간의 운동을 하는 거이 도움이 된다.", "운동 전 혈당이 100mg/dl 미만인 경우 탄수화물을 섭취한 후 운동을 시행하도록 한다.", "혈당이 250mg/dl을 넘는 경우 평소보다 운동시간을 좀 더 놀여 시행하도록 한다."], "a": 3, "A": "④", "E": "운동 전 혈당 <100이면 탄수화물 섭취 후 운동. 운동은 매일 규칙적으로, 혈당 >250(케톤) 시 운동 자제, 1형 식사요법 목표는 체중감량이 아님.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "23-26", "keys": ["23-26"], "ch": 9, "g": "조절 목표·생활습관·관리", "stem": "<div>다음은 당뇨병의 조절 목표 및 관리에 대한 내용이다. 옳은 것은?<\/div>", "o": ["당화혈색소는 매년 1회 검사를 시행하도록 한다", "1형 당뇨병의 일반적인 혈당조절 목표는 당화혈색소 6% 미만이다.", "2형 당뇨병의 일반적인 혈당조절 목표는 당화혈색소7.5% 미만 이다.", "연속혈당측정기를 사용하는 경우 목표혈당범위내 시간이 70% 를 초과하도록 한다.", "혈당조절의 목표는 절대적으로 모든 환자에서 동일하게 권장하며 위험도에 따른 개별화는 필요없다\""], "a": 3, "A": "④", "E": "CGM 사용 시 목표범위내시간(TIR, 70~180) >70%. HbA1c는 연 2~4회, 목표는 2형 <6.5%(대한당뇨병학회)/일반 <7%, 1형 <7%, 개별화 필요.", "B": "강의 11 당뇨병의 진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-47", "keys": ["25-47"], "ch": 9, "g": "조절 목표·생활습관·관리", "stem": "<div>당뇨병의 조절 목표 및 관리에 대한 내용으로 옳은것은?<\/div>", "o": ["2형 당뇨병의 일반적인 성인 혈당조절 목표는 당화혈색소 7%미만이다.", "1형 당뇨병의 일반적인 성인 혈당조절 목표는 당화혈색소 6.5%미만이다.", "연속혈당측정기를 사용하는 경우 목표혈당범위내 시간이 70%를 초과하도록 한다.", "당화혈색소는 2~4주간의 혈당정도를 반영하므로 약제선택에 참고한다.", "노인의 경우 일반적으로 당화혈색소 6.5%미만으로 하고 특성에 따라 개별화"], "a": 2, "A": "③", "E": "TIR >70%가 교수님 강조 포인트. HbA1c는 2~3개월 혈당을 반영(④×), 노인은 덜 엄격한 목표(⑤×).", "B": "강의 11 당뇨병의 진단", "N": "①(2형 목표는 대한당뇨병학회 기준 <6.5%), ②(1형은 <7%)는 틀림", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "21-07", "keys": ["21-07", "20-06"], "ch": 9, "g": "조절 목표·생활습관·관리", "stem": "<div>43세 남자 환자가 건강검진을 위해 내원하였다. 환자는 1년 전부터 당뇨병으로 진단받고 약물요법을 시행중이었으며 메트포르민 1000mg을 하루 1회 투여중이었다. 평소 운동을 하루 1시간 시행하며 별다른 이상 증후는 없었다고 한다. 내원시 검사결과는 다음과 같다. 본 환자에서 추가할 치료는?<\/div><div>키 : 172cm, 몸무게 : 72kg, 체질량지수 :  {"id": "22-21", "keys": ["22-21"], "ch": 9, "g": "저혈당", "stem": "<div>74세 여자가 점심 식사 후 자다가 깨지 않아 응급실에 실려왔다. 혈액 검사 후 포도당 주입으로 의식이 돌아왔다. 당뇨병으로 진단받고 3년 전부터 경구약물복용중이나 최근 공복에 어지럽고 식은땀이 많이 발생하였다고 한다. 검사 결과는 다음과 같다. 본 환자에서 옳은 설명은?<\/div><div class=\"lab\"><span>혈액 : 혈색소 10.1g/dL, 백혈구 8,200/mm3, 혈소판 210,000/mm3<\/span><span>아스파르테이트아미노전달효소 42 U/L<\/span><span>알라닌아미노전달효소 43 U/L<\/span><span>포도당 30mg/dL, C-펩티드 4.3 ng/mL (참고치 0.8~3.5)<\/span><span>당화혈색소 6.1%, 인슐린 82 μU/mL (참고치 2~20)<\/span><span>혈액요소질소 35mg/dL, 크레아티닌 1.9mg/dL<\/span><span>Na+/K+/Cl- 138/4.7/101 meq/L<\/span><span>항인슐린항체 3.5% (참고치 &lt;7)<\/span><span>소변 : 포도당(2+) 단백질(2+) 케톤(-)<\/span><\/div>", "o": ["경구약제를 인슐린으로 변경하여 치료하는 것이 증상 예방에 도움이 된다.", "스테로이드 면역요법을 시행한다.", "신장기능의 악화로 혈당강하제는 모두 중단한다.", "상기 증상이 반복된다면 추후 2~3주간 혈당을 평소보다 높게 유지하는 것이 좋다.", "혈당이 잘 조절되므로 추가적인 조치는 필요 없다."], "a": 3, "A": "④", "E": "C-peptide·인슐린 모두 상승 + 크레아티닌 1.9 → 신기능 저하로 설폰요소제가 축적된 내인성 고인슐린성 저혈당(약제는 설폰요소제 중단·변경이 필요하지만 '모두' 중단할 필요는 없음). 반복되는 저혈당(무감지 저혈당)이 있으면 2~3주간 저혈당을 철저히 피하며 혈당을 평소보다 다소 높게 유지해 저혈당 인지를 회복시킵니다. 신기능 저하만으로 모든 혈당강하제를 끊지는 않습니다.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "2022 복원 답 ③(혈당강하제 모두 중단)과 다름 — 강의 기준 판단 ④", "img": [], "v": false, "y": [2022], "ok": true}, {"id": "20-14", "keys": ["20-14"], "ch": 9, "g": "저혈당", "stem": "<div>54세 남자 환자가 원인을 알 수 없는 의식저하를 주소로 내원하였다. 환자는 평소 건강하게 지내오던 중 3개월전부터 간헐적으로 심한공복감, 손덜림, 오한 등이 발생하였으며 이 때 음식이나 당분을 섭취하면 호전되었다고 한다. 최근 증상이 더욱 심해지고 아침 공복시에도 이러한 증상이 반복되어 내원하였다. 입원하여 혈당이 50mg/dL이고 같은 증상이 발생하였을 때 체크한 검사 결과이다. 본 환자에서 다음으로 시행할 검사는?<\/div><div>키 173cm, 몸무게 68kg, 체질량지수 22.6kg/m2, 허리둘레 88cm, 혈압 : 132/80mmHg, 맥박 : 76회/분, 호흡수 : 20회/분, AST/ALT : 31/35 IU/L, BUN/Cr : 19/1.0mg/dL, 혈당 : 52mg/dL, 인슐린 : 18uU/ml, C-peptide : 6.4mmol/L, proinsulin 12.4 pmol/L, 당화혈색소 : 4.3%<\/div>", "o": ["75g 경구당부하검사", "밤사이 덱사메타손억제검사", "복합뇌하수체자극검사", "복부컴퓨터단층촬영", "뇌자기공명영상검사"], "a": 3, "A": "④", "E": "공복 저혈당(52) + 인슐린 18·C-peptide·proinsulin 상승 → 내인성 고인슐린혈증(인슐린종) → 위치 확인을 위해 복부 CT.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "25-52", "keys": ["25-52"], "ch": 9, "g": "저혈당", "stem": "<div>54세 여자환자가 의식저하를 주소로 내원하였다. 수개월 전부터 저혈당 증상(손떨림, 현기증)이 나타났지만 그때마다 음식을 먹는 것으로 호전되는 양상을 보였다. 내원 당일 점심을 거르고 집안일을 하던 도중 의식저하, 사물을 분간하지 못하는 증상을 보여 병원에 왔다. 내원 당시 혈당은 46으로 측정되었다. 당뇨병이나 약물복용의 기왕력은 없었다. 다음 환자에서 가장 먼저 시행할 수 있는 검사로 옳은것은?<\/div>", "o": ["경구당부하검사", "혈중 인슐린, c-peptide 검사", "72시간 fasting test", "급속부신겉질자극검사", "복부컴퓨터단층촬영"], "a": 1, "A": "②", "E": "당뇨·약물력 없는 사람의 공복 저혈당(46) → 저혈당 상태에서 혈중 인슐린·C-peptide(필요시 proinsulin, β-hydroxybutyrate, 설폰요소제 선별)를 먼저 측정해 내인성 고인슐린혈증 여부 확인. 72시간 금식검사는 자발 저혈당이 잡히지 않을 때, CT는 생화학적 확진 뒤 위치 확인.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "25-53", "keys": ["25-53"], "ch": 9, "g": "저혈당", "stem": "<div>48세 여자 환자 저혈당으로 응급실. 당뇨병 치료 위해 최근에 약물 추가. 잦은 아침 공복 저혈당 호소. 식사하지 않고 운동중 의식 잃고 이송. 혈당 29mg/dL 응급실 처치 후 의식 되찾음. 옳지 않은 것?<\/div>", "o": ["의식이 있는데 혈당이 70 미만일시 15-20g의 포도당을 경구 섭취", "추가된 약물은 설폰요소제일 가능성이 높음", "저혈당이 반복되면 연속혈당측정기 사용 권고", "급성으로 가장 효과가 빠른 식품은 초콜릿이다.", "저혈당무감지증 치료를 위해 수 주~수 개월간 저혈당이 발생하지 않도록 한다"], "a": 3, "A": "④", "E": "초콜릿은 지방 때문에 흡수가 느려 급성 저혈당 교정에 부적합 → 포도당 정제·주스·사탕(15~20g). 설폰요소제는 공복 저혈당을 흔히 일으키고, 반복되면 CGM 권고, 저혈당 무감지증은 수 주 이상 저혈당을 철저히 피해 인지 회복.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "25-01", "keys": ["25-01"], "ch": 10, "g": "방사성요오드 치료 전처치", "stem": "<div>Radioactive Therapy 전처치 기간 동안 지켜야 할 것으로 옳은 것은?<\/div>", "o": ["levothyroxin을 계속 복용한다", "저요오드 식이는 필요 없다", "TSH 상승을 위해 갑상선호르몬 중단 또는 rhTSH를 투여한다", "조영제를 이용한 CT를 직전에 시행하는 게 좋다", "항갑상선제를 치료 직전까지 복용한다"], "a": 2, "A": "③", "E": "RAI 전 TSH ≥30으로 상승: 갑상선호르몬 중단 또는 rhTSH(타이로젠). 저요오드 식이 1~2주 필요, 조영 CT는 요오드 배출에 약 8주 걸리므로 직전 시행 금지.", "B": "강의 14 갑상선질환의 핵의학검사와 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "23-04", "keys": ["23-04"], "ch": 10, "g": "방사성요오드 치료 전처치", "stem": "<div>갑상선 유두암종으로 전절제술을 시행한 환자이다. 앞으로 저용량 방사성 요오드 치료가 계획되었다. 전처치 기간동안 지켜야 할 것으로 옳은 것은?<\/div>", "o": ["라
