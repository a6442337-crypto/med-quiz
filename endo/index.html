, "keys": ["25-17", "21-17"], "ch": 12, "g": "갑상선 종양의 기원과 분자병리", "stem": "<div>다음 갑상샘의 종양 중 발생 기원세포가 다른 종양은?<\/div>", "o": ["Anaplastic carcinoma", "Follicular adenoma", "Follicular carcinoma", "Medullary carcinoma", "Papillary carcinoma"], "a": 3, "A": "④", "E": "Medullary carcinoma만 parafollicular(C) cell 기원. (anaplastic·follicular adenoma/carcinoma·papillary는 follicular cell)", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": [], "v": false, "y": [2021, 2025], "ok": true}, {"id": "23-16", "keys": ["23-16"], "ch": 12, "g": "갑상선 종양의 기원과 분자병리", "stem": "<div>사진의 조직학적 소견이 보이는 갑상선 종양의 가장 흔한 원인 유전자로 옳은 것은?<\/div>", "o": ["RAS", "RET", "PIK1", "BRAF", "PAH"], "a": 3, "A": "④", "E": "유두암종 → BRAF(V600E) 변이가 가장 흔함. 소포성 종양은 RAS, 수질암은 RET.", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": ["figs/23-16.jpg"], "v": false, "y": [2023], "ok": true}, {"id": "25-18", "keys": ["25-18"], "ch": 12, "g": "갑상선 종양의 기원과 분자병리", "stem": "<div>54세 여자 환자가 건강검진 중 갑상샘에 덩이가 관찰되어 세침흡인검사를 시행하고 갑상선절제술을 시행하였다. 사진 A-C는 세침흡인검사 및 수술 검체의 조직학적 소견이다. 다음 종양에서 가장 많이 관찰되는 이상 유전자는?<\/div>", "o": ["BRAF", "EGFR", "RAS", "TERT", "TP53"], "a": 0, "A": "①", "E": "핵내 inclusion + papillae → 유두암종 → BRAF. TERT·TP53은 역형성/저분화로 진행할 때의 late event.", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": ["figs/25-18.jpg"], "v": false, "y": [2025], "ok": true}, {"id": "22-22", "keys": ["22-22", "23-15"], "ch": 12, "g": "갑상선 유두암 형태·수술 검체", "stem": "<div>32세 여자가 갑상선암으로 갑상선 전절제술을 받은 후 양쪽 손발이 저리면서 자주 경련이 발생한다고 한다. 사진은 적출된 갑상선의 현미경적 소견이다. 상기 증상의 원인으로 가장 적절한 것은?<\/div>", "o": ["parathyroid resection", "laryngeal nerve injury", "lymph node metastasis", "lymphovascular invasion", "incomplete resection margin"], "a": 0, "A": "①", "E": "전절제 검체에 부갑상선이 함께 절제됨 → PTH 결핍 → 저칼슘혈증(손발 저림·경련).", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": ["figs/22-22.jpg"], "v": false, "y": [2022, 2023], "ok": true}, {"id": "22-23", "keys": ["22-23"], "ch": 12, "g": "갑상선 유두암 형태·수술 검체", "stem": "<div>사진의 조직학적 소견을 보이는 갑상선 종양에 대한 설명으로 옳은 것은?<\/div>", "o": ["대부분 잘 발달된 피막이 관찰된다.", "갑상선 암 중 석회화가 가장 흔하다.", "단일경부림프절 전이가 예후에 중요하다.", "목부위 통증과 함께 다수의 결절로 나타난다.", "심한 림프구의 침윤과 Hurthle cell 들이 관찰된다."], "a": 1, "A": "②", "E": "Psammoma body(동심원 석회화)는 유두암의 특징 → 갑상선암 중 석회화가 가장 흔함. 피막은 대개 없고, 림프절 전이는 예후에 큰 영향이 적으며, Hurthle cell·림프구 침윤은 하시모토.", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": ["figs/22-23.jpg"], "v": false, "y": [2022], "ok": true}, {"id": "21-18", "keys": ["21-18"], "ch": 12, "g": "갑상선 유두암 형태·수술 검체", "stem": "<div>다음 갑상선 암의 특징으로 옳은 것은?<\/div>", "o": ["피막이 제대로 형성되어 있다.", "갑상선암 중 석회화가 가장 흔하다.", "목 부위에 통증이 있고 다발결절이 흔하다.", "단일경부림프절 전이가 예후에 중요하다.", "Hurthle cell의 출현과 심한 림프구의 침윤이 보인다."], "a": 1, "A": "②", "E": "22년 문항과 같은 개념: 석회화(psammoma body)가 가장 흔한 갑상선암 = 유두암. ③ 통증·다발결절, ⑤ Hurthle cell은 갑상선염 소견.", "B": "강의 17 내분비계 병리 조직학", "N": "2022 문항과 선지 표현이 달라 분리", "img": ["figs/22-23.jpg"], "v": false, "y": [2021], "ok": true}, {"id": "20-50", "keys": ["20-50"], "ch": 12, "g": "갑상선 유두암 형태·수술 검체", "stem": "<div>Graves&#x27; disease에 대한 설명이다. 맞는 것의 조합을 고르시오.<\/div><div>a) Hurthle cell의 출현과 심한 림프구의 침윤<\/div><div>b) 내부원인에 의한 고갑상선혈증의 가장 흔한 원인질환<\/div><div>c) hyperplasia and hypertrophy of follicular epithelial cells<\/div><div>d) auto-antibodies against thyroglobulin, thyroid peroxidase<\/div><div>e) thyroid 자가항원에 대한 self-tolerance breakdown으로 발생하는 자가면역질환<\/div>", "o": ["a,b,c", "a,c,e", "b,c,d", "b,c,e", "c,d,e"], "a": 3, "A": "④", "E": "Graves: 내인성 갑상선항진증의 가장 흔한 원인(b), 소포상피의 미만성 비대·과형성(c), 자가 관용 붕괴로 생기는 자가면역질환(e). Hurthle cell·Tg/TPO 항체(a, d)는 하시모토.", "B": "강의 17 내분비계 병리 조직학", "N": "", "img": [], "v": false, "y": [2020], "ok": true}, {"id": "23-51", "keys": ["23-51"], "ch": 13, "g": "분류와 증상", "stem": "<div>45세 남자. 4개월 전 건강검진에서 당화혈색소 11%로 당뇨병 진단. 진단 시부터 인슐린 포함 치료 시작, 1개월 전부터 인슐린 중단하고 경구 혈당강하제만 사용 중. 최근 당화혈색소 7%. 3주 전부터 복부부터 양측 무릎까지 극심한 통증이 하루 종일 지속되며 특히 밤에 심해져 잠을 못 잔다. 의심되는 질환은?<\/div>", "o": ["diabetic amyotrophy", "diabetic radiculopathy", "diabetic autonomic neuropathy", "diabetic sensori-motor polyneuropathy", "treatment induced neuropathy of diabetes"], "a": 4, "A": "⑤", "E": "HbA1c 11% → 7%로 빠르게 조절된 뒤 수주 내 생긴 극심한 통증(밤에 악화) → 치료 유발 신경병증(TIND, insulin neuritis). 40~50대 남성에서 흔함.", "B": "강의 18 당뇨병성신경병증", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "23-52", "keys": ["23-52"], "ch": 13, "g": "분류와 증상", "stem": "<div>Diabetic neuropathy 증상에 대해 옳은 것은?<\/div>", "o": ["Weight gain", "Wound healing quickly", "Orthostatic hypotension", "Pain that resolves at night", "Can be completely recovered when treated"], "a": 2, "A": "③", "E": "자율신경병증의 심혈관 증상 → 기립성 저혈압. 위마비로 체중 '감소', 상처 회복 지연, 통증은 밤에 '악화', 완전 회복은 어려움.", "B": "강의 18 당뇨병성신경병증", "N": "", "img": [], "v": false, "y": [2023], "ok": true}, {"id": "25-54", "keys": ["25-54"], "ch": 14, "g": "발생 기전과 레이저 치료", "stem": "<div>당뇨망막병증 발생의 기전 중 적절하지 못한 것은?<\/div>", "o": ["모세혈관 내피 세포의 손상", "혈관 주위세포의 소실", "기저막의 비후", "혈관내피세포 성장인자의 억제", "섬유아세포 성장인자의 분비"], "a": 3, "A": "④", "E": "고혈당 → 모세혈관 내피 손상, 혈관주위세포 소실, 기저막 비후 → 허혈 → 혈관내피세포성장인자(VEGF)·섬유아세포성장인자 '분비' 증가로 신생혈관. VEGF '억제'가 틀림.", "B": "강의 19 당뇨병성망막병증", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "25-55", "keys": ["25-55"], "ch": 14, "g": "발생 기전과 레이저 치료", "stem": "<div>다음 중 레이저 치료의 적응증에 해당하지 않는 것은?<\/div>", "o": ["망막부종", "심한 비증식 당뇨망막병증", "초기의 증식 당뇨망막병증", "고위험 증식 당뇨망막병증", "유의한 황반부종"], "a": 0, "A": "①", "E": "레이저(범망막광응고술) 적응증: 심한 비증식, 초기 증식, 고위험 증식 망막병증, 임상적으로 유의한 황반부종. 단순 '망막부종'은 적응증이 아님.", "B": "강의 19 당뇨병성망막병증", "N": "", "img": [], "v": false, "y": [2025], "ok": true}, {"id": "V05", "ch": 2, "base": "22-38", "stem": "<div>75세 하시모토 갑상선염 환자가 레보티록신 150 μg 복용 중이다. 피로 외 증상은 없고 TSH 0.02 mIU/L, fT4 1.9 ng/dL이다. 적절한 조치는?<\/div>", "o": ["현재 용량 유지", "methimazole 추가", "레보티록신 중단 후 방사성요오드 스캔", "propranolol만 추가", "레보티록신 감량"], "a": 4, "E": "하시모토 저하증 노인에서 TSH가 억제됨 = LT4 과량 → 심방세동·골다공증 위험 → 감량.", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "2022년 38번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V06", "ch": 2, "base": "25-33", "stem": "<div>35세 여자. 2주 전 감기 후 목 앞쪽 통증·발열, 심계항진. fT4 상승, TSH 억제, ESR 80, TSH 수용체 항체 음성, 갑상선 스캔 섭취 저하. 치료는?<\/div>", "o": ["NSAID(심하면 스테로이드) + β차단제", "Methimazole", "방사성요오드 치료", "갑상선 전절제", "레보티록신"], "a": 0, "E": "통증 + ESR 상승 + 섭취 저하 → 아급성 갑상선염. 파괴성이라 항갑상선제·RAI는 무효 → 소염제 + 증상 조절 β차단제. (통증·ESR 상승이 없으면 무통성 갑상선염 → β차단제만)", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "2025년 33번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V07", "ch": 2, "base": "21-44", "stem": "<div>Methimazole 복용 중 발열·인후통으로 내원, ANC 200/μL로 무과립구증이 확인되었다. 이후 갑상선항진증 치료로 가장 적절한 것은?<\/div>", "o": ["PTU로 교체", "Methimazole 감량", "레보티록신 단독", "Methimazole 유지", "방사성요오드 치료 또는 수술"], "a": 4, "E": "무과립구증은 두 항갑상선제 간 교차반응이 있어 PTU로 바꾸지 않음 → 항갑상선제 중단 후 RAI 또는 수술로 전환.", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "2021년 44번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V08", "ch": 2, "base": "25-34", "stem": "<div>레보티록신 복용 중 TSH가 상승한 환자에게 교육할 내용으로 옳은 것은?<\/div>", "o": ["철분제와 함께 복용한다", "아침 공복에 물과 함께 복용하고 30~60분 뒤 식사한다", "칼슘제와 함께 복용한다", "위산억제제와 함께 복용하면 흡수가 좋아진다", "우유와 함께 복용한다"], "a": 1, "E": "LT4는 공복·맹물 복용. 철분·칼슘·제산제/PPI·유제품·유산균 등은 흡수를 떨어뜨리므로 4시간 간격.", "B": "강의 04 갑상선염 및 갑상선암", "N": "2025년 34번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V09", "ch": 2, "base": "25-37-1", "stem": "<div>45세 여자. 갑상선 우엽 1.2cm 결절, FNA AUS, BRAF V600E 양성. 초음파상 피막 외 침범과 림프절 전이는 없다. 수술 범위로 적절한 것은?<\/div>", "o": ["우엽 절제(lobectomy)", "경과관찰", "전절제 + 양측 변형근치경부림프절청소술", "방사성요오드 단독", "FNA 반복만"], "a": 0, "E": "편측·4cm 이하·피막 외 침범과 림프절 전이가 없으면 엽절제 가능. 측경부 전이가 있으면 전절제 + 전이된 쪽 청소술.", "B": "강의 04 갑상선염 및 갑상선암 · 강의 16 갑상선, 부갑상선 수술", "N": "2025년 37번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V10", "ch": 2, "base": "25-41", "stem": "<div>갑상선중독성 주기성 마비(TPP)로 하지 마비가 온 환자, K 2.0. 급성기 처치로 가장 중요한 것은?<\/div>", "o": ["다량의 칼륨을 빠르게 정주", "인슐린 + 포도당", "Furosemide", "비선택적 β차단제(propranolol)", "항갑상선제 단독"], "a": 3, "E": "TPP는 K의 세포 내 이동이 원인(총 K는 정상) → propranolol로 이동을 차단. 칼륨은 소량만(과량 시 반동성 고칼륨혈증).", "B": "강의 03 갑상선기능검사 및 기능이상", "N": "2025년 41번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V11", "ch": 3, "base": "25-30", "stem": "<div>48세 남자. 허리둘레 92cm, 중성지방 140, HDL 38, 혈압 128/84, 공복혈당 102. 대사증후군 구성요소 개수와 진단은?<\/div>", "o": ["1개", "2개", "3개, 대사증후군", "4개, 대사증후군", "5개, 대사증후군"], "a": 2, "E": "허리 ≥90(○), TG ≥150(×), HDL <40(○), 혈압 ≥130/85(×), 공복혈당 ≥100(○) → 3개 → 대사증후군.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2025년 30번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V12", "ch": 3, "base": "25-31", "stem": "<div>2형 당뇨병의 병태생리(ominous octet)에 해당하지 '않는' 것은?<\/div>", "o": ["간 포도당 생성 증가", "신장 포도당 재흡수 감소", "지방분해 증가", "글루카곤 분비 증가", "근육 포도당 흡수 감소"], "a": 1, "E": "2형 당뇨병에서는 신장 SGLT2를 통한 포도당 재흡수가 '증가'.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2025년 31번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V13", "ch": 4, "base": "23-47", "stem": "<div>쿠싱증후군이 의심되어 외인성 스테로이드 투여력이 없음을 확인했고, 24시간 소변 코르티솔이 증가했으며 저용량 덱사메타손 억제검사에서도 억제되지 않았다. 다음 단계는?<\/div>", "o": ["즉시 복부 CT", "혈중 ACTH 측정", "Rapid ACTH 자극검사", "부신정맥채혈", "갑상선기능검사"], "a": 1, "E": "쿠싱 확진 후 원인 위치는 ACTH로 구분: ACTH 낮으면 부신(복부 CT), 높거나 정상이면 뇌하수체/이소성.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2023년 47번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V14", "ch": 4, "base": "23-46", "stem": "<div>일차성 알도스테론증으로 진단된 환자에서 부신정맥채혈 결과 양측성(양측 부신 과형성)으로 나왔다. 치료는?<\/div>", "o": ["양측 부신절제술", "편측 부신절제술", "Hydrocortisone", "Spironolactone", "CCB 단독 유지"], "a": 3, "E": "편측성(선종)이면 수술, 양측성 과형성이면 미네랄코르티코이드 수용체 길항제(spironolactone/eplerenone).", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2023년 46번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V15", "ch": 4, "base": "20-35", "stem": "<div>무력감·저혈압·색소침착. Rapid ACTH 자극 후 코르티솔 10 μg/dL, 기저 ACTH 상승, Na 128, K 5.8. 치료는?<\/div>", "o": ["Fludrocortisone 단독", "Dexamethasone 억제검사", "레보티록신 먼저", "경과관찰", "Hydrocortisone(+ fludrocortisone)"], "a": 4, "E": "자극 후 코르티솔 <18 + ACTH 상승 + 저Na·고K → 일차성 부신부전 → 글루코코르티코이드(hydrocortisone) + 미네랄코르티코이드 보충.", "B": "강의 07 대사증후군 및 제2형 당뇨병의 병태생리", "N": "2020년 35번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V16", "ch": 5, "base": "25-11", "stem": "<div>건강검진 CT에서 3cm 부신우연종 발견. 호르몬 검사상 비기능성이고, 지방이 풍부한 양성 소견(HU <10)이다. 처치는?<\/div>", "o": ["즉시 부신절제", "CT 유도하 조직검사", "12개월 간격 추적", "방사선 치료", "Mitotane"], "a": 2, "E": "비기능성 + 양성 영상 + 4cm 미만 → 추적(12개월 간격). 부신 종괴는 생검하지 않음.", "B": "강의 08 부신의 외과적 치료", "N": "2025년 11번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V17", "ch": 5, "base": "23-39", "stem": "<div>우측 부신정맥(Rt. adrenal vein)이 유입되는 곳은?<\/div>", "o": ["우측 신정맥", "좌측 신정맥", "문맥", "하대정맥(IVC)", "하횡격막정맥"], "a": 3, "E": "우측은 IVC로 직접(짧아서 수술 시 주의), 좌측은 좌측 신정맥으로.", "B": "강의 08 부신의 외과적 치료", "N": "2023년 39번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V18", "ch": 6, "base": "23-36", "stem": "<div>조현병으로 risperidone 복용 중인 여자, 무월경·유즙분비, PRL 85 ng/mL, 임신 반응 음성. 다음 조치는?<\/div>", "o": ["가능하면 약제 변경·중단 후 PRL 재검", "즉시 sellar MRI", "Cabergoline 즉시 시작", "경접형동 수술", "방사선 치료"], "a": 0, "E": "PRL 200 미만 + 도파민 길항 약물 → 약제성 먼저 의심(약을 못 바꾸면 MRI로 확인).", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "2023년 36번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V19", "ch": 6, "base": "23-35", "stem": "<div>다뇨 환자의 수분 제한 검사에서 소변 삼투압이 300 미만으로 유지되다가 바소프레신 투여 후 크게 상승했다. 진단과 치료는?<\/div>", "o": ["신성 요붕증 – thiazide", "심인성 다음 – 수분 제한", "SIADH – 수분 제한", "중추성 요붕증 – desmopressin", "고칼슘혈증 – 수액"], "a": 3, "E": "바소프레신에 반응하면 중추성(desmopressin), 반응 없으면 신성(thiazide).", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "2023년 35번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V20", "ch": 6, "base": "23-31", "stem": "<div>Denosumab을 5년간 투여한 골다공증 환자가 투약 중단을 원한다. 적절한 것은?<\/div>", "o": ["Bisphosphonate로 전환", "바로 중단하고 경과관찰", "칼시토닌으로 전환", "비타민 D만 유지", "Drug holiday"], "a": 0, "E": "Denosumab은 중단 시 효과가 빠르게 소실되고 다발성 척추골절 위험 → bisphosphonate로 전환. Drug holiday는 잔존효과가 있는 bisphosphonate에 해당.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "2023년 31번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V21", "ch": 6, "base": "22-10", "stem": "<div>TG 1,200 mg/dL, 반복 췌장염, 발진성 황색종이 있는 어린이. 결핍 가능성이 가장 높은 것은?<\/div>", "o": ["LDL 수용체", "지단백지질분해효소(LPL)", "PCSK9", "APOB", "HMG-CoA 환원효소"], "a": 1, "E": "가족성 chylomicronemia: LPL 또는 apoC-II 결핍 → 고TG·췌장염. LDLR·APOB·PCSK9는 가족성 고콜레스테롤혈증.", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "2022년 10번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V22", "ch": 6, "base": "25-25", "stem": "<div>45세 여자, 무증상 일차성 부갑상선항진증. Ca 10.9, CrCl 85, 24h 소변 Ca 200, 요추 T-score -1.5, 신결석 없음. 처치는?<\/div>", "o": ["경과관찰", "Bisphosphonate", "Cinacalcet", "Thiazide", "부갑상선절제술"], "a": 4, "E": "수술 적응증 중 '50세 미만'에 해당 → 부갑상선절제술.", "B": "강의 05 뇌하수체검사 뇌하수체질환", "N": "2025년 25번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V23", "ch": 6, "base": "21-42", "stem": "<div>MEN2A의 구성 요소가 '아닌' 것은?<\/div>", "o": ["갑상선 수질암", "갈색세포종", "뇌하수체 선종", "부갑상선항진증", "RET 원종양유전자 변이"], "a": 2, "E": "MEN2A = 수질암 + 갈색세포종 + 부갑상선항진증(RET). 뇌하수체 선종은 MEN1(3P: parathyroid, pancreas, pituitary).", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "2021년 42번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V24", "ch": 6, "base": "21-36", "stem": "<div>50세 2형 당뇨병(유병 5년), 표적장기손상과 주요 심혈관 위험인자가 없다. LDL 목표는?<\/div>", "o": ["<55 mg/dL", "<70 mg/dL", "<100 mg/dL", "<130 mg/dL", "<160 mg/dL"], "a": 2, "E": "당뇨병 유병 10년 미만 + 주요 심혈관 위험인자·표적장기손상 없음 → <100. 유병 10년 이상이거나 위험인자 또는 표적장기손상이 있으면 <70(표적장기손상·위험인자 3개 이상이면 <55 선택적 고려).", "B": "강의 15 지질대사, 기타타내분비비질환", "N": "2021년 36번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V25", "ch": 7, "base": "22-28", "stem": "<div>7세 남아, 선별검사에서 total T4 감소. fT4·TSH 정상, T3 resin uptake 증가. 처치는?<\/div>", "o": ["레보티록신 시작", "치료 불필요, 경과관찰", "Methimazole", "TRH 자극검사", "갑상샘 스캔 후 수술"], "a": 1, "E": "TBG 결핍: 실제 갑상샘 기능은 정상 → 치료 불필요.", "B": "강의 06 소아내분비질환 I", "N": "2022년 28번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V26", "ch": 7, "base": "20-22", "stem": "<div>14세 남아. 키 3백분위, 성장속도 5.5cm/년, 골연령 12세, 고환 3cc, 부모 키 정상, 아버지도 사춘기가 늦었다. 진단은?<\/div>", "o": ["가족성 저신장", "성장호르몬 결핍", "갑상샘저하증", "체질성 성장지연", "터너 증후군"], "a": 3, "E": "골연령 지연 + 성장속도 정상 + 사춘기 지연 + 가족력 → 체질성 성장지연(최종 키는 정상 범위).", "B": "강의 06 소아내분비질환 I", "N": "2020년 22번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V27", "ch": 7, "base": "21-24", "stem": "<div>중추성 성조숙증 치료에 쓰는 GnRH 작용제의 작용 기전은?<\/div>", "o": ["GnRH 수용체를 경쟁적으로 차단", "성선에서 성호르몬 합성 효소 억제", "지속 투여로 뇌하수체 GnRH 수용체를 탈감작(하향조절)", "말초 에스트로겐 수용체 차단", "아로마타제 억제"], "a": 2, "E": "박동성 분비와 달리 지속 자극 → 수용체 하향조절 → LH·FSH 감소.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "2021년 24번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V28", "ch": 7, "base": "22-35", "stem": "<div>21-수산화효소 결핍(염류소실형) CAH인 46,XY 남아의 신생아기 특징은?<\/div>", "o": ["외성기 모호", "고혈압", "생후 1~4주에 구토·탈수·저Na·고K", "저칼륨혈증", "17-OHP 감소"], "a": 2, "E": "남아는 외성기가 정상이라 출생 시 놓치기 쉽고, 생후 1~4주에 염류소실 위기로 발견. 17-OHP는 증가.", "B": "강의 10 제1형 당뇨병의 병태생리, 소아내분비질환 II", "N": "2022년 35번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V29", "ch": 7, "base": "25-05", "stem": "<div>성장호르몬 결핍증 진단에 필요한 GH 자극검사 기준은?<\/div>", "o": ["1가지 약물 자극 최고치 <20 ng/mL", "무작위 GH <1 ng/mL", "IGF-1 정상", "공복 GH >10 ng/mL", "2가지 약물 자극 최고치 모두 <10 ng/mL"], "a": 4, "E": "서로 다른 2가지 약물(인슐린·아르기닌·클로니딘·L-dopa 등) 자극 후 최고치가 모두 10 ng/mL 미만.", "B": "강의 06 소아내분비질환 I", "N": "2025년 05번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V30", "ch": 8, "base": "25-15", "stem": "<div>2형 당뇨병 15년, 증식성 망막병증이 있고 알부민뇨가 서서히 증가했다. 혈뇨·RBC cast 없고 신장 크기 정상. 처치는?<\/div>", "o": ["콩팥 생검", "스테로이드", "ACEi/ARB 등 당뇨병성 콩팥병 치료", "혈장교환", "사이클로포스파미드"], "a": 2, "E": "긴 유병기간 + 망막병증 + 서서히 진행 + 혈뇨 없음 → 전형적 당뇨병성 콩팥병 → 생검 불필요.", "B": "강의 09 당뇨병성 콩팥병", "N": "2025년 15번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V31", "ch": 8, "base": "20-42", "stem": "<div>eGFR 25인 당뇨병성 콩팥병 환자, 부종이 심한데 thiazide가 효과가 없다. 바꿀 이뇨제는?<\/div>", "o": ["Spironolactone", "Acetazolamide", "Mannitol", "Amiloride", "Furosemide"], "a": 4, "E": "eGFR <30에서는 thiazide 효과가 떨어짐 → loop 이뇨제(furosemide).", "B": "강의 09 당뇨병성 콩팥병", "N": "2020년 42번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V32", "ch": 9, "base": "22-47", "stem": "<div>무증상 45세, 공복혈당 128 mg/dL이 한 번 측정되었다. 다음 조치는?<\/div>", "o": ["바로 당뇨병 진단 후 메트포르민", "인슐린 시작", "1년 뒤 재검", "다른 날 재검 또는 HbA1c로 확인", "50g 포도당 부하검사"], "a": 3, "E": "증상 없으면 진단기준 수치를 다른 날 재확인(또는 같은 날 다른 검사로 확인)해야 진단.", "B": "강의 11 당뇨병의 진단", "N": "2022년 47번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V33", "ch": 9, "base": "22-45", "stem": "<div>기저인슐린 사용 중 아침 공복혈당이 높은데, 새벽 3시 혈당은 55 mg/dL로 낮다. 조치는?<\/div>", "o": ["기저인슐린 증량", "아침 속효성 인슐린 증량", "설폰요소제 추가", "기저인슐린 감량(Somogyi 현상)", "변화 없음"], "a": 3, "E": "새벽 저혈당 후 반동성 고혈당(Somogyi) → 인슐린 감량. 새벽 3시도 높으면 dawn phenomenon/기저 부족 → 증량.", "B": "강의 12 당뇨병의 치료", "N": "2022년 45번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V34", "ch": 9, "base": "20-08", "stem": "<div>SGLT2 억제제 복용 중 수술 전 금식 후 구토, pH 7.15, 혈당 180 mg/dL, 케톤 양성. 진단은?<\/div>", "o": ["HHS", "정상혈당 DKA", "젖산산증", "저혈당", "알코올성 케톤산증"], "a": 1, "E": "SGLT2 억제제는 혈당이 높지 않은 DKA(euglycemic DKA)를 유발 가능 → 수술·금식 전 중단.", "B": "강의 12 당뇨병의 치료", "N": "2020년 08번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V35", "ch": 9, "base": "20-12", "stem": "<div>DKA 치료 중 혈당이 230 mg/dL로 떨어졌고 음이온 차이는 아직 크다. 조치는?<\/div>", "o": ["포도당 수액을 추가하고 인슐린 정주 지속", "인슐린 중단", "중탄산염 투여", "즉시 피하 인슐린으로 전환 후 정주 중단", "수액 중단"], "a": 0, "E": "혈당 250 미만이면 포도당 수액을 섞어 150~250 유지하며 케톤산증이 교정될 때까지 인슐린 지속.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "2020년 12번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V36", "ch": 9, "base": "20-14", "stem": "<div>당뇨병이 없는 간호사의 반복 저혈당. 저혈당 시 인슐린 상승, C-peptide 감소. 원인은?<\/div>", "o": ["인슐린종", "설폰요소제 복용", "외인성 인슐린 투여", "케톤성 저혈당", "부신부전"], "a": 2, "E": "인슐린↑ + C-peptide↓ → 외인성 인슐린. 인슐린종·설폰요소제는 둘 다 증가(설폰요소제 선별검사로 구분).", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "2020년 14번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V37", "ch": 9, "base": "25-53", "stem": "<div>인슐린 사용 환자가 의식이 저하되어 실려 왔고 혈당 35 mg/dL, 삼킬 수 없다. 처치는?<\/div>", "o": ["사탕을 입에 넣는다", "정맥 포도당(또는 글루카곤 근주)", "인슐린 추가", "주스를 마시게 한다", "경과관찰"], "a": 1, "E": "의식 저하로 경구 섭취가 불가하면 정맥 포도당 또는 글루카곤.", "B": "강의 13 당뇨병의 급성합병증과 저혈당", "N": "2025년 53번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V38", "ch": 10, "base": "25-02", "stem": "<div>부신피질 종양(쿠싱·알도스테론증) 기능 영상에 쓰는 제제는?<\/div>", "o": ["NP-59", "MIBG", "Tc-99m pertechnetate", "Ga-68 DOTATATE", "F-18 FDG"], "a": 0, "E": "NP-59(콜레스테롤 유사체) → 부신피질. MIBG → 부신수질(갈색세포종), DOTATATE → 신경내분비종양.", "B": "강의 14 갑상선질환의 핵의학검사와 치료", "N": "2025년 02번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V39", "ch": 10, "base": "25-01", "stem": "<div>방사성요오드 치료 전처치로 옳은 것은?<\/div>", "o": ["치료 전날 조영 CT를 찍는다", "무염식을 한다", "레보티록신을 증량한다", "미역국을 먹는다", "1~2주 저요오드식을 하고 TSH ≥30으로 올린다"], "a": 4, "E": "저요오드식 1~2주 + 호르몬 중단 또는 rhTSH로 TSH 상승. 조영제는 약 2달 간격, 무염식이 아니라 저요오드식.", "B": "강의 14 갑상선질환의 핵의학검사와 치료", "N": "2025년 01번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V40", "ch": 11, "base": "20-17", "stem": "<div>갑상선 전절제 후 쉰 목소리가 생겼다. 손상이 의심되는 신경은?<\/div>", "o": ["설하신경", "반회후두신경", "미주신경 인두가지", "부신경", "안면신경 하악가지"], "a": 1, "E": "반회후두신경 손상 → 성대마비·쉰 목소리(양측이면 호흡곤란). 상후두신경 외지는 고음 장애.", "B": "강의 16 갑상선, 부갑상선 수술", "N": "2020년 17번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V41", "ch": 11, "base": "23-02", "stem": "<div>Graves병 수술 전 Lugol 용액을 투여하는 주된 목적은?<\/div>", "o": ["저칼슘혈증 예방", "빈맥 조절", "갑상선 혈류·혈관성 감소", "갑상선호르몬 합성 촉진", "면역 억제"], "a": 2, "E": "Lugol(요오드) → 혈관성 감소로 수술 중 출혈 감소. 빈맥은 propranolol, 기능 정상화는 항갑상선제.", "B": "강의 16 갑상선, 부갑상선 수술", "N": "2023년 02번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V44", "ch": 13, "base": "23-52", "stem": "<div>당뇨병성 신경병증 중 가장 흔한 형태는?<\/div>", "o": ["원위부 대칭성 다발신경병증", "단일신경병증", "당뇨병성 근위축증", "자율신경병증", "치료 유발 신경병증"], "a": 0, "E": "가장 흔한 형태는 장갑-양말형의 원위부 대칭성 감각운동 다발신경병증.", "B": "강의 18 당뇨병성신경병증", "N": "2023년 52번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}, {"id": "V45", "ch": 14, "base": "25-55", "stem": "<div>증식성 당뇨망막병증을 정의하는 소견은?<\/div>", "o": ["미세혈관류", "경성삼출물", "신생혈관", "면화반", "망막 내 출혈"], "a": 2, "E": "신생혈관이 생기면 증식성. 미세혈관류·출혈·경성삼출물·면화반은 비증식성 소견.", "B": "강의 19 당뇨병성망막병증", "N": "2025년 55번 변형", "img": [], "v": true, "lv": "major", "ok": true, "y": []}], "trends": null}</script>
<script>/* 매번 새로 만들어지는 변형 문항 생성기.

 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'맞았습니다':'틀렸습니다'} · 정답 ${CIR[P.indexOf(x.a)]}${moved?` <span class="origh">(원래 번호 ${x.v?CIR[x.a]:esc(x.A)} · 해설의 선지 번호는 원래 순서 기준)</span>`:(x.v?'':(x.A&&x.A.length>1?` <span class="origh">${esc(x.A)}</span>`:''))}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.v&&!x.dyn&&x.N?`<div class="lv">${esc(x.N)}</div>`:''}${x.ok===false?'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>':(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb==='교과서'?'<div class="small">강의 자료에 근거가 없어 교과서·진료지침으로 확인함</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':'')))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(x.dyn){if(i===x.a)delete wdyn[x.id];else wdyn[x.id]=x;LS.set('wrong_dyn',wdyn)}else{if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
const nOk=()=>Object.entries(run.ans).filter(([id,v])=>right(run.q.find(q=>q.id===id),v)).length;
function exFoot(x){return `${x.N&&!(x.pred&&x.N.startsWith('주관식 예상'))?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.ok===false?(x.pred?'<div class="note">※ 미검증: 동기 정리본·교과서 기준 답이며 26 학습부와 대조하지 않았습니다.</div>':'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>'):(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb==='교과서'?'<div class="small">강의 자료에 근거가 없어 교과서·진료지침으로 확인함</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':'')))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}`}
function mark(x,ok){if(ok)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}
function showS(x,a){const done=a!==undefined;
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${nOk()}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div class="sa">${done?`<div class="small">내 답</div><div class="mine">${esc(a.txt)||'<span class="small">(빈칸)</span>'}</div>`:`<textarea id="sa" placeholder="답을 적고 '답 확인'을 누르세요 (한글·영어 모두 가능)"></textarea><div class="row" style="justify-content:flex-end"><button class="ghost" id="skip">모르겠음</button> <button class="go" id="chk">답 확인</button></div>`}</div>
 ${done?`<div class="ex ${a.ok?'':'wrong'}"><div class="h">정답: <span class="ans">${esc(x.A)}</span></div>
 <div class="grade"><span class="small">${a.auto===null?'여러 항목을 쓰는 문항이라 직접 채점해 주세요.':(a.auto?'자동 채점: 인정 답과 일치':'자동 채점: 인정 답과 다름 (철자·표현 차이면 맞음으로 바꾸세요)')}</span>
 <button class="chip ${a.ok?'on':''}" data-g="1">맞음</button><button class="chip ${a.ok?'':'on'}" data-g="0">틀림</button></div>
 <div style="margin-top:8px">${esc(x.E)}</div>${exFoot(x)}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 const sub=t=>{const au=autoGrade(x,t);run.ans[x.id]={txt:t,auto:au,ok:au===true};mark(x,au===true);show()};
 if(!done){const ta=$('#sa');ta.focus();$('#chk').onclick=()=>sub(ta.value.trim());$('#skip').onclick=()=>sub('');
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))sub(ta.value.trim())}}
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{a.ok=b.dataset.g==='1';mark(x,a.ok);show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>right(x,run.ans[x.id]));const bad=run.q.filter(x=>!right(x,run.ans[x.id]));
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${isS(x)?'[주관식] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="again">같은 설정으로 새로 풀기</button> ${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</span></div></div>`;
 $('#home').onclick=home;$('#again').onclick=()=>{run={q:build(),i:0,ans:{}};show();scrollTo(0,0)};
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
