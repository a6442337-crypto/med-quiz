없게 인공적으로 생성한 데이터셋으로, 개인정보 보호가 강한 의료 데이터로 AI를 학습시킬 때의 딜레마를 해결하는 방법이다. 빅데이터는 방대한 데이터의 통칭, raw 데이터는 정제되지 않은 원천 데이터(개인 식별 정보 포함), 의료데이터는 병원에서 생기는 모든 데이터, 희귀질환데이터는 빈도가 낮은 질환의 데이터이다.", "B": "관련 강의: 강의 08 의료정보 기술동향", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-31", "keys": ["25-31"], "ch": 0, "g": "의료 AI 의료기기·규제·기술동향", "stem": "<div>AIaMD의 사용으로 개선되지 않는 사항은?<\/div>", "o": ["안저검사 AIaMD의 사용으로 당뇨환자 안저검사율이 향상된다.", "뇌졸중 영상진단 AIaMD의 사용으로 환자의 예후가 개선된다.", "영상의학용 AIaMD로 TAT(turnaround time)이 개선된다.", "AIaMD는 성능 드리프트가 발생하지 않는다.", "AIaMD 사용으로 지역간 의료 편차를 줄일 수 있다."], "a": 3, "A": "④", "E": "성능 드리프트는 운영 중 AI 성능이 점차 떨어지는 현상으로 AI에 필연적으로 생긴다. 이를 관리하려고 PCCP(계획된 업데이트 승인)를 둔다. 자율 안저 AI로 당뇨환자 망막 검사율 증가, 뇌졸중 조기 감지로 90일 예후 개선, 영상 판독 TAT 단축, 균일한 판독으로 지역·병원 간 격차 감소가 강의 예시로 제시되었다.", "B": "관련 강의: 강의 08 의료정보 기술동향", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-32", "keys": ["25-32"], "ch": 0, "g": "의료 AI 의료기기·규제·기술동향", "stem": "<div>AI의 도입은 진단율을 높이지만, 지나친 의존은 의사의 독립적 진단 역량을 악화시킬 수 있다. 다음 중 여기에 해당되는 적절한 용어를 고르시오.<\/div>", "o": ["external validation", "de-skilling", "drift index", "SBOM (Software Bill of Materials)", "PCCP (Predetermined Change Control Plan)"], "a": 1, "A": "②", "E": "AI 디스킬링(de-skilling)은 AI에 노출된 뒤 AI 없이 진료할 때 노출 전보다 실력이 유의하게 떨어지는 현상이다. AI 없는 진료일을 두는 등 방지 노력이 필요하다. SBOM은 소프트웨어 자재명세서, PCCP는 AI 의료기기의 계획된 업데이트 승인 제도이다.", "B": "관련 강의: 강의 08 의료정보 기술동향", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-15", "keys": ["25-15"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>다음 예시를 보고, 용어의 개념 연결이 옳은 것을 고르시오. 조선대학교 정문 사거리에 설치된 교통신호등 중에서 정문에서 동구청 방향으로의 신호등에서 발생되는 빨강신호의 Raw값은 Red, 192.234 235.245.678 이다.<\/div>", "o": ["Information - Red, 192.234.235.245.678", "Data - 조선대 정문에서 직진하던 운전자의 눈에 빨간 신호가 인지되었다.", "Knowledge - 조선대 정문에서 동구청 방향으로 직진 신호가 빨간색이다.", "Wisdom - 이 방향으로 차량을 운행중인 운전자는 차를 멈춰야 한다.", "Knowhow - 주황색에서 적색으로 바뀌는 것을 보고 차를 빠르게 운행하여 통과한다."], "a": 3, "A": "④", "E": "Data → Information → Knowledge → Wisdom 피라미드. 가공하지 않은 원값(Red, 192.234…)은 Data, 이를 정리해 의미를 붙인 것(정문에서 동구청 방향 신호가 빨간색, 운전자가 빨간 신호를 인지)은 Information, 이를 바탕으로 행동을 판단하는 것(차를 멈춰야 한다)은 Wisdom이다. ①은 Data, ②·③은 Information, ⑤는 Wisdom 수준의 판단(그것도 잘못된 판단)이다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-17", "keys": ["25-17"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>Wearable device에서 오는 모든 신호를 의미하는 용어는?<\/div>", "o": ["Big data", "Omics data", "Lifelog data", "Wearable data", "Grid data"], "a": 2, "A": "③", "E": "2023년과 같은 문항이다. 라이프로그 데이터(lifelog data)는 wearable device에서 오는 모든 신호(연결된 혈압계·혈당측정기·PPG·스마트워치 등)를 말한다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-18", "keys": ["25-18"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>다음 중 의료 인공지능과 빅데이터에 대하여 옳지 않은 것은?<\/div>", "o": ["ML(machine learning)에서 사용되는 데이터 중에서 Overfitting을 피하기 위해 사용되는 data set은 ‘validation set’이다", "하나의 함수와 또 다른 함수를 반전 이동한 값을 곱한 다음, 구간에 대해 적분하여 새로운 함수를 구하는 수학 연산자를 합성곱(convolution)이라 한다,", "머신러닝을 이용하면 CT를 보고 심장혈관이 얼마나 좁아졌는지에 대한 정보를 자동으로 얻을 수 있다", "여러 가지 ML 알고리즘을 통합하여 새로운 예측에 활용하는 것을 combined set이라 한다.", "Regression에 대한 ML은 supervised learning에 포함된다."], "a": 3, "A": "④", "E": "머신러닝에서 overfitting을 방지하기 위한 data set은 validation set입니다. convoluton의 수학적 정의는 한 함수에 다른 함수를 역으로 곱하여 합성하고 구간에 대해 적분한 수학연산자가 맞습니다. 의료 AI 분야에서 머신러닝을 이용해 질병의 유무, 범위, 병변의 크기나 정도를 진단하거나 측정하는데 활발하게 사용됩니다. 다양한 ML 알고리즘을 통합하여 새로운 예측을 하는 것은 algorhythm ensemble이라고 합니다. 머신 러닝은 크게 supervised learning, unsupervised learning이 있는데 regression, classification은 supervised learning에 속합니다. 기출문제도 아니었고 회색 글씨로 나와 있거나 설명을 생략한 부분에서 출제된 거라서 이런 경우에는 이 문제를 외워주시는 것 말고는 방법이 없다고 말씀드리고 싶습니다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "23-26", "keys": ["23-26"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>Wearable device에서 오는 모든 신호를 의미하는 용어는?<\/div>", "o": ["Big data", "Omics", "Lifelog data", "Wearable data", "LIS"], "a": 2, "A": "③", "E": "라이프로그 데이터(lifelog data)는 wearable device에서 오는 모든 신호로, 연결된 자동 혈압계·혈당측정기·PPG(광용적 맥파)·스마트워치 등의 데이터가 해당한다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-27", "keys": ["23-27"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>인공지능과 빅데이터에 대하여 옳지 않은 것은?<\/div>", "o": ["ML(machine learning)에서 Overfitting을 방지하기 위한 data set은 ‘test set’이다", "한 함수에 다른 함수를 역으로 곱하여 합성하고 구간에 대해 적분한 합성곱을 convolution이라 한다.", "머신러닝을 이용하면 CT를 보고 심장혈관이 얼마나 좁아졌는지 자동으로 알 수 있다.", "다양한 ML 알고리즘을 통합하여 새로운 예측을 하는 것을 Ensemble이라 한다", "Regression에 대한 ML은 supervised learning에 포함된다."], "a": 0, "A": "①", "E": "Overfitting을 막고 교정하는 데이터셋은 validation set이다. 데이터는 training set(학습), validation set(over/underfitting 교정), test set(완성된 알고리즘 확인)으로 나눠 써야 한다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "22-14", "keys": ["22-14"], "ch": 0, "g": "의료정보학 개요·빅데이터·인공지능 기초", "stem": "<div>다음은 퍼셉트론(perceptron)에 대한 설명이다. 틀린 것을 고르시오.<\/div>", "o": ["가중치(weights)는 각 인풋에 대해 일정량의 중요도를 부여하는 개념이다.", "퍼셉트론은 복수의 입력 신호 각각에 고유한 가중치를 부여한다.", "가중치가 곱해진 입력들의 합은 활성화함수(임계함수)를 통과해 해당 퍼셉트론을 활성화할지 말지 결정한다.", "어떤 인풋(input)에 대해 가중치가 크다는 건 그 인풋이 아웃풋(output)을 결정하는 데에 더 큰 역할을 한다는 뜻이다.", "퍼셉트론은 선형 회귀(linear regression)와는 무관하다."], "a": 4, "A": "⑤", "E": "퍼셉트론은 입력에 가중치를 곱해 더하는 선형 결합(회귀의 weight·input 구조)에 활성화 함수를 붙인 것으로, 선형 회귀와 같은 원리를 쓴다. 강의에서도 regression의 weight가 퍼셉트론으로 이어진다고 설명한다.", "B": "관련 강의: 강의 01 의료정보학의 소개", "N": "2022년 복원 수합에는 정답·교수 표기가 없어, 정답은 이후 연도 같은 문항과 강의 내용으로, 교수는 같은 주제의 2023·2025년 문항으로 판단함", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "25-19", "keys": ["25-19", "22-01"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>데이터마이닝 작업에 해당하지 않는 것을 고르시오<\/div>", "o": ["Association rule learning", "Classification analysis", "Data redundancy", "Regression analysis", "Clustering analysis"], "a": 2, "A": "③", "E": "매해 똑같이 기출되는 문제이므로 꼭 암기하세요. 데이터마이닝에 포함되는 것은 clustering, classification, regression, association rule learning입니다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": false, "ra": "③"}, {"id": "25-20", "keys": ["25-20", "23-30", "22-13"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>데이터베이스 내의 데이터와 이들을 사용하는 응용 프로그램이 서로 영향을 받지 않는 것을 무엇이라고 하는가?<\/div>", "o": ["Data independency", "Data sharing", "Data integrity", "Data security", "Data redundancy"], "a": 0, "A": "①", "E": "데이터베이스 내의 데이터와 이들을 사용하는 응용 프로그램이 서로 영향을 받지 않는 것은 data independency입니다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ①, 2023 ⇒ ③, 2022 ⇒ ③", "img": [], "v": false, "y": [2022, 2023, 2025], "ok": false, "ra": "①"}, {"id": "25-23", "keys": ["25-23", "22-06"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>DBMS(DataBase Management System)을 이용한 data warehouse의 특성이 아닌 것을 고르시오<\/div>", "o": ["Volatile Data", "Online system", "Multi-dimensional data analysis", "Subject-oriented", "End-user computing"], "a": 0, "A": "①", "E": "2023년 기출을 약간 바꾼 문제이며 2022년에 그대로 나온 적이 있다. DBMS를 이용한 data warehouse의 데이터는 한 번 기록되면 지워지지 않는 non-volatile data이다(강조된 부분). on-line system, subject-oriented, end-user computing, multi-dimensional data analysis는 특징에 해당한다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ①, 2022 ⇒ ④", "img": [], "v": false, "y": [2022, 2025], "ok": false, "ra": "①"}, {"id": "25-24", "keys": ["25-24"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>HTML, XML과 RDF(Resource Description Framework)에 대한 내용 중 틀린 것을 고르시오.<\/div>", "o": ["RDF는 웹(web)상의 자원의 정보를 표현하기 위한 규격이다.", "RDF는 온톨로지(의미정보)를 구현하지 못한다.", "“<em>하늘<\/em>는 <em>푸른색<\/em>이다”는 HTML(Hypertext Markup Language)의 구조이다.", "“<urn:바나나, urn:색, urn:노랑>은 RDF의 구조이다.", "RDF는 데이터 모델을 표현하기 위해 XML(eXtensible Markup Language)을 사용한다."], "a": 1, "A": "②", "E": "22년도 문제와 똑같이 출제되었습니다. RDF는 웹 상의 정보를 표현하기 위한 규격입니다. RDF가 전 세계에 있는 웹페이지들을 structure화 시키게 되면 온톨로지를 구현할 수 있습니다. “<em>하늘<\/em>는 <em>푸른색<\/em>이다”는 em을 사용한 HTML의 구조입니다. <em>은 강조된 텍스트를 표현할 때 사용됩니다. 즉 하늘이 푸른색이라는 것을 표현합니다. ”<urn:바나나, urn:색, urn:노랑>“를 기입해주면 컴퓨터는 바나나는 노랑색을 가지고 있다고 이해하게 됩니다. 이러한 구조에 기반하여 의미 정보인 온톨로지를 표현하는 것이 RDF의 구조입니다. RDF는 XML을 이용하여 데이터를 표현합니다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-26", "keys": ["25-26"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>다음 중 데이터베이스 설계할 때 고려해야 할 사항 중 옳은 것을 고르시오.<\/div>", "o": ["영상 등의 자료를 처리하는 경우 object DB를 사용한다.", "데이터 간의 관계보다는 데이터의 저장에 신경을 써야 한다.", "전체 시스템의 구축비용이 최우선 고려사항이다.", "데이터 간의 연관에 의해 발생하는 문제는 신경을 쓰지 않아도 된다.", "Redundancy는 data mining의 구성요소이다."], "a": 0, "A": "①", "E": "2022년 기출의 선지를 바꾼 문항이다. 영상·음성 등 텍스트가 아닌 자료는 relational DB로 다루기 어려워 object DB를 쓴다. ② 저장보다 데이터 간 관계가 중요하다. ③ 비용은 고려 사항이지만 최우선은 아니다. ④ 데이터 간 연관에서 오류가 생기기 쉬우므로 고려해야 한다. ⑤ data mining의 4가지는 clustering, classification, regression, association rule learning이다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "23-28", "keys": ["23-28"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>데이터 mining에 포함되지 않는 것은?<\/div>", "o": ["Regression", "Classification", "Clustering", "Association rule learning", "Data redundancy"], "a": 4, "A": "⑤", "E": "Data mining의 4가지는 clustering, classification, regression, association rule learning이다. 매년 같은 형태로 출제되었다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-29", "keys": ["23-29"], "ch": 0, "g": "데이터베이스·data warehouse·data mining", "stem": "<div>DBMS(DataBase Management System)을 이용한 data warehouse의 특성이 아닌 것을 고르시오.<\/div>", "o": ["Off-line ": "디지털 의학교육·4차 산업혁명·정밀의학", "stem": "<div>의학 교육을 위한 디지털 도구에 대한 설명이다. 옳은 것은?<\/div>", "o": ["notebooklm은 인공지능 환각이 있어 교육 자료를 정리하는데 이용하기 어렵다.", "스마트패드는 교육을 위해 최적화된 도구이다.", "굿노트와 같은 프로그램으로 3D 애니메이션을 제작할 수 있다.", "강의 녹음을 텍스트로 변환하기 위해 네이버 클로바와 같은 서비스를 이용할 수 있다.", "구글 classroom은 팀 기반 학습(team-based learning)을 위한 최고의 디지털 도구이다"], "a": 3, "A": "④", "E": "강의 녹음을 텍스트로 바꾸는 데 네이버 클로바 같은 음성 인식 서비스를 쓸 수 있다. ① NotebookLM은 올린 자료만 근거로 답해 환각이 적은 것이 장점이다. ② 스마트패드는 교육보다 멀티태스킹·소비에 맞게 설계되었다. ③ 굿노트는 필기 앱으로 3D 애니메이션 제작 도구가 아니다. ⑤ 구글 classroom을 팀 기반 학습의 최고 도구라고 단정할 근거는 없다.", "B": "관련 강의: 강의 02 컴퓨터 기반 의학교육", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "23-16", "keys": ["23-16"], "ch": 1, "g": "디지털 의학교육·4차 산업혁명·정밀의학", "stem": "<div>4차 산업혁명을 가장 잘 설명한 것을 고르시오<\/div>", "o": ["it 기술이 더 고도된것이 4차 산업혁명이다", "3차 산업혁명에 바이오 기술이 추가된것이 4차산업혁명이다", "모든 인간과 사물을 초연결한 생태계가 4차 산업혁명이다", "4차산업혁명시대에는개인보다는 집단이 더 중요하다", "4차산업혁명에는 개인정보보호가 중요하지않다"], "a": 2, "A": "③", "E": "4차 산업의 주된 정의는 연결입니다. 현실세계와 가상공간 사이의 연결, 즉 모든 인간과 사물을 초연결한 생태계라고 할 수 있습니다. ①X 4차 산업 혁명은 연결입니다. ②X 3차 산업 혁명과 4차 산업 혁명의 차이는 연결입니다. ③맞습니다. ④4차 산업 혁명 시대는 개인 맞춤 시대입니다. ⑤4차 산업 혁명에는 개인정보 보호가 중요합니다.", "B": "관련 강의: 강의 02 컴퓨터 기반 의학교육", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "22-17", "keys": ["22-17"], "ch": 1, "g": "디지털 의학교육·4차 산업혁명·정밀의학", "stem": "<div>4차 산업혁명기 의료기술을 가장 잘 표현한 것은?<\/div>", "o": ["개인 중심의 의학 기술", "인공지능이 의사를 대체하는 의료기술", "의료인과 환자 간의 접촉을 최소화하기 위한 원격 의료 기술", "개인의 감정보다는 객관적 증상을 중요하게 생각하는 의료기술", "개인의료정보를 모두 개방하여 개인을 추적 가능하도록 하는 의료 기술"], "a": 0, "A": "①", "E": "20세기 의학이 평균화된 인구 집단(가우시안 분포)을 기준으로 판단했다면, 4차 산업혁명기 의학 기술은 정밀의학 등으로 개인 중심의 의학 기술이 된다.", "B": "관련 강의: 강의 02 컴퓨터 기반 의학교육", "N": "2022년 복원 수합에는 정답·교수 표기가 없어, 정답은 이후 연도 같은 문항과 강의 내용으로, 교수는 같은 주제의 2023·2025년 문항으로 판단함", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "22-19", "keys": ["22-19"], "ch": 1, "g": "디지털 의학교육·4차 산업혁명·정밀의학", "stem": "<div>정밀의학에 대한 설명으로 옳은 것은?<\/div>", "o": ["개인맞춤의학과 동의어이다.", "정밀의학의 분류기준은 단백체학 결과이다.", "정밀의학의 발달로 윤리적 결정이 줄어들게 된다.", "정밀의료를 실현하기 위해서 보건의료 빅데이터가 꼭 필요하다.", "‘정밀’이란 환자 개인만의 고유한 특성에 초점을 두었다는 뜻이다."], "a": 3, "A": "④", "E": "정밀의학은 유전체·임상·생활 데이터 등 보건의료 빅데이터를 바탕으로 환자를 하위 집단으로 나눠 치료를 정하는 것이다. 개인맞춤의학과 완전히 같은 말은 아니며(개인 하나만을 위한 치료라는 오해를 피하려 '정밀'을 씀), 분류 기준이 단백체학 하나에 한정되지 않고, 윤리적 결정은 오히려 늘어난다.", "B": "관련 강의: 강의 02 컴퓨터 기반 의학교육", "N": "2022년 복원 수합에는 정답·교수 표기가 없어, 정답은 이후 연도 같은 문항과 강의 내용으로, 교수는 같은 주제의 2023·2025년 문항으로 판단함", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "25-01", "keys": ["25-01"], "ch": 2, "g": "병원정보시스템", "stem": "<div>다음 화면은 병원정보시스템의 어느 구성요소에 해당되는가?<\/div>", "o": ["전자의무기록(EMR)", "검사정보시스템 (LIS)", "처방전달시스템 (OCS)", "영상정보시스템 (PACS)", "임상의사결정지원시스템 (CDSS)"], "a": 2, "A": "③", "E": "김상미 교수님의 형성평가 문제가 그대로 출제되었습니다. 처방전달시스템(OCS)의 화면입니다.", "B": "관련 강의: 강의 05 병원정보시스템", "N": "", "img": ["figs/25-01.png"], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-02", "keys": ["25-02"], "ch": 2, "g": "의료 데이터베이스·의료 데이터와 AI 활용", "stem": "<div>환자의 데이터를 한곳에 통합하고, 분석 목적에 맞게 추출하기 좋은 형태로 가공·저장하여 연구자가 직접 손쉽게 임상 연구 데이터를 추출할 수 있게 해주는 시스템은 무엇인가?<\/div>", "o": ["EMR 전자의무기록시스템", "HIS 병원정보시스템", "CDW 임상데이터웨어하우스", "CDSS 임상의사결정지원시스템", "EDW 엔터프라이스데이터하우스"], "a": 2, "A": "③", "E": "환자의 데이터를 한곳에 통합하고, 분석 목적에 맞게 추출하기 좋은 형태로 가공 및 저장하는 시스템은 데이터웨어하우스이고, 그중에서 연구자가 직접 손쉽게 임상 연구 데이터를 추출할 수 있게 해주는 시스템은 ③ CDW 임상데이터웨어하우스입니다.", "B": "관련 강의: 강의 03 의료데이터베이스의 개요와 활용", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-03", "keys": ["25-03"], "ch": 2, "g": "의료 데이터베이스·의료 데이터와 AI 활용", "stem": "<div>의료 분야에서 인공지능 기술 활용을 위한 연구가 활발하게 진행되고 있다. 다음 중 의료 분야에서 인공지능 기술이 활용될 수 있는 분야가 아닌 것은?<\/div>", "o": ["환자 상담 챗봇(chatbot)", "전자의무기록 초안 작성", "원시 데이터(raw data) 생성", "의료데이터 분석 및 시각화", "임상의사결정지원시스템(CDSS)"], "a": 2, "A": "③", "E": "01번 문제와 마찬가지로 김상미 교수님 형성평가에서 출제되었습니다. 인공지능은 이미 존재하는 데이터를 활용하여 학습할 수는 있으나, 원시 데이터를 직접 생성할 수는 없습니다. ① 가정호스피스를 대체할 챗봇을 LLM, AI 모델 기반으로 개발 중에 있습니다. ② 현재 AI 기반으로 EMR을 자동으로 작성해주는 시스템이 연구 중입니다. ④ AI를 활용하여 의료데이터를 분석하고 시각화할 수 있습니다. ⑤ 최근 빅데이터/AI 기반 CDSS 개발에 관한 연구가 진행 중입니다.", "B": "관련 강의: 강의 03 의료데이터베이스의 개요와 활용", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-04", "keys": ["25-04"], "ch": 2, "g": "의료 데이터베이스·의료 데이터와 AI 활용", "stem": "<div>다음 중 연구 목적을 위해 개방된 의료 데이터가 아닌 것은?<\/div>", "o": ["건강보험빅데이터", "심평원 보건의료빅데이터", "임상데이터웨어하우스", "한국인유전체역학조사사업(KoGeS) 데이터", "국민건강영양조사(KNHANES) 데이터"], "a": 2, "A": "③", "E": "김상미 교수님이 강조하셨던 의료 데이터 베이스에 관련된 문제입니다. ① 건강보험의료데이터는 보험공단에서 제공하는 공공데이터입니다. ② 심평원 보건의료빅데이터는 심평원에서 제공하는 공공데이터입니다. ③ 임상데이터웨어하우스(CDW)는 병원 내에서 사용하는 데이터로, 연구 목적을 위해 개방된 데이터는 아닙니다. ④, ⑤ 한국인유전체역학조사사업, 국민건강영양조사는 질병청에서 개방하고 있는 레지스트리 데이터입니다.", "B": "관련 강의: 강의 03 의료데이터베이스의 개요와 활용", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-05", "keys": ["25-05"], "ch": 2, "g": "의료 데이터베이스·의료 데이터와 AI 활용", "stem": "<div>다음은 생성형 AI의 활용 4단계이다. (A), (B)에 들어갈 말로 바르게 짝지어진 것은? 1단계 학습(Learning): AI가 데이터를 기반으로 지식을 습득하고 패턴을 이해하는 단계 2단계 (A): AI에게 내리는 ‘지시문’을 작성하는 단계로, 데이터를 업로드한 후 원하는 분석 목표를 명시하는 단계 3단계 생성(Generation) 4단계 (B): AI가 생성한 결과값을 비판적으로 확인하고 해석하는 능력으로, 실습 과정에서 필수적으로 요구<\/div>", "o": ["분석(Analysis) - 평가(Evaluation)", "추론(inference) - 피드백(feedback)", "데이터 입력(data input) - 검토(review)", "프롬프팅(prompting) - 리터러시(literacy)", "명령어 작성(command writing) - 활용 능력(application skill)"], "a": 3, "A": "④", "E": "생성형 AI 활용 4단계는 학습(Learning) → 프롬프팅(Prompting) → 생성(Generation) → 리터러시(Literacy) 순서이다. (A)는 지시문을 작성하는 프롬프팅, (B)는 생성 결과를 비판적으로 검토·해석하는 리터러시이다.", "B": "관련 강의: 강의 03 의료데이터베이스의 개요와 활용", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-06", "keys": ["25-06"], "ch": 2, "g": "의료 데이터베이스·의료 데이터와 AI 활용", "stem": "<div>다음 제시문을 읽고, 이에 해당하는 AI시스템의 개념으로 가장 적절한 것을 고르시오. 주어진 데이터를 바탕으로 스스로 판단하고, 알아서 다음 일을 처리한다. 사용자의 추가 명령 없이도 다음 단계의 업무를 알아서 수행할 수 있다. 단순한 질문-답변이 아니라 여러 단계의 복잡한 일을 연속적으로 처리한다.<\/div>", "o": ["토큰 (token)", "프롬프트 (prompt)", "거대 언어 모델 (LLM, Large Language Model)", "에이전트 AI (agentic AI)", "생성형 AI (Generative AI)"], "a": 3, "A": "④", "E": "외부 강사님께서 강조하신 부분에서 출제되었습니다. LLM을 기반으로 스스로 판단·명령·실행이 가능한 AI 시스템은 에이전트 AI입니다. ①, ② 토큰, 프롬프트는 LLM의 작동 원리에 적용되는 개념입니다. ③ 거대 언어 모델(LLM)은 언어를 이해하고 요약·추론하는 언어 모델로, 스스로 창조하거나 행동할 수는 없습니다. ⑤ 생성형 AI는 LLM을 기반으로 텍스트, 이미지, 코드를 새로 만들어내는 AI입니다.", "B": "관련 강의: 강의 03 의료데이터베이스의 개요와 활용", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "V01", "ch": 0, "base": "25-23", "lv": "minor", "stem": "<div>DBMS(DataBase Management System)을 이용한 data warehouse의 특성으로 옳은 것을 고르시오.<\/div>", "o": ["Object-oriented data", "Off-line system", "Non-volatile data", "저장된 데이터를 사용자가 자유롭게 수정·삭제할 수 있다", "현재 시점의 데이터만 보관하고 과거 데이터는 지운다"], "a": 2, "E": "Data warehouse의 데이터는 한 번 기록되면 지워지거나 바뀌지 않는 non-volatile data다(수정 이력까지 남음). ① object-oriented가 아니라 subject-oriented, ② off-line이 아니라 on-line system, ④ 읽기 전용(read-only)으로 적재되며 임의 수정·삭제가 안 된다, ⑤ 과거 자료를 순차적으로 쌓는 historical data가 특징이다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "2025년 23번 변형", "vn": "발문을 '특성이 아닌 것'→'특성으로 옳은 것'으로 바꾸고, 오답을 특성을 뒤집은 진술로 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V02", "ch": 0, "base": "25-20", "lv": "minor", "stem": "<div>데이터베이스에 저장된 데이터의 정확성과 일관성(correctness and consistency)을 유지하는 것을 무엇이라고 하는가?<\/div>", "o": ["Data independency", "Data sharing", "Data security", "Data redundancy", "Data integrity"], "a": 4, "E": "Data integrity(무결성)는 데이터의 정확성과 일관성을 뜻한다. Data independency는 데이터와 응용 프로그램이 서로 영향을 받지 않는 것, data sharing은 같은 데이터를 여러 사용자가 함께 쓰는 것, data security는 허가되지 않은 접근을 막는 것, data redundancy는 데이터 중복으로 DB 접근법이 최소화하려는 대상이다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "2025년 20번 변형", "vn": "같은 선지 묶음에서 묻는 개념만 data independency → data integrity로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V03", "ch": 0, "base": "25-25", "lv": "minor", "stem": "<div>다음은 PACS(Picture Archiving and Communication System)에 대한 사항이다. 옳지 않은 것은?<\/div>", "o": ["서로 다른 병원 간 영상 호환을 위한 영상 표준 규격은 HL7이다.", "PACS에 저장되는 영상의 형식은 DICOM이며 파일 확장자는 .dcm이다.", "PACS의 주요 구성요소는 imaging modalities, 보안 네트워크, 판독 workstation, archive이다.", "중요한 영상 archive는 RAID 기술을 이용해 저장한다.", "VPN이나 SSL을 이용하면 병원 밖에서도 web-based로 PACS를 열람할 수 있다."], "a": 0, "E": "의료 영상의 표준 규격은 DICOM(Digital Imaging and Communications in Medicine)이다. HL7은 EMR 등 병원 정보시스템 사이에서 데이터를 주고받기 위한 표준으로, PACS에서 DICOM이 하는 역할을 EMR 쪽에서 한다. ②~⑤는 PACS·RIS 강의 내용 그대로다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "2025년 25번 변형", "vn": "RIS 문항의 틀(관련 없는 항목 고르기)을 PACS로 옮기고, 오답을 DACOM 대신 HL7(다른 표준)과 혼동하도록 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V04", "ch": 0, "base": "25-19", "lv": "minor", "stem": "<div>Data mining 기법 중, 함께 일어나는 사건 사이의 연관성(예: 밀가루를 산 고객이 버터도 산다)을 찾아내는 것을 고르시오.<\/div>", "o": ["Clustering", "Classification", "Regression", "Association rule learning", "Data redundancy"], "a": 3, "E": "Association rule learning은 동시에 일어나는 사건의 연관 규칙(장바구니 분석)을 찾는다. Clustering은 비슷한 자료끼리 묶기, classification은 미리 정한 분류에 배정, regression은 데이터에서 규칙을 함수(공식)로 만들기이며, data redundancy는 data mining 기법이 아니다.", "B": "관련 강의: 강의 04 의료정보시스템과 전자의무기록시스템 I · 강의 07 의료정보시스템과 전자의무기록시스템 II", "N": "2025년 19번 변형", "vn": "'해당하지 않는 것' 고르기에서 4가지 기법 중 하나의 정의를 묻는 발문으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V05", "ch": 1, "base": "25-08", "lv": "minor", "stem": "<div>베이즈 이론에 대한 설명으로 옳지 않은 것은?<\/div>", "o": ["결정론적 이론에 기반하며 '라플라스의 악마'를 잘 설명한다.", "조건부 확률에 대한 수학적 정리이다.", "진단 검사법의 타당도를 평가하는 데 이용할 수 있다.", "데이터가 많아질수록 미래 예측이 정확해진다.", "알파고 등 인공지능 개발에 이용되었다."], "a": 0, "E": "베이즈 정리는 결정론이 아니라 확률론에 기반한다. 라플라스의 악마는 결정론적 사고의 대표적인 예라 베이즈 정리와 반대다. 베이즈 정리는 사전확률을 새 데이터로 갱신하므로 데이터가 많을수록 예측이 정확해지고, 진단 검사의 타당도 평가와 인공지능 개발에 쓰인다.", "B": "관련 강의: 강의 06 진료의사결정시스템", "N": "2025년 8번 변형", "vn": "발문을 '옳은 것'→'옳지 않은 것'으로 바꾸고 해마다 나온 선지(라플라스의 악마·데이터 양·알파고)를 재구성", "img": [], "v": true, "ok": false, "y": []}, {"id": "V06", "ch": 1, "base": "25-09", "lv": "minor", "stem": "<div>흉통으로 응급실에 온 환자에게 AST 검사를 했더니 양성이었다. 사건 A를 '심근경색', 사건 B를 'AST 양성'이라 할 때, 이 환자가 심근경색일 확률을 베이즈 정리로 옳게 나타낸 것은?<\/div>", "o": ["P(A)·P(B)",  const p=pool();const nv=D.q.filter(x=>x.v).length;
 const rep=M.ch.filter(c=>c.mode==='repeat').map(c=>c.prof);const unv=D.q.filter(x=>!x.ok).length,dr=D.q.filter(x=>x.ok&&x.vb==='초안').length;
 app.innerHTML=`${unv?`<div class="warn"><b>미검증</b> 문항 ${unv}개: 2026년 강의 자료가 아직 없어 복원 해설의 답을 그대로 실었습니다. 강의 자료가 올라오면 다시 검증합니다.</div>`:''}${dr?`<div class="warn" style="border-color:#3b6fb6;background:#eef3fb"><b>초안으로 검증됨</b> 문항 ${dr}개: 검안본이 올라오면 다시 확인합니다.</div>`:''}<div class="panel"><div class="lbl">파트 (2026 담당)</div><div class="row" id="chs">
 <button class="chip ${st.chs.size===M.ch.length?'on':''}" data-all>전체</button>${M.ch.map(c=>`<button class="chip ${st.chs.has(c.id)?'on':''}" data-c="${c.id}" title="${esc(c.why||'')}">${esc(c.title.replace(/^[^.]+\.\s*/,''))} · ${esc(c.prof)} <small class="md ${isVary(c.mode)?'vary':''}">${MODEL[c.mode]||c.mode}</small></button>`).join('')}</div>
 ${YEARS.length>1?`<div class="lbl">출제 연도</div><div class="row">${YEARS.map(y=>`<button class="chip ${st.yrs.has(y)?'on':''}" data-y="${y}">${y}</button>`).join('')}</div>`:''}
 <div class="lbl">문제 종류</div><div class="row" id="kind">${[['all','기출+변형'],['past','기출(원본)만'],...(nv||hasGen?[['var','변형만']]:[]),['wrong',`오답노트 (${wrong.size+Object.keys(wdyn).length})`]].map(([k,t])=>`<button class="chip ${st.kind===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
 <div class="lbl">순서 · 문항 수</div><div class="row" id="ord">${[['shuffle','무작위'],['seq','문제집 순서']].map(([k,t])=>`<button class="chip ${st.order===k?'on':''}" data-o="${k}">${t}</button>`).join('')}
 <span style="width:12px"></span>${[10,20,50,0].map(n=>`<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n||'전부'}</button>`).join('')}</div>
 <div class="lbl">선지 순서</div><div class="row">${[[true,'섞기'],[false,'원래 순서']].map(([k,t])=>`<button class="chip ${st.mix===k?'on':''}" data-m="${k}">${t}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px;justify-content:space-between"><span class="small">선택된 고정 문항 ${p.length}개${hasGen&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size?' + 매번 새로 만드는 변형 문항':''}</span><button class="go" id="start" ${p.length?'':'disabled'}>시작</button></div></div>
 <div class="panel small">${rep.length?`<b>반복</b> 표시 교수님(${esc([...new Set(rep)].join('·'))})은 해마다 같은 문항을 거의 그대로 내셔서 기출만 나옵니다. `:''}<b>소폭 변형</b> 표시 교수님은 보기·수치·발문만 바꿔 내시고, <b>대폭 변형</b> 표시 교수님은 같은 개념을 다른 증례나 형식으로 내셔서, 그 수준에 맞춘 예상 변형 문항을 함께 실었습니다.<br>기출 문항의 연도 태그는 같은 선지·정답으로 출제된 해를 모두 표시합니다. 보라색 <b style="color:var(--var)">변형</b> 문항은 기출을 바탕으로 만든 예상 문제이고, 원본 문항 번호를 함께 표시합니다. 틀린 문제는 이 브라우저의 오답노트에 저장됩니다.</div>`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(st.chs.size===M.ch.length){st.chs=new Set([c])}else{st.chs.has(c)?st.chs.delete(c):st.chs.add(c);if(!st.chs.size)st.chs=new Set(M.ch.map(c=>c.id))}home()});
 app.querySelector('[data-all]').onclick=()=>{st.chs=new Set(M.ch.map(c=>c.id));home()};
 app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y;if(st.yrs.size===YEARS.length){st.yrs=new Set([y])}else{st.yrs.has(y)?st.yrs.delete(y):st.yrs.add(y);if(!st.yrs.size)st.yrs=new Set(YEARS)}home()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.order=b.dataset.o;home()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mix=b.dataset.m==='true';LS.set('mix',st.mix);home()});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
 $('#start').onclick=()=>{run={q:build(),i:0,ans:{}};show()};
}
function baseTag(x){const b=byId[x.base];return b?`원본 ${b.keys.map(k=>`20${k.slice(0,2)} #${k.slice(3).replace('-1','')}`).join(', ')}`:(x.N||'')}
/* 검증 표시: ok=false → 미검증, vb='초안'|'검안' → 그 자료로 검증, vb 없음(옛 데이터) → 검증 */
const VL=x=>x.ok===false?'미검증':(x.vb?x.vb+'으로 검증됨':'검증됨');
function tags(x){const u=`<span class="${x.ok===false?'u':(x.vb==='초안'?'k1':'k2')}">${x.ok===false?'미검증':(x.vb?x.vb+' 검증':'검증')}</span>`;
 if(x.v)return `<span class="v">변형${x.lv?' · '+(LVL[x.lv]||x.lv):''}</span>${u}<span class="g">${esc(x.dyn?x.N:baseTag(x))}</span>`;
 return x.keys.map(k=>`<span>20${k.slice(0,2)} #${k.slice(3).replace('-1','')}</span>`).join('')+'<span class="y">원본</span>'+u+`<span class="g">${esc(x.g)}</span>`}
function show(){
 const x=run.q[run.i],a=run.ans[x.id];const done=a!==undefined;
 if(!run.perm)run.perm={};if(!run.perm[x.id])run.perm[x.id]=st.mix?shuffle(x.o.map((_,i)=>i)):x.o.map((_,i)=>i);
 const P=run.perm[x.id],moved=P.some((v,i)=>v!==i);
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${Object.entries(run.ans).filter(([id,v])=>v===run.q.find(q=>q.id===id).a).length}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div>${P.map((i,pos)=>`<button class="opt ${done?(i===x.a?'ok':(i===a?'bad':'')):''}" data-i="${i}" ${done?'disabled':''}><b>${CIR[pos]}</b>${esc(x.o[i])}${done&&moved?`<span class="orig">원래 ${CIR[i]}</span>`:''}</button>`).join('')}</div>
 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'맞았습니다':'틀렸습니다'} · 정답 ${CIR[P.indexOf(x.a)]}${moved?` <span class="origh">(원래 번호 ${x.v?CIR[x.a]:esc(x.A)} · 해설의 선지 번호는 원래 순서 기준)</span>`:(x.v?'':(x.A&&x.A.length>1?` <span class="origh">${esc(x.A)}</span>`:''))}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.v&&!x.dyn&&x.N?`<div class="lv">${esc(x.N)}</div>`:''}${x.ok===false?'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>':(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':''))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(x.dyn){if(i===x.a)delete wdyn[x.id];else wdyn[x.id]=x;LS.set('wrong_dyn',wdyn)}else{if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>run.ans[x.id]===x.a);const bad=run.q.filter(x=>run.ans[x.id]!==x.a);
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="again">같은 설정으로 새로 풀기</button> ${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</span></div></div>`;
 $('#home').onclick=home;$('#again').onclick=()=>{run={q:build(),i:0,ans:{}};show();scrollTo(0,0)};
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
