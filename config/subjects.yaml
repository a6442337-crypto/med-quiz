# 과목 이름 매핑: 시간표 표기 ↔ 드라이브 파일명 ↔ 학습부 접두어 ↔ 사이트 경로(slug)
#
# 필드
#   slug          사이트 경로와 data/<slug>/ 폴더 이름 (영문 소문자)
#   name          공식 과목명 (사이트·PDF 제목에 쓰임)
#   term          학기 (시간표의 '1주'가 다시 시작될 때마다 1, 2 …)
#   prefix        시간표 셀의 학습부 번호 접두어 ("신경18: 초안/검안" → 신경)
#                 → 강의를 학습부 파일 "18번 신경계학 …"과 연결하는 키
#   drive_names   드라이브 파일명에 쓰이는 과목 표기 (기출 복원 파일·학습부 파일 검색어)
#   exam_names    시간표 빨간 글씨 시험 셀에서 이 과목을 알아보는 문자열
#   auto          true면 시작일에 자동 처리. false면 수동 실행만.
#
# 자동 처리는 go_live 이후에 시작하는 과목만 대상으로 한다
# (그 전에 시작한 과목은 이미 시험을 봤거나 진행 중이라 만들지 않음 → 수동 실행은 가능).
go_live: 2026-11-16
years: [2025, 2024, 2023, 2022, 2021, 2020]   # 수집할 기출 연도 (최근 것부터)
current_year: 2026                            # 학습부 기준 연도 ("26 학습부")

subjects:
  - {slug: hemonc,   name: 혈액종양학,          term: 2, prefix: 혈종,       drive_names: [혈액종양학, 혈종],         exam_names: [혈액종양학],          auto: false}
  - {slug: forensic, name: 법의학,              term: 2, prefix: 법의학,     drive_names: [법의학],                    exam_names: [법의학],              auto: false}
  - {slug: cardio,   name: 순환기학,            term: 2, prefix: 순환,       drive_names: [순환기학, 순환기],         exam_names: [순환기학],            auto: false}
  - {slug: resp,     name: 호흡기학,            term: 2, prefix: 호흡,       drive_names: [호흡기학, 호흡기],         exam_names: [호흡기학],            auto: false}
  - {slug: repro,    name: 생식의학,            term: 2, prefix: 생식,       drive_names: [생식의학, 생식],           exam_names: [생식의학],            auto: false}
  - {slug: rheum,    name: 알레르기-류마티스학, term: 2, prefix: 알레,       drive_names: [알레르기-류마티스학, 알레르기, 류마티스], exam_names: [알레르기-류마티스], auto: false}
  - {slug: endo,     name: 내분비학,            term: 2, prefix: 내분비,     drive_names: [내분비학, 내분비],         exam_names: [내분비학],            auto: false}
  - {slug: neuro,    name: 신경계학,            term: 2, prefix: 신경,       drive_names: [신경계학, 신경계],         exam_names: [신경계학],            auto: true}
  - {slug: medinfo,  name: 의료정보학,          term: 2, prefix: 의료정보학, drive_names: [의료정보학],               exam_names: [의료정보학],          auto: true}
  - {slug: sensory,  name: 감각계학,            term: 2, prefix: 감각,       drive_names: [감각계학, 감각기],         exam_names: [감각계학],            auto: true}
  - {slug: fever,    name: 발열,                term: 2, prefix: 발열,       drive_names: [발열],                      exam_names: [발열],                auto: true}
  - {slug: msk,      name: 근골격학,            term: 2, prefix: 근골격,     drive_names: [근골격학, 근골격],         exam_names: [근골격학],            auto: true}
  - {slug: cp2,      name: 임상표현2,           term: 2, prefix: 임표,       drive_names: [임상표현2, 임상표현],      exam_names: [임상표현2],           auto: true}

# 시간표에 나오지만 과목이 아닌 접두어 (무시)
ignore_prefixes: [PBL, 그룹장, 학습부장]
