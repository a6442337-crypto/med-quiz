<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>신경계학 요약자료</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--mute:#6b7385;--line:#e3e6ee;--pri:#1d3c6e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--pri);color:#fff;padding:14px 18px}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
.back{color:#fff;opacity:.8;font-size:12.5px;text-decoration:none}.back:hover{opacity:1}
main{max-width:1140px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.sm h2{font-size:16px;margin:0 0 4px;color:var(--pri)}.sm .src{font-size:12px;color:var(--mute);margin-bottom:8px}
.sm details{border-top:1px solid var(--line);padding:8px 0}.sm summary{cursor:pointer;font-weight:500;font-size:14px}
.sm summary small{color:var(--mute);font-weight:400}
figure{margin:12px 0 18px}figure h3{font-size:14px;margin:0 0 6px}
figure .dl{display:flex;gap:6px;margin:0 0 8px}figure .dl a{font-size:12px;color:var(--pri);border:1px solid var(--pri);border-radius:6px;padding:2px 9px;text-decoration:none}
.sheet{overflow:hidden;border:1px solid var(--line);border-radius:6px;position:relative}
/* 좁은 화면: 표를 원래 너비로 그린 뒤 화면 너비에 맞게 통째로 줄인다(zoom). 글자라서 확대해도 선명하다 */
.sheet.fit{cursor:zoom-in}.sheet.fit .inner{transform-origin:0 0}
.fithint{display:none;font-size:12px;color:var(--mute);margin:4px 0 0}.fithint b{color:var(--pri);font-weight:500}
.sheet.fit+.fithint{display:block}
/* 크게 보기: 전체 화면에서 두 손가락 확대·끌어서 이동 */
#zv{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
#zv.on{display:flex}
#zv .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--pri);color:#fff;font-size:13px}
#zv .bar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#zv .bar button{font:inherit;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:5px 10px;min-width:36px}
#zv .vp{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#eef0f4;overscroll-behavior:contain}
#zv .pg{background:#fff;margin:0;transform-origin:0 0}
#zv .sheet{border:0;border-radius:0;overflow:visible}#zv .sheet th,.sheet.fit th{position:static}
body.zv-open{overflow:hidden}
.sheet table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:13px;line-height:1.45}
.sheet table.w5{min-width:900px}.sheet table.w4{min-width:640px}
.sheet th,.sheet td{border:1px solid #c9ced8;padding:5px 7px;vertical-align:top;text-align:left}
.sheet th{background:#2f4a6d;color:#fff;font-weight:700;position:sticky;top:0}
.sheet tr:nth-child(even) td{background:#f6f7f9}
.sheet td.name{font-weight:700}.sheet td.name small{display:block;font-weight:400;color:var(--mute)}
.sheet b{color:#b3261e}.sheet span.src{font-size:11px;color:var(--mute)}
.sheet figure{margin:4px 0 0}.sheet figure img{border-radius:3px;max-height:none}
.sheet table.wide{min-width:900px}.sheet td.loc{background:#eef2f8;font-weight:700}.sheet td.loc small{display:block;font-weight:400;color:var(--mute)}
.sheet td.muted{color:var(--mute);vertical-align:middle}.sheet figure.fr{float:right;width:30%;max-width:220px;margin:2px 0 4px 10px}.sheet figure.fr figcaption{font-size:11px;margin-top:2px}
.sheet .note{padding:8px 10px;font-size:13.5px}.sheet .note b{color:var(--ink)}.sheet .note ul{margin:4px 0 0;padding-left:20px}
figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);font-size:13.5px}
</style></head><body>

 같은 개념을 다른 증례·형식으로 0"}, {"id": 13, "title": "ⅩⅣ. 뇌혈관질환 2", "prof": "김재호", "mode": "repeat", "why": "이전 연도 같은 개념 문항과 비교 6쌍: 거의 그대로 6, 보기·수치·발문만 변경 0, 같은 개념을 다른 증례·형식으로 0"}]}, "summary": {"updated": "2026-11-24", "note": "26 학습부 검안본을 바탕으로 교수님별로 정리한 표입니다. 표는 글자로 되어 있어 확대해도 선명하고, 휴대폰에서는 표 전체를 화면에 맞춰 줄여 보여 주고, 표를 누르면 두 손가락으로 확대해 볼 수 있습니다.", "profs": [{"prof": "안지예", "items": [{"title": "소아 경련성 질환 — 발생시기·임상양상·EEG·치료", "html": "summary/ahn-peds-seizure.html", "img": "summary/ahn-peds-seizure.jpg", "pdf": "summary/ahn-peds-seizure.pdf", "src": "26 학습부 08번 · 소아 경련성 질환 (EEG는 2022·2023·2025 기출 그림)", "body": "<table class=\"w5\"><colgroup><col style=\"width:10%\"><col style=\"width:7.5%\"><col style=\"width:30%\"><col style=\"width:28%\"><col style=\"width:24.5%\"><\/colgroup><thead><tr><th>질환<\/th><th>발생시기<\/th><th>임상양상<\/th><th>EEG<\/th><th>치료<\/th><\/tr><\/thead><tbody><tr><td class=\"name\">열성경련<small>Febrile seizure<\/small><\/td><td>3개월~5세<\/td><td>CNS 감염·대사질환 없이 <b>열과 동반<\/b>. 첫 경련이면 CSF로 감염 r/o.<br><b>Complex<\/b>: 24h 내 2회↑/focal/15분↑/Todd 마비 → 뇌전증 9%(simple 1%). 이행↑: complex FS, <b>뇌전증<\/b> 가족력, 발달지연, 기저 신경질환<\/td><td>정상<\/td><td>5분 이내: 관찰. 5분↑: diazepam 또는 lorazepam 0.1 mg/kg IV/IM. 예방약 X(잦으면 발열 시 PRN diazepam)<\/td><\/tr><tr><td class=\"name\">West syndrome<small>영아연축<\/small><\/td><td>3~9개월<br>(보통 6~7개월)<\/td><td>Spasm이 7~10초 간격 <b>cluster<\/b>로 반복(Salaam attack). 2/3 기저질환(<b>TS<\/b>, HIE, CMV, 기형). 2/3는 LGS로 진행<\/td><td><b>Hypsarrhythmia<\/b> (고진폭 부정뇌파) <span class=\"src\">(2022 기출 17번)<\/span><figure><img src=\"summary/eeg-west.jpg\" alt=\"2022 기출 17번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>ACTH·prednisolone, vigabatrin<\/b> (TS 있으면 vigabatrin 먼저). 무반응: topiramate, VPA 등 / ketogenic diet<\/td><\/tr><tr><td class=\"name\">Dravet syndrome<\/td><td>영아기<\/td><td>정상 발달 → 반복 complex FS 후 myoclonic 등 발작, 발달지연. <b>SCN1A<\/b>(80~90%)<\/td><td>초기 정상 → spike wave burst, polyspike and wave<\/td><td>AED 반응 나쁨. VPA, clobazam, stiripentol, fenfluramine, BDZ<\/td><\/tr><tr><td class=\"name\">Lennox-Gastaut syndrome<small>LGS<\/small><\/td><td>1~6세<\/td><td>여러 발작이 하루 여러 번: <b>tonic<\/b>(가장 특징적), atypical absence, myoclonic, atonic. 지능 저하, 평생 지속. <b>영아연축 과거력<\/b><\/td><td><b>1.5~2.5 Hz slow spike-and-wave<\/b> <span class=\"src\">(2022 기출 49번)<\/span><figure><img src=\"summary/eeg-lgs.jpg\" alt=\"2022 기출 49번 EEG\" loading=\"lazy\"><\/figure><\/td><td>AED 반응 가장 나쁨, BDZ 피함. VPA, lamotrigine, rufinamide 등 / ketogenic diet / callosotomy / VNS / CBD oil<\/td><\/tr><tr><td class=\"name\">Childhood absence epilepsy<small>CAE<\/small><\/td><td>6~7세<br>사춘기에 소실<\/td><td>약 10초 멍해졌다 바로 회복, 기억 못함. <b>과호흡<\/b>으로 유발. GTC 40%<\/td><td><b>3 Hz spike-wave<\/b> (generalized) <span class=\"src\">(2025 기출 39번)<\/span><figure><img src=\"summary/eeg-cae.jpg\" alt=\"2025 기출 39번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>Ethosuximide<\/b>(CAE에만 사용), VPA<\/td><\/tr><tr><td class=\"name\">BCECTS<small>Benign Rolandic epilepsy<\/small><\/td><td>3~13세<br>15세 이후 소실<\/td><td>소아기 가장 흔함, 예후 최고. <b>잠든 직후<\/b> 얼굴 일측·입 주위 부분발작, 침 흘림 → 전신화 가능<\/td><td><b>Centrotemporal spike<\/b>, 수면 중 (bipolar montage) <span class=\"src\">(2025 기출 32번)<\/span><figure><img src=\"summary/eeg-bcects.jpg\" alt=\"2025 기출 32번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>Oxcarbazepine<\/b>, carbamazepine (단일 약으로 조절)<\/td><\/tr><tr><td class=\"name\">Juvenile myoclonic epilepsy<small>JME<\/small><\/td><td>10세 이후<br>청소년기<\/td><td><b>아침에 깰 때<\/b> 상지 myoclonic(물건 떨어뜨림), GTC 50~80%, absence 15~30%. 지능 정상. <b>수면박탈·음주<\/b>로 유발<\/td><td><b>4~6 Hz generalized spike-wave<\/b>, photic 자극에 유발 <span class=\"src\">(2023 기출 26번)<\/span><figure><img src=\"summary/eeg-jme.jpg\" alt=\"2023 기출 26번 EEG\" loading=\"lazy\"><\/figure><\/td><td>VPA(가임기 주의), levetiracetam, topiramate. 끊으면 재발<\/td><\/tr><tr><td class=\"name\">신생아 경련<small>Neonatal seizure<\/small><\/td><td>1개월 미만<\/td><td>대부분 acute symptomatic: <b>HIE 1위<\/b>, ICH·경색, 감염, 저혈당·저Ca. <b>Subtle seizure<\/b>(페달링) 많음<\/td><td>Bedside EEG로 확인<\/td><td>원인 교정 → IV <b>phenobarbital<\/b> 20 mg/kg(반복) → phenytoin·levetiracetam<\/td><\/tr><\/tbody><\/table>\n"}, {"title": "소아 발달 시기별 원시 반사", "html": "summary/ahn-primitive-reflex.html", "img": "summary/ahn-primitive-reflex.jpg", "pdf": "summary/ahn-primitive-reflex.pdf", "src": "26 학습부 01번 · 소아 신경계 진단과 중추신경계 발달 이상", "body": "<table class=\"w4\"><colgroup><col style=\"width:18%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:58%\"><\/colgroup><thead><tr><th>반사<\/th><th>출현<\/th><th>소실<\/th><th>형태 (유발 → 반응)<\/th><\/tr><\/thead><tbody><tr><td class=\"name\">Stepping<\/td><td>출생 시<\/td><td>1개월<\/td><td>세워서 발바닥을 바닥에 닿게 하면 걸으려는 듯 발을 내딛음<\/td><\/tr><tr><td class=\"name\">Trunk incurvation<\/td><td>출생 시<\/td><td>1~2개월<\/td><td>엎드린 아이 등 한쪽을 자극하면 몸통이 자극받은 쪽으로 구부러짐<\/td><\/tr><tr><td class=\"name\">Crossed extension<\/td><td>출생 시<\/td><td>1~2개월<\/td><td>한쪽 다리를 편 채 발바닥을 자극하면 반대쪽 다리도 펴짐<\/td><\/tr><tr><td class=\"name\">Rooting<\/td><td>출생 시<\/td><td>3개월<\/td><td>볼·입가에 손가락(유두)이 닿으면 그쪽으로 고개를 돌려 따라가 빨려 함<\/td><\/tr><tr><td class=\"name\">Sucking<\/td><td>출생 시<\/td><td>3개월<\/td><td>입 안에 손가락·젖꼭지를 넣으면 쪽쪽 빪<\/td><\/tr><tr><td class=\"name\">Moro<\/td><td>출생 시<\/td><td>3개월<\/td><td>안고 있다 갑자기 내리면 양팔을 뻗었다가 몸쪽으로 움츠림. <b>한쪽만<\/b> → 쇄골·상완골 골절, 상완신경얼기 손상, 반대쪽 뇌반구 문제<\/td><\/tr><tr><td class=\"name\">Grasp<\/td><td>출생 시<\/td><td>3개월<\/td><td>손바닥에 손가락을 대면 꽉 쥠<\/td><\/tr><tr><td class=\"name\">Placing<\/td><td>출생 시<\/td><td>3~4개월<\/td><td>발등이 선반 모서리에 닿으면 발을 들어 올려 딛음<\/td><\/tr><tr><td class=\"name\">Tonic neck<\/td><td>출생 시<\/td><td>3~4개월<\/td><td>고개를 한쪽으로 돌리면 그쪽 팔은 펴고 반대쪽 팔은 굽힘 = <b>펜싱 자세<\/b>. 소실돼야 양손을 모아 4개월에 물건을 잡음<\/td><\/tr><tr><td class=\"name\"><b>Landau<\/b><\/td><td>3~4개월<\/td><td><b>1~2년<\/b><\/td><td>배를 받쳐 엎드린 자세로 들면 목을 들고 다리를 쭉 뻗음 — \"슈퍼맨처럼 난다\". <b>가장 늦게 소실<\/b>(혼자 걸을 때까지 남음)<\/td><\/tr><tr><td class=\"name\"><b>Parachute<\/b><\/td><td>8~9개월<\/td><td><b>평생 지속<\/b><\/td><td>들어 올렸다 머리부터 앞으로 떨어뜨리면 팔을 뻗어 머리를 보호. <b>가장 늦게 출현<\/b>, 대칭성 확인(한쪽만 → 그쪽 팔 근력 이상)<\/td><\/tr><\/tbody><\/table><div class=\"note\"><b style=\"color:#1d1d1f\">시기별 요약<\/b><ul>\n<li>신생아: Landau·Parachute 외 모두 있음 → Stepping 1개월, Trunk incurvation·Crossed extension 1~2개월 소실<\/li>\n<li>3~4개월: Rooting·Sucking·Moro·Grasp·Placing·Tonic neck 소실 / Landau 출현<\/li>\n<li>8~9개월: Parachute 출현 · 1~2세: Landau 소실 → 이후 Parachute만 남음(정상 3세 기출)<\/li>\n<li>함께 볼 것: Babinski 첫 1~2개월 정상, triceps jerk 첫 2~3개월 잘 안 나옴, 소아 ankle clonus 2~3회 정상(10회↑ 병적)<\/li>\n<\/ul><\/div>\n"}, {"title": "소아 말초신경·근육 질환 — 병변 위치·임상양상·치료", "html": "summary/ahn-peripheral-muscle.html", "img": "summary/ahn-peripheral-muscle.jpg", "pdf": "summary/ahn-peripheral-muscle.pdf", "src": "26 학습부 17번 · 소아 말초신경, 근육질환 (사진은 기출 그림)", "body": "<table class=\"w4 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:10%\"><col style=\"width:54%\"><col style=\"width:27%\"><\/colgroup><thead><tr><th>병변 위치<\/th><th>질환<\/th><th>임상양상 · 검사<\/th><th>치료<\/th><\/tr><\/thead><tbody><tr><td class=\"loc\" rowspan=\"1\">① 운동신경세포<small>척수 전각 (anterior horn cell)<\/small><\/td><td class=\"name\">SMA<small>Spinal muscular atrophy<\/small><\/td><td><figure class=\"fr\" style=\"width:20mm\"><img src=\"summary/nm-sma-frogleg.jpg\" alt=\"2025 기출 29번 · frog-leg\" loading=\"lazy\"><figcaption>2025 기출 29번 · frog-leg<\/figcaption><\/figure><b>SMN1<\/b> 결실(5q, AR) → SMN 단백 부족 → 운동신경 apoptosis. <b>1형<\/b>(Werdnig-Hoffmann): 심한 hypotonia, <b>DTR 소실, 혀 fasciculation<\/b>, 호흡곤란·수유장애, <b>frog-leg posture<\/b>, 치료 안 하면 65%↑ 2세 전 사망. 2형: 6개월 이후 못 걸음, 성인기 생존. 3형: 보행 가능, 근위부 약화. 중증도 = SMN2 copy 수.<br>검사: CK 정상~경미↑, NCV 정상, EMG fibrillation, 근생검 grouped atrophy → 확진 <b>SMN1 결실(MLPA)<\/b><\/td><td><b>Nusinersen<\/b>(Spinraza, 척수강내)·<b>risdiplam<\/b>(Evrysdi, 경구): SMN2 exon 7 skipping 차단 → SMN2를 SMN1처럼. <b>Onasemnogene abeparvovec<\/b>(Zolgensma): AAV9로 SMN1 대체, IV 1회, 6개월 미만. 보존적 관리(호흡·척추)<\/td><\/tr><tr><td class=\"loc\" rowspan=\"3\">② 말초신경<\/td><td class=\"name\">Bell palsy<\/td><td>바이러스 감염 약 2주 후(HSV, VZV, EBV, Lyme, mumps) 급성 <b>편측 CN VII<\/b> 마비. 병변측 얼굴 전체 마비, <b>이마 주름 못 잡음<\/b>(중추성은 이마 보존 → MRI). 눈 안 감김, 혀 앞 2/3 미각 저하<\/td><td><b>72시간 내 prednisone<\/b> 1 mg/kg 7~10일 + acyclovir/valacyclovir, 눈 보호(점안액). 소아 85%↑ 완전 회복<\/td><\/tr><tr><td class=\"name\">GBS<small>Guillain-Barré syndrome<\/small><\/td><td>선행 감염(<b>Campylobacter<\/b>, mycoplasma)·예방접종 후 myelin 자가항체(AIDP). 4~9세. 말단부터 <b>ascending symmetric paralysis<\/b>, <b>DTR 초기 소실<\/b>, bulbar·호흡근 마비, 뇌신경 마비(facial 최다). 4주 내 최고점.<br>검사: CSF <b>albuminocytologic dissociation<\/b>(WBC 정상, 단백↑), 운동신경 전도 속도 저하<\/td><td>무조건 <b>입원 관찰<\/b>(호흡·자율신경). 빠르게 진행하면 <b>IVIG<\/b> 400 mg/kg × 5일. 혈장교환(소아 잘 안 함). <b>스테로이드 효과 없음<\/b>. 역순으로 회복, 6개월~1년<\/td><\/tr><tr><td class=\"name\">Charcot-Marie-Tooth<small>HMSN type 1<\/small><\/td><td>가장 흔한 유전 신경병증. PMP22 중복(17p11.2), AD. 운동·감각 신경 전도 저하, 자주 넘어짐 → <b>foot drop(steppage gait)<\/b>, 발 변형. 주로 성인 발병<\/td><td>치료 언급 없음 (가볍게 소개)<\/td><\/tr><tr><td class=\"loc\" rowspan=\"1\">③ 신경근접합부<small>NMJ<\/small><\/td><td class=\"name\">중증근무력증<small>Myasthenia gravis<\/small><\/td><td><figure class=\"fr\" style=\"width:32mm\"><img src=\"summary/nm-mg-ptosis.jpg\" alt=\"2020 기출 35번 · 안검하수\" loading=\"lazy\"><figcaption>2020 기출 35번 · 안검하수<\/figcaption><\/figure><b>AChR 자가항체<\/b>(청소년 30~50%, MuSK·LRP4). 운동하면 빨리 지침, <b>아침 경미·저녁 악화, 낮잠 후 회복<\/b>. 눈꺼풀 처짐·복시, 영아는 수유곤란. 일과성 신생아 MG(산모 항체, 약 2개월). 선천 MG: AChR 자체 결핍, 항체 없음.<br>검사: <b>반복 신경자극 검사<\/b>(gold standard), <b>Tensilon test<\/b>(edrophonium, 부작용엔 atropine), AChR 항체. CK·NCV 정상<\/td><td><b>Pyridostigmine<\/b>·neostigmine(long-acting anti-ChE) 1st → 전신·bulbar 침범 시 스테로이드 → 면역억제제. 흉선 비대·약물 불응: <b>thymectomy<\/b>. 급격한 악화: 혈장교환. <b>마취 시 신경근차단제 주의<\/b><\/td><\/tr><tr><td class=\"loc\" rowspan=\"2\">④ 근육<\/td><td class=\"name\">DMD<small>Duchenne MD<\/small><small>BMD: Becker<\/small><\/td><td><figure class=\"fr\" style=\"width:36mm\"><img src=\"summary/nm-dmd-gowers.jpg\" alt=\"안지예P 기출 · Gower sign\" loading=\"lazy\"><figcaption>안지예P 기출 · Gower sign<\/figcaption><\/figure><b>Dystrophin<\/b> 결핍(Xp21.2, <b>XR<\/b>), 거의 남아. 걷기 시작 후 motor delay, 근위부 침범: <b>lordosis, waddling gait, Gower sign, 장딴지 가성비대<\/b>. 10대 초 보행 불가, 심근병증(50~80%)·호흡부전으로 10대 말~20대 초 사망. 15% 지능장애.<br>검사: <b>CK 1~2만<\/b>(말기엔 정상화), MLPA del/dup. 보인자 엄마 → 아들 50% 환자, 딸 50% 보인자.<br>BMD: 같은 유전자(in-frame, 짧은 dystrophin), 휠체어 16세 이후, 40세까지 생존<\/td><td><b>Corticosteroid<\/b>(0.75 mg/kg): 근력 악화를 늦춤. 물리치료·보조기, 척추측만 수술, 심근병증 약(Lasix·ACEi), 야간 인공호흡. Exon skipping 유전자 치료는 연구 중<\/td><\/tr><tr><td class=\"name\">기타 근육 질환<small>근 디스트로피 · 선천 근병증<\/small><\/td><td><b>Emery-Dreifuss<\/b>: emerin·lamin A/C, 5~15세 <b>초기 관절 구축<\/b>(목·팔꿈치·발목), 방실차단 급사 · <b>Limb-girdle<\/b>: 골반·어깨 이음부, AD(성인·가벼움)/AR(소아·심함) · <b>Facioscapulohumeral<\/b>: AD, DUX4, 얼굴·어깨, <b>scapular winging<\/b> · <b>Congenital MD<\/b>: 출생부터 floppy + 눈 이상 + CNS 이상(polymicrogyria, cobblestone) · <b>Myotonic<\/b>: AD, DM1(DMPK CTG 반복), 근병증 얼굴, 높은 입천장, <b>percussion myotonia<\/b>, 백내장 · <b>선천 근병증<\/b>: nemaline·central core 등 구조 이상, 출생부터 floppy, 근생검·유전자로 진단<\/td><td rowspan=\"1\" class=\"muted\">치료 언급 없음<br>(\"이런 게 있다\" 정도만)<\/td><\/tr><\/tbody><\/table><div class=\"note\"><b style=\"color:#1d1d1f\">위치 구분 단서<\/b> — 의식 저하·DTR 항진이면 중추성 / 혀 fasciculation·DTR 소실·CK 정상이면 <b>운동신경세포<\/b> / 감각장애·NCV 저하·DTR 소실이면 <b>말초신경<\/b> / 일중 변동·피로·anti-ChE 반응이면 <b>NMJ<\/b> / CK 고도 상승·근위부 약화면 <b>근육<\/b><\/div>\n"}]}]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,S=D.summary||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 교수님 순서는 퀴즈의 파트 순서를 따른다 */
const byP=Object.fromEntries((S.profs||[]).map(p=>[p.prof,p]));
const profs=[...new Set(M.ch.map(c=>c.prof))].filter(p=>byP[p]&&(byP[p].items||[]).length);
/* 표(body: 저장소 안 HTML 조각)가 있으면 글자 그대로 보여 주고, 없으면 사진. PDF·이미지는 받기 링크로 */
const fig=x=>{const dl=[x.pdf&&`<a href="${esc(x.pdf)}" download>PDF 받기</a>`,x.img&&x.body&&`<a href="${esc(x.img)}" download>이미지 받기</a>`].filter(Boolean).join('');
 const main=x.body?`<div class="sheet"><div class="inner">${x.body}</div></div><div class="fithint">표 전체를 화면에 맞춰 줄였습니다 · <b>눌러서 크게 보기</b>(두 손가락으로 확대)</div>`:`<a href="${esc(x.img)}" target="_blank" rel="noopener"><img src="${esc(x.img)}" alt="${esc(x.title)}" loading="lazy"></a>`;
 return `<figure><h3>${esc(x.title)}</h3>${dl?`<div class="dl">${dl}</div>`:''}${main}${x.src?`<figcaption>${esc(x.src)}</figcaption>`:''}</figure>`};
const lec=p=>M.ch.filter(c=>c.prof===p).map(c=>c.title).join(' · ');
document.getElementById('app').innerHTML=`<div class="panel sm"><h2>교수님별 요약자료</h2><div class="src">${esc(S.note||'')}${S.updated?` (${esc(S.updated)} 정리)`:''}</div>
${profs.length?profs.map(p=>{const it=byP[p].items;return `<details><summary>${esc(p)} 교수님 <small>${esc(lec(p))} · 정리표 ${it.length}개</small></summary>
${it.map(fig).join('')}</details>`}).join(''):'<div class="empty">아직 올라온 요약자료가 없습니다.</div>'}</div>`;
/* ── 표 맞춤: 화면이 표의 원래 너비(표 min-width, 기본 900px)보다 좁으면 그 너비로 그린 뒤 비율대로 줄인다 ── */
const designW=t=>{const m=parseFloat(getComputedStyle(t).minWidth);return m>0?m:900};
function fitAll(){document.querySelectorAll('#app .sheet').forEach(sh=>{
 const inner=sh.firstElementChild,t=inner.querySelector('table');if(!t)return;
 inner.style.width='';inner.style.transform='';sh.style.height='';
 const W=designW(t),cw=sh.clientWidth;
 if(!cw||cw>=W){sh.classList.remove('fit');return}
 const k=cw/W;inner.style.width=W+'px';inner.style.transform=`scale(${k})`;
 sh.style.height=Math.ceil(inner.offsetHeight*k)+'px';sh.classList.add('fit');sh.dataset.k=k});}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitAll,120)});
document.querySelectorAll('#app details').forEach(d=>d.addEventListener('toggle',fitAll));
document.querySelectorAll('#app .sheet img').forEach(i=>{if(!i.complete)i.addEventListener('load',fitAll,{once:true})});
fitAll();

/* ── 크게 보기 ── */
const zv=document.getElementById('zv'),vp=zv.querySelector('.vp'),pg=zv.querySelector('.pg');
let z=1,zFit=1,W0=900,H0=0;
function setZ(nz,cx,cy){ // (cx,cy): 화면 안에서 고정할 점
 nz=Math.max(zFit*0.6,Math.min(4,nz));
 const r=vp.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;
 const px=(vp.scrollLeft+cx)/z,py=(vp.scrollTop+cy)/z;
 z=nz;pg.style.transform=`scale(${z})`;pg.style.width=W0+'px';
 pg.style.marginBottom=(H0*z-H0)+'px';pg.style.marginRight=(W0*z-W0)+'px';
 vp.scrollLeft=px*z-cx;vp.scrollTop=py*z-cy;}
function openZ(sh,title){
 pg.innerHTML=`<div class="sheet">${sh.firstElementChild.innerHTML}</div>`;zv.querySelector('.t').textContent=title;
 zv.classList.add('on');document.body.classList.add('zv-open');
 W0=designW(pg.querySelector('table'));pg.style.transform='';pg.style.width=W0+'px';pg.style.margin='0';H0=pg.offsetHeight;
 zFit=Math.min(1,vp.clientWidth/W0);z=1;setZ(zFit,0,0);vp.scrollLeft=0;vp.scrollTop=0;
 pg.querySelectorAll('img').forEach(i=>{i.style.cursor='zoom-in';i.addEventListener('click',e=>{e.stopPropagation();window.open(i.src,'_blank','noopener')})});
 history.pushState({zv:1},'');}
function closeZ(back){if(!zv.classList.contains('on'))return;zv.classList.remove('on');document.body.classList.remove('zv-open');pg.innerHTML='';if(back!==false&&history.state&&history.state.zv)history.back()}
addEventListener('popstate',()=>closeZ(false));
addEventListener('keydown',e=>{if(e.key==='Escape')closeZ()});
zv.querySelector('.bar').addEventListener('click',e=>{const a=e.target.dataset.z;if(!a)return;
 if(a==='close')closeZ();else if(a==='in')setZ(z*1.4);else if(a==='out')setZ(z/1.4);else if(a==='fit'){setZ(zFit,0,0);vp.scrollLeft=0}});
/* 두 손가락 확대(직접 처리 — 페이지 전체가 커지지 않게) */
let p0=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
vp.addEventListener('touchstart',e=>{if(e.touches.length===2){const r=vp.getBoundingClientRect();p0={d:dist(e.touches),z,cx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}},{passive:true});
vp.addEventListener('touchmove',e=>{if(p0&&e.touches.length===2){e.preventDefault();setZ(p0.z*dist(e.touches)/p0.d,p0.cx,p0.cy)}},{passive:false});
vp.addEventListener('touchend',e=>{if(e.touches.length<2)p0=null});
/* 트랙패드 확대(ctrl+휠) */
vp.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();const r=vp.getBoundingClientRect();setZ(z*Math.exp(-e.deltaY/200),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
/* 두 번 탭: 맞춤 ↔ 2배 */
let lastTap=0;vp.addEventListener('touchend',e=>{if(e.changedTouches.length!==1||e.touches.length)return;const n=Date.now();
 if(n-lastTap<300){const r=vp.getBoundingClientRect(),t=e.changedTouches[0];setZ(z>zFit*1.3?zFit:Math.max(1,zFit*2),t.clientX-r.left,t.clientY-r.top);lastTap=0}else lastTap=n});
/* 맞춤 상태의 표를 누르면 크게 보기 */
document.getElementById('app').addEventListener('click',e=>{const sh=e.target.closest('.sheet');if(!sh)return;
 const img=e.target.closest('img');
 if(sh.classList.contains('fit')){e.preventDefault();openZ(sh,sh.closest('figure')?.querySelector('h3')?.textContent||'정리표');return}
 if(img)window.open(img.src,'_blank','noopener');});
document.querySelectorAll('#app .sheet:not(.fit) img').forEach(i=>{i.style.cursor='zoom-in';i.title='눌러서 크게 보기'});
</script>
</body></html>
