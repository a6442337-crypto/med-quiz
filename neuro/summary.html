<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>신경계학 요약자료</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2633;--mute:#6b7385;--line:#e3e6ee;--pri:#1d3c6e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--pri);color:#fff;padding:14px 18px}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
.back{color:#fff;opacity:.8;font-size:12.5px;text-decoration:none}.back:hover{opacity:1}
main{max-width:1140px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.sm h2{font-size:16px;margin:0 0 4px;color:var(--pri)}.sm .src{font-size:12px;color:var(--mute);margin-bottom:8px}
.sm details{border-top:1px solid var(--line);padding:8px 0}.sm summary{cursor:pointer;font-weight:500;font-size:14px}
.sm summary small{color:var(--mute);font-weight:400}
figure{margin:12px 0 18px}figure h3{font-size:14px;margin:0 0 6px}
figure .dl{display:flex;gap:6px;margin:0 0 8px}figure .dl a{font-size:12px;color:var(--pri);border:1px solid var(--pri);border-radius:6px;padding:2px 9px;text-decoration:none}
.sheet{overflow:hidden;border:1px solid var(--line);border-radius:6px;position:relative}
/* 좁은 화면: 표를 원래 너비로 그린 뒤 화면 너비에 맞게 통째로 줄인다(zoom). 글자라서 확대해도 선명하다 */
.sheet.fit{cursor:zoom-in}.sheet.fit .inner{transform-origin:0 0}
.fithint{display:none;font-size:12px;color:var(--mute);margin:4px 0 0}.fithint b{color:var(--pri);font-weight:500}
.sheet.fit+.fithint{display:block}
/* 크게 보기: 전체 화면에서 두 손가락 확대·끌어서 이동 */
#zv{position:fixed;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
#zv.on{display:flex}
#zv .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--pri);color:#fff;font-size:13px}
#zv .bar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#zv .bar button{font:inherit;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:5px 10px;min-width:36px}
#zv .vp{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#eef0f4;overscroll-behavior:contain}
#zv .pg{background:#fff;margin:0;transform-origin:0 0}
#zv .sheet{border:0;border-radius:0;overflow:visible}#zv .sheet th,.sheet.fit th{position:static}
body.zv-open{overflow:hidden}
.sheet table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:13px;line-height:1.45}
.sheet table.w5{min-width:900px}.sheet table.w4{min-width:640px}
.sheet th,.sheet td{border:1px solid #c9ced8;padding:5px 7px;vertical-align:top;text-align:left}
.sheet th{background:#2f4a6d;color:#fff;font-weight:700;position:sticky;top:0}
.sheet tr:nth-child(even) td{background:#f6f7f9}
.sheet td.name{font-weight:700}.sheet td.name small{display:block;font-weight:400;color:var(--mute)}
.sheet b{color:#b3261e}.sheet span.src{font-size:11px;color:var(--mute)}
.sheet figure{margin:4px 0 0}.sheet figure img{border-radius:3px;max-height:none}
.sheet table.wide{min-width:900px}.sheet td.loc{background:#eef2f8;font-weight:700}.sheet td.loc small{display:block;font-weight:400;color:var(--mute)}
.sheet td.muted{color:var(--mute);vertical-align:middle}.sheet figure.fr{float:right;width:30%;max-width:220px;margin:2px 0 4px 10px}.sheet figure.fr figcaption{font-size:11px;margin-top:2px}
.sheet .note{padding:8px 10px;font-size:13.5px}.sheet .note b{color:var(--ink)}.sheet .note ul{margin:4px 0 0;padding-left:20px}
figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);font-size:13.5px}
</style></head><body>

 같은 개념을 다른 증례·형식으로 0"}, {"id": 13, "title": "ⅩⅣ. 뇌혈관질환 2", "prof": "김재호", "mode": "repeat", "why": "이전 연도 같은 개념 문항과 비교 6쌍: 거의 그대로 6, 보기·수치·발문만 변경 0, 같은 개념을 다른 증례·형식으로 0"}]}, "summary": {"updated": "2026-11-28", "note": "26 학습부 검안본을 바탕으로 교수님별로 정리한 표입니다. 표는 글자로 되어 있어 확대해도 선명하고, 휴대폰에서는 표 전체를 화면에 맞춰 줄여 보여 주고, 표를 누르면 두 손가락으로 확대해 볼 수 있습니다.", "profs": [{"prof": "안지예", "items": [{"title": "소아 경련성 질환 — 발생시기·임상양상·EEG·치료", "html": "summary/ahn-peds-seizure.html", "img": "summary/ahn-peds-seizure.jpg", "pdf": "summary/ahn-peds-seizure.pdf", "src": "26 학습부 08번 · 소아 경련성 질환 (EEG는 2022·2023·2025 기출 그림)", "body": "<table class=\"w5\"><colgroup><col style=\"width:10%\"><col style=\"width:7.5%\"><col style=\"width:30%\"><col style=\"width:28%\"><col style=\"width:24.5%\"><\/colgroup><thead><tr><th>질환<\/th><th>발생시기<\/th><th>임상양상<\/th><th>EEG<\/th><th>치료<\/th><\/tr><\/thead><tbody><tr><td class=\"name\">열성경련<small>Febrile seizure<\/small><\/td><td>3개월~5세<\/td><td>CNS 감염·대사질환 없이 <b>열과 동반<\/b>. 첫 경련이면 CSF로 감염 r/o.<br><b>Complex<\/b>: 24h 내 2회↑/focal/15분↑/Todd 마비 → 뇌전증 9%(simple 1%). 이행↑: complex FS, <b>뇌전증<\/b> 가족력, 발달지연, 기저 신경질환<\/td><td>정상<\/td><td>5분 이내: 관찰. 5분↑: diazepam 또는 lorazepam 0.1 mg/kg IV/IM. 예방약 X(잦으면 발열 시 PRN diazepam)<\/td><\/tr><tr><td class=\"name\">West syndrome<small>영아연축<\/small><\/td><td>3~9개월<br>(보통 6~7개월)<\/td><td>Spasm이 7~10초 간격 <b>cluster<\/b>로 반복(Salaam attack). 2/3 기저질환(<b>TS<\/b>, HIE, CMV, 기형). 2/3는 LGS로 진행<\/td><td><b>Hypsarrhythmia<\/b> (고진폭 부정뇌파) <span class=\"src\">(2022 기출 17번)<\/span><figure><img src=\"summary/eeg-west.jpg\" alt=\"2022 기출 17번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>ACTH·prednisolone, vigabatrin<\/b> (TS 있으면 vigabatrin 먼저). 무반응: topiramate, VPA 등 / ketogenic diet<\/td><\/tr><tr><td class=\"name\">Dravet syndrome<\/td><td>영아기<\/td><td>정상 발달 → 반복 complex FS 후 myoclonic 등 발작, 발달지연. <b>SCN1A<\/b>(80~90%)<\/td><td>초기 정상 → spike wave burst, polyspike and wave<\/td><td>AED 반응 나쁨. VPA, clobazam, stiripentol, fenfluramine, BDZ<\/td><\/tr><tr><td class=\"name\">Lennox-Gastaut syndrome<small>LGS<\/small><\/td><td>1~6세<\/td><td>여러 발작이 하루 여러 번: <b>tonic<\/b>(가장 특징적), atypical absence, myoclonic, atonic. 지능 저하, 평생 지속. <b>영아연축 과거력<\/b><\/td><td><b>1.5~2.5 Hz slow spike-and-wave<\/b> <span class=\"src\">(2022 기출 49번)<\/span><figure><img src=\"summary/eeg-lgs.jpg\" alt=\"2022 기출 49번 EEG\" loading=\"lazy\"><\/figure><\/td><td>AED 반응 가장 나쁨, BDZ 피함. VPA, lamotrigine, rufinamide 등 / ketogenic diet / callosotomy / VNS / CBD oil<\/td><\/tr><tr><td class=\"name\">Childhood absence epilepsy<small>CAE<\/small><\/td><td>6~7세<br>사춘기에 소실<\/td><td>약 10초 멍해졌다 바로 회복, 기억 못함. <b>과호흡<\/b>으로 유발. GTC 40%<\/td><td><b>3 Hz spike-wave<\/b> (generalized) <span class=\"src\">(2025 기출 39번)<\/span><figure><img src=\"summary/eeg-cae.jpg\" alt=\"2025 기출 39번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>Ethosuximide<\/b>(CAE에만 사용), VPA<\/td><\/tr><tr><td class=\"name\">BCECTS<small>Benign Rolandic epilepsy<\/small><\/td><td>3~13세<br>15세 이후 소실<\/td><td>소아기 가장 흔함, 예후 최고. <b>잠든 직후<\/b> 얼굴 일측·입 주위 부분발작, 침 흘림 → 전신화 가능<\/td><td><b>Centrotemporal spike<\/b>, 수면 중 (bipolar montage) <span class=\"src\">(2025 기출 32번)<\/span><figure><img src=\"summary/eeg-bcects.jpg\" alt=\"2025 기출 32번 EEG\" loading=\"lazy\"><\/figure><\/td><td><b>Oxcarbazepine<\/b>, carbamazepine (단일 약으로 조절)<\/td><\/tr><tr><td class=\"name\">Juvenile myoclonic epilepsy<small>JME<\/small><\/td><td>10세 이후<br>청소년기<\/td><td><b>아침에 깰 때<\/b> 상지 myoclonic(물건 떨어뜨림), GTC 50~80%, absence 15~30%. 지능 정상. <b>수면박탈·음주<\/b>로 유발<\/td><td><b>4~6 Hz generalized spike-wave<\/b>, photic 자극에 유발 <span class=\"src\">(2023 기출 26번)<\/span><figure><img src=\"summary/eeg-jme.jpg\" alt=\"2023 기출 26번 EEG\" loading=\"lazy\"><\/figure><\/td><td>VPA(가임기 주의), levetiracetam, topiramate. 끊으면 재발<\/td><\/tr><tr><td class=\"name\">신생아 경련<small>Neonatal seizure<\/small><\/td><td>1개월 미만<\/td><td>대부분 acute symptomatic: <b>HIE 1위<\/b>, ICH·경색, 감염, 저혈당·저Ca. <b>Subtle seizure<\/b>(페달링) 많음<\/td><td>Bedside EEG로 확인<\/td><td>원인 교정 → IV <b>phenobarbital<\/b> 20 mg/kg(반복) → phenytoin·levetiracetam<\/td><\/tr><\/tbody><\/table>\n"}, {"title": "소아 발달 시기별 원시 반사", "html": "summary/ahn-primitive-reflex.html", "img": "summary/ahn-primitive-reflex.jpg", "pdf": "summary/ahn-primitive-reflex.pdf", "src": "26 학습부 01번 · 소아 신경계 진단과 중추신경계 발달 이상", "body": "<table class=\"w4\"><colgroup><col style=\"width:18%\"><col style=\"width:12%\"><col style=\"width:12%\"><col style=\"width:58%\"><\/colgroup><thead><tr><th>반사<\/th><th>출현<\/th><th>소실<\/th><th>형태 (유발 → 반응)<\/th><\/tr><\/thead><tbody><tr><td class=\"name\">Stepping<\/td><td>출생 시<\/td><td>1개월<\/td><td>세워서 발바닥을 바닥에 닿게 하면 걸으려는 듯 발을 내딛음<\/td><\/tr><tr><td class=\"name\">Trunk incurvation<\/td><td>출생 시<\/td><td>1~2개월<\/td><td>엎드린 아이 등 한쪽을 자극하면 몸통이 자극받은 쪽으로 구부러짐<\/td><\/tr><tr><td class=\"name\">Crossed extension<\/td><td>출생 시<\/td><td>1~2개월<\/td><td>한쪽 다리를 편 채 발바닥을 자극하면 반대쪽 다리도 펴짐<\/td><\/tr><tr><td class=\"name\">Rooting<\/td><td>출생 시<\/td><td>3개월<\/td><td>볼·입가에 손가락(유두)이 닿으면 그쪽으로 고개를 돌려 따라가 빨려 함<\/td><\/tr><tr><td class=\"name\">Sucking<\/td><td>출생 시<\/td><td>3개월<\/td><td>입 안에 손가락·젖꼭지를 넣으면 쪽쪽 빪<\/td><\/tr><tr><td class=\"name\">Moro<\/td><td>출생 시<\/td><td>3개월<\/td><td>안고 있다 갑자기 내리면 양팔을 뻗었다가 몸쪽으로 움츠림. <b>한쪽만<\/b> → 쇄골·상완골 골절, 상완신경얼기 손상, 반대쪽 뇌반구 문제<\/td><\/tr><tr><td class=\"name\">Grasp<\/td><td>출생 시<\/td><td>3개월<\/td><td>손바닥에 손가락을 대면 꽉 쥠<\/td><\/tr><tr><td class=\"name\">Placing<\/td><td>출생 시<\/td><td>3~4개월<\/td><td>발등이 선반 모서리에 닿으면 발을 들어 올려 딛음<\/td><\/tr><tr><td class=\"name\">Tonic neck<\/td><td>출생 시<\/td><td>3~4개월<\/td><td>고개를 한쪽으로 돌리면 그쪽 팔은 펴고 반대쪽 팔은 굽힘 = <b>펜싱 자세<\/b>. 소실돼야 양손을 모아 4개월에 물건을 잡음<\/td><\/tr><tr><td class=\"name\"><b>Landau<\/b><\/td><td>3~4개월<\/td><td><b>1~2년<\/b><\/td><td>배를 받쳐 엎드린 자세로 들면 목을 들고 다리를 쭉 뻗음 — \"슈퍼맨처럼 난다\". <b>가장 늦게 소실<\/b>(혼자 걸을 때까지 남음)<\/td><\/tr><tr><td class=\"name\"><b>Parachute<\/b><\/td><td>8~9개월<\/td><td><b>평생 지속<\/b><\/td><td>들어 올렸다 머리부터 앞으로 떨어뜨리면 팔을 뻗어 머리를 보호. <b>가장 늦게 출현<\/b>, 대칭성 확인(한쪽만 → 그쪽 팔 근력 이상)<\/td><\/tr><\/tbody><\/table><div class=\"note\"><b style=\"color:#1d1d1f\">시기별 요약<\/b><ul>\n<li>신생아: Landau·Parachute 외 모두 있음 → Stepping 1개월, Trunk incurvation·Crossed extension 1~2개월 소실<\/li>\n<li>3~4개월: Rooting·Sucking·Moro·Grasp·Placing·Tonic neck 소실 / Landau 출현<\/li>\n<li>8~9개월: Parachute 출현 · 1~2세: Landau 소실 → 이후 Parachute만 남음(정상 3세 기출)<\/li>\n<li>함께 볼 것: Babinski 첫 1~2개월 정상, triceps jerk 첫 2~3개월 잘 안 나옴, 소아 ankle clonus 2~3회 정상(10회↑ 병적)<\/li>\n<\/ul><\/div>\n"}, {"title": "소아 말초신경·근육 질환 — 병변 위치·임상양상·치료", "html": "summary/ahn-peripheral-muscle.html", "img": "summary/ahn-peripheral-muscle.jpg", "pdf": "summary/ahn-peripheral-muscle.pdf", "src": "26 학습부 17번 · 소아 말초신경, 근육질환 (사진은 기출 그림)", "body": "<table class=\"w4 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:10%\"><col style=\"width:54%\"><col style=\"width:27%\"><\/colgroup><thead><tr><th>병변 위치<\/th><th>질환<\/th><th>임상양상 · 검사<\/th><th>치료<\/th><\/tr><\/thead><tbody><tr><td class=\"loc\" rowspan=\"1\">① 운동신경세포<small>척수 전각 (anterior horn cell)<\/small><\/td><td class=\"name\">SMA<small>Spinal muscular atrophy<\/small><\/td><td><figure class=\"fr\" style=\"width:20mm\"><img src=\"summary/nm-sma-frogleg.jpg\" alt=\"2025 기출 29번 · frog-leg\" loading=\"lazy\"><figcaption>2025 기출 29번 · frog-leg<\/figcaption><\/figure><b>SMN1<\/b> 결실(5q, AR) → SMN 단백 부족 → 운동신경 apoptosis. <b>1형<\/b>(Werdnig-Hoffmann): 심한 hypotonia, <b>DTR 소실, 혀 fasciculation<\/b>, 호흡곤란·수유장애, <b>frog-leg posture<\/b>, 치료 안 하면 65%↑ 2세 전 사망. 2형: 6개월 이후 못 걸음, 성인기 생존. 3형: 보행 가능, 근위부 약화. 중증도 = SMN2 copy 수.<br>검사: CK 정상~경미↑, NCV 정상, EMG fibrillation, 근생검 grouped atrophy → 확진 <b>SMN1 결실(MLPA)<\/b><\/td><td><b>Nusinersen<\/b>(Spinraza, 척수강내)·<b>risdiplam<\/b>(Evrysdi, 경구): SMN2 exon 7 skipping 차단 → SMN2를 SMN1처럼. <b>Onasemnogene abeparvovec<\/b>(Zolgensma): AAV9로 SMN1 대체, IV 1회, 6개월 미만. 보존적 관리(호흡·척추)<\/td><\/tr><tr><td class=\"loc\" rowspan=\"3\">② 말초신경<\/td><td class=\"name\">Bell palsy<\/td><td>바이러스 감염 약 2주 후(HSV, VZV, EBV, Lyme, mumps) 급성 <b>편측 CN VII<\/b> 마비. 병변측 얼굴 전체 마비, <b>이마 주름 못 잡음<\/b>(중추성은 이마 보존 → MRI). 눈 안 감김, 혀 앞 2/3 미각 저하<\/td><td><b>72시간 내 prednisone<\/b> 1 mg/kg 7~10일 + acyclovir/valacyclovir, 눈 보호(점안액). 소아 85%↑ 완전 회복<\/td><\/tr><tr><td class=\"name\">GBS<small>Guillain-Barré syndrome<\/small><\/td><td>선행 감염(<b>Campylobacter<\/b>, mycoplasma)·예방접종 후 myelin 자가항체(AIDP). 4~9세. 말단부터 <b>ascending symmetric paralysis<\/b>, <b>DTR 초기 소실<\/b>, bulbar·호흡근 마비, 뇌신경 마비(facial 최다). 4주 내 최고점.<br>검사: CSF <b>albuminocytologic dissociation<\/b>(WBC 정상, 단백↑), 운동신경 전도 속도 저하<\/td><td>무조건 <b>입원 관찰<\/b>(호흡·자율신경). 빠르게 진행하면 <b>IVIG<\/b> 400 mg/kg × 5일. 혈장교환(소아 잘 안 함). <b>스테로이드 효과 없음<\/b>. 역순으로 회복, 6개월~1년<\/td><\/tr><tr><td class=\"name\">Charcot-Marie-Tooth<small>HMSN type 1<\/small><\/td><td>가장 흔한 유전 신경병증. PMP22 중복(17p11.2), AD. 운동·감각 신경 전도 저하, 자주 넘어짐 → <b>foot drop(steppage gait)<\/b>, 발 변형. 주로 성인 발병<\/td><td>치료 언급 없음 (가볍게 소개)<\/td><\/tr><tr><td class=\"loc\" rowspan=\"1\">③ 신경근접합부<small>NMJ<\/small><\/td><td class=\"name\">중증근무력증<small>Myasthenia gravis<\/small><\/td><td><figure class=\"fr\" style=\"width:32mm\"><img src=\"summary/nm-mg-ptosis.jpg\" alt=\"2020 기출 35번 · 안검하수\" loading=\"lazy\"><figcaption>2020 기출 35번 · 안검하수<\/figcaption><\/figure><b>AChR 자가항체<\/b>(청소년 30~50%, MuSK·LRP4). 운동하면 빨리 지침, <b>아침 경미·저녁 악화, 낮잠 후 회복<\/b>. 눈꺼풀 처짐·복시, 영아는 수유곤란. 일과성 신생아 MG(산모 항체, 약 2개월). 선천 MG: AChR 자체 결핍, 항체 없음.<br>검사: <b>반복 신경자극 검사<\/b>(gold standard), <b>Tensilon test<\/b>(edrophonium, 부작용엔 atropine), AChR 항체. CK·NCV 정상<\/td><td><b>Pyridostigmine<\/b>·neostigmine(long-acting anti-ChE) 1st → 전신·bulbar 침범 시 스테로이드 → 면역억제제. 흉선 비대·약물 불응: <b>thymectomy<\/b>. 급격한 악화: 혈장교환. <b>마취 시 신경근차단제 주의<\/b><\/td><\/tr><tr><td class=\"loc\" rowspan=\"2\">④ 근육<\/td><td class=\"name\">DMD<small>Duchenne MD<\/small><small>BMD: Becker<\/small><\/td><td><figure class=\"fr\" style=\"width:36mm\"><img src=\"summary/nm-dmd-gowers.jpg\" alt=\"안지예P 기출 · Gower sign\" loading=\"lazy\"><figcaption>안지예P 기출 · Gower sign<\/figcaption><\/figure><b>Dystrophin<\/b> 결핍(Xp21.2, <b>XR<\/b>), 거의 남아. 걷기 시작 후 motor delay, 근위부 침범: <b>lordosis, waddling gait, Gower sign, 장딴지 가성비대<\/b>. 10대 초 보행 불가, 심근병증(50~80%)·호흡부전으로 10대 말~20대 초 사망. 15% 지능장애.<br>검사: <b>CK 1~2만<\/b>(말기엔 정상화), MLPA del/dup. 보인자 엄마 → 아들 50% 환자, 딸 50% 보인자.<br>BMD: 같은 유전자(in-frame, 짧은 dystrophin), 휠체어 16세 이후, 40세까지 생존<\/td><td><b>Corticosteroid<\/b>(0.75 mg/kg): 근력 악화를 늦춤. 물리치료·보조기, 척추측만 수술, 심근병증 약(Lasix·ACEi), 야간 인공호흡. Exon skipping 유전자 치료는 연구 중<\/td><\/tr><tr><td class=\"name\">기타 근육 질환<small>근 디스트로피 · 선천 근병증<\/small><\/td><td><b>Emery-Dreifuss<\/b>: emerin·lamin A/C, 5~15세 <b>초기 관절 구축<\/b>(목·팔꿈치·발목), 방실차단 급사 · <b>Limb-girdle<\/b>: 골반·어깨 이음부, AD(성인·가벼움)/AR(소아·심함) · <b>Facioscapulohumeral<\/b>: AD, DUX4, 얼굴·어깨, <b>scapular winging<\/b> · <b>Congenital MD<\/b>: 출생부터 floppy + 눈 이상 + CNS 이상(polymicrogyria, cobblestone) · <b>Myotonic<\/b>: AD, DM1(DMPK CTG 반복), 근병증 얼굴, 높은 입천장, <b>percussion myotonia<\/b>, 백내장 · <b>선천 근병증<\/b>: nemaline·central core 등 구조 이상, 출생부터 floppy, 근생검·유전자로 진단<\/td><td rowspan=\"1\" class=\"muted\">치료 언급 없음<br>(\"이런 게 있다\" 정도만)<\/td><\/tr><\/tbody><\/table><div class=\"note\"><b style=\"color:#1d1d1f\">위치 구분 단서<\/b> — 의식 저하·DTR 항진이면 중추성 / 혀 fasciculation·DTR 소실·CK 정상이면 <b>운동신경세포<\/b> / 감각장애·NCV 저하·DTR 소실이면 <b>말초신경<\/b> / 일중 변동·피로·anti-ChE 반응이면 <b>NMJ<\/b> / CK 고도 상승·근위부 약화면 <b>근육<\/b><\/div>\n"}]}, {"prof": "안성환", "items": [{"title": "뇌혈관 병변 위치별 질환과 증상 — ICA·MCA·ACA·PCA·기저·척추·관통동맥", "html": "summary/ahn-stroke-localization.html", "img": "summary/ahn-stroke-localization.jpg", "pdf": "summary/ahn-stroke-localization.pdf", "src": "26 학습부 04·05번 · 뇌혈관 질환1·2 - 뇌졸중 (기출 포인트는 같은 학습부의 기출 해설, 회색은 작년 수업 내용)", "body": "<table class=\"w4 wide\"><colgroup><col style=\"width:13%\"><col style=\"width:14%\"><col style=\"width:45%\"><col style=\"width:28%\"><\/colgroup><thead><tr><th>병변 위치 (혈관)<\/th><th>질환 · 증후군<\/th><th>증상<\/th><th>감별 · 기출 포인트<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\" rowspan=\"3\">ICA<small>내경동맥 · 전방순환<\/small><\/td><td class=\"name\">Amaurosis fugax<small>일과성 흑암시 (ophthalmic a.)<\/small><\/td><td>갑자기 <b>한쪽 눈<\/b>이 어두워졌다가 회복(일측성 일과성 시력소실). 경동맥 협착 시 청진상 <b>carotid bruit<\/b>. ICA 폐색 자체는 MCA 영역 증상과 비슷하게 나타남(뇌의 약 2/3 담당)<\/td><td><b>동측<\/b> carotid 병변 의심<\/td><\/tr>\n<tr><td class=\"name\">Watershed infarction<small>경계영역 뇌경색<\/small><\/td><td>ACA–MCA 또는 MCA–PCA 공급 영역의 경계에 허혈. 측부순환이 있어도 관류가 모자라면 발생<\/td><td>ICA 협착·관류 저하 때<\/td><\/tr>\n<tr><td class=\"name\">Moyamoya disease<small>distal ICA → MCA 협착<\/small><\/td><td>젊은 연령의 <b>TIA<\/b>·허혈성 뇌졸중. 혈관이 서서히 좁아지며 측부순환이 발달 → 혈관조영에서 연기 같은 혈관망<\/td><td>동아시아인에 흔함, 청년기 뇌졸중 감별 원인. pf) 측부순환이 있으니 \"막히면 5분 내 죽는다\"는 틀림<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"5\">MCA<small>중대뇌동맥 · 대뇌 가쪽면<\/small><\/td><td class=\"name\">MCA 전체 폐색<small>4대 핵심 증상<\/small><\/td><td><figure class=\"fr\" style=\"width:34%;max-width:none\"><img src=\"summary/stroke-mca-occlusion.jpg\" alt=\"2025 기출 91번 · 우측 MCA 폐색(좌측 편마비·반맹) CT·CTA\" loading=\"lazy\"><figcaption>2025 기출 91번 · 우측 MCA 폐색(좌측 편마비·반맹) CT·CTA<\/figcaption><\/figure><figure class=\"fr\" style=\"width:34%;max-width:none;clear:right\"><img src=\"summary/stroke-visual-field-parietal.jpg\" alt=\"A: 2023 기출 64번 오른쪽 하사분맹 → 왼쪽 마루엽 / B: 2022 기출 05번 왼쪽 하사분맹 → 오른쪽 마루엽\" loading=\"lazy\"><figcaption>A: 2023 기출 64번 오른쪽 하사분맹 → 왼쪽 마루엽 / B: 2022 기출 05번 왼쪽 하사분맹 → 오른쪽 마루엽<\/figcaption><\/figure>① 반대측 <b>얼굴·팔 우세<\/b> 편마비(homunculus 가쪽) ② 반대측 반신감각저하 ③ 반대측 <b>homonymous hemianopia<\/b>(optic radiation) — parietal 병변은 반대측 하사분맹(quadrantanopia) ④ <b>conjugate gaze deviation<\/b> — FEF 손상, 눈이 <b>병변 쪽<\/b>을 봄<\/td><td>팔이 다리보다 약하면 MCA. 23 기출: 오른쪽 하사분맹 → <b>왼쪽 마루엽<\/b><\/td><\/tr>\n<tr><td class=\"name\">우세반구 (주로 Lt.)<\/td><td><figure class=\"fr\" style=\"width:20%;max-width:none\"><img src=\"summary/stroke-lt-mca-dwi.jpg\" alt=\"2022 기출 03번 · 좌측 MCA 경색 DWI\" loading=\"lazy\"><figcaption>2022 기출 03번 · 좌측 MCA 경색 DWI<\/figcaption><\/figure><b>Aphasia<\/b>(실어증), apraxia(실행증), acalculia, alexia, agraphia, left–right disorientation<\/td><td>22 기출 03번: 갑자기 횡설수설(실어증) + AF → 와파린<\/td><\/tr>\n<tr><td class=\"name\">비우세반구 (주로 Rt.)<\/td><td><figure class=\"fr\" style=\"width:22%;max-width:none\"><img src=\"summary/stroke-clock-neglect.jpg\" alt=\"2025 기출 77번 · 시계 그리기(왼쪽 비움)\" loading=\"lazy\"><figcaption>2025 기출 77번 · 시계 그리기(왼쪽 비움)<\/figcaption><\/figure><b>Hemineglect<\/b>(시계·꽃을 반만 그림), <b>anosognosia<\/b>(마비를 인지 못함·\"괜찮다\", 평소 아픈 곳만 호소), <b>asomatognosia<\/b>(자기 팔을 남의 팔이라 함), constructional·dressing apraxia<\/td><td>25 기출: 시계 왼쪽 비움 → <b>우측 MCA<\/b>. 19 기출: 허리 아프다는 neglect 환자 → <b>Brain CT<\/b>. 환자 말만 듣지 말고 직접 진찰<\/td><\/tr>\n<tr><td class=\"name\">Malignant MCA infarction<small>악성 뇌부종<\/small><\/td><td>큰 MCA 경색 후 <b>2~5일째<\/b> 부종 최대 → ICP↑ → transtentorial·transforaminal <b>herniation<\/b>으로 사망. 초기 sign: <b>pupil size<\/b>부터 변함(anisocoria) → central diencephalic stage(양측 miosis, Cheyne-Stokes). Mannitol·과환기·저체온 등 내과 치료는 실패<\/td><td><b>Decompressive hemicraniectomy<\/b>(48시간 내, 60세 미만)가 유일하게 효과 있는 치료(26P). 첫 주 사망 1위 = 뇌부종. 25 기출: \"malignant cerebral edema\"<\/td><\/tr>\n<tr><td class=\"name\">두정엽 병변<small>실인증 (agnosia)<\/small><\/td><td><b>Tactile agnosia<\/b>: 눈 감고 동전을 만져도 무엇인지 모름(감각은 정상). <b>Simultagnosia<\/b>: 나무는 보는데 숲을 못 봄(8을 못 보고 3만 봄)<\/td><td>실인증은 모두 반대측 <b>parietal<\/b> 문제(기출). Simultagnosia 11·17 기출<\/td><\/tr>\n<tr><td class=\"loc\">ACA<small>전대뇌동맥 · 전두엽 안쪽면<\/small><\/td><td class=\"name\">ACA infarction<\/td><td>반대측 <b>다리 우세<\/b> 마비(팔은 비교적 보존) → 걷기 힘듦. <b>Abulia<\/b>(의욕·호기심 없음, 비협조적으로 보임), <b>akinetic mutism<\/b>(말 안 함, 실어증 아님), <b>urinary incontinence<\/b>(소·대변 조절 못함), motor planning 장애(라이터 못 켬), frontal release sign(grasp·sucking reflex)<\/td><td>23 기출: 요실금 + \"아이..왜..\" 귀찮아함 + 우측 다리 grade 2·팔 grade 4 → <b>Lt. ACA<\/b>. 디스크로 오인 주의<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"3\">PCA<small>후대뇌동맥 · 후두엽·시상<\/small><\/td><td class=\"name\">PCA infarction<small>후두엽<\/small><\/td><td>반대측 <b>homonymous hemianopia<\/b> — 시력이 아니라 <b>시야<\/b> 장애(\"눈이 침침하다\"), MCA 측부순환으로 <b>macular sparing<\/b>. 양측이면 <b>cortical blindness<\/b>(+ Anton syndrome: 못 보는데 본다고 주장). Optic ataxia, <b>alexia without agraphia<\/b>, acute amnestic syndrome<\/td><td>20 기출: 길을 못 찾고 글은 못 읽는데 쓰기는 됨 → <b>Brain CT<\/b>. Occipital은 hemianopia, parietal은 quadrantanopia<\/td><\/tr>\n<tr><td class=\"name\">TGA<small>Transient global amnesia · 해마·편도체<\/small><\/td><td>1~2시간(길게 7~8시간) 동안 <b>방금 한 일을 기억 못 함<\/b>(\"여기가 어디냐\" 반복), 감정 이상(상갓집에서 웃고 화냄). MRI에서 hippocampus의 작은 점 병변 — <b>2~3일 지나야<\/b> 잘 보임(바로 찍으면 음성 가능)<\/td><td>재발 드묾(허혈성 뇌졸중은 약 20%). 22·23P · 작년 수업 내용<\/td><\/tr>\n<tr><td class=\"name\">시상 병변<small>PCA 관통 분지<\/small><\/td><td>반대측 반신(얼굴~팔다리) 감각저하·이상감각(VPL·VPM). <b>Central pain syndrome<\/b>(Dejerine–Roussy): 화끈거림·allodynia, 약이 잘 안 들음. 양측 시상 → coma<br><span style=\"color:#8a90a0\">· <b>Thalamogeniculate a.<\/b>(VPL·VPM): 감각 증상 위주 — \"한 겹 싸인 듯\", \"마취가 안 풀린 것 같다\", hemihypesthesia, 경미한 편마비·ataxia, asterixis<br>· <b>Tuberothalamic a.<\/b>(= polar a.): 전두엽과 연결 → 작은 경색에도 confusion, \"갑자기 치매\"로 내원(치매 아님). 우세반구 dysphasia / 비우세반구 hemineglect<br>· <b>Thalamoperforating a.<\/b>(paramedian): <b>의식저하<\/b>, hemiparesis·asterixis·ataxia·dystonia, 우세반구 dysphasia / 비우세반구 hemineglect<\/span><\/td><td>디스크로 오인되기도. 관통동맥 3가지는 21·22·23P \"시험에 내기 좋다\"(작년 수업 내용, 회색). 단 26 pf) 시상은 이젠 그만 내겠다고 하심<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"4\">Basilar a.<small>기저동맥 · 뇌교<\/small><\/td><td class=\"name\">Locked-in syndrome<\/td><td>Pons의 피라미드로 손상 → 사지마비·말 못함, 그러나 <b>의식은 보존<\/b>(혼수처럼 보임)<\/td><td><b>의식저하<\/b>가 올 수 있는 혈관 = basilar a. (25P)<\/td><\/tr>\n<tr><td class=\"name\">INO · One-and-a-half<small>pons 뒤쪽 MLF<\/small><\/td><td>MLF(CN VI ↔ CN III 연결) 손상 → 옆을 볼 때 <b>병변 쪽 눈이 안쪽으로 못 감<\/b>(medial gaze palsy) + 반대쪽 눈 abduction nystagmus, skew deviation. 작은 경색에도 <b>복시<\/b>. MLF + 같은 쪽 CN VI(PPRF)까지 → <b>one-and-a-half<\/b>: 한쪽 눈 수평운동 완전마비 + 반대쪽 눈 내전 불능. 양측 INO → 뇌교 병변<\/td><td>23 기출. 25 예시: 어지럼 + 우측 눈 내전·외전 안 됨 → <b>우측 뇌교<\/b>(중뇌 고른 학생 많았음 — 중뇌면 CN III 마비로 눈이 외하방)<\/td><\/tr>\n<tr><td class=\"name\">Basilar occlusion · Top of basilar<\/td><td>갑작스러운 <b>coma<\/b>, 기억장애, CN III 마비, 편마비~사지마비, 양측 extensor reflex, <b>doll's eye<\/b>(고개 돌려도 눈이 정면 고정). Partial: INO, conjugate lateral gaze palsy. Pons: <b>pinpoint pupil + apneustic breathing<\/b>, 통증 시 양측 신전<\/td><td>기출: 혼수 + 축동 + 들숨·날숨 긴 호흡 → <b>뇌교<\/b>. Top은 측부순환 없어 대부분 사망. VA dissection 혈전이 올라가 막기도<\/td><\/tr>\n<tr><td class=\"name\">Pontine infarction<small>안면신경핵·섬유<\/small><\/td><td>뇌졸중인데 <b>말초형 안면마비<\/b>(동측 이마 포함 전체 마비). 어지럼·보행장애·복시·사지 근력저하 동반<\/td><td><b>Bell's palsy와 감별<\/b>(동반 증상·위험인자). 25P \"시험에 나온다\"<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">Vertebral a.<small>척추동맥 · 연수<\/small><\/td><td class=\"name\">Medial medullary infarction<small>VA·ASA<\/small><\/td><td><b>동측 CN XII<\/b> → 혀를 내밀면 <b>병변 쪽<\/b>으로 편위 + <b>반대측<\/b> 편마비(교차 전 pyramidal tract)<\/td><td>Crossed sign. 혀 편위 있으면 anterior(medial) medulla<\/td><\/tr>\n<tr><td class=\"name\">Lateral medullary syndrome<small>Wallenberg · VA/PICA<\/small><\/td><td><figure class=\"fr\" style=\"width:20%;max-width:none\"><img src=\"summary/stroke-lat-medulla-dwi.jpg\" alt=\"2017 기출 · 좌측 외측 연수 경색 DWI\" loading=\"lazy\"><figcaption>2017 기출 · 좌측 외측 연수 경색 DWI<\/figcaption><\/figure><figure class=\"fr\" style=\"width:12%;max-width:none\"><img src=\"summary/stroke-lat-medulla-sensory.jpg\" alt=\"2023 기출 59번\" loading=\"lazy\"><figcaption>2023 기출 59번 · 왼쪽 몸 통각 저하 → 우측 외측 연수<\/figcaption><\/figure><b>동측 얼굴<\/b> + <b>반대측 몸·팔다리<\/b> 통온각 저하(descending trigeminal tract + spinothalamic tract). 동측 <b>Horner<\/b>(ptosis·miosis·anhidrosis). Nucleus ambiguus: <b>삼킴곤란·쉰 목소리(wet voice)·딸꾹질<\/b>, 마비 쪽 연구개 처짐 → uvula는 <b>정상 쪽<\/b>으로 올라감. Vertigo·nystagmus, 동측 ataxia(병변 쪽으로 쓰러짐). <b>운동마비·혀 편위 없음<\/b><\/td><td>국시 최빈출(23·25·26P). 기출: 좌측 Horner + 쉰 목소리 → <b>Lt. vertebral a.<\/b> / 우측 Horner + 좌측 몸 통각↓ → <b>우측 연수<\/b>. 청년 VA dissection → 아스피린. 이비인후과로 오인 주의<\/td><\/tr>\n<tr><td class=\"loc\">소뇌동맥<small>PICA · AICA · SCA<\/small><\/td><td class=\"name\">Cerebellar infarction<\/td><td>PICA: 어지럼·ataxia / AICA: 청력장애·vertigo·nystagmus(CN VIII) / SCA: 보행장애. Romberg·tandem gait에서 <b>병변 쪽<\/b>으로 넘어짐, finger-to-nose 실패<\/td><td>균형장애 + 복시 + 감각저하 → 후방순환 문제<\/td><\/tr>\n<tr><td class=\"loc\">관통동맥<small>lenticulostriate 등 100~200 μm · 기저핵·내포·시상·뇌교<\/small><\/td><td class=\"name\">Lacunar infarction<small>열공뇌경색 · small vessel<\/small><\/td><td>Pure motor, pure sensory, ataxic hemiparesis, dysarthria-clumsy hand, sensory-motor stroke. 증상 가볍고 예후 좋음. 같은 혈관의 microaneurysm 파열 → 뇌내출혈(ICH)<\/td><td>원인 m/c <b>고혈압<\/b>(lipohyalinosis·microatheroma). 2차 예방 SBP <b>&lt;130<\/b>, 장기 DAPT 피함 (기출)<\/td><\/tr>\n<tr><td class=\"loc\">정맥동<small>dural venous sinus<\/small><\/td><td class=\"name\">CVST<small>뇌정맥동 혈전증<\/small><\/td><td><figure class=\"fr\" style=\"width:24%;max-width:none\"><img src=\"summary/stroke-cvst-ct.jpg\" alt=\"2022 기출 06번\" loading=\"lazy\"><figcaption>2022 기출 06번 · 정맥동 고음영(혈전) CT<\/figcaption><\/figure>정맥굴이 막혀 뇌의 정맥 배출이 안 됨 → ICP↑ → <b>경련<\/b>·두통·뇌출혈·의식저하. 전체 뇌졸중의 약 1%. 위험인자: 임신, 경구피임약, 외상, 감염, 비만, 혈액질환. 진단 CT·MRI·뇌혈관조영<\/td><td>치료 <b>항응고제<\/b>(헤파린·와파린·NOAC). 혈전용해제는 발병 시각(4.5시간 내)이 주어질 때만. 22 기출 06번: PC방 게임 중 경련·의식저하한 27세 → 항응고제(수업 안 한 곳에서 출제)<\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><b>국소화 원칙<\/b><ul>\n<li>Homunculus: <b>MCA = 얼굴·팔<\/b>(가쪽면), <b>ACA = 다리<\/b>(안쪽면), <b>PCA = 시야<\/b>(후두엽)<\/li>\n<li>뇌간 병변 = <b>crossed sign<\/b>: 뇌신경 장애는 병변과 <b>같은 쪽<\/b>, 운동·감각 장애는 <b>반대쪽<\/b><\/li>\n<li>대뇌 병변의 시선은 <b>병변 쪽<\/b>을 봄 / 중추성 안면마비는 이마 보존, 말초형은 이마까지(뇌교 병변은 뇌졸중이어도 말초형 가능)<\/li>\n<li>시야: chiasm 앞 = 한쪽 눈, 뒤 = 반대측 동측반맹 (parietal → 하사분맹, occipital → 반맹)<\/li>\n<li>뇌허혈 <b>조기 CT 징후 4가지<\/b>(15·16 주관식, 4개 다 써야 정답): 뇌섬엽리본 소실, 회질–백질 대비 감소, 렌즈핵 불명료화, 고음영동맥징후(early MCA/basilar sign = 혈전)<\/li>\n<li>Coma가 오는 경우: pons의 RAS, 양측 시상, 양측 대뇌반구 광범위 손상. 의식저하는 일반 뇌졸중 증상이 아님(25P)<\/li>\n<\/ul><\/div>\n"}, {"title": "중추신경계 감염증 — 수막염 비교·뇌염·농양·기회감염·프리온 (증상·CSF·치료)", "html": "summary/ahn-cns-infection.html", "img": "summary/ahn-cns-infection.jpg", "pdf": "summary/ahn-cns-infection.pdf", "src": "26 학습부 14번 · 중추신경계 감염증 (⭐ = 26Pま, 26P·기출 질환만, 사진은 2019–2025 기출 그림)", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:14%\"><col style=\"width:22%\"><col style=\"width:31%\"><col style=\"width:24%\"><\/colgroup><thead><tr><th>분류<\/th><th>질환<\/th><th>증상 · 경과<\/th><th>CSF · 검사 소견<\/th><th>치료<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\" rowspan=\"4\">수막염<small>CSF로 비교 ⭐<\/small><\/td><td class=\"name\">세균성 수막염 ⭐<small>25ま 26Pま · S. pneumoniae 최다, 고령·면역저하 Listeria, 수술 후 Staph, 신생아 E. coli·GBS, 군부대 N. meningitidis<\/small><\/td><td><b>급성<\/b>(1–2일 안 악화). <b>발열 + 경부강직 + 의식변화<\/b>(3개 다는 44%뿐). Kernig·Brudzinski는 주로 소아. 피부 점상출혈 = 수막구균<\/td><td><b>외관 turbid<\/b> · WBC <b>1,000–10,000(PMN)<\/b> · 단백 <b>100–500<\/b> · 당 <b>&lt;40<\/b>(CSF/혈당 &lt;0.4) · 압력↑<br>확진: CSF 배양(70–90%, Gram stain은 잘 안 나옴) + <b>혈액배양<\/b>(40–60%) — 둘 다 <b>항생제 전에<\/b><br><figure style=\"display:inline-block;vertical-align:top;width:70%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-bacterial-mri.jpg\" alt=\"2022 기출 15번 · FLAIR·T1 조영·DWI (sulcus 따라 고신호) → 3세대 세파 + 반코마이신\" loading=\"lazy\"><figcaption>2022 기출 15번 · FLAIR·T1 조영·DWI (sulcus 따라 고신호) → 3세대 세파 + 반코마이신<\/figcaption><\/figure><\/td><td>검사 결과와 상관없이 <b>즉시 IV full-dose<\/b>(CT보다 먼저). <b>3세대 cephalosporin + vancomycin<\/b>, 50세 이상·면역저하 <b>+ ampicillin<\/b>. 10–14일. <b>Dexamethasone<\/b> 10 mg q6h 4일(첫 항생제 15–20분 전·동시): 청력 소실 예방, 교수님 \"사망률엔 영향 없음\". 수막구균·H. flu 밀접접촉자 예방(25ま 88번): cipro 500 PO 1회 / ceftriaxone 250 IM 1회 / rifampin 600 q12h 2일(임산부 금기)<\/td><\/tr>\n<tr><td class=\"name\">결핵성 수막염<small>25ま · inflammatory exudate 26Pま<\/small><\/td><td><b>아급성<\/b>(2–3주 식욕부진·미열 → 두통·의식저하). <b>뇌신경마비<\/b>(특히 CN VI). Exudate ⭐ → <b>수두증<\/b>·<b>tuberculoma<\/b>·<b>혈관염 → 경색<\/b><\/td><td><b>외관 yellow<\/b> · WBC <b>50–500(림프구)<\/b> · 단백 <b>크게↑<\/b>(100–200, g 단위까지) · 당 <b>&lt;40<\/b><br>확진: <b>Xpert MTB/RIF PCR<\/b>, <b>ADA↑<\/b>. MRI <b>기저조<\/b> 두꺼운 수막 조영증강<br><figure style=\"display:inline-block;vertical-align:top;width:52%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-tb-cxr-mri.jpg\" alt=\"2025 기출 87번 · 흉부 X-ray(폐결핵) + 조영증강 → 4제 요법\" loading=\"lazy\"><figcaption>2025 기출 87번 · 폐결핵 + 조영증강 → 4제 요법<\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:36%;margin:6px 0 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-tb-tuberculoma.jpg\" alt=\"2023 기출 54번 · tuberculoma → INH+RIF+PZA+EMB\" loading=\"lazy\"><figcaption>2023 기출 54번 · tuberculoma → 4제 요법<\/figcaption><\/figure><\/td><td>초기 2개월 <b>INH + RFP + PZA + EMB<\/b> → 유지 7–10개월 INH + RFP(우리나라 최소 1년). <b>스테로이드<\/b> 6–8주 병용(HIV 없으면 반드시). 임의 중단 금지<\/td><\/tr>\n<tr><td class=\"name\">바이러스(무균성) 수막염 ⭐<small>25ま 26Pま · Enterovirus 85%↑, 여름~초가을 (HSV-2, mumps)<\/small><\/td><td>감기 몸살 뒤 발열·두통(<b>새벽에 심함<\/b>, 구토)·경미한 경부강직. <b>의식 명료<\/b>, 1–2주 내 자연 호전<\/td><td><b>외관 투명<\/b> · WBC <b>수십–수백(림프구)<\/b>, 대개 &lt;200 · 단백 <b>정상<\/b> · 당 <b>정상<\/b> · 압력↑. CT 정상<br><figure style=\"display:inline-block;vertical-align:top;width:45%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-aseptic-ct.jpg\" alt=\"2025 기출 85번 · CT 정상 → 대증치료\" loading=\"lazy\"><figcaption>2025 기출 85번 · CT 정상 → 대증치료<\/figcaption><\/figure><\/td><td><b>대증치료<\/b>(ICP 낮추기). 단, 대상포진이 앞서 있었으면 <b>IV acyclovir<\/b>(22 기출 13번)<\/td><\/tr>\n<tr><td class=\"name\">진균성(크립토코쿠스) 수막염<small>15 기출 · HIV·면역저하자, 전신감염 없이 CNS 직접 침범<\/small><\/td><td><b>아급성<\/b> 두통·발열·오심, <b>심한 뇌압 상승<\/b>(시력 상실 위험)<\/td><td>WBC <b>&lt;1,000(림프구)<\/b> · 단백 <b>↑<\/b> · 당 <b>약간↓<\/b> → 결핵과 비슷<br>확진: <b>cryptococcal antigen<\/b>(&gt;99%), <b>India ink<\/b><\/td><td>Amphotericin B + flucytosine 2주 → fluconazole. 반복 요추천자로 감압<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">뇌염<\/td><td class=\"name\">단순포진 뇌염 ⭐<small>26Pま \"굉장히 중요\" · 성인 90%↑ HSV-1<\/small><\/td><td>급성 발열 + <b>인격·행동 변화, 환각(후각), 기억상실, 측두엽 발작<\/b>. 정신과 질환으로 오진 쉬움<\/td><td>CSF 림프구, 단백 약간↑, 당 정상, <b>RBC↑·황색변색<\/b>(출혈성 괴사). <b>CSF HSV PCR<\/b> — 72시간 내 위음성 → <b>의심되면 반복<\/b>. MRI <b>내측 측두엽<\/b>. EEG <b>PLEDs<\/b><br><figure style=\"display:inline-block;vertical-align:top;width:40%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-hse-ct-csf.jpg\" alt=\"2023 기출 55번 · 측두엽 저음영 CT + CSF → Acyclovir\" loading=\"lazy\"><figcaption>2023 기출 55번 · 측두엽 CT + CSF → Acyclovir<\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:27%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-hse-flair.jpg\" alt=\"2022 기출 14번 · FLAIR 내측 측두엽 고신호\" loading=\"lazy\"><figcaption>2022 기출 14번 · FLAIR 내측 측두엽<\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:29%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-hse-eeg.jpg\" alt=\"2022 기출 14번 · 측두부 주기성 방전(PLEDs)\" loading=\"lazy\"><figcaption>2022 기출 14번 · EEG PLEDs<\/figcaption><\/figure><\/td><td>PCR 기다리지 말고 즉시 <b>Acyclovir 10 mg/kg q8h IV<\/b> 약 2주. 부종 심하면 스테로이드, 항경련제 병행<\/td><\/tr>\n<tr><td class=\"name\">일본뇌염 ⭐<small>26Pま · 작은빨간집모기, 증폭숙주 돼지<\/small><\/td><td>고열·의식장애 + <b>파킨슨증<\/b>(가면얼굴·진전·경직)·근긴장이상. 이완성 마비 가능<\/td><td>MRI <b>양측 시상<\/b>·기저핵·중뇌 T2 고신호. 혈청·CSF <b>JE IgM<\/b>(ELISA)<\/td><td>특이 치료 <b>없음<\/b> → 보존치료, <b>예방접종<\/b><\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">국소 화농성<\/td><td class=\"name\">뇌농양 ⭐<small>26Pま 감염경로·영상 · 혐기성 연쇄구균, S. aureus<\/small><\/td><td>두통·발열 → 피막 생기면 증상 덜함, 국소 결손. 경로: 인접 파급 40–50%(부비동염 → 전두엽, 중이염 → 측두엽·소뇌), 혈행성 25–35%(MCA 영역 다발성)<\/td><td>MRI <b>ring enhancement<\/b> + <b>DWI 중심 고신호<\/b>(종양과 감별). <b>요추천자 금기<\/b>. 선행 감염(폐·간) 찾기<\/td><td><b>Ceftriaxone + metronidazole 6–8주<\/b>(MRSA → vancomycin). ≥2.5 cm·종괴효과 → 정위흡인술<\/td><\/tr>\n<tr><td class=\"name\">경막하 농양<small>20 기출 주관식<\/small><\/td><td>세균성 수막염 치료 중 갑자기 의식저하·<b>실어증<\/b>·경련·편마비<\/td><td>MRI 경막하 고름. 요추천자 금기<br><figure style=\"display:inline-block;vertical-align:top;width:65%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-subdural-empyema.jpg\" alt=\"2020 기출 주1 · subdural empyema\" loading=\"lazy\"><figcaption>2020 기출 주1 · subdural empyema<\/figcaption><\/figure><\/td><td>응급 개두술·배액<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"4\">만성 · 기회감염<\/td><td class=\"name\">신경매독 ⭐<small>26Pま 진단·치료·추적<\/small><\/td><td>조기: 두통·뇌신경마비·젊은 뇌졸중 / 만기: <b>진행마비<\/b>(치매, <b>Argyll Robertson 동공<\/b>), <b>척수매독<\/b>(감각성 실조, Romberg+)<\/td><td><b>CSF-VDRL<\/b>(25ま, venereal disease research laboratory): 특이도↑ → 양성이면 확진. <b>CSF FTA-ABS<\/b>: 민감도↑ → 음성이면 배제. CSF 세포 수~십수 개, 단백↑<\/td><td><b>Aqueous crystalline penicillin G<\/b> 1,800–2,400만 U/일 <b>IV<\/b> 10–14일(23ま 4단어). 추적 ⭐: <b>6개월마다 CSF<\/b> → 세포·단백 다시 오르면 penicillin 반복, VDRL 약양성만 남으면 추가 치료 X<\/td><\/tr>\n<tr><td class=\"name\">뇌유낭종증<small>21·23 기출 · 돼지고기·인분 오염 채소<\/small><\/td><td><b>경련<\/b>, 수두증 → 보행장애. 감각피질 병변 → 다리 저림<\/td><td>다발성 낭포·<b>석회화<\/b>(종양 아님). 골반 X-ray 석회화 충체<br><figure style=\"display:inline-block;vertical-align:top;width:60%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-cysticercosis.jpg\" alt=\"2023 기출 53번 · 골반 X-ray + 뇌 석회화 → Albendazole\" loading=\"lazy\"><figcaption>2023 기출 53번 · 골반 X-ray + 뇌 석회화 → Albendazole<\/figcaption><\/figure><\/td><td><b>Albendazole<\/b>(23ま 주관식) + 스테로이드 + 항경련제<\/td><\/tr>\n<tr><td class=\"name\">뇌 톡소플라스마증<small>22 기출 · CD4 &lt;100 AIDS<\/small><\/td><td>발열·국소 결손(소뇌 병변 → 어지럼)<\/td><td>기저핵·피질-수질 경계 <b>다발성 ring enhancement<\/b><br><figure style=\"display:inline-block;vertical-align:top;width:28%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-toxo-dwi.jpg\" alt=\"2022 기출 54번 · AIDS DWI 다발성 병변 → Toxoplasma gondii\" loading=\"lazy\"><figcaption>2022 기출 54번 → Toxoplasma gondii<\/figcaption><\/figure><\/td><td>Pyrimethamine + sulfadiazine + leucovorin<\/td><\/tr>\n<tr><td class=\"name\">PML<small>17·21 기출 · JC virus<\/small><\/td><td>HIV·면역저하자, 수 주에 걸친 편측 마비·구음장애<\/td><td>피질하 백질 비대칭 탈수초<br><figure style=\"display:inline-block;vertical-align:top;width:70%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-pml.jpg\" alt=\"2021 기출 04번 · HIV(+) 편마비 → PML\" loading=\"lazy\"><figcaption>2021 기출 04번 · HIV(+) 편마비 → PML<\/figcaption><\/figure><\/td><td>예후 불량<\/td><\/tr>\n<tr><td class=\"loc\">프리온<\/td><td class=\"name\">산발성 CJD ⭐<small>25ま 26Pま \"증상은 알고 계세요\"<\/small><\/td><td><b>급속 진행성 치매<\/b> + 2개↑: ① <b>근간대경련<\/b> ② 시각·소뇌 증상 ③ 추체로·추체외로 ④ 무동성 무언증<\/td><td>EEG <b>PSWC<\/b> / DWI <b>cortical ribboning<\/b>·미상핵·조가비핵 / CSF <b>14-3-3<\/b>(25ま 주관식)·RT-QuIC. 일반 CSF는 <b>정상<\/b><br><figure style=\"display:inline-block;vertical-align:top;width:55%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-cjd-dwi.jpg\" alt=\"2025 기출 90번 · DWI → CSF 14-3-3\" loading=\"lazy\"><figcaption>2025 기출 90번 · DWI → 14-3-3<\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:40%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-cnsinf-cjd-eeg.jpg\" alt=\"2019 기출 02번 · EEG 주기성 예파\" loading=\"lazy\"><figcaption>2019 기출 02번 · EEG<\/figcaption><\/figure><\/td><td>치료 없음<\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><b>공통 ⭐<\/b><ul>\n<li><b>CSF 정상<\/b>: 압력 50–200 <b>mmH₂O<\/b>(mmHg 아님) · WBC &lt;5(&gt;10 이상) · 단백 15–50 · 당 혈당의 약 1/2(&gt;40). 색: yellow = 단백↑, turbid = WBC↑, red = RBC↑<\/li>\n<li><b>수막염 vs 뇌염<\/b>: 수막염 = 수막자극징후, 뇌파 정상 / 뇌염 = 실질 파괴, 국소 증상·경련, EEG 이상<\/li>\n<li><b>요추천자<\/b>: <b>L4–L5<\/b>, <b>절대 흡인 금지<\/b>. 천자 전 CT: 면역저하·CNS 기왕력·1주 내 새 경련·유두부종·의식저하/국소 결손 — 그래도 항생제는 CT 전에<\/li>\n<\/ul><\/div>\n"}]}, {"prof": "김현철", "items": [{"title": "뇌경색 시기별 CT·MRI 소견과 색 — hyperacute·acute·subacute·chronic", "html": "summary/kim-infarct-ct-stage.html", "img": "summary/kim-infarct-ct-stage.jpg", "pdf": "summary/kim-infarct-ct-stage.pdf", "src": "26 학습부 06번 · 신경계 영상진단 (기출 포인트는 같은 학습부의 기출 해설)", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:12%\"><col style=\"width:22%\"><col style=\"width:22%\"><col style=\"width:22%\"><col style=\"width:22%\"><\/colgroup><thead><tr><th>구분<\/th><th>Hyperacute<\/th><th>Acute<\/th><th>Subacute<\/th><th>Chronic<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\">시간 기준<small>신경학적 증상 발생 시각부터<\/small><\/td><td>&lt; 6–8시간<\/td><td>~1주<\/td><td>~3주 (1주 이후)<\/td><td>3주 이후<\/td><\/tr>\n<tr><td class=\"loc\">부종 상태<\/td><td><b>Cytotoxic edema<\/b>만 있음 (세포 안 수분↑)<\/td><td>Cytotoxic + <b>vasogenic<\/b> edema가 섞임 (BBB가 깨져 세포 밖 수분도↑)<\/td><td>부종이 <b>더 이상 진행하지 않음<\/b><\/td><td>괴사한 실질이 CSF·gliosis로 대체<\/td><\/tr>\n<tr><td class=\"loc\">CT 색 (음영)<small>attenuation<\/small><\/td><td><b>거의 정상처럼 보임<\/b>. 저음영이 아주 약해 자세히 봐도 잘 안 보임. 예외로 혈전이 <b>하얗게<\/b> 보일 수 있음 (hyperdense MCA)<\/td><td><b>뚜렷하게 까맘 (저음영)<\/b>. 수분 1%↑마다 약 2.5 HU↓. 다만 <b>CSF보다는 덜 까맘<\/b>. 출혈이 생기면 그 안이 <b>하얗게<\/b> 보임<\/td><td><b>더 까매져<\/b> 보기 편함. 조영하면 까만 부위 사이에 <b>하얀 반점<\/b> (조영제 누출 = contrast enhancement)<\/td><td><b>가장 까맘<\/b>. Ventricle 안 CSF와 거의 같은 색<\/td><\/tr>\n<tr><td class=\"loc\">MRI DWI · ADC<\/td><td>DWI <b>하얘지기 시작<\/b> (이론상 수 분 내, 실제로는 1시간쯤 지나야 눈에 띔) · ADC 약간 까매짐. 신호가 약해 <b>놓치기 쉬움<\/b> (DWI false-negative 약 6%)<\/td><td><b>DWI 하얗고 (고신호) + ADC 까맘 (저신호)<\/b> → acute infarct 진단 <span class=\"src\">(23·25P)<\/span>. DWI는 약 3일, ADC는 약 2.5일에 최고<\/td><td>DWI 신호가 약 5일째부터 줄어 정상에 가까워짐 → <b>희미하게 보여 놓치기 쉬운 시기<\/b> (hyperacute와 함께 진단이 어려운 구간) · ADC는 7일쯤까지 까맣다가 점차 올라감<\/td><td>DWI는 약 10일째부터 정상처럼 보임 (회복이 아니라 diffusion 제한이 사라진 것) · ADC는 오히려 <b>하얘짐<\/b> (30일)<\/td><\/tr>\n<tr><td class=\"loc\">MRI T1<small>출혈 기준 · 학습부 p.42<\/small><\/td><td><b>Iso<\/b> (회색, GM과 비슷하거나 약간 어두움)<\/td><td><b>Iso<\/b> (회색)<\/td><td><b>하얌 (고신호)<\/b> · early (3d–1wk)는 테두리부터 하얘짐, late (1wk–1mo)는 전체<\/td><td><b>까맘 (저신호)<\/b><\/td><\/tr>\n<tr><td class=\"loc\">MRI T2<small>출혈 기준 · 학습부 p.42<\/small><\/td><td><b>하얌 (고신호)<\/b><\/td><td><b>까맘 (저신호)<\/b> · 응급실에서 주로 보는 시기<\/td><td>Early (3d–1wk): <b>까맘<\/b> · Late (1wk–1mo): <b>하얌<\/b><figure><img src=\"summary/exam-ich-early-subacute.jpg\" alt=\"2022 기출 58번 MRI\" loading=\"lazy\"><figcaption><span class=\"src\">2022 기출 58번: T1 테두리 하얌 · T2 까맘 → early subacute<\/span><\/figcaption><\/figure><\/td><td><b>까맘<\/b> (큰 병변은 안쪽이 CSF처럼 하얗고 테두리부터 까매짐 → 점점 안쪽도 까매짐)<\/td><\/tr>\n<tr><td class=\"loc\">주요 소견<\/td><td>① <b>Mass effect<\/b>: sylvian fissure가 좁아짐, loss of cortical sulci<br>② <b>Hypoattenuating gray matter<\/b>: insular ribbon sign, basal ganglia 저음영<br>③ <b>Hyperattenuating artery<\/b>: hyperdense MCA sign (10% 미만, 보이면 100% 진단)<\/td><td>① 저음영이 뚜렷해짐<br>② Mass effect↑: 같은 쪽 ventricle 압박, <b>midline shift<\/b>, subfalcine herniation (응급)<br>③ <b>Hemorrhagic transformation<\/b> (4일 이후): 가장 나쁜 합병증, 사망률에 큰 영향<\/td><td>① 저음영이 더 뚜렷해짐<br>② 부종이 멈춰 <b>mass effect 호전·소실<\/b><br>③ <b>Contrast enhancement<\/b>: acute에도 BBB가 깨져 조금 새지만 subacute에 명확 (예: Rt. frontal ACA 영역 경색 속 하얀 반점)<\/td><td><b>Encephalomalacic change (뇌연화증)<\/b>: CSF로 찬 공간, volume loss<br>Mass effect 소실 → 위축 (미는 게 아니라 <b>당기는<\/b> 효과)<\/td><\/tr>\n<tr><td class=\"loc\">핵심 · 기출<\/td><td>세 소견이 한꺼번에 나오는 일은 드물고 셋 다 없는 경우도 많음 → <b>CT만으로 판단하지 말고 DWI<\/b>. <span class=\"src\">(22·23·25 기출: hyperacute 소견이 아닌 것 = contrast enhancement, encephalomalacic change. '정상'은 hyperacute 소견)<\/span><figure><img src=\"summary/exam-hyperacute-mca.jpg\" alt=\"2025 기출 91번 CT·CTA\" loading=\"lazy\"><figcaption><span class=\"src\">2025 기출 91번 (22·23 같은 문항): 발병 1시간 30분, CT는 거의 정상 · CTA에서 우측 MCA 폐색<\/span><\/figcaption><\/figure><\/td><td><b>Acute infarction의 가장 큰 특징은 hemorrhage<\/b> <span class=\"src\">(22·23·25·26P)<\/span><\/td><td><b>Subacute infarction의 가장 큰 특징은 contrast enhancement<\/b> <span class=\"src\">(21·22·23·25·26P)<\/span>. Tumor·infection·염증·demyelination도 조영증강되므로 경색을 생각 안 하면 오진 <span class=\"src\">(22·23 기출: hyperacute 소견이 아닌 것 = contrast enhancement)<\/span><\/td><td>모든 뇌 손상(trauma·hemorrhage 등)의 마지막 단계이기도 함 <span class=\"src\">(25 기출)<\/span><\/td><\/tr>\n<tr><td class=\"muted\" colspan=\"5\">참고 · <b>출혈 MRI 신호 (p.42, 21·22·23·25·26P)<\/b>: 시기 Hyperacute &gt;6hr · Acute &gt;3d · Early subacute 3d–1wk · Late subacute 1wk–1mo · Chronic 1달 이상. T1/T2 = <b>I-B → I-D → B-D → B-B → D-D<\/b> (I iso · B bright · D dark). <span class=\"src\">(25 기출 57번 acute, 22 기출 58번 early subacute, 21 기출 late subacute)<\/span><\/td><\/tr>\n<\/tbody><\/table>\n"}, {"title": "뇌졸중 위치별 소견 — territorial·lacunar·borderzone 경색, SAH", "html": "summary/kim-infarct-location.html", "img": "summary/kim-infarct-location.jpg", "pdf": "summary/kim-infarct-location.pdf", "src": "26 학습부 06번 · 신경계 영상진단", "body": "<table class=\"w5\"><colgroup><col style=\"width:15%\"><col style=\"width:21%\"><col style=\"width:19%\"><col style=\"width:23%\"><col style=\"width:22%\"><\/colgroup><thead><tr><th>구분<\/th><th>침범 위치 · 혈관<\/th><th>주요 원인<\/th><th>영상 소견<\/th><th>예후 · 특징<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"name\">Territorial infarct<small>큰 혈관 · 22P<\/small><\/td><td>큰 가지가 담당하는 영역 전체 (anterior/posterior circulation)<br><b>ACA, MCA (가장 큼, 치료 집중), PCA<\/b>는 꼭 암기. AICA 등도 있음<\/td><td>Large artery atherosclerosis (m/c), cardioembolism<\/td><td>해당 혈관이 담당하는 영역 모양 그대로 넓게 병변<\/td><td>범위가 넓음<br><span class=\"src\">Review: Lt. MCA territory acute infarct, Lt. PCA territory (hippocampus·occipital lobe)<\/span><\/td><\/tr>\n<tr><td class=\"name\">Lacunar infarct<small>작은 혈관 · 열공경색 · 22·26P<\/small><\/td><td>단일 perforating artery<br>Putamen, pons 같은 <b>깊은 구조물<\/b><\/td><td>Atherosclerosis (가장 많음), lipohyalinosis (HTN), embolism<\/td><td>DWI에서 <b>작은 하얀 점<\/b> (1–15 mm)<br><b>CT에서는 잘 안 보임<\/b><\/td><td>범위가 작아 <b>회복이 잘 되고 예후가 좋음<\/b>. 응급실에서 가장 흔함, 발병 연령이 낮아지는 중<\/td><\/tr>\n<tr><td class=\"name\">Cortical (external) borderzone<\/td><td>큰 혈관 영역 사이의 경계면, <b>cortex를 포함<\/b><\/td><td>Hypoperfusion + embolism (주로 embolism). Cardiac arrest 등 전신 혈압 저하 때도<\/td><td>GM이 꽉 차게 하얗지 않고 <b>듬성듬성<\/b>. GM·WM 모두 하얀 부분<\/td><td>담당 혈관이 애매해 혈류가 줄어드는 곳에 생김<\/td><\/tr>\n<tr><td class=\"name\">Internal borderzone<small>21·25P<\/small><\/td><td><b>Centrum ovale, corona radiata의 WM<\/b> (GM에서는 안 보임)<\/td><td>더 큰 혈관의 병변 (extracranial/intracranial a.). 특히 <b>ICA 폐색<\/b>, MCA 협착<\/td><td><b>체인·염주처럼 앞뒤로 일렬로 늘어선<\/b> 병변<figure><img src=\"summary/exam-internal-borderzone.jpg\" alt=\"2025 기출 53번 DWI\" loading=\"lazy\"><figcaption><span class=\"src\">2025 기출 53번: DWI, centrum ovale·corona radiata의 일렬 병변<\/span><\/figcaption><\/figure><\/td><td><b>예후 극히 불량<\/b>, 더 큰 infarct으로 진행 가능 → 바로 치료하거나 계속 F/U <span class=\"src\">(22P · 25 기출 53번)<\/span><\/td><\/tr>\n<tr><td class=\"name\" rowspan=\"2\">SAH<small>지주막하출혈 · 22·23·25P<\/small><\/td><td><b>Subarachnoid space<\/b> (arachnoid–pia 사이) = CT의 <b>cistern<\/b> (basal·sylvian 등)과 <b>sulcus<\/b>. 혈관이 지나가고 CSF가 차 있는 곳<br><span class=\"src\">Sylvian fissure: 앞 frontal · 뒤 temporal · 위 parietal lobe (22·25·26P)<\/span><\/td><td>외상 제외 시 <b>aneurysm rupture<\/b> (saccular) <span class=\"src\">(23P)<\/span><br>호발: <b>A com (m/c)<\/b>, P com, basilar tip, <b>MCA bifurcation<\/b>, distal ICA <span class=\"src\">(23 기출: 아닌 것 = cervical ICA)<\/span><\/td><td>원래 CSF로 <b>까맣던 cistern·sulcus가 하얗게 (고음영)<\/b> 차 있음. 일부만 채울 수도 있음. 동반: obstructive hydrocephalus, <b>IVH, 실질 혈종(ICH)<\/b> <span class=\"src\">(26P)<\/span>. 동맥류 확인은 CTA (MIP + VR 세트)<\/td><td>출혈 양이 많을수록 예후 나쁨. <b>Thunderclap headache<\/b><br>Hemorrhagic stroke는 ischemic보다 사망률 높음<\/td><\/tr>\n<tr><td colspan=\"4\"><span class=\"src\">SAH 기출 사진<\/span><br><figure style=\"display:inline-block;width:27%;vertical-align:top;margin-right:3%\"><img src=\"summary/exam-sah-cistern.jpg\" alt=\"2025 기출 55번 CT\" loading=\"lazy\"><figcaption><span class=\"src\">2025 기출 55번: basal cistern·sylvian fissure가 하얗게 → SAH<\/span><\/figcaption><\/figure><figure style=\"display:inline-block;width:43%;vertical-align:top\"><img src=\"summary/exam-sah-sylvian.jpg\" alt=\"2023 기출 36번 CT\" loading=\"lazy\"><figcaption><span class=\"src\">2023 기출 36번 (주관식): 진단명 = subarachnoid hemorrhage<\/span><\/figcaption><\/figure><\/td><\/tr>\n<\/tbody><\/table>\n"}]}, {"prof": "김후원", "items": [{"title": "뇌의 회로별 구성 부위와 역할 — 감각·운동·기저핵·언어·기억·의식·보상·변연계(Papez)·공포·시상하부", "html": "summary/kimhw-brain-circuits.html", "img": "summary/kimhw-brain-circuits.jpg", "pdf": "summary/kimhw-brain-circuits.pdf", "src": "26 학습부 12번 · 신경계의 구조와 기능 (기출 포인트는 같은 학습부의 기출 해설, 사진은 2013·2018·2022 기출 그림)", "body": "<table class=\"wide\"><colgroup><col style=\"width:13%\"><col style=\"width:24%\"><col style=\"width:37%\"><col style=\"width:26%\"><\/colgroup><thead><tr><th>회로<\/th><th>속한 부위 (BA = 브로드만 영역)<\/th><th>부위별 담당 역할<\/th><th>기출 · 강조<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"name\">반사 회로<small>Simple reflex circuit · DTR<\/small><\/td><td>Sensory neuron → <b>interneuron<\/b> → motor neuron (extensor / flexor)<\/td><td>Sensory neuron: 해머 자극을 받아들임 (input)<br>Interneuron: 가운데에서 신호를 <b>modulation<\/b> (extensor 수축 ↔ flexor 이완)<br>Motor neuron: 다리를 움직임 (output)<br><span class=\"src\">circuit = input → 중앙 처리 → output. feedforward(증가) / negative feedback(억제)<\/span><\/td><td><span class=\"src\">회로 개념의 대표 예 (26 강의)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\" rowspan=\"2\">시각 경로<small>Vision · 21·25P<\/small><\/td><td><b>Retina<\/b>: rod · cone · fovea · optic disc<br>→ Optic nerve → <b>Optic chiasm<\/b> → Optic tract → LGN<br>→ Optic radiation (<b>temporal<\/b> = 아래 / <b>parietal<\/b> = 위)<br>→ Visual cortex <b>BA 17, 18<\/b> (V3·V4·V5/MT)<\/td><td><b>Rod<\/b>: 명암 (496 nm 하나) / <b>Cone<\/b>: 색 (3종)<br>Fovea: cone 최다 → 선명한 중심시야 / Optic disc: 수용체 없음 → 생리적 맹점<br>Optic chiasm: 양 눈의 코쪽 망막(=귀쪽 시야) 신호가 교차<br>Temporal 부챗살: <b>상부<\/b> 시야 → 손상 시 상사분맹 / Parietal 부챗살: <b>하부<\/b> 시야<br>Visual cortex: V3 shape, V4 color(+shape), V5(MT) motion<br><span class=\"src\">Occipital은 혈류가 좋아 macular sparing 가능<\/span><\/td><td><b>25 기출 59<\/b>: 시신경교차 병변 → <b>양측두부 반맹<\/b><br><b>25 기출 58 ①<\/b>: 명암 감지 = 간상세포(원추 X)<br><b>18 기출 R형<\/b>: 시야 결손 그림 → chiasm · optic tract · temporal<br><span class=\"src\">14·18·19·22·23·25·26P (field test로 병변 위치 추정)<\/span><\/td><\/tr>\n<tr><td colspan=\"3\"><figure style=\"display:inline-block;width:62%;vertical-align:top\"><img src=\"summary/exam-kimhw-visual-field.jpg\" alt=\"2018 기출 시야 결손 그림\" loading=\"lazy\"><figcaption><span class=\"src\">2018 기출 (R형): 체크된 3개 = bitemporal hemianopia(chiasm) · homonymous hemianopia(optic tract) · superior quadrantopia(temporal)<\/span><\/figcaption><\/figure><\/td><\/tr>\n\n<tr><td class=\"name\">청각 경로<small>Hearing · 21·25P<\/small><\/td><td>귓바퀴 → 고막 → 이소골 (malleus·incus·stapes) → oval window<br>→ <b>Cochlea<\/b> (기저부 / 첨부) → 청신경 (양측성)<br>→ <b>Heschl's gyrus<\/b> = primary auditory cortex <b>BA 41, 42<\/b><\/td><td>귓바퀴·고막:이소골 면적비: 소리 증폭 / tensor tympani·stapedius: 큰 진동 감쇠<br><b>기저부 = 고주파<\/b> (소음성 난청·노화에서 먼저 손상) / <b>첨부 = 저주파<\/b> (Meniere)<br>청신경: 한쪽 귀 신호가 양쪽 뇌로 감<br>Heschl's gyrus: 주파수별로 담당 영역이 다름 (topography)<\/td><td><b>25 기출 58 ②<\/b> (오답 선지: 고주파 감지부 서술)<br><span class=\"src\">17·25 기출, 19·26P: 고주파 = 기저부<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">전정 경로<small>Vestibular · 23·26P<\/small><\/td><td><b>Utricle · Saccule<\/b> (이석, otolith)<br><b>Semicircular canal<\/b> (3개, endolymph)<br>→ Vestibular n. → vestibular nucleus<br>→ Vestibulo-<b>ocular<\/b> / Vestibulo-<b>spinal<\/b> pathway<\/td><td>Utricle·saccule: 중력·관성 → <b>기울임·직선 운동<\/b> 감지<br>Semicircular canal: 림프액 흐름 → <b>회전<\/b> 감지 (좌우가 반대로 자극·억제)<br>Hair cell: stereocilia가 kinocilium 쪽으로 휘면 자극, 반대면 억제<br>Vestibulo-ocular: 머리가 움직여도 시선 고정 (yoked movement)<br>Vestibulo-spinal: 자세·균형 근육 무의식 조절 (노인 낙상)<\/td><td><span class=\"src\">Balance = visual + vestibular + proprioception + CNS 통합 → 하나라도 문제면 어지럼<br>Caloric test: COWS (Cold-Opposite, Warm-Same) · 17·19P<br>17 기출 43 ③ (정답): 반고리관 3축 · 주머니(utricle·saccule) 2개<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">후각 경로<small>Olfactory · 25ま<\/small><\/td><td>Olfactory receptor → olfactory bulb·tract<br>→ <b>Orbitofrontal cortex<\/b> (경로 짧음, 시상 거치지 않음)<br>→ 구피질 · <b>Entorhinal cortex<\/b> → 해마·편도<\/td><td>공기 중 화학물질을 receptor로 감지 (receptor 많을수록 저농도도 감지)<br>인간은 시각에 의존 → 후각 receptor 일부를 시각으로 재배분<br>Entorhinal cortex: 후각 정보를 받아 <b>기억과 연결<\/b><br>구피질: 본능·감정과 연관 → 후각 기억·감정은 강하고 오래 감<\/td><td><b>25 기출 58 ③<\/b> (오답): 후각은 <b>감정·기억에 중요<\/b> (22·25P)<br><b>23 기출 44<\/b>: 기억 관련 구조 = <b>내후각피질<\/b><br><span class=\"src\">17 기출: 후각 → orbitofrontal (insula 아님)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">미각 경로<small>Taste · 25ま<\/small><\/td><td>Taste bud → CN 7 (앞 2/3) · CN 9 (뒤 1/3) · CN 10<br>→ Solitary nucleus → VPM → <b>Insula<\/b><\/td><td>단맛(영양) · 짠맛(osmolarity) · 신맛(acid-base) · 감칠맛(아미노산) · 쓴맛(못 먹는 것)<br><b>매운맛은 맛이 아니라 통증<\/b><\/td><td><b>25 기출 58 ⑤<\/b> (오답): 매운맛을 미각에 넣음<br><span class=\"src\">17 기출: 미각 → insula / 15 기출 12 ⑤ 정답<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">체성감각 경로<small>Somatosensory · 21·23·25·26P<\/small><\/td><td>수용체: <b>Meissner · Pacinian · Ruffini · Merkel<\/b> · free nerve ending<br><b>DCML<\/b> (dorsal column–medial lemniscus)<br><b>Spinothalamic tract<\/b><br>→ Thalamus → <b>Postcentral gyrus BA 3, 1, 2<\/b> (S1)<br>→ Posterior parietal <b>BA 5, 7<\/b><\/td><td>Meissner 두 점 감별 · Pacinian 진동 · Ruffini 피부 stretch · Merkel 압력 (2MPR) · free nerve ending 통증<br><b>DCML<\/b>: 미세촉각·진동·고유감각 — <b>myelinated<\/b>로 빠름, <b>연수에서<\/b> 교차<br><b>Spinothalamic<\/b>: 통증·온도 — myelin 적거나 없음, <b>척수에서 바로<\/b> 교차<br>BA 3,1,2: 일차 체성감각 / BA 5: 3,1,2 정보 받음, BA 7: 시각 신호까지 통합 = 이차 감각<\/td><td><b>25 기출 58 ④ (정답)<\/b>: 촉각은 고유감각·통감으로 나뉘어 서로 다른 경로<br><b>25 기출 60 ⑤ (정답)<\/b>: BA 5, 7 = 이차 감각 영역 (② BA 3,1,2는 운동 X)<br><span class=\"src\">homunculus: 손·얼굴·혀에 많은 뉴런 투자 (23 기출 43 = Homunculus)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\" rowspan=\"2\">운동 계획·실행 회로<small>Motor system · 26 NEW · 26P<\/small><\/td><td><b>Posterior parietal cortex<\/b><br>→ <b>Prefrontal cortex<\/b><br>→ <b>Premotor cortex<\/b> · <b>SMA<\/b> (둘 다 <b>BA 6<\/b>)<br>→ Basal ganglia ⇄ Thalamus (+ Cerebellum)<br>→ <b>Primary motor cortex BA 4<\/b> (precentral gyrus)<br>→ Pyramidal / Extrapyramidal tract → UMN → <b>LMN<\/b> (anterior horn) → NMJ (ACh) → 근육<\/td><td>Posterior parietal: 시각·청각·체성감각을 <b>통합<\/b>해 상황 파악 (중앙 처리), 움직인 뒤 오차 확인<br>Prefrontal: <b>행동 결정<\/b>, 장기 운동 계획 (싸울까 도망갈까)<br>Premotor: 구체적 운동 계획·조직, <b>외부 상황<\/b>에 대응<br>SMA: 외부 신호 없이 <b>자발적·연속<\/b> 동작<br>Primary motor: 연결된 근육에 최종 명령 (손·얼굴·혀·눈에 영역 큼)<br>Pyramidal tract: 연수 피라미드를 지나며 <b>실제 동작<\/b> 수행 / Extrapyramidal: 동작을 위한 <b>자세·균형·안정<\/b><\/td><td><b>25 기출 60<\/b>: BA 4 = 일차 <b>운동<\/b> (감각 X), BA 8 = frontal eye field (premotor X), BA 6 = premotor + SMA 함께<br><span class=\"src\">15 기출 11 ②: premotor·SMA 모두 <b>전두엽<\/b><br>central sulcus 앞 motor / 뒤 sensory (17 기출)<\/span><\/td><\/tr>\n<tr><td colspan=\"3\"><span class=\"src\">전두엽(뇌의 2/3): 신호 조합, 감정·성격·계획 → 손상 시 억제 기능 상실·탈억제 (17 기출 31 = 전두엽) · 동기 저하<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">기저핵 회로<small>Basal ganglia · 26 NEW · 26P<\/small><\/td><td><b>Striatum<\/b> (caudate + putamen)<br><b>Globus pallidus<\/b><br><b>Subthalamic nucleus<\/b><br><b>Substantia nigra<\/b><br>⇄ Thalamus ⇄ Cortex<\/td><td>Striatum: <b>입력부<\/b> / GP: <b>억제성<\/b> 신호 / STN: <b>흥분성<\/b> 신호 출력 / SN: 운동 조절부<br><b>Direct pathway<\/b>: 운동 촉진 / <b>Indirect pathway<\/b>: 불필요한 운동 억제<br>여러 운동 프로그램 중 적절한 것을 <b>선택<\/b>하는 gate, 나머지는 막음 · 프로그램 <b>인출 스위치<\/b><br><b>강화 학습<\/b>: 보상 결과로 좋은 운동 방식을 강화, 운동 순서 <b>습관화<\/b><\/td><td><b>22 기출 25 · 14 기출 13<\/b>: 기저핵은 <b>Papez 회로 아님<\/b><br><b>14 기출 14<\/b>: 기저핵은 non-declarative 기억에 관여<br><b>21 기출 27<\/b>: 미상핵 손상도 기억 장애 가능 (해마·편도·시상·미상핵 모두)<\/td><\/tr>\n\n<tr><td class=\"name\">운동 학습 회로<small>소뇌 vs 기저핵 · 26 NEW · 26P<\/small><\/td><td><b>Cerebellum<\/b><br>Basal ganglia<\/td><td>소뇌: <b>지도 학습<\/b> — 운동 명령의 복사본으로 결과를 예측 → 실제 감각 feedback과 비교해 <b>오차 수정<\/b>. 정밀도·힘·타이밍·균형 (자전거·컵 잡기)<br>기저핵: <b>강화 학습<\/b> — 보상 기반 선택, 순서 습관화 (건반 연주)<br>학습된 운동 기억은 그 일을 가장 많이 하는 area에 저장<\/td><td><b>25 기출 61<\/b>: 조건화 기억 = <b>소뇌<\/b> (편도는 '공포·감정' 조건화)<br><span class=\"src\">20 기출 30 ③: 조건화에 해마는 관여 X, 소뇌·편도가 관여<\/span><\/td><\/tr>\n\n<tr><td class=\"name\" rowspan=\"2\">언어 회로<small>Wernicke-Geschwind model · 26 NEW · 26P<\/small><\/td><td>Auditory cortex <b>BA 41, 42<\/b> / Visual cortex BA 17, 18<br>→ <b>Angular gyrus<\/b><br>→ <b>Wernicke's area BA 22<\/b> (21)<br>→ <b>Arcuate fasciculus<\/b><br>→ <b>Broca's area BA 44, 45<\/b><br>→ Motor cortex (발성) · <b>Exner's area<\/b> (쓰기)<\/td><td>Wernicke: 언어 <b>이해<\/b> (phonetic word recognition) → 손상 시 sensory aphasia (유창, 이해 X)<br>Broca: 언어 <b>표현<\/b>, speech production → 손상 시 motor aphasia (비유창, 이해 O)<br>Arcuate fasciculus: 두 영역 사이 정보 전달 → 손상 시 <b>conduction aphasia (따라 말하기 X)<\/b><br>Angular gyrus: 시각 → 청각 변환 (읽기) / Exner's area: writing<br><span class=\"src\">따라 말하기 보존 = transcortical · 둘 다 손상 = global<\/span><\/td><td><b>22 기출 53<\/b>: 언어 중추 중 감각 영역 = 그림 <b>4번, BA 22<\/b><br><b>18 기출 19<\/b>: C = arcuate fasciculus, E = 베르니케, G = 일차 시각<br><b>15 기출 11 ①<\/b> (오답): 둘을 잇는 것은 엑스너 X → arcuate<br><span class=\"src\">18 기출 09: 따라말하기 이상 = arcuate · 19 기출 24 ①②<\/span><\/td><\/tr>\n<tr><td colspan=\"3\"><figure style=\"display:inline-block;width:44%;vertical-align:top;margin-right:3%\"><img src=\"summary/exam-kimhw-language-areas.jpg\" alt=\"2022 기출 53번 언어 영역 그림\" loading=\"lazy\"><figcaption><span class=\"src\">2022 기출 53번: 언어 중추 중 감각 영역 = 4번 Wernicke (BA 22)<\/span><\/figcaption><\/figure><figure style=\"display:inline-block;width:28%;vertical-align:top\"><img src=\"summary/exam-kimhw-language-ceg.jpg\" alt=\"2018 기출 19번 언어 영역 그림\" loading=\"lazy\"><figcaption><span class=\"src\">2018 기출 19번: A Broca · B motor · C arcuate · D auditory · E Wernicke · F angular · G visual<\/span><\/figcaption><\/figure><\/td><\/tr>\n\n<tr><td class=\"name\">기억 회로<small>Memory · 20·25ま · 26P<\/small><\/td><td><b>Hippocampus<\/b> (삼중 시냅스 회로)<br><b>Entorhinal cortex<\/b><br>Medial temporal lobe · diencephalon (시상)<br>Striatum · Basal ganglia<br>Cerebellum · Amygdala · Neocortex<br>Prefrontal cortex<\/td><td>해마: <b>서술(declarative) 기억<\/b>·일화 기억, <b>LTP<\/b>, place·grid·time cell로 '언제·어디서' 기록<br>Entorhinal: 감각(후각) 정보를 기억과 연결<br>Striatum: 기술·습관 (procedural) / 소뇌: 골격근 조건화 / 편도: 감정 조건화 / Neocortex: priming<br>전두엽: 작업 기억 · 장기 기억 저장은 뇌 전체에 분산 (회상 = 흩어진 뉴런 집단을 동시에 켜 재구성)<br><span class=\"src\">LTP: glutamate → NMDA·AMPA → Ca²⁺ 유입·수용체 증가 → CREB → 새 단백질 → dendritic spine 변화 (26P)<\/span><\/td><td><b>14 기출 14<\/b>: non-declarative와 관계 없는 것 = <b>해마<\/b><br><b>20 기출 30<\/b>: ①–④ 모두 옳음<br><b>19 기출 24 ③<\/b> (오답): 공포 기억은 해마 X → 편도<br><span class=\"src\">15 기출 11 ④: 기술 습득은 해마 X → striatum · 15 기출: LTP (주관식)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">의식 회로<small>Consciousness · 26 NEW · 26P<\/small><\/td><td><b>ARAS<\/b> (뇌간 그물체)<br>→ <b>Thalamus ⇄ Cortex<\/b> loop<br>→ 장거리 신경망 (전두–두정 네트워크)<br><b>DLPFC<\/b> · 두정엽 <b>IPS<\/b><\/td><td>ARAS: 단순히 <b>깨움<\/b> (점화, 각성) / Thalamocortical loop 동기화 → 대뇌 피질이 <b>통합<\/b><br>의식 = 깨어남(wakefulness) + 인식(awareness) 둘 다 필요<br>GNWT: 전두–두정 '무대'에 무엇을 올릴지 / IIT: 얼마나 많이 연결돼 동시에 작동하나<br>DLPFC: 자발적 주의 (의지) / IPS: 지금 의식되는 항목을 모아 둠<\/td><td><span class=\"src\">Coma·전신마취 = 둘 다 낮음 / <b>Vegetative<\/b> = 깨어 있으나 awareness X / Minimally conscious = 약간 / REM·자각몽 = wakefulness 낮고 awareness 비교적 높음 (26P)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">보상 회로<small>Reward · dopamine 경로 · 26 NEW · 26P<\/small><\/td><td><b>VTA<\/b> → <b>Nucleus accumbens<\/b> (mesolimbic)<br>VTA → Prefrontal (mesocortical)<br><b>OFC · vmPFC<\/b><br>+ 변연계 (해마·편도)<\/td><td>VTA·측좌핵: 보상 시스템의 핵심 축, 욕구·동기 (mesolimbic) — 나이 들수록 쇠퇴 → 의욕 저하<br>Mesocortical: 가치 평가·충동 조절<br>OFC·vmPFC: 가치 계산, 감정 반응 조절·충동 억제 <b>'브레이크'<\/b> → 고장 시 충동·분노 조절 X (OFC는 TBI에서 잘 손상)<br>측좌핵: 보상·쾌락, 과도한 도파민 → 중독<br><b>Dopamine<\/b> = 동기부여 / <b>Serotonin<\/b> = 즐거움·만족<\/td><td><span class=\"src\">동기부여는 주로 전두엽 → 손상 시 멍해지고 의욕 저하 (25 강의 Motivation)<\/span><\/td><\/tr>\n\n<tr><td class=\"name\" rowspan=\"2\">변연계 · Papez 회로<small>Limbic system · 21ま 25주ま 王ま<\/small><\/td><td><b>Papez<\/b>: <b>해마<\/b> → <b>fornix<\/b> → <b>유두체<\/b> (mammillary body) → mammillothalamic tract → <b>시상 전핵<\/b> → <b>대상회<\/b> → 해마곁이랑·<b>내후각피질<\/b> → 해마<br>변연계 전체: + <b>편도<\/b>, 시상하부, septal nuclei, 측좌핵, olfactory bulb·tract<\/td><td>변연계 기능: <b>emotion, behavior, motivation, long-term memory, olfaction<\/b><br>해마: 일화 기억 / 편도: 정서 경보 (공포·투쟁-도피) / 시상하부: 자율신경 (sham rage)<br>대상회: 위쪽 cortex의 '인지'와 아래 변연계 '감정'을 통합·조절<br>측좌핵: 보상·쾌락<br>Papez 회로: limbic system의 main circuit, cortical control of emotion · storing memory<\/td><td><b>25 기출 62<\/b>: 감정·행동·기억 체계 (broad) = <b>limbic system<\/b> (Papez circuit 쓰면 오답)<br><b>22 기출 25 · 14 기출 13<\/b>: Papez 아닌 것 = <b>기저핵<\/b><br><b>13 기출 그림<\/b>: A 해마 · B 편도 · C fornix · D 시상 전핵 <span class=\"src\">(교수님 기출은 편도를 Papez 구조물에 포함, 교과서 고전 Papez에는 편도 없음)<\/span><\/td><\/tr>\n<tr><td colspan=\"3\"><figure style=\"display:inline-block;width:52%;vertical-align:top\"><img src=\"summary/exam-kimhw-papez.jpg\" alt=\"2013 기출 Papez 회로 그림\" loading=\"lazy\"><figcaption><span class=\"src\">2013 기출: Papez 구조물 — 답 A hippocampus, B amygdala, C fornix, D anterior nucleus of dorsal thalamus<\/span><\/figcaption><\/figure><\/td><\/tr>\n\n<tr><td class=\"name\">공포 회로 · 감정 조절<small>Fear circuitry · 15·16·19ま 25주ま<\/small><\/td><td>자극 → <b>Thalamus<\/b> → <b>Amygdala<\/b><br>→ emotional behavior / autonomic response / hormonal response<br>Amygdala·변연계 ⇄ <b>Prefrontal<\/b> → HPA axis<\/td><td>편도: <b>공포·불안·분노<\/b> 처리 → 결여·발달 X 시 무서움을 모름 (위험을 못 피함). 나이 들어도 잘 쇠퇴하지 않음<br>감정 생성 = 편도·변연계 (<b>액셀<\/b>) vs 감정 조율 = 전두엽 (<b>브레이크<\/b>)<br>트라우마·수면 부족·스트레스 → 편도 과활성 + 브레이크 실패 → 분노 폭발·우울<\/td><td><b>25 기출 63<\/b>: 파괴·유전적 형성 이상 시 무서움을 모름 = <b>편도체 (amygdala)<\/b><br><span class=\"src\">16 기출 58 ④ · 학습부 기출: 공포반응 구조물 = Amygdala<\/span><\/td><\/tr>\n\n<tr><td class=\"name\">항상성 조절<small>Hypothalamus · 19·21·22ま<\/small><\/td><td><b>Hypothalamus<\/b> (magno·parvocellular)<br><b>SCN<\/b> (suprachiasmatic n.)<br>Supraoptic n. · <b>PVN<\/b> (paraventricular n.)<br>Arcuate n. (NPY·POMC) · LHA<br>→ Pituitary (hypothalamo-pituitary axis)<\/td><td>Water · food · sleep-wake · 호르몬 (fertility) · 자율신경 · 체온 조절<br><b>SCN: 생체시계<\/b> (빛 신호로 낮밤 구분, melatonin)<br>Supraoptic·PVN: ADH / PVN: 스트레스 호르몬·체온<br>ARC·PVN·LHA: leptin·insulin·ghrelin 신호로 포만·배고픔 (에너지 대사)<br>Circadian rhythm: 잘 때 cortisol↓ melatonin↑ 체온↓ / 깰 때 cortisol↑<\/td><td><b>23 기출 45<\/b>: 생체시계 = <b>SCN<\/b> (14 기출 · 19·23P도)<br><b>22 기출 26<\/b>: 시상하부가 조절하지 않는 것 = <b>호흡 주기<\/b><br><b>19 기출 24 ⑤<\/b>: PVN = 스트레스 호르몬·체온 (옳음)<br><span class=\"src\">21 기출 28: 체중·수면·전해질·산염기 모두 (22 피드백에서 하나로 묶어 설명)<\/span><\/td><\/tr>\n<\/tbody><\/table>\n"}, {"title": "치매 종류별 비교 — AD·PDD·DLB·FTD·혈관성·급속진행성·가역적 (발현 시기·주요 증상·진단·치료)", "html": "summary/kimhw-dementia-types.html", "img": "summary/kimhw-dementia-types.jpg", "pdf": "summary/kimhw-dementia-types.pdf", "src": "26 학습부 19번 · 치매&퇴행성 질환 (⭐ = 26Pま, 기출 포인트는 같은 학습부의 기출 해설, 사진은 2013 기출 그림·기출 표시된 강의 슬라이드, 강의에 없는 치료는 일반 지식으로 표시)", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:11%\"><col style=\"width:17%\"><col style=\"width:26%\"><col style=\"width:25%\"><col style=\"width:21%\"><\/colgroup><thead><tr><th>치매 종류<\/th><th>발현 시기 · 경과<\/th><th>주요 증상<\/th><th>병리 · 진단 포인트<\/th><th>치료<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"name\">알츠하이머 치매<small>AD · 가장 흔함(약 2/3) · 빈도순 AD &gt; 혈관성 &gt; DLB (17ま 주관식)<\/small><\/td><td><b>70대 중후반~80대<\/b>, <b>가장 느리게 진행<\/b>(수년~10년↑, slowly progressive)<br>병태생리는 치매 진단 <b>15–20년 전<\/b>부터 시작 <span class=\"src\">(22ま 23번)<\/span>. 아밀로이드는 50대부터 쌓이고, plaque 증가 후 10–15년 잠복 뒤 임상 치매<br><b>Early onset<\/b>(65세 전, 가족성): APP·<b>presenilin 1·2<\/b>, 다운증후군은 40대에 AD 병리 <span class=\"src\">(15ま 주관식)<\/span><br><b>Late onset<\/b>(산발성): 위험 유전자 <b>APOE4<\/b> (4/4 위험 최고) <span class=\"src\">(15·14ま)<\/span><\/td><td><b>초기 최근 기억력 저하<\/b> → 측두엽 → 두정엽 → 전두엽 순서로 진행<br>MCI: 기억 감소·이름 안 떠오름, 일상생활 보존 → 초기: 판단장애, 시간·장소 혼동 → 중기: 의존, wandering, 거울 속 자신 모름 → 말기: bed-bound, 대소변, 사람 못 알아봄<br>의식은 말기까지 유지. <b>보행은 비교적 유지<\/b><br>환자마다 경과 다름 <span class=\"src\">(22ま 23번 ④ \"대부분 비슷한 경과\" 틀림)<\/span><br>위험인자: <b>고령·여성·가족력·심혈관 위험인자·우울증 모두<\/b> <span class=\"src\">(18ま 25번)<\/span><\/td><td><b>Amyloid plaque(세포 밖) + NFT(tau, 세포 안)<\/b> <span class=\"src\">(09·14·15·16ま 주관식)<\/span>. 주요 가설 = <b>amyloid(-tau) 가설<\/b><br>비정상 순서: <b>CSF Aβ42 → amyloid PET → FDG-PET → 해마 MRI → CSF tau → 인지 → 기능<\/b><br><figure style=\"margin:4px 0\"><img style=\"width:100%\" src=\"summary/exam-kimhw-ad-biomarker-curve.jpg\" alt=\"2013 기출 8번 · 치매 진행과정 그래프 a~e\" loading=\"lazy\"><figcaption>2013 기출 8번 · a Aβ amyloid → b tau → c brain structure → d memory → e clinical function<\/figcaption><\/figure>임상전기 진단 = <b>amyloid PET<\/b>·CSF 아밀로이드 <span class=\"src\">(17·18ま · 21ま 40번은 CSF 아밀로이드)<\/span><br>MRI: <b>medial temporal(해마) 위축 가장 먼저<\/b> · FDG-PET: <b>temporoparietal·후대상회<\/b> 저하<br>CSF: Aβ↓ + tau↑일 때만 AD<br>혈액: <b>p-Tau(217)<\/b> = 시작·진행 모니터링 <span class=\"src\">(25ま 73번, 정답률 19%)<\/span> ⭐<\/td><td><b>MCI부터 치료 시작<\/b> ⭐<br><b>증상 개선<\/b>(인정 약 4가지, 21Pま): AChEI <b>donepezil·galantamine<\/b>(경구)·<b>rivastigmine<\/b>(patch) + NMDA 차단제 <b>memantine<\/b>, 복합제도 사용<br><b>항아밀로이드 항체<\/b> ⭐: <b>lecanemab<\/b>(레켐비, 2024 국내) 1년에 Aβ 약 80%↓, 세포를 살리진 못하지만 <b>진행 속도↓<\/b>. 부작용 <b>ARIA<\/b> <span class=\"src\">(25ま 74번 주관식)<\/span> → 1년 반에 MRI 5–6회. Donanemab(키순라) 승인 예정. 표적 = <b>베타 아밀로이드<\/b> <span class=\"src\">(21·23ま)<\/span><br>항콜린제 X <span class=\"src\">(22ま ⑤ 틀림)<\/span><br>예방: 중년 위험요인 관리로 약 45%↓, 가장 큰 요소(각 7%) = <b>청력 감퇴·높은 LDL<\/b> <span class=\"src\">(25ま 75번)<\/span><\/td><\/tr>\n<tr><td class=\"name\">파킨슨병 치매<small>PDD · Lewy body disease<\/small><\/td><td><b>파킨슨병이 먼저<\/b>, 수년(5–10년) 뒤 치매 <span class=\"src\">(20·21ま 26번: 8년 전 PD → 4년 전 말·단어 → 1년 전 기억력)<\/span><br>파킨슨병의 <b>후기에 인지감퇴<\/b> 가능 <span class=\"src\">(21ま 24번 정답)<\/span><\/td><td>운동증상 선행: resting tremor(비대칭), rigidity, 서동, 자세 불안정, shuffling gait<br>초기 비운동 증상: <b>후각 저하·자율신경(기립성 저혈압)·통증·감정 문제<\/b> ⭐<br>이후 기억·언어·시공간·실행 능력 전반 저하<\/td><td><b>α-synuclein<\/b> Lewy body, <b>중뇌 흑색질<\/b>에서 시작해 뇌간 중심으로 퍼짐<br><b>아밀로이드 이상은 동반되지 않음<\/b> <span class=\"src\">(21ま 26번 정답 ④)<\/span> — 해마 위축·APOE와 무관<br>도파민 영상(CIT-PET/DAT): 선조체 '토끼 모양'에서 몸통·뒷다리 소실 ⭐<\/td><td><span class=\"src\">강의에 PDD 따로 없음 — 일반 지식:<\/span> AChEI(<b>rivastigmine<\/b> 등)로 인지 증상 개선 + 운동증상엔 <b>levodopa<\/b> 등 파킨슨 약<\/td><\/tr>\n<tr><td class=\"name\">루이소체 치매<small>DLB · Dementia with Lewy bodies (영어 full term 주관식 18ま)<\/small><\/td><td><b>60대 후반~70대 초반<\/b><br>파킨슨증과 치매가 <b>동시에<\/b>(또는 파킨슨증이 두드러지지 않음) <span class=\"src\">(25Pま)<\/span><br><b>AD보다 빠르게 진행<\/b> <span class=\"src\">(23ま 26번 ④)<\/span><br>수면장애(잠꼬대)가 먼저 시작하는 경우 많음 <span class=\"src\">(25Pま)<\/span><\/td><td><figure class=\"fr\" style=\"width:38%;max-width:none\"><img src=\"summary/kimhw-dlb-core.jpg\" alt=\"DLB main feature 슬라이드 (18·19·21·23ま)\" loading=\"lazy\"><figcaption>DLB main feature 슬라이드 (18·19·21·23ま)<\/figcaption><\/figure>핵심 4가지: ① <b>인지·주의의 변동(fluctuation)<\/b>, 섬망처럼 좋았다 나빴다 ② <b>반복되는 선명한 환시<\/b> ③ <b>REM 수면행동장애<\/b>(자다 팔다리 휘두름) <span class=\"src\">(주관식: 퇴행성 질환 수면장애 = RBD)<\/span> ④ <b>파킨슨증<\/b><br>보조: 반복 낙상·실신, <b>항정신병약 과민<\/b>(15ま: 약 먹고 일주일 못 일어남), 자율신경 이상<br>초기엔 기억력보다 <b>주의·시공간·실행<\/b> 저하가 두드러짐<\/td><td>α-synuclein Lewy body가 <b>뇌간 + 대뇌피질 전체(diffuse)<\/b><br>FDG-PET: AD 패턴 + <b>후두엽(occipital)<\/b> 저하 <span class=\"src\">(사례 주관식 59번)<\/span><br>파킨슨 증상 없어도 진단 가능 <span class=\"src\">(23ま 26번 ⑤ · 21ま 24번 ③ 틀림)<\/span><br>핵심소견 아닌 것 = <b>낙상<\/b> <span class=\"src\">(20ま 35번 · 기출 16번)<\/span>, 탈억제는 FTD <span class=\"src\">(15ま 20번 ⑤)<\/span><br>보조 검사: DAT(CIT-PET) 도파민↓, 수면다원검사 RBD, MIBG<\/td><td>AD 약(<b>AChEI<\/b>) + 파킨슨 약 <span class=\"src\">(옛 학습부)<\/span><br><b>항정신병약 주의<\/b>(과민 반응)<br>도파민을 PD보다 더 많이 쓰지 않음 <span class=\"src\">(21ま 24번 ⑤ 틀림)<\/span><\/td><\/tr>\n<tr><td class=\"name\">전측두엽 치매<small>FTD · Frontotemporal dementia · 21·23ま<\/small><\/td><td><b>60대 초반, 젊은 나이(early onset)<\/b> — AD보다 젊음 <span class=\"src\">(21ま 27번 정답 ④)<\/span><br><b>진행이 빠름<\/b><br>유전 경향 많음(chr 17)<\/td><td><b>초기에 기억장애 적음<\/b>, <b>언어장애·이상행동<\/b>이 초기 주증상 → 점차 기억·시공간·실행 저하 <span class=\"src\">(23ま 주관식 · 20ま 58세 증례)<\/span><br><b>행동형<\/b>: 탈억제·성적 행동, 무감동, 공감 결여, 반복·강박, 위생관념 소실, 이상 식습관, 분위기 파악 못함(장례식장에서 노래, 노상방뇨 — 17ま 51번)<br><b>언어형(PPA)<\/b>: svPPA(앞 측두엽, 단어 뜻 모름) · nfaPPA(문법 오류) · lvPPA(말의 양 감소)<br><b>운동형<\/b>: ALS 동반(FTD-MND), CBD, PSP<br>정신행동증상이 더 심함 <span class=\"src\">(21ま ② 틀림)<\/span><\/td><td><b>Tau only, 아밀로이드는 문제 없음<\/b> <span class=\"src\">(19·20Pま ⭐)<\/span> → CSF 아밀로이드·타우 검사 도움 X <span class=\"src\">(21ま ⑤ 틀림)<\/span>. ALS 동반형은 TDP-43·FUS(교과서)<br>MRI·FDG-PET: <b>전두엽·측두엽<\/b> 위축·대사 저하(일측/양측) ↔ AD는 temporoparietal<\/td><td><b>치료제 없음<\/b><br><b>AChEI 효과 없음<\/b>(콜린 결핍이 없어서, 17ま 51번 d) <span class=\"src\">(21ま ① 틀림)<\/span><br>행동증상 대증치료(BPSD 원칙: 행동요법 먼저, 공격성 antipsychotics, 우울 SSRI 등)<\/td><\/tr>\n<tr><td class=\"name\">혈관성 치매<small>Vascular dementia · 두 번째로 흔함 · 22ま<\/small><\/td><td><b>Post-stroke<\/b>: 뇌졸중 후(3개월 이내) 갑자기 발병, <b>계단식 악화·변동<\/b><br><b>Multi-infarct<\/b>: 뇌졸중이 반복될 때마다 악화<br><b>Subcortical(CSVD)<\/b>: 뇌졸중 병력 없이 <b>서서히 진행<\/b><br>발병 연령은 유형마다 조금씩 다름<\/td><td>인지보다 <b>거동 능력 저하<\/b>가 두드러짐: 맹하고·둔하고·멍하고·느리고·뻣뻣하고·떨리고·우울·<b>요실금<\/b>·비틀비틀<br>느리게 걷지만 <b>몸이 앞으로 쏠리지 않음<\/b>(파킨슨 감별)<br>Post-stroke형은 마비·실어 등 국소 신경학적 징후, subcortical형은 <b>국소징후 없음<\/b> → \"국소 증상 없는 혈관성 치매는 매우 드물다\" 틀림 <span class=\"src\">(기출 25번 ④)<\/span><br><b>Strategic infarct dementia<\/b>: 시상·미상핵 등 한 곳 경색으로 치매 <span class=\"src\">(15ま 96번 주관식)<\/span><\/td><td><b>뇌영상에 혈관 병변이 있어야 진단<\/b> ⭐<br>Stroke(LACI·IS·CE·LAD·ICH) 또는 <b>CSVD<\/b>: lacune, <b>WMH<\/b>, deep microbleed, deep ICH가 쌓여 한도를 넘으면 치매<br>유전 경향 + 뇌경색·출혈 + 점진적 인지장애 = <b>Cerebral amyloid angiopathy<\/b> <span class=\"src\">(25ま 59번 주관식)<\/span><br>CADASIL·moyamoya·Binswanger는 slowly progressive로 분류 <span class=\"src\">(25ま 72번 오답 선지)<\/span><\/td><td><span class=\"src\">강의는 AD 중심 — 일반 지식:<\/span> <b>혈관 위험인자 관리<\/b>(고혈압·당뇨·고지혈·금연)와 <b>재발 예방<\/b>(항혈소판제 등)이 기본, 인지 증상엔 AChEI·memantine 보조<\/td><\/tr>\n<tr><td class=\"name\">급속 진행성 치매<small>Rapidly progressive · 25ま<\/small><\/td><td><b>수개월~수년<\/b>에 급격히 진행<br>치매와 다른 병이 치매 모양을 띰 → 근본 원인을 찾아야 함<\/td><td>짧은 기간에 인지 저하 + 원인 질환 증상<br>대표: <b>CJD(광우병)<\/b> — 수개월에 걸친 급성 치매 <span class=\"src\">(기출 25번 ① 맞음)<\/span><\/td><td>CJD: <b>prion<\/b> 단백 → 피질 전체 spongiosis(proteinopathy)<br>자가면역(<b>autoimmune limbic encephalitis<\/b>, Hashimoto), 뇌염, 혈관염, 림프종·교종, 약물중독, 간·신부전, 만성 경막하혈종<br>급격히 진행하는 것 = <b>만성 자가면역 뇌염<\/b> <span class=\"src\">(25ま 72번, 정답률 13%)<\/span> ↔ AD·PD·헌팅턴·CADASIL은 느림<\/td><td>원인 질환 치료 <span class=\"src\">(자가면역 뇌염은 면역치료, 경막하혈종은 수술 등 — 일반 지식)<\/span>. CJD는 치료법 없음<\/td><\/tr>\n<tr><td class=\"name\">치료 가능한(가역적) 치매<small>Treatable form · 옛 기출<\/small><\/td><td>원인에 따라 다양, 원인 교정 시 호전<\/td><td><b>정상압 수두증<\/b>: <b>보행장애·배뇨장애<\/b>가 초기 → 치매 <span class=\"src\">(기출 25번 ② 맞음)<\/span><br><b>우울증(거짓치매)<\/b>: 스트레스·우울, 집중력 저하, 일상은 유지 <span class=\"src\">(주관식: pseudodementia)<\/span><br>B12·엽산 결핍, 갑상선기능저하, 중독(약물·알코올), 대사·내분비 질환<\/td><td>진단 시 혈액검사: 간·신장 기능, <b>TFT, Vit B12<\/b>, APOE<br>AD는 비가역 = treatable form 아님 <span class=\"src\">(옛 기출 27번)<\/span><\/td><td>원인 교정: 션트(NPH), 비타민 보충, 갑상선호르몬, 우울증 치료, 원인 약물 중단 <span class=\"src\">(일반 지식)<\/span><\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><b>한눈에 감별<\/b><ul>\n<li>발병 연령: <b>FTD 60대 초반 &lt; DLB 60대 후반~70대 초반 &lt; AD 70대 중후반~80대<\/b> · 진행 속도: FTD 가장 빠름, DLB도 AD보다 빠름, <b>AD 가장 느림<\/b><\/li>\n<li>쌓이는 단백: AD = <b>amyloid + tau<\/b> · PD/PDD·DLB = <b>α-synuclein<\/b>(PD는 흑색질, DLB는 피질 전체) · FTD = <b>tau only<\/b> · CJD = prion · 헌팅턴 = huntingtin(기저핵)<\/li>\n<li>PDD vs DLB: <b>파킨슨이 먼저 → 치매<\/b> = PDD / <b>동시 또는 파킨슨 없이 환시·변동·RBD<\/b> = DLB<\/li>\n<li>약: AChEI 효과 있음 = AD·DLB(·PDD) / <b>FTD는 효과 없음<\/b> · 항아밀로이드 항체는 AD만<\/li>\n<\/ul><figure style=\"width:46%;margin:8px 0 0\"><img style=\"width:100%\" src=\"summary/kimhw-fdg-pet.jpg\" alt=\"FDG-PET 치매별 포도당 대사 저하 부위 (강의 슬라이드)\" loading=\"lazy\"><figcaption>FDG-PET 강의 슬라이드: AD temporoparietal·후대상회 · DLB AD 패턴 + occipital · FTD frontal·temporal<\/figcaption><\/figure><\/div>\n"}]}, {"prof": "임성철", "items": [{"title": "말초신경·근육 질환·말초신경초 종양 — 병리학적 소견과 임상증상 비교", "html": "summary/lim-peripheral-muscle-path.html", "img": "summary/lim-peripheral-muscle-path.jpg", "pdf": "summary/lim-peripheral-muscle-path.pdf", "src": "26 학습부 15번 · 신경병리 — 26Pま 표시 또는 2021~2025 기출 내용만 (사진은 강의 슬라이드) · 2019 기출 사진 2장(19ま)은 혹시 몰라 포함", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:12%\"><col style=\"width:36%\"><col style=\"width:25%\"><col style=\"width:18%\"><\/colgroup><thead><tr><th>병변 위치<\/th><th>질환<\/th><th>병리학적 소견<\/th><th>임상증상<\/th><th>26Pま · 21~25 기출<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\" rowspan=\"4\">① 말초신경<small>myelin · axon<\/small><\/td><td class=\"name\">Dejerine-Sottas disease<small>유전성 탈수초 신경병증<\/small><\/td><td>축삭 굵기에 비해 myelin이 얇은 <b>hypomyelinated axon<\/b>, 일부 unmyelinated/demyelinated axon. 탈수초에 대한 보상으로 remyelination → <b>onion bulb<\/b> (remyelination 질환이 아니라 demyelination의 결과)<\/td><td>근육이 정상 신경지배를 못 받아 운동·감각 이상<\/td><td>2021: hypomyelination + 뚜렷한 onion bulb = 대표 질환 · onion bulb 26Pま<\/td><\/tr>\n<tr><td class=\"name\">Charcot-Marie-Tooth<small>HMSN type 1 · peroneal muscular atrophy<\/small><\/td><td><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/lim-onion-bulb.jpg\" alt=\"Onion bulb (강의)\" loading=\"lazy\"><figcaption>Onion bulb (강의)<\/figcaption><\/figure>가장 흔한 유전성 말초신경병증, <b>AD<\/b>. 말초신경 <b>segmental demyelination → remyelination<\/b> 반복 → Schwann cell 증식 = <b>onion bulb<\/b> (hypertrophic neuropathy). 근육은 neuropathy 소견: small angulated fiber, grouped atrophy, fibrosis, 핵이 체인처럼 몰린 pyknotic nuclear clumps<\/td><td><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/lim-cmt-feet.jpg\" alt=\"Pes cavus (강의)\" loading=\"lazy\"><figcaption>Pes cavus (강의)<\/figcaption><\/figure>10대 발병. 하지 원위부(<b>peroneal m.<\/b>) 위축 → <b>거꾸로 선 샴페인 병<\/b> 다리, <b>pes cavus<\/b>(요족), 발 위약·보행장애. 운동+감각 동시 침범. <b>수명 정상<\/b><\/td><td>26Pま · 2023: 주된 침범 부위 = <b>peripheral sensory nerve<\/b><\/td><\/tr>\n<tr><td class=\"name\">Wallerian degeneration<small>말초신경 절단·압궤 (axonal injury)<\/small><\/td><td>절단부 <b>원위부<\/b> axon·myelin 변성(<b>anterograde<\/b>), 근위부는 가장 가까운 Ranvier node까지만 역행. Cell body: <b>central chromatolysis<\/b>(부종, 핵·Nissl body 가장자리로). Macrophage가 myelin 탐식 → <b>myelin digestion chamber<\/b>, myelin figure, beaded axon<br>재생: 4일 내 axonal sprout, 하루 1~3 mm(임상 1 mm). 연결 실패 시 <b>traumatic neuroma<\/b>(진짜 종양 아닌 reactive regeneration)<\/td><td>외상(칼·프레스)으로 해당 신경 지배 근육의 운동·감각 소실. 봉합·고정 시 재연결 가능, 재연결돼도 기능 회복은 늦음. 절단술 후 neuroma → 의족 압박 통증 → 제거 수술<\/td><td>26Pま · 2025: <b>원위부<\/b> 축삭·수초 파괴(③) · 2023: median n. 절단 → Wallerian · central chromatolysis 26Pま · traumatic neuroma 26Pま<\/td><\/tr>\n<tr><td class=\"name\">Axonal degeneration<small>neuron 대사 이상 (toxic·anoxic)<\/small><\/td><td>Axoplasmic transport 저하 → 가장 먼 말단부터 cell body 쪽으로 죽어 올라감(<b>dying back, retrograde<\/b>), 결국 cell body까지 사멸. 근원은 neuron. EM: axon 소실 + myelin 찌꺼기, macrophage<\/td><td>원위부부터 진행하는 운동·감각 저하, <b>reunion 불가<\/b><\/td><td>26Pま (Wallerian과 구분)<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">② 말초신경초<small>종양<\/small><\/td><td class=\"name\">Schwannoma<small>neurilemmoma · NF2 연관<\/small><\/td><td><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-schwannoma.jpg\" alt=\"Neurilemmoma (강의)\" loading=\"lazy\"><figcaption>CPA neurilemmoma (강의)<\/figcaption><\/figure>Nerve sheath(neurilemma)의 <b>Schwann cell에서만<\/b> 발생. <b>피막(capsule) 잘 형성<\/b>, 핵이 울타리처럼 늘어선 <b>palisading pattern<\/b>. <b>악성화하지 않음<\/b>(아무리 오래돼도), malignant counterpart 없음<br><span class=\"src\">종양 자체는 유전형질 아님, AD인 것은 NF2<\/span><\/td><td>m/c site: <b>cerebellopontine angle<\/b>, 제8신경(acoustic neuroma, NF2에서 양측) → <b>이명·청력 소실<\/b><\/td><td>26Pま: 악성화하지 않음, malignant schwannoma(MPNST)와 다르다고 강조<\/td><\/tr><tr><td class=\"name\">MPNST<small>malignant peripheral nerve sheath tumor (옛 malignant schwannoma)<\/small><\/td><td><b>Neurofibroma의 malignant counterpart<\/b>(schwannoma가 악성화한 것 아님). Primary 또는 <b>NF1의 plexiform neurofibroma<\/b>가 방사선 치료 등 강한 자극 후 악성 전환<\/td><td>NF1 환자의 plexiform neurofibroma 부위, post-RT<\/td><td>26Pま<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">③ 운동신경세포<small>neurogenic atrophy<\/small><\/td><td class=\"name\">SMA<small>Werdnig-Hoffmann (m/c type) · 선천성 denervation atrophy<\/small><\/td><td><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/lim-sma.jpg\" alt=\"SMA 근생검 (강의)\" loading=\"lazy\"><figcaption>SMA 근생검 (강의)<\/figcaption><\/figure><b>척수 전각 운동신경원 소실<\/b>(LMN). 근생검: <b>panfascicular / grouped atrophy<\/b>이지만 둥글게 쪼그라들 뿐 <b>small angulated fiber 없음<\/b>(neurogenic인데 angulated 없는 대표 질환), 사이사이 큰 섬유 = pseudohypertrophy(의미 없음)<\/td><td><b>Floppy baby<\/b>: 출생 직후~4개월 발병, 고개·사지 못 가눔, shoulder·pelvic girdle 위축, 연하근·호흡근 hypotonia → 호흡부전·수유 불가로 대개 2~3세 전 사망. 치료: <b>Zolgensma<\/b>(원샷), Spinraza·Evrysdi<\/td><td>26Pま · 2025: <b>척수 전각 운동신경원 손실<\/b>(③) · 2023: 3세 여아 + grouped atrophy → Werdnig-Hoffmann · Zolgensma 26Pま<\/td><\/tr>\n<tr><td class=\"name\">ALS<small>Lou Gehrig · motor neuron disease<\/small><\/td><td><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/lim-als.jpg\" alt=\"ALS 근생검·전각 (강의)\" loading=\"lazy\"><figcaption>ALS 근생검·전각 (강의)<\/figcaption><\/figure><b>UMN + LMN 동시 침범<\/b>: ant. horn cell 감소·위축(amyotrophy) + <b>lateral corticospinal tract<\/b> pallor·경화(lateral sclerosis). 근생검: <b>grouped atrophy, small angulated fiber, collateral sprouting → fiber type grouping<\/b>(reinnervation). 분자병리 <b>TDP-43<\/b>이 핵 밖 세포질·축삭질에 응집(26NEW)<\/td><td>40대 이상, M&gt;F, 5~10% AD(21번 염색체). 초기: 손으로 물건을 자꾸 떨어뜨림(보행장애보다 먼저) → 혀·입 근육 위축으로 침 흘림·연하·발음 장애. <b>대칭적 근위축 + 반사항진·경직<\/b><\/td><td>2025 주관식: <b>UMN과 LMN<\/b> 둘 다 · 2023 주관식: grouped atrophy·small angulated fiber · 2022·2021: 먼 것 = papova virus 연관 · TDP-43 26NEW<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"1\">④ 신경근접합부<small>NMJ<\/small><\/td><td class=\"name\">Myasthenia gravis<\/td><td><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/lim-mg-lymphorrhage.jpg\" alt=\"Lymphorrhage (강의)\" loading=\"lazy\"><figcaption>Lymphorrhage (강의)<\/figcaption><\/figure><figure class=\"fr\" style=\"width:30mm\"><img src=\"summary/exam-lim-mg-esterase.jpg\" alt=\"2019 기출 4번 · NMJ esterase 염색\" loading=\"lazy\"><figcaption>19ま · 2019 기출 4번: NMJ esterase 염색 → MG<\/figcaption><\/figure>Postsynaptic: <b>AChR 수 감소 + 순환 anti-AChR 자가항체<\/b>(blocking, type II HSR). Esterase 염색에서 <b>NMJ가 작고 흔적만<\/b>(small NMJ). Thymoma 동반 시 perimysium·endomysium에 T 림프구 집단 = <b>lymphorrhages<\/b><\/td><td>눈꺼풀 처짐·복시·구음장애가 <b>아침에 경하고 저녁에 악화<\/b>, 호흡곤란. ACh 방출·신경전도는 정상. <b>Thymic hyperplasia·thymoma<\/b>. 진단: <b>Tensilon test<\/b>(초단기 anti-ChE 주사 후 즉시 호전)<\/td><td>26Pま · 2025 주관식: <b>AChR<\/b> · 2019 사진(19ま): esterase 염색 → MG · 2022: 먼 것 = type 1 근섬유 내 막대모양 과립(nemaline) · Tensilon 26Pま<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"2\">⑤ 근육<small>myopathy · X-linked dystrophin<\/small><\/td><td class=\"name\">Duchenne MD<\/td><td><figure class=\"fr\" style=\"width:18mm\"><img src=\"summary/exam-lim-dmd-westernblot.jpg\" alt=\"2019 기출 3번 · dystrophin Western blot\" loading=\"lazy\"><figcaption>19ま · 2019 기출 3번: Western blot (1 대조, 2 환자) → DMD<\/figcaption><\/figure><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-dmd-ihc.jpg\" alt=\"DMD dystrophin IHC (강의)\" loading=\"lazy\"><figcaption>DMD IHC·blot (강의)<\/figcaption><\/figure>Xp21 <b>dystrophin 결핍<\/b>(actin–sarcoglycan/dystroglycan–laminin 연결 소실). 초기 degeneration·pyknotic nuclei·일부 regeneration → 진행하면 endomysial·perimysial <b>fibrosis + fat infiltration<\/b>, 핵 내재화. Dystrophin IHC: subsarcolemma <b>전혀 염색 안 됨<\/b>. 근육 Western blot: <b>band 없음<\/b><\/td><td><b>X-linked 열성<\/b>, 남아. 5세 이전 발현 → 10~12세 휠체어 → 20대 초반 사망. <b>Pelvic girdle<\/b>부터 중심→말단, <b>Gower sign<\/b>, <b>calf pseudohypertrophy<\/b>(fibrosis·fat), CK 매우 상승<\/td><td>26Pま · 2022: 먼 것 = <b>상염색체<\/b> 열성 유전 · 2019 사진(19ま): Western blot band 없음 → DMD · Gower sign·calf 가성비대 26Pま<\/td><\/tr>\n<tr><td class=\"name\">Becker MD<\/td><td><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-becker-ihc.jpg\" alt=\"Becker dystrophin IHC (강의)\" loading=\"lazy\"><figcaption>Dystrophin IHC: 정상 vs Becker (강의)<\/figcaption><\/figure>Dystrophin <b>감소 또는 비정상 크기<\/b>(완전 결실 아님). IHC <b>정상보다 약하게<\/b>, Western blot band 약함·abnormal size. 27세 생검: endomysial fibrosis, fiber size variation, 핵 internalization<\/td><td>DMD보다 늦게(12세 전후~성인) 서서히 진행, <b>성인까지 생존<\/b>, hip girdle부터. <b>Myalgia 없음<\/b>, calf pseudohypertrophy<br><span class=\"src\">감별 McArdle(당원축적병): 운동 시 심한 myalgia, second-wind, 가성비대 없음 (26Pま)<\/span><\/td><td>26Pま (no myalgia) · 2025: dystrophin <b>감소·비정상 형태<\/b>(④) · 2022 주관식: 30세·myalgia 없음·blot 감소 → Becker<\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-denervation.jpg\" alt=\"Denervation 근생검 (강의)\" loading=\"lazy\"><figcaption>Denervation 근생검 (강의)<\/figcaption><\/figure><b>근생검으로 원인 위치 가르기<\/b><ul><li><b>Neurogenic atrophy<\/b>(신경 → 근육 2차): <b>grouped atrophy, small angulated fiber<\/b>(26Pま), <b>target fiber<\/b>(NADH·Gomori), <b>pyknotic nuclear clumps<\/b>, <b>fiber type grouping<\/b>(denervation 후 reinnervation 중이라는 증거, 26Pま). 예외: SMA는 angulated fiber 없음 <span class=\"src\">· 2022 주관식: 척추 손상 후 하지근 생검 소견 2개<\/span><\/li><li><b>Onion bulb<\/b>는 신경원성 근위축이 아니라 <b>segmental demyelination → remyelination<\/b>의 소견 <span class=\"src\">· 26Pま<\/span><\/li><li><b>Myopathy<\/b>(근육 자체): fiber size variation, fibrosis, fat infiltration, 핵 내재화 — 신경은 정상 (DMD·Becker)<\/li><li><b>기본 개념 (26Pま)<\/b>: myelination은 large fiber 거의 다, intermediate는 있을 수도 없을 수도, small fiber(&lt;2 μm)는 대개 unmyelinated · 축삭이 굵을수록 myelin도 두꺼움 · <b>segmental demyelination<\/b> = 랑비에 결절 1~2개 구간만 myelin 소실, axon은 그대로(P0+silver 이중염색, nerve teasing) · 근섬유 <b>type 1<\/b>(slow, fat, red, oxidative, mitochondria↑)과 <b>type 2<\/b>는 정상에서 checkerboard로 섞여 있고 염색에 따라 색이 반대일 뿐<\/li><li><b>Disuse atrophy<\/b>(깁스·장기 침상): <b>type 2<\/b> fiber가 가장 먼저·빠르게 위축 <span class=\"src\">· 2022: type 2 muscle fiber의 angular atrophy<\/span><\/li><\/ul><\/div>\n"}, {"title": "중추신경계 퇴행성·탈수초 질환 — Parkinson·Alzheimer·ALS·MS", "html": "summary/lim-cns-degenerative-path.html", "img": "summary/lim-cns-degenerative-path.jpg", "pdf": "summary/lim-cns-degenerative-path.pdf", "src": "26 학습부 15번 · 신경병리 — 26Pま 표시 또는 2021~2025 기출 내용만 (사진은 강의 슬라이드)", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:12%\"><col style=\"width:36%\"><col style=\"width:25%\"><col style=\"width:18%\"><\/colgroup><thead><tr><th>병변 위치<\/th><th>질환<\/th><th>병리학적 소견<\/th><th>임상증상<\/th><th>26Pま · 21~25 기출<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\">① Basal ganglia · brain stem<small>퇴행성 (gray matter)<\/small><\/td><td class=\"name\">Idiopathic Parkinson disease<small>Paralysis agitans<\/small><\/td><td><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-pd-nigra.jpg\" alt=\"PD substantia nigra pallor (강의)\" loading=\"lazy\"><figcaption>정상 vs PD substantia nigra (강의)<\/figcaption><\/figure>육안: <b>substantia nigra pallor<\/b>(melanin 감소). 현미경: compact zone의 pigmented, catecholaminergic (dopaminergic) neuron 소실 + <b>gliosis<\/b>. 남은 neuron에 <b>Lewy body<\/b> = α-synuclein 응집, intracytoplasmic rounded eosinophilic inclusion. Nigrostriatal 경로 dopamine↓ → 상대적 ACh↑<\/td><td>Resting tremor, rigidity, 수의운동↓·불수의운동↑. 연령 증가에 따라 증가, dementia 동반 가능. 원인(두부 외상·약물) 있으면 parkinsonism일 뿐 IPD 아님<br><span class=\"src\">DLB: 치매 먼저 또는 파킨슨증 후 1년 이내 치매 / AD: 치매 먼저, 1년 훨씬 지나 파킨슨증<\/span><\/td><td>26Pま · Lewy body 26Pま · DLB vs AD 구분 26Pま<\/td><\/tr>\n<tr><td class=\"loc\">② Cerebral cortex<small>퇴행성<\/small><\/td><td class=\"name\">Alzheimer disease<\/td><td><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-ad-plaque-tangle.jpg\" alt=\"Plaque와 tangle (강의)\" loading=\"lazy\"><figcaption>Amyloid plaque · tangle (강의)<\/figcaption><\/figure>육안: cortical atrophy(1300 → 800~900 g), gyrus 좁아짐·sulcus 넓어짐, <b>hydrocephalus ex vacuo<\/b>. 현미경: <b>senile(neuritic) plaque<\/b> = 세포 밖 <b>Aβ<\/b>(APP가 β→γ-secretase로 잘려 불용성), <b>neurofibrillary tangle<\/b> = 세포 안 과인산화 <b>tau<\/b>(somatic-dendritic 재분포), cerebral amyloid angiopathy, cortical neuron 소실, granulovacuolar degeneration, Hirano body. 위험인자 <b>ApoE ε4<\/b>(19번). Aβ가 microglia·astrocyte 염증 유발<\/td><td>노인 치매의 가장 흔한 원인, 기억력 저하. 중증도와 비례: tangle 수·amyloid burden ↑, ChAT·synaptophysin ↓<br>Biomarker: <b>CSF Aβ 감소<\/b>(가장 일찍 진단, 뇌에 침착되기 때문) + p-tau 증가, amyloid PET. Lecanemab: Aβ protofibril 항체, MCI·초기만, 부작용 ARIA(뇌부종·미세출혈) → ApoE4·MRI 확인<\/td><td>2023: plaque·tangle·CAA → <b>Down syndrome<\/b> 40세 여자 · 2021: 중증도와 양의
