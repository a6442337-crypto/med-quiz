상관 아닌 것 = ChAT · CSF Aβ 감소 26Pま · Lecanemab 투여 전 ApoE4·MRI 26Pま<\/td><\/tr>\n<tr><td class=\"loc\">③ 척수 운동신경<small>UMN + LMN<\/small><\/td><td class=\"name\">ALS<\/td><td>UMN(lat. corticospinal tract pallor·경화) + LMN(ant. horn cell 소실·위축) 동시 침범, TDP-43 세포질 응집 → <b>말초신경·근육 표의 ③<\/b> 참고<\/td><td>대칭적 근위축 + 반사항진·경직, 물건 떨어뜨림 → 연하·발음 장애<\/td><td>2021~2025 (말초 표 참고)<\/td><\/tr>\n<tr><td class=\"loc\">④ White matter<small>탈수초 (axon 보존)<\/small><\/td><td class=\"name\">Multiple sclerosis<\/td><td><figure class=\"fr\" style=\"width:34mm\"><img src=\"summary/lim-ms.jpg\" alt=\"MS MRI·육안 (강의)\" loading=\"lazy\"><figcaption>MS plaque (강의)<\/figcaption><\/figure>Oligodendrocyte 문제로 <b>selective myelin loss<\/b>, <b>axon은 보존<\/b>(퇴행성 질환과 감별). 자가면역: plaque 안 CD4+·CD8+ T cell, macrophage → IFN-γ → 탈수초. <b>Periventricular<\/b> 중심 sclerotic plaque, LFB 염색에서 창백.<br><b>감소<\/b>: myelin, oligodendrocyte / <b>증가<\/b>: foamy macrophage(혈관 주변), lymphocyte, <b>astrocyte<\/b>(함정: 늘어남) / <b>유지<\/b>: axon<\/td><td>20~40세, F&gt;M(1:2), 온대·HLA-DR2. 초기 흔한 증상 <b>편측 시력장애(optic neuritis)<\/b>, 감각이상, 운동장애, 방광증상, 안구진탕, 재발·회복 반복. <b>CSF<\/b>: 혈청과 동시 전기영동 시 CSF에만 <b>oligoclonal band<\/b>(γ-globulin↑) + pleocytosis<\/td><td>26Pま · 2025: oligodendrocyte 손실 + macrophage·microglia 활성화(③) · axon 보존 26Pま · CSF oligoclonal band 26Pま<\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><b>퇴행성 vs 탈수초 질환<\/b> — 퇴행성(degenerative)은 특정 neuron이 선택적·점진적으로 죽는 <b>gray matter<\/b> 병변, 기본 소견은 neuron 자리를 glia가 채우는 <b>gliosis<\/b> (BG·brain stem → 운동장애, cortex → 치매). 탈수초(demyelinating)는 <b>white matter<\/b>에서 myelin만 선택적으로 사라지고 <b>axon은 정상<\/b>.<\/div>\n"}]}, {"prof": "김종규", "items": [{"title": "뇌종양 종류별 비교 — 전이성·신경교종·수막종·뇌하수체 샘종·수모세포종 (소견/진단·치료·예후)", "html": "summary/kim-brain-tumor.html", "img": "summary/kim-brain-tumor.jpg", "pdf": "summary/kim-brain-tumor.pdf", "src": "26 학습부 20번 · 뇌종양 (⭐ = 26Pま, 사진은 2018–2025 기출 그림, 작은 글씨는 옛 기출·참고)", "body": "<table class=\"w5 wide\"><colgroup><col style=\"width:9%\"><col style=\"width:14%\"><col style=\"width:35%\"><col style=\"width:24%\"><col style=\"width:18%\"><\/colgroup><thead><tr><th>분류<\/th><th>종양<\/th><th>소견 · 진단<\/th><th>치료<\/th><th>예후<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"loc\">전이성 종양<small>뇌종양 m/c · 다른 종양의 8–9배 · 15, 17, 18, 21, 22ま<\/small><\/td><td class=\"name\">Metastatic tumor<small>원발: <b>폐 m/c<\/b>(50–60%) &gt; 유방 &gt; 흑색종·대장·신장 (22ま 27번)<\/small><\/td><td><figure class=\"fr\" style=\"width:30%\"><img style=\"width:100%\" src=\"summary/exam-tumor-meta-multiple.jpg\" alt=\"2021 기출 61번 · 73/M T1 조영증강, 다발성 병변 → 전이성 뇌종양\" loading=\"lazy\"><figcaption>2021 기출 61번(주관식) · 73/M 두통, T1 조영증강 다발성 → <b>전이성 뇌종양<\/b> (화살표: sinus 조영 = 조영증강 영상)<\/figcaption><\/figure><b>다발성<\/b>, 원형, <b>회백질 경계부<\/b>(corticomedullary junction), <b>현저한 혈관성 부종 + mass effect<\/b>. 중심 괴사 → 테두리만 조영증강.<br>다발성 + 폐암 병력 + 신경증상 → 거의 무조건 meta. <b>단발성<\/b>이면 meningioma 등 다른 종양도 감별. 원발 부위를 못 찾으면 수술로 조직을 얻어 확인<\/td><td><b>원발암 치료가 가장 중요<\/b>(혈액종양내과).<br><b>Corticosteroid<\/b>: 뇌부종↓·증상 완화, <b>생존 연장 X<\/b>(보조요법)<br><b>전뇌방사선(WBRT)<\/b>: 퍼져 있을 때 최상, 가장 많이 씀. 부작용 인지기능 저하<br><b>정위적 방사선수술<\/b>(Gamma knife): 국소 조절률 <b>85–95%<\/b>, 요즘 대세. 숨은 종양은 놓칠 수 있음(23검)<br><b>수술<\/b>: <b>일부 환자에서 중요<\/b> — ICP↑·mass effect·수두증 해결, 조직 진단. mass 수·기대수명 보고 결정(10개 이상이면 X)<br>항암: 소세포폐암·생식세포종·유방암<\/td><td>나쁨 (교과서 빨간색)<br><span class=\"src\">옛 기출 함정: \"corticosteroid는 의미 없다\", \"수술은 권장되지 않는다\"(15ま) → 틀린 설명<\/span><\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"4\">신경교종<small>Glioma · 뇌 자체(glial cell) · 2021 WHO 유전자 분류 23Pま · 18, 22, 23, 25ま<\/small><\/td><td class=\"name\">Astrocytoma, IDH-mutant ⭐<small>grade 2/3/4 · 30대 (역형성 40대)<\/small><\/td><td><b>조영증강 안 되는 경계 불분명<\/b> 병변 → 뇌에서는 비교적 예후 좋은 소견.<br>확진은 현미경이 아닌 <b>IDH 유전자 검사<\/b>, grade 2·3·4는 병리의사가 구분<\/td><td><b>최대 안전 절제<\/b>(navigation, MEP·SSEP, awake craniotomy)<br>방사선: 보조요법<br>항암: <b>WHO 2등급 저위험군<\/b> → 완전 절제 후 경과관찰 또는 RT 후 PCV (조금 남으면 RT 후 PCV, 26검) · <b>고위험군<\/b> → RT 후 <b>PCV<\/b><\/td><td>IDH-mutant → GBM(wild-type)보다 생존율 <b>높음<\/b> (23ま 20번 ⑤ 맞는 설명)<br><span class=\"src\">20 학습부: 젊은 grade 2 약 5년, anaplastic 2–3년<\/span><\/td><\/tr>\n<tr><td class=\"name\">Oligodendroglioma ⭐<small>IDH-mutant + 1p/19q codeletion · grade 2/3 · 26NEW<\/small><\/td><td>CT에서 <b>석회화<\/b>, <b>전두엽<\/b>에 위치하면 의심.<br>확진: <b>IDH mutant + 1p/19q codeletion 둘 다 필수<\/b>(H&amp;E + 유전자). grade 2·3은 병리의사<br><span class=\"src\">25ま 02번 ④ \"1p/19q 동시 결실\" → GBM 사진이라 틀린 설명<\/span><\/td><td>최대 안전 절제(navigation, MEP·SSEP)<br>+ 방사선 + <b>PCV<\/b>(procarbazine·CCNU·vincristine, 주사·독성 강함)<br>경구 temozolomide도 많이 씀<\/td><td>IDH-mutant → 상대적으로 좋음<\/td><\/tr>\n<tr><td class=\"name\">Glioblastoma, IDH-wild type ⭐<small>grade 4 · 원발성 악성 뇌종양 m/c(45–50%) · 50대 · 18, 19, 22, 23, 25ま<\/small><\/td><td><b>IDH wild-type이면 무조건 GBM<\/b>. 불규칙·<b>heterogeneous enhancement<\/b>, <b>central necrosis<\/b>, 심한 부종, 반대편까지 넘어감. 보이는 것보다 넓게 침윤. PET·PWI에서 대사·혈류↑<br><b>특수 MRI<\/b>(19, 22, 23, 25ま): <b>DTI<\/b> = tractogram, 종양과 피질척수로 관계 · <b>PWI<\/b> = 관류(종양에서↑) · <b>MRS<\/b> = 대사 정보, 악성에서 <b>NAA/choline↓<\/b> · language area는 fMRI<br><span class=\"src\">19ま 08번 \"MRS로 혈류 검사\" → 틀림<\/span><br><figure style=\"display:inline-block;vertical-align:top;width:32%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-tumor-gbm-2025.jpg\" alt=\"2025 기출 02번 · 2023 기출 20번 같은 사진 · GBM T1 조영증강\" loading=\"lazy\"><figcaption>2025 기출 02번 · 2023 기출 20번(같은 사진) · 우측 위약감, T1 조영증강<\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:52%;margin:6px 0 0 0\"><img style=\"width:100%\" src=\"summary/exam-tumor-gbm-2018.jpg\" alt=\"2018 기출 22번 · 우측 편마비 GBM MRI\" loading=\"lazy\"><figcaption>2018 기출 22번 · 우측 편마비 → <b>교모세포종<\/b><\/figcaption><\/figure><\/td><td>최대 안전 절제 → <b>RT + temozolomide 동시<\/b>(CCRT) → temozolomide 보조 6개월<br><b>Temozolomide<\/b>(테모달) = 뇌에서 <b>유일하게 인정된 항암제<\/b> (25ま 주관식 03번)<br><b>PCV는 GBM 항암제 아님<\/b> (23ま 20번 답 ⑤→④)<br>고령·위험 부위 → 조직검사 + RT·chemo만, 젊으면 maximal resection<\/td><td><b>매우 나쁨<\/b>, 기대여명 약 1년<br>중앙생존: RT 단독 <b>12.1개월<\/b> → RT+TMZ <b>14.6개월<\/b>, 2년 생존율 10.4 → <b>26.5%<\/b> (22ま)<br>예후인자: 절제 범위, 나이(50), 환자 상태, <b>MGMT promoter 메틸화<\/b><br><span class=\"src\">22ま 28번 \"병합하면 5년 생존율 비교적 높다\" → 틀림<\/span><\/td><\/tr>\n<tr><td class=\"name\">Pilocytic astrocytoma<small>grade 1 · benign · 소아 소뇌 · 21ま<\/small><\/td><td>소아, 구토·papilledema·보행 이상. 소뇌 <b>cystic<\/b> 종양이 brainstem 압박. 병리 진단이 가장 중요<br><span class=\"src\">21ま 30번 \"가장 양성\" → pilocytic. Grade 1: pilocytic, subependymal giant cell astrocytoma (옛 기출)<\/span><\/td><td>수술로 cystic 종양 쉽게 제거<\/td><td><b>매우 좋음<\/b>, 완치 개념 (수술 5년 뒤 mass 소실)<\/td><\/tr>\n<tr><td class=\"loc\">수막종<small>CNS m/c 양성 · 37.9% · 14, 17, 18, 20, 23ま · 25Pま<\/small><\/td><td class=\"name\">Meningioma<small>여자 2:1, 40–50대 · 지주막 세포 기원 · parasagittal, falx, convexity, sphenoid ridge · 22번 염색체 장완 소실 (옛 기출)<\/small><\/td><td>CT: 대부분 고음영, <b>균일 조영증강<\/b>, 주위 부종, <b>석회화 · 인접 두개골 과골화<\/b><br>MRI: T1 저~동일, T2 동일~고신호, 균일 조영증강 + <b>경막꼬리(dural tail sign)<\/b>(20Pま). 뇌 밖에서 뇌를 누름(넓은 기저)<br>혈관조영: <b>햇살 모양(sunburst)<\/b> → 술전 색전술(26검)<br><b>2021 WHO<\/b>(26NEW ⭐): G1 아형들 · <b>G2<\/b> mitosis 4–19/10 HPF, brain invasion, clear cell · <b>G3<\/b> mitosis ≥20, sarcoma·carcinoma·melanoma-like, <b>TERT promoter 변이 또는 CDKN2A/B 결실<\/b><br><figure style=\"display:inline-block;vertical-align:top;width:58%;margin:6px 1% 0 0\"><img style=\"width:100%\" src=\"summary/exam-tumor-meningioma-2020.jpg\" alt=\"2020 기출 주관식 15번 · 기억력 장애 수막종 MRI\" loading=\"lazy\"><figcaption>2020 기출 주15 · 기억력 장애(78/F), 균일 조영 + dural tail → <b>수막종<\/b><\/figcaption><\/figure><figure style=\"display:inline-block;vertical-align:top;width:39%;margin:6px 0 0 0\"><img style=\"width:100%\" src=\"summary/exam-tumor-meningioma-2018.jpg\" alt=\"2018 기출 11번 · 할머니 두통 수막종 MRI\" loading=\"lazy\"><figcaption>2018 기출 11번(주관식) · 할머니 두통 → <b>수막종<\/b><\/figcaption><\/figure><\/td><td><b>수술이 표준<\/b> — 증상 개선·완치 가능<br>작고 무증상·고령·동반질환 → <b>관찰(wait and see)<\/b> (19Pま)<br>방사선: 고식적, 감마나이프<br>화학·호르몬 요법은 효과 불확실 (옛 기출)<br>C-P angle(38/F): 삼차신경 통증 → 수술·감마나이프·관찰 모두 가능<\/td><td>양성, 좋음 (재발은 가능)<br><b>Simpson grade 재발률<\/b>(23ま 19번 → grade 2):<br>1 완전 + 경막·두개골 제거 <b>9%<\/b><br>2 완전 + 경막 전기소작 <b>19%<\/b><br>3 경막내 종양만 <b>29%<\/b><br>4 아전 제거 <b>39%<\/b><br>5 단순 감압 <b>100%<\/b><br><span class=\"src\">악성 수막종은 완전 적출해도 재발률 높음<\/span><\/td><\/tr>\n<tr><td class=\"loc\">뇌하수체 샘종<small>19.3% · 14, 15, 19, 21, 22, 23, 25ま<\/small><\/td><td class=\"name\">Pituitary adenoma<small>기능성: <b>PRL m/c 30%<\/b>(21ま) &gt; GH 20% &gt; ACTH 4–5% &gt; TSH · 비기능성도 많음 · 미세 ≤1 cm, 대 1–4 cm, 거대 ≥4 cm<\/small><\/td><td><figure class=\"fr\" style=\"width:26%\"><img style=\"width:100%\" src=\"summary/exam-tumor-pituitary-prl.jpg\" alt=\"2025 기출 01번 · 2022 기출 21번 같은 사진 · 시야검사와 MRI\" loading=\"lazy\"><figcaption>2025 기출 01번 · PRL ≥400 → <b>약물치료<\/b> (정답률 25%)<br>2022 기출 21번 같은 사진 · PRL 40 → <b>경접형동종양제거술<\/b><\/figcaption><\/figure>호르몬 과다 증상 + optic chiasm 압박 → <b>양측두반맹(bitemporal hemianopsia)<\/b>, 뇌하수체 기능저하<br>PRL <b>150–200 ng/mL 이상<\/b>이면 PRL 샘종 가능성 높음 · GH 5 ng/mL, OGTT · ACTH 코티졸, dexamethasone 억제<br><span class=\"src\">옛 기출: MRI가 미세샘종 진단에 가장 민감, dynamic MRI로 2–3 mm까지, 조영 시 정상 뇌하수체가 더 빨리 증강<\/span><\/td><td><b>PRL 샘종 → bromocriptine 1차<\/b> (약물 우선인 유일한 경우, 25ま ⭐)<br><b>GH 샘종 → 수술 후 octreotide 보조<\/b><br>그 밖에는 수술: <b>TSA(경접형동 접근법)<\/b>가 m/c (22ま 주관식 60번), 합병증 적음, 내시경. Transcranial은 어쩔 수 없을 때만. 옆 cavernous sinus의 ICA 손상 주의<br>방사선(드묾): 불완전 제거·재발 시, 시신경 손상·시상하부 기능저하 위험<\/td><td>양성, <b>수술하면 좋아짐<\/b> — 시야장애 회복, 재발 적음, 만족도 높음<\/td><\/tr>\n<tr><td class=\"loc\">소아 후두와<small>16, 18ま<\/small><\/td><td class=\"name\">Medulloblastoma<small>수모세포종 · 소아 뇌종양 18% · 3–8세 · 남:여 = 2:1<\/small><\/td><td><figure class=\"fr\" style=\"width:30%\"><img style=\"width:100%\" src=\"summary/exam-tumor-medullo.jpg\" alt=\"2018 기출 12번 · 9세 남아 어지럼·구토 MRI\" loading=\"lazy\"><figcaption>2018 기출 12번(주관식) · 9/M 어지럼·구토 → <b>수모세포종<\/b> (2016 기출 같은 증례)<\/figcaption><\/figure>소뇌충부에서 생겨 <b>4뇌실을 채움<\/b> → <b>수두증에 의한 ICP↑<\/b>(두통·구토)가 첫 증상. Brainstem glioma(CN VI 내사시가 먼저, ICP는 늦음)와 감별<br>CT: 고밀도, <b>비교적 균질하고 강한 조영증강<\/b>, 수두증 95%, 석회화 20%(흔하지 않음). CSF seeding 잘 일으킴<\/td><td>최대 절제 + <b>방사선<\/b>(전뇌척수 36 Gy + 후두와 54 Gy, 6주) + 항암<br>수술 후 후두와 증후군(72시간 내, 수주 내 호전)<\/td><td><b>Radiosensitive → cure 가능<\/b> (6년 뒤 깨끗)<\/td><\/tr>\n<tr><td class=\"loc\" rowspan=\"3\">기타<small>올해 강의는 빈도만 · 옛 기출<\/small><\/td><td class=\"name\">Vestibular schwannoma<small>두개신경 종양 10.3% · CN 5·7·8의 Schwann cell<\/small><\/td><td>이명·청력 소실 → 보행장애·안면 감각이상. 내이도에서 시작, CT 내이도 확장·미란. S-100·Leu-7 양성. 젊은 양측성 → NF2<\/td><td>방사선수술 효과 좋음 (옛 기출)<\/td><td>비교적 좋음 (교과서 파란색)<\/td><\/tr>\n<tr><td class=\"name\">Lymphoma · Germinoma<small>1.9% · 1.1%<\/small><\/td><td>Germinoma·medulloblastoma는 CSF seeding 잘 일으킴<\/td><td>Chemo·RT 반응 좋음. <b>림프종은 RT만으로 완전 소실<\/b> 가능. 방사선 효과 좋은 뇌종양: 배아종·수모세포종·악성림프종·상의세포종<\/td><td>나쁨 (교과서 빨간색)<\/td><\/tr>\n<tr><td class=\"name\">Craniopharyngioma<small>두개인두종 · 옛 기출<\/small><\/td><td>소아·성인 두 정점. 소아는 성장장애·ICP↑, 성인은 시야장애. <b>CT 석회화 흔함<\/b> → 뇌하수체 샘종과 감별<\/td><td>전적출<\/td><td>전적출 후에도 약 18% 재발<\/td><\/tr>\n<\/tbody><\/table><div class=\"note\"><b>빈도 순서<\/b><ul><li>26 교과서 개정판: <b>meta<\/b> &gt; meningioma 37.9% &gt; pituitary adenoma 19.3% &gt; glioma 13.6% &gt; 두개신경 종양 10.3% &gt; 림프종 1.9%·배아세포종 1.1%<\/li><li>기존 기출 정답(15, 17, 18, 20ま): metastases &gt; <b>gliomas<\/b> &gt; meningiomas &gt; pituitary adenomas &gt; others &gt; <b>schwannomas<\/b> → 가장 흔함 = meta, 두 번째 = glioma(18ま), 가장 적음 = schwannoma(15ま). 올해 교과서 순서와 다르니 보기를 잘 볼 것<\/li><li>예후 좋은 편(파란색): 수막종·뇌하수체 샘종·두개신경 종양 / 나쁜 편(빨간색): 전이성·신경교종·림프종·배아세포종<\/li><\/ul>⭐ = 26Pま, 연도+ま = 그해 기출. 회색 글씨(<span class=\"src\">작은 글씨<\/span>)는 옛 기출·참고<\/div>\n"}]}]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,S=D.summary||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 교수님 순서는 퀴즈의 파트 순서를 따른다 */
const byP=Object.fromEntries((S.profs||[]).map(p=>[p.prof,p]));
const profs=[...new Set(M.ch.map(c=>c.prof))].filter(p=>byP[p]&&(byP[p].items||[]).length);
/* 표(body: 저장소 안 HTML 조각)가 있으면 글자 그대로 보여 주고, 없으면 사진. PDF·이미지는 받기 링크로 */
const fig=x=>{const dl=[x.pdf&&`<a href="${esc(x.pdf)}" download>PDF 받기</a>`,x.img&&x.body&&`<a href="${esc(x.img)}" download>이미지 받기</a>`].filter(Boolean).join('');
 const main=x.body?`<div class="sheet"><div class="inner">${x.body}</div></div><div class="fithint">표 전체를 화면에 맞춰 줄였습니다 · <b>눌러서 크게 보기</b>(두 손가락으로 확대)</div>`:`<a href="${esc(x.img)}" target="_blank" rel="noopener"><img src="${esc(x.img)}" alt="${esc(x.title)}" loading="lazy"></a>`;
 return `<figure><h3>${esc(x.title)}</h3>${dl?`<div class="dl">${dl}</div>`:''}${main}${x.src?`<figcaption>${esc(x.src)}</figcaption>`:''}</figure>`};
const lec=p=>M.ch.filter(c=>c.prof===p).map(c=>c.title).join(' · ');
document.getElementById('app').innerHTML=`<div class="panel sm"><h2>교수님별 요약자료</h2><div class="src">${esc(S.note||'')}${S.updated?` (${esc(S.updated)} 정리)`:''}</div>
${profs.length?profs.map(p=>{const it=byP[p].items;return `<details><summary>${esc(p)} 교수님 <small>${esc(lec(p))} · 정리표 ${it.length}개</small></summary>
${it.map(fig).join('')}</details>`}).join(''):'<div class="empty">아직 올라온 요약자료가 없습니다.</div>'}</div>`;
/* ── 표 맞춤: 화면이 표의 원래 너비(표 min-width, 기본 900px)보다 좁으면 그 너비로 그린 뒤 비율대로 줄인다 ── */
const designW=t=>{const m=parseFloat(getComputedStyle(t).minWidth);return m>0?m:900};
function fitAll(){document.querySelectorAll('#app .sheet').forEach(sh=>{
 const inner=sh.firstElementChild,t=inner.querySelector('table');if(!t)return;
 inner.style.width='';inner.style.transform='';sh.style.height='';
 const W=designW(t),cw=sh.clientWidth;
 if(!cw||cw>=W){sh.classList.remove('fit');return}
 const k=cw/W;inner.style.width=W+'px';inner.style.transform=`scale(${k})`;
 sh.style.height=Math.ceil(inner.offsetHeight*k)+'px';sh.classList.add('fit');sh.dataset.k=k});}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitAll,120)});
document.querySelectorAll('#app details').forEach(d=>d.addEventListener('toggle',fitAll));
document.querySelectorAll('#app .sheet img').forEach(i=>{if(!i.complete)i.addEventListener('load',fitAll,{once:true})});
fitAll();

/* ── 크게 보기 ── */
const zv=document.getElementById('zv'),vp=zv.querySelector('.vp'),pg=zv.querySelector('.pg');
let z=1,zFit=1,W0=900,H0=0;
function setZ(nz,cx,cy){ // (cx,cy): 화면 안에서 고정할 점
 nz=Math.max(zFit*0.6,Math.min(4,nz));
 const r=vp.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;
 const px=(vp.scrollLeft+cx)/z,py=(vp.scrollTop+cy)/z;
 z=nz;pg.style.transform=`scale(${z})`;pg.style.width=W0+'px';
 pg.style.marginBottom=(H0*z-H0)+'px';pg.style.marginRight=(W0*z-W0)+'px';
 vp.scrollLeft=px*z-cx;vp.scrollTop=py*z-cy;}
function openZ(sh,title){
 pg.innerHTML=`<div class="sheet">${sh.firstElementChild.innerHTML}</div>`;zv.querySelector('.t').textContent=title;
 zv.classList.add('on');document.body.classList.add('zv-open');
 W0=designW(pg.querySelector('table'));pg.style.transform='';pg.style.width=W0+'px';pg.style.margin='0';H0=pg.offsetHeight;
 zFit=Math.min(1,vp.clientWidth/W0);z=1;setZ(zFit,0,0);vp.scrollLeft=0;vp.scrollTop=0;
 pg.querySelectorAll('img').forEach(i=>{i.style.cursor='zoom-in';i.addEventListener('click',e=>{e.stopPropagation();window.open(i.src,'_blank','noopener')})});
 history.pushState({zv:1},'');}
function closeZ(back){if(!zv.classList.contains('on'))return;zv.classList.remove('on');document.body.classList.remove('zv-open');pg.innerHTML='';if(back!==false&&history.state&&history.state.zv)history.back()}
addEventListener('popstate',()=>closeZ(false));
addEventListener('keydown',e=>{if(e.key==='Escape')closeZ()});
zv.querySelector('.bar').addEventListener('click',e=>{const a=e.target.dataset.z;if(!a)return;
 if(a==='close')closeZ();else if(a==='in')setZ(z*1.4);else if(a==='out')setZ(z/1.4);else if(a==='fit'){setZ(zFit,0,0);vp.scrollLeft=0}});
/* 두 손가락 확대(직접 처리 — 페이지 전체가 커지지 않게) */
let p0=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
vp.addEventListener('touchstart',e=>{if(e.touches.length===2){const r=vp.getBoundingClientRect();p0={d:dist(e.touches),z,cx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}},{passive:true});
vp.addEventListener('touchmove',e=>{if(p0&&e.touches.length===2){e.preventDefault();setZ(p0.z*dist(e.touches)/p0.d,p0.cx,p0.cy)}},{passive:false});
vp.addEventListener('touchend',e=>{if(e.touches.length<2)p0=null});
/* 트랙패드 확대(ctrl+휠) */
vp.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();const r=vp.getBoundingClientRect();setZ(z*Math.exp(-e.deltaY/200),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
/* 두 번 탭: 맞춤 ↔ 2배 */
let lastTap=0;vp.addEventListener('touchend',e=>{if(e.changedTouches.length!==1||e.touches.length)return;const n=Date.now();
 if(n-lastTap<300){const r=vp.getBoundingClientRect(),t=e.changedTouches[0];setZ(z>zFit*1.3?zFit:Math.max(1,zFit*2),t.clientX-r.left,t.clientY-r.top);lastTap=0}else lastTap=n});
/* 맞춤 상태의 표를 누르면 크게 보기 */
document.getElementById('app').addEventListener('click',e=>{const sh=e.target.closest('.sheet');if(!sh)return;
 const img=e.target.closest('img');
 if(sh.classList.contains('fit')){e.preventDefault();openZ(sh,sh.closest('figure')?.querySelector('h3')?.textContent||'정리표');return}
 if(img)window.open(img.src,'_blank','noopener');});
document.querySelectorAll('#app .sheet:not(.fit) img').forEach(i=>{i.style.cursor='zoom-in';i.title='눌러서 크게 보기'});
</script>
</body></html>
