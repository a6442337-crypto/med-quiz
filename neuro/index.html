계는 외배엽에서 분화합니다. 피부외배엽과의 분리가 실패하면 선천성 피부동이 발생할 수 있다고 강조하셨습니다. ③ 척추 정중선 유합부전증이 머리쪽에서 발생하면 뇌류가 발생합니다. ④ 중앙부 병소보다 측부의 병소에서 예후가 양호합니다. ⑤ 이차 신경배형성으로 발생하는 총사 비후 (thick filum terminale)와 같은 기형은 일차 신경배형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고, 예후도 훨씬 불량하다. → 초기에 병변이 생기는 것이 예후가 불량하기 때문에 일차 신경배 형성 기형이 더 예후가 나쁩니다.", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "25-58", "keys": ["25-58"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>감각기관에 대한 설명 중 옳은 것은?<\/div>", "o": ["망막에서 빛을 감지하는 세포는 간상세포와 원추세포가 있는데 빛의 명암을 주 로 감지하는 세포는 원추세포이다.", "달팽이관에서 고주파의 소리를 감지하는 부분은 이소골 중 등자뼈 (stapedius)가 붙어 있는 시작부 쪽이다.", "후각은 여러 감각기관 중 상대적으로 퇴화된 부분으로 감정 기억 언어 등 인지 기 능에 미치는 영향은 별로 없는 편이다.", "촉각은 고유감각과 통감으로 나누어져 서로 다른 경로로 대뇌피질에 전달된다.", "미각은 단 맛, 짠맛, 쓴맛, 매운 맛, 감칠맛, 신맛으로 나뉘고 각각의 맛에 따라 고 유한 분자가 따로 존재한다."], "a": 3, "A": "④", "E": "정답률 58퍼입니다. 2번을 많이 찍었다고 합니다. ① 빛의 명암을 주로 감지하는 세포는 간상세포입니다. 원추세포는 색을 구별하는 세포입니다. ② 이쪽 공부를 덜 하고 시험을 봐서 그런가 현장에서는 이상함을 잘 못 느꼈는데 해설을 쓰다보니 왜 틀렸는지 잘 모르겠네요.. 달팽이관의 기저부에서 고주파를, 첨부에서 저주파를 감지하는 것은 맞습니다. 최대한 오류를 지적해보자면 교수님의 특성 상, “소리를 감지하는 것은 진동하는 부위가 아니라 유모세포다!”라고 할 수도 있겠습니다. ③ 후각은 중요한 것 외에 나머지 receptor는 시각에 배분되어 시각에 비해 상대적으로 약한 모습이지만, 반대로 시각이 망가지면 다시 후각으로 재배분된다고 합니다. 따라서 퇴화라고 봐야할지 의문이고, 확실하게 틀린 부분은 후각이 감정과 기억에 중요하다는 점입니다. 관련 이론을 보니 매년 교수님의 설명이 조금씩 달라지는 것 같은데 초안자, 검안자의 첨언을 참고해주세요. gemini의 설명에 의하면 후각 정보는 다른 감각들과 달리 시상을 거치지 않고 바로 후각피질로 전달되고 후각피질은 기억과 감정과 관련된 해마, 편도체와 밀접한 연관이 있다고 합니다. ④ 촉각에는 진동, 고유감각, 통증, 온도 등이 있는데 fine touch, vibration, two-point discrimination, proprioception은 Dorsal column-medial lemniscus (DCML)를 통하고 pain, temperature은 spinothalamic tract를 통해 최종적으로 대뇌피질에 전달됩니다. (4) Seonsory pathway: Vision", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-61", "keys": ["25-61"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 조건화 기억에 관여한다고 알려진 뇌 부분은?<\/div>", "o": ["기저핵", "해마", "대뇌 신피질", "소뇌", "편도체"], "a": 3, "A": "④", "E": "기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-70", "keys": ["25-70"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 나이가 들어도 기능이 떨어지지 않는 인지영역은 무엇인가?<\/div>", "o": ["Speed of processing", "Working memory", "동의어 어휘 능력", "장기기억", "자유연상 기억"], "a": 2, "A": "③", "E": "정답률 51퍼입니다. 기억은 고정되어 있는 crystallized intelligence와 변동 가능한 fluid intelligence로 나눌 수 있는데 world knowledge는 나이가 들어도 떨어지지 않는 대표적인 지식입니다. 이에 해당하는 것에 ‘어휘력, 일반 상식, 전문 지식’ 등이 있습니다. (4번 – Long term memory, 5번 – Free recall) 4) 노화에 따른 인지의 변화", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-71", "keys": ["25-71"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 노쇠의 증상에 해당되지 않는 것은?<\/div>", "o": ["난청", "인지 저하", "근육 쇠퇴", "체중 감소", "모두 해당된다"], "a": 4, "A": "⑤", "E": "찾아보니 강의안에 나온 5가지 기준은 미국의 노년학자가 개발한 신체 노쇠를 평가하는 ‘Fried 기준’이고, 1, 2번 선지의 경우에는 밑줄 쳐진 노쇠의 정의 : increased vulnerability resulting from aging-associated decline in reserve and function에 해당한다고 간주하여 정답인 것 같습니다. 3) 노쇠", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-72", "keys": ["25-72"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 급격히 진행하는 치매질환에 해당되는 것은?<\/div>", "o": ["알츠하이머", "파킨슨 병", "헌팅턴병", "만성 자가면역 뇌염", "CADASIL (Cerebral Autosomal Dominant Arteriopathy with Subcortical Infarcts and Leukoencephalopathy)"], "a": 3, "A": "④", "E": "① 알츠하이머병 (Alzheimer's disease): 수년에 걸쳐 매우 서서히 발병하여 점진적으로 진행되는 것이 특징입니다. (평균적으로 진단 후 수년에서 10여 년 이상 진행됨) ② 파킨슨병 (Parkinson's disease): 운동 증상이 주가 되며, 치매가 발생하더라도 대개는 병의 경과가 비교적 느립니다. ③ 헌팅턴병 (Huntington's disease): 유전성 신경퇴행성 질환으로, 무도증, 인지 기능 저하 등이 특징이며, 진행은 알츠하이머병과 마찬가지로 수년에 걸쳐 점진적입니다. ④ 만성 자가면역 뇌염 (Chronic Autoimmune Encephalitis): 자가면역 뇌염은 면역 세포가 뇌를 공격하여 발생하며, 급성 또는 아급성(수주~수개월)으로 심각한 기억 상실, 인지 저하, 경련 등의 증상을 일으킬 수 있는 가역적(치료 가능한) 원인 중 하나입니다. 치료하지 않으면 심각한 후유증을 유발하거나 사망에 이를 수 있어 RPD의 중요한 원인으로 간주됩니다. ⑤ CADASIL: 유전성 혈관성 치매로, 만성적인 뇌졸중과 백질변성(Leukoencephalopathy)을 일으키며, 치매는 보통 점진적으로 진행됩니다. (3) 진행속도에 따른 치매의 분류", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-73", "keys": ["25-73"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음의 알츠하이머병의 진단에 사용되는 혈액검사항목 중 병의 시작과 진행과정을 모니터링하는데 도음이 될 것으로 생각되는 검사항목은 무엇인가?<\/div>", "o": ["혈중 베타 아밀로이드 단백", "혈중 인산화 타우 단백", "혈중 신경필라멘트 (Neurofilament light chain, NfL)", "혈중 교세포섬유질 산성 단백질 (glial fibrillary acidic protein, GFAP)", "혈중 수초염기성 단백 (myelin basic protein, MBP)"], "a": 1, "A": "②", "E": "아밀로이드의 경우에는 뇌에 일정량의 플라크가 쌓이고 나면 혈액이나 CSF로 배출되는 아밀로이드 단백이 감소한 채로 plateau를 이룬다고 합니다. 따라서 병의 시작을 확인하기에는 좋으나 진행과정을 모니터링하거나 치료효과를 확인하는 데에는 pTau나 NfL에 비해 민감도가 떨어진다고 합니다. pTau는 아밀로이드 다음으로 변화가 시작되어 이후 시점까지 지속적으로 증가하기 때문에 정답은 2번입니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "23-25", "keys": ["23-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 알츠하이머 치매에 대한 위험요소에 해당하는 것을 고르시오.<\/div>", "o": ["고령", "여성", "심혈관 위험요소(고혈압, 고지혈, 당뇨, 흡연, 음주 등)", "우울증", "이상 모두"], "a": 4, "A": "⑤", "E": "언급하지 않으신 부분에서 출제되었습니다. 기출도 없고 21피마만 있었는데 출제되었네요... 치매의 위험요소는 모두 해당하는 문제였습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-26", "keys": ["23-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>파킨슨 관련 치매에 대한 설명으로 맞는 것은?<\/div>", "o": ["파킨슨관련 단백질은 alpha synuclein, 알츠하이머는 amyloid, tau로 서로 다른 병태생리를 보여 한 환자에서 같이 나타날 수 없다.", "세포 내의 특이 단백질이 뭉쳐서 나타난 것을 루이(소)체 라고 하는 데 뇌 전체에 걸쳐서 나타나는 것을 파킨슨 치매라고 하고 중뇌의 흑색질에만 나타나는 것을 파킨슨병이라고 한다.", "파킨슨병과 루이체 치매는 병태생리가 서로 다르다", "루이체 치매는 파킨슨 증상과 더불어 선명한 환시, 반복되는 낙상, 정신병적 모습, 수면장애 등 복합적인 증상을 보이고 심한 치매로 진행하는 속도가 알츠하이머 치매보다 빠른 편이다.", "루이체 치매는 인지장애에 더불어 파킨슨 증상을 동반하지 않으면 진단할 수 없다."], "a": 3, "A": "④", "E": "파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-44", "keys": ["23-44"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>기억과 관련된 뇌 구조는?<\/div>", "o": ["헤슬 회 Heschl gyrus", "각 회 angular gyrus", "쐐기앞엽 precuneus gyrus", "내후각피질 Entorhinal cortex", "대상 회 cingulate gyrus"], "a": 3, "A": "④", "E": "① Heschl‘s gyurs : Transverse temporal gyri라고 하며, primary auditory cortex를 포함한다. (17, 37 41) ② Angular gyrus : visual to auditory conversation (42쪽) ③ Precuneus gyrus : broaddmann area 17에 해당하며, 일차 시각 피질입니다. ④ Entorhinal cortex : Memory, associative component와 관련 (45쪽 ⑤ Cingulate gyrus : limbic system에 중요. Emotion에 관련 (45", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "22-21", "keys": ["22-21"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>24세의 여자가 반복적으로 의식을 잃는 모습을 보인다고 하여 내원하였다. 이상 증상은 약 2년 전부터 나왔는데 눈동자가 멍해지고 불러도 반응이 없는 모습이 보이며 입맛을 쩝쩝 다시고 손은 무엇을 만지는 듯한 모습을 보였다고 한다. 약 2~3분 정도 증상이 있다가 주변에 대한 반응을 보이고 이전과 같아지는데 그동안에 있었던 일을 기억하지 못한다고 한다. 과거력에서 어렸을 때 열이 나면서 경기가 몇 번 있었다고 하며 학교생활이나 운동능력도 정상적이었다. 신체검사나 신경학적 검사에서 이상은 없었고 혈액검사도 정상이며 뇌 MRI 사진과 뇌파검사는 다음과 같다. 이 환자에 대한 적절한 것을 고르면? (선명하게 캡쳐되지 않아 사진이 흐리나, 문제를 푸는데 지장은 없을듯 합니다.)<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["뇌파의 화살표는 발작파로 좌측 내측 측두부에서 최대전위를 보인다.", "좌측 해마 경화증으로 인해 기억력에 문제가 생긴다.", "주된 발작은 부분복합발작으로 약물치료 후 예후가 좋다.", "여성이 더 많이 호발한다.", "어릴때 발생한 열경기가 성장해서 뇌전증으로 발전했다."], "a": 0, "A": "①", "E": "반복적으로 의식을 잃고, 멍해지고 불러도 반응이 없고, 입맛을 다시고 손은 무엇을 만지는 듯한 모습(=자동증)을 보이고, 그동안에 있었던 일을 기억하지 못하는 증상을 보입니다. 이것은 복합 부분발작의 증상이며 주로 측두엽에 문제가 있다는 특징이 있습니다. 뇌 MRI 소견) Lt. hippocampus에서 Sclerotic change 뇌파검사 소견) Lt. temporal area에서 뾰족한 발작파가 관찰 - EEG를 읽을 때 hint : 홀수-왼쪽 , 짝수-오른쪽 / F : Frontal, C : Central, P : Parietal, O : Occipital 1번 선지 – 맞는 설명 2번 선지 – 교수님) 좌측 해마 경화증이 있는 것은 맞지만, 발작 동안의 일을 기억하지 못하는 것은 기억력과는 직접적인 연관이 없다. 추가적으로 덧붙여 보자면 학교생활이 정상적이고, 신경학적 검사가 정상적이었기 때문에 기억력은 정상이라고 볼 수 있습니다. (신경학적 검사에 기억력 검사항목이 존재) 3번 선지 – 교수님) 발작을 일으키는 병변이 뇌에 있기 때문에 약 복용 시에는 발작 빈도를 낮출 수 있지만 약을 복용하지 않으면 다시 재발하기 때문에 예후가 좋다고 할 수 없다. 약물치료를 일정기간 한다고 해서 완치가 되는 것이 아니다. 추가적으로 제가 검색해본 바로는 ‘측두엽 간질은 측두엽 부위의 결함이나 상처가 있으면 약물 조절을 어렵게 만들며 이 경우 수술 치료의 대상이 된다’고 합니다. 4번 선지 – 성별이나 인종은 영향이 없습니다. 5번 선지 – 복합열성경련의 경우 뇌전증 확률이 증가하는 것은 맞지만, 복합 열성경련을 하는 아이들은 뇌기능 발달에 문제가 있거나 신경 발달 이상이 있는 경우가 많습니다. 즉, 열성 경련 자체가 뇌전증으로 발전하는 것이 아니라 원래 뇌에 병변이 있어서 뇌전증으로 발전", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "22-23", "keys": ["22-23"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>syncope과 seizure의 가장 확실한 감별점은 무엇인가?<\/div>", "o": ["낙상(falling)", "의식소실", "기억상실", "사지경련", "가장 확실한 감별점은 없다"], "a": 4, "A": "⑤", "E": "1번은 둘다 spell시 나타날 수 있습니다. 두 질환의 특징적인 소견은 아니라서 표에 없습니다. 2번은 각각 <20sec, >60sec을 보입니다. 3번은 automatism을 고려한다면 둘다 기억상실이 동반될 수 있습니다. 4번은 sepll시 나타나는 movement안에 사지경련이 포함될 수 있습니다. 명확히 O, X로 나뉘는 소견이 없어 답이 5번 같습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "22-25", "keys": ["22-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>감정, 정서, 기억 등과 관련된 Papez 회로를 변연계에 포함되지 않는 것은? (문제가 좀 이상한데 원래 이랬습니다..)<\/div>", "o": ["해마", "유두체", "기저핵", "시상", "대상회"], "a": 2, "A": "③", "E": "바로 아래 기출과 같은 문제입니다. Papez circuit은 해마-유두체(시상하부)-전방 시상핵-대상회(=띠이랑)-내후각피질&해마주위고랑 순으로 진행합니다. 회로의 구조물을 모두 정리하시고 한글 term도 알고 있어야 합니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "③"}, {"id": "21-26", "keys": ["21-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>75세의 남자가 약 1년 전부터 발생한 기억력 저하를 주소로 내원하였다. 8년 전부터 왼손에 가만히 있을 때 떨림이 있었고 경부와 몸통의 경직이 있으며 걸음걸이가 느려지는 모습을 보이며 파킨슨병 진단하에 약물치료를 시작하였고 운동증상이 호전되어 문제없이 생활하였다. 4년 전부터 말을 시작할 때 첫 마디를 꺼내기 힘들었고 단어가 잘 떠오르지 않아 ‘이거저거’하는 말을 자주 사용하게 되었다. 3년 전부터는 기억이 예전만 못하다는 것을 느꼈고 2년 전에 공원에 갔다가 길을 잃고 헤맨 적도 있었다. 1년 전부터 기억력 저하가 뚜렷해져서 자주 물어보고 한 말을 또 하고 뜬금없는 말을 할 때도 있었다. 말귀를 못 알아듣거나 대화가 끊기는 경우도 생기고 성격도 변해서 우울하고 말수도 줄어들었다. 돈 관리나 복잡한 일은 하지 못하고 과거에 하던 낚시나 사진 같은 취미생활은 더 이상 할 수 없게 되었다. 이 환자의 치매 관련 검사 결과로 적절한 것은?<\/div>", "o": ["인지검사에서 기억력 장애 위주의 인지 이상이 관찰되고 실행 능력은 오랫동안 유지되는 편이다.", "FDG PET 검사에서 포도당 대사 감소는 측두엽보다는 주로 두정엽 위주로 나타나는 편이다.", "뇌 MRI에서 전형적인 해마 위축소견이 나온다.", "아밀로이드 PET 또는 뇌척수액 단백질 검사에서 아밀로이드 단백질 이상은 동반되지 않는다.", "APOE 유전자 이상이 흔히 동반된다."], "a": 3, "A": "④", "E": "2023년 26번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "④"}, {"id": "21-27", "keys": ["21-27"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>손상되었을 때 기억 장애를 동반할 수 있는 뇌 영역에 해당하는 것은? 가) 해마     나) 편도     다) 시상     라) 미상핵 (caudate nucleus)<\/div>", "o": ["가, 다", "나, 라", "가, 나, 다", "나, 다, 라", "가, 나, 다, 라"], "a": 4, "A": "⑤", "E": "2025년 61번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "⑤"}, {"id": "20-16", "keys": ["20-16"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>Lewybody 치매 진단하는 주요항목 아닌 것?<\/div>", "o": ["낙상", "환시", "인지기능장애 있으나 기억력장애 없음", "렘수면 행동장애", "파킨슨 징후"], "a": 0, "A": "①", "E": "2023년 26번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "①"}, {"id": "20-26", "keys": ["20-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>75세의 남자가 약 1년 전부터 발생한 기억력 저하를 주소로 내원하였다. 8년 전부터 왼손에 가만히 있을 때 떨림 증상이 있었고 경부와 몸통의 경직이 있으며 걸을걸이가 느려지는 모습을 보이며 파킨슨병 진단하에 약물치료를 시작하였고 운동증상이 호전되어 문제없이 생활하였다. 4년 전부터 말을 시작할 때 첫 마디를 꺼내기 힘들었고 단어가 잘 떠오르지 않아 ‘이거, 저거’하는 말을 자주 사용하게 되었다. 3년 전부터는 기억이 예전만 못하다는 것을 느꼈고 2년 전에 공원에 갔다가 길을 잃고 헤맨 적도 있었다. 1년 전부터 기억력 저하가 뚜렷해져서 자주 물어보고 한 말을 또 하고뜬금없는 말을 할 때도 있었다. 말귀를 잘 못 알아듣거나 대화가 끊기는 경우도 생기고 성격도 변해서 우울하고 말수도 줄어들었다. 돈 관리나 복잡한 일은 하지 못하고 과거에 하던 낚시나 사진 같은 취미생활은 더 이상할 수 없게 되었다. 인지검사에서 기억, 언어, 시공간, 전두엽실행 능력 등 대부분의 인지검사에서 매우 낮은 점수를 보였으나 MRI 사진에서는 뇌의 경도 위축을 보였으나 대체로 큰 이상은 보이지 않았다.<\/div>", "o": ["경도인지장애(Mild Cognitive Impairment)", "알츠하이머 치매", "루이체 치매(Diffuse Lewy Body Disease)", "파킨슨병 치매(Parkinson’s Disease Dementia)", "전측두엽 치매(Frontotemporal Dementia)"], "a": 3, "A": "④", "E": "2023년 26번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "④"}, {"id": "20-30", "keys": ["20-30"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>기억과 관련된 설명이다. 옳은 것은?<\/div>", "o": ["후각, 기억, 감정, 동기화, 장기기억은 상당히 밀접한 연결을 가지고 있으며 이 기능에 공통적으로 작용하는 뇌구조의 모임을 limbic-system이라고 한다.", "기억을 구분하는데 언어로 표현될 수 있는 서술적 기억과 표현되기 어려운 비서술적 기억으로 나누고 서술적 기억에 주로 관여하는 부분이 해마를 포함하는 구조들이다.", "파블로프가 실험하여 유명한 조건화에 해마는 관여하지 않고 소뇌와 편도가 중요한 역할을 한다.", "기억은 단기기억과 장기기억으로 나누고 단기기억에서 초단기기억으로 작업 기억을 구부하는데 작업 기억은 전두엽에 단기기억은 측투엽에 그리고 장기기억의 저장부위는 뇌 전체에 분포하는 것으로 알려졌다.", "모두 옳다"], "a": 4, "A": "⑤", "E": "2025년 61번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "⑤"}, {"id": "20-35", "keys": ["20-35"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>최근에 개정된 레비소체(루이소체)치매(DLBD) 진단기준은 이전의 기준과 다르게 핵심소견 4개, 암시소견 3개, 지지소견 10개에서 4개의 핵심소견과 3가지의 임상특징들로 바뀌었다. 다음 중 4가지 핵심소견에 해당되지 않는 것을 고르면?<\/div>", "o": ["치매", "주의 집중력과 각성의 현저한 변화", "세밀하게 잘 형상화된 반복되는 환시", "반복되는낙상과실신", "자연발생 양상의 파킨슨증"], "a": 3, "A": "④", "E": "2023년 26번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "④"}, {"id": "25-64", "keys": ["25-64"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 중 뇌전증이 치료되었다고 생각되어지는 사람은?<\/div>", "o": ["뇌전증 약 투약 후 2년 동안 발작이 다시 나타나지 않는 사람", "뇌전증 약물 중단 후 1년이 지났는데 발작이 재발되지 않은 사람", "뇌전증이 있어 뇌 사진을 찍었고 뇌종양이 발견되어 수술로 제거한 지 6개월 된 사람", "교통사고로 뇌출혈이 생겨 입원 도중 경련성 뇌전증 발작이 생겼고 뇌수술 후 혈종을 제거한 뒤 3개월이 지나 출혈이 완전히 흡수 완료된 사람", "뇌전증으로 약물복용을 오랫동안 해오는 사람으로 10년 전부터는 발작이 전혀 나타나지 않는 사람"], "a": 4, "A": "⑤", "E": "26년 강의(2014 뇌전증 종료 추정): 2014년 ILAE 정의에서 뇌전증이 resolved(완해)되었다고 보는 경우는 연령 의존 증후군에서 해당 나이가 지난 뒤 발작이 없을 때, 투약을 유지하며 10년 이상 발작이 없을 때, 투약 중단 후 5년 이상 발작이 없을 때다. 약을 계속 먹으며 10년간 발작이 없었던 ⑤가 이에 해당한다. ①(투약 중 2년)·②(중단 후 1년)는 기간이 모자라고(2014년 이전에는 약을 끊고 2년을 기준으로 봤다), ③은 병소 제거 후 6개월로 관찰 기간이 너무 짧으며, ④는 외상성 뇌출혈 급성기의 유발 발작이라 완해 개념을 적용하기 어렵다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-65", "keys": ["25-65"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증의 역학에 대해 옳은 설명은?<\/div>", "o": ["전세계 공통적으로 뇌전증은 나타나며 인종, 국가, 사회환경에 관계없이 비슷하 게 발병된다", "저개발 국가는 노년층이 선진국은 젊은 연령에서 빈도가 높다", "고령화로 인해서 전세계에서 점차 발생빈도가 증가하는 뇌질환이다.", "뇌전증 환자는 일반인에 비해 사망률이 그다지 높지 않다", "뇌전증의 최소 반 정도는 치료되는 편이다"], "a": 4, "A": "⑤", "E": "26년 강의(뇌전증의 역학·자연경과): 자연경과 그림에서 약물 난치성으로 남는 비율은 약 30%이고 나머지는 완화되며(일부 재발), 최소 절반 정도는 치료되는 편이라 ⑤가 옳다. 유병률은 저개발국(약 1%)이 선진국(약 0.5%)보다 높아 환경에 따라 다르고(①), 저개발국은 젊은 층, 선진국은 노년층에 많아 ②는 반대다. 노년층에 많은 것은 뇌졸중·퇴행성 질환에 따른 뇌손상 때문이지 고령화 자체 때문은 아니라는 것이 출제 교수의 설명이라 ③도 틀리고(가장 많이 고른 오답), 표준화 사망비(SMR)가 일반인보다 1.2~1.5배 높게 유지되므로 ④도 틀린다. (정답률 14%)", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-66", "keys": ["25-66"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌세포의 활성도가 증가하는 게 기본적인 뇌전증의 발병 기전으로 생각되는데 신경세포의 흥분도 증가를 일으키는 신경전달 물질은?<\/div>", "o": ["글루타메이트", "가바 (GABA)", "도파민", "세로토닌", "엔돌핀"], "a": 0, "A": "①", "E": "26년 강의(뇌전증 발생 기전): 뇌전증을 일으키는 두 핵심 신경전달물질은 흥분성 glutamate와 억제성 GABA이며, glutamate가 늘거나 GABA가 줄면 흥분도가 올라가 발작이 퍼진다. 따라서 흥분도 증가를 일으키는 물질은 glutamate(①)다. GABA는 반대로 억제성이며 많은 항경련제가 GABA 작용을 강화한다. 도파민·세로토닌·엔돌핀은 상황에 따라 흥분 또는 억제로 작용하며 뇌전증 기전의 핵심으로 다루지 않는다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-67", "keys": ["25-67"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 뇌사진과 뇌파검사를 보고 가장 관련된 질환은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["측두엽 종양", "해마경화증", "혈관종", "실질형성이상", "결절성 경화증(tuberous sclerosis)"], "a": 1, "A": "②", "E": "26년 강의(측두엽 뇌전증, 매년 출제되는 사진): MRI에서 한쪽 hippocampus가 반대쪽보다 위축되어 있고, 뇌파에서 같은 쪽 측두부 전극에 발작파가 보이는 것은 해마경화증(②)의 전형적 소견이다. 해마경화증은 focal epilepsy 중 가장 흔한 측두엽 뇌전증의 대표 원인이다. 측두엽 종양은 위축보다 주변을 누르는 종괴 효과를, 피질 이형성증은 피질 이상을, 결절성 경화증은 피질의 다발성 결절을 보여 영상 소견이 다르다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-37", "keys": ["23-37"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 중 뇌전증 진단에 가장 합당한 환자를 고르시오<\/div>", "o": ["15세 남자 환자 수업 중 경련성 대발작으로 응급실에 내원하였다. 2달전 같은 증상으로 응급실에 내원하였다.", "50세 남자 환자 경련성 대발작으로 응급실에 내원하였다. 이 환자는 하루에 2병 이상 계속 술을 마셔왔고 마지막 술을 마신지 만 하루만에 증상이 나타났다. 첫 증상이었고 비협조적이고 과흥분상태였다.", "45세 환자 자전거를 타고 가다가 차에 치여 의식을 잃고 응급실에 내원하였다. 응급실에서 경련성 대발작을 보였다. 뇌 CT촬영에서 특별한 이상은 없었다.", "35세 여자 환자 이상 행동으로 응급실에 내원하였다. 모친상에서 울다가 과흥분 상태로 전신 움직임을 보이고 의식이 떨어졌다.", "75세 남자 환자 비닐하우스에서 일하다가 전신경련을 보이고 응급실에 내원하였다. 체온은 39.2도였다."], "a": 0, "A": "①", "E": "26년 강의(뇌전증의 정의): 뇌전증 진단의 기본 전제는 뚜렷하고 일시적인 유발 요인이 없는(unprovoked) 발작이 반복되는 것이다. ①은 유발 요인 없이 2달 간격으로 대발작이 재발했으므로 가장 합당하다. ②는 알코올 금단, ③은 급성 두부 외상, ⑤는 고열이라는 뚜렷한 유발 요인(seizure precipitant)이 있는 급성 증상 발작이고, ④는 감정 자극 뒤 나타난 심인성(히스테리) 발작에 가깝다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-38", "keys": ["23-38"], "ch": 7, "g": "경련성질환", "stem": "<div>유전적 소인이 있는 전신 특발성 뇌전증에 포함되지 않는 뇌전증 증후군은?<\/div>", "o": ["청소년근간대뇌전증 juvenile myoclonic epilepsy", "소아결신발작 childhood absence epilepsy", "라스무센 증후군 Rasmussen syndrome", "청소년결신뇌전증 juvenile absence epilepsy", "전신강직간대발작 단독 자간증 Epilepsy with generalized tonic-clonic seizure only"], "a": 2, "A": "③", "E": "26년 강의(특발성 전신 뇌전증): 유전적 소인이 있는 특발성 전신 뇌전증(idiopathic generalized epilepsy)으로 묶는 네 가지는 childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, GTCS 단독 뇌전증이다. Rasmussen syndrome(③)은 한쪽 대뇌반구에 만성 염증이 진행하는 후천성 국소 뇌전증으로 여기에 속하지 않는다. 여러 번 출제된 내용이라 네 가지를 외워 둔다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-39", "keys": ["23-39"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 발작과 감별 해야하는 질환은?<\/div>", "o": ["공황장애", "실신", "히스테리 발작", "틱 장애", "위의 모두 다"], "a": 4, "A": "⑤", "E": "26년 강의(뇌전증 발작과 감별할 질환): 실신, TIA, 공황장애, 저혈당 발작, 수면장애(cataplexy, somnambulism 등), 운동장애(tic, hemifacial spasm 등), 히스테리 발작을 감별해야 한다. 보기의 공황장애·실신·히스테리 발작·틱 장애가 모두 이 목록에 들어가므로 '모두 다'(⑤)가 정답이다. 이 교수는 '모두 다' 선지를 정답으로 자주 낸다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-40", "keys": ["23-40"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 환자의 투약에 대한 옳은 내용은?<\/div>", "o": ["대부분은 약물치료로 완치되는 병이다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "뇌전증 환자가 임신 중 발작이 나타나서 새로운 약을 추가로 투약하는 것은 위험하다.", "케톤식이요법은 소아 뇌전증 환자에게만 효과가 입증되었다.", "투약 중단 후 5년 이상 발작이 없거나 투약 이후 10년 이상 발작이 나타나지 않으면 완해되었다고 판단하는 경향이다."], "a": 4, "A": "⑤", "E": "26년 강의(2014 뇌전증 종료 추정·치료): 투약 중단 후 5년 이상, 또는 투약을 유지하며 10년 이상 발작이 없으면 완해로 판단하므로 ⑤가 옳다. 치료 목표는 완치가 아니라 seizure free 상태이므로 '대부분 완치'라는 ①은 틀리고, 수술로 병소를 제거해도 항경련제가 필요한 경우가 많다(②). 임신 중 발작이 생기면 적극적으로 약을 바꾸거나 추가하며(③), 케톤식이는 성인에게도 효과가 있으나 현실적으로 주로 소아에게 쓴다(④).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-22", "keys": ["22-22"], "ch": 7, "g": "경련성질환", "stem": "<div>알코올 관련발작에 대한 설명으로 옳은 것은?<\/div>", "o": ["acute alcoholism과 관련된 alcohol toxic seizure이다", "뇌파검사상 발작파 발견 가능성이 높다", "향후 뇌전증으로 발전하므로 조기에 예방적 항경련제 치료가 필요하다", "진전섬망으로 발전 가능성이 높다", "경련성 전신 대발작이 특징이다"], "a": 3, "A": "④", "E": "26년 학습부(알코올 금단증후군): 알코올 관련 발작(rum fits)은 급성 중독이 아니라 만성 음주자가 술을 끊은 뒤 6~48시간(흔히 하루 안)에 생기는 금단 발작이다(①은 틀림). 금단 증상은 떨림 → 알코올 환각증 → 금단 발작 → 진전섬망(delirium tremens) 순으로 진행할 수 있어 ④가 옳다. 뇌파에서 발작파는 대개 보이지 않고(②), 발작은 이틀 정도면 멈추므로 장기 예방적 항경련제는 필요 없고 재발 방지에는 IV lorazepam을 쓴다(③).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "알코올 금단 발작은 2026년 강의 본문에 직접 나오지 않아 학습부에 실린 관련 이론(다른 강의 자료)과 교과서로 판단했습니다(학습부에도 '대부분 전신강직간대발작'으로 적혀 있어 ⑤도 논란 가능, 복원 답 ④ 유지).", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-24", "keys": ["22-24"], "ch": 7, "g": "경련성질환", "stem": "<div>간질의 치료에 대해 옳은 것은?<\/div>", "o": ["약물로 완전한 회복을 기대하기는 어렵다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "자가면역성 뇌염으로 인한 뇌전증 중첩증은 약물이 잘 듣지 않고 예후가 좋지 않다.", "케톤식이요법은 소아 난치성 뇌전증에만 효과가 입증되었다.", "적극적인 약물치료로 뇌전증 중첩증의 사망률을 의미있게 낮출 수 있다."], "a": 2, "A": "③", "E": "26년 강의(치료·뇌전증 중첩증): 자가면역성 뇌염이나 중추신경계 감염처럼 원인 질환이 있는 중첩증은 항경련제에 잘 듣지 않고 근본 원인 때문에 예후가 나쁘므로 ③이 옳다. 뇌전증은 90% 이상 약물로 치료하며 약을 끊고 seizure free가 되기도 하므로 ①은 틀리고, 수술 후에도 호전되지 않아 약이 필요한 환자가 있어 ②도 틀린다. 케톤식이는 중환자 성인에게도 적용할 수 있고(④), 적극적 약물치료가 중첩증의 사망률을 의미 있게 낮춘다는 설명은 없다고 교수가 피드백했다(⑤).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "③", "vb": "검안"}, {"id": "21-10", "keys": ["21-10"], "ch": 7, "g": "경련성질환", "stem": "<div>대뇌에 많은 신경전달물질 중 뇌전증 치료제의 효과에 가장 관련이 높은 물질은?<\/div>", "o": ["Dopamine", "GABA", "Glutamate", "Ach", "Serotonin"], "a": 1, "A": "②", "E": "26년 강의(뇌전증 기전·약물 표적): GABA는 아미노산에서 유래한 대표적 억제성 신경전달물질로, 항경련제는 흥분성을 낮추고 억제성을 높이는 방향으로 이온 채널과 신경전달물질을 조절한다. Phenobarbital, valproate, topiramate, vigabatrin, gabapentin 등 많은 약이 GABA와 관련되어 GABA(②)가 가장 관련이 높다. Glutamate는 흥분성 물질이고, dopamine·ACh·serotonin은 항경련제의 주된 표적이 아니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "2021년 10번은 같은 내용의 주관식(아미노산에서 유래한 억제성 신경전달물질, 답 GABA)이어서 같은 주제의 객관식 문항 형태로 실었습니다.", "img": [], "v": false, "y": [2021], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-59", "keys": ["25-59"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시신경교차부위의 병변으로 나타날 수 있는 시야장애의 양상 은 어느 것인가?<\/div>", "o": ["동측 반맹", "양측두부 반맹", "일측 전맹", "동측 사분맹", "양측두부 사분맹"], "a": 1, "A": "②", "E": "이 문제 case는 왕마라서 시신경 교차? 하면 튀어 나와야합니다. 1. 망막에 들어오는 빛은 반대측에서 교차해서 들어옴. & 2. lat. 망막은 lat.하게, med. 망막은 med.하게 교차해서 주행함 이 두 사실을 갖고 그림을 보면 해당 상황의 시야가 어떻게 보이는지 이해할 수 있습니다. 다른 교수님들 수업에서도 자주 나오는 내용이라 김후원 교수님은 자세하게 설명을 안하셨습니다. * Visual pathway", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-60", "keys": ["25-60"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>브로드만 뇌 영역과 뇌 기능과의 연결이 옳은 것은<\/div>", "o": ["영역 4 – 일차 감각 영역", "영역 3,1,2 – 일차 운동 영역", "영역 8 – 전운동(premotor) 영역", "영역 6 – 보조운동영역", "영역 5,7 – 이차 감각 영역"], "a": 4, "A": "⑤", "E": "정답률 29퍼입니다. 생각보다 정답률이 높아서 놀랍습니다 wow 저는 Broca/Wernicke만 대충 눈에 바르고 들어갔는데 교수가 누군지를 간과했습니다. 빨간 글씨도 아닌게 정답이네요. 관련이론에 나온 부분들은 확실히 암기를 해야 맞출 수 있었습니다. ① 영역 4 – 일차 감각 영역 → 일차 운동 영역 ② 영역 3,1,2 – 일차 운동 영역 → 감각 영역 (관련이론 윗부분에서는 그냥 sensory라고 나와있는데 아랫부분을 보면 위치상 primary sensory cortex에 해당합니다.) ③ 영역 8 – 전운동(premotor) 영역 → frontal eye field ④ 영역 6 – 보조운동영역 → 여기서부터 뇌정지가 좀 옵니다. 윗부분 이론에는 premotor area (secondary motor area)라 적혀있는데 아랫부분 내용을 보면 ‘2ndary motor area(M2)’에 1) premotor cortex & 2) supplementary motor cortex 이렇게 두 개가 있습니다. 그림 상으로도 Area 6에 PMA와 SMA 둘 다 들어가 있네요. 5번이 정답이라는데 4번을 ‘영역 6 – 보조 운동 영역, 전 운동 영역’이라고 완전하게 쓰지 않아서 오답인 것 같습니다. (피드백 시간에 정지연 교수님은 1번 2번이 바뀌고 3번 4번 설명이 바뀌었다고 하셨는데 3,4번의 경우에는 잘못 말하신 것 같습니다. 말이 안됩니다.) ⑤ 영역 5,7 – 이차 감각 영역 (정답) : 관련 이론 윗부분을 보면 그림 상에서 5, 7번 영역의 색이 달라서 혼란이 오실 수 있는데 아랫부분을 같이 보면 의문이 풀립니다. 윗부분에서는 단순히 5, 7 : somatic sensory라고 적혀있지만 아랫부분을 보면 5번 영역이 1,2,3번 영역의 정보를 받고 7번 영역이 visual", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "23-45", "keys": ["23-45"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>우리 몸의 생체시계를 담당하는 시상하부의 핵은?<\/div>", "o": ["supraoptic nucleus", "suprachiasmatic nucleus", "dorsomedial nucleus", "arcuate nucleus", "paraventricular nucleus"], "a": 1, "A": "②", "E": "빛이 들어오면 일부 신호가 suprachiasmatic nucleus로 들어오며, 이를 통해 낮과 밤을 구별합니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-26", "keys": ["22-26"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체기능에 해당하지 않는 것은?<\/div>", "o": ["수면 각성", "호흡 주기", "산, 염기, 전해질", "에너지 대사", "식욕 및 체중"], "a": 1, "A": "②", "E": "피드백시간에 정답률이 낮았던 문제 중 하나였습니다. 과거 기출에 따르면 산, 염기 균형은 시상하부가 조절하지 않는다고 되어있었습니다. 답은 ②번입니다. 21년도 28번 답을 ⑤번으로 수정해두겠습니다. Water Regulation : ③ Food Regulation : ⑤ Sleep-Waking Regulation : ①, ④, ⑤ Various Hormonal control: fertility에 관련된 것 Autonomic Nerve Control: 주로 시상하부에 관련되어 있음 기출 변형인데도 정답률이 낮아서 교수님께서 내년 수업시간에 부가적인 내용을 설명하실 수도 있을 것 같습니다. 이점 참고해서 수업 듣는 것을 추천드립니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "21-28", "keys": ["21-28"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체 기능에 해당하는 것은? 가) 체중조절     나) 수면-각성 주기 조절     다) 전해질 균형     라) 산-염기 균형<\/div>", "o": ["가, 다", "나, 라", "가, 나, 다", "나, 다, 라", "가, 나, 다, 라"], "a": 4, "A": "⑤", "E": "2023년 45번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 빛이 들어오면 일부 신호가 suprachiasmatic nucleus로 들어오며, 이를 통해 낮과 밤을 구별합니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "⑤"}, {"id": "25-46", "keys": ["25-46"], "ch": 8, "g": "신경병리", "stem": "<div>Wallerian degeneration에 대한 설명으로 옳은 것은 무엇인가?<\/div>", "o": ["손상된 신경축삭(axon)의 세포체(cell body)에서 변성이 먼저 시작된다.", "말초신경보다 중추신경에서 더 효과적으로 재생이 일어난다.", "손상 부위의 원위부(distal part) 축삭과 수초가 파괴된다.", "신경세포가 손상되면 바로 세포사멸(apoptosis)이 일어난다.", "Wallerian degeneration은 감각신경에서만 일어나는 특이적 현상이다."], "a": 2, "A": "③", "E": "Wallerian degeneration은 말초신경이 절단·압궤되었을 때 절단 부위보다 원위부의 축삭과 수초가 변성되는 순행성(anterograde) 변화로, 대식세포가 수초 잔해(myelin figure)를 탐식한다(근위부는 가장 가까운 랑비에 결절까지만 변성). ① 세포체부터 죽어 올라가는 것은 대사 이상에 의한 axonal degeneration(dying back), ② 말초신경은 슈반세포 덕분에 중추신경보다 재생이 잘 되고, ④ 세포체는 central chromatolysis를 보일 뿐 바로 죽지 않으며, ⑤ 운동·감각 신경을 가리지 않고 축삭이 끊기면 일어난다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-47", "keys": ["25-47"], "ch": 8, "g": "신경병리", "stem": "<div>Werdnig-Hoffmann disease의 병리학적 특징에 대한 설명으로 옳은 것은?<\/div>", "o": ["중추신경계의 백질(white matter) 탈수초(demyelination)가 주된 병변이다.", "상위운동신경원(upper motor neuron)의 소실이 주된 원인이다.", "척수 전각(anterior horn)의 운동신경원(motor neuron) 손실이 특징이다.", "말초신경의 축삭 재생이 과도하게 일어나 근비대(hypertrophy)를 유발한다.", "골격근에서 거대핵을 가진 세포가 비정상적으로 증식하는 것이 관찰된다."], "a": 2, "A": "③", "E": "Werdnig-Hoffmann disease는 척수성 근위축증(SMA)의 가장 흔한 형으로, 척수 전각의 하위운동신경원이 선천적으로 소실되는 질환이다(floppy baby, 대개 3세 전 사망). 근생검에서 group(panfascicular) atrophy를 보이지만 작은 각진 섬유는 나오지 않는 것이 특징이다. ① 백질 탈수초는 다발성 경화증, ② 상위운동신경원이 아니라 하위운동신경원 질환, ④ 신경지배 소실로 위축되며 간혹 큰 섬유는 가성 비대일 뿐이고, ⑤는 SMA 소견이 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-48", "keys": ["25-48"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 Becker muscular dystrophy의 병리학적 특징으로옳은 것은?<\/div>", "o": ["디스트로핀(dystrophin) 단백질이 완전히 결실되어 면역조직화학염색에서 발 현이 관찰되지 않는다.", "근위축은 주로 상위운동신경원의 퇴화로 인해 발생한다.", "근육생검에서 섬유화 없이 일관된 근섬유 위축만 관찰된다.", "디스트로핀 단백질의 발현은 감소하거나 비정상적인 형태로 존재한다.", "임상적으로는 주로 소아기 초기에 빠르게 진행되는 전신 근력저하를 보인다."], "a": 3, "A": "④", "E": "Becker 근디스트로피는 Duchenne과 같은 X-연관 dystrophin 이상이지만 dystrophin이 일부 남아 있어 면역염색이 정상보다 약하게 되고, Western blot에서 양이 줄거나 비정상 크기의 band를 보인다. ① dystrophin이 완전히 없어 염색되지 않는 것은 Duchenne, ② 신경원성이 아니라 근병증(myopathy)이며, ③ 진행하면 근섬유 크기 변이와 섬유화가 나타나고, ⑤ Becker는 늦게 시작해 서서히 진행하며 성인까지 생존한다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-49", "keys": ["25-49"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 다발성 경화증(MS)의 병리학적 특징 및 병인기전에 관한 설명으로 가장 적절한 것은?<\/div>", "o": ["말초신경계의 schwann cell이 주로 손상되어 감각 및 운동기능저하가 나타난 다.", "병변에서는 Th2 세포와 IL-4의 분비가 우세하여 염증반응이 억제된다.", "병변의 초기단계에서 oligodendrocyte의 손실과 macrophage 및 microglia의 활성화가 관찰된다.", "병변은 주로 대뇌피질의 회백질에서 발견되며, 백색질 손상은 드물다.", "MS에서 형성되는 탈수초성 병변은 신경근 접합부의 아세칠콜린수용체 결손과 직접적인 연관이 있다."], "a": 2, "A": "③", "E": "다발성 경화증은 CNS에서 수초를 만드는 oligodendrocyte가 손상되는 자가면역성 탈수초 질환으로, 병변에서 oligodendrocyte와 수초는 줄고 대식세포(foamy macrophage)·미세아교세포·T 림프구와 astrocyte는 늘며 축삭은 보존된다. ① 말초 슈반세포가 아니라 중추 oligodendrocyte, ② CD4+ Th1 세포가 IFN-γ로 대식세포를 활성화해 염증이 진행되고, ④ 주로 뇌실 주위 백질 병변이며, ⑤ 아세틸콜린 수용체 결손은 중증근무력증이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-01", "keys": ["23-01"], "ch": 8, "g": "신경병리", "stem": "<div>22세 남자가 forearm의 deep laceration으로 median nerve의 tansection이 발생하였다면 이후 이 신경에 초래될 변화는?<\/div>", "o": ["Wallerian degeneration", "Fibrinoid necrosis", "Coagulative necrosis", "Segmental demyelination", "Chronic inflammation"], "a": 0, "A": "①", "E": "전완부 깊은 열상으로 정중신경이 완전히 절단되면 절단 부위 원위부의 축삭과 수초가 변성되는 Wallerian degeneration이 일어난다(세포체는 central chromatolysis). ④ segmental demyelination은 축삭은 남고 수초 분절만 소실되는 탈수초 질환 소견이며, 괴사(②③)나 만성 염증(⑤)은 신경 절단의 특징적 변화가 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-02", "keys": ["23-02"], "ch": 8, "g": "신경병리", "stem": "<div>Cerebral cortex가 조직학적으로 많은 neuritic plaques, neurofibrillary tangles, amyloid angiopathy가 관찰된다. 가장 관련 가능성이 높은 것은?<\/div>", "o": ["choreiform movement를 하는 48세 남자", "갑작스런 의식소실을 보이는 30세 여자", "progressive muscular weakness를 보이는 44세 여자", "Down's syndrome이 있는 40세 여자", "시력장애와 neurologic function 장애를 갖는 2세 소년"], "a": 3, "A": "④", "E": "Neuritic(senile) plaque, neurofibrillary tangle, cerebral amyloid angiopathy는 알츠하이머병의 대표 소견이다. Down 증후군은 APP 유전자가 있는 21번 염색체가 3개여서 Aβ가 많이 만들어지므로 40대 무렵부터 알츠하이머 병리가 나타난다. ① 무도병은 헌팅턴병, ③ 진행성 근력 약화는 운동신경원·근육 질환, ⑤ 소아의 시력·신경 기능 장애는 대사성 질환 등을 시사한다.", "B": "26 학습부 15번(검안) · 신경 병리 · 웹 자료(교과서)", "N": "Down 증후군과 알츠하이머병의 연관은 강의 자료에 없어 교과서 지식으로 보충함", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-03", "keys": ["23-03"], "ch": 8, "g": "신경병리", "stem": "<div>3세 여아가 사지를 모두 침범하는 점차적인 weakness로 움직이기가 어려워졌다. 부모의 말에 따르면 특별한 질환을 앓은 적이 없고, 만기 정상분만을 하였다고 한다. 열은 없었으며 laboratory finding상 특이 소견은 없었다. 근생검 소견상 근섬유의 grouped atrophy가 관찰되었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["Myasthenia gravis", "werdnig-hoffman disease", "Duchenne muscular dystrophy", "Polymyositis", "Pompe's disease"], "a": 1, "A": "②", "E": "정상 분만한 소아가 사지 전체의 진행성 근력 약화를 보이고 근생검에서 grouped atrophy가 보이면 선천적 탈신경 위축인 척수성 근위축증(SMA), 그중 가장 흔한 Werdnig-Hoffmann disease를 생각한다. ① 중증근무력증은 NMJ 질환으로 grouped atrophy가 특징이 아니고, ③ Duchenne은 근병증(dystrophin 결핍, 섬유화·가성 비대), ④ 다발근염은 염증성 근병증, ⑤ Pompe병은 당원축적병이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-04", "keys": ["23-04"], "ch": 8, "g": "신경병리", "stem": "<div>Charcot-Marie-Tooth disease의 주된 침범 부위로 알맞은 것은?<\/div>", "o": ["Peripheral sensory nerve", "Basal ganglia", "Substantia nigra", "Cerebral cortex", "Anterior horn of spinal cord"], "a": 0, "A": "①", "E": "Charcot-Marie-Tooth disease(HSMN type 1)는 가장 흔한 유전성 말초신경병증으로, 운동·감각 말초신경의 반복적인 분절성 탈수초와 재수초화로 onion bulb가 생기고 비골근 위축(거꾸로 선 샴페인 병 모양 다리)과 요족을 보인다. 선지 중 말초신경을 침범하는 것은 ①뿐이며, 기저핵·흑질·대뇌피질은 퇴행성 CNS 질환, 척수 전각은 ALS·SMA의 침범 부위다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-11", "keys": ["22-11"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 근육의 disuse atrophy에 대한 설명은?<\/div>", "o": ["type 1 muscle fiber의 angular atrophy", "type 2 muscle fiber의 angular atrophy", "type 1 and 2 muscle fiber의 angular atrophy", "target fiber", "fiber type grouping"], "a": 1, "A": "②", "E": "깁스나 장기 침상 생활로 근육을 쓰지 않으면(disuse atrophy) type 2 근섬유가 가장 먼저, 가장 빠르게 위축되어 작고 각진(angular) 섬유가 된다. target fiber(④)와 fiber type grouping(⑤)은 탈신경과 재신경지배의 증거이고, type 1만(①) 또는 두 type 모두(③)가 위축되는 것이 disuse atrophy의 특징은 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-13", "keys": ["22-13"], "ch": 8, "g": "신경병리", "stem": "<div>장년 여성이 눈꺼풀처짐증, 복시, 구음장애가 발생하였다. 증상은 아침에 경하나 저녁으로 갈수록 심해지는 경향이 있었다. 이 환자의 질환과 관련된 특징으로 가장 거리가 먼 것은?<\/div>", "o": ["thymoma", "anti-acetylcholine receptor antibodies", "호흡곤란", "type 1 muscle fiber 내의 작은 막대모양 과립", "cholinesterase inhibitor 투여로 증상 호전"], "a": 3, "A": "④", "E": "아침에 덜하고 저녁에 심해지는 안검하수·복시·구음장애는 중증근무력증으로, AChR에 대한 자가항체가 수용체를 차단·감소시키는 자가면역 질환이다. 흉선종·흉선증식과 관련되고(①), 항AChR 항체가 있으며(②), 호흡근 약화로 호흡곤란이 올 수 있고(③), cholinesterase 억제제(Tensilon 검사)로 증상이 좋아진다(⑤). type 1 근섬유 안의 막대 모양 과립은 nemaline(rod) myopathy 소견이라 거리가 멀다.", "B": "26 학습부 15번(검안) · 신경 병리 · 웹 자료(교과서)", "N": "④의 nemaline myopathy는 강의 자료에 없어 교과서 지식으로 보충함", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-14", "keys": ["22-14"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 ALS에 대한 설명으로 옳지 않은 것은?<\/div>", "o": ["Papova virus와 연관되어 발생한다.", "Ant. motor horn cell이 감소한다.", "Lat. corticospinal tract 침범한다.", "대칭적 반사과다 및 경직", "대칭적 근위축"], "a": 0, "A": "①", "E": "ALS(루게릭병)는 척수 전각의 하위운동신경원(근위축)과 외측 피질척수로의 상위운동신경원(반사항진·경직)을 함께 침범하는 퇴행성 운동신경원 질환으로, 대칭적 근위축과 반사항진이 나타난다. 일부(5~10%)는 상염색체 우성 유전이고 TDP-43 단백 응집이 핵심 분자 병리이며, papova(JC) virus와는 관련이 없다(JC virus는 PML의 원인).", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-04", "keys": ["20-04"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중에서 퇴행성 신경질환은?<\/div>", "o": ["Lou Gehrig disease", "multiple sclerosis", "Werdnig-Hoffmann disease", "Duchenne muscular dystrophy", "leukodystrophy"], "a": 0, "A": "①", "E": "퇴행성 신경질환은 특정 신경세포군이 원인 없이 선택적·점진적으로 소실되는 회백질 질환으로, 상·하위운동신경원이 소실되는 루게릭병(ALS)이 대표적이다. ② 다발성 경화증은 탈수초 질환(백질 병변), ③ Werdnig-Hoffmann은 선천성 탈신경 위축(SMA), ④ Duchenne은 근병증, ⑤ leukodystrophy는 수초의 선천성 대사 이상이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-07", "keys": ["25-07"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 왼팔과 다리에서 dysmetria, kinetic tremor가 관찰되었다면 종양이 어디로 전이된 것으로 생각할 수 있나?<\/div>", "o": ["The right frontal lobe", "The cerebellar vermis", "The left frontal lobe", "The right cerebellar hemisphere", "The left cerebellar hemisphere"], "a": 4, "A": "⑤", "E": "왼쪽 팔·다리의 dysmetria(겨냥이상)와 kinetic(의도) tremor는 finger-to-nose 검사 등으로 확인되는 소뇌 협조운동 장애다. 소뇌 경로는 두 번 교차하므로 소뇌반구 병변의 증상은 같은 쪽에 나타나 왼쪽 소뇌반구 전이를 의심한다. 전두엽 병변은 반대쪽 운동마비를, 충부(vermis) 병변은 사지보다 몸통·평형 장애를 주로 일으킨다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-11", "keys": ["25-11", "22-05"], "ch": 9, "g": "운동장애", "stem": "<div>자세와 근긴장도에 영향을 주는 indirect activation pathway 중 lateral에 위치하며 대뇌제거경축과 피질제거경 축 자세 차이에 영향을 주로 미치는 tract는?<\/div>", "o": ["rubrospinal tract", "tectospinal tract", "reticulospinal tract", "vestibulospinal tract", "corticospinal tract"], "a": 0, "A": "①", "E": "Rubrospinal tract는 indirect activation pathway 중 lateral에 위치하며 상지 굽힘근을 담당한다. 적핵보다 위(사이뇌·upper midbrain) 병변에서는 이 경로가 남아 항진되어 상지 굽힘·하지 폄의 피질제거경축(decorticate)이 나타나고, 그 아래(midbrain~상부 pons) 병변에서는 소실되어 사지 모두 폄인 대뇌제거경축(decerebrate)이 된다. 두 자세 차이를 결정하는 것이 rubrospinal tract이다. vestibulospinal·reticulospinal tract은 사지 폄, tectospinal tract은 머리 위치 조절을 맡는다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-13", "keys": ["25-13"], "ch": 9, "g": "운동장애", "stem": "<div>Brain reticular formation이 관여하는 기능이 아닌 것은?<\/div>", "o": ["Arousal", "coordination", "Muscle tone", "Pain", "Homeostasis"], "a": 1, "A": "②", "E": "뇌간 망상체는 의식(각성, 상행 망상체 활성계)에 가장 깊게 관여하고, reticulospinal tract으로 근긴장도·자세에 관여하며 통증 조절, 자율신경·항상성 유지에도 관여한다. Coordination(협조운동)은 소뇌의 핵심 기능으로 망상체 기능이 아니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 / 16번(검안) · 운동장애", "N": "통증 조절·항상성 관여는 강의 18 검안에 덧붙은 그물체 기능 자료로 확인", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-16", "keys": ["25-16"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병의 증상과 징후에 대한 설명이다. 적절한 표현은?<\/div>", "o": ["농촌거주자보다 도시거주자에 많이 발생된다.", "떨림은 주로 손, 머리, 목소리에서 주로 관찰된다.", "진전 서동증 등 운동 증상은 초기에는 일측성으로 관찰된다.", "도파민 신경세포 소실이 20-30% 정도 소실시 운동장애 현상을 일으킨다.", "사립체에서 호흡사슬복합체 I의 기능을 저해되어 주로 콜린세포 손상 초래된다."], "a": 2, "A": "③", "E": "파킨슨병 운동 증상(떨림·서동증·경직)은 한쪽에서 시작해 나중에 양쪽으로 퍼지는 asymmetric onset이 가장 중요한 특징이다. ① 농약·우물물 등으로 농촌이 도시보다 많고, ② 손·머리·목소리 떨림은 본태떨림이며 파킨슨 떨림은 손·다리에 주로 나타난다. ④ 도파민 세포가 약 80% 소실되어야 운동 증상이 나타나고, ⑤ 미토콘드리아 complex I 장애로 손상되는 것은 콜린세포가 아니라 도파민 세포다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-17", "keys": ["25-17"], "ch": 9, "g": "운동장애", "stem": "<div>불규칙한 움찔거리는(jerky) 불수의 운동이 신체의 여러 부분에서 불규칙(random)하고 순서로 나타나거나 한 부분에서 다른 부분으로 물 흐르듯이(flowing) 이동하는 이상 운동은?<\/div>", "o": ["진전", "무도증", "틱", "이긴장증", "연축"], "a": 1, "A": "②", "E": "무도증(chorea)은 짧고 불규칙한 움찔거리는 불수의 운동이 정해진 패턴 없이 신체 여러 부위에 무작위로 나타나거나 한 부위에서 다른 부위로 물 흐르듯(flowing) 끊임없이 이어지는 것이 핵심 특징이다. 진전은 규칙적 진동, 틱은 일시적 억제가 가능한 정형화된 운동, 이긴장증은 작용근·대항근 동시 수축에 의한 꼬인 자세다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-19", "keys": ["25-19"], "ch": 9, "g": "운동장애", "stem": "<div>MRI 소견에서 다음과 같은 소견이 관찰되며 경직과 운동완만은 파킨슨병과 비슷하나 자세 불안정과 안구의 수직운동장애가 특징인 비전형 파킨슨증은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["윌슨병", "진행핵상마비", "다계통위축", "겉질바닥핵변성", "Lewy소체치매"], "a": 1, "A": "②", "E": "경직·운동완만은 파킨슨병과 비슷하지만 초기부터 잘 넘어지고(자세 불안정) 안구 수직운동, 특히 하방주시가 안 되며 놀란 토끼눈 표정을 보이는 비전형 파킨슨증은 진행핵상마비(PSP)다. MRI에서 중뇌 위축으로 hummingbird sign이 보이며 tau 병리에 속한다. 다계통위축은 자율신경·소뇌 증상과 hot cross bun sign, 겉질바닥핵변성은 alien limb 현상이 특징이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-06", "keys": ["23-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜰 때는 중심을 잡으나 감으면 중심 잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "posterior column", "frontal lobe", "peripheral nerve"], "a": 2, "A": "③", "E": "Romberg 검사에서 눈을 뜨면 균형을 유지하지만 눈을 감으면 시각 보상이 사라져 넘어지는 경우(Romberg 양성)는 고유감각 경로인 후섬유단(posterior/dorsal column) 장애, 즉 sensory ataxia다. 소뇌 질환이면 눈을 뜨거나 감거나 모두 중심을 잡기 어렵다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-08", "keys": ["23-08"], "ch": 9, "g": "운동장애", "stem": "<div>뇌간에서 발생한 혈관 병변에 의해 환자의 팔다리에 광범위하고 심한 경축(rigidity)이 나타났다. 이 경축과 가장 관련이 높은 신경로는?<\/div>", "o": ["적색척수로(rubrospinal tract)", "덮개척수로(tectospinal tract)", "내측세로다발(Medial longitudinal fasciculus ; MLF)", "외측그물척수로(Lateral reticulospinal tract)", "외측진정척수로(Lateral vestibulospinal tract)"], "a": 4, "A": "⑤", "E": "팔다리 전체의 광범위하고 심한 경축은 대뇌제거경축(사지 모두 폄)에 해당하며, 사지 폄근을 항진시키는 lateral vestibulospinal tract의 과다 항진이 주된 원인이다. 상지 굽힘이 있는 피질제거경축이었다면 rubrospinal tract을 생각해야 하므로 rubrospinal tract(①)은 이 문제에서 오답이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-11", "keys": ["23-11"], "ch": 9, "g": "운동장애", "stem": "<div>Ankle clonus 영상. 다음 비디오와 같이 corticospinal tract 손상시 작용근과 대항근 관계의 근육 중 한 근육을 빠르게 펴면 작용근과 대항근이 번갈아 수축과 이완을 반복하는 현상이 나타나는데 이 경우 심부건 반사의 grade는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["0", "+", "++", "+++", "++++"], "a": 4, "A": "⑤", "E": "상위운동신경세포(corticospinal tract) 손상에서는 심부건반사가 항진되고 발목 클로누스가 나타난다. 근육을 빠르게 늘였을 때 작용근과 대항근이 율동적으로 수축·이완을 반복하는 클로누스는 심부건반사 등급에서 가장 높은 ++++로 기록한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "심부건반사 등급(++++=클로누스)은 강의 18 검안에 덧붙은 반사 등급표로 확인", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-13", "keys": ["23-13"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 우측 손과 발에서 겨냥이상과 의도떨림이 관찰되었다. 종양이 전이된 것으로 추정되는 곳은?<\/div>", "o": ["우측 소뇌 반구", "좌측 소뇌 반구", "우측 전두엽", "좌측 전두엽", "소뇌 중부"], "a": 0, "A": "①", "E": "오른쪽 손·발의 겨냥이상(dysmetria)과 의도떨림(intention tremor)은 소뇌반구 병변의 협조운동 장애다. 소뇌 병변의 증상은 같은 쪽에 나타나므로 우측 소뇌반구 전이를 의심한다. 전두엽 병변은 반대쪽 증상을, 소뇌 중부(충부) 병변은 주로 몸통 실조·평형 장애를 보인다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-30", "keys": ["23-30"], "ch": 9, "g": "운동장애", "stem": "<div>다음 video에서 관찰되는 운동은?<\/div><div>동영상 : 20231103111140261.mp4<\/div>", "o": ["떨림", "근긴장이상", "근간대경련", "무도증", "실조증"], "a": 1, "A": "②", "E": "근긴장이상(dystonia)은 작용근과 대항근의 지속적 동시 수축으로 힘이 센 쪽으로 몸이 뒤틀리며 꼬인 비정상 자세를 보이는 운동장애다. 영상에서 뒤틀린 자세가 관찰되어 근긴장이상에 해당한다. 떨림은 규칙적 진동, 근간대경련은 순간적인 충격 같은 움찔임, 무도증은 부위를 옮겨 다니는 흐르는 듯한 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "동영상 문항 — 영상 원본 없이 복원 설명 기준으로 판단", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-06", "keys": ["22-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜨거나 감거나 중심잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "proprioception", "frontal lobe", "peripheral nerve"], "a": 1, "A": "②", "E": "Romberg 검사에서 눈을 뜨거나 감거나 모두 중심을 잡기 어려우면 소뇌 장애다. 눈을 뜨면 유지되지만 감으면 넘어지는 경우는 고유감각(후섬유단) 장애로 구분한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-07", "keys": ["22-07"], "ch": 9, "g": "운동장애", "stem": "<div>근긴장도 검사에서 옳은 사항은?<\/div>", "o": ["경축은 피라미드질환에서 자주 관찰된다.", "경직은 관절 움직임 진찰 시작에서 끝까지 저항이 고루 느껴진다.", "경축은 upper motor neuron 손상에서 관찰되며 반사항진이 동반된다.", "경직은 상지에서 폄근(extensor) 하지에서 굽힘근(flexor)에서 더 잘 관찰된다.", "파킨슨병에서 관절 운동검사에서 톱니바퀴가가 맞물려 돌아가는 경축이 관찰된다."], "a": 4, "A": "⑤", "E": "경축(rigidity)은 바닥핵(추체외로) 병변에서 관절 운동 범위 전체에 걸쳐 저항이 일정하며, 파킨슨병에서는 떨림이 겹쳐 톱니바퀴가 걸리듯 끊기는 cogwheel rigidity가 나타난다. 경직(spasticity)은 상위운동신경세포(추체로) 손상에서 반사 항진과 함께 처음 저항이 크다가 갑자기 풀리는 clasp-knife 양상을 보이며 상지 굽힘근·하지 폄근에서 두드러진다. 따라서 ①~④는 경축과 경직을 바꾸어 쓴 오답이다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-09", "keys": ["22-09"], "ch": 9, "g": "운동장애", "stem": "<div>본태떨림을 의심할 수 있는 흔한 떨림 부위는?<\/div>", "o": ["손, 다리, 머리", "손, 목소리, 턱", "다리, 머리, 턱", "손, 목소리, 다리", "손, 목소리, 머리"], "a": 4, "A": "⑤", "E": "본태떨림은 주로 팔을 들거나 자세를 유지할 때 나타나는 양측·대칭성 자세떨림으로 손(상지)에 가장 흔하고 머리와 목소리에도 잘 나타난다. 다리는 잘 떨지 않으며, 손·다리 떨림은 파킨슨 떨림의 분포다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-12", "keys": ["22-12"], "ch": 9, "g": "운동장애", "stem": "<div>다음 운동장애의 이름은?<\/div><div>동영상 : 20221102085855337.mp4<\/div>", "o": ["틱", "진전", "무도증", "이긴장증", "근간대경련"], "a": 3, "A": "④", "E": "평소 검진에서는 이상이 없다가 글씨 쓰기 같은 특정 동작을 할 때만 손이 굳어 수행이 어려운 것은 특정 과제로 유발되는 국소 근긴장이상(writer's cramp, limb dystonia)이다. 틱·무도증·근간대경련·진전은 특정 과제와 무관하게 나타나는 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "동영상 문항 — 영상 원본 없이 복원 설명 기준으로 판단", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "21-06", "keys": ["21-06"], "ch": 9, "g": "운동장애", "stem": "<div>근육긴장이상을 보인 신체 부분에 감각자극을 줄 경우 근육긴장이상이 일시적으로 호전되는 현상은?<\/div>", "o": ["torticollis", "athetosis", "focal dystonia", "sensory trick", "psychogenic tremor"], "a": 3, "A": "④", "E": "근긴장이상 부위에 일정한 감각 자극(예: 목 뒤나 턱을 손으로 만짐)을 주면 근긴장이상이 일시적으로 호전되는 현상을 sensory trick(gestes antagonistes, 감각계교)이라 하며 근긴장이상을 강하게 시사하는 소견이다. torticollis는 경부 근긴장이상, focal dystonia는 국소 근긴장이상이라는 분류 이름이고 athetosis는 느리게 꿈틀거리는 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-14", "keys": ["20-14"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병(PD)과 진행성핵상마비(PSP)를 감별하는 가장 특징적인 임상소견은?<\/div>", "o": ["tremor", "bradykinesia", "rigidity", "impaired upward conjugate gaze", "impaired downward conjugate gaze"], "a": 4, "A": "⑤", "E": "진행핵상마비(PSP)는 파킨슨병처럼 서동증·경직이 있지만 안구 수직운동, 특히 하방주시(downward gaze)가 가장 먼저·두드러지게 장애되고 초기부터 잘 넘어진다. 따라서 파킨슨 증상 환자에서는 안구운동을 반드시 확인해야 한다. 떨림·서동증·경직은 두 질환에 공통이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-12", "keys": ["25-12"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>다음 중 Glasgow coma scale의 최저 점수는?<\/div>", "o": ["0", "1", "2", "3", "4"], "a": 3, "A": "④", "E": "Glasgow coma scale은 눈뜨기(1~4점), 운동 반응(1~6점), 언어 반응(1~5점) 세 항목의 합으로, 각 항목의 최저점이 1점이므로 최저 점수는 3점, 최고(정상)는 15점이다. 최소점이 0점이 아니라는 점을 강의에서 반복 강조했다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-07", "keys": ["23-07"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 4, "A": "⑤", "E": "Ciliospinal reflex는 목(SCM 부위) 피부를 꼬집으면 경신경과 제1흉수 중간외측핵의 교감신경을 거쳐 같은 쪽 동공이 커지는 반사다. 구심·원심 경로가 모두 척수에 있어 뇌간이 아닌 척수 기능을 평가하는 반사이므로 답은 척수다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-09", "keys": ["23-09"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>57세 여자가 복시와 오른눈의 안검하수 동공 확장 및 아래 바깥으로 편위된 안구를 보이며 원근 조절반사 장애를 보이는 경우 이 환자의 병변의 부위는?<\/div>", "o": ["oculomotor nerve", "trochlear nerve", "abducens nerve", "superior colliculus", "lateral tegmentum"], "a": 0, "A": "①", "E": "복시, 같은 쪽 안검하수, 동공 확대, 안구의 외하방 편위, 조절반사 장애는 외직근(CN VI)·상사근(CN IV)을 제외한 외안근과 부교감 섬유를 지배하는 동안신경(CN III) 마비 소견이다. 활차신경 마비는 하방 주시 시 수직 복시, 외전신경 마비는 외전 장애만 보인다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-10", "keys": ["23-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>전정 기능검사 중 바른 사항은?<\/div>", "o": ["머리 회전운동에 대해 눈의 움직임이 고정되어 있으면 정상이다.", "혼수 환자에서 인형눈현상이 정상이면 대사질환의 가능성이 크다.", "인형안현상의 구심신경은 안구운동에 관여하는 신경이며 원심신경은 전정신경이다.", "혼수 환자에서 머리회전의 반대 방향으로 편위되면 뇌 줄기의 기질적 이상을 시사한다.", "온도안진검사의 평가는 정상의 경우 온수로 자극시 자극 반대 방향으로 향하는 안진이, 냉수로 지극시 동측으로 향하는 안진이 관찰된다."], "a": 1, "A": "②", "E": "인형눈현상(oculocephalic reflex)이 정상이면(머리를 돌린 반대 방향으로 눈이 감) 뇌간 기능이 보존된 것이므로 혼수 원인으로 구조적 뇌간 병변보다 대사성 원인 가능성이 크다. ① 눈이 고정되어 머리와 함께 돌아가면 비정상, ③ 구심신경이 전정신경이고 원심신경이 안구운동신경, ④ 머리 회전과 같은 방향으로 편위될 때 뇌간 이상, ⑤ 정상에서는 냉수 자극 시 반대쪽, 온수 자극 시 같은 쪽으로 안진이 향한다(COWS).", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-03", "keys": ["22-03"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>67세 남자가 의식저하로 응급실에 왔다. 호흡은 과호흡을 보이고, 양측 동공은 6mm로 대광반사가 소실되 었고, oculocephalic reflex에서 안구의 움직임이 없고, 다음과 같은 자세로 누워 있었다. 병변으로 추정되는 부위는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["pons", "midbrain", "lower medulla", "diencephalon", "upper medulla"], "a": 1, "A": "②", "E": "과호흡(중추성 신경인성 과호흡), 양측 6mm로 커지고 대광반사가 없는 동공, 인형눈반사 소실, 사지 모두 신전된 대뇌제거경축 자세는 rostro-caudal deterioration의 중뇌(midbrain) 단계 소견이다. 동공이 커지고 고정된 것은 중뇌 동안신경핵 손상을 시사한다. pons 병변은 바늘끝 동공, 연수 병변은 실조성 호흡·무호흡, 사이뇌 병변은 Cheyne-Stokes 호흡·작은 반응성 동공·피질제거경축을 보인다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "복원 답 ①과 다름 — 2026년 강의 기준 ②", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-04", "keys": ["22-04"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 4, "A": "⑤", "E": "Ciliospinal reflex는 목 피부 자극이 경신경과 제1흉수 중간외측핵의 교감신경을 거쳐 같은 쪽 동공을 확대시키는 반사로, 경로가 척수에 있어 척수 기능을 확인하는 반사다. 2023년에 같은 문항이 척수를 정답으로 출제되었고 2026년 강의 자료도 뇌가 아닌 척수를 평가하는 반사라고 정리한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "복원 답 ②과 다름 — 2026년 강의 기준 ⑤", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-10", "keys": ["22-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>섬망에 대한 임상적 특징으로 올바른 것은?<\/div>", "o": ["집중력은 잘 유지된다", "증세 변동이 흔하지 않다", "비교적 지속적으로 나타난다", "자율신경계 이상증상이 흔하다", "서서히 시작하는 경우가 대부분이다"], "a": 3, "A": "④", "E": "섬망(delirium)은 혼동이 더 심해진 상태로 갑자기 발생하고 하루 중 증상 변동이 크며 주의력·지남력 저하, 불안·흥분, 환각, 안절부절을 보이고 빈맥·발한 등 자율신경계 이상이 흔하다. 따라서 집중력 유지(①), 변동이 적음(②), 지속적(③), 서서히 시작(⑤)은 모두 틀린 설명이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "급성 발생·변동성·자율신경 증상은 강의 18 검안에 덧붙은 섬망 자료로 확인", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-04", "keys": ["25-04"], "ch": 9, "g": "신경학적 검사", "stem": "<div>환자가 반대 측 반신마비와 함께 동측 내측주시마비를 보일 때 병변은 어디에 위치하는가?<\/div>", "o": ["연수(medulla)", "간뇌(diencepahalon)", "중뇌(midbrain)", "입쪽교뇌(rostral pons)", "꼬리쪽 교뇌(caudal pons)"], "a": 2, "A": "③", "E": "반대쪽 반신마비는 교차 전 피라미드로(대뇌다리) 손상, 같은 쪽 내측주시마비는 내직근을 지배하는 동안신경(CN III) 손상을 뜻한다. 동안신경핵과 신경 섬유가 대뇌다리를 지나는 곳은 중뇌이므로 병변은 중뇌(Weber 증후군)다. 교뇌 병변은 외전신경·안면신경 증상을, 연수 병변은 하부 뇌신경 증상을 동반한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 · 웹 자료(교과서)", "N": "Weber 증후군 자체는 강의 자료에 없어 동안신경 해부·피라미드로 내용과 교과서 지식으로 판단", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-05", "keys": ["25-05"], "ch": 9, "g": "신경학적 검사", "stem": "<div>일반적으로 반대쪽의 모든 기본 감각에 손상을 보일수 있고 감각이상이나 감각저하, 감각과민 등을 보일 수 있는 병터는?<\/div>", "o": ["마루터 병터", "시상 병터", "뇌줄기 병터", "척수 병터", "신경뿌리 병터"], "a": 1, "A": "②", "E": "시상은 모든 감각정보가 거쳐가는 sensory centor입니다. 고유감각을 관장하는 dorsal column pathway와 pain, temperature를 관장하는 spinothalamic tract 모두 thalamus를 거쳐 cortex로 정보를 전달합니다. 이전까지는 기본 감각에 이상이 없다는 것을 전제, 손에 쥔 동전 등을 인식하지 못하는 대뇌 피질의 문제인 Agnosia에 대해 주로 출제하셨는데, 기본 감각 자체에 대해 물어보신 문제는 처음입니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-10", "keys": ["25-10"], "ch": 9, "g": "신경학적 검사", "stem": "<div>혈중 이산화탄소의 농도에 따라 숨을 몰아 쉬다가는 일시적으로 숨이 멎는 호흡을 주기적으로 할 때, 병변부위는?<\/div>", "o": ["medulla", "midbrain", "basis pontis", "tegmentum pontis", "forebrain"], "a": 4, "A": "⑤", "E": "혈중 CO2 농도에 따라 과호흡과 무호흡이 점강-감쇠 양상으로 주기적으로 반복되는 호흡은 Cheyne-Stokes 호흡이다. 병터는 양쪽 대뇌반구와 사이뇌(또는 대사성 원인)이며, 사이뇌는 앞뇌(forebrain)에 속하므로 답은 forebrain이다. 중추성 신경인성 과호흡은 중뇌·교뇌, 지속흡식호흡은 하부 교뇌, 실조성 호흡은 연수 병변이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-18", "keys": ["25-18"], "ch": 9, "g": "신경학적 검사", "stem": "<div>당뇨 고혈압 고지혈증 약을 투약중인 62세 남자가 우측 팔 다리의 거칠고 불수의적인 빠른 움직임을 보여 응급실로 내원하였다. 이 환자의 증상을 설명할 수 있는 병변은?<\/div>", "o": ["Ipsilateral subthalamic nucleus(STN)", "Ipsilateral medulla", "Contralateral STN", "Contralateral medulla", "Ipsilateral frontal lobe"], "a": 2, "A": "③", "E": "당뇨 등 대사 이상이 있는 노인에서 갑자기 한쪽 팔다리가 크고 거칠게 휘젓듯 움직이는 것은 hemiballism이다. 무도증이 사지 근위부에 크고 격렬하게 나타난 형태로 시상밑핵(subthalamic nucleus) 병변이 원인이며, 바닥핵 회로의 증상은 반대쪽에 나타나므로 우측 증상이면 반대쪽(좌측) STN 병변이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "강의 18번 자료가 아닌 16번(운동장애) 2026 자료로 검증", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-12", "keys": ["23-12"], "ch": 9, "g": "신경학적 검사", "stem": "<div>의삭장애 환자에서 짧은 주기로 무호흡과 과호흡이 점강-감쇠 양상으로 반복되는 호흡 패턴을 보이는 경우 가장 많은 병터는?<\/div>", "o": ["연수", "사이뇌", "하부교뇌", "중뇌와 교뇌", "하부교뇌와 상부연수"], "a": 1, "A": "②", "E": "짧은 주기로 과호흡과 무호흡이 점강-감쇠 양상을 반복하는 호흡은 Cheyne-Stokes 호흡이며, 병터는 양쪽 대뇌반구와 사이뇌(또는 대사성 원인)다. 연수는 실조성 호흡, 하부 교뇌는 지속흡식호흡, 중뇌·교뇌는 중추성 신경인성 과호흡, 하부 교뇌·상부 연수는 군발호흡과 연관된다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-08", "keys": ["22-08"], "ch": 9, "g": "신경학적 검사", "stem": "<div>Foster-kennedy 증후군 에 대한 기술 중 옳지 않은 사항은?<\/div>", "o": ["후각상실증을 나타낸다.", "종양과 같은 쪽에 후각상실증 나타낸다.", "종양의 반대 측에 유두부종을 나타낸다.", "종양의 반대 측에 시신경위축을 나타낸다.", "전두엽 하부의 수막종에 의해 드물게 발생한다."], "a": 3, "A": "④", "E": "Foster-kennedy syndrome은 ➄frontal lobe base의 문제로 ➁동측의 ➀후각장애, 동측의 visual atrophy, ➃ 동측의 optic atrophy ➂반대측의 papilledema를 보입니다. 따라서 종양의 반대 측에 시신경위축을 나타낸다는 ➃번이 틀린 보기입니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "25-40", "keys": ["25-40"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>다음은 두부 손상의 진단에 대한 설명이다. 다음 설명 중 옳은 것을 고르시오.<\/div>", "o": ["단순 방사선촬영을 통해서는 두개골의 선상골절을 확인하기 어렵다.", "전산화 단층촬영(CT)를 통해서는 급성 뇌출혈과 같은 병변을 자세히 확인하기 어렵다.", "자기공명영상(MRI)은 전산화 단층촬영(CT)에 비해 뇌실질의 병변을 예민하게 발견할 수 없는 검사이다.", "자발적으로 눈을 뜨고, 적절하고 지남력이 있는 언어반응을 보이며, 명령에 따르는 운동반응을 보인다면, 글라스고우 혼수계수(Glasgow coma scale) 평가에서 총 15점에 해당한다.", "의식 수준 평가에서 반혼수는 외부 자극에 눈을 감거나, 자극부위로 손을 움직이는 등의 간단한 행동을 보이는 상태를 뜻한다."], "a": 3, "A": "④", "E": "두부손상의 진단에서 문제가 출제되었습니다. 24년도 기출이 없어 새로 출제된 문제라고 보시면 됩니다. ① 방사선 검사 단순촬영에서 두개관의 선상 골절을 가장 잘 볼 수 있습니다. ② CT는 급성기 두부 손상 환자의 진단에서 가장 먼저 시행해야 하는 검사로 빠르고 쉽게 급성 뇌 손상 상태를 확인 가능합니다. ③ MRI는 CT에 비하여 뇌실질의 병변을 더욱 민감하게 보여줍니다. ④ 자발적으로 눈을 뜸 = 4점, 적절하고 지남력이 있는 언어반응 = 5점, 명령에 따르는 운동반응 = 6점 ⑤ 반혼수는 강한 자극에 최소한의 반응만을 보이는 상태입니다. 외부 자극에 눈을 감고 자극부위로 손을 움직이는 등 간단한 행동을 보이는 상태는 혼미(stupor)입니다. 3. 진단", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-41", "keys": ["25-41"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>65세 남자가 의식이 없는 상태로 응급실로 내원하였다. 의식 수준 평가에서 반혼수(Semicoma)에 해당되었고, 두부 전산화 단층촬영 검사를 시행한 결과 다음 그림과 같다. 다음 질환에 대한 설명 중 옳은 것을 고르시오.<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["적절한 치료를 받는다면 예후가 좋은 편이다.", "생존한 경우 심각한 후유증 없이 회복되는 경우가 많다.", "주로 외력에 의해 발생하고 뇌실질 표면의 혈관이 손상된 경우가 많다.", "두부 전산화 단층촬영에서 볼록한 렌즈 모양의 고밀도 음영을 확인할 수 있다.", "의식상태가 나쁘지만 수술적 치료보다는 보존적 치료를 시행하는 것이 좋다."], "a": 2, "A": "③", "E": "CT상 초승달 모양의 흰색을 통해 급성 경막하혈종임을 확인할 수 있습니다. 1. 급성 경막하혈종의 경우 예후가 좋지 않습니다. 2. 생존한 경우라도 심각한 후유장애를 남깁니다. 3. 정답입니다. 4. 경막외혈종에 관한 설명입니다. 급성경막하결종의 경우 CT상 초승달 모양이 보입니다. 5. 의식 저하, midline shift 동반 시 응급 개두술이 필요합니다. 2) 경막하혈종(Subdural Hematoma, SDH)", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-16", "keys": ["23-16"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>60세 남자. 5년 전부터 서서히 계단 오르는 것이 힘들어서 내원하였다. 신경계 진찰시 손가락 및 손목 굽힘근 (finger and wrist flexors muscle)과 넙다리네갈래근 (quadriceps femoris muscle)이 양쪽 모두에서 근력이 감소되었으나 우측이 더 심하였다. 혈액 검사에서 CK 수치가 54U/L였고, 근전도 검사에서는 크기가 작은 활동근전위가 관찰 되었다. 다음은 근육조직검사 결과이다. 진단은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "면역-연관 괴사성근염"], "a": 1, "A": "②", "E": "정답률 79% 조직검사 결과, 화살표 방향의 muscle fiber 안에 muscle fiber 안에 vacule이 inclusion된 것과 endomysium 쪽으로 inflammatory cell 증가한 것으로 포함체 근염임을 알 수 있습니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-34", "keys": ["22-34", "21-34"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>52세 남자 환자가 약 3개월전부터 발생하여 서서히 진행하는 상하지 근력 저하 주소로 내원하였다. 평지를 걸을 때는 비교적 괜찮았으나, 계단을 오 르고 내릴 때 특히 불편감이 있었으며, 2개월 전부터는 양측 손톱을 스스 로 자를 수 없었다고 한다. 양측 손발의 저린감도 있었다. 신경학적 검사에 서 양측 상하지에서 비교적 대칭적인 근력 저하 및 양측 상하지 원위부에 서 경미한 감각저하가 확인되었다. 상하지 심부건반사는 소실되었다. 신경 전도검사에서 탈수초성 운동-감각 다발신경병증 소견이 보였으며, 뇌척수 액 검사 소견상 세포수는 2/mm3, 단백은 73mg/dL의 소견을 보였으며, 당화혈색소를 포함한 혈액 검사는 모두 정상이였다. 진단은?<\/div>", "o": ["중증근무력증", "저칼륨주기마비", "길랑-바레 증후군", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 4, "A": "⑤", "E": "2021년 64번 주관식문제의 지문이 그대로 출제되었습니다. 지문에는 3개월전부터 상하지의 근력이 서서히 저하됐다는 특징, 심부건검사 소실, 탈수초성 소견을 알려줍니다. 같은 탈수초성 질환인 GBS와 비교를 많이 하셨고 가장 큰 차이점은 만성적이라는 점입니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": false, "ra": "⑤"}, {"id": "22-37", "keys": ["22-37", "21-45", "20-39"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>32세 남자 환자가 주먹을 쥐고 나서 잘 펴지지 않는 증상을 주소로 내원하 였다. 이 증상은 10대 후반부터 발생하였으며, 최근 들어서는 양 손에 힘 이 약해져 젓가락질이 불편해졌다. 신체 검사 상, 측두근과 저작근의 위축 이 관찰되며, 앞머리 탈모가 관찰되었다. 근전도 검사에서는 근긴장방전 (myotonic discharge)가 관찰되었다. 이 환자에게서 이상이 관찰될 수 있 는 유전자는?<\/div>", "o": ["EMD gene", "SOD1 gene", "DMPK gene", "SNCA gene", "RNF213 gene"], "a": 2, "A": "③", "E": "2021 45번과 완전히 동일합니다. 주먹을 쥐고 나서 잘 펴지지 않는 증상에서 myonic dystrophy 임을 추정할 수 있고, 추가적인 소견으로 ‘앞머리 탈모’, ‘측두근과 저작근의 위축’ 등이 관찰되는 특징적인 얼굴 모습이 나타나는 ‘myotonic dystrophy type1’ 임을 알 수 있습니다. 특징적인 얼굴 모습과 근긴장증(myotonia)은 교수님께서 강조하신 부분이니 꼭 외워주세요. DMPK gene과의 관련또한 올해 피마였습니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "연도별 선지 순서가 달라 원래 번호는 2022 ⇒ ③, 2021 ⇒ ①, 2020 ⇒ ①", "img": [], "v": false, "y": [2020, 2021, 2022], "ok": false, "ra": "③"}, {"id": "22-38", "keys": ["22-38"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>55세 여자 환자가 수개월 전부터 발생한 사지 근력 저하를 주소로 내원하 였다. 양 팔을 들어올리기 힘들어 머리를 묶을 수 없으며, 계단을 오를 때 특히 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전부위에서 관찰 되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으 며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었<\/div><div>다. 가장 가능성이 높은 질환은?<\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "얼굴어깨위팔근디스트로피"], "a": 0, "A": "①", "E": "2021년 기출된 내용과 지문은 같고 이번에는 진단을 물어보셨습니다. shawl sign과 사지의 근력저하 손가락 신절부에서의 붉은색 구진으로 피부근염을 의심해야합니다. polymyositis와 감별이 중요합니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "21-43", "keys": ["21-43", "20-37"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>44세 여자환자가 안검 하수 및 사지 근력 저하 주소로 내원하였
