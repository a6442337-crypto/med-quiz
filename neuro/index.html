에 경한 장애소견이 나타났으며, 양측 하지근력 저하가 관찰되었다. 통각, 진동각, 위치각은 정상이었으며, 병적반사는 나타나지 않았으나 DTR이 소실되었다. 뇌자기 공명영상술을 시행하였으나 뇌간, 소뇌에는 비정상적인 음영이 관찰되지 않았다. 뇌척수액 검사 소견상 압력은 150mmH2O, 세포수는 1/mm3, 단백은 75mg/dL의 소견을 보였으며, 혈액 및 뇨검사 등에서 다른 특이 소견은 없었다. 이 환자의 적절한 치료는 다음 중 어느 것인가?<\/div>", "o": ["고용량의 스테로이드 요법", "항바이러스제제 (acyclovir) 투여", "혈전용해술을 시도", "페니실린계의 항생제를 투여", "면역글로불린을 정맥 투여"], "a": 4, "A": "⑤", "E": "2023년 12번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 지문에는 3개월전부터 상하지의 근력이 서서히 저하됐다는 특징, 심부건검사 소실, 탈수초성 소견을 알려줍니다. 같은 탈수초성 질환인 GBS와 비교를 많이 하셨고 가장 큰 차이점은 만성적이라는 점입니다.", "B": "관련 강의: 강의 24 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "⑤"}, {"id": "20-46", "keys": ["20-46"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>60세 여자가 수개월 전부터 발생한 사지 근력저하를 주소로 내원하였다. 양 팔에 힘이 없 어 헤어드라이기 사용이 어려우며, 계단을 오를 때 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전 부위에서 관찰되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었다. 이환자의 일차 치료로 가장 적절한 것은?<\/div>", "o": ["광범위 항생제 투여", "항-바이러스제 (acyclovir)투여", "면역글로블린 정맥 투여", "스테로이드 요법", "인터베론 베타 투여"], "a": 3, "A": "④", "E": "2022년 38번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 2021년 기출된 내용과 지문은 같고 이번에는 진단을 물어보셨습니다. shawl sign과 사지의 근력저하 손가락 신절부에서의 붉은색 구진으로 피부근염을 의심해야합니다. polymyositis와 감별이 중요합니다.", "B": "관련 강의: 강의 24 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "④"}, {"id": "20-53", "keys": ["20-53"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>32세 여성이 최근에 피곤함을 주소로 내원하였다. 오전 보다 오후에 더 피곤하다고 하며, 진찰시 환자는 의자에서 일어나는 것을 힘들어 했고, 왼쪽 눈꺼풀 쳐짐이 있었으며, 시력 검사 시 물체가 두개로 겹쳐 보인다고 호소했다. 이 환자의 진단에 가장 도움이 될 검사는?<\/div>", "o": ["CBC", "TSH Level", "PTH Level", "Ach Rc Antibody Assay", "CPK, Myoglobin"], "a": 3, "A": "④", "E": "2022년 35번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 2021년 기출과 지문내용이 똑같습니다. 눈꺼풀의 쳐짐과 오후로 갈수록 심해지고 자고일어나면 호전된다는 양상으로 중증 근무력증을 의심해야합니다. 중증 근무력증의 기전은 아세틸콜린과 그 수용체간의 작용이 저하된다는 점에 있습니다. 그래서 환자중 Anti acetylcholine receptor antibody가 70-80%정도는 양성이 관찰된다고 합니다. 진단, 증상, 신경학적 진찰, 치료등 전반적인 내용이 전부 출제되는 부분이니 잘 공부해주세요.", "B": "관련 강의: 강의 24 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "④"}, {"id": "20-94", "keys": ["20-94"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>1년전부터 발생한 양측 안검하수 (ptosis)를 주소로 내원한 50세 남자환자로 자고 일어   나면 안검 하수가 거의 없으나 오후가 되면 안검하수가 발생하여 머리를 뒤로 젖혀야    사물이 잘 보인다고한다. 진단에 도움이 되는 검사가 아닌 것은?<\/div>", "o": ["Chest CT", "Edrophonium Chloride test", "Repetitive nerve stimulation (RNS) test", "Single-fiber EMG", "Brain MRI/A"], "a": 4, "A": "⑤", "E": "2022년 35번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 2021년 기출과 지문내용이 똑같습니다. 눈꺼풀의 쳐짐과 오후로 갈수록 심해지고 자고일어나면 호전된다는 양상으로 중증 근무력증을 의심해야합니다. 중증 근무력증의 기전은 아세틸콜린과 그 수용체간의 작용이 저하된다는 점에 있습니다. 그래서 환자중 Anti acetylcholine receptor antibody가 70-80%정도는 양성이 관찰된다고 합니다. 진단, 증상, 신경학적 진찰, 치료등 전반적인 내용이 전부 출제되는 부분이니 잘 공부해주세요.", "B": "관련 강의: 강의 24 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "⑤"}, {"id": "25-01", "keys": ["25-01"], "ch": 12, "g": "뇌종양", "stem": "<div>49세 여자가 시야장애를 주소로 내원하였다. 시야검사, Brain MRI는 다음과 같다. 호르몬 검사상 prolactin 400ng/mL 이상 측정되었으며 다른 호르몬 검사 수치는 정상이었다. 가장 선호되는 치료 방법은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["경과관찰", "방사선치료", "약물치료", "경접형동종양제거술", "방사선수술"], "a": 2, "A": "③", "E": "(정답률 25%) 정지연 교수님께서 해설해주셨습니다. 환자는 bitemporal hemianopsia, 고프로락틴혈증을 보이고 있으므로 pituitary adenoma임을 알 수 있습니다. PRL을 분비하는 pituitary adenoma의 일차 치료법은 약물치료이고, 약물치료에 반응이 없을 때 수술을 고려합니다.", "B": "관련 강의: 강의 27 뇌종양", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-02", "keys": ["25-02"], "ch": 12, "g": "뇌종양", "stem": "<div>우측 위약감 이 있어 검사한 조영 증강 T1 image MRI 에서 가장 의심되는 병명에 대한 설명으로 옳은 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["DTI tractogram 에서 종양 부분의 피의 관류를 확인 한다", "PWI에서 종양과 피질 척수로의 관계를 평가 한다", "MRS에서 NAA/choline 이 감소 한다", "1p/19q 동시 결실이 있다", "IDH 변이가 있으면 생존율이 상대적으로 낮아진다"], "a": 2, "A": "③", "E": "(정답률 76%) 23기출에서 선지가 약간 바뀌었습니다. ① DTI tractogram은 피질 척수로를 보여줍니다. ② PWI는 피의 관류 정도를 평가합니다. ③ MRS는 조직의 대사 정보를 제공하고, 뇌종양에서는 NAA/choline이 감소하는 소견이 나타납니다. ④ 1p/19q 동시 결실이 있는 것은 oligodendrocytoma입니다. 사진의 종양은 glioblastoma로 옳지 않습니다. ⑤ IDH-mutant type인 astrocytoma나 oligodendrocytoma에 비해 IDH 변이가 없는 IDH-wild type인 glioblastoma는 예후가 나쁩니다.", "B": "관련 강의: 강의 27 뇌종양", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-20", "keys": ["23-20"], "ch": 12, "g": "뇌종양", "stem": "<div>우측 위약감 이 있어 검사한 조영 증강 T1 image MRI 에서 가장 의심되는 병명에 대한 설명으로 틀린 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["DTI tractogram 으로 종양과 피질 척수로의 관계를 평가 한다", "PWI에서 종양 부분의 피의 관류가 증가 한다", "MRS에서 NAA/choline 이 감소 한다", "PCV가 효과적인 항암제로 사용 된다", "IDH 변이가 있으면 생존율이 상대적으로 높다"], "a": 4, "A": "⑤", "E": "정답률 61% 올해 추가된 내용에서 출제되었습니다. 신경상피종양이 의심될 때 IDH mutation이 있는지 확인해야 하며, IDH 변이가 있으면, 생존율은 낮아집니다.", "B": "관련 강의: 강의 27 뇌종양", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "25-92", "keys": ["25-92"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>뇌동맥류에 대한 치료 방법에 대한 설명으로, 알맞은 것을 고르시오.<\/div>", "o": ["일반적으로 코일 색전술은 클립 색전술에 비해서 재발율이 낮다.", "경부가 넓은 뇌동맥류는 단순 코일 색전술이 용이하다.", "뇌동맥류에서 동맥 분지가 나오는 경우는 코일 색전술을 우선적으로 고려한다.", "일반적으로 후순환계의 동맥에 발생한 동맥류는 코일 색전술을 우선적으로 고려한다.", "코일 색전술은 다량의 뇌내 출혈이 동반된 경우 혈종 제거가 가능하다."], "a": 3, "A": "④", "E": "23년, 22년과 동일하게 출제되었습니다. 1. 코일 색전술이 재발율이 높습니다. - 오답 2. 경부가 넓은 뇌동맥류는 클립 결찰술을 먼저 고려해야합니다 - 오답 3. 동맥 분지가 나오는 경우 클립 결찰술을 먼저 고려합니다 - 오답 4. MCA와 같이 superficial한 경우 클립결찰술을 쓰고 그 외는 코일 색전술을 우선 고려합니다. 5. 다량의 뇌내 출혈이 동반된 경우 혈종제거가 가능한 것은 클립 결찰술을 통한 개두술입니다 - 오답", "B": "관련 강의: 강의 28 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-96", "keys": ["25-96", "22-46"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>13세 여자 환아로 풍선을 불 때나 뜨거운 음식을 식히려고 입으로 불 때 팔 다리의 일시적인 마비 증상을 주소로 내원하였다. 뇌 MRI 소견과 DSA 영상은 아래와 같다. 상기 환아의 수술적 처치로 알맞은 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["미세 수술적 제거술", "혈관 내 색전술", "정위적 방사선 수술(감마나이프)", "동맥류 클립 결찰술", "간접 재관류 수술"], "a": 4, "A": "⑤", "E": "22년과 동일하게 출제하되었습니다. - 풍선을 불 때나 뜨거운 음식을 식히려고 불 때 (과호흡 유발) 일시적인 마비증상 - “Puff of smoke” (폐색 주위 작은 혈관들이 확장, 연기처럼 보임) → 모야모야병 소아는 안지름이 작아 직접문합이 어렵기 때문에 간접 재관류 수술을 시행합니다.", "B": "관련 강의: 강의 28 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": false, "ra": "⑤"}, {"id": "23-50", "keys": ["23-50", "22-40"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>뇌동맥류에 대한 치료 방법에 대한 설명으로, 알맞은 것을 고르시오.<\/div>", "o": ["코일 색전술은 클립 색전술에 비해서 재발율이 낮다.", "경부가 넓은 뇌동맥류는 단순 코일 색전술이 용이하다.", "뇌동맥류에서 동맥 분지가 나오는 경우는 코일 색전술을 우선적으로 고려한다.", "일반적으로 후순환계의 동맥에 발생한 동맥류는 코일 색전술을 우선적으로 고려 한다.", "코일 색전술은 다량의 뇌내 출혈이 동반된 경우 혈종 제거가 가능하다."], "a": 3, "A": "④", "E": "22년과 동일하게 출제되었습니다. 1. 코일 색전술이 재발율이 높습니다. - 오답 2. 경부가 넓은 뇌동맥류는 클립 결찰술을 먼저 고려해야합니다 - 오답 3. 동맥 분지가 나오는 경우 클립 결찰술을 먼저 고려합니다 - 오답 4. MCA와같이 superficial한 경우 클립결찰술을 쓰고 그 외는 코일 색전술을 우선 고려합니다. 5. 다량의 뇌내 출혈이 동반된 경우 혈종제거가 가능한 것은 클립 결찰술을 통한 개두술입니다 - 오답", "B": "관련 강의: 강의 28 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": false, "ra": "④"}, {"id": "V01", "ch": 0, "base": "25-29", "lv": "minor", "stem": "<div>6개월 여아가 목을 가누지 못하고 팔을 중력에 대항해 들지 못해 병원에 왔다. 누우면 개구리 다리 자세(frog-leg posture)를 보이고 혀에 섬유다발수축(fasciculation)이 있다. 심부건반사는 소실되었고 혈청 CK와 감각신경전도는 정상이다. 이 질환의 원인 유전자는?<\/div>", "o": ["SMN1", "DMD", "PMP22", "DMPK", "NF1"], "a": 0, "E": "개구리 다리 자세, 혀 섬유다발수축, 심부건반사 소실, 정상 CK·감각신경전도는 척수성 근위축증(SMA)으로, 척수 앞뿔 운동신경세포가 소실된다. 원인은 5번 염색체(5q)의 SMN1 유전자 결실이며 MLPA로 확진하고, SMN2 copy 수가 많을수록 증상이 가볍다. DMD는 Duchenne/Becker, PMP22는 Charcot-Marie-Tooth 1A, DMPK는 근긴장디스트로피 1형과 관련된다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "2025년 29번 변형", "vn": "증례 틀은 같고 발문을 '병변 위치'에서 '원인 유전자'로 바꾸고 선지 전부 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V02", "ch": 0, "base": "25-24", "lv": "minor", "stem": "<div>10세 남아가 2개월 전부터 반복되는 두통으로 병원에 왔다. 다음 중 뇌 영상 검사가 필요하다고 판단되는 소견은?<\/div>", "o": ["이마 양쪽의 박동성 두통", "빛과 소리에 의해 두통이 악화됨", "잠을 자고 나면 두통이 좋아짐", "새벽에 두통으로 잠에서 깨고 아침에 구토가 동반됨", "어머니의 편두통 가족력"], "a": 3, "E": "소아 두통의 경고 징후(red flag): 수면 중 깨는 두통, 아침 구토, 점점 심해지는 양상, 국소 신경학적 이상(편측 위약 등), 성격·학업 변화 → 두개내압 상승·종괴를 의심해 영상 검사. 양측 박동성·빛 과민·수면 후 호전·가족력은 편두통에 합당한 소견.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "2025년 24번 변형", "vn": "나이·기간과 정답 소견(손 힘 빠짐 → 새벽 각성·아침 구토)을 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V03", "ch": 1, "base": "25-101", "lv": "minor", "stem": "<div>두개내압 상승으로 의식이 저하된 환자의 두개내압 조절 방법으로 옳은 것은?<\/div>", "o": ["과환기로 PaCO2를 25 mmHg 이하로 수일간 유지한다", "침상 머리를 30도 정도 올리고 목이 꺾이지 않게 한다", "저장성(hypotonic) 수액을 충분히 투여한다", "발열은 뇌대사를 줄이므로 해열하지 않는다", "기도 흡인과 기침 유발 처치를 자주 반복한다"], "a": 1, "E": "26년 강의(ICP control algorithm): 신경계 중환자실에서는 모두 30도 head elevation을 해 jugular venous return을 원활하게 하고 ICP를 낮춘다(②). 과환기는 PaCO2를 32~36 mmHg 정도로 약간만 낮추고 급성기에 일시적으로 하며, 지나치면 뇌혈류가 줄어 hypoxic damage가 생긴다. 저장성 수액은 뇌부종을 악화시키고, 열은 뇌 대사를 늘리므로 오히려 체온을 낮추는 hypothermia가 치료 단계에 들어가며, 잦은 흡인·기침 유발은 ICP를 올린다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "2025년 101번 변형", "vn": "'아닌 것'을 '옳은 것'으로 발문 방향을 바꾸고 선지 수치(PaCO2) 제시", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V04", "ch": 1, "base": "25-105", "lv": "minor", "stem": "<div>다음 중 수두증의 수술적 치료법이 아닌 것은?<\/div>", "o": ["V-P shunt (뇌실-복강 단락술)", "V-pleural shunt (뇌실-흉막 단락술)", "Endoscopic third ventriculostomy", "L-P shunt (요추-복강 단락술)", "척수강 내 baclofen 펌프 삽입술"], "a": 4, "E": "26년 강의(수두증 치료): 수두증은 약물로는 효과가 없고 ETV나 shunt(V-P, V-A, L-P)로 CSF를 다른 체강으로 우회시키는 수술로 치료한다. 뇌실-흉막 단락술도 같은 원리의 shunt다. 척수강 내 baclofen 펌프는 척수강으로 약물을 넣어 강직(spasticity)을 치료하는 장치로 수두증 수술이 아니다(⑤).", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "2025년 105번 변형", "vn": "선지 2개(V-A shunt → V-pleural shunt, 펌프 → baclofen 펌프)와 순서만 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V05", "ch": 2, "base": "25-91", "lv": "minor", "stem": "<div>68세 남자가 5시간 전 갑자기 발생한 왼쪽 팔다리 위약과 구음장애로 응급실에 왔다. 고혈압과 심방세동이 있다. 혈압 160/95 mmHg이며, 뇌 CT에서 출혈은 없고 CT 혈관조영술에서 오른쪽 중대뇌동맥 M1 폐색이 확인되었다. 가장 적절한 치료는?<\/div>", "o": ["만니톨 투여", "아스피린 투여 후 경과관찰", "동맥 내 혈전제거술", "혈압강하제로 수축기혈압 120 mmHg 미만 유지", "뇌 감압술"], "a": 2, "E": "26년 강의(급성 뇌졸중 치료 time line): 정맥 내 tPA는 발생 4.5시간 이내에만 쓸 수 있어 5시간이 지난 이 환자는 대상이 아니다. 그러나 큰 혈관(중대뇌동맥 M1) 폐색이 확인되었으므로 24시간 이내 가능한 동맥 내 혈전제거술(endovascular recanalization)이 적절하다. 급성기에 혈압을 낮추면 측부순환과 반음영(penumbra) 관류가 줄어 경색이 커지고, 만니톨은 효과가 없으며 감압술은 악성 뇌부종이 생겼을 때 고려한다. 아스피린은 재관류 치료 후 재발 예방 약이다.", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "2025년 91번 변형", "vn": "증상 발생 시간(1.5시간→5시간)과 혈관 폐색 정보를 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V06", "ch": 2, "base": "21-03", "lv": "minor", "stem": "<div>급성 세균성 뇌막염이 의심되는 성인 환자의 처치로 옳지 않은 것은?<\/div>", "o": ["CT·MRI 결과가 나오기 전이라도 경험적 항생제를 시작한다", "가능하면 항생제 투여 전에 혈액배양 검체를 채취한다", "경험적 항생제로 3세대 cephalosporin과 vancomycin을 정맥 투여한다", "의식이 회복되는 등 증상이 좋아지면 바로 항생제를 끊는다", "항생제와 함께 초기에 dexamethasone을 쓰면 청력 손실 등 합병증을 줄일 수 있다"], "a": 3, "E": "세균성 수막염이 의심되면 영상·검사 결과를 기다리지 않고, 가능하면 혈액배양 후 바로 3세대 cephalosporin+vancomycin(면역저하·50세 이상이면 ampicillin 추가)을 최대용량 정맥 투여한다. 치료는 보통 10~14일을 채우며 의식이 회복됐다고 바로 끊지 않는다(④가 틀림). 덱사메타손은 첫 항생제 15~20분 전 또는 동시에 4일간 짧게 쓰며, 염증 반응을 줄여 청력 소실 같은 합병증을 예방하는 데 도움이 된다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "2021년 3번 변형", "vn": "'맞는 것'을 '옳지 않은 것'으로 발문을 뒤집고 선지 3개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V07", "ch": 3, "base": "23-31", "lv": "minor", "stem": "<div>고혈압성 뇌내출혈(hypertensive ICH)이 가장 흔하게 발생하는 부위는?<\/div>", "o": ["시상(thalamus)", "소뇌(cerebellum)", "피각(putamen, 기저핵)", "다리뇌(pons)", "대뇌 피질하 엽(lobar)"], "a": 2, "E": "고혈압성 뇌내출혈은 관통동맥(렌즈핵선조체동맥 등) 손상으로 피각(기저핵) > 시상 > 다리뇌·소뇌 순으로 흔하다. 대뇌 피질하 엽 출혈은 노인에서 아밀로이드 혈관병증을 먼저 생각한다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "2023년 31번 변형", "vn": "'호발부위가 아닌 것'을 '가장 흔한 부위'로 바꾸고 선지 일부 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V08", "ch": 3, "base": "23-32", "lv": "minor", "stem": "<div>발생 3시간 된 초급성 뇌경색의 비조영 CT 소견으로 볼 수 없는 것은?<\/div>", "o": ["중대뇌동맥 고밀도 징후(hyperdense MCA sign)", "섬엽 띠(insular ribbon) 소실", "렌즈핵 경계가 불분명해짐", "고리 모양 조영증강(ring enhancement)", "정상 소견"], "a": 3, "E": "초급성 뇌경색 CT는 정상일 수 있고, 조기 소견으로 고밀도 MCA 징후, 섬엽 띠 소실, 렌즈핵 경계 소실, 회백질-백질 경계 소실이 보인다. 고리 모양 조영증강은 농양·종양 소견이며, 경색의 조영증강은 아급성기(수일~수주)의 이랑 모양이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "2023년 32번 변형", "vn": "시간 정보를 넣고 선지 3개(mass effect·hypoattenuation·contrast enhancement)를 다른 조기 소견과 고리 조영증강으로 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V09", "ch": 4, "base": "23-68", "lv": "minor", "stem": "<div>다음 중 척수 경막외 농양(spinal epidural abscess)에 대한 설명으로 틀린 것은?<\/div>", "o": ["당뇨병, 면역저하, 알코올중독, 정맥 약물 사용이 소인이 된다", "골수염이 동반된 경우에도 항생제는 3~4주면 충분하다", "배부통, 발열과 함께 척수 압박에 의한 신경학적 결손이 생길 수 있다", "MRI 조영증강에서 테두리 조영증강을 보이는 경막외 종괴로 보인다", "신경학적 결손이 진행하면 감압·배농 수술을 시행한다"], "a": 1, "E": "항생제 기간은 골수염이 없으면 3~4주, 골수염이 동반되면 6~8주. 소인: 당뇨·만성신부전·면역저하·알코올중독·악성종양·척추 시술. MRI가 진단의 기준이며 T1 조영 시 테두리 조영증강. 신경학적 결손이 진행하거나 크기가 크면 감압·배농.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "2023년 68번 변형", "vn": "틀린 선지를 '골수염 없을 때 6~8주'에서 '골수염 있을 때 3~4주'로 수치 방향만 바꾸고 나머지 선지 표현 변경", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V10", "ch": 5, "base": "25-114", "lv": "minor", "stem": "<div>선천성 기형에서 Chiari 1형 기형을 나타내는 특징을 모두 고르세요.<br>1. 소뇌 편도가 대후두공을 통해 하방으로 전위<br>2. 척수공동증(syringomyelia)이 동반될 수 있음<br>3. 제4뇌실의 낭종성 확장<br>4. 소뇌 충부의 무형성이나 형성 저하<\/div>", "o": ["1, 2", "1, 2, 3", "1, 3, 4", "2, 3, 4", "3, 4"], "a": 0, "E": "Chiari 1형: 소뇌 편도가 대후두공 아래로 내려오고 척수공동증이 흔히 동반된다. 제4뇌실 낭종성 확장과 소뇌 충부 형성 저하는 Dandy-Walker 기형의 특징.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "2025년 114번 변형", "vn": "같은 보기 묶음·선지 형식으로 묻는 질환만 Dandy-Walker에서 Chiari 1형으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V11", "ch": 6, "base": "25-111", "lv": "minor", "stem": "<div>8세 남아가 Lennox-Gastaut 증후군으로 여러 항경련제를 복용하고 있지만 하루에도 수차례 갑자기 힘이 빠지며 넘어지는 무긴장 발작(drop attack)으로 자주 다친다. 이 발작을 줄이기 위해 고려할 수 있는 수술은?<\/div>", "o": ["뇌반구 절제술(hemispherectomy)", "선택적 편도해마 절제술", "전방 측두엽 절제술(anterior temporal lobectomy)", "감마나이프 수술", "뇌량 절제술(corpus callosotomy)"], "a": 4, "E": "Lennox-Gastaut 증후군의 drop attack처럼 양쪽 반구로 퍼지는 전신성 무긴장 발작에는 발작파의 반구 간 전파를 끊는 완화적 뇌량 절개술(corpus callosotomy)이 가장 효과적이다. 측두엽 절제술과 편도해마 절제술은 내측 측두엽 뇌전증의 절제 수술이고, 반구 절제술은 한쪽 반구 전체 병변(Rasmussen 뇌염, Sturge-Weber 등)에 시행하며, Gamma knife는 효과가 아직 확립되지 않았다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "2025년 111번 변형", "vn": "증례(측두엽 뇌전증 성인 → 무긴장 발작 소아)와 정답 수술을 바꾸고 선지 1개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V12", "ch": 10, "base": "25-41", "lv": "minor", "stem": "<div>25세 남자가 오토바이 사고 후 잠시 의식을 잃었다가 깨어나 대화를 하던 중 2시간 뒤 다시 의식이 나빠져 응급실에 왔다. 두부 CT에서 측두부에 볼록 렌즈 모양의 고밀도 음영이 보인다. 이 질환에 대한 설명으로 옳은 것은?<\/div>", "o": ["주로 뇌 표면의 교정정맥(bridging vein)이 찢어져 발생한다", "CT에서 초승달 모양으로 보인다", "의식 명료기(lucid interval)가 있을 수 있다", "급성 경막하출혈보다 예후가 나쁘다", "혈종이 커도 수술보다 보존적 치료를 우선한다"], "a": 2, "E": "급성 경막외출혈: 측두골 골절에 따른 중경막동맥 손상, 볼록 렌즈 모양, 의식 명료기 후 악화가 특징. 빨리 제거하면 예후가 좋다(경막하출혈보다 좋음). 교정정맥 손상·초승달 모양은 경막하출혈.", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "2025년 41번 변형", "vn": "증례를 경막하출혈에서 경막외출혈로 바꾸고 같은 형식의 진술형 선지를 그에 맞게 다시 구성", "img": [], "v": true, "ok": false, "y": []}, {"id": "V13", "ch": 11, "base": "22-34", "lv": "minor", "stem": "<div>45세 여자가 2주 전 심한 설사를 앓은 뒤 5일 전부터 양다리에 힘이 빠지기 시작해 팔까지 진행하였다. 상하지 심부건반사가 소실되었고 감각은 비교적 보존되었다. 뇌척수액 검사에서 세포 3/mm3, 단백 95 mg/dL이었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["중증근무력증", "길랑-바레 증후군", "저칼륨주기마비", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 1, "E": "위장관 감염 후 수일~4주 안에 빠르게 진행하는 상행성 대칭 위약 + 건반사 소실 + 뇌척수액 단백-세포 해리 → 길랑-바레 증후군(치료: IVIG 또는 혈장교환). 같은 소견이 8주 넘게 서서히 진행하면 CIDP.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "2022년 34번 변형", "vn": "진행 기간(3개월 서서히 → 수일 급성)과 선행 감염을 바꿔 정답이 CIDP에서 길랑-바레로 바뀌게 함", "img": [], "v": true, "ok": false, "y": []}, {"id": "V14", "ch": 11, "base": "22-37", "lv": "minor", "stem": "<div>22세 남자가 주먹을 쥔 뒤 잘 펴지지 않는 증상으로 왔다. 측두근·저작근 위축, 앞머리 탈모가 있고 근전도에서 근긴장방전이 보인다. 아버지도 비슷한 증상이 있으나 환자보다 늦게 시작되었다. 이 질환의 유전학적 기전은?<\/div>", "o": ["HTT 유전자의 CAG 반복 확장", "PMP22 유전자 중복", "SMN1 유전자 결실", "DMPK 유전자의 CTG 반복 확장", "Dystrophin 유전자 결실"], "a": 3, "E": "근긴장디스트로피 1형: DMPK 유전자 3' 비번역 부위의 CTG 삼핵산 반복 확장, 상염색체 우성, 대를 거듭할수록 일찍·심하게 나타나는 표현촉진(anticipation). CAG 반복은 헌팅턴병, PMP22 중복은 CMT1A, SMN1 결실은 척수성 근위축증, dystrophin 결실은 뒤센/베커.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "2022년 37번 변형", "vn": "같은 증례에 가족력을 더하고 발문을 '유전자'에서 '유전학적 기전'으로 바꾸고 선지 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V15", "ch": 12, "base": "25-01", "lv": "minor", "stem": "<div>45세 남자가 시야장애로 왔다. 5년 전부터 손발이 커지고 턱이 나왔다고 한다. 시야검사에서 양측두 반맹이 있고 MRI에서 2.5 cm의 뇌하수체 거대샘종이 보이며, 포도당 부하 후에도 GH가 억제되지 않았다. 가장 우선 고려할 치료는?<\/div>", "o": ["경접형동 종양제거술", "경과관찰", "약물치료(bromocriptine)", "방사선치료", "방사선수술"], "a": 0, "E": "GH 분비 샘종(말단비대증)은 경접형동 수술(TSA)로 제거하는 것이 1차 치료이고, 남거나 재발하면 octreotide 등 약물·방사선 치료를 보조로 쓴다. 약물(도파민 작용제)을 1차로 쓰는 것은 프로락틴 분비 샘종.", "B": "관련 강의: 강의 27 뇌종양", "N": "2025년 1번 변형", "vn": "같은 시야장애 증례에서 호르몬(PRL 400 → GH 과다)을 바꿔 정답이 약물치료에서 수술로 바뀌게 함", "img": [], "v": true, "ok": false, "y": []}, {"id": "V16", "ch": 12, "base": "25-02", "lv": "minor", "stem": "<div>오른쪽 위약감으로 시행한 조영증강 MRI에서 가운데가 괴사된 고리 모양 조영증강 종양이 보였고, 수술 후 IDH 야생형 교모세포종으로 진단되었다. 이 종양과 검사에 대한 설명으로 옳은 것은?<\/div>", "o": ["DTI tractogram은 종양의 혈류 관류를 보여준다", "PWI는 종양과 피질척수로의 위치 관계를 보여준다", "MRS에서 NAA/choline 비가 증가한다", "IDH 변이형 성상세포종보다 예후가 나쁘다", "1p/19q 동시 결실이 진단의 필수 소견이다"], "a": 3, "E": "IDH 야생형 교모세포종(WHO 4등급)은 IDH 변이형 성상세포종·핍지교종보다 예후가 나쁘다. DTI는 피질척수로 등 백질 경로, PWI는 관류, MRS는 대사(종양에서 NAA 감소·choline 증가 → NAA/Cho 감소). 1p/19q 동시 결실은 핍지교종의 진단 표지.", "B": "관련 강의: 강의 27 뇌종양", "N": "2025년 2번 변형", "vn": "같은 영상 검사 진술형에서 정답 진술을 MRS에서 IDH 예후로 바꾸고 선지 2개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V17", "ch": 7, "base": "25-61", "lv": "major", "stem": "<div>기억의 종류와 주로 관여하는 뇌 구조를 옳게 짝지은 것을 모두 고르시오.<br>ㄱ. 일화기억 - 해마<br>ㄴ. 절차기억 - 기저핵<br>ㄷ. 공포 조건화 - 편도체<br>ㄹ. 작업기억 - 후두엽<\/div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 1, "E": "일화기억(서술기억)은 해마·내측 측두엽, 절차기억(운동기술·습관)은 기저핵과 소뇌, 조건화 기억은 소뇌(운동 반사 조건화)와 편도체(공포 조건화), 작업기억은 전전두엽이 주로 담당한다. 후두엽은 시각 처리.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "2025년 61번 변형", "vn": "단일 구조를 묻던 형식을 기억 종류-구조 짝짓기 조합형으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V18", "ch": 7, "base": "25-70", "lv": "major", "stem": "<div>78세 여자가 건강검진에서 인지 상태를 물어보았다. 다음 중 정상 노화로 설명하기 어려워 추가 평가가 필요한 소견은?<\/div>", "o": ["정보 처리 속도가 느려졌다", "여러 일을 동시에 기억하며 처리하기 어렵다", "새로 만난 사람의 이름이 바로 떠오르지 않는다", "어휘력과 상식은 예전과 같다", "20년 동안 다니던 동네에서 길을 잃는다"], "a": 4, "E": "정상 노화에서는 처리 속도·작업기억·자유회상이 떨어지지만 어휘(결정성 지능)는 유지된다. 익숙한 곳에서 길을 잃는 것은 시공간 기능·일상 기능 저하로 치매(알츠하이머병 등)를 의심해 평가해야 한다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "2025년 70번 변형", "vn": "'떨어지지 않는 인지영역'을 묻던 개념형을 노인 증례에서 '비정상 소견'을 고르는 형식으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V19", "ch": 8, "base": "25-46", "lv": "major", "stem": "<div>30세 남자가 유리에 손목을 베여 정중신경이 완전히 절단되었다. 2주 뒤 절단부보다 원위부 신경을 조직검사했을 때 예상되는 소견은?<\/div>", "o": ["절단부 근위부 축삭 전체가 세포체까지 소실된다", "신경세포체가 즉시 괴사해 사라진다", "원위부 축삭과 수초가 분절되고 대식세포가 이를 탐식한다", "수초만 선택적으로 소실되고 축삭은 보존된다", "중추신경보다 재생이 불량해 재생 시도가 보이지 않는다"], "a": 2, "E": "정중신경이 완전히 절단되면 절단부 원위부에서 Wallerian degeneration이 일어나 축삭과 수초가 분절·변성되고 대식세포가 수초 잔해를 탐식한다. 근위부는 가장 가까운 랑비에 결절까지만 변성되고(①), 세포체는 central chromatolysis를 보일 뿐 즉시 죽지 않는다(②). 수초만 선택적으로 소실되는 것은 탈수초 질환이며(④), 말초신경은 슈반세포 덕분에 중추신경보다 재생이 잘 된다(⑤).", "B": "26 학습부 15번(검안) · 신경 병리", "N": "2025년 46번 변형", "vn": "개념 진술형을 신경 절단 증례의 조직 소견을 묻는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V20", "ch": 8, "base": "25-48", "lv": "major", "stem": "<div>12세 남아가 2년 전부터 계단 오르기가 힘들다. 종아리가 굵고 단단하며 아직 혼자 걸을 수 있다. 혈청 CK는 4,500 U/L이고, 근육생검의 dystrophin 면역염색에서 염색이 약하고 불규칙하게 보였다. 가장 가능성이 높은 진단은?<\/div>", "o": ["뒤센 근디스트로피", "근긴장디스트로피", "척수성 근위축증", "다발근염", "베커 근디스트로피"], "a": 4, "E": "서서히 진행하는 근위부 근력 약화, 종아리 가성 비대, CK 상승에 dystrophin 면역염색이 약하고 불규칙하게 보이며 12세에도 보행이 가능하면 Becker 근디스트로피다(dystrophin 감소·비정상 형태). Duchenne은 dystrophin이 완전히 없어 염색되지 않고 5세 전 발병, 10~12세경 휠체어에 의존한다. SMA는 신경원성 위축, 다발근염은 염증성 근병증이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "2025년 48번 변형", "vn": "병리 진술형을 증례와 면역염색 소견으로 진단하는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V21", "ch": 9, "base": "25-07", "lv": "major", "stem": "<div>55세 남자가 걸을 때 몸통이 흔들리고 다리를 넓게 벌려 걷는다. 앉은 자세에서도 몸통이 흔들리지만, 손가락-코 검사와 발꿈치-정강이 검사는 양쪽 모두 정상이다. 병변 위치로 가장 가능성이 높은 곳은?<\/div>", "o": ["오른쪽 소뇌반구", "왼쪽 소뇌반구", "소뇌 충부(vermis)", "오른쪽 전두엽", "왼쪽 두정엽"], "a": 2, "E": "소뇌 정중부(충부)는 주로 평형(equilibrium)과 몸통 조절을 담당해, 손상되면 앉거나 서 있을 때 몸통이 흔들리고 다리를 넓게 벌려 걷는 실조보행이 나타나지만 손가락-코·발꿈치-정강이 검사 같은 사지 협조운동은 비교적 보존된다. 소뇌반구 병변은 같은 쪽 사지의 겨냥이상·의도떨림을, 전두엽·두정엽 병변은 반대쪽 증상을 일으킨다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 / 16번(검안) · 운동장애", "N": "2025년 7번 변형", "vn": "사지 실조 증례(반구 병변)를 체간 실조 증례(충부 병변)로 바꾸고 선지 일부 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V22", "ch": 9, "base": "25-11", "lv": "major", "stem": "<div>67세 남자가 의식저하로 왔다. 통증 자극을 주면 양팔은 굽히고 손목을 안으로 말며, 양다리는 쭉 편다. 병변 위치로 가장 합당한 곳은?<\/div>", "o": ["적핵(red nucleus)보다 위쪽(대뇌반구·속섬유막)", "다리뇌 하부", "연수", "경수 척수", "소뇌"], "a": 0, "E": "상지 굽힘·손목 엎침, 하지 폄 자세는 피질제거경축(decorticate)으로, 대뇌반구 또는 사이뇌 등 적핵보다 위쪽 병변에서 rubrospinal tract이 남아 상지 굽힘이 우세해진 것이다. 중뇌~상부 pons까지 내려가면 rubrospinal tract이 소실되어 사지 모두 폄인 대뇌제거경축이 되고, pons 이하 병변에서는 사지가 늘어진다(flaccid).", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "2025년 11번 변형", "vn": "전도로 이름을 묻던 개념형을 자세 증례로 병변 위치를 찾는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V23", "ch": 9, "base": "25-13", "lv": "major", "stem": "<div>뇌간 망상체를 침범한 병변에서 나타나기 어려운 증상은?<\/div>", "o": ["의식 저하", "근긴장도 변화", "수면-각성 주기 장애", "통증 조절 이상", "사지의 협조운동 장애(겨냥이상)"], "a": 4, "E": "뇌간 망상체는 상행 망상체 활성계로 의식·각성과 수면-각성에 가장 깊게 관여하고, reticulospinal tract으로 근긴장도·자세에, 그 밖에 통증 조절과 자율신경 기능에도 관여한다. 사지의 겨냥이상 같은 협조운동 장애는 소뇌(반구) 병변의 증상이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 / 16번(검안) · 운동장애", "N": "2025년 13번 변형 · 통증 조절·수면-각성 관여는 강의 18 검안에 덧붙은 그물체 기능 자료로 확인", "vn": "'관여하는 기능이 아닌 것'을 '병변 시 나타나기 어려운 증상'으로 바꿔 증상 중심으로 재구성", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}], "trends": {"updated": "2026-11-21", "sources": "선배들의 과목설명회(2025년 수강 기준), 2025년 수업 기록, 2020~2025 복원 기출의 연도별 비교를 종합했습니다.", "summary": ["양이 많고 주관식 비중이 커서 학습 부담이 큰 과목입니다. 2025년에는 시험을 한 번(1Q·2Q 분리 없이) 봤고, 주관식 스펠링은 사소한 실수면 인정해 준 사례가 있었습니다.", "대부분의 교수님이 기출을 그대로 또는 조금 바꿔 다시 내고, 수업 중 \"중요하다·시험에 낸다\"고 강조한 부분에서 새 문제를 냅니다. 새로 맡으신 파트나 새로 추가된 슬라이드에서는 처음 보는 문제가 나옵니다.", "2026년 바뀐 점: 봉정빈 교수님이 두통·척수/말초신경·근접합부/근육·탈수초/독성대사성질환을 다시 맡으십니다(2025년에는 정지연 교수님이 대신 강의). 두개내압·수두증은 김학성 교수님, 두부·척추 외상은 서종훈 교수님, 선천성 질환은 김치호 교수님이 이어서 맡으십니다.", "공부 순서 추천: ① 교수님별 기출 → ② 수업 중 강조 부분 → ③ 새로 추가된 강의안 내용. 아래 '연도 비교'는 이 사이트의 기출을 연도별로 비교한 결과입니다."], "profs": [{"prof": "안지예", "lectures": "강의 01·02·08·17", "points": ["2021년부터 담당. 강의안이 깔끔하고 강조 부분이 확실해서 수업을 듣는 것이 가장 효율적인 파트로 꼽힙니다.", "시간당 3문제 정도, 영역별로 골고루 출제한다고 하셨습니다(2025년 기준). 2026년 강의 02 수업 기록에는 시간당 2문제로 이 강의에서 4문제 정도(2025년: 신경피부증후군 2·중추신경계 감염 1·소아 두통 1)가 나올 것으로 적혀 있습니다. 강의 01 수업에서도 수업당 2문제를 낸다고 하셨고, 요추천자 금기사항과 뇌척수액 정상 수치가 시험에 많이 나온다며 꼭 기억하라고 하셨습니다. 기출 반복·변형과 강조 부분의 새 문제가 섞여 나옵니다.", "수치까지 정확히 외우는 것이 좋고, 용어·선지는 소아과학 교과서(홍창의) 기준입니다. 병변 위치를 찾는 문제가 자주 나옵니다. 신경피부증후군 세 질환(신경섬유종증 1형·결절성 경화증·Sturge-Weber)의 구분과, 세균성 수막염 항생제의 신생아/신생아 이후(생후 1개월) 구분이 중요합니다.", "2026년 강의 17 수업 기록에는 이 강의 범위에서 4문제를 내고, 한 문제만 낸다면 Duchenne 근디스트로피에서 내겠다고 강조하신 것으로 적혀 있습니다. 최근 2년 연속 X-연관 열성 유전 확률 계산 문제가 나왔습니다."]}, {"prof": "김학성", "lectures": "강의 03·11", "points": ["2023년부터 담당. 수업이 짧고 강조할 내용만 다뤄 강조 부분이 확실합니다. 기출과 강조 부분에서 출제합니다. 2025년 문항은 2023년과 같게 나와 2023년 이후 기출을 우선 보는 것이 좋습니다.", "GCS, 뇌신경 12쌍의 기능, 시야결손 부위, 피질제거·대뇌제거 경축(적핵 기준)을 강조하셨습니다. 2026년 강의 03에서는 중추성/말초성 안면마비(이마 주름 대칭 여부), 동안신경 마비와 후교통동맥 동맥류도 다시 강조하셨고, 새로 넣은 추체로·추체외로 슬라이드는 시험에 내지 않는다고 하셨습니다.", "두개내압·수두증은 이전 담당 교수님 강의안을 그대로 쓰고 강조 부분도 같아서, 그 기출(대부분 반복 출제)과 마지막 take home message를 보면 됩니다.", "2026년 강의 11 수업 기록에는 이 범위에서 6문제를 내고, Monro-Kellie doctrine은 주관식, 뇌척수액 순환 경로는 빈칸 채우기로 내겠다고 하신 것으로 적혀 있습니다(2025년에도 이 범위에서 6문제)."]}, {"prof": "안성환", "lectures": "강의 04·05·14", "points": ["객관식은 기출을 많이 반복하지만, 증례를 바꾸거나 논문 그래프 해석 같은 새 형식도 냅니다.", "주관식이 까다롭습니다. 정확한 용어와 풀 스펠링을 요구한 사례가 있습니다(VDRL 풀네임, 14-3-3, 'malignant' cerebral edema).", "감염 파트는 기출 반복이 많습니다. 증례를 보고 병변 위치와 증상을 감별하는 연습을 하세요.", "2026년 강의 05 수업 기록에는 2025년 기출 78~84·91번이 이 강의에서 나왔고, 수업하지 않은 내용이라도 예전 기출에 나왔으면 다시 낼 수 있다고 적혀 있습니다. 급성기 치료 순서(정맥 혈전용해 4.5시간 → 혈전제거술 24시간 → 감압술 48시간)와 2차 예방 약 선택(심방세동·좌심방 혈전은 항응고제, TIA는 즉시 아스피린)을 기출로 정리해 두세요.", "2026년 강의 14(감염)는 새로 만든 강의안으로 진행했고, 2025년 이 범위 기출은 85~90번 6문제로 대체로 강조 내용에서 나왔습니다."]}, {"prof": "김현철", "lectures": "강의 06", "points": ["\"외우라고 한 곳에서 낸다\"고 하셨고, 영상 판독보다 암기형 문제가 대부분입니다.", "뇌내출혈 시기별 MRI 신호 변화는 매년 나옵니다. 수업 중 강조한 영상 소견을 눈에 익혀 두세요.", "2023년에는 6문제 중 2문제가 새 문제였는데, 모두 수업 중 강조한 부분에서 나왔습니다.", "2026년 강의 06은 2025년과 크게 바뀌지 않았습니다. Hounsfield 수치는 실습·인턴 때 꼭 필요하니 외우라고 하면서도 이번 시험에는 내지 않는다고 하셨고, 뇌내출혈 시기별 MRI 신호(T1/T2)는 다시 크게 강조하셨습니다."]}, {"prof": "김비오", "lectures": "강의 07", "points": ["2020년부터 담당. 쉽고 반복되는 개념 위주로 출제합니다. \"강조한 부분에서, 기존 기출을 약간만 틀어서 냈다\"고 하셨습니다.", "변형 방식은 발문 뒤집기(틀린 것→옳은 것)와 증례 수치·선지 일부 교체입니다(2023 #66 → 2025 #43).", "\"책 위주로 보고 슬라이드는 참고만\"이라고 하셨습니다. 기출 내용을 정확히 암기하면 됩니다.", "2026년 강의 07은 약 30분으로 짧았고, 수업 전후로 '중요한 부분은 정해져 있다, 시험은 기출을 보라'고 하셨습니다. 척추 경막외 농양의 항생제 기간(골수염 없으면 3~4주, 있으면 6~8주)과 수술 후 감염 위험요인(스테로이드·당뇨·비만·영양결핍·면역저하)이 반복해서 나옵니다."]}, {"prof": "김치호", "lectures": "강의 09", "points": ["2024년부터 담당(이전 주창일 교수님 파트). 수업이 짧고 강조점이 뚜렷하지 않지만, 시험은 이전 교수님 기출을 그대로 따랐습니다.", "이전 기출을 꼭 풀고, 설명하신 선천 기형의 특징적인 사진을 기억해 두세요.", "2026년 강의 09에서도 Chiari 기형(감압 수술), Dandy-Walker 기형의 세 가지 특징, 신경관 형성 단계별 기형을 다시 다루셨습니다. 2025년 두 문항은 정답률이 매우 높았던 기출 반복 문제였습니다."]}, {"prof": "주창일", "lectures": "강의 10·21", "points": ["경련성 질환의 수술적 치료는 주관식까지 기출을 많이 반복합니다.", "양성 척추질환은 2025년에 처음 맡으셨고(이전 이승명 교수님 파트), 개념을 이해했는지 묻는 새 문제를 냈습니다. 2026년에는 2025년 문제를 비슷하게 또는 조금 바꿔 낼 가능성이 높습니다.", "내시경 수술에 관심이 많아 수업에서 비중 있게 다루십니다.", "2026년 강의 10 수업 기록에는 '크게 중요한 영역은 아니니 편하게 들으라'고 하셨고, 수업 중 강조 부분이 예전 기출과 거의 겹친다고 적혀 있습니다. 수술 대상 기준, 측두엽 뇌전증 → 전방 측두엽 절제술, Lennox-Gastaut 증후군 → 뇌량 절개술이 매년 나옵니다."]}, {"prof": "김후원", "lectures": "강의 12·13·20", "points": ["강의가 난해하고 강조가 적은 편이지만, 기출을 변형해서 내고 지나가듯 언급한 부분에서도 주관식을 냅니다(예: 펜싱 자세, 치매 예방 연구, ARIA).", "새로 추가된 슬라이드에서 강조 문제가 나왔습니다(예: 알츠하이머 혈액검사 p-Tau217).", "신경계 구조와 기능은 뒷부분의 뇌 영역에서 주로 냅니다. 강의안 구석구석을 보는 것이 교과서보다 낫다는 평입니다.", "2026년 강의 13 수업 기록에 따르면 2025년 이 범위 6문제(64~69번)는 수업 중 강조점과 겹치지 않았습니다. 강의 자료 전반을 고르게 보고, 새로 추가된 슬라이드와 '모두 다' 선지에 주의하세요."]}, {"prof": "임성철", "lectures": "강의 15", "points": ["기출을 그대로 내기보다 조금씩 바꿔 내서, 관련 내용을 이해해야 풀 수 있습니다.", "수업 마지막에 단골 문제와 자주 나오는 함정을 짚어 주셨습니다. 그 부분과 강조 부분을 챙기세요.", "2026년 강의 15는 2025년과 거의 같았고 새 내용은 ALS의 TDP-43 분자병리입니다. 2025년 이 범위에서는 객관식 4문제·주관식 2문제가 나왔습니다."]}, {"prof": "김진호", "lectures": "강의 16·18·19", "points": ["기출을 반복하면서도 한동안 안 내던 오래된 기출을 다시 가져오는 경향이 있습니다. 오래된 기출까지 보세요.", "수업에서 다루지 않은 신경해부(교과서)에서 새 문제를 내기도 했고, 같은 개념의 정답 표현을 바꾼 사례가 있습니다(체인-스토크스 호흡: 사이뇌 → forebrain).", "운동이상은 수업 동영상의 특징적인 움직임을 정리해 두면 좋습니다.", "2026년 강의 16은 앞부분 슬라이드 몇 장만 새로 추가되었고, 떨림 종류별(본태성·파킨슨) 차이, sensory trick, 무도증의 특징, PSP의 하방 주시 마비, 윌슨병 선별을 반복 강조하셨습니다. 강의 18은 혼수 위주로 강의하고 신경학적 검사는 영상으로 대신했습니다(2025년: 혼수 6·신경학적 검사 3문제). GCS 최저점, 호흡 패턴별 병터, 경축 자세 차이를 강조하셨습니다."]}, {"prof": "서종훈", "lectures": "강의 22", "points": ["2024년부터 담당. 이전 교수님 강의안과 거의 같아 시험도 이전 기출과 비슷하게 나왔습니다.", "강의안 밑줄 부분을 강조하십니다. 주관식에서 강의안의 숫자를 그대로 물은 사례가 있습니다(척추뼈 개수).", "경막외출혈 사진과 수술을 묻는 문제가 나왔으니, 경막하출혈의 사진과 수술도 함께 보세요."]}, {"prof": "봉정빈", "lectures": "강의 23·24·25·26", "points": ["강조가 확실한 교수님입니다. \"시험에 낸다\"고 강조한 부분에서 출제해 정답률이 높았습니다.", "길랑-바레 증후군은 매년 비슷한 선지로 나옵니다. 수업 초반 척수 해부와 관련 질환, 손목터널증후군도 출제됐습니다.", "2025년에는 대신 강의한 교수님도 봉정빈 교수님 기출을 그대로 냈으니, 2022·2023년 기출을 우선 보세요."]}, {"prof": "김종규", "lectures": "강의 27", "points": ["수업에서는 \"몰라도 된다\"고 하시지만 시험은 꼼꼼히 냅니다. 조금씩 새 문제를 넣는 경향이 있습니다(약물 이름 주관식 첫 출제).", "뇌하수체 샘종: 프로락틴 분비 샘종은 시야장애가 있어도 약물이 1차, 프로락틴이 낮고 시야장애면 수술. 2023·2025년에 이 차이를 물었습니다."]}, {"prof": "김재호", "lectures": "강의 28", "points": ["2022년부터 담당. 강의안에 별표한 부분에서 해마다 거의 같은 문제를 냅니다(객관식 3·주관식 2).", "쉽게 출제하시니 지엽적인 내용보다 굵직한 내용과 기출 위주로 공부하면 됩니다."]}]}}</script>
<script>/* 이 과목은 자동 생성 문항이 없습니다 */</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);const M=D.meta;
const CIR='①②③④⑤⑥⑦';const K=k=>M.slug+'_'+k;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(K(k)))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}};
/* 기존 내분비 사이트의 오답노트(endo_wrong) 이어받기 */
if(M.slug==='endo'){try{for(const k of['wrong','wrong_dyn','mix'])if(localStorage.getItem('endo_'+k)!==null&&localStorage.getItem(K(k))===null)localStorage.setItem(K(k),localStorage.getItem('endo_'+k))}catch(e){}}
let wrong=new Set(LS.get('wrong',[]));let wdyn=LS.get('wrong_dyn',{});
const YEARS=[...new Set(D.q.flatMap(x=>x.y||[]))].sort((a,b)=>b-a);
const st={chs:new Set(M.ch.map(c=>c.id)),yrs:new Set(YEARS),kind:'all',order:'shuffle',n:20,mix:LS.get('mix',true)};
let run=null;
const $=s=>document.querySelector(s);const app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE=Object.fromEntries(M.ch.map(c=>[c.id,c.mode]));
const MODEL={repeat:'반복',minor:'소폭 변형',major:'대폭 변형'};
const LVL={minor:'소폭 변형',major:'대폭 변형'};
const isVary=m=>m==='minor'||m==='major';
const byId=Object.fromEntries(D.q.map(x=>[x.id,x]));
/* 변형 문항의 연도 = 원본 문항의 연도 */
const yrsOf=x=>x.v?((byId[x.base]||{}).y||[]):(x.y||[]);
function pool(){let q=D.q.filter(x=>st.chs.has(x.ch));
 if(st.yrs.size<YEARS.length)q=q.filter(x=>yrsOf(x).some(y=>st.yrs.has(y)));
 if(st.kind==='past')q=q.filter(x=>!x.v);if(st.kind==='var')q=q.filter(x=>x.v);
 if(st.kind==='wrong')q=q.filter(x=>wrong.has(x.id)).concat(Object.values(wdyn).filter(x=>st.chs.has(x.ch)));return q}
const varyChs=()=>new Set([...st.chs].filter(c=>isVary(MODE[c])));
const hasGen=typeof dynamicQs==='function';
function build(){const p=pool();let q=st.order==='shuffle'?shuffle(p):p.slice();
 const dynOK=hasGen&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size;
 if(!dynOK){if(st.n)q=q.slice(0,st.n);return q}
 const total=st.n||(st.kind==='var'?q.length+30:q.length+40);
 const k=Math.max(st.kind==='var'?Math.ceil(total/2):Math.round(total*0.25),total-q.length);
 const dyn=dynamicQs(varyChs(),k);q=q.slice(0,total-dyn.length).concat(dyn);
 return st.order==='shuffle'?shuffle(q):q.sort((a,b)=>a.ch-b.ch)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 과목·교수님별 경향 분석 (data/<slug>/trends.json → D.trends). 교수님 순서는 파트 순서를 따른다 */
function trendsHtml(){const T=D.trends;if(!T)return'';
 const byP=Object.fromEntries((T.profs||[]).map(p=>[p.prof,p]));
 const profs=[...new Set(M.ch.map(c=>c.prof))].filter(p=>byP[p]);
 const cmp=p=>M.ch.filter(c=>c.prof===p).map(c=>`${MODEL[c.mode]||c.mode} — ${c.why||''}`)[0]||'';
 return `<div class="panel tr"><h2>과목·교수님별 경향 분석</h2><div class="src">${esc(T.sources||'')}${T.updated?` (${esc(T.updated)} 정리)`:''}</div>
 <ul>${(T.summary||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
 ${profs.map(p=>{const x=byP[p];const md=M.ch.find(c=>c.prof===p);return `<details><summary>${esc(p)} 교수님 <small>${esc(x.lectures||'')} · <span class="md ${isVary(md.mode)?'vary':''}">${MODEL[md.mode]||md.mode}</span></small></summary>
 <ul>${(x.points||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="cmp">연도 비교: ${esc(cmp(p))}</div></details>`}).join('')}</div>`}
function home(){
 const p=pool();const nv=D.q.filter(x=>x.v).length;
 const rep=M.ch.filter(c=>c.mode==='repeat').map(c=>c.prof);const unv=D.q.filter(x=>!x.ok).length,dr=D.q.filter(x=>x.ok&&x.vb==='초안').length;
 app.innerHTML=`${unv?`<div class="warn"><b>미검증</b> 문항 ${unv}개: 2026년 강의 자료가 아직 없어 복원 해설의 답을 그대로 실었습니다. 강의 자료가 올라오면 다시 검증합니다.</div>`:''}${dr?`<div class="warn" style="border-color:#3b6fb6;background:#eef3fb"><b>초안으로 검증됨</b> 문항 ${dr}개: 검안본이 올라오면 다시 확인합니다.</div>`:''}<div class="panel"><div class="lbl">파트 (2026 담당)</div><div class="row" id="chs">
 <button class="chip ${st.chs.size===M.ch.length?'on':''}" data-all>전체</button>${M.ch.map(c=>`<button class="chip ${st.chs.has(c.id)?'on':''}" data-c="${c.id}" title="${esc(c.why||'')}">${esc(c.title.replace(/^[^.]+\.\s*/,''))} · ${esc(c.prof)} <small class="md ${isVary(c.mode)?'vary':''}">${MODEL[c.mode]||c.mode}</small></button>`).join('')}</div>
 ${YEARS.length>1?`<div class="lbl">출제 연도</div><div class="row">${YEARS.map(y=>`<button class="chip ${st.yrs.has(y)?'on':''}" data-y="${y}">${y}</button>`).join('')}</div>`:''}
 <div class="lbl">문제 종류</div><div class="row" id="kind">${[['all','기출+변형'],['past','기출(원본)만'],...(nv||hasGen?[['var','변형만']]:[]),['wrong',`오답노트 (${wrong.size+Object.keys(wdyn).length})`]].map(([k,t])=>`<button class="chip ${st.kind===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
 <div class="lbl">순서 · 문항 수</div><div class="row" id="ord">${[['shuffle','무작위'],['seq','문제집 순서']].map(([k,t])=>`<button class="chip ${st.order===k?'on':''}" data-o="${k}">${t}</button>`).join('')}
 <span style="width:12px"></span>${[10,20,50,0].map(n=>`<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n||'전부'}</button>`).join('')}</div>
 <div class="lbl">선지 순서</div><div class="row">${[[true,'섞기'],[false,'원래 순서']].map(([k,t])=>`<button class="chip ${st.mix===k?'on':''}" data-m="${k}">${t}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px;justify-content:space-between"><span class="small">선택된 고정 문항 ${p.length}개${hasGen&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size?' + 매번 새로 만드는 변형 문항':''}</span><button class="go" id="start" ${p.length?'':'disabled'}>시작</button></div></div>
 <div class="panel small">${rep.length?`<b>반복</b> 표시 교수님(${esc([...new Set(rep)].join('·'))})은 해마다 같은 문항을 거의 그대로 내셔서 기출만 나옵니다. `:''}<b>소폭 변형</b> 표시 교수님은 보기·수치·발문만 바꿔 내시고, <b>대폭 변형</b> 표시 교수님은 같은 개념을 다른 증례나 형식으로 내셔서, 그 수준에 맞춘 예상 변형 문항을 함께 실었습니다.<br>기출 문항의 연도 태그는 같은 선지·정답으로 출제된 해를 모두 표시합니다. 보라색 <b style="color:var(--var)">변형</b> 문항은 기출을 바탕으로 만든 예상 문제이고, 원본 문항 번호를 함께 표시합니다. 틀린 문제는 이 브라우저의 오답노트에 저장됩니다.</div>${trendsHtml()}`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(st.chs.size===M.ch.length){st.chs=new Set([c])}else{st.chs.has(c)?st.chs.delete(c):st.chs.add(c);if(!st.chs.size)st.chs=new Set(M.ch.map(c=>c.id))}home()});
 app.querySelector('[data-all]').onclick=()=>{st.chs=new Set(M.ch.map(c=>c.id));home()};
 app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y;if(st.yrs.size===YEARS.length){st.yrs=new Set([y])}else{st.yrs.has(y)?st.yrs.delete(y):st.yrs.add(y);if(!st.yrs.size)st.yrs=new Set(YEARS)}home()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.order=b.dataset.o;home()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mix=b.dataset.m==='true';LS.set('mix',st.mix);home()});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
 $('#start').onclick=()=>{run={q:build(),i:0,ans:{}};show()};
}
function baseTag(x){const b=byId[x.base];return b?`원본 ${b.keys.map(k=>`20${k.slice(0,2)} #${k.slice(3).replace('-1','')}`).join(', ')}`:(x.N||'')}
/* 검증 표시: ok=false → 미검증, vb='초안'|'검안' → 그 자료로 검증, vb 없음(옛 데이터) → 검증 */
const VL=x=>x.ok===false?'미검증':(x.vb?x.vb+'으로 검증됨':'검증됨');
function tags(x){const u=`<span class="${x.ok===false?'u':(x.vb==='초안'?'k1':'k2')}">${x.ok===false?'미검증':(x.vb?x.vb+' 검증':'검증')}</span>`;
 if(x.v)return `<span class="v">변형${x.lv?' · '+(LVL[x.lv]||x.lv):''}</span>${u}<span class="g">${esc(x.dyn?x.N:baseTag(x))}</span>`;
 return x.keys.map(k=>`<span>20${k.slice(0,2)} #${k.slice(3).replace('-1','')}</span>`).join('')+'<span class="y">원본</span>'+u+`<span class="g">${esc(x.g)}</span>`}
function show(){
 const x=run.q[run.i],a=run.ans[x.id];const done=a!==undefined;
 if(!run.perm)run.perm={};if(!run.perm[x.id])run.perm[x.id]=st.mix?shuffle(x.o.map((_,i)=>i)):x.o.map((_,i)=>i);
 const P=run.perm[x.id],moved=P.some((v,i)=>v!==i);
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${Object.entries(run.ans).filter(([id,v])=>v===run.q.find(q=>q.id===id).a).length}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div>${P.map((i,pos)=>`<button class="opt ${done?(i===x.a?'ok':(i===a?'bad':'')):''}" data-i="${i}" ${done?'disabled':''}><b>${CIR[pos]}</b>${esc(x.o[i])}${done&&moved?`<span class="orig">원래 ${CIR[i]}</span>`:''}</button>`).join('')}</div>
 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'맞았습니다':'틀렸습니다'} · 정답 ${CIR[P.indexOf(x.a)]}${moved?` <span class="origh">(원래 번호 ${x.v?CIR[x.a]:esc(x.A)} · 해설의 선지 번호는 원래 순서 기준)</span>`:(x.v?'':(x.A&&x.A.length>1?` <span class="origh">${esc(x.A)}</span>`:''))}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.v&&!x.dyn&&x.N?`<div class="lv">${esc(x.N)}</div>`:''}${x.ok===false?'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>':(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':''))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(x.dyn){if(i===x.a)delete wdyn[x.id];else wdyn[x.id]=x;LS.set('wrong_dyn',wdyn)}else{if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>run.ans[x.id]===x.a);const bad=run.q.filter(x=>run.ans[x.id]!==x.a);
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="again">같은 설정으로 새로 풀기</button> ${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</span></div></div>`;
 $('#home').onclick=home;$('#again').onclick=()=>{run={q:build(),i:0,ans:{}};show();scrollTo(0,0)};
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
