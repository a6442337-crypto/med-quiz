 찍었다고 하는데 정지연 교수님이 김후원 교수님께 여쭤보니 “고령에서 여러 퇴행성 뇌질환이나 뇌졸중으로 인한 뇌손상 병력이 올라가기 때문에 뇌전증의 빈도가 더 높은건 맞지만 고령화 자체가 뇌전증의 유병률을 높이는게 아니기 때문”에 오답이라고 하셨답니다. 정지연 교수님도 해설하시면서 어이없어 하시는 느낌 14퍼 중에 5번을 확신하고 찍은 사람들이 얼마나 있을까 싶은데 관련이론에 그림 2-11을 보면 만성활동뇌전증에서 약물내성뇌전증으로 발전하는 비율이 30퍼, 뇌전증이 완화되는 비율이 70퍼이고 70퍼 중에 20퍼는 재발하는 것으로 보아 ‘반 정도는 치료되는 편이다’라고 볼 수 있을 것 같습니다. ① 전세계 공통적으로 뇌전증은 나타나며 인종, 국가, 사회환경에 관계없이 비슷하게 발병된다 (X) \"유병율 4-10/1000명, 저개발국가가 더 높다. (maximum 1% / 저개발국가 1%, 선진국 0.5%)\"라고 명시되어 있습니다. 이는 저개발국가가 선진국보다 유병률이 약 2배 높아 국가 및 사회 환경에 따라 발병률이 다르다는 것을 명확히 보여줍니다. ② 저개발 국가는 노년층이 선진국은 젊은 연령에서 빈도가 높다 (X) \"저개발국가는 젊은 층에서 선진국은 노년층에 많다\"고 명시되어 있습니다. ④ 뇌전증 환자는 일반인에 비해 사망률이 그다지 높지 않다 (X) 근거 자료 (그림 2-9): 대부분의 경우 SMR(표준화 사망비)이 1 이상입니다. age at diagnosis와 disease duration이 낮을수록 사망률이 높고 시간이 지나더라도 뇌전증 환자는 여전히 일반인 대비 사망률이 1.2~1.5배 가량 높습니다. 따라서 '그다지 높지 않다'는 진술은 틀린 설명입니다.", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-66", "keys": ["25-66"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌세포의 활성도가 증가하는 게 기본적인 뇌전증의 발병 기전으로 생각되는데 신경세포의 흥분도 증가를 일으키는 신경전달 물질은?<\/div>", "o": ["글루타메이트", "가바 (GABA)", "도파민", "세로토닌", "엔돌핀"], "a": 0, "A": "①", "E": "어렵지 않은 문제입니다. neurotransmitter를 두 개만 기억하라 하면 glutamate와 GABA인데 이 중에 흥분성이 glutamate, 억제성이 GABA입니다. ① 글루타메이트 (Glutamate) 글루타메이트는 중추신경계에서 가장 주요한 흥분성 신경전달물질입니다. 뇌전증과의 관계: 뇌전증 발작은 글루타메이트의 과도한 분비나, 글루타메이트 수용체의 과활성화로 인해 신경 세포의 흥분도가 비정상적으로 높아질 때 발생할 수 있습니다. ② 가바 (GABA, Gamma-Aminobutyric Acid): 뇌에서 가장 주요한 억제성 신경전달물질입니다. GABA의 작용이 감소하거나 기능이 약해지면 뇌의 흥분도가 높아져 뇌전증 발작을 유발할 수 있습니다. 대부분의 항경련제는 GABA 기능을 강화하여 흥분을 억제하는 방식으로 작용합니다. ③ 도파민 (Dopamine): 운동 조절, 보상, 동기 부여 등과 관련되며, 뇌전증 발작과 직접적인 주범으로 간주되지는 않습니다. ④ 세로토닌 (Serotonin): 기분, 수면, 식욕 조절 등과 관련되며, 주로 변조(Modulation) 작용을 합니다. ⑤ 엔돌핀 (Endorphin): 통증 완화와 쾌감과 관련된 신경펩타이드이며, 직접적인 흥분 또는 억제성 신경전달물질로 분류되지 않습니다.", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-67", "keys": ["25-67"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 뇌사진과 뇌파검사를 보고 가장 관련된 질환은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["측두엽 종양", "해마경화증", "혈관종", "실질형성이상", "결절성 경화증(tuberous sclerosis)"], "a": 1, "A": "②", "E": "매년 출제되는 사진인 것 같습니다. MRI와 뇌파를 자세하게 구별하기는 어렵겠지만 특징적인 위치를 잘 기억해주세요. focal epilepsy의 m/c한 형태인 temporal lobe epilepsy입니다. 흰색 원 안에 주변과 색이 다른 봉오리 부분이 temporal lobe에 위치한 hippocampus입니다. 좌우를 비교해서 보면 정상인 부분보다 해마가 위축되어있음을 알 수 있습니다. 해마경화증은 temporal lobe epilepsy에서 흔히 발견되며 MRI에서는 해마의 위축, 뇌파에서는 측두엽 기원의 발작파(2번째 블록의 T8-T4)를 보입니다. 소견이 모두 맞아 떨어지므로 정답은 2번입니다. ① 측두엽 종양: 종양은 해마경화증과 유사하게 고신호 강도를 보일 수 있으나, 일반적으로 위축 소견보다는 주변 조직을 압박하거나 변형시키는 소견을 동반합니다. ④ 실질형성이상 (Focal Cortical Dysplasia, FCD): FCD는 난치성 뇌전증의 흔한 원인이지만, 주로 피질에서 발견되며 영상 소견이 해마경화증과 다릅니다. ⑤ 결절성 경화증: 뇌 피질에 다발성 결절이 특징이며, 해마경화증의 단일하고 특이적인 소견과는 다릅니다.", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "23-37", "keys": ["23-37"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 중 뇌전증 진단에 가장 합당한 환자를 고르시오<\/div>", "o": ["15세 남자 환자 수업 중 경련성 대발작으로 응급실에 내원하였다. 2달전 같은 증상으로 응급실에 내원하였다.", "50세 남자 환자 경련성 대발작으로 응급실에 내원하였다. 이 환자는 하루에 2병 이상 계속 술을 마셔왔고 마지막 술을 마신지 만 하루만에 증상이 나타났다. 첫 증상이었고 비협조적이고 과흥분상태였다.", "45세 환자 자전거를 타고 가다가 차에 치여 의식을 잃고 응급실에 내원하였다. 응급실에서 경련성 대발작을 보였다. 뇌 CT촬영에서 특별한 이상은 없었다.", "35세 여자 환자 이상 행동으로 응급실에 내원하였다. 모친상에서 울다가 과흥분 상태로 전신 움직임을 보이고 의식이 떨어졌다.", "75세 남자 환자 비닐하우스에서 일하다가 전신경련을 보이고 응급실에 내원하였다. 체온은 39.2도였다."], "a": 0, "A": "①", "E": "교수님께서 자주 출제하셨던 유형의 문제입니다. trigger없이 재발하는 경련성 대발작 증상으로 뇌전증 진단에 적합합니다. 2. 음주라는 trigger가 있었으므로 뇌전증과는 거리가 먼 것 같습니다. 3. 사고 후 의식이 없는 상태에서 일어난 발작은 trigger가 확실해 뇌전증과는 거리가 먼 것 같습니다. 4. emotion의 trigger가 있었으므로 뇌전증 진단에 적합하지 않습니다. 5. 체온이 높고 일과중 전신경련이 일어난 것으로 보아 일과성 대뇌허혈성 발작에 더 가까운 것 같습니다. trigger의 유무로 판단하는 것이 문제를 풀기 가장 좋은 방법인 것 같습니다. 7. Seizure Precipitants", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-38", "keys": ["23-38"], "ch": 7, "g": "경련성질환", "stem": "<div>유전적 소인이 있는 전신 특발성 뇌전증에 포함되지 않는 뇌전증 증후군은?<\/div>", "o": ["청소년근간대뇌전증 juvenile myoclonic epilepsy", "소아결신발작 childhood absence epilepsy", "라스무센 증후군 Rasmussen syndrome", "청소년결신뇌전증 juvenile absence epilepsy", "전신강직간대발작 단독 자간증 Epilepsy with generalized tonic-clonic seizure only"], "a": 2, "A": "③", "E": "고대 야마에 몇 번 기출된 내용입니다. 관련 이론의 네 가지 뇌전증 암기해주시고 관련 기출 확인하시면 되겠습니다. idiopathic(특발성): 특별한 이유가 없는 경우, 개인적인 특성이 병적인 요소로 보이는 개념", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-39", "keys": ["23-39"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 발작과 감별 해야하는 질환은?<\/div>", "o": ["공황장애", "실신", "히스테리 발작", "틱 장애", "위의 모두 다"], "a": 4, "A": "⑤", "E": "관련이론의 감별질환 확인하시면 되겠습니다. 여담으로 김후원 교수님께서는 “모두 다”라는 선지를 정답 선지로 많이 넣으십니다. 잘 모르시겠으면 그 선지를 고르는 것도 하나의 방법일 것 같습니다.. [8] 간질발작(뇌전증)과 구별해야 할 질환", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-40", "keys": ["23-40"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 환자의 투약에 대한 옳은 내용은?<\/div>", "o": ["대부분은 약물치료로 완치되는 병이다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "뇌전증 환자가 임신 중 발작이 나타나서 새로운 약을 추가로 투약하는 것은 위험하다.", "케톤식이요법은 소아 뇌전증 환자에게만 효과가 입증되었다.", "투약 중단 후 5년 이상 발작이 없거나 투약 이후 10년 이상 발작이 나타나지 않으면 완해되었다고 판단하는 경향이다."], "a": 4, "A": "⑤", "E": "2. 수술로 병소를 제거해도 경련제를 복용해야 합니다. 3. 임신 중 발작이 나타나면 적극적으로 약을 변경하거나 추가로 투여할 필요가 있습니다. 4. 효과는 성인에게도 있으나, 성인들에겐 현실적으로 적용하기 힘듦으로 소아들에게 주로 적용합니다. 5. 맞는 보기입니다. [9] Treatment of Epilepsy", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "22-22", "keys": ["22-22"], "ch": 7, "g": "경련성질환", "stem": "<div>알코올 관련발작에 대한 설명으로 옳은 것은?<\/div>", "o": ["acute alcoholism과 관련된 alcohol toxic seizure이다", "뇌파검사상 발작파 발견 가능성이 높다", "향후 뇌전증으로 발전하므로 조기에 예방적 항경련제 치료가 필요하다", "진전섬망으로 발전 가능성이 높다", "경련성 전신 대발작이 특징이다"], "a": 3, "A": "④", "E": "김후원 교수님이 가르치시지 않은 내용을 내셨지만 21년도와 똑같은 선지가 답이었기 때문에 정답률이 60% 이상이었습니다. 1. 급성 알코올 중독이 아니라 만성으로 알코올이 중독된 사람들이 알코올을 끊었을 때 생기는 현상입니다. 2. 5. 대부분 전신강직간대발작을 보입니다. 3. 알코올금단발작은 이틀 정도 지나면 멈추고 경련 예방을 위해 항경련제를 사용하지 않습니다. 치료제로 IV lorazepam을 쓰면 재발방지에 도움이 됩니다.", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "22-24", "keys": ["22-24"], "ch": 7, "g": "경련성질환", "stem": "<div>간질의 치료에 대해 옳은 것은?<\/div>", "o": ["약물로 완전한 회복을 기대하기는 어렵다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "자가면역성 뇌염으로 인한 뇌전증 중첩증은 약물이 잘 듣지 않고 예후가 좋지 않다.", "케톤식이요법은 소아 난치성 뇌전증에만 효과가 입증되었다.", "적극적인 약물치료로 뇌전증 중첩증의 사망률을 의미있게 낮출 수 있다."], "a": 2, "A": "③", "E": "1. 간질은 90%이상이 약물로 치료합니다. 재발률이 높지만 약을 끊고 free해지는 상황도 있기 때문에 완전한 회복을 기대하기 어렵다는 말은 틀렸습니다. 2. epilepsy surgery를 해도 not improved되는 환자가 있기 때문에 수술하면 약을 복용할 필요가 없다는 말은 틀렸습니다. 3. CNS infection이 원인인 경우가 가장 예후가 좋지 않다고 했습니다. 이는 seizure보다는 근본적인 원인 때문에 사망률이 높은 상황입니다. 4. 케톤식이요법을 주로 소아에게 적용하지만 중환자 성인에게도 적용가능하다고 하셨습니다. 5. 뇌전증 중첩증의 사망률을 의미있게 낮출 수 있다는 설명은 없다고 피드백 시간에 설명하셨습니다. 약물을 투여하면 환자의 사망을 낮출 순 있지만 사망률을 의미있게 낮출 수는 없다는 교수님의 의도가 있었던 선지입니다.", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "③"}, {"id": "21-10", "keys": ["21-10"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증의 주된 타겟이 되는 약물로 뇌 호르몬이면서 아미노산에서 유래된 물질?(영어 full term 혹은 약자 가능)<\/div><div>답 : GABA 14년 20번. 대뇌에 많은 신경전달물질 중 뇌전증 치료제의 효과에 가장 관련이 높은 물질은?<\/div>", "o": ["Dopamine", "GABA", "Glutamate", "Ach", "Serotonin"], "a": 1, "A": "②", "E": "2025년 66번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 어렵지 않은 문제입니다. neurotransmitter를 두 개만 기억하라 하면 glutamate와 GABA인데 이 중에 흥분성이 glutamate, 억제성이 GABA입니다. ① 글루타메이트 (Glutamate) 글루타메이트는 중추신경계에서 가장 주요한 흥분성 신경전달물질입니다. 뇌전증과의 관계: 뇌전증 발작은 글루타메이트의 과도한 분비나, 글루타메이트 수용체의 과활성화로 인해 신경 세포의 흥분도가 비정상적으로 높아질 때 발생할 수 있습니다. ② 가바 (GABA, Gamma-Aminobutyric Acid): 뇌에서 가장 주요한 억제성 신경전달물질입니다. GABA의 작용이 감소하거나 기능이 약해지면 뇌의 흥분도가 높아져 뇌전증 발작을 유발할 수 있습니다. 대부분의 항경련제는 GABA 기능을 강화하여 흥분을 ", "B": "관련 강의: 강의 13 경련성질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "②"}, {"id": "25-59", "keys": ["25-59"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시신경교차부위의 병변으로 나타날 수 있는 시야장애의 양상 은 어느 것인가?<\/div>", "o": ["동측 반맹", "양측두부 반맹", "일측 전맹", "동측 사분맹", "양측두부 사분맹"], "a": 1, "A": "②", "E": "이 문제 case는 왕마라서 시신경 교차? 하면 튀어 나와야합니다. 1. 망막에 들어오는 빛은 반대측에서 교차해서 들어옴. & 2. lat. 망막은 lat.하게, med. 망막은 med.하게 교차해서 주행함 이 두 사실을 갖고 그림을 보면 해당 상황의 시야가 어떻게 보이는지 이해할 수 있습니다. 다른 교수님들 수업에서도 자주 나오는 내용이라 김후원 교수님은 자세하게 설명을 안하셨습니다. * Visual pathway", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-60", "keys": ["25-60"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>브로드만 뇌 영역과 뇌 기능과의 연결이 옳은 것은<\/div>", "o": ["영역 4 – 일차 감각 영역", "영역 3,1,2 – 일차 운동 영역", "영역 8 – 전운동(premotor) 영역", "영역 6 – 보조운동영역", "영역 5,7 – 이차 감각 영역"], "a": 4, "A": "⑤", "E": "정답률 29퍼입니다. 생각보다 정답률이 높아서 놀랍습니다 wow 저는 Broca/Wernicke만 대충 눈에 바르고 들어갔는데 교수가 누군지를 간과했습니다. 빨간 글씨도 아닌게 정답이네요. 관련이론에 나온 부분들은 확실히 암기를 해야 맞출 수 있었습니다. ① 영역 4 – 일차 감각 영역 → 일차 운동 영역 ② 영역 3,1,2 – 일차 운동 영역 → 감각 영역 (관련이론 윗부분에서는 그냥 sensory라고 나와있는데 아랫부분을 보면 위치상 primary sensory cortex에 해당합니다.) ③ 영역 8 – 전운동(premotor) 영역 → frontal eye field ④ 영역 6 – 보조운동영역 → 여기서부터 뇌정지가 좀 옵니다. 윗부분 이론에는 premotor area (secondary motor area)라 적혀있는데 아랫부분 내용을 보면 ‘2ndary motor area(M2)’에 1) premotor cortex & 2) supplementary motor cortex 이렇게 두 개가 있습니다. 그림 상으로도 Area 6에 PMA와 SMA 둘 다 들어가 있네요. 5번이 정답이라는데 4번을 ‘영역 6 – 보조 운동 영역, 전 운동 영역’이라고 완전하게 쓰지 않아서 오답인 것 같습니다. (피드백 시간에 정지연 교수님은 1번 2번이 바뀌고 3번 4번 설명이 바뀌었다고 하셨는데 3,4번의 경우에는 잘못 말하신 것 같습니다. 말이 안됩니다.) ⑤ 영역 5,7 – 이차 감각 영역 (정답) : 관련 이론 윗부분을 보면 그림 상에서 5, 7번 영역의 색이 달라서 혼란이 오실 수 있는데 아랫부분을 같이 보면 의문이 풀립니다. 윗부분에서는 단순히 5, 7 : somatic sensory라고 적혀있지만 아랫부분을 보면 5번 영역이 1,2,3번 영역의 정보를 받고 7번 영역이 visual ", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "23-45", "keys": ["23-45"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>우리 몸의 생체시계를 담당하는 시상하부의 핵은?<\/div>", "o": ["supraoptic nucleus", "suprachiasmatic nucleus", "dorsomedial nucleus", "arcuate nucleus", "paraventricular nucleus"], "a": 1, "A": "②", "E": "빛이 들어오면 일부 신호가 suprachiasmatic nucleus로 들어오며, 이를 통해 낮과 밤을 구별합니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-26", "keys": ["22-26"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체기능에 해당하지 않는 것은?<\/div>", "o": ["수면 각성", "호흡 주기", "산, 염기, 전해질", "에너지 대사", "식욕 및 체중"], "a": 1, "A": "②", "E": "피드백시간에 정답률이 낮았던 문제 중 하나였습니다. 과거 기출에 따르면 산, 염기 균형은 시상하부가 조절하지 않는다고 되어있었습니다. 답은 ②번입니다. 21년도 28번 답을 ⑤번으로 수정해두겠습니다. Water Regulation : ③ Food Regulation : ⑤ Sleep-Waking Regulation : ①, ④, ⑤ Various Hormonal control: fertility에 관련된 것 Autonomic Nerve Control: 주로 시상하부에 관련되어 있음 기출 변형인데도 정답률이 낮아서 교수님께서 내년 수업시간에 부가적인 내용을 설명하실 수도 있을 것 같습니다. 이점 참고해서 수업 듣는 것을 추천드립니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "21-28", "keys": ["21-28"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체 기능에 해당하는 것은? 가) 체중조절     나) 수면-각성 주기 조절     다) 전해질 균형     라) 산-염기 균형<\/div>", "o": ["가, 다", "나, 라", "가, 나, 다", "나, 다, 라", "가, 나, 다, 라"], "a": 4, "A": "⑤", "E": "2023년 45번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 빛이 들어오면 일부 신호가 suprachiasmatic nucleus로 들어오며, 이를 통해 낮과 밤을 구별합니다.", "B": "관련 강의: 강의 12 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "⑤"}, {"id": "25-46", "keys": ["25-46"], "ch": 8, "g": "신경병리", "stem": "<div>Wallerian degeneration에 대한 설명으로 옳은 것은 무엇인가?<\/div>", "o": ["손상된 신경축삭(axon)의 세포체(cell body)에서 변성이 먼저 시작된다.", "말초신경보다 중추신경에서 더 효과적으로 재생이 일어난다.", "손상 부위의 원위부(distal part) 축삭과 수초가 파괴된다.", "신경세포가 손상되면 바로 세포사멸(apoptosis)이 일어난다.", "Wallerian degeneration은 감각신경에서만 일어나는 특이적 현상이다."], "a": 2, "A": "③", "E": "지금까지는 wallerian degeneration이 정답인 문제가 기출로 많이 나왔던 것 같은데 이번에는 wallerian degeneration에 대한 걸 물어보셨습니다. 1. Wallerian degeneration의 경우 세포체가 아닌 축삭의 원위부에서 시작됩니다. 2. 말초신경은 schwann cell이 있어서 중추신경보다 재생이 잘 일어납니다. 3. 정답입니다. 4. 세포체 자체가 죽는건 retrograde degeneration입니다. 5. wallerian degeneration의 경우 감각, 자율, 운동신경을 가리지 않고 축삭이 끊긴 모든 병변에서 일어나는 현상입니다. (3) Wallerian degeneration (→ axonal injury, anterograde degeneration)", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-47", "keys": ["25-47"], "ch": 8, "g": "신경병리", "stem": "<div>Werdnig-Hoffmann disease의 병리학적 특징에 대한 설명으로 옳은 것은?<\/div>", "o": ["중추신경계의 백질(white matter) 탈수초(demyelination)가 주된 병변이다.", "상위운동신경원(upper motor neuron)의 소실이 주된 원인이다.", "척수 전각(anterior horn)의 운동신경원(motor neuron) 손실이 특징이다.", "말초신경의 축삭 재생이 과도하게 일어나 근비대(hypertrophy)를 유발한다.", "골격근에서 거대핵을 가진 세포가 비정상적으로 증식하는 것이 관찰된다."], "a": 2, "A": "③", "E": "마찬가지로 Werdnig-Hoffmann dz.가 답으로 출제된 문제가 기출에 많았는데 이번에는 질병에 대한 것을 묻는 문제가 출제되었습니다. 1. M ...(10부 중 3부까지 표시했습니다. 이어서 보려면 같은 file_id로 part=4을 지정해 다시 호출하세요.) ultiple sclerosis에 대한 설명이고, SMA는 운동신경원 세포 자체의 손실입니다. 3. 정답입니다. 4. 오히려 신경지배 손실로 위축되어 발생하는 질환입니다. 5. SMA에서는 grouped atrophy 형태로 작아지고, 거대핵세포의 증식은 염증성 근육질환에서 나타납니다. a. Spinal muscular atrophy의 특징", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-48", "keys": ["25-48"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 Becker muscular dystrophy의 병리학적 특징으로옳은 것은?<\/div>", "o": ["디스트로핀(dystrophin) 단백질이 완전히 결실되어 면역조직화학염색에서 발 현이 관찰되지 않는다.", "근위축은 주로 상위운동신경원의 퇴화로 인해 발생한다.", "근육생검에서 섬유화 없이 일관된 근섬유 위축만 관찰된다.", "디스트로핀 단백질의 발현은 감소하거나 비정상적인 형태로 존재한다.", "임상적으로는 주로 소아기 초기에 빠르게 진행되는 전신 근력저하를 보인다."], "a": 3, "A": "④", "E": "문제를 풀기위해서는 Duchenne muscular dystrophy와 becker muscular dystrophy의 차이점을 알아야합니다. 1. dystrophin 면역염색 시 정상보다 약하게 염색됩니다. 발현이 아예 관찰되지 않는 것은 뒤센 근위축증입니다. 2. 근위축은 신경원성이 아닌 Myopathy의 일종입니다. 3. 가장 초기에 muscle fiber의 degeneration이 일어나고, degeneration된 muscle들의 remyelination이 일어납니다. 조금 더 진행하게 되면 최소단위의 muscle 바깥의 perimysial space에 collagen이 침착되어 fibrosis가 일어납니다. 4. 정답입니다. Becker muscular dystrophy의 핵심 병리 특징입니다. Dystophin의 절대양이 줄어든 것이지 아예 존재하지 않는 것은 아닙니다. 5. 이것 역시 Duchenne muscular dystrophy의 전형적 임상 양상입니다. Becker형은 발병이 더 늦고 진행속도 역시 느립니다. 2) Muscular dystrophies : 신경원성이 아니라 Myopathy의 일종이다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-49", "keys": ["25-49"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 다발성 경화증(MS)의 병리학적 특징 및 병인기전에 관한 설명으로 가장 적절한 것은?<\/div>", "o": ["말초신경계의 schwann cell이 주로 손상되어 감각 및 운동기능저하가 나타난 다.", "병변에서는 Th2 세포와 IL-4의 분비가 우세하여 염증반응이 억제된다.", "병변의 초기단계에서 oligodendrocyte의 손실과 macrophage 및 microglia의 활성화가 관찰된다.", "병변은 주로 대뇌피질의 회백질에서 발견되며, 백색질 손상은 드물다.", "MS에서 형성되는 탈수초성 병변은 신경근 접합부의 아세칠콜린수용체 결손과 직접적인 연관이 있다."], "a": 2, "A": "③", "E": "교수님께서 수업시간에 함정으로 자주 나오는 것들이라고 하셨습니다. 다발성 경화증에서 astrocyte와 macrophage는 늘어나고, oligodendrocyte/myelin은 줄어듭니다. 1. 중추신경계의 oligodenrocyte입니다 2. 염증반응이 발생합니다. 4. oligodendrocyte가 존재하는 백색질에 병변이 발견됩니다. 5. 아세틸콜린 수용체 결손과는 직접적인 연관이 없습니다. (1) Multiple sclerosis", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-01", "keys": ["23-01"], "ch": 8, "g": "신경병리", "stem": "<div>22세 남자가 forearm의 deep laceration으로 median nerve의 tansection이 발생하였다면 이후 이 신경에 초래될 변화는?<\/div>", "o": ["Wallerian degeneration", "Fibrinoid necrosis", "Coagulative necrosis", "Segmental demyelination", "Chronic inflammation"], "a": 0, "A": "①", "E": "Wallerian degeneration은 말초신경이 절단 혹은 짓이겨졌을 때, 그 절단부위 이하에 있는 axon과 myelin이 변성되는 퇴행성 변화로 문제의 설명에 해당합니다. 고대야마와 똑같이 출제되었습니다. 주관식으로도 출제된적이 있는 내용이므로 암기하면 좋을 것 같습니다. (3) Wallerian degeneration (→ axonal injury, anterograde degeneration)", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-02", "keys": ["23-02"], "ch": 8, "g": "신경병리", "stem": "<div>Cerebral cortex가 조직학적으로 많은 neuritic plaques, neurofibrillary tangles, amyloid angiopathy가 관찰된다. 가장 관련 가능성이 높은 것은?<\/div>", "o": ["choreiform movement를 하는 48세 남자", "갑작스런 의식소실을 보이는 30세 여자", "progressive muscular weakness를 보이는 44세 여자", "Down's syndrome이 있는 40세 여자", "시력장애와 neurologic function 장애를 갖는 2세 소년"], "a": 3, "A": "④", "E": "(2) Degenerative disease, cortex", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-03", "keys": ["23-03"], "ch": 8, "g": "신경병리", "stem": "<div>3세 여아가 사지를 모두 침범하는 점차적인 weakness로 움직이기가 어려워졌다. 부모의 말에 따르면 특별한 질환을 앓은 적이 없고, 만기 정상분만을 하였다고 한다. 열은 없었으며 laboratory finding상 특이 소견은 없었다. 근생검 소견상 근섬유의 grouped atrophy가 관찰되었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["Myasthenia gravis", "werdnig-hoffman disease", "Duchenne muscular dystrophy", "Polymyositis", "Pompe's disease"], "a": 1, "A": "②", "E": "어린나이부터 사지를 침범하는 근력약화, grouped atrophy로부터 선천적 SMA를 생각할 수 있습니다. 선지에서는 Werdnig-hoffman disease가 해당하겠습니다. 고대야마와 똑같이 출제되었고 주관식으로 출제된적이 있으니 외우는 것이 좋을 것 같습니다. ② 선천적 denervation atrophy의 예시", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "23-04", "keys": ["23-04"], "ch": 8, "g": "신경병리", "stem": "<div>Charcot-Marie-Tooth disease의 주된 침범 부위로 알맞은 것은?<\/div>", "o": ["Peripheral sensory nerve", "Basal ganglia", "Substantia nigra", "Cerebral cortex", "Anterior horn of spinal cord"], "a": 0, "A": "①", "E": "임성철 교수님의 유일한 탈마문제이긴 하나 피마였습니다. Charcot-Marie-Tooth disease는 Hereditary motor and sensory nuropathy(HSMN) type 1입니다. periphera nerve의 demyelination이 일어나기 때문에 선지에서 periphera sensory nerve를 고를 수 있을 것 같습니다. 4) Hereditary motor and sensory neuropathy (HSMN) Onion bulb pattern을 보인다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "22-11", "keys": ["22-11"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 근육의 disuse atrophy에 대한 설명은?<\/div>", "o": ["type 1 muscle fiber의 angular atrophy", "type 2 muscle fiber의 angular atrophy", "type 1 and 2 muscle fiber의 angular atrophy", "target fiber", "fiber type grouping"], "a": 1, "A": "②", "E": "근육의 disuse atrophy(불활동성 위축)에 대해 물어본 문제로, 이에 대한 수업시간의 예시가 있었습니다. 교통사고 후 손상이 있는 다리 쪽을 오랫동안 사용하지 않으면 atrophy가 일어나는데, 이 때 type 2 muscle fiber가 dominant하게 involved되어 small angulated fiber를 형성하게 된다. 따라서 type 2 muscle fiber의 angular atrophy을 답으로 고르시면 됩니다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "22-13", "keys": ["22-13"], "ch": 8, "g": "신경병리", "stem": "<div>장년 여성이 눈꺼풀처짐증, 복시, 구음장애가 발생하였다. 증상은 아침에 경하나 저녁으로 갈수록 심해지는 경향이 있었다. 이 환자의 질환과 관련된 특징으로 가장 거리가 먼 것은?<\/div>", "o": ["thymoma", "anti-acetylcholine receptor antibodies", "호흡곤란", "type 1 muscle fiber 내의 작은 막대모양 과립", "cholinesterase inhibitor 투여로 증상 호전"], "a": 3, "A": "④", "E": "2016년에 동일한 문제가 기출되었습니다. 과거 기출까지 꼼꼼하게 보시는 것이 좋을 것 같습니다. 환자에게서 나타난 임상증상, 특히 저녁으로 갈수록 심해지는 증상을 통해 중증근무력증에 대한 내용임을 알 수 있습니다. 중증근무력증은 thymoma와 관련이 있고, Anti-acetylcholine receptor AB를 형성하며, 따라서 cholinesterase inhibitor의 투여로 증상이 호전될 수 있습니다. muscle의 수축이 일어나지 못해 호흡곤란이 나타날 수 있습니다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "22-14", "keys": ["22-14"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 ALS에 대한 설명으로 옳지 않은 것은?<\/div>", "o": ["Papova virus와 연관되어 발생한다.", "Ant. motor horn cell이 감소한다.", "Lat. corticospinal tract 침범한다.", "대칭적 반사과다 및 경직", "대칭적 근위축"], "a": 0, "A": "①", "E": "➀ALS는 papova virus와는 관련 없습니다. (틀린 보기) ➁ALS는 ant. horn을 침범해 neuronal muscle atrophy가 일어납니다. ➂ALS는 lat. corticospinal tr.을 침범합니다. ➃, ➄ ALS는 LMN과 UMN 모두를 침범해 대칭적 반사과다 및 경직, 대칭적 근위축을 일으킵니다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "20-04", "keys": ["20-04"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중에서 퇴행성 신경질환은?<\/div>", "o": ["Lou Gehrig disease", "multiple sclerosis", "Werdnig-Hoffmann disease", "Duchenne muscular dystrophy", "leukodystrophy"], "a": 0, "A": "①", "E": "2022년 14번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: ➀ALS는 papova virus와는 관련 없습니다. (틀린 보기) ➁ALS는 ant. horn을 침범해 neuronal muscle atrophy가 일어납니다. ➂ALS는 lat. corticospinal tr.을 침범합니다. ➃, ➄ ALS는 LMN과 UMN 모두를 침범해 대칭적 반사과다 및 경직, 대칭적 근위축을 일으킵니다.", "B": "관련 강의: 강의 15 신경 병리", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "①"}, {"id": "25-07", "keys": ["25-07"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 왼팔과 다리에서 dysmetria, kinetic tremor가 관찰되었다면 종양이 어디로 전이된 것으로 생각할 수 있나?<\/div>", "o": ["The right frontal lobe", "The cerebellar vermis", "The left frontal lobe", "The right cerebellar hemisphere", "The left cerebellar hemisphere"], "a": 4, "A": "⑤", "E": "23,20에 같은 문제가 한글 용어로 기출된 바 있습니다. 겨냥이상을 확인할 수 있는 검사는 finger to nose test입니다. 이를 통해 소뇌의 주된 기능인 coordination을 확인할 수 있습니다. kinetic tremor 또한 소뇌 병변의 증상입니다. 소뇌는 병변의 동측에 증상이 나타나므로 좌측 소뇌반구로 전이됐음을 알 수 있습니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-11", "keys": ["25-11", "22-05"], "ch": 9, "g": "운동장애", "stem": "<div>자세와 근긴장도에 영향을 주는 indirect activation pathway 중 lateral에 위치하며 대뇌제거경축과 피질제거경 축 자세 차이에 영향을 주로 미치는 tract는?<\/div>", "o": ["rubrospinal tract", "tectospinal tract", "reticulospinal tract", "vestibulospinal tract", "corticospinal tract"], "a": 0, "A": "①", "E": "(정답률 93%) upper midbrain damage가 있는 경우 상지 flexion을 담당하고 있는 rubrospinal tract가 항진되어(상지 flexion, 하지 extension) decorticate rigidity가 나타나게 되고, upper pontine damage가 있는 경우 rubrospinal tract가 소실되어(상하지 모두 extension) decerebrate rigidity가 나타나게 됩니다. 이처럼 대뇌제거경축과 피질제거경축 자세 차이에 영향을 주로 미치는 tract은 rubrospinal tract입니다. [그림 #47] 또한, 위 그림과 같이 rubrospinal tract은 indirect activation pathway 중 lateral에 위치하고 있습니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": false, "ra": "①"}, {"id": "25-13", "keys": ["25-13"], "ch": 9, "g": "운동장애", "stem": "<div>Brain reticular formation이 관여하는 기능이 아닌 것은?<\/div>", "o": ["Arousal", "coordination", "Muscle tone", "Pain", "Homeostasis"], "a": 1, "A": "②", "E": "(정답률 14%) 이번 시험에서 객관식 문제 중 정답률이 가장 낮은 문제 중 하나입니다. 소뇌가 coordination, muscle tone 유지에 관여한다는 것은 배웠지만 reticular formation의 기능에 대해서는 수업시간에 자세히 다루지 않아 어느 정도 배경지식이 있지 않으면 정답을 고르기 힘든 문제였습니다. Brain reticular formation(그물체, 망상체)에서는 Arousal, Muscle tone, Pain, Homeostasis에는 관여하지만 Coordination은 소뇌에서 담당하는 기능입니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-16", "keys": ["25-16"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병의 증상과 징후에 대한 설명이다. 적절한 표현은?<\/div>", "o": ["농촌거주자보다 도시거주자에 많이 발생된다.", "떨림은 주로 손, 머리, 목소리에서 주로 관찰된다.", "진전 서동증 등 운동 증상은 초기에는 일측성으로 관찰된다.", "도파민 신경세포 소실이 20-30% 정도 소실시 운동장애 현상을 일으킨다.", "사립체에서 호흡사슬복합체 I의 기능을 저해되어 주로 콜린세포 손상 초래된다."], "a": 2, "A": "③", "E": "(정답률 69%) 파킨슨병의 중요 임상 증상 중 하나는 asymmetric onset입니다. 운동 증상이 나중에는 양쪽 다 발현되지만 처음 발병했을 때에는 어느 한 쪽에서부터 시작됩니다. 다른 증상들로는 resting tremor, rigidity, bradykinesia가 있습니다. ① 농촌거주자에서 도시거주자보다 많이 발생합니다. ② Parkinson tremor의 떨림은 주로 손과 다리에 나타납니다. 손, 머리, 목소리를 주로 침범하는 떨림은 essential tremor입니다. ④ 도파민 신경세포가 80% 소실 시 파킨슨 증상이 시작됩니다. 따라서 조기 진단이 불가능하며, 초기 증상을 느껴서 내원한 환자들은 15-20년 전부터 병이 진행하고 있었다는 것을 의미합니다. ⑤ 사립체에서 호흡사슬복합체 I의 기능이 저해되는 것은 맞지만 콜린세포의 손상이 아니라 도파민성 신경세포의 손상이 초래됩니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-17", "keys": ["25-17"], "ch": 9, "g": "운동장애", "stem": "<div>불규칙한 움찔거리는(jerky) 불수의 운동이 신체의 여러 부분에서 불규칙(random)하고 순서로 나타나거나 한 부분에서 다른 부분으로 물 흐르듯이(flowing) 이동하는 이상 운동은?<\/div>", "o": ["진전", "무도증", "틱", "이긴장증", "연축"], "a": 1, "A": "②", "E": "매년 기출되어오는, 운동을 보고 어떤 이상 운동인지 고르는 문제입니다. 물 흐르듯이 이동하는 것은 무도증이라고 강조하셨습니다. 올해는 영상자료가 없었으나, 매년 영상자료를 주고 고르도록 하셨으니, 드라이브를 통해 영상 확인 한 번 해보시는 것도 좋을 것 같습니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-19", "keys": ["25-19"], "ch": 9, "g": "운동장애", "stem": "<div>MRI 소견에서 다음과 같은 소견이 관찰되며 경직과 운동완만은 파킨슨병과 비슷하나 자세 불안정과 안구의 수직운동장애가 특징인 비전형 파킨슨증은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["윌슨병", "진행핵상마비", "다계통위축", "겉질바닥핵변성", "Lewy소체치매"], "a": 1, "A": "②", "E": "우선 경직과 운동완만이 파킨슨병과 비슷하니, Parkinsonism 중에 하나에 해당하며, 안구 수직운동 장애로 놀란 토끼눈 표정과 하방 운동 주시를 못하게되는 병은 PSP (진행핵상마비)입니다. 영어와 한글 둘 다 숙지하고 들어가주세요. 또 Pons의 atrophy로 인한 Hummingbird Sign도 PSP의 대표적인 특징입니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "23-06", "keys": ["23-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜰 때는 중심을 잡으나 감으면 중심 잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "posterior column", "frontal lobe", "peripheral nerve"], "a": 2, "A": "③", "E": "왕마 문제이긴 하나 dorasal column이 posterior column으로 바뀌어 출제되는 바람에 정답률이 낮은 문제였던 것 같습니다. Romberg test에 대한 설명으로 눈을 뜰때나 감을때나 중심을 못잡으면 소뇌 문제, 눈을 뜰때는 정상, 눈을 감을 때 중심을 잡기 어려우면 dorsal column(posterior column)문제로 외우면 될 것 같습니다. (6) Romberg 검사 大15주", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-08", "keys": ["23-08"], "ch": 9, "g": "운동장애", "stem": "<div>뇌간에서 발생한 혈관 병변에 의해 환자의 팔다리에 광범위하고 심한 경축(rigidity)이 나타났다. 이 경축과 가장 관련이 높은 신경로는?<\/div>", "o": ["적색척수로(rubrospinal tract)", "덮개척수로(tectospinal tract)", "내측세로다발(Medial longitudinal fasciculus ; MLF)", "외측그물척수로(Lateral reticulospinal tract)", "외측진정척수로(Lateral vestibulospinal tract)"], "a": 4, "A": "⑤", "E": "문제는 다르지만 rubrospinal tract이 답이되는 왕마문제가 작년에 출제되었기 때문에 1번을 고른 사람이 90%가 나올만큼 정답률이 낮았던 문제입니다. 16년도에 상지에 flexion, 하지에 extention이라는 말이 추가되어 비슷하게 출제된적 있으나 추가된 부분 때문에 답이 corticospinal tract으로 다릅니다. (5) Motor response 20주", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-11", "keys": ["23-11"], "ch": 9, "g": "운동장애", "stem": "<div>Ankle clonus 영상. 다음 비디오와 같이 corticospinal tract 손상시 작용근과 대항근 관계의 근육 중 한 근육을 빠르게 펴면 작용근과 대항근이 번갈아 수축과 이완을 반복하는 현상이 나타나는데 이 경우 심부건 반사의 grade는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["0", "+", "++", "+++", "++++"], "a": 4, "A": "⑤", "E": "심부건 반사가 항진되어 작용근과 대항근 관계에 있는 근육 중 한 근육을 빠르게 펴면 작용근과 대항근이 수축과 이완을 반복하는 현상은 clonus입니다. 동영상에선 ankle jerk를 시행한 환자에서 clonus가 나타나므로 ankle clonus입니다. clonus는 반사검사에서 Grade ++++ (+ 4개)로 나타냅니다. 고대야마에서 똑같이 출제하셨으므로 고대야마도 꼭 확인하시길 바랍니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-13", "keys": ["23-13"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 우측 손과 발에서 겨냥이상과 의도떨림이 관찰되었다. 종양이 전이된 것으로 추정되는 곳은?<\/div>", "o": ["우측 소뇌 반구", "좌측 소뇌 반구", "우측 전두엽", "좌측 전두엽", "소뇌 중부"], "a": 0, "A": "①", "E": "2020년도 야마가 그대로 출제되었습니다. 겨냥이상을 확인할 수 있는 검사는 finger to nose test입니다. 이를 통해 소뇌의 주된 기능인 coordination을 확인할 수 있습니다. 또한 소뇌에 손상이 있는 경우 intention tremor가 나타나게 되는데, 의도떨림이 관찰되므로 이도 소뇌에 병변이 있음을 추정할 수 있습니다, 소뇌는 다른 tract들과 다르게 병변이 나타난 쪽과 같은 방향에 증상이 나타납니다. 따라서 우측 손과 발에서 겨냥이상과 의도떨림이 관찰되므로 종양은 우측 소뇌반구에 전이된 것입니다. 6. 소뇌기능검사(협조운동 검사)", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-30", "keys": ["23-30"], "ch": 9, "g": "운동장애", "stem": "<div>다음 video에서 관찰되는 운동은?<\/div><div>동영상 : 20231103111140261.mp4<\/div>", "o": ["떨림", "근긴장이상", "근간대경련", "무도증", "실조증"], "a": 1, "A": "②", "E": "정답률 68% 환자가 뒤틀린 모습과 비정상적인 자세를 보이는 것으로 보아 근 긴장이상입니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-06", "keys": ["22-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜨거나 감거나 중심잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "proprioception", "frontal lobe", "peripheral nerve"], "a": 1, "A": "②", "E": "소뇌 기능 검사 중 Romber test에 관한 내용을 묻는 문제입니다. 눈을 떴을 때도 균형을 유지하기 힘든 경우 소뇌에 문제가 있다고 볼 수 있습니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "22-07", "keys": ["22-07"], "ch": 9, "g": "운동장애", "stem": "<div>근긴장도 검사에서 옳은 사항은?<\/div>", "o": ["경축은 피라미드질환에서 자주 관찰된다.", "경직은 관절 움직임 진찰 시작에서 끝까지 저항이 고루 느껴진다.", "경축은 upper motor neuron 손상에서 관찰되며 반사항진이 동반된다.", "경직은 상지에서 폄근(extensor) 하지에서 굽힘근(flexor)에서 더 잘 관찰된다.", "파킨슨병에서 관절 운동검사에서 톱니바퀴가가 맞물려 돌아가는 경축이 관찰된다."], "a": 4, "A": "⑤", "E": "① 경축은 피라미드외질환에서 자주 관찰된다. ② 경축은 관절 움직임 진찰 시작에서 끝까지 저항이 고루 느껴진다. ③ 경직은 upper motor neuron 손상에서 관찰되며 반사항진이 동반된다. ④ 경직은 상지에서 굽힘근(flexor) 하지에서 폄근(extensor)에서 더 잘 관찰된다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "22-09", "keys": ["22-09"], "ch": 9, "g": "운동장애", "stem": "<div>본태떨림을 의심할 수 있는 흔한 떨림 부위는?<\/div>", "o": ["손, 다리, 머리", "손, 목소리, 턱", "다리, 머리, 턱", "손, 목소리, 다리", "손, 목소리, 머리"], "a": 4, "A": "⑤", "E": "본태떨림(Essential Tremor)은 두 번째로 흔한 비자발적 운동 장애로 손, 머리, 목소리까지 떨림을 나타냅니다. 가장 흔한 형태는 상지에서 나타나는 Postural Tremor입니다. Ⅱ. Movement disorders - Tremor", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "22-12", "keys": ["22-12"], "ch": 9, "g": "운동장애", "stem": "<div>다음 운동장애의 이름은?<\/div><div>동영상 : 20221102085855337.mp4<\/div>", "o": ["틱", "진전", "무도증", "이긴장증", "근간대경련"], "a": 3, "A": "④", "E": "영상에서 exam 시에는 특별한 이상소견이 나타나지 않았고, 어떤 일을 수행하게 하면 손이 굳으면서 잘 되지 않는 모습이 담겨있었습니다. 왼손으로는 글씨를 부드럽게 잘 쓰는데, 오른손으로 쓰게 하면 환자 손에 힘이 들어가며 글씨가 제대로 써지지 않았습니다. 이는 특정한 task에 의해 유발되는 dystonia를 나타냅니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "21-06", "keys": ["21-06"], "ch": 9, "g": "운동장애", "stem": "<div>근육긴장이상을 보인 신체 부분에 감각자극을 줄 경우 근육긴장이상이 일시적으로 호전되는 현상은?<\/div>", "o": ["torticollis", "athetosis", "focal dystonia", "sensory trick", "psychogenic tremor"], "a": 3, "A": "④", "E": "2025년 17번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 매년 기출되어오는, 운동을 보고 어떤 이상 운동인지 고르는 문제입니다. 물 흐르듯이 이동하는 것은 무도증이라고 강조하셨습니다. 올해는 영상자료가 없었으나, 매년 영상자료를 주고 고르도록 하셨으니, 드라이브를 통해 영상 확인 한 번 해보시는 것도 좋을 것 같습니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "④"}, {"id": "20-14", "keys": ["20-14"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병(PD)과 진행성핵상마비(PSP)를 감별하는 가장 특징적인 임상소견은?<\/div>", "o": ["tremor", "bradykinesia", "rigidity", "impaired upward conjugate gaze", "impaired downward conjugate gaze"], "a": 4, "A": "⑤", "E": "2025년 19번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 우선 경직과 운동완만이 파킨슨병과 비슷하니, Parkinsonism 중에 하나에 해당하며, 안구 수직운동 장애로 놀란 토끼눈 표정과 하방 운동 주시를 못하게되는 병은 PSP (진행핵상마비)입니다. 영어와 한글 둘 다 숙지하고 들어가주세요. 또 Pons의 atrophy로 인한 Hummingbird Sign도 PSP의 대표적인 특징입니다.", "B": "관련 강의: 강의 16 운동장애", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "⑤"}, {"id": "25-12", "keys": ["25-12"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>다음 중 Glasgow coma scale의 최저 점수는?<\/div>", "o": ["0", "1", "2", "3", "4"], "a": 3, "A": "④", "E": "(정답률 98%) 교수님께서 수업시간에 Glasgow coma scale의 최소점이 0점이 아니라고 계속해서 강조하셨는데 이 부분이 출제되었습니다. Glascgow coma scale은 의식의 상태를 3가지 항목으로 평가한 것으로 Eye opening(1~4점), Motor response(1~6점), Verbal response(1~5점)으로 구성되어 최저 점수는 3점이 됩니다. 3) Glasgow Coma Scale P20주", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "23-07", "keys": ["23-07"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 4, "A": "⑤", "E": "작년 문제와 완벽히 동일한 문제이긴 하나 답이 잘못되어 상당히 낮은 정답률을 기록한 문제입니다. (4) Brainstem signs (brainstem을 평가하는 여러 가지 signs)", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-09", "keys": ["23-09"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>57세 여자가 복시와 오른눈의 안검하수 동공 확장 및 아래 바깥으로 편위된 안구를 보이며 원근 조절반사 장애를 보이는 경우 이 환자의 병변의 부위는?<\/div>", "o": ["oculomotor nerve", "trochlear nerve", "abducens nerve", "superior colliculus", "lateral tegmentum"], "a": 0, "A": "①", "E": "자주 출제된 내용입니다. 복시와 오른눈의 안검하수, 아래 바깥으로 편위된 안구를 보인다는 소견을 통해 oculomotor nerve에 병변이 있음을 알 수 있습니다. 3) CN Ⅲ, Ⅳ, Ⅵ. Oculomotor, Trochlear, Abducens nerve", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-10", "keys": ["23-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>전정 기능검사 중 바른 사항은?<\/div>", "o": ["머리 회전운동에 대해 눈의 움직임이 고정되어 있으면 정상이다.", "혼수 환자에서 인형눈현상이 정상이면 대사질환의 가능성이 크다.", "인형안현상의 구심신경은 안구운동에 관여하는 신경이며 원심신경은 전정신경이다.", "혼수 환자에서 머리회전의 반대 방향으로 편위되면 뇌 줄기의 기질적 이상을 시사한다.", "온도안진검사의 평가는 정상의 경우 온수로 자극시 자극 반대 방향으로 향하는 안진이, 냉수로 지극시 동측으로 향하는 안진이 관찰된다."], "a": 1, "A": "②", "E": "① 머리 회전운동에 대해 눈의 움직임이 고정되어 있는 것이아닌 고개를 돌리는 방향과 반대방향으로 가야합니다. ② 인형안현상이 정상이면 brain stem에 기질적 이상이 없기 때문에 대사질환의 가능성이 큽니다. ③ 인형안현상의 구심신경은 삼차신경(안구운동x)이며 원심신경은 얼굴신경입니다. ④ 혼수 환자에서 머리회전의 동측 방향으로 편위되면 뇌줄기의 기질적 이상을 시사합니다. ⑤ 온도안진검사의 평가는 정상의 경우 온수로 자극시 동측 방향으로 향하는 안진이, 냉수로 지극시 반대측으로 향하는 안진이 관찰된다. (3) Ocular finding", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-03", "keys": ["22-03"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>67세 남자가 의식저하로 응급실에 왔다. 호흡은 과호흡을 보이고, 양측 동공은 6mm로 대광반사가 소실되 었고, oculocephalic reflex에서 안구의 움직임이 없고, 다음과 같은 자세로 누워 있었다. 병변으로 추정되는 부위는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["pons", "midbrain", "lower medulla", "diencephalon", "upper medulla"], "a": 0, "A": "①", "E": "decerebrate rigidity 자세로 병변이 upper pontine damage까지 있어 flexion을 담당하고 있는 rubrospinal tr,소실로 상하지 모두 extension된 자세입니다. decorticate rigidity의 경우, upper midbrain damage로 flexion을 담당하는 rubrospinal tr.이 항진되어, 상지 flexion, 하지 extension되어 있습니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "22-04", "keys": ["22-04"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 1, "A": "②", "E": "ciliospinal reflex는 경부의 피부를 꼬집어 교감신경계의 이상 유무를 검사하는 것으로 동강이 산대되면 neck~midbrain까지의 교감신경로가 정상인 것을 나타냅니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "22-10", "keys": ["22-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>섬망에 대한 임상적 특징으로 올바른 것은?<\/div>", "o": ["집중력은 잘 유지된다", "증세 변동이 흔하지 않다", "비교적 지속적으로 나타난다", "자율신경계 이상증상이 흔하다", "서서히 시작하는 경우가 대부분이다"], "a": 3, "A": "④", "E": "➀집중력이 잘 유지되지 않습니다. ➁증세 변동이 흔합니다. ➂장해가 단기간동안 발전됩니다. ➃섬망은 자율신경계 이상증상, 신경학적 증상 등 대부분의 증상이 다 나타날 수 있습니다. (맞는 보기) ➄급성으로 발병합니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "25-04", "keys": ["25-04"], "ch": 9, "g": "신경학적 검사", "stem": "<div>환자가 반대 측 반신마비와 함께 동측 내측주시마비를 보일 때 병변은 어디에 위치하는가?<\/div>", "o": ["연수(medulla)", "간뇌(diencepahalon)", "중뇌(midbrain)", "입쪽교뇌(rostral pons)", "꼬리쪽 교뇌(caudal pons)"], "a": 2, "A": "③", "E": "(정답률 47%) 정지연 교수님께서 해설해주셨습니다. 20 기출과 동일한 문제입니다. 교수님 해설) 1번 medulla를 선택한 사람들이 많았다. medulla는 반대측 반신 마비와 함께 동측 안면의 감각저하 등의 소견이 나타나야 한다. 주시마비의 경우 EOM과 관련되어 있고, 눈 움직임과 관련된 신경들은 주로 midbrain에 위치한다. +) Supratentorial은 반대측 / Infratentorial은 얼굴은 동측, 몸은 반대측 / cerebellum은 동측의 증상을 보인다는 것을 기억해주세요.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-05", "keys": ["25-05"], "ch": 9, "g": "신경학적 검사", "stem": "<div>일반적으로 반대쪽의 모든 기본 감각에 손상을 보일수 있고 감각이상이나 감각저하, 감각과민 등을 보일 수 있는 병터는?<\/div>", "o": ["마루터 병터", "시상 병터", "뇌줄기 병터", "척수 병터", "신경뿌리 병터"], "a": 1, "A": "②", "E": "시상은 모든 감각정보가 거쳐가는 sensory centor입니다. 고유감각을 관장하는 dorsal column pathway와 pain, temperature를 관장하는 spinothalamic tract 모두 thalamus를 거쳐 cortex로 정보를 전달합니다. 이전까지는 기본 감각에 이상이 없다는 것을 전제, 손에 쥔 동전 등을 인식하지 못하는 대뇌 피질의 문제인 Agnosia에 대해 주로 출제하셨는데, 기본 감각 자체에 대해 물어보신 문제는 처음입니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-10", "keys": ["25-10"], "ch": 9, "g": "신경학적 검사", "stem": "<div>혈중 이산화탄소의 농도에 따라 숨을 몰아 쉬다가는 일시적으로 숨이 멎는 호흡을 주기적으로 할 때, 병변부위는?<\/div>", "o": ["medulla", "midbrain", "basis pontis", "tegmentum pontis", "forebrain"], "a": 4, "A": "⑤", "E": "(정답률 16%) 문제에서 설명하고 있는 호흡은 과다호흡과 무호흡이 점강-강쇠 양상으로 규칙적으로 반복되는 ‘Cheyne-stokes respiration’입니다. Cheyne-stokes respiration은 diencephalon(사이뇌)에 병변이 있을 때 발생하는데, diencephalon은 forebrain(앞뇌)에 속하므로 답은 forebrain이 됩니다. 각 호흡의 특징들과 어디에 병변이 있을 때 발생하는지를 정확히 숙지하셔야 할 것 같습니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-18", "keys": ["25-18"], "ch": 9, "g": "신경학적 검사", "stem": "<div>당뇨 고혈압 고지혈증 약을 투약중인 62세 남자가 우측 팔 다리의 거칠고 불수의적인 빠른 움직임을 보여 응급실로 내원하였다. 이 환자의 증상을 설명할 수 있는 병변은?<\/div>", "o": ["Ipsilateral subthalamic nucleus(STN)", "Ipsilateral medulla", "Contralateral STN", "Contralateral medulla", "Ipsilateral frontal lobe"], "a": 2, "A": "③", "E": "20년도에 똑같은 문제로 출제되었던 문제입니다. 올해에는 제대로 설명해주지 않으셨던 부분에서 출제하셨습니다. 김진호 교수님은 과거 기출에서도 종종 출제하시니, 과거 기출까지 제대로 보고 시험보시는 것을 추천드립니다. 참고로, STN 병변 시, 반대쪽 팔다리의 거칠고 불수의적인 빠른 움직임을 보이는 Bailsm(도리깨 운동)을 보입니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-12", "keys": ["23-12"], "ch": 9, "g": "신경학적 검사", "stem": "<div>의삭장애 환자에서 짧은 주기로 무호흡과 과호흡이 점강-감쇠 양상으로 반복되는 호흡 패턴을 보이는 경우 가장 많은 병터는?<\/div>", "o": ["연수", "사이뇌", "하부교뇌", "중뇌와 교뇌", "하부교뇌와 상부연수"], "a": 1, "A": "②", "E": "과호흡과 무호흡이 점강-감쇠 양상으로 반복되는 호흡 패턴은 cheyne-stokes respiration(체인-스토크 호흡)입니다. 병터는 양쪽 대뇌반구와 사이뇌입니다. 2021년 야마를 변형출제 하셨습니다. 김진호 교수님께서는 야마를 안 타는 문제도 있지만 고대야마까지 전부 활용하여 변형하시므로 꼭 야마도 챙겨주시길 바랍니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-08", "keys": ["22-08"], "ch": 9, "g": "신경학적 검사", "stem": "<div>Foster-kennedy 증후군 에 대한 기술 중 옳지 않은 사항은?<\/div>", "o": ["후각상실증을 나타낸다.", "종양과 같은 쪽에 후각상실증 나타낸다.", "종양의 반대 측에 유두부종을 나타낸다.", "종양의 반대 측에 시신경위축을 나타낸다.", "전두엽 하부의 수막종에 의해 드물게 발생한다."], "a": 3, "A": "④", "E": "Foster-kennedy syndrome은 ➄frontal lobe base의 문제로 ➁동측의 ➀후각장애, 동측의 visual atrophy, ➃ 동측의 optic atrophy ➂반대측의 papilledema를 보입니다. 따라서 종양의 반대 측에 시신경위축을 나타낸다는 ➃번이 틀린 보기입니다.", "B": "관련 강의: 강의 18 신경학적 검사 혼수진단 · 강의 19 신경학적 검사실습", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "25-40", "keys": ["25-40"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>다음은 두부 손상의 진단에 대한 설명이다. 다음 설명 중 옳은 것을 고르시오.<\/div>", "o": ["단순 방사선촬영을 통해서는 두개골의 선상골절을 확인하기 어렵다.", "전산화 단층촬영(CT)를 통해서는 급성 뇌출혈과 같은 병변을 자세히 확인하기 어렵다.", "자기공명영상(MRI)은 전산화 단층촬영(CT)에 비해 뇌실질의 병변을 예민하게 발견할 수 없는 검사이다.", "자발적으로 눈을 뜨고, 적절하고 지남력이 있는 언어반응을 보이며, 명령에 따르는 운동반응을 보인다면, 글라스고우 혼수계수(Glasgow coma scale) 평가에서 총 15점에 해당한다.", "의식 수준 평가에서 반혼수는 외부 자극에 눈을 감거나, 자극부위로 손을 움직이는 등의 간단한 행동을 보이는 상태를 뜻한다."], "a": 3, "A": "④", "E": "두부손상의 진단에서 문제가 출제되었습니다. 24년도 기출이 없어 새로 출제된 문제라고 보시면 됩니다. ① 방사선 검사 단순촬영에서 두개관의 선상 골절을 가장 잘 볼 수 있습니다. ② CT는 급성기 두부 손상 환자의 진단에서 가장 먼저 시행해야 하는 검사로 빠르고 쉽게 급성 뇌 손상 상태를 확인 가능합니다. ③ MRI는 CT에 비하여 뇌실질의 병변을 더욱 민감하게 보여줍니다. ④ 자발적으로 눈을 뜸 = 4점, 적절하고 지남력이 있는 언어반응 = 5점, 명령에 따르는 운동반응 = 6점 ⑤ 반혼수는 강한 자극에 최소한의 반응만을 보이는 상태입니다. 외부 자극에 눈을 감고 자극부위로 손을 움직이는 등 간단한 행동을 보이는 상태는 혼미(stupor)입니다. 22번 신경계학 251020 서종훈P 김채연 (두부, 척추 외상) 3. 진단", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-41", "keys": ["25-41"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>65세 남자가 의식이 없는 상태로 응급실로 내원하였다. 의식 수준 평가에서 반혼수(Semicoma)에 해당되었고, 두부 전산화 단층촬영 검사를 시행한 결과 다음 그림과 같다. 다음 질환에 대한 설명 중 옳은 것을 고르시오.<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["적절한 치료를 받는다면 예후가 좋은 편이다.", "생존한 경우 심각한 후유증 없이 회복되는 경우가 많다.", "주로 외력에 의해 발생하고 뇌실질 표면의 혈관이 손상된 경우가 많다.", "두부 전산화 단층촬영에서 볼록한 렌즈 모양의 고밀도 음영을 확인할 수 있다.", "의식상태가 나쁘지만 수술적 치료보다는 보존적 치료를 시행하는 것이 좋다."], "a": 2, "A": "③", "E": "CT상 초승달 모양의 흰색을 통해 급성 경막하혈종임을 확인할 수 있습니다. 1. 급성 경막하혈종의 경우 예후가 좋지 않습니다. 2. 생존한 경우라도 심각한 후유장애를 남깁니다. 3. 정답입니다. 4. 경막외혈종에 관한 설명입니다. 급성경막하결종의 경우 CT상 초승달 모양이 보입니다. 5. 의식 저하, midline shift 동반 시 응급 개두술이 필요합니다. 2) 경막하혈종(Subdural Hematoma, SDH)", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-16", "keys": ["23-16"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>60세 남자. 5년 전부터 서서히 계단 오르는 것이 힘들어서 내원하였다. 신경계 진찰시 손가락 및 손목 굽힘근 (finger and wrist flexors muscle)과 넙다리네갈래근 (quadriceps femoris muscle)이 양쪽 모두에서 근력이 감소되었으나 우측이 더 심하였다. 혈액 검사에서 CK 수치가 54U/L였고, 근전도 검사에서는 크기가 작은 활동근전위가 관찰 되었다. 다음은 근육조직검사 결과이다. 진단은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "면역-연관 괴사성근염"], "a": 1, "A": "②", "E": "정답률 79% 조직검사 결과, 화살표 방향의 muscle fiber 안에 muscle fiber 안에 vacule이 inclusion된 것과 endomysium 쪽으로 inflammatory cell 증가한 것으로 포함체 근염임을 알 수 있습니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "22-34", "keys": ["22-34", "21-34"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>52세 남자 환자가 약 3개월전부터 발생하여 서서히 진행하는 상하지 근력 저하 주소로 내원하였다. 평지를 걸을 때는 비교적 괜찮았으나, 계단을 오 르고 내릴 때 특히 불편감이 있었으며, 2개월 전부터는 양측 손톱을 스스 로 자를 수 없었다고 한다. 양측 손발의 저린감도 있었다. 신경학적 검사에 서 양측 상하지에서 비교적 대칭적인 근력 저하 및 양측 상하지 원위부에 서 경미한 감각저하가 확인되었다. 상하지 심부건반사는 소실되었다. 신경 전도검사에서 탈수초성 운동-감각 다발신경병증 소견이 보였으며, 뇌척수 액 검사 소견상 세포수는 2/mm3, 단백은 73mg/dL의 소견을 보였으며, 당화혈색소를 포함한 혈액 검사는 모두 정상이였다. 진단은?<\/div>", "o": ["중증근무력증", "저칼륨주기마비", "길랑-바레 증후군", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 4, "A": "⑤", "E": "2021년 64번 주관식문제의 지문이 그대로 출제되었습니다. 지문에는 3개월전부터 상하지의 근력이 서서히 저하됐다는 특징, 심부건검사 소실, 탈수초성 소견을 알려줍니다. 같은 탈수초성 질환인 GBS와 비교를 많이 하셨고 가장 큰 차이점은 만성적이라는 점입니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": false, "ra": "⑤"}, {"id": "22-37", "keys": ["22-37", "21-45", "20-39"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>32세 남자 환자가 주먹을 쥐고 나서 잘 펴지지 않는 증상을 주소로 내원하 였다. 이 증상은 10대 후반부터 발생하였으며, 최근 들어서는 양 손에 힘 이 약해져 젓가락질이 불편해졌다. 신체 검사 상, 측두근과 저작근의 위축 이 관찰되며, 앞머리 탈모가 관찰되었다. 근전도 검사에서는 근긴장방전 (myotonic discharge)가 관찰되었다. 이 환자에게서 이상이 관찰될 수 있 는 유전자는?<\/div>", "o": ["EMD gene", "SOD1 gene", "DMPK gene", "SNCA gene", "RNF213 gene"], "a": 2, "A": "③", "E": "2021 45번과 완전히 동일합니다. 주먹을 쥐고 나서 잘 펴지지 않는 증상에서 myonic dystrophy 임을 추정할 수 있고, 추가적인 소견으로 ‘앞머리 탈모’, ‘측두근과 저작근의 위축’ 등이 관찰되는 특징적인 얼굴 모습이 나타나는 ‘myotonic dystrophy type1’ 임을 알 수 있습니다. 특징적인 얼굴 모습과 근긴장증(myotonia)은 교수님께서 강조하신 부분이니 꼭 외워주세요. DMPK gene과의 관련또한 올해 피마였습니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "연도별 선지 순서가 달라 원래 번호는 2022 ⇒ ③, 2021 ⇒ ①, 2020 ⇒ ①", "img": [], "v": false, "y": [2020, 2021, 2022], "ok": false, "ra": "③"}, {"id": "22-38", "keys": ["22-38"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>55세 여자 환자가 수개월 전부터 발생한 사지 근력 저하를 주소로 내원하 였다. 양 팔을 들어올리기 힘들어 머리를 묶을 수 없으며, 계단을 오를 때 특히 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전부위에서 관찰 되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으 며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었<\/div><div>다. 가장 가능성이 높은 질환은?<\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "얼굴어깨위팔근디스트로피"], "a": 0, "A": "①", "E": "2021년 기출된 내용과 지문은 같고 이번에는 진단을 물어보셨습니다. shawl sign과 사지의 근력저하 손가락 신절부에서의 붉은색 구진으로 피부근염을 의심해야합니다. polymyositis와 감별이 중요합니다.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "21-43", "keys": ["21-43", "20-37"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>44세 여자환자가 안검 하수 및 사지 근력 저하 주소로 내원하였다. 주로 오후로 갈수록 심해지고, 자고 일어나면 좀 더 호전되는 양상을 보였다. 초기에 환자는 눈꺼풀의 쳐짐 현상이 주된 증상 이었으나, 이제는 음식, 특히 고기를 씹지 못할 정도로 심해졌다. 신체 검사상 사지의 근력이 감소하였으나 deep tendon reflexes는 정상이었다. 근생검상 특별한 조직학적 이상 소견은 없었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["만성염증탈수초 다발신경병 (chronic inflammatory demyelinating polyneuropathy, CIDP)", "길랑-바레 증후군 (Guillain-Barre syndrome)", "근위축성측삭경화증 (amyotrophic lateral sclerosis, ALS)", "중증근무력증 (myasthenia gravis)", "베커 근디스트로피 (Becker muscular dystrophy)"], "a": 3, "A": "④", "E": "2022년 35번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 2021년 기출과 지문내용이 똑같습니다. 눈꺼풀의 쳐짐과 오후로 갈수록 심해지고 자고일어나면 호전된다는 양상으로 중증 근무력증을 의심해야합니다. 중증 근무력증의 기전은 아세틸콜린과 그 수용체간의 작용이 저하된다는 점에 있습니다. 그래서 환자중 Anti acetylcholine receptor antibody가 70-80%정도는 양성이 관찰된다고 합니다. 진단, 증상, 신경학적 진찰, 치료등 전반적인 내용이 전부 출제되는 부분이니 잘 공부해주세요.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020, 2021], "ok": false, "ra": "④"}, {"id": "20-27", "keys": ["20-27"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>55세 여자환자가 수년간 쉽게 피로함을 호소하였는데, 주로 오후로 갈수록 심해지고, 자고 일어나면 종 더 호전되는 양상을 보였다. 초기에 환자는 눈꺼풀의 쳐짐 현상이 주된 증상이었으나 이제는 음식 특히 고기를 씹지 못할 정도로 심해졌다. 신체검사상 사지의 근력이 감소하였으나 deep tendon reflexes는 정상이었다. 근생검상 특별한 조직학적 이상소견은 없었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["중증근무력증", "근위축성 측삭경화증", "길랑바레증후군", "베커 근위축증", "다발성 말초신경병증"], "a": 0, "A": "①", "E": "2022년 35번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 를 보이고 혀에 섬유다발수축(fasciculation)이 있다. 심부건반사는 소실되었고 혈청 CK와 감각신경전도는 정상이다. 이 질환의 원인 유전자는?<\/div>", "o": ["SMN1", "DMD", "PMP22", "DMPK", "NF1"], "a": 0, "E": "척수앞뿔 운동신경세포가 소실되는 척수성 근위축증(SMA): 5번 염색체 SMN1 유전자 결실(대부분 엑손 7 결실). DMD는 뒤센/베커 근디스트로피, PMP22는 CMT1A·압박마비취약유전신경병, DMPK는 근긴장디스트로피, NF1은 신경섬유종증 1형.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "2025년 29번 변형", "vn": "증례 틀은 같고 발문을 '병변 위치'에서 '원인 유전자'로 바꾸고 선지 전부 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V02", "ch": 0, "base": "25-24", "lv": "minor", "stem": "<div>10세 남아가 2개월 전부터 반복되는 두통으로 병원에 왔다. 다음 중 뇌 영상 검사가 필요하다고 판단되는 소견은?<\/div>", "o": ["이마 양쪽의 박동성 두통", "빛과 소리에 의해 두통이 악화됨", "잠을 자고 나면 두통이 좋아짐", "새벽에 두통으로 잠에서 깨고 아침에 구토가 동반됨", "어머니의 편두통 가족력"], "a": 3, "E": "소아 두통의 경고 징후(red flag): 수면 중 깨는 두통, 아침 구토, 점점 심해지는 양상, 국소 신경학적 이상(편측 위약 등), 성격·학업 변화 → 두개내압 상승·종괴를 의심해 영상 검사. 양측 박동성·빛 과민·수면 후 호전·가족력은 편두통에 합당한 소견.", "B": "관련 강의: 강의 02 소아신경, 중추신경계질환", "N": "2025년 24번 변형", "vn": "나이·기간과 정답 소견(손 힘 빠짐 → 새벽 각성·아침 구토)을 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V03", "ch": 1, "base": "25-101", "lv": "minor", "stem": "<div>두개내압 상승으로 의식이 저하된 환자의 두개내압 조절 방법으로 옳은 것은?<\/div>", "o": ["과환기로 PaCO2를 25 mmHg 이하로 수일간 유지한다", "침상 머리를 30도 정도 올리고 목이 꺾이지 않게 한다", "저장성(hypotonic) 수액을 충분히 투여한다", "발열은 뇌대사를 줄이므로 해열하지 않는다", "기도 흡인과 기침 유발 처치를 자주 반복한다"], "a": 1, "E": "두개내압 조절: 머리 거상(약 30도)·경정맥 압박 피하기, 고삼투압제(mannitol·고장성 식염수), 단기간 과환기(PaCO2 30~35), 뇌실외배액(EVD), 진정, 저체온/해열. 과도하고 긴 과환기는 뇌허혈을 유발하고, 저장성 수액은 뇌부종을 악화시키며, 발열·기침·흡인은 두개내압을 올린다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "2025년 101번 변형", "vn": "'아닌 것'을 '옳은 것'으로 발문 방향을 바꾸고 선지 수치(PaCO2) 제시", "img": [], "v": true, "ok": false, "y": []}, {"id": "V04", "ch": 1, "base": "25-105", "lv": "minor", "stem": "<div>다음 중 수두증의 수술적 치료법이 아닌 것은?<\/div>", "o": ["V-P shunt (뇌실-복강 단락술)", "V-pleural shunt (뇌실-흉막 단락술)", "Endoscopic third ventriculostomy", "L-P shunt (요추-복강 단락술)", "척수강 내 baclofen 펌프 삽입술"], "a": 4, "E": "수두증 수술: 뇌실-복강(VP)·뇌실-심방(VA)·뇌실-흉막·요추-복강(LP) 단락술, 내시경적 제3뇌실 개창술(ETV, 폐쇄성 수두증). 척수강 내 baclofen 펌프는 경직(spasticity) 치료법이다.", "B": "관련 강의: 강의 11 두개내압항진과 수두증", "N": "2025년 105번 변형", "vn": "선지 2개(V-A shunt → V-pleural shunt, 펌프 → baclofen 펌프)와 순서만 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V05", "ch": 2, "base": "25-91", "lv": "minor", "stem": "<div>68세 남자가 5시간 전 갑자기 발생한 왼쪽 팔다리 위약과 구음장애로 응급실에 왔다. 고혈압과 심방세동이 있다. 혈압 160/95 mmHg이며, 뇌 CT에서 출혈은 없고 CT 혈관조영술에서 오른쪽 중대뇌동맥 M1 폐색이 확인되었다. 가장 적절한 치료는?<\/div>", "o": ["만니톨 투여", "아스피린 투여 후 경과관찰", "동맥 내 혈전제거술", "혈압강하제로 수축기혈압 120 mmHg 미만 유지", "뇌 감압술"], "a": 2, "E": "정맥 내 혈전용해제(tPA)는 증상 발생 4.5시간 이내에만 투여하므로 5시간이 지난 이 환자는 대상이 아니다. 큰 혈관(내경동맥·중대뇌동맥 M1) 폐색은 6시간 이내(영상 선별 시 24시간까지) 동맥 내 혈전제거술이 표준 치료. 급성기 혈압을 과도하게 낮추면 반음영(penumbra) 관류가 줄어든다.", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "2025년 91번 변형", "vn": "증상 발생 시간(1.5시간→5시간)과 혈관 폐색 정보를 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V06", "ch": 2, "base": "21-03", "lv": "minor", "stem": "<div>급성 세균성 뇌막염이 의심되는 성인 환자의 처치로 옳지 않은 것은?<\/div>", "o": ["CT·MRI 결과가 나오기 전이라도 경험적 항생제를 시작한다", "가능하면 항생제 투여 전에 혈액배양 검체를 채취한다", "경험적 항생제로 3세대 cephalosporin과 vancomycin을 정맥 투여한다", "의식이 회복되는 등 증상이 좋아지면 바로 항생제를 끊는다", "항생제와 함께 초기에 dexamethasone을 쓰면 청력 손실 등 합병증을 줄일 수 있다"], "a": 3, "E": "세균성 뇌막염: 지체 없이(영상·검사 결과를 기다리지 않고) 혈액배양 후 경험적 항생제(3세대 cephalosporin + vancomycin, 필요 시 ampicillin)를 최대용량 정맥 투여하고, 대개 10~14일 치료한다. 증상이 좋아졌다고 바로 끊지 않는다. 초기 dexamethasone은 감각신경성 난청 등 합병증 감소에 도움.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "2021년 3번 변형", "vn": "'맞는 것'을 '옳지 않은 것'으로 발문을 뒤집고 선지 3개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V07", "ch": 3, "base": "23-31", "lv": "minor", "stem": "<div>고혈압성 뇌내출혈(hypertensive ICH)이 가장 흔하게 발생하는 부위는?<\/div>", "o": ["시상(thalamus)", "소뇌(cerebellum)", "피각(putamen, 기저핵)", "다리뇌(pons)", "대뇌 피질하 엽(lobar)"], "a": 2, "E": "고혈압성 뇌내출혈은 관통동맥(렌즈핵선조체동맥 등) 손상으로 피각(기저핵) > 시상 > 다리뇌·소뇌 순으로 흔하다. 대뇌 피질하 엽 출혈은 노인에서 아밀로이드 혈관병증을 먼저 생각한다.", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "2023년 31번 변형", "vn": "'호발부위가 아닌 것'을 '가장 흔한 부위'로 바꾸고 선지 일부 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V08", "ch": 3, "base": "23-32", "lv": "minor", "stem": "<div>발생 3시간 된 초급성 뇌경색의 비조영 CT 소견으로 볼 수 없는 것은?<\/div>", "o": ["중대뇌동맥 고밀도 징후(hyperdense MCA sign)", "섬엽 띠(insular ribbon) 소실", "렌즈핵 경계가 불분명해짐", "고리 모양 조영증강(ring enhancement)", "정상 소견"], "a": 3, "E": "초급성 뇌경색 CT는 정상일 수 있고, 조기 소견으로 고밀도 MCA 징후, 섬엽 띠 소실, 렌즈핵 경계 소실, 회백질-백질 경계 소실이 보인다. 고리 모양 조영증강은 농양·종양 소견이며, 경색의 조영증강은 아급성기(수일~수주)의 이랑 모양이다.", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "2023년 32번 변형", "vn": "시간 정보를 넣고 선지 3개(mass effect·hypoattenuation·contrast enhancement)를 다른 조기 소견과 고리 조영증강으로 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V09", "ch": 4, "base": "23-68", "lv": "minor", "stem": "<div>다음 중 척수 경막외 농양(spinal epidural abscess)에 대한 설명으로 틀린 것은?<\/div>", "o": ["당뇨병, 면역저하, 알코올중독, 정맥 약물 사용이 소인이 된다", "골수염이 동반된 경우에도 항생제는 3~4주면 충분하다", "배부통, 발열과 함께 척수 압박에 의한 신경학적 결손이 생길 수 있다", "MRI 조영증강에서 테두리 조영증강을 보이는 경막외 종괴로 보인다", "신경학적 결손이 진행하면 감압·배농 수술을 시행한다"], "a": 1, "E": "항생제 기간은 골수염이 없으면 3~4주, 골수염이 동반되면 6~8주. 소인: 당뇨·만성신부전·면역저하·알코올중독·악성종양·척추 시술. MRI가 진단의 기준이며 T1 조영 시 테두리 조영증강. 신경학적 결손이 진행하거나 크기가 크면 감압·배농.", "B": "관련 강의: 강의 07 감염성 질환2", "N": "2023년 68번 변형", "vn": "틀린 선지를 '골수염 없을 때 6~8주'에서 '골수염 있을 때 3~4주'로 수치 방향만 바꾸고 나머지 선지 표현 변경", "img": [], "v": true, "ok": false, "y": []}, {"id": "V10", "ch": 5, "base": "25-114", "lv": "minor", "stem": "<div>선천성 기형에서 Chiari 1형 기형을 나타내는 특징을 모두 고르세요.<br>1. 소뇌 편도가 대후두공을 통해 하방으로 전위<br>2. 척수공동증(syringomyelia)이 동반될 수 있음<br>3. 제4뇌실의 낭종성 확장<br>4. 소뇌 충부의 무형성이나 형성 저하<\/div>", "o": ["1, 2", "1, 2, 3", "1, 3, 4", "2, 3, 4", "3, 4"], "a": 0, "E": "Chiari 1형: 소뇌 편도가 대후두공 아래로 내려오고 척수공동증이 흔히 동반된다. 제4뇌실 낭종성 확장과 소뇌 충부 형성 저하는 Dandy-Walker 기형의 특징.", "B": "관련 강의: 강의 09 중추신경계, 선천성질환", "N": "2025년 114번 변형", "vn": "같은 보기 묶음·선지 형식으로 묻는 질환만 Dandy-Walker에서 Chiari 1형으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V11", "ch": 6, "base": "25-111", "lv": "minor", "stem": "<div>8세 남아가 Lennox-Gastaut 증후군으로 여러 항경련제를 복용하고 있지만 하루에도 수차례 갑자기 힘이 빠지며 넘어지는 무긴장 발작(drop attack)으로 자주 다친다. 이 발작을 줄이기 위해 고려할 수 있는 수술은?<\/div>", "o": ["뇌반구 절제술(hemispherectomy)", "선택적 편도해마 절제술", "전방 측두엽 절제술(anterior temporal lobectomy)", "감마나이프 수술", "뇌량 절제술(corpus callosotomy)"], "a": 4, "E": "전신으로 퍼지는 무긴장·긴장 발작(drop attack)에는 양쪽 반구 사이 전파를 끊는 완화적 뇌량 절제술을 고려한다. 측두엽 절제·편도해마 절제는 내측 측두엽 뇌전증, 반구 절제술은 한쪽 반구 전체의 병변(Rasmussen 뇌염 등)에 시행.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "2025년 111번 변형", "vn": "증례(측두엽 뇌전증 성인 → 무긴장 발작 소아)와 정답 수술을 바꾸고 선지 1개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V12", "ch": 10, "base": "25-41", "lv": "minor", "stem": "<div>25세 남자가 오토바이 사고 후 잠시 의식을 잃었다가 깨어나 대화를 하던 중 2시간 뒤 다시 의식이 나빠져 응급실에 왔다. 두부 CT에서 측두부에 볼록 렌즈 모양의 고밀도 음영이 보인다. 이 질환에 대한 설명으로 옳은 것은?<\/div>", "o": ["주로 뇌 표면의 교정정맥(bridging vein)이 찢어져 발생한다", "CT에서 초승달 모양으로 보인다", "의식 명료기(lucid interval)가 있을 수 있다", "급성 경막하출혈보다 예후가 나쁘다", "혈종이 커도 수술보다 보존적 치료를 우선한다"], "a": 2, "E": "급성 경막외출혈: 측두골 골절에 따른 중경막동맥 손상, 볼록 렌즈 모양, 의식 명료기 후 악화가 특징. 빨리 제거하면 예후가 좋다(경막하출혈보다 좋음). 교정정맥 손상·초승달 모양은 경막하출혈.", "B": "관련 강의: 강의 22 외상(두부, 척추)", "N": "2025년 41번 변형", "vn": "증례를 경막하출혈에서 경막외출혈로 바꾸고 같은 형식의 진술형 선지를 그에 맞게 다시 구성", "img": [], "v": true, "ok": false, "y": []}, {"id": "V13", "ch": 11, "base": "22-34", "lv": "minor", "stem": "<div>45세 여자가 2주 전 심한 설사를 앓은 뒤 5일 전부터 양다리에 힘이 빠지기 시작해 팔까지 진행하였다. 상하지 심부건반사가 소실되었고 감각은 비교적 보존되었다. 뇌척수액 검사에서 세포 3/mm3, 단백 95 mg/dL이었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["중증근무력증", "길랑-바레 증후군", "저칼륨주기마비", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 1, "E": "위장관 감염 후 수일~4주 안에 빠르게 진행하는 상행성 대칭 위약 + 건반사 소실 + 뇌척수액 단백-세포 해리 → 길랑-바레 증후군(치료: IVIG 또는 혈장교환). 같은 소견이 8주 넘게 서서히 진행하면 CIDP.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "2022년 34번 변형", "vn": "진행 기간(3개월 서서히 → 수일 급성)과 선행 감염을 바꿔 정답이 CIDP에서 길랑-바레로 바뀌게 함", "img": [], "v": true, "ok": false, "y": []}, {"id": "V14", "ch": 11, "base": "22-37", "lv": "minor", "stem": "<div>22세 남자가 주먹을 쥔 뒤 잘 펴지지 않는 증상으로 왔다. 측두근·저작근 위축, 앞머리 탈모가 있고 근전도에서 근긴장방전이 보인다. 아버지도 비슷한 증상이 있으나 환자보다 늦게 시작되었다. 이 질환의 유전학적 기전은?<\/div>", "o": ["HTT 유전자의 CAG 반복 확장", "PMP22 유전자 중복", "SMN1 유전자 결실", "DMPK 유전자의 CTG 반복 확장", "Dystrophin 유전자 결실"], "a": 3, "E": "근긴장디스트로피 1형: DMPK 유전자 3' 비번역 부위의 CTG 삼핵산 반복 확장, 상염색체 우성, 대를 거듭할수록 일찍·심하게 나타나는 표현촉진(anticipation). CAG 반복은 헌팅턴병, PMP22 중복은 CMT1A, SMN1 결실은 척수성 근위축증, dystrophin 결실은 뒤센/베커.", "B": "관련 강의: 강의 25 근접합부, 근육질환", "N": "2022년 37번 변형", "vn": "같은 증례에 가족력을 더하고 발문을 '유전자'에서 '유전학적 기전'으로 바꾸고 선지 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V15", "ch": 12, "base": "25-01", "lv": "minor", "stem": "<div>45세 남자가 시야장애로 왔다. 5년 전부터 손발이 커지고 턱이 나왔다고 한다. 시야검사에서 양측두 반맹이 있고 MRI에서 2.5 cm의 뇌하수체 거대샘종이 보이며, 포도당 부하 후에도 GH가 억제되지 않았다. 가장 우선 고려할 치료는?<\/div>", "o": ["경접형동 종양제거술", "경과관찰", "약물치료(bromocriptine)", "방사선치료", "방사선수술"], "a": 0, "E": "GH 분비 샘종(말단비대증)은 경접형동 수술(TSA)로 제거하는 것이 1차 치료이고, 남거나 재발하면 octreotide 등 약물·방사선 치료를 보조로 쓴다. 약물(도파민 작용제)을 1차로 쓰는 것은 프로락틴 분비 샘종.", "B": "관련 강의: 강의 27 뇌종양", "N": "2025년 1번 변형", "vn": "같은 시야장애 증례에서 호르몬(PRL 400 → GH 과다)을 바꿔 정답이 약물치료에서 수술로 바뀌게 함", "img": [], "v": true, "ok": false, "y": []}, {"id": "V16", "ch": 12, "base": "25-02", "lv": "minor", "stem": "<div>오른쪽 위약감으로 시행한 조영증강 MRI에서 가운데가 괴사된 고리 모양 조영증강 종양이 보였고, 수술 후 IDH 야생형 교모세포종으로 진단되었다. 이 종양과 검사에 대한 설명으로 옳은 것은?<\/div>", "o": ["DTI tractogram은 종양의 혈류 관류를 보여준다", "PWI는 종양과 피질척수로의 위치 관계를 보여준다", "MRS에서 NAA/choline 비가 증가한다", "IDH 변이형 성상세포종보다 예후가 나쁘다", "1p/19q 동시 결실이 진단의 필수 소견이다"], "a": 3, "E": "IDH 야생형 교모세포종(WHO 4등급)은 IDH 변이형 성상세포종·핍지교종보다 예후가 나쁘다. DTI는 피질척수로 등 백질 경로, PWI는 관류, MRS는 대사(종양에서 NAA 감소·choline 증가 → NAA/Cho 감소). 1p/19q 동시 결실은 핍지교종의 진단 표지.", "B": "관련 강의: 강의 27 뇌종양", "N": "2025년 2번 변형", "vn": "같은 영상 검사 진술형에서 정답 진술을 MRS에서 IDH 예후로 바꾸고 선지 2개 교체", "img": [], "v": true, "ok": false, "y": []}, {"id": "V17", "ch": 7, "base": "25-61", "lv": "major", "stem": "<div>기억의 종류와 주로 관여하는 뇌 구조를 옳게 짝지은 것을 모두 고르시오.<br>ㄱ. 일화기억 - 해마<br>ㄴ. 절차기억 - 기저핵<br>ㄷ. 공포 조건화 - 편도체<br>ㄹ. 작업기억 - 후두엽<\/div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 1, "E": "일화기억(서술기억)은 해마·내측 측두엽, 절차기억(운동기술·습관)은 기저핵과 소뇌, 조건화 기억은 소뇌(운동 반사 조건화)와 편도체(공포 조건화), 작업기억은 전전두엽이 주로 담당한다. 후두엽은 시각 처리.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "2025년 61번 변형", "vn": "단일 구조를 묻던 형식을 기억 종류-구조 짝짓기 조합형으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V18", "ch": 7, "base": "25-70", "lv": "major", "stem": "<div>78세 여자가 건강검진에서 인지 상태를 물어보았다. 다음 중 정상 노화로 설명하기 어려워 추가 평가가 필요한 소견은?<\/div>", "o": ["정보 처리 속도가 느려졌다", "여러 일을 동시에 기억하며 처리하기 어렵다", "새로 만난 사람의 이름이 바로 떠오르지 않는다", "어휘력과 상식은 예전과 같다", "20년 동안 다니던 동네에서 길을 잃는다"], "a": 4, "E": "정상 노화에서는 처리 속도·작업기억·자유회상이 떨어지지만 어휘(결정성 지능)는 유지된다. 익숙한 곳에서 길을 잃는 것은 시공간 기능·일상 기능 저하로 치매(알츠하이머병 등)를 의심해 평가해야 한다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "2025년 70번 변형", "vn": "'떨어지지 않는 인지영역'을 묻던 개념형을 노인 증례에서 '비정상 소견'을 고르는 형식으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V19", "ch": 8, "base": "25-46", "lv": "major", "stem": "<div>30세 남자가 유리에 손목을 베여 정중신경이 완전히 절단되었다. 2주 뒤 절단부보다 원위부 신경을 조직검사했을 때 예상되는 소견은?<\/div>", "o": ["절단부 근위부 축삭 전체가 세포체까지 소실된다", "신경세포체가 즉시 괴사해 사라진다", "원위부 축삭과 수초가 분절되고 대식세포가 이를 탐식한다", "수초만 선택적으로 소실되고 축삭은 보존된다", "중추신경보다 재생이 불량해 재생 시도가 보이지 않는다"], "a": 2, "E": "Waller 변성: 절단된 축삭의 원위부에서 축삭과 수초가 분절·변성되고 대식세포·슈반세포가 잔해를 치운다. 세포체는 염색질 융해(chromatolysis)를 보이지만 즉시 죽지 않으며, 말초신경은 슈반세포 덕분에 중추신경보다 재생이 잘 된다. 수초만 선택 소실은 탈수초 질환.", "B": "관련 강의: 강의 15 신경 병리", "N": "2025년 46번 변형", "vn": "개념 진술형을 신경 절단 증례의 조직 소견을 묻는 형식으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V20", "ch": 8, "base": "25-48", "lv": "major", "stem": "<div>12세 남아가 2년 전부터 계단 오르기가 힘들다. 종아리가 굵고 단단하며 아직 혼자 걸을 수 있다. 혈청 CK는 4,500 U/L이고, 근육생검의 dystrophin 면역염색에서 염색이 약하고 불규칙하게 보였다. 가장 가능성이 높은 진단은?<\/div>", "o": ["뒤센 근디스트로피", "근긴장디스트로피", "척수성 근위축증", "다발근염", "베커 근디스트로피"], "a": 4, "E": "베커 근디스트로피: dystrophin이 감소하거나 비정상 형태로 남아 있어 뒤센보다 늦게 시작하고(5~15세) 천천히 진행하며 15세 이후에도 보행이 가능하다. 뒤센은 dystrophin이 완전히 결실되어 면역염색에서 보이지 않고 대개 12세 전 보행을 잃는다.", "B": "관련 강의: 강의 15 신경 병리", "N": "2025년 48번 변형", "vn": "병리 진술형을 증례와 면역염색 소견으로 진단하는 형식으로 바꿈", "img": [], "v": true, "ok": false, "y": []}, {"id": "V21", "ch": 9, "base": "25-07", "lv": "major", "stem": "<div>55세 남자가 걸을 때 몸통이 흔들리고 다리를 넓게 벌려 걷는다. 앉은 자세에서도 <script>/* 이 과목은 자동 생성 문항이 없습니다 */</script>
<script>

const LS={get(k,d){try{return JSON.parse(localStorage.getItem(K(k)))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}};
/* 기존 내분비 사이트의 오답노트(endo_wrong) 이어받기 */
if(M.slug==='endo'){try{for(const k of['wrong','wrong_dyn','mix'])if(localStorage.getItem('endo_'+k)!==null&&localStorage.getItem(K(k))===null)localStorage.setItem(K(k),localStorage.getItem('endo_'+k))}catch(e){}}
let wrong=new Set(LS.get('wrong',[]));let wdyn=LS.get('wrong_dyn',{});

 ${YEARS.length>1?`<div class="lbl">출제 연도</div><div class="row">${YEARS.map(y=>`<button class="chip ${st.yrs.has(y)?'on':''}" data-y="${y}">${y}</button>`).join('')}</div>`:''}
 <div class="lbl">문제 종류</div><div class="row" id="kind">${[['all','기출+변형'],['past','기출(원본)만'],...(nv||hasGen?[['var','변형만']]:[]),['wrong',`오답노트 (${wrong.size+Object.keys(wdyn).length})`]].map(([k,t])=>`<button class="chip ${st.kind===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
 <div class="lbl">순서 · 문항 수</div><div class="row" id="ord">${[['shuffle','무작위'],['seq','문제집 순서']].map(([k,t])=>`<button class="chip ${st.order===k?'on':''}" data-o="${k}">${t}</button>`).join('')}
 <span style="width:12px"></span>${[10,20,50,0].map(n=>`<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n||'전부'}</button>`).join('')}</div>
 <div class="lbl">선지 순서</div><div class="row">${[[true,'섞기'],[false,'원래 순서']].map(([k,t])=>`<button class="chip ${st.mix===k?'on':''}" data-m="${k}">${t}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px;justify-content:space-between"><span class="small">선택된 고정 문항 ${p.length}개${hasGen&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size?' + 매번 새로 만드는 변형 문항':''}</span><button class="go" id="start" ${p.length?'':'disabled'}>시작</button></div></div>
 <div class="panel small">${rep.length?`<b>반복</b> 표시 교수님(${esc([...new Set(rep)].join('·'))})은 해마다 같은 문항을 거의 그대로 내셔서 기출만 나옵니다. `:''}<b>소폭 변형</b> 표시 교수님은 보기·수치·발문만 바꿔 내시고, <b>대폭 변형</b> 표시 교수님은 같은 개념을 다른 증례나 형식으로 내셔서, 그 수준에 맞춘 예상 변형 문항을 함께 실었습니다.<br>기출 문항의 연도 태그는 같은 선지·정답으로 출제된 해를 모두 표시합니다. 보라색 <b style="color:var(--var)">변형</b> 문항은 기출을 바탕으로 만든 예상 문제이고, 원본 문항 번호를 함께 표시합니다. 틀린 문제는 이 브라우저의 오답노트에 저장됩니다.</div>`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(st.chs.size===M.ch.length){st.chs=new Set([c])}else{st.chs.has(c)?st.chs.delete(c):st.chs.add(c);if(!st.chs.size)st.chs=new Set(M.ch.map(c=>c.id))}home()});
 app.querySelector('[data-all]').onclick=()=>{st.chs=new Set(M.ch.map(c=>c.id));home()};
 app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y;if(st.yrs.size===YEARS.length){st.yrs=new Set([y])}else{st.yrs.has(y)?st.yrs.delete(y):st.yrs.add(y);if(!st.yrs.size)st.yrs=new Set(YEARS)}home()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.order=b.dataset.o;home()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mix=b.dataset.m==='true';LS.set('mix',st.mix);home()});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
 $('#start').onclick=()=>{run={q:build(),i:0,ans:{}};show()};
}
function baseTag(x){const b=byId[x.base];return b?`원본 ${b.keys.map(k=>`20${k.slice(0,2)} #${k.slice(3).replace('-1','')}`).join(', ')}`:(x.N||'')}
function tags(x){const u=x.ok===false?'<span class="u">미검증</span>':'';
 if(x.v)return `<span class="v">변형${x.lv?' · '+(LVL[x.lv]||x.lv):''}</span>${u}<span class="g">${esc(x.dyn?x.N:baseTag(x))}</span>`;
 return x.keys.map(k=>`<span>20${k.slice(0,2)} #${k.slice(3).replace('-1','')}</span>`).join('')+'<span class="y">원본</span>'+u+`<span class="g">${esc(x.g)}</span>`}
function show(){
 const x=run.q[run.i],a=run.ans[x.id];const done=a!==undefined;
 if(!run.perm)run.perm={};if(!run.perm[x.id])run.perm[x.id]=st.mix?shuffle(x.o.map((_,i)=>i)):x.o.map((_,i)=>i);
 const P=run.perm[x.id],moved=P.some((v,i)=>v!==i);
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${Object.entries(run.ans).filter(([id,v])=>v===run.q.find(q=>q.id===id).a).length}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div>${P.map((i,pos)=>`<button class="opt ${done?(i===x.a?'ok':(i===a?'bad':'')):''}" data-i="${i}" ${done?'disabled':''}><b>${CIR[pos]}</b>${esc(x.o[i])}${done&&moved?`<span class="orig">원래 ${CIR[i]}</span>`:''}</button>`).join('')}</div>
 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'맞았습니다':'틀렸습니다'} · 정답 ${CIR[P.indexOf(x.a)]}${moved?` <span class="origh">(원래 번호 ${x.v?CIR[x.a]:esc(x.A)} · 해설의 선지 번호는 원래 순서 기준)</span>`:(x.v?'':(x.A&&x.A.length>1?` <span class="origh">${esc(x.A)}</span>`:''))}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.v&&!x.dyn&&x.N?`<div class="lv">${esc(x.N)}</div>`:''}${x.ok===false?'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>':''}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(x.dyn){if(i===x.a)delete wdyn[x.id];else wdyn[x.id]=x;LS.set('wrong_dyn',wdyn)}else{if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>run.ans[x.id]===x.a);const bad=run.q.filter(x=>run.ans[x.id]!==x.a);
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="again">같은 설정으로 새로 풀기</button> ${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</span></div></div>`;
 $('#home').onclick=home;$('#again').onclick=()=>{run={q:build(),i:0,ans:{}};show();scrollTo(0,0)};
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
