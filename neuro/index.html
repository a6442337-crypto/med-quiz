증 환자의 소견에는 hypomelanotic macule, 얼굴의 angiofibroma, Shagreen patch, periungual fibroma, cardiac rhabdomyoma 등이 있습니다. Cardiac rhabdomyoma는 올해 교수님께서 강조하셨던 질환으로 결절경화증 임상양상 중 가장 먼저 나타나는 소견입니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-32", "keys": ["25-32"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>10세 남아가 경련으로 병원에 왔다. 1주일 전 잠이 들고 30분후 우측 얼굴과 입 주변이 굳어지고 움찔거리는 양상의 경련을 했었다고 하며, 1일전 밤에도 같은 시간대에 비슷한 양상의 경련이 있었다. 시행한 뇌파검사는 다음과 같았다. 상기 환아 에서 가장 먼저 사용해 볼 수 있는 항경련제는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["발프로산", "페노바비탈", "클로나제팜", "에토숙시미드", "옥시카르바제핀"], "a": 4, "A": "⑤", "E": "정답률 90% 10세의 남아가 밤중에 자다가 얼굴, 입 주변이 굳거나 발작하는 부분발작을 보이고 있습니다. EEG 상 C파와 T파가 만나는 부분에서 이상이 생기는 centrotemporal spike가 나타납니다. 환자는 BCECTS를 앓고 있으며 치료제는 Oxcarbazepine, Carbamazepine입니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-33", "keys": ["25-33"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>4개월 여아가 경련을 했다가 병원에 왔다. 39도 고열과 함께좌측 팔 다리를 까닥거리는 양상으로 5분간 경련을 했다고 한다. 과거에 경련이나 신경학적 이상소견은 없었으며, 정상 발달 소견을 보였다. 가족력에서 2살 위의 오빠가 열성경련이2차례 있었다고 한다. 뇌척수액 검사 및 뇌파검사는 정상이었다. 이 환아의 병력 중 뇌전증 이행 확률을 높이는 소견은?<\/div>", "o": ["경련 발생 나이", "경련 지속시간", "경련 형태", "발달 상태", "열성 경련의 가족력"], "a": 2, "A": "③", "E": "정답률 50% 25년도 강의안에 새로 추가된 부분에서 출제되었습니다. 소아 열성 경련에서 뇌전증 이행 확률이 높은 경우는 다음과 같습니다. complex FS, Epilepsy familial hx (뇌전증 가족력), Developmental delay, Underlying neurologic disease ①경련 발생 나이는 위 조건에 해당하지 않습니다. ②경련 지속시간이 15분 초과일때 complex FS에 해당하기 때문에 경련 지속시간도 해당하지 않습니다. 정지연 교수님께서 2번 오답이 많았고, 위 문제에서 5분은 그렇게 긴 시간이 아니며 한번 하고 끝났기 때문에 답이 아니라고 하셨습니다. ③simple FS가 아닌 complex FS 형태에서 뇌전증 이행 확률이 높기 때문에 정답입니다. ④발달상태가 아닌 발달 지연의 경우입니다. ⑤열성 경련의 가족력이 아닌 뇌전증의 가족력입니다. 27번 신경계학 251021 안지예P 손호영 (소아 경련성 질환)", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-23", "keys": ["23-23"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>8세 남아가 경련으로 병원에 왔다. 발달은 정상이었고 내원당시 39.1도의 열이 있었다. 편도 주위 발적과 삼출물이 있었다. 추후 뇌전증 가능성 가장 적은 것은?<\/div>", "o": ["4시간 전 같은 양상 경련", "20분 동안 전신강직간대 경련", "부모의 열성경련 가족력", "경련 후 오른팔 마비 1시간 지속", "왼쪽 얼굴과 팔다리 떨리는 경련"], "a": 2, "A": "③", "E": "환자는 열성 경련을 하고 있습니다. simple FS라면 예후가 좋지만 complex FS의 경우 뇌전증의 시작(약 9%에서)이 될 수 있습니다. 감별할 수 있는 조건은 1. 하루 안에 2번의 경련 2. 부분 발작 3. 15분 이상의 발작 4. 경련 후 마비 상태 지속 등이 있습니다. ① 4시간 전 같은 양상 경련→ 하루 안에 2번의 경련 ② 20분 동안 전신강직간대 경련→ 15분 이상의 발작 ④ 경련 후 오른팔 마비 1시간 지속→ 경련 후 마비 상태 지속 ⑤ 왼쪽 얼굴과 팔다리 떨리는 경련→ 부분 발작 가족력의 경우 확인 한다고는 언급하셨지만 예후에 영향을 미치는 중요한 인자는 아닙니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-24", "keys": ["23-24"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>12세 남아가 경련을 했다. 방문 당시 의식 상태는 양호하였고 밤에 잠을 자던 중 우측 얼굴과 입주변이 움찔거리더니 전신이 굳고 뻣뻣해지는 양상으로 3분간 경련이 있었다고 한다. 평가 위해 시행한 뇌 자기공명검사에서는 이상 없었고 시행한 뇌파검사는 다음과 같았다. 가장 먼저 사용해볼 수 있는 항뇌전증약은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["Diazepam", "Vigabatrin", "Ethosuximide", "Valproic acid", "Oxcarbazepine"], "a": 4, "A": "⑤", "E": "12세 남아라는 점에서 소아기 발작 3개를 먼저 떠올릴 수 있습니다. LGS, CAE, BCECTS입니다. 꼭 이렇게 접근하지 않아도 밤에 부분발작을 일으킨다는 점에서 Benign Rolandic Epilepsy with centrotemporal spike를 떠올릴 수 있습니다. Carbamazepine, Oxcarbazepine 사용합니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "22-17", "keys": ["22-17"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>9개월 여아가 자주 움찔거린다고 병원에 방문 하였다. 보호자가 가져온 비디오에서 환자는 누워 놀고 있는 상태에서 양측의 팔다리를 놀란 듯이 갑자기 뻗는 모습이 5-10초 간격으로 10번 이상 반복 되는 모습을 보였다. 주산기에 특별한 문제는 없었고, 4개월까지 목가누기, 뒤집기도 잘 하였으나 이후에 혼자 앉거나 기지는 못한다고 하였다. 뇌파는 다음과 같았다. 치료는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["oxcarbazepine", "prednisolone", "valproic acid", "ethosuximide", "clonazepam"], "a": 1, "A": "②", "E": "(정답률 81%) 3-9개월 사이에 움찔거리는 연축이 일어나고, 5-10초 간격으로 계속 움찔하는 군집성 형태를 보이며 뇌파검사에서 진폭이 높고 뇌파의 형태가 정해지지 않고 여러 가지 뇌파가 섞여 엉켜 있는 모습을 보이기 때문에 West syndrome입니다. 치료는 ACTH, Prednisolone이 1st choice입니다. 참고로 ③valproic acid, ⑤clonazepam은 ACTH, Prednisolone, Vigabatrin에 효과가 없을 때 사용합니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "22-18", "keys": ["22-18"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>6세 남아가 자주 멍해지는 모습을 보여 병원에 방문하였다. 하루에도 자주 멍해지며 진료실에서 과호흡 2분간 유도할 때 호흡 멈추고 7초간 멍해지는 모습을 보이다가 이내 과호흡을 지속했다. 시행한 뇌파검사는 다음과 같았다. 진단은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["myoclonic atonic epilepsy", "landau-kleffener syndrome", "juvenile myoclonic epilepsy", "childhood absence epilepsy", "benign rolandic epilepsy"], "a": 3, "A": "④", "E": "(정답률95%) 6-7세에 주로 발병하고, 과호흡으로 인해 유발되며, absence seizure 양상을 보입니다. 또한 뇌파에서 특징적 소견인 3Hz spike wave complex가 관찰됩니다. 따라서 진단은 Childhood Absence Epilepsy(CAE)입니다.", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "21-21", "keys": ["21-21"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>3세 남아가 두통으로 응급실에 왔다. 3일 전부터 열이 나고 목이 아픈 증상에 대한 치료를 받았으나 호전되지 않았다. 1일 전부터 심한 두통이 발생하였으며 토하기 시작하였다. 체온 39.4°c, 경부경직과 커니그(Kernig) 징후 양성이었다. 검사 결과는 다음과 같았다. 가장 가능성이 있는 진단은?<\/div><div>혈액: 혈색소 13.4g/dL, 백혈구 17,500/mm3(중성구 80%, 림프구 20%), 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL<\/div><div>뇌척수액: 압력 240mmH20, 단백질 212mg/dL, 포도당 25mg/dL 백혈구 1,450/mm3 (중성구 90%, 림프구 10%)<\/div>", "o": ["결핵 수막염", "세균 수막염", "바이러스 수막염", "뇌출혈", "열성경련"], "a": 1, "A": "②", "E": "2022년 16번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 발열 및 두통이 있고, 식욕부진, 구토, 혼수 증상을 보이고 경부강직 및 커니그 징후 양성을 보였기 때문에 세균성 수막염입니다. 출혈성 경향이 있거나, 뇌압이 높다고 의심되거나 vital이 불안정할 때 요추천자를 시행하지 않습니다. 1번 선지 – 교수님) 백혈구 숫자는 특별히 상관은 없다. 2번 선지 - 혈소판 수 15000으로, 심한 혈소판 감소증인 20000이하에 해당합니다. 교수님 피드백) 5만 이상이어야 검사가 가능하고 바늘이 들어간 자리에 혈종이 생길 수 있어 금기 3번 선지 – 뇌 안에 출혈성 병변이나 mass가 있어 3번 뇌신경이 압박되면 한쪽 동공의 크기가 변합니다. 뇌압 상승 소견! 4번 선지 – 급성 세균성 수막염에서 겉질 제거 경직자세가 나타납니다. 5번 선지 – 뇌압 상승 소견입니다. ", "B": "관련 강의: 강의 08 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "②"}, {"id": "25-29", "keys": ["25-29", "21-22"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>4개월 남아가 목을 가누지 못한다고 병원에 왔다. 신생아기에 호흡곤란과 수유장애가 있었다고 한다. 진찰실에서 다음과 같은 자세로 누워 있었고, 혀에서 연축이 관찰되었다. 신체검진에서 심부건 반사는 관찰되지 않았으며 근전도 및 혈청 크레아틴키나아제 (CK)는 정상이었다. 상기 환자의 질환에서 병변의 위치는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["근육(Muscle)", "말초신경(Peripheral nerve)", "피라미드로(pyramidal tract)", "신경근이음부(neuromuscular junction)", "척수앞뿔운동신경세포(Motor neurons of anterior horn)"], "a": 4, "A": "⑤", "E": "정답률 86% 22년도 기출문제와 동일한 문제입니다. 사진은 frog leg posture를나타내고, 목을 가누지 못하며 호흡곤란과 수유 장애, 혀 연축이 있습니다. 해당 질환은 SMA의 1형입니다. SMA(spinal muscular atrophy, 척수성근위축증)은 Spinal cord의 anterior horn에 병변이 생긴 것입니다. SMA (spinal muscular atrophy, 척수성근위축증) 21,22,21,22,23,", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ⑤, 2021 ⇒ ④", "img": [], "v": false, "y": [2021, 2025], "ok": false, "ra": "⑤"}, {"id": "25-30", "keys": ["25-30"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>13세 여아가 2일전부터 아침부터 걷지 않으려는 모습을 보여 병원을 방문하였다. 2주전에 설사 증상이 있었다고 하며, 병원 방문 당시 양측 다리 모두 근력이 약화 되었다. 신체 검진상 양측 다리의 심부건 반사가 소실되어 있었다. 다음날부터 상지 의 마비도 진행하였고, 음식을 삼킬 때 기침 증상이 발생하였다. 신경전도 검사에서 운동신경전도는 정상치의 25%로 감소하였다. 뇌척수액 검사 소견은 다음과 같다. 상기 환자의 질환에서 병변의 위치는? 백혈구 4/mm3, 적혈구 0/mm3, 포도당 70mg/dL(혈청치의 70%), 단백질 105mg/dL(참고치, 20~45mg/dL)<\/div>", "o": ["근육(Muscle)", "말초신경(Peripheral nerve)", "피라미드로(pyramidal tract)", "신경근이음부(neuromuscular junction)", "척수앞뿔운동신경세포(Motor neurons of anterior horn)"], "a": 1, "A": "②", "E": "정답률 91% 23년도 기출문제와 지문은 매우 유사하지만 선지가 바뀌었습니다. 2주 전부터 설사 증상이 있었다는 것은 선행 감염이 있었음을 의미합니다. 신체검진상 양측 다리 DTR이 소실되었으며 하지의 근력이 먼저 소실된 후 다음날 상지가 마비되었다는 점에서 Ascending symmetric paralysis를 보이는 GBS(Guilliain-Barre syndrome)임을 알 수 있습니다. Bell palsy, GBS, Charcot-Marie-Tooth disease는 말초신경질환해 해당합니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-31", "keys": ["25-31"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>11세 남아가 1개월 전부터 다리에 힘이 없어진다고 외래를 방문하였다. 아침에는 정상이었으나 오후가 되면 증상이 심해졌다. 눈이 저절로 감기고 1분 동안 위를 바라보게 하니 사물이두 개로 보인다고 하였고, 누운 자세로 머리를 들게 하니 수초를 버티지 못하였다. 주먹을 쥐었다 폈다 반복시키자 손에 힘이 쉽게 빠졌다. 상기 질환의 치료 중 기전이 다른 하나는?<\/div>", "o": ["IVIG", "Steroid", "Azathioprine", "Pyridostgmine", "Plasmapheresis"], "a": 3, "A": "④", "E": "정답률 65% 아침에는 정상이었으나 오후가 되면 힘이 없어지는 증상이 심해진다는 것, 복시(diplopia)가 있다는 것으로 중증근무력증(MG)을 강하게 의심할 수 있습니다. Ptosis가 심해 머리를 오랫동안 들고 있지 못한다는 것도 MG를 나타내는 소견입니다. MG는 신경근 접합부의 부위에 존재하는 AChR에 대한 자가항체가 생성되어 신경자극에 의한 acetylcholine의 결합 기회가 감소돼 근수축이 점점 약화되는 자가면역 질환입니다. MG의 치료는 1. 신경전달을 강화해 증상을 개선하거나, 2. 면역반응을 조절하거나 항체를 제거의 두 가지 경우로 나눌 수 있습니다. IVIG, Plasmapheresis는 AChR 항체를 제거하며 steroid, azathioprine은 면역 억제 역할을 합니다. 반면, pyridostigmine은 anti-cholinesterase로 Ach를 파괴하는 cholinesterase를 억제해 Ach의 농도를 높여주는 것입니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "23-41", "keys": ["23-41"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>5세 남아가 2일전부터 아침부터 걷지 않으려는 모습을 보여 병원을 방문하였다. 2주전에 설사 증상이 있었다고 하며, 병원 방문 당시 양측 다리 모두 근력이 약화 되었다. 신체 검진상 양측 다리의 심부건 반사가 소실되어 있었다. 다음날부터 상지 의 마비도 진행하였고, 음식을 삼킬 때 기침 증상이 발생하였다. 신경전도 검사에서 운동신경전도는 정상치의 25%로 감소하였다. 뇌척수액 검사 소견은 다음과 같다. 치료는? 백혈구 4/mm3, 적혈구 0/mm3, 포도당 70mg/dL(혈청치의 70%), 단백질 105mg/dL(참고치, 20~45mg/dL)<\/div>", "o": ["만니톨", "항생제", "항바이러스제", "정맥 내 스테로이드", "정맥 내 면역글로불린"], "a": 4, "A": "⑤", "E": "1) 2주 전 설사 증상 (선행 감염의 과거력) 2) 대칭적으로 하지에서 상지로 진행되는 마비 3) DTR 소실 4) 백혈구 4/mm3, 단백질 105mg/dL (CSF 검사에서 나타나는 단백-세포 해리소견) 1~4까지의 소견을 보아 말초신경병증의 하나인 Guillain-Barre syndrome이며 호흡근 마비가 나타날 수 있기 때문에 질환 의심 시 무조건 입원시키고 IVIG를 투여해야 합니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "22-15", "keys": ["22-15"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>다음의 영아기에 나타나는 반사 중 가장 늦게 나타나면서 영아의 운동 발달 중 대칭성을 확인해 볼 수 있는 반사는?<\/div>", "o": ["Rooting reflex", "Landau reflex", "Stepping reflex", "Sucking reflex", "Parachute reflex"], "a": 4, "A": "⑤", "E": "교수님께서 강조하신 신생아반사문제입니다. 대부분의 반사는 출생 시부터 존재하고, Landau reflex는 3-4개월 경에 나타나지만, Parachute reflex는 9개월 이후에 나타나 평생 지속하는 반사입니다. 아래로 보도록 공중에 들면 팔을 아래로 뻗는 반사이고, 대칭적인지 확인할 수 있습니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "22-16", "keys": ["22-16"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>5세 남아가 발열 및 두통이 있어 응급실에 방문하였다. 2일 전부터 발열이 있었고, 1일 전 부터는 잘 먹지 않으려는 모습이 보이면서 구토 2차례 있었다고 하였다. 진찰 시 경부 강직(neck stiffness) 및 커니그(Kernig) 징후에서 양성 보였다. 이후 점차 혼수 상태로 변화 되었다. 다음 환아에서 나타날 수 있는 증상 및 혈액 검사에서 바로 요추천자를 시행함에 있어 금기에 해당하지 않는 것은?<\/div>", "o": ["백혈구 수 30 x 10^3 /uL", "혈소판 수 15 x 10^3 /uL", "동공 반사의 좌우 차이", "겉질 제거 경직 자세", "지속적 흡입 호흡"], "a": 0, "A": "①", "E": "발열 및 두통이 있고, 식욕부진, 구토, 혼수 증상을 보이고 경부강직 및 커니그 징후 양성을 보였기 때문에 세균성 수막염입니다. 출혈성 경향이 있거나, 뇌압이 높다고 의심되거나 vital이 불안정할 때 요추천자를 시행하지 않습니다. 1번 선지 – 교수님) 백혈구 숫자는 특별히 상관은 없다. 2번 선지 - 혈소판 수 15000으로, 심한 혈소판 감소증인 20000이하에 해당합니다. 교수님 피드백) 5만 이상이어야 검사가 가능하고 바늘이 들어간 자리에 혈종이 생길 수 있어 금기 3번 선지 – 뇌 안에 출혈성 병변이나 mass가 있어 3번 뇌신경이 압박되면 한쪽 동공의 크기가 변합니다. 뇌압 상승 소견! 4번 선지 – 급성 세균성 수막염에서 겉질 제거 경직자세가 나타납니다. 5번 선지 – 뇌압 상승 소견입니다. 또한 혼수 상태시 이상호흡이 나타날 수 있습니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "21-24", "keys": ["21-24"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>5세 남아가 발열 및 두통이 있어 응급실에 방문하였다. 2일 전부터 발열이 있었고, 1일 전 부터는 잘 먹지 않으려는 모습이 보이면서 구토 2차례 있었다고 하였다. 진찰 시 경부강직(neck stiffness) 및 커니그(Kernig) 징후에서 양성 보였다. 활력 징후 및 검사 결과는 다음과 같았다. 이 환자에서 가장 먼저 필요한 치료는?<\/div><div>활력 징후 : 혈압 90/50 mmHg, 맥박 130 회/분, 체온 39.5도<\/div><div>혈액 : 혈색소 10.4g/dL, 백혈구 19,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL,<\/div><div>뇌척수액 : 압력 240mmH2O, 단백질 240mg/dL, 포도당 25mg/dL 백혈구 2,050/mm3, 중성구 90%, 림프구 10%<\/div>", "o": ["만니톨", "적혈구 수혈", "항생제", "항바이러스제", "정맥 내 면역글로불린"], "a": 2, "A": "③", "E": "2025년 25번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 정답률 69% 3일 전부터 발생한 발열, 2일 전부터 수유량 감소, 쳐짐이 지속되는 등의 임상 증상이 나타나고 있습니다. 혈액검사 및 뇌척수액 검사에서 CSF 압력이 높고 단백질 증가/포도당 감소, 백혈구 수가 정상에 비해 매우 높으므로(그 중에서도 중성구) 세균성 수막염을 의심해 볼 수 있습니다. 환아는 아직 생후 1개월이 되지 않은 신생아이므로 neonatal meningitis의 치료제인 Ampicillin+3세대 Cephalosporin 또는 Ampicillin+Gentamycin을 투여해야 합니다. 과거 기출문제와 비슷하지만 환아가 ‘신생아인지/신생아 이후인지‘에 따라 사용 약제가 달라질 수 있음을 구분하는 문제였습니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "③"}, {"id": "21-38", "keys": ["21-38"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>3세 남아가 계단에 오르기 힘들어하는 모습을 보여 병원에 왔다. 환자는 14개월경 혼자 걷기 시작했고 20개월에 혼자 계단에 올라갔으나 최근 계단에 잘 오르려 하지 않았다. 환자의 장딴지는 단단했고, 앉혔다 일으킬 때 다음과 같은 소견을 보였다. 혈액 검사 소견은 다음과 같았다. 환자의 진단을 위해 가장 먼저 시행해야 할 검사는? 아스파르데이트 아미노전달효소 (AST) 300U/L 알라닌아미노전달효소(ALT) 120U/L 크레아틴키나아제(CK) 20,000U/U (참고치: 5~130) 젖산탈수소효소(LDH) 700U/U (참고치: 170~180)<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["하지 자기 공명 검사", "뇌척수액 검사", "신경전도 검사", "유전자 검사", "근 조직 검사"], "a": 3, "A": "④", "E": "2022년 21번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 주어진 사진은 Gower sign을 나타냅니다. 또한 장딴지의 가성비대와 혈액 검사 소견 중 CK가 현저하게 상승한 것으로 보아 Duchenne muscular dystrophy임을 알 수 있습니다. DMD는 dystrophin 결함에 의해 발생합니다.", "B": "관련 강의: 강의 17 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "④"}, {"id": "20-15", "keys": ["20-15"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>마마, 빠빠 외에 한 단어를 할 수 있는 나이에 보일 수 있는 원시반사는?<\/div>", "o": ["rooting reflex", "sucking reflex", "stepping reflex", "parachute reflex", "grasp reflex"], "a": 3, "A": "④", "E": "2025년 22번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 이 문제는, 신생아라는 단어에 집중했어야 풀 수 있던 문제입니다. 신생아 시기는 출생에서 1개월 까지이고, ④에 해당하는 Parachute reflex는 생후 9개월에 나타나는 소견입니다. 따라서 신생아 시기에 관찰할 수 있는 정상소견이 아닌 것은 ④이 되겠습니다. ① 신생아 : <120mg/㎗ 정도가 정상 ② lymphocyte : 성인은 <5/ul가 정상인데, 신생아라면 <15/㎕까지 정상으로 본다. ③ 신생아는 바빈스키 검사가 양성입니다. ④ Parachute reflex : , {"id": "25-23", "keys": ["25-23"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 중추신경계의 발달 과정에서 이상이 발생할 때 생길 수 있는 질환이다. 이 뇌 기형 중 가장 이른 시기에서 결함이 발생하는 질환은?<\/div>", "o": ["뇌갈림증", "반큰뇌증", "통앞뇌증", "다소뇌회증", "신경세포이소증"], "a": 2, "A": "③", "E": "작년 기출에서 선지만 바꾸어서 출제되었던 문제입니다. 관련 이론 속, 발달 이상 시기별 질병들 나와있는 표 전부 외워주세요!!", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-25", "keys": ["25-25"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>23일 남아가 3일 전부터 발생한 발열로 병원에 왔다. 2일전부터 수유가 절반 이하로 줄었고 쳐짐이 지속되었고 1일 전부터 분출성 구토 있다고 하였다. 활력징후에서 혈압 70/40mmHg, 맥박 150 회/분, 체온 39.5 ℃ 관찰되었고, 신체 검진 상 앞 숫구멍이 팽창 되었고, 자극에도 반응 보이지 않고 계속 자려고만 하였다. 혈액 검사 및 뇌척수액 검사는 다음과 같았다. 가장 적절한 치료는?<\/div><div>혈액: 혈색소 10.4g/dL, 백혈구 23,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL, C 반응성 단백 24mg/dL (참고치0~ 0.5)<\/div><div>뇌척수액: 압력 220mmH20, 단백질 180mg/dL, 포도당 20mg/dL 백혈구 5,050/mm3, 중성구 95%, 림프구 5%<\/div>", "o": ["Ampicillin + Cefotaxime", "Ampicilin + Ceftazidime", "Vancomycin + Gentamycin", "Vancomycin + Cefotaxime", "Vancomycin + Ceftazidime"], "a": 0, "A": "①", "E": "정답률 69% 3일 전부터 발생한 발열, 2일 전부터 수유량 감소, 쳐짐이 지속되는 등의 임상 증상이 나타나고 있습니다. 혈액검사 및 뇌척수액 검사에서 CSF 압력이 높고 단백질 증가/포도당 감소, 백혈구 수가 정상에 비해 매우 높으므로(그 중에서도 중성구) 세균성 수막염을 의심해 볼 수 있습니다. 환아는 아직 생후 1개월이 되지 않은 신생아이므로 neonatal meningitis의 치료제인 Ampicillin+3세대 Cephalosporin 또는 Ampicillin+Gentamycin을 투여해야 합니다. 과거 기출문제와 비슷하지만 환아가 ‘신생아인지/신생아 이후인지‘에 따라 사용 약제가 달라질 수 있음을 구분하는 문제였습니다.", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-28", "keys": ["25-28"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음 중 floppy infant(늘어진 영아)에서 볼 수 있는 신체 검진 소견으로 볼 수 없는 것은?<\/div>", "o": ["Scarf sign", "Frog leg posture", "Scissoring posture", "Inverted U sign", "Double folding sign"], "a": 2, "A": "③", "E": "정답률 62% Floppy infant는 근긴장 저하를 보이는 상태로, 하지는 외전 및 외회전/상지는 이완된 상태입니다. 근육질환, 신경근 접합부 질환, SMA 등에서 볼 수 있습니다. Floppy infant에서 볼 수 있는 신체 검진 소견은 다음과 같습니다. Frog leg posture Double folding sign Scarf sign [그림 #146] [그림 #147] [그림 #148] abduction & ext rotation leg 문제에 ‘개구리 다리’라는 표현 고관절이 퍼져있고, 무릎과 뒷꿈치가 땅에 닿아있다 정상: 저항감이 있어 확 접히지 않는다. floppy: 아이를 앉혀놓았을 때 버티려는 힘이 없고 바로 엎어진다. (이중절 징후) 팔을 옆으로 돌려 목에 끼우면? 정상: 저항 때문에 잘 안 되고 팔이 금방 풀림 floppy: 저항 X, 끼워진 상태로 유지 ⇒ Scarf sign (+) Traction response (견인 반응) Vertical suspension Horizontal suspension [그림 #149] [그림 #149] [그림 #150] [그림 #151] [그림 #152] [그림 #152] (위: 정상, 아래: floppy) 누운 아이의 팔 잡아 당기면 정상: 머리가 따라온다. floppy: 몸만 올라오고 목은 늘어진다. 진료실에서 muscle tone을 볼 때 가장 먼저 해보는 검사 (왼: 정상, 아래: floppy) 겨드랑이에 끼워 들어올리면 정상: 다리 flexion 유지 floppy: 다리 축 늘어짐 (위: 정상, 아래: floppy) 아이를 수평으로 들어 올리면 사진과 같은 모습 정상: 아이가 늘어지지 않음 floppy: 늘어져서 inverted U sign 나타남 Inverted U sign은 아이를 수평으로 들어 올렸을 때 늘어", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-22", "keys": ["23-22"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음의 중추신경계 발달 이상으로 나타날 수 있는 기형 중 임신 중 가장 이른 시기에 결함이 발생하여 나타나는 기형을 고르시오.<\/div>", "o": ["큰뇌증", "뇌이랑없음증", "뇌갈림증", "수막류", "통앞뇌증"], "a": 3, "A": "④", "E": "① 큰뇌증: 대뇌 겉질 발달 기형-증식이상 ② 뇌이랑없음증: 대뇌 겉질 발달 기형-이주이상 ③ 뇌갈림증: 대뇌 겉질 발달 기형-조직화이상 ④ 수막류: 신경관 형성 시기 이상 ⑤ 통앞뇌증: 신경관 분절 시기 이상 따라서 가장 빠른 것은 수막류입니다. 아래 관련 이론 참고해주세요.", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-42", "keys": ["23-42"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>4개월 남아가 3일 전부터 발생한 발열로 병원에 왔다. 2일전부터 수유가 절반 이하로 줄었고 쳐짐이 지속되었고 1일전부터 분출성 구토 있다고 하였다. 활력징후에서 혈압 70/40mmHg, 맥박 150 회/분, 체온 39.5 ℃ 관찰되었고, 신체 검진 상 앞 숫구멍이 팽창 되었고, 자극에도 반응 보이지 않고 계속 자려고만 하였다. 혈액 검사 및 뇌척수액 검사는 다음과 같았다. 가장 먼저 할 치료는?<\/div><div>혈액: 혈색소 10.4g/dL, 백혈구 19,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL, C 반응성 단백 24mg/dL(정상치 &lt;0.5 mg/dL)<\/div><div>뇌척수액: 압력 240mmH20, 단백질 300mg/dL, 포도당 25mg/dL 백혈구 3,050/mm3, 중성구 90%, 림프구 10%<\/div>", "o": ["만니톨", "항생제", "항바이러스제", "정맥 내 스테로이드", "정맥 내 면역글로불린"], "a": 1, "A": "②", "E": "1) 2일 전부터 발생한 발열, 식욕부진, 저혈압과 의식저하 2) CBC : 백혈구와 CRP의 상승 3) 뇌척수액 : 압력이 240으로 정상(50~180)보다 높고 백혈구수가 3050이므로 정상보다 매우 높음 → 세균성 수막염 [그림 #109] 환아는 4개월이므로 신생아 이후 bacterial meningitis입니다. 초기 항생제는 경험적으로 3세대 세파 + 반코마이신을 사용합니다. L. monocytogenes 의심 시 Cephalosporin 대신 Ampicillin을 사용합니다. 면역결핍환자[G(-) 감염] 의심 시 Cefepime (4세대 세파) or Meropenem을 사용합니다.", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "23-43", "keys": ["23-43"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>14세 여아가 간헐적인 좌측 손의 힘 빠짐으로 병원에 방문 하였다. 뜨거운 라면을 먹을 때나 100m 달리기 등 격한 운동을 한 이후이면 증상이 유발되고 곧 회복되는 모습이 관찰되었다. 상기 환자에서 시행한 뇌 자기공명 혈관 조영술은 다음과 같았다. 상기 질환의 병인과 가장 거리가 먼 경우는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["다운 증후군", "신경 섬유종증", "갑상선 기능 저하증", "낫 모양 적혈구 빈혈", "이전 방사선 치료 병력"], "a": 2, "A": "③", "E": "음식을 먹을 때, 격한 운동을 한 이후(과호흡 유발) 좌측 손 힘빠짐 후 곧 회복 → MCA, ACA 등 뇌의 주요 혈관이 좁아지거나 막히면서 증상이 나타나는 Moyamoya syndrome MMS : 이유없이 혈관이 좁아져 발병하는 모야모야병과 다르게 기저질환으로 인해 모야모야병과 비슷한 증상을 보이는 것 ex. NF1, sickle cell disease, trisomy 21(다운), radiation, hyperthyroidism, PHACE syndrome ③ 갑상선 기능항진증과 관련이 있습니다.", "B": "관련 강의: 강의 01 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "25-105", "keys": ["25-105"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>수두증의 수술적 치료법에 해당되지 않는 것은?<\/div>", "o": ["L-P shunt", "V-P shunt", "Intrathecal pump implantation", "V-A shunt", "Endoscopic third ventriculostomy"], "a": 2, "A": "③", "E": "수두증의 치료에는 3rd ventriculostomy, V-A shunt, V-P shunt, L-P shunt가 있습니다. 이에 해당하지 않는 것은 3번 Intrathecal pump implantation이고, 찾아보니 케모포트로 혈관에 약물 전달하는 것처럼 spinal fluid에 약물을 전달할 수 있게 설치하는 장치라고 합니다.", "B": "관련 강의: 강의 11 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-101", "keys": ["25-101", "21-50", "20-08"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>두개강 내압 상승으로 인하여 두통, 의식저하, 유두부종 등의 증상이 나타나는 환자에서 두개강 내압 조절을 위해 시행할 수 있는 방법이 아닌것은?<\/div>", "o": ["hypothermia", "Head elevation", "Hypoventilation", "Mannitol", "Ventriculostomy (EVD)"], "a": 2, "A": "③", "E": "ICP를 떨어뜨리기 위해서는 hypoventilation이 아니라 hyperventilation을 통해 vasodilator로 작용하는 CO2를 감소시켜야하고, 따라서 답은 3번입니다. 나머지 mild/moderate hypothermia를 통해 신진대사를 떨어뜨리기, head elevation을 통해 venous return 증가시키기, mannitol을 통한 osmotic effect, Ventriculostomy를 통한 ventricle내 CSF drainage는 모두 ICP를 떨어뜨리는 방법들로 옳은 것들입니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ③, 2021 ⇒ ⑤, 2020 ⇒ ⑤", "img": [], "v": false, "y": [2020, 2021, 2025], "ok": false, "ra": "③"}, {"id": "25-102", "keys": ["25-102"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>Cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오<\/div>", "o": ["MR image상 white matter만 involve하며, gray matter는 spare 된다.", "Steroid에는 effect가 없다.", "DKA, Anoxia, Hypothermia, Infarction, Trauma등에 의해서 발생할 수 있다.", "ECF volume은 감소한다.", "Na+, K+-ATPase pump의 metabolic failure에서 기인한다"], "a": 0, "A": "①", "E": "Cytotoxic edema는 말그대로 세포 손상으로 intracellular volume이 증가하는 기전으로 신경세포의 세포체가 위치한 gray matter와 그 exon인 white matter를 모두 involve합니다. 나머지 2-5번 선지는 모두 옳은 선지입니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-103", "keys": ["25-103"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>CSF circulation 에 관하여 빈칸에 맞는 조합은? lat. ventricle → (A) → 3rd V. → (B) → 4th V. → (C) → subarachnoid space → (D) → venous sinus<\/div><div>&lt;1&gt; : cerebral aqueduct (시험 중간에 3rd ventricle에서 cerebral aqueduct로 수정)<\/div><div>&lt;2&gt; : arachnoid villi, granulation<\/div><div>&lt;3&gt; : foramen of Magendie, Luschka<\/div><div>&lt;4&gt; : foramen of Monro<\/div>", "o": ["A-<1>, B-<2>, C-<3>, D-<4>", "A-<3>, B-<4>, C-<1>, D-<2>", "A-<2>, B-<4>, C-<3>, D-<1>", "A-<4>, B-<1>, C-<3>, D-<2>", "A-<3>, B-<1>, C-<2>, D-<4>"], "a": 3, "A": "④", "E": "“lateral ventricle안의 choroid plexus에서 생성 → foramen of monro (lat.ventricle에서 3rd ventricle로 가는 통로) → 3rd ventricle → cerebral aqueduct (3rd에서 4th로 가는 통로)→ 4th ventricle → foramen of magendie, luschka → subarachnoid space → arachnoid villi, granulation → sup. sagittal sinus” CSF의 흐름은 항상 출제되는 왕마이니 꼭 숙지하시기 바랍니다. 이번 시험 중간에 1번이 3rd ventricle로 되어있던걸 중간에 cerebral aqueduct로 수정된 바 있습니다. 하상우 교수님 예제문제로 있던 문제를 그대로 출제하셨는데 18년도에 하상우 교수님이 출제하셨다고 표시되어있네요.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-97", "keys": ["25-97"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>Corneal reflex의 반사궁에 관여하는 뇌신경 조합은?<\/div>", "o": ["optic nerve - oculomotor nerve", "optic nerve – trigeminal nerve", "oculomotor nerve – trigeminal nerve", "trigeminal nerve – facial nerve", "facial nerve – vestibulocochlear nerve"], "a": 3, "A": "④", "E": "23년과 동일한 문제가 출제되었습니다. corneal reflex는 가벼운 면봉이나 깃털로 눈 자극 시 5번 뇌신경으로 감각신호가 들어가 7번 뇌신경을 통해 운동 신호가 전달되어 눈을 감는 반사를 말합니다. 따라서 trigeminal nerve – facial nerve가 해당합니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-98", "keys": ["25-98"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>다음 중 신경근 질환(root disease)를 확인하기 위한 검사가 아닌 것은?<\/div>", "o": ["Spurling’s sign", "Shoulder abduction test", "Neck distraction test", "Compression test", "Lhermitte’s test"], "a": 4, "A": "⑤", "E": "23년도와 동일한 문제가 출제되었습니다. Lhermitte‘s test는 신경근 질환이 아닌, 척수 질환을 평가하기 위한 검사입니다. 환자가 앉은 상태에서 머리를 최대한 굴전하게 하면 등줄기나 사지로 전기가 흘러 내려가는 것 같은 증상이 있을 때 양성이고, 다발성 경화(multiple sclerosis), 척수 종양, 키아리 기형 등의 척수질환을 의심할 수 있습니다. 다른 test들은 설명해주시진 않았지만 다른 교수님들께서 알려주셨기 때문에 간단히 설명해놓겠습니다. ① Spruling sign : 머리를 신전 후 아픈쪽으로 고개를 돌리며 머리를 아래로 누를 시 추간공이 좁아져 신경근 압박(radiculopathy)이 있는 환자에서 상지 방사통이 유발되는 것. ② Shoulder abduction test : 방사통이 있는 팔을 들어올리면 통증이 소실되는 것. 마찬가지로 경추간반 탈출증이 있는 환자에서 양성입니다. ③ Neck distraction test : 환자를 앉히거나 눕힌 상태에서 턱과 뒤통수를 잡고 머리 위쪽으로 당기면 facet joint에 가해지던 압력이 줄어 통증이 줄어드는 것. ④ Compression test : neck distraction test와 반대로 머리를 눌러 통증을 유발시켜 보는 것.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "23-18", "keys": ["23-18"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>corneal reflex의 반사궁에 해당하는 뇌신경의 조합은?<\/div>", "o": ["optic n.-oculomotor n.", "optic n.-trigeminal n.", "oculomotor n.-trigeminal n.", "trigeminal n.-facial n.", "trigeminal n.-vestibulocochlear n."], "a": 3, "A": "④", "E": "corneal reflex는 가벼운 면봉이나 깃털로 눈 자극 시 5번 뇌신경으로 감각신호가 들어가 7번 뇌신경을 통해 운동 신호가 전달되어 눈을 감는 반사를 말합니다. 따라서 trigeminal nerve – facial nerve가 해당합니다. 교수님께서 강조하신 에서 나왔습니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-19", "keys": ["23-19"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>다음 중 신경근 질환(root disease)을 확인하기 위한 검사가 아닌 것은?<\/div>", "o": ["Spruling sign", "Shoulder abduction test", "Neck distraction test", "Compression test", "Lhermitte's test"], "a": 4, "A": "⑤", "E": "Lhermitte‘s test는 신경근 질환이 아닌, 척수 질환을 평가하기 위한 검사입니다. 환자가 앉은 상태에서 머리를 최대한 굴전하게 하면 등줄기나 사지로 전기가 흘러 내려가는 것 같은 증상이 있을 때 양성이고, 다발성 경화(multiple sclerosis), 척수 종양, 키아리 기형 등의 척수질환을 의심할 수 있습니다. 다른 test들은 설명해주시진 않았지만 다른 교수님들께서 알려주셨기 때문에 간단히 설명해놓겠습니다. ① Spruling sign : 머리를 신전 후 아픈쪽으로 고개를 돌리며 머리를 아래로 누를 시 추간공이 좁아져 신경근 압박(radiculopathy)이 있는 환자에서 상지 방사통이 유발되는 것. ② Shoulder abduction test : 방사통이 있는 팔을 들어올리면 통증이 소실되는 것. 마찬가지로 경추간반 탈출증이 있는 환자에서 양성입니다. ③ Neck distraction test : 환자를 앉히거나 눕힌 상태에서 턱과 뒤통수를 잡고 머리 위쪽으로 당기면 facet joint에 가해지던 압력이 줄어 통증이 줄어드는 것. ④ Compression test : neck distraction test와 반대로 머리를 눌러 통증을 유발시켜 보는 것.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "21-07", "keys": ["21-07"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>Cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오.<\/div>", "o": ["MR image 상 white matter만 involve하며, gray matter는 spare 된다.", "Steroid에는 effect가 없다.", "DKA, Anoxia, Hypothermia, Infarction, Trauma 등에 의해서 발생할 수 있다.", "ECF volume은 감소한다."], "a": 0, "A": "①", "E": "2025년 102번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: Cytotoxic edema는 말그대로 세포 손상으로 intracellular volume이 증가하는 기전으로 신경세포의 세포체가 위치한 gray matter와 그 exon인 white matter를 모두 involve합니다. 나머지 2-5번 선지는 모두 옳은 선지입니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "①"}, {"id": "21-33", "keys": ["21-33"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>두개강 내압 상승으로 인하여 두통, 의식저하, 유두부종 등의 증상이 나타나는 환자에서 두개강 내압 조절을 위해 시행할 수 있는 방법이 아닌 것은?<\/div>", "o": ["hypothermia", "head elevation", "ventriculostomy (EVD)", "mannitol", "hydration"], "a": 4, "A": "⑤", "E": "2025년 101번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: ICP를 떨어뜨리기 위해서는 hypoventilation이 아니라 hyperventilation을 통해 vasodilator로 작용하는 CO2를 감소시켜야하고, 따라서 답은 3번입니다. 나머지 mild/moderate hypothermia를 통해 신진대사를 떨어뜨리기, head elevation을 통해 venous return 증가시키기, mannitol을 통한 osmotic effect, Ventriculostomy를 통한 ventricle내 CSF drainage는 모두 ICP를 떨어뜨리는 방법들로 옳은 것들입니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "⑤"}, {"id": "20-09", "keys": ["20-09"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오.<\/div>", "o": ["MR image 상 white matter만 involve하여 gray matter는 spare된다.", "steroid에는 effect가 없다.", "DKA, anoxia, hypothermia, infarction, trauma 등에 의해서 발생할 수 있다.", "ECF volume은 감소한다.", "Na-K ATPase pump의 metabolic failure에서 기인한다."], "a": 0, "A": "①", "E": "2025년 102번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: Cytotoxic edema는 말그대로 세포 손상으로 intracellular volume이 증가하는 기전으로 신경세포의 세포체가 위치한 gray matter와 그 exon인 white matter를 모두 involve합니다. 나머지 2-5번 선지는 모두 옳은 선지입니다.", "B": "관련 강의: 강의 03 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "①"}, {"id": "25-85", "keys": ["25-85"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>41세 남자가 내원 전날부터 시작된 몸살 감기 증상 후 고열(내원 시 37.2도), 오한 및 심한 두통을 주소로 응급실을 방문하였다. 구역과 구토가 동반되었으며, 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 다른 국소 신경학적 이상 소견은 없었다. 뇌 CT는 다음과 같다. 응급 혈액검사는 정상범위였으며, 뇌척수액 검사는 다음과 같다. 뇌척수액 검사<\/div><div>뇌압: 240 mmH₂O<\/div><div>색깔: 투명함<\/div><div>WBC: 130/μL<\/div><div>RBC: 10/μL<\/div><div>Glucose: 52 mg/dL (serum 109 mg/dL)<\/div><div>Protein: 45 mg/dL 임상 및 뇌척수액 결과를 바탕으로 가장 합당한 진단과 초기 관리 원칙은 무엇인가?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["바이러스성 수막염이며, 대부분 자연 치유되므로 특별한 항바이러스제나 항생제 없이 대증적 치료와 경과 관찰이 표준이다.", "아급성 경과와 림프구 우세 증가는 결핵성 수막염을 시사하므로, 항결핵제(4제 요법)를 투여하고 CSF 결핵균 PCR 검사 결과를 기다린다", "CSF 백혈구 증가가 있으므로, 경험적 3세대 cephalosporin 항생제 투여 후 호전 여부를 관찰한다.", "HSV 뇌염의 가능성을 배제할 수 없으므로 뇌척수액 검사 즉시 Acyclovir를 투여하고 HSV PCR 결과를 기다린다.", "환자는 고열과 경부 강직이 있으므로, 급성 세균성 수막염을 가정하고 뇌척수액 배양 결과가 나오기 전에 3세대 cephalosporin과 Vancomycin을 즉시 투여해야 한다."], "a": 0, "A": "①", "E": "세균성 내막염보다 경미한 증상(몸살 감기증상), 수막자극 징후(neck stiffness), 뇌척수액 검사상 뇌압상승 소견과 소폭 상승한 200이하의 WBC, glucose도 normal이므로 virus에 의한 aseptic meningitis로 판단됩니다. 치료는 대증치료이며, 예후는 대체로 좋은편입니다.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-86", "keys": ["25-86"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>응급실로 내원한 60세 환자가 급격한 고열, 심한 두통, 의식 변화 및 경부 강직(목이 뻣뻣함)을 호소하며, 의료진은 급성 세균성 뇌막염을 강력하게 의심하고 있다. 이 환자에게 가장 신속하고 정확하게 취해야 할 초기 조치 및 치료 원칙으로 가장 옳은 것은?<\/div>", "o": ["뇌척수액 검사를 먼저 시행하여 원인균이 확인된 후에, 지연 없이 적절한 광범위 항생제를 투여한다.", "혈액 배양 검체를 채취한 직후, CT검사 결과 또는 뇌척수액 검사 여부와 관계없이 즉시 경험적 광범위 항생제 및 덱사메타손 투여를 시작한다.", "뇌압 상승 위험이 있으므로, 항생제 투여 전 반드시 뇌 CT 통해 뇌부종과 수두증 유무를 확인한 후 뇌척수액 검사를 진행한다.", "항생제 치료는 환자의 열이 떨어지고 의식 상태가 완전히 회복될 때까지는 지속하며, 일반적으로 7일 이내에 종료하는 것이 원칙이다.", "덱사메타손과 같은 스테로이드 치료는 모든 세균성 뇌막염 환자에게서 치료 기간 내내 필수적으로 지속해야 한다."], "a": 1, "A": "②", "E": "급성 세균성 내막염이 의심되는 경우 진단검사 결과와 상관없이 빠르게 적절한 광범위 항생제를 IV full-dose로 투여하는 것이 원칙입니다.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-87", "keys": ["25-87"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>20세 남자 환자가 2주 전부터 저녁만 되면 발생하는 발열 및 두통이 있었고, 내원 당일 한차례 전신 경련 후 의식 회복이 되지 않아 응급실에 왔다. 생체징후<\/div><div>BP: 130/90 mmHg, BT: 37.4℃, RR: 22회, PR: 96회 신경학적 진찰에서 의식은 혼미 상태였고, 뇌간 반사는 정상이었다. 통증 자극에 피하려고 하였으며 편측 마비는 관찰되지 않았다. 응급실에서 시행한 chest PA와 CT 및 응급검사는 다음과 같다. 혈액검사<\/div><div>WBC: 10.3×10³/μL (정상 416)<\/div><div>RBC: 4.10×10⁶/μL (정상 4.2120) BUN/Creatinine: 18/0.6 mg/dL<\/div><div>CPK: 448 U/L (정상 26100 / 35~45) 뇌척수액 검사<\/div><div>압력: 300 mmH₂O<\/div><div>색깔: yellow<\/div><div>Cell: WBC 650/mm³ (lymphocyte 80%)<\/div><div>RBC: 53/mm³<\/div><div>Glucose: 62 mg/dL<\/div><div>Protein: 320 mg/dL 이 환자의 치료로 합당한 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["Albendazole P.O.", "INH + Rifampin + Ethambutol + Pyrazinamide P.O.", "IV Acyclovir", "IV Vancomycin + Ceftriaxone", "IV Amphotericin B + Flucytosine"], "a": 1, "A": "②", "E": "CSF 검사상 뇌압의 상승, yellowish, lymphocyte dominant하게 WBC가 증가하였고, protein도 증가한 수치로, 결핵수막염을 의심할 수 있습니다. 또한 chest X-ray상 공동이 보이는 pulmonary TB가 관찰됨에 따라 pulmonary infection에 의해 발생했다고 생각할 수 있습니다. 결핵수막염의 치료는 결핵의 치료와 같으며, 초기의 inflammatory 반응 억제를 위해 HIV에 감염되지 않은 경우에 한하여 IV dexamethasone을 반드시 병용 투여해야 합니다.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-88", "keys": ["25-88"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>군복무 중인 21세 남자가 내원 2일 전 발생한 고열과 의식장애로 군병원에서 전원되었다. 평소 건강하였으며, 내원 시 의식상태는 혼미(stupor), 유두부종이 관찰되었고, 뇌막 자극 증상이 뚜렷했다. 신체 검진에서 피부의 광범위한 소자반 발진 및 반상출혈이 확인되었다. 뇌 CT소견은 정상이었다. 뇌 척수액 검사 결과는 다음과 같다.<\/div><div>뇌압: 270 mmH2O, WBC count: 1200/uL, protein: 170mg/dL, glucose: 27mg/dL 이 환자의 임상 및 뇌척수액 소견을 바탕으로 가장 의심되는 질환의 관리 방안에 대한 설명으로 옳은 것은?<\/div>", "o": ["이 질환은 주로 면역이 억제된 환자에서 발생하는 기회 감염성 질환으로, 산발적인 발생 양상을 보인다.", "피부 병변이 광범위하게 나타나므로, 예후 개선을 위해 치료 시작 시점에서 스테로이드제(덱사메타손)를 반드시 병용 투여해야 한다.", "환자와 같은 생활 공간을 공유한 밀접 접촉자들에게 화학 예방 요법이 반드시 권장 된다.", "뇌척수액 압력이 높고 유두 부종이 있으므로, 뇌 탈출 위험을 줄이기 위해 mannitol 등의 약제를 사용하며, 항생제 치료 후에는 뇌척수액 검사를 반복할 필요는 없다.", "급성 질환이며 타 장기 침범은 흔하지 않으므로, 광범위한 항생제 투여없이 예방적 약물 치료를 시작해야한다."], "a": 2, "A": "③", "E": "CSF 검사상 뇌압과 WBC, protein의 상승, glucose의 하강 소견과 피부에 나타나는 광범위한 소자반 발진, 군부대에서 감염되었다는 점으로 보아 N.meningitis의 감염에 의한 급성 세균성 뇌막염임을 알 수 있습니다. 호흡기 질환에 의한 감염이 주된 위험인자로 방역을 철저히 해아한다는 교수님의 피드백 말씀입니다. 1 > 면역이 억제된 환자에서 발생하는 질환은 주로 L. monocytogenes에 의한 세균성 뇌막염입니다. 2 > 세균성 뇌막염에서 steroid는 초기 cytotoxic T cell을 감소시켜 일시적인 증상완화에 도움은 되지만, 장기간 사용시 역으로 면역이 저하되는 부작용이 있습니다. 질환의 예후와는 관련이 없습니다. 4 > CSF를 계속 f/u하면서 질병의 경과를 확인하며 적절한 치료를 선택해야합니다. 5 > 광범위한 예방적 항생제 투여는 급성 세균성 수막염 치료의 원칙입니다 .", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-54", "keys": ["23-54"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>47세 남자 환자가 의식저하로 응급실로 전원되었다. 2주전부터 몸이 좋지 않다고 했고, 일주일 전부터 잠이 많아지고, 그제부터는 말을 거의 하지 않았고 식사도 잘 하지 않아서 집 근처 병원에 어제 입원했다고 했다. 내원시 신경학적 진찰에서 경부 강직이 있었다. 가져온 뇌 영상 검사는 다음과 같았다. 환자에서 시행한 뇌척수액 검사에서 압력은 210mmH2O였으며, 색깔은 yellowish 했고, WBC 176/mm3(lymphocyte 90%), RBC 0/mm3, protein 460 mg/dL, glucose 34mg/dL(serum 148 mg) 였다. 다음 중 이 환자의 치료 중 가장 맞는 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["IV Acyclovir", "IV Vancomycin + Ceftriaxon", "P.O. INH+RIF+PZA+ETH", "IV Amphotericin B", "CT guided Stereotactic aspiration"], "a": 2, "A": "③", "E": "210mmH2O였으며, 색깔은 yellowish 했고, WBC 176/mm3(lymphocyte 90%), RBC 0/mm3, protein 460 mg/dL, glucose 34mg/dL(serum 148 mg) 모두 결핵성 수막염 소견에 합당합니다 CT상 tuberculoma도 보이는데, 개인적으로는 2주전부터 증상이 있었다는 점이 힌트였습니다. 치료는 일반 결핵과 동일하게 P.O. INH+RIF+PZA+ETH입니다. 13. 결핵성 수막염 - case Q5 21,22,", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-55", "keys": ["23-55"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>53세 남자가 내원 당일 발생한 경련과 이상 행동을 주소로 병원에 왔다. 일주일 전부터 몸살이 있고 두통이 있어 약을 복용했다. 그제부터는 외출하지 않고 집에서 쉬었다고 하며, 전날 저녁에는 돌아가신 ‘어머니가 왔다.’ 고 부인에게 엉뚱한 이야기를 했다. 당일 새벽에 환자가 갑자기 이상한 소리를 지르며 발작하는 소리에 부인이 잠이 깨어 발견하여 응급실로 왔다. 뇌척수액검사 소견, CT검사는 다음과 같다. 이 환자에서 추가 검사결과가 나오기 전에 바로 사용할 수 있는 가장 합당한 치료제를 고르시오.<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["IV Dexamethasone", "IV Acyclovir", "IV Vancomycin + Ceftriaxon", "IV Amphotericin B", "IV Penicillin G (aqueous crystalline)"], "a": 1, "A": "②", "E": "CSF 소견에서 바이러스 원인임을 유추해 낼 수 있고, 침범부위가 Temporal lobe 쪽인 점, 내원 당일 경련과 이상행동을 주소로 내원한 점, 정신 증상 등의 증상을 통해 Herpes encephalitis 임을 추론해 낼 수 있습니다. 치료는 Acyclovir IV입니다. 왕마이니 꼭 챙겨가시길 바랍니다! 5. Herpes encephalitis -case Q6 20,22,16,21,", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "23-56", "keys": ["23-56"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>34세 여자가 열감과 두통을 주소로 응급실에 왔다. 내원 3일 전부터 몸살 감기 증상이 있어 약국에서 약을 복용하였으나 호전이 없고 점차 심해지면서 구역, 구토가 발생하였다. 체온은 37.2°C였고 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 특별한 이상 소견은 관찰되지 않았다. 뇌 전산화 단층촬영은 다음 그림과 같았다. 뇌척수액 검사상 압력은 280mmH2O였으며 색깔은 투명하였고 WBC 84/mm3 (lymphocyte 80%), RBC 3/mm3, glucose 52 mg/dl (serum 98 mg/dl), protein 52 mg/dl 이었다. 이 환자에서 필요한 것을 고르시오<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["대증 치료", "항결핵제 경구투여", "덱사메타손 정맥 투여", "3세대 cephalosporin과 vancomycin 정맥투여", "amphotericin-B 정맥투여"], "a": 0, "A": "①", "E": "세균성 뇌막염보다 경미한 증상, 수막자극징후. CSF 소견(lymphocyte 80%) 상 aseptic meningitis입니다. 치료는 바이러스 감염이므로 대증 치료입니다. 세균성 뇌막염, 헤르페스 뇌염과 정확하게 구분하시길 바랍니다. 2. 급성무균수막염(acute viral meningitis = Aseptic meningitis) 가장흔함", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-63", "keys": ["23-63"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>52세 남자 환자가 한달전부터 지속되는 두통으로 내원했다. 뒤머리가 조이는 듯한 통증이 주로 오후가 되면 심해지고 잠을 자고 나면 나아지는 양상이다. 머리를 만지면 더 아픈 것 같고, 머리카락이 예민한 느낌이라고 했다. 평소 고혈압으로 약을 복용하는 것 말고는 지금까지 건강했다고 한다. 집 근처 병원에서 MRI 촬영을 했고, 상급병원 진료권유 받아왔다고 했다. 환자의 뇌 영상 사진은 다음과 같다. 이 환자를 위한 조언으로 가장 알맞은 것은?<\/div>", "o": ["두통약으로 타이레놀을 드셔보세요.", "뇌경색의 흔적이 있으므로 아스피린을 드세요.", "혈관에 동맥경화예방을 위해 스타틴 처방을 추가합니다.", "고혈압 때문에 두통이 있으니 고혈압 약물 조절이 필요합니다.", "다발성 경화증이 의심되어 뇌척수액 검사가 필요할 것 같습니다."], "a": 0, "A": "①", "E": "한 달간 지속되는, 뒤머리를 조이는 두통으로 오후에 심하고 자고 나면 나아짐 → 긴장성 두통. 뇌졸중의 정의(갑작스러운 국소 신경학적 증상, 혈관성 원인)에 맞지 않고 영상에서도 뇌경색 소견이 없습니다. 뇌실 주변 백질의 작은 고신호는 고령·편두통 환자에서 흔한 비특이 소견입니다. ② 뇌경색 흔적 없음 ③ 스타틴은 LDL·동맥경화 소견이 있어야 ④ 고혈압 자체는 두통을 유발하지 않음(강의에서 강조) ⑤ MS는 McDonald 기준(2회 이상 발병·2곳 이상 병변) 필요.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-72", "keys": ["23-72"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>세균성 뇌막염 환자의 치료에 관련된 내용 중 가장 맞는 것은?<\/div>", "o": ["항생제는 최대용량으로 정맥내로 사용해야 한다.", "어린이 뇌막염 중, 가장 흔한 균은 Hemophilus influenza이다.", "3세대 세파계 항생제 투여 후 48시간이 지나도 호전이 없으면 vancomycin을 추가한다.", "면역억제자 뇌막염 환자 중 페니실린 알러지가 있는 경우, ampicillin을 추가한다.", "정맥내 스테로이드 치료는 환자의 임상경과에 도움이 되지 않는다."], "a": 0, "A": "①", "E": "항생제는 BBB를 통과해야 하므로 최대용량 정맥 투여가 원칙입니다. ② H. influenzae는 백신 이후 소아에서 거의 없음 ③ 처음부터 3세대 cephalosporin + vancomycin 병용(cephalosporin 단독 투여 안 됨) ④ 페니실린 알레르기 시 trimethoprim-sulfamethoxazole ⑤ 초기 4일 정도의 dexamethasone은 열을 빨리 떨어뜨리고 감각신경성 난청 등 합병증 예방에 도움. (정답률 73%)", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "21-02", "keys": ["21-02"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>24세 남자가 오한과 두통을 주소로 응급실을 방문하였다. 환자는 내원 3일전부터 몸살 감기 증상이 있어 감기약을 먹었으나, 내원 당일에는 두통 및 오한이 발생하고 점차 심해지면서 구역, 구토가 동반되어 응급실에 왔다. 체온은 37.2℃였고 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 특별한 이상 소견은 관찰되지 않았다. 두부 전산화 단층촬영을 하였으나 정상이었다. 응급혈액검사는 정상범위였고 뇌척수액 검사상 압력은 220mmH2O였으며, 색깔은 투명하였고 WBC 230/mm3 (lymphocyte 80%), RBC 0/mm3, glucose 62mg/dL (Serum 98mg/dL), protein 48mg/dL였다. 이 환자에 대한 설명 중 가장 합당한 것은?<\/div>", "o": ["대증적 치료를 하며 경과를 관찰한다.", "결핵균에 대한 척수액 배양 검사를 실시하고 항결핵제를 투여한다.", "무균성 수막염이지만, 경험적 3세대 cephalosporin 항생제를 투여한다.", "경험적 3세대 cephalosporin과 vancomycin을 투여하면서 혈액 배양검사를 기다린다.", "진균성 수막염일 가능성이 높으므로 amphotericin-B를 투여한다."], "a": 0, "A": "①", "E": "2025년 85번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 세균성 내막염보다 경미한 증상(몸살 감기증상), 수막자극 징후(neck stiffness), 뇌척수액 검사상 뇌압상승 소견과 소폭 상승한 200이하의 WBC, glucose도 normal이므로 virus에 의한 aseptic meningitis로 판단됩니다. 치료는 대증치료이며, 예후는 대체로 좋은편입니다.", "B": "관련 강의: 강의 14 감염성 질환1", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "①"}, {"id": "21-03", "keys": ["21-03", 으로 10년 이상 항응고제와 고혈압 약물을 복용 중 이었다. 신경학적 검사상 사지 근력 저하나 감각 이상과 같은 국소 운동신경학적 결손은 관찰되지 않았다. 환자에게 시계 그리기 검사(Clock Drawing Test)를 시행한 결과는 다음과 같았다 .환자의 뇌 병변 부위는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["우측 전대뇌동맥 (Right ACA) 영역", "우측 중대뇌동맥 (Right MCA) 영역", "우측 후대뇌동맥 (Right PCA) 영역", "우측 중뇌 (Right midbrain) 영역", "우측 뇌교 (Right pons) 영역"], "a": 1, "A": "②", "E": "(정답률: 83%) AF로 인해 뇌졸중이 발생한 모습입니다, Hemineglect가 나타나는 것은 non-dominant MCA (=Right MCA) 영역 병변의 특징적인 소견입니다. Ⅴ. 각 혈관영역에 따른 뇌졸중의 특징", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-78", "keys": ["25-78"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>다음은 그래프는 급성 허혈성 뇌졸중 환자에서 정맥내 혈전용해제(rtPA, alteplase) 치료를 시행한 624명의 환자 데이터를 분석한 임상연구 결과를 나타낸다. 히스토그램(A)는 환자들의 뇌졸중 발생시점부터 rt-PA 치료 시작까지의 시간분포를 보여주며, 상관그래프 (B)는 뇌졸중 발생 시점부터 치료시작까지의 시간지연에 따른 3개월째 임상 결과를 얻을 상대적 이득 (Odds Ratio, OR)의 변화를 보여준다. 제시된 두 그래프를 정확하게 해석한 설명으로 가장 옳은 것은?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["히스토그램(A)를 볼 때, 대다수 환자들은 발생부터 180분 지나서 병원에 도착했음을 알 수 있다.", "상관관계 그래프(B)에 따르면, 뇌졸중 발생시간과 치료까지 180분을 넘어가도 OR가 1보다 높게 유지되므로, 치료의 이득은 유지된다.", "rt-PA 치료의 상대적 이득(OR)은 치료시간이 늦어질수록 점진적으로 감소하여, 90분 이내에 치료했을 떄의 OR은 약 1.5배정도이다.", "뇌졸중 발생부터 치료까지 120분째 환자의 치료효과가 가장 좋으므로, 모든 환자를 120분 이내에 치료하도록 시간을 맞추는 것이 핵심목표가 되어야 한다.", "뇌졸중 발생부터 치료까지 60분이내 환자가 180분째 환자에 비해 우수한 임상결과를 얻을 확률이 약 4배 더 높다."], "a": 4, "A": "⑤", "E": "(정답률: 44%) X - 대부분의 환자들은 180분 이내에 도착했습니다. (위쪽 그래프) 2. X - 아래 그래프의 가운데 진한 선을 보시면, 180분이 지나면서 OR이 1 아래로 떨어지게 됩니다. 180분이 지난 뒤에는 치료의 이득이 유지되지 않습니다. 3. X – rt-PA 치료의 상대적 이득이 치료 시간이 늦어질수록 점진적으로 감소하는 것은 맞으나, 90분 이내에 치료했을 때의 OR은 1.5배보다 높습니다. 4 X – 180분까지도 OR이 1 이상으로 유지되기 때문에 틀린 내용입니다. (+ CT 소견까지 종합한다면 IV tPA는 4시간 30분 이내까지 사용할 수 있도록 되어있습니다) 5 O – 60분의 OR은 4에 가깝고, 180분의 OR은 1에 가까워 약 4배 높아 정답입니다.", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-79", "keys": ["25-79"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>67세 남자 환자가 급성 우측 편마비를 주소로 응급실에 내원하여 뇌 영상 검사에서 좌측 중대뇌동맥(MCA) 영역의 급성 뇌경색 진단을 받았다. 환자는 평소 심계항진(두근거림)을 종종 느꼈다고 진술하였다. 응급실에서 시행한 검사 결과는 다음과 같다. 이 환자의 향후 뇌졸중 재발을 예방하기 위해 2차 예방 목적으로 가장 우선적으로 선택되어야 하는 항혈전제(antithrombotic agent) 계열과 구체적인 약물은 무엇인가?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["항혈소판제: Aspirin", "항혈소판제: Clopidogrel", "항혈소판제: Ticagrelor", "항응고제(DOACs): Rivaroxaban(또는 Apixaban, Edoxaban)", "항응고제(Vitamin K antagonist): Warfarin"], "a": 4, "A": "⑤", "E": "(정답률: 75%) (21년도 51번 참고하여 해설 작성합니다.) 심전도와 심초음파 소견은 LA thrombosis가 있는 atrial fibrilation을 의미합니다. 교수님께서 피드백 시간에 LA thrombosis가 있는 뇌경색 환자에서는 와파린이 가이드라인상 TOC이고 와파린만 답이라고 하셨습니다. NOAC을 LA thrombosis에 사용할지에 대한 연구들은 있지만 가이드라인상에는 와파린이라고 합니다. Atrial Fibrillation", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-80", "keys": ["25-80"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>53세 남자가 내원 3시간 전 발생하여 약 30분 만에 완전히 회복된 우측 팔/다리 근력 약화 및 구음 장애를 주소로 응급실을 방문하였다. 환자는 평소 특이 기저질환은 없으나, 하루 한 갑 흡연과 주 3회 소주 1병 음주를 20여 년간 지속해왔다. 내원 당시 신경학적 검사상 특이 소견은 없었으며, 환자 역시 증상이 완전히 소실되었다고 진술하였다. 환자의 비조영 CT 및 뇌 CT혈관 사진은 다음과 같았다. 환자의 임상 양상과 검사 결과를 바탕으로 가장 절절한 진단 및 이에 따른 응급실에서의 초기 관리 원칙은 무엇인가?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["진단은 일과성 허혈 발작이며, 뇌졸중 재발 위험을 줄이기 위해 응급실에서 즉시 항혈소판제(아스피린) 투여를 시작한다.", "증상이 이미 3시간 전에 소실되었고 CT상 병변이 없으므로, 치료 없이 귀가 조치 후 외래에서 위험인자 관리를 시작한다.", "증상은 완전히 회복되었으나 뇌경색의 가능성을 배제할 수 없으므로, 정맥 내 혈전용해제 tPA를 투여한다.", "증상이 단시간 내에 회복되었더라도, 흡연 등 위험인자가 높아 혈괸 내 혈전제거술(Mechanical Thrombectomy) 및 스텐트 삽입술을 시행한다.", "환자는 TIA 고위험군이므로, 향후 뇌졸증 예방을 위해 즉시 정맥 내 헤파린(Hepain)투여를 시작하고 항응고제로 전환한다."], "a": 0, "A": "①", "E": "(정답률: 59%) 또 설명 안하신 부분에서 출제된 문제입니다. 30분만에 뇌졸중 증상이 사라진 것으로 보아 TIA로 판단할 수 있습니다. 치료는 TIA가 발생한 후 가능한 빨리 Antiplatelet treatment(=Aspirin)를 하는 것입니다. (+ CT를 보시면 MCA stenosis 소견이 있다고 합니다.) 8. TIA(Transient Ischemic Attack) 23년 새로 추가된 강의안", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-81", "keys": ["25-81"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>뇌졸중 발생 후 2차예방을 위해 환자에게 제공해야 하는 약물 사용 및 위험인자 관리지침에 대한 설명중, 현재 가이드라인에 가장 맞는 것은?<\/div>", "o": ["항혈소판제(예: 아스피린)는 매일 복용하는 것이 원칙이지만, 일주일에 한 번만 복용해도 뇌졸중 예방 효과는 충분히 기대할 수 있다.", "출혈 위험이 높은 수술을 앞둔 경우, 항응고제(예: 와파린)는 반드시 7일간 중단해야 하며, 대체 요법(Bridge Therapy)은 필요하지 않다.", "고혈압이 동반된 뇌졸중 환자의 경우, 뇌혈류 유지를 위해 수축기 목표 혈압은 160mmHg이하로 다소 높게 유지하는 것이 권장된다.", "당뇨병을 동반한 뇌졸중 환자에서 장기적인 혈당 조절의 목표는 당화혈색소(HbA1c) 8.0% 이하로 설정하는 것이 일반적이다.", "동맥경화성 기전의 뇌졸중 환자에서 강력한 지질 저하 요법은 필수적이며, LDL 콜레스테롤 목표는 70mg/dL 미만이 권장된다."], "a": 4, "A": "⑤", "E": "정답률: 98% 1 X - (근거: 대한뇌졸중학회 진료지침) 아스피린은 매일 투여하는 것이 원칙입니다. 일주일에 한 번만 복용해도 뇌졸중 예방 효과를 기대할 수 있다는 지침은 없으며 실제로도 혈소판은 매일 재생되므로 매일 복용을 통한 지속적인 억제가 필요합니다. 2 X - (근거: 대한뇌졸중학회 진료지침) “수술로 와파린을 일시 중단해야 하는 경우, 헤파린을 이용한 bridging therapy를 고려해야한다. 수술 5일 전 와파린을 중단하고 INR 확인 후 필요 시 헤파린으로 대체한다” 라고 되어있습니다. 7일도 틀렸고 bridging therapy가 필요 없다는 부분도 틀렸습니다. 3 X – 고혈압 동반 뇌졸중 환자의 경우 수축기 혈압을 140mmHg 이하로 낮게 유지해야 합니다. 4 X – 당뇨병 동반 뇌졸중 환자에서 당화혈색소 목표는 7% 이하입니다. 5 O – 콜레스테롤 목표는 70 미만이 맞습니다. Best medical therapy", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-91", "keys": ["25-91", "23-51", "22-39"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>76세 여자가 1시간 30분 전부터 왼쪽 팔다리의 힘이 빠져서 병원에 왔다. 밭에서 일하던 중 증상이 발생하면서 동시에 발음도 어둔해졌다고 한다. 3년 전부터 고혈압과 고지혈증 진단하에 약물 복용중이었다. 혈압 150/90 mmHg, 맥박 100회/분, 호흡 20회/분, 체온 36.8도씨이다. 신경학적 진찰에서 왼쪽의 같은쪽 반맹(homonymous hemianopsia), 구음 장애가 있으며, 왼쪽 상지와 하지는 근력등금 (MRC grade) III로 확인되고, 왼쪽에서 바빈스키 반사가 양성이다. 응급실에서 시행한 뇌 컴퓨터단층촬영 및 혈관조영술 사진이며, 출혈 소견은 관찰되지 않았고, 우측 중대뇌동맥의 폐색이 관찰되었다. 조직플라스미노겐활성화제(tPA) 사용 이후 우선적으로 필요한 치료는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["만니톨 투여", "혈압강하제 투여", "뇌실 외 배액술", "동맥 내 혈전제거술", "뇌 감압술"], "a": 3, "A": "④", "E": "23, 22년도와 동일하게 나온 Time line을 확인하는 문제입니다. 1시간 30분 전부터 뇌졸중 증상이 있는 acute stroke 환자입니다. 관련이론의 time line을 보면 IV tPA 다음 치료는 endovascular recanalization입니다. 오른쪽 혈관조영술 상에서도 막힌 혈관을 확인할 수 있습니다. - time line - 1. IV tPA : 4시간 30분 내 2. endovascular recanalization : 24시간 내 ┕ 혈전제거술 3. craniectomy : 48시간 내 ┕ 환자가 edema가 있는 경우", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2022, 2023, 2025], "ok": false, "ra": "④"}, {"id": "23-60", "keys": ["23-60"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>62세 남자가 내원 1시간 전 발생한 30분 정도 지속되는 우측 위약감 및 말이 어눌했다고 119로 병원에 왔다. 평소 건강했으며 술은 하지 않으나 하루 한갑씩 40여년 정도의 담배를 피웠다고 했다. 신경학적 검사에서 특이소견은 없었고, 환자의 CT혈관 사진은 다음과 같았다. 이 환자에게 가장 적절한 치료는?<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["경과관찰", "아스피린 300mg P.O.", "항응고제(헤파린2000U) IV", "혈전용해제 (tissue plasminogen activator)IV", "두개강 내 스텐트 삽입술"], "a": 1, "A": "②", "E": "30분 정도 지속되는 우측 위약감이 있었고, 병원에 찾아올때는 없었던 TIA(일과성허혈발작) 환자입니다. ABCD2 score상 4점으로 가능한 빨리, 24시간 이내 aspirin 또는 clopidogrel을 복용해야 합니다. 관련이론에서 TIA, 관련기출에서 ABCD2 score 보시면 될 것 같습니다. 8. TIA(Transient Ischemic Attack) 23년 새로 추가된 강의안", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "23-61", "keys": ["23-61"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>뇌경색 2차 예방을 위한 항혈전제 사용에 대한 내용중 가장 맞는 것은?<\/div>", "o": ["과거 뇌경색이 없었던 심방세동 환자는 아스피린을 복용하면 된다.", "심장판막 (기계판막) 수술을 환자는 반드시 와파린을 복용해야 한다.", "죽상동맥경화에 의한 뇌경색을 예방하기 위해 와파린을 복용해야 한다.", "과거 뇌출혈이 있었던 심방세동 환자는 항응고제보다 아스피린이 더 권장된다.", "신장기능이 좋지 않은 환자는 와파린보다 NOAC(novel oral anticoagulant) 이 권장된다."], "a": 1, "A": "②", "E": "① Primary prevention으로 뇌졸중 history가 없는 AF 환자는 아스피린을 복용하면 되지만 , 문제에서는 뇌경색 2차 예방을 물어보고 있습니다. 뇌경색 history가 있다고 생각하고 항응고제를 복용해한다고 해석해야할 것 같습니다. ② valvular disease가 있는 환자에서는 와파린을 복용해야 합니다. ⑤신장기능이 안좋은 환자, valvular disease가 있는 환자에게는 와파린이 권장됩니다. 8) 급성기 치료 후, 2차 예방", "B": "관련 강의: 강의 04 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "23-62", "keys": ["23-62"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>70세 남자 환자가 우측편마비로 입원하여 뇌경색 진단 아닌것은?<\/div>", "o": ["anterior communicating artery", "middle cerebral artery bifurcation", "cervical internal carotid artery", "posterior communicating artery", "tip of basilar artery"], "a": 2, "A": "③", "E": "교수님께서 강조하셨지만 처음 출제된 문제입니다. 관련이론 숙지해주시면 될 것 같습니다. 3) Intracranial aneurysm (Saccular aneurysm m/c ; artery가 비정상적으로 튀어나온 것)", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "22-28", "keys": ["22-28", "21-40"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 ischemic stroke classification(TOAST classification)에 해당되지 않는 것은?<\/div>", "o": ["Vascular dissection", "Arteriovenous malformation", "Large artery atherosclerosis", "Cardioembolism", "Small vessel disease"], "a": 1, "A": "②", "E": "21년도 기출과 완전 동일하게 출제 되었습니다. 5가지 classification을 외우셔야합니다. AV malformation은 ICH의 젊은 사람에서의 원인에 해당합니다. 22년 주관식으로도 출제되었으니 정확히 알아두세요!", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": false, "ra": "②"}, {"id": "22-30", "keys": ["22-30"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 혈액(not clotted)의  hounsfield number를 고르시오.<\/div>", "o": ["0", "35-40", "40", "70-100", "100"], "a": 2, "A": "③", "E": "혈액의 수치는 40입니다.", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "③"}, {"id": "21-42", "keys": ["21-42"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 급성 혈종의 hounsfield number를 고르시오<\/div>", "o": ["0", "35-40", "40", "70-100", ">100"], "a": 3, "A": "④", "E": "2022년 30번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 혈액의 수치는 40입니다.", "B": "관련 강의: 강의 06 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "④"}, {"id": "25-43", "keys": ["25-43"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>42세 남성이 경추 후궁 절제술(cervical laminectomy)을 받은 후 5일째부터 발열, 경부 통증, 상지 근력 저하를 호소하였다. 과거력상 류마티스 관절염으로 3년 이상 prednisolone을복용 중이며, 수술 전후로 특별한 합병증은 없었다. 검사에서 백혈구 증가와 CRP 상승이 있었고, 조영증강 경추 MRI에서 수술 부위 농양 형성이 확인되었다. 환자는 20갑년 이상의 흡연력이 있으며, 신장 162cm, 체중 48kg의 신체조건을 가지고 있었다. 이 환자의 수술 후 감염의 가장 중요한 위험요인은 무엇인가?<\/div>", "o": ["연령", "성별", "흡연력", "저체중", "장기간 스테로이드 복용"], "a": 4, "A": "⑤", "E": "작년과 같은 문제를 출제하셨습니다. 수술 후 감염의 주된 위험요인에는 ‘만성적인 영양결핍, 비만환자, 조절되지 않는 당뇨 환자. 면역저하, 스테로이드 투여 환자’ 등이 있으며 위 case에서는 장기간 스테로이드 복용이 가장 중요한 위험요인입니다. 5. 수술 후 척추 감염, Post-operative Spinal Infection", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-44", "keys": ["25-44"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 척수 경막외 농양(Spinal epidural abscess)에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["당뇨병, 만성 신부전증, 손상된 면역 적응력, 알콜중독, 악성 종양 등은 발생 위험 을 높이는 요인이다.", "척수 경막외 농양은 대부분 바이러스 감염에 의해 발생한다.", "진단에는 단순 X선 검사가 가장 민감한 방법이다.", "감염이 확인되면 2주 이내의 항생제 치료만으로 대부분 호전된다.", "척수 압박 증상이 없는 경우에는 항생제 치료가 필요하지 않다."], "a": 0, "A": "①", "E": "작년과 거의 비슷하게 출제하셨습니다. 다만 ‘옳은 것은‘으로 출제하셨어야 하는데 ’틀린 것은‘으로 잘못 출제하셔서 전원 정답 처리되었습니다. 문제가 올바르게 출제되었다면 정답은 1번입니다. 1. 척수 경막외 농양은 척수 경막외 마취, 요추 천자 후 합병증으로 당뇨병, 만성 신부전증, 손상된 면역 적응력, 알콜중독, 악성종양 등의 소인성 인자와 수술 후 또는 외상 후 합병증 등으로 발생합니다. 2. 척수 경막외 농양은 대부분 세균 감염입니다. 특히 S. aureus기 가장 흔합니다. 3. CT와 MRI가 gold standard입니다. 90% 진단가능합니다. 4. 골수염이 없는 경우 3~4주, 골수염이 있는 경우 6~8주 동안 치료합니다. 5. 척수 압박 증상과 상관없이 항생제 치료 진행해야 합니다. 3. 척추 경막외 농양, Spinal Epidural Abscess ,,", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "23-66", "keys": ["23-66"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>류마티스 관절염으로 prednisolone을 2년 이상 투여중인 45세의 여자가 요추간판탈출증에 대해 추간판절제술을 시행받고 3일 후부터 고열, 요통, 하지방사통이 발생하여, 검사한 요추부 MRI 조영증강 검사에서 수술 후 척추감염으로 진단되었다. 환자는 20갑년 이상의 흡연력이 있으며, 신장 162cm, 체중 48kg의 신체조건을 가지고 있었다. 다음 답가지 중 이 환자의 수술 후 감염의 주된 위험요인이라고 판단할 수 있는 것은 무엇인가?<\/div>", "o": ["연령", "성별", "흡연력", "Body mass index", "약물복용력"], "a": 4, "A": "⑤", "E": "척추 수술 후 감염의 위험요인: 만성 영양결핍, 비만, 조절되지 않는 당뇨, 면역저하, 스테로이드 투여 등. 흡연도 위험요인이지만 이 환자에서 가장 직접적인 요인은 장기간 스테로이드 투여(약물복용력)입니다. (정답률 66%, 흡연력 오답 27%)", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-68", "keys": ["23-68", "21-68"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 척수 경막외 농양(Spinal epidural abscess)에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["당뇨병, 만성 신부전증, 손상된 면역 적응력, 알콜중독, 악성 종양 등의 소인성 인자가 있다.", "최근 척추수술의 증가와 함께 급격히 증가하고 있다.", "병소 부위의 통증과 발열, 척수허혈, 척수 압박 증상이 나타날 수 있다.", "MRI로 가장 정확하게 진단 가능하다.", "항생제 치료기간은 골수염이 없는 경우 6~8주 이다."], "a": 4, "A": "⑤", "E": "항생제 치료기간은 골수염이 없으면 3~4주, 골수염이 동반되면 6~8주입니다. 소인: 당뇨·만성신부전·면역저하·알코올중독·악성종양, 경막외 마취·요추천자 후 합병증, 최근 척추 수술 증가와 함께 증가. 증상: 배부통·발열, 척수 허혈·압박(감각저하·마비). MRI가 진단의 gold standard(T1 조영 시 테두리 조영증강).", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2021, 2023], "ok": false, "ra": "⑤"}, {"id": "22-01", "keys": ["22-01"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>71세 남자가 4시간 전부터 발생한 좌반신 편마비를 주소로 응급실에 내원하였다. 이 환자는 5년전 심방 세동을 진단 받은 적이 있으나, 약물치료를 하지 않고 있었다. 급성뇌경색이 의심되어, 뇌혈류(cerebral blood flow, CBF), 뇌 혈 (cerebral blood volume. CBV). 조영제 평균 통과시간(mean transit time. MTT)을 계산하 여 신속하게 뇌관류 평가를 가능한 뇌 영상검사법은 무엇인가?<\/div>", "o": ["Single photon emission computed tomography (SPECT)", "Magnetic resonance angiography (MRA)", "Computed tomographic angiography (CTA)", "Computed tomography perfusion (CT perfusion)", "Digital subtraction angiography (DSA)"], "a": 3, "A": "④", "E": "였습니다. cerebral infarction 의심 시 cbf, cbv, mtt를 계산하여 뇌관류 평가를 합니다. 뇌관류 평가를 통해 core와 penumbra를 감별하여 치료부위를 결정합니다.", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "④"}, {"id": "22-02", "keys": ["22-02"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 요추천자를 통한 뇌척수액압의 측정에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["요추천자를 시행한 후 척추에 연결된 압력계로 측정된 수치가 뇌척수액압이며, 두개강내압으로 간주할 수 있다", "뇌척수액압의 측정은 복와위에서 시행한다.", "뇌척수액압의 정상범위는 50~180mmH,O 이다.", "뇌척수액압이 상승되어 있으면, 두 개강 내 공간점유병소, 수막염, 수두증 상태 등을 이 의심할 수 있다.", "뇌척수액압이 정상치보다 낮은 경우는 탈수 상태, 쇼크, 저혈압 중, 척수 지주막하강 의 폐쇄, 소뇌 편도 뇌탈출 상태 등을 의심할 수 있다."], "a": 1, "A": "②", "E": "강의안에 새로 추가된 부분에서 내셨습니다. ② 뇌척수액압의 측정은 측와위에서 시행한다.", "B": "관련 강의: 강의 07 감염성 질환2", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "②"}, {"id": "25-112", "keys": ["25-112"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>다음 중 중추신경계의 선천성 기형의 발생과정에 대한 설명 중 옳은 것을 고르세요.<\/div>", "o": ["신경계는 중배엽에서 분화되며, 피부외배엽의 분리가 실패하면 선천성 피부동 이 발생할 수 있다.", "신경계 정중선 유합 부전이 발생하게되면 무뇌증이나 척수수막류가 발생할 수 있다.", "척추 정중선 유합부전증이 머리 쪽에서 발생하면 척수수막류가 발생한다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다.", "이차 신경배형성으로 발생하는 종사 비후 (thick filum terminale)와 같은 기형 은 일차 신경배 형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고, 예후 도 훨씬 불량하다."], "a": 1, "A": "②", "E": "(정답률 99%) 새로 들어오신 교수님인데 주창일 교수님 야마를 완벽하게 타주셨습니다. 1. 신경계는 외배엽에서 분화됩니다. 2. 맞는 선지 3. 척추 정중선 유합부전증이 머리 쪽에서 발생하면 뇌류가 발생합니다. 4. 측부의 병소에서 예후가 좋습니다. 5. 이차 신경배형성으로 발생하는 시형은 일차 신경배형성으로 발생하는 기형보다 수술적인 치료가 쉽고 예후도 좋습니다. Development of Central Nervous System", "B": "관련 강의: 강의 09 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-114", "keys": ["25-114"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>선천성 기형에서 Dandy-Walker anomaly를 나타내는 특징을 모두 고르세요. 1. 제4뇌실의 낭종성 확장 2. 소뇌 충부의 무형성이나 형성 저하증 3. 소뇌 천막 및 주위 정맥동의 상방 전위 4. 소뇌 편도가 대후두공을 통해 하방으로 전위<\/div>", "o": ["1, 2", "1, 2, 3", "1, 3, 4", "2, 3, 4", "3, 4"], "a": 1, "A": "②", "E": "(정답률 99%) Dandy-Walker anomaly의 특징 1. 제4뇌실의 낭종성 확장 2. 소뇌 충부의 무형성이나 형성 저하증 3. 소뇌 천막 및 주위 정맥동의 상방 전위 3) Dandy walker 기형 ,,21(주),22,", "B": "관련 강의: 강의 09 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-109", "keys": ["25-109"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용중 옳은 것을 고르세요<\/div>", "o": ["약물 치료에도 불구하고 발작이 지속되는 난치성일 때", "발작의 시작 부위가 정확한 해부학적인 위치를 찾기어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장해가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "(정답률 100%) 항상 기출되는 문제입니다. 간질 치료에서 좋은 결과를 보일 수 있는 수술 대상자는 1. 약물 치료에도 불구하고 발작이 지속되는 난치성일 때 (2개이상의 약물을 최소 2년간 사용해도 조절이 힘든 경우) 2. 발작의 시작 부위를 잘 알 수 있을 때 3. 절제할 부위가 기능적으로 안전할 때입니다. 약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때는 복합항경련제 요법을 먼저 써볼 수 있으므로 수술의 적응증이 아닙니다. 5) 수술 대상자 18,, , , (빈출되는 내용이기 때문에 피마 달아두겠습니다.)", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "①"}, {"id": "25-111", "keys": ["25-111"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>갑자기 발생한 간질 발작으로 내원한 42세 여자 환자로 도로를 걷다가 멍하니 전방을 주시한 후 입맛을 다신 후 갑자기 의식소실과 함께 좌측 손은 경직되면서 손을 비비는 증상을 보였으며, 발작 직후 혼돈 증세가 심하였다. 환자는 ５년이상 약물치료를 하였지만 간헐적인 발작이 지속되고 있었다. 이러한 환자에 대한 가장 적절한 수술적 치료는?<\/div>", "o": ["뇌반구 절제술（hemispherectomy）", "미주신경 자극술 (vagus nerve stimulation)", "뇌량 차단술 （corpus callosotomy)", "전방 측두엽 제거술 （anterior temporal lobectomy）", "감마나이프 수술 （Gamma knife surgery）"], "a": 3, "A": "④", "E": "(정답률 94%) 갑자기 입맛을 다신 후 의식소실과 함께 손을 비비는 증상은 자동증(automatism)에 해당하며 temporal lobe epilepsy의 특징적인 증상입니다. 5년 이상 약물치료를 하였는데도 호전이 되지 않았으므로 전방 측두엽 제거술의 적응증이 됩니다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "23-46", "keys": ["23-46"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료 에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용 중 옳은 것을 고르세요.<\/div>", "o": ["장기간 약물 치료에도 불구하고 효과없이 발작이 지속되는 난치성일 때 마지막으로 수술적 치료를 고려한다.", "발작의 시작 부위가 정확한 해부학적 위치를 찾기 어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장애가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "② 발작의 시작 부위를 잘 알 수 있을 때 수술 한다. ③ 절제할 부위가 기능적으로 안전한 부위일 때 수술 한다. ④ 2개 이상의 약물을 최소 2년간 사용해도 조절이 힘들 경우 수술 한다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "23-47", "keys": ["23-47"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>갑자기 발생한 간질 발작으로 내원한 42세 여자 환자로 도로를 걷다가 멍하니 전방을 주시한 후 입맛을 다신 후 갑자기 의식소실과 함께 좌측 손은 경직되면서 손을 비비는 증상을 보였으며, 발작 직후 혼돈증세가 심하였다. 환자는 5년 이상 약물치료를 하였지만 간헐적인 발작이 지속되고 있었다. 더 이상 약물치료만으로는 간질 발작을 조절하기 어려워 수술적 치료를 고려하고자 한다. 이러한 환자에 대한 수술적 치료법 중 가장 효과적이라고 기대되는 수술방법은?<\/div>", "o": ["anterior temporal lobectomy", "vagus nerve stimulation", "corpus callosotomy", "hemispherectomy ➄ Gamma knife surgery"], "a": 0, "A": "①", "E": "간질 초점 동측에서는 손에서 자동증, 반대측에서는 손의 경직을 보인다는 것, 의식 소실과 함께 행동을 멈추고 응시하며 입맛을 다신다는 것, 발작 후 혼돈 증세를 보인다는 점을 통해 측두엽 간질임을 유추할 수 있습니다. (역대 기출과는 달리 전조증상에 대한 언급은 없지만, 교수님께서 답이 1번이라고 하셨습니다. 환자의 나이와 성별을 바꾸면서 지우신 것 같습니다.) 이미 5년 이상 약물치료를 했지만 발작이 지속되고 있으므로 수술 대상자입니다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "①"}, {"id": "22-19", "keys": ["22-19"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용 중 옳은 것을 고르세요.<\/div>", "o": ["약물 치료에도 불구하고 발작이 지속되는 난치성일 때", "발작의 시작 부위가 정확한 해부학적 위치를 찾기 어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장애가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "1번 선지 – 약물 치료에도 불구하고 발작이 지속되는 난치성일 때 수술을 합니다. (정답) 2번 선지 – 발작의 시작부위를 잘 알 수 있을 때 수술합니다. 3번 선지 – 절제할 부위가 기능적으로 안전한 부위일 때 수술합니다. 4번 선지 – 2개 이상의 약물을 최소 2년간 사용해도 조절이 힘든 경우 수술합니다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "22-20", "keys": ["22-20"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>신생아중 뇌 발달장애를 가지는 신경계 선천성 기형 환아들 중에서도 정신지체, 여러 형태의 난치성 발작, 특징적인 뇌파를 가지는 Lannox-Gastaut syndrome은 뇌기형, 주산기 질환, 심한 두부 손상, 감염 등이 원인이 되는데, 이러한 환자의 80%가 성인이 되어도 발작이 지속되며 항경련제에도 효과를 보이지 않는다. 치료를 위해서는 간질 원발 병소부위를 제거하기 보다는 간질파의 확산을 막아 간질 증상을 줄이는 치료가 필요하게 되는데, 이러한 환자에 대하여 가장 효과적인 수술법은?<\/div>", "o": ["감마나이프 수술 Gamma knife surgery", "편도해마체 제거술 Amygdalohippocampectomy", "측두엽 절제술 Temporal lobectomy", "뇌반구 절제술 Hemispherectomy", "뇌량 절개술 Corpus callosotomy"], "a": 4, "A": "⑤", "E": "Lannox-Gastaut syndrome은 선천적 기형이기 때문에 항경련제가 효과 없는 질환입니다. 이미 다 손상이 왔기 때문에, 뇌병변부위 제거보다는 간질파가 반대쪽으로 넘어가지 않도록 차단하는 뇌량 절개술(Corpus Callosotomy)을 시행합니다. 빈출되는 문제이니 잘 알아두세요!", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "21-31", "keys": ["21-31"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>뇌전증을 수술적으로 치료하기 위해서는 간질의 발생병소를 정확히 찾는 것이 무엇보다 중요하다, 다음 내용중 뇌전증의 발생병소를 찾기 위한 설명 중 옳지 않은 것을 고르세요.<\/div>", "o": ["뇌 MRI는 가장 기본적인 검사로 모든 뇌전증 수술 환자에대하여 시행한다.", "비디오 뇌파 검사를 통하여 환자의 간질 양상을 비디오 촬영하고 뇌파검사를 분석한다.", "와다 테스트를 시행하여 수술시 언어 영역과 기억력을 담당하는 우성 반구를 확인한다.", "SPECT 검사를 통하여 발작이 발생한 부위를 확인할 수 있다.", "비짐습적 검사를 통하여 Epileptogenic zone이 확인되지 않으면, 침습적 검사는 시행하지 않고 바로 간질 수술을 시행한다."], "a": 4, "A": "⑤", "E": "2023년 46번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: ② 발작의 시작 부위를 잘 알 수 있을 때 수술 한다. ③ 절제할 부위가 기능적으로 안전한 부위일 때 수술 한다. ④ 2개 이상의 약물을 최소 2년간 사용해도 조절이 힘들 경우 수술 한다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "⑤"}, {"id": "21-32", "keys": ["21-32"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>간질 발작으로 내원한 36세 남자 환자로 발작시 뱃속에서 치밀어 오르는 듯한 전조가 동반되며, 의식소실과 함께 멍하니 전방을 주시한 후 입맛을 다시고 우측 손은 경직되고 좌측 손은 비비는 증상을 보였으며, 발작 직후 혼돈 증세가 심하였다. 2년이상 약물치료에도 효과가 없다면 이러한 환자에 대한 가장 적절한 수술적 치료는?<\/div>", "o": ["anterior temporal lobectomy", "vagus nerve stimulation", "corpus callosotomy", "hemispherectomy"], "a": 0, "A": "①", "E": "2023년 47번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 간질 초점 동측에서는 손에서 자동증, 반대측에서는 손의 경직을 보인다는 것, 의식 소실과 함께 행동을 멈추고 응시하며 입맛을 다신다는 것, 발작 후 혼돈 증세를 보인다는 점을 통해 측두엽 간질임을 유추할 수 있습니다. (역대 기출과는 달리 전조증상에 대한 언급은 없지만, 교수님께서 답이 1번이라고 하셨습니다. 환자의 나이와 성별을 바꾸면서 지우신 것 같습니다.) 이미 5년 이상 약물치료를 했지만 발작이 지속되고 있으므로 수술 대상자입니다.", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2021], "ok": false, "ra": "①"}, {"id": "20-28", "keys": ["20-28"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질 치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 이러한 간질 수술에 대하여 좋은 결과를 보일 수 있는 수술 대상자에 대하여 설명한 내용 중 옳은 조합을 고르시오. 가) 약물 치료에도 불구하고 발작이 지속되는 난치성일 때 나) 발작의 시작 부위를 잘 알기 어려울 때 다) 절제할 부분이 기능적으로 안전한 부위일 때 라) 약물로 인한 부작용으로 약물의 선택이 어려울 때<\/div>", "o": ["가, 나, 다", "가, 다", "나, 라", "라", "가, 나, 다, 라"], "a": 1, "A": "②", "E": "2025년 109번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: (정답률 100%) 항상 기출되는 문제입니다. 간질 치료에서 좋은 결과를 보일 수 있는 수술 대상자는 1. 약물 치료에도 불구하고 발작이 지속되는 난치성일 때 (2개이상의 약물을 최소 2년간 사용해도 조절이 힘든 경우) 2. 발작의 시작 부위를 잘 알 수 있을 때 3. 절제할 부위가 기능적으로 안전할 때입니다. 약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때는 복합항경련제 요법을 먼저 써볼 수 있으므로 수술의 적응증이 아닙니다. 5) 수술 대상자 18,, , , (빈출되는 내용이기 때문에 피마 달아두겠습니다.)", "B": "관련 강의: 강의 10 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2020], "ok": false, "ra": "②"}, {"id": "25-106", "keys": ["25-106"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 요추 추간판 탈출에 대한 설명 중 옳은 것을 고르세요<\/div>", "o": ["요추 추간판의 퇴행성 변화는 주로 척추관 협착증을 일으키며, 추간판 탈출은 외상에 의하여 발생한다.", "일반적으로 제4-5번 요추 추간판 탈출이 척추관 내에서 발생하면 제5번 요수 신경근 압박에 의한 증상이 발생한다.", "제5번 요수 신경근이 압박을 받아 신경손상이 발생하면 발목을 밀어내는 힘이 감소하여, 발뒤꿈치를 들어 올리기 어렵다.", "환자의 하지방사통의 원인이 요추 추간판 탈출로 진단되면, 신경 손상을 예방하기 위해 빠른 시간내에 응급수술을 고려한다.", "척추관 협착증은 젊은 연령에서 많이 발생하는 반면에 추간판 탈출은 고령의 환자에 많이 발생한다."], "a": 1, "A": "②", "E": "② 일반적으로 제4-5번 요추 추간판 탈출이 척추관 내에서 발생하면 제5번 요수 신경근 압박에 의한 증상이 발생한다. -옳은 선지입니다. ① 요추 추간판의 퇴행성 변화는 나이에 따라 다른 양상을 보이며 무거운 물건을 많이들고 일도 많이하는 연령대(30-50)에서는 추간판 탈출증이, 활동이 적은 고령층에서는 추간판 탈출증보다는 척추관 협착증이 호발하게됩니다. 교통사고와 같이 급작스러운 외상 또한 척추의 급격한 굴신운동으로 추간판 탈출증을 일으킬 수 있지만 추간판 탈출증의 주된 원인은 퇴행성 변화입니다. 추간판 탈출증과 척추관 협착증 모두 원인은 동일하게 퇴행성 변화이지만 연령에 따라 생활습관의 차이로 연령에 따른 유병률에 차이가 나는 것으로 이해하시면 될 것 같습니다. ③ L5는 발등을 들어올리는 dorsiflexion을 담당하고, 손상시 이가 손상되어 foot drop이 나타나게 됩니다. 발목을 밀어낸다는 표현은 plantar flexion에 가까우며 이는 S1 신경근이 담당합니다. ④ 추간판 탈출증은 보전적 치료를 우선으로 시행하며 예외적으로 응급수술이 필요한 경우는 1. acute cauda equina syndrome 2. 운동약화 및 foot drop과 같은 신경학적 증상의 발생 3. 일상생활이 불가능할 정도의 통증의 세가지 상황입니다. ⑤ 위의 1번 선지 해설에 적은바와 같이 척추관 협착증은 고령에서 많이 발생하고 추간판 탈출은 비교적 젊은 연령에서 호발합니다. 1.2. 퇴행성 변화와 병태생리", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "25-108", "keys": ["25-108"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 요추 추간판 탈출에 대한 설명 중 옳은 것을 고르세요<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["1,2", "1,2,3", "1,2,3,4", "2,3,4,5", "4,5"], "a": 2, "A": "③", "E": "(정답률 83%) 1. 맞는 선지 2. 맞는 선지 3. 맞는 선지 4. 맞는 선지 5. 경추 후종인대 골화증은 척수를 압박해서 척수병증을 유발하는 것은 맞지만, 신경근병증과 비교했을 때 건반사는 증가합니다. UMN과 LMN에서의 건반사(tendon reflex) 차이를 생각해보세요. UMN 병증에서는 건반사가 증가하고 LMN 병증에서는 건반사가 감소합니다.", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "23-27", "keys": ["23-27"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 수정란에서 신경계가 발달하는 과정에서 중추신경계의 선천성 기형에 대한 예후를 설명한 내용 중에서 옳은 것을 고르시오<\/div>", "o": ["병소의 크기가 크거나 재태 기간 중 진행성 병소의 경우 예후가 양호하다", "조기에 진단된 경우일수록 예후가 양호하다", "염색체 이상, 자궁 내 감염, 다른 장기 중요 기형이 동반된 경우에는 예후가 불량하다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다"], "a": 2, "A": "③", "E": "자비로우신 교수님께서 꽤나 많은 문제를 베푸셨습니다. 무조건 외우고 들어가시길,, 권합니다. ① 병소의 크기가 크거나 재태 기간 중 진행성 병소의 경우 예후가 불량합니다. ② 조기에 진단된 경우일수록 예후가 불량합니다. ④ 중앙부 병소보다 측부의 병소에서 예후가 양호합니다.", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "③"}, {"id": "23-28", "keys": ["23-28"], "ch": 6, "g": "양성 척추질환", "stem": "<div>Dandy-walker anomaly에 대한 특징이 틀린 것을 고르시오<\/div>", "o": ["제4뇌실의 낭종성 확장", "소뇌 충부의 무형성이나 형성 저하증", "소뇌 천막 및 주위 정맥동의 상방 전위", "소뇌 편도가 대후두공을 통해 하방으로 전위"], "a": 3, "A": "④", "E": "매년 출제되는 문제입니다. Dandy-walker anomaly의 특징 세가지는 ① 제 4 뇌실의 낭종성 확장 ② 소뇌 충부(Vermis)의 무형성(Aplasia)이나 형성 저하증(Hypoplasia) ③ 소뇌 천막 및 주위 정맥동의 상방 전위 입니다.. 따라서 정답은 ④", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-29", "keys": ["23-29"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 중추신경계의 선천성 기형의 발생과정에 대한 설명 중 옳은 것을 고르세요.<\/div>", "o": ["신경계는 중배엽에서 분화되며, 피부외배엽의 분리가 실패하면 선천성 피부동이 발생 할 수 있다.", "신경계 정중선 유합부전이 발생하게 되면 무뇌증이나 척수수막류가 발생할 수 있다.", "척추 정중선 유합부전증이 머리 쪽에서 발생하면 척수수막류가 발생한다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다", "이차 신경배형성으로 발생하는 thick filum terminale 와 같은 기형은 일차신경배형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고 예후도 불량하다"], "a": 1, "A": "②", "E": "① 신경계는 외배엽에서 분화합니다. 피부외배엽과의 분리가 실패하면 선천성 피부동이 발생할 수 있다고 강조하셨습니다. ③ 척추 정중선 유합부전증이 머리쪽에서 발생하면 뇌류가 발생합니다. ④ 중앙부 병소보다 측부의 병소에서 예후가 양호합니다. ⑤ 이차 신경배형성으로 발생하는 총사 비후 (thick filum terminale)와 같은 기형은 일차 신경배형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고, 예후도 훨씬 불량하다. → 초기에 병변이 생기는 것이 예후가 불량하기 때문에 일차 신경배 형성 기형이 더 예후가 나쁩니다.", "B": "관련 강의: 강의 21 신경계양성 척추질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "②"}, {"id": "25-58", "keys": ["25-58"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>감각기관에 대한 설명 중 옳은 것은?<\/div>", "o": ["망막에서 빛을 감지하는 세포는 간상세포와 원추세포가 있는데 빛의 명암을 주 로 감지하는 세포는 원추세포이다.", "달팽이관에서 고주파의 소리를 감지하는 부분은 이소골 중 등자뼈 (stapedius)가 붙어 있는 시작부 쪽이다.", "후각은 여러 감각기관 중 상대적으로 퇴화된 부분으로 감정 기억 언어 등 인지 기 능에 미치는 영향은 별로 없는 편이다.", "촉각은 고유감각과 통감으로 나누어져 서로 다른 경로로 대뇌피질에 전달된다.", "미각은 단 맛, 짠맛, 쓴맛, 매운 맛, 감칠맛, 신맛으로 나뉘고 각각의 맛에 따라 고 유한 분자가 따로 존재한다."], "a": 3, "A": "④", "E": "정답률 58퍼입니다. 2번을 많이 찍었다고 합니다. ① 빛의 명암을 주로 감지하는 세포는 간상세포입니다. 원추세포는 색을 구별하는 세포입니다. ② 이쪽 공부를 덜 하고 시험을 봐서 그런가 현장에서는 이상함을 잘 못 느꼈는데 해설을 쓰다보니 왜 틀렸는지 잘 모르겠네요.. 달팽이관의 기저부에서 고주파를, 첨부에서 저주파를 감지하는 것은 맞습니다. 최대한 오류를 지적해보자면 교수님의 특성 상, “소리를 감지하는 것은 진동하는 부위가 아니라 유모세포다!”라고 할 수도 있겠습니다. ③ 후각은 중요한 것 외에 나머지 receptor는 시각에 배분되어 시각에 비해 상대적으로 약한 모습이지만, 반대로 시각이 망가지면 다시 후각으로 재배분된다고 합니다. 따라서 퇴화라고 봐야할지 의문이고, 확실하게 틀린 부분은 후각이 감정과 기억에 중요하다는 점입니다. 관련 이론을 보니 매년 교수님의 설명이 조금씩 달라지는 것 같은데 초안자, 검안자의 첨언을 참고해주세요. gemini의 설명에 의하면 후각 정보는 다른 감각들과 달리 시상을 거치지 않고 바로 후각피질로 전달되고 후각피질은 기억과 감정과 관련된 해마, 편도체와 밀접한 연관이 있다고 합니다. ④ 촉각에는 진동, 고유감각, 통증, 온도 등이 있는데 fine touch, vibration, two-point discrimination, proprioception은 Dorsal column-medial lemniscus (DCML)를 통하고 pain, temperature은 spinothalamic tract를 통해 최종적으로 대뇌피질에 전달됩니다. (4) Seonsory pathway: Vision", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-61", "keys": ["25-61"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 조건화 기억에 관여한다고 알려진 뇌 부분은?<\/div>", "o": ["기저핵", "해마", "대뇌 신피질", "소뇌", "편도체"], "a": 3, "A": "④", "E": "기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-70", "keys": ["25-70"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 나이가 들어도 기능이 떨어지지 않는 인지영역은 무엇인가?<\/div>", "o": ["Speed of processing", "Working memory", "동의어 어휘 능력", "장기기억", "자유연상 기억"], "a": 2, "A": "③", "E": "정답률 51퍼입니다. 기억은 고정되어 있는 crystallized intelligence와 변동 가능한 fluid intelligence로 나눌 수 있는데 world knowledge는 나이가 들어도 떨어지지 않는 대표적인 지식입니다. 이에 해당하는 것에 ‘어휘력, 일반 상식, 전문 지식’ 등이 있습니다. (4번 – Long term memory, 5번 – Free recall) 4) 노화에 따른 인지의 변화", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "③"}, {"id": "25-71", "keys": ["25-71"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 노쇠의 증상에 해당되지 않는 것은?<\/div>", "o": ["난청", "인지 저하", "근육 쇠퇴", "체중 감소", "모두 해당된다"], "a": 4, "A": "⑤", "E": "찾아보니 강의안에 나온 5가지 기준은 미국의 노년학자가 개발한 신체 노쇠를 평가하는 ‘Fried 기준’이고, 1, 2번 선지의 경우에는 밑줄 쳐진 노쇠의 정의 : increased vulnerability resulting from aging-associated decline in reserve and function에 해당한다고 간주하여 정답인 것 같습니다. 3) 노쇠", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "⑤"}, {"id": "25-72", "keys": ["25-72"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 급격히 진행하는 치매질환에 해당되는 것은?<\/div>", "o": ["알츠하이머", "파킨슨 병", "헌팅턴병", "만성 자가면역 뇌염", "CADASIL (Cerebral Autosomal Dominant Arteriopathy with Subcortical Infarcts and Leukoencephalopathy)"], "a": 3, "A": "④", "E": "① 알츠하이머병 (Alzheimer's disease): 수년에 걸쳐 매우 서서히 발병하여 점진적으로 진행되는 것이 특징입니다. (평균적으로 진단 후 수년에서 10여 년 이상 진행됨) ② 파킨슨병 (Parkinson's disease): 운동 증상이 주가 되며, 치매가 발생하더라도 대개는 병의 경과가 비교적 느립니다. ③ 헌팅턴병 (Huntington's disease): 유전성 신경퇴행성 질환으로, 무도증, 인지 기능 저하 등이 특징이며, 진행은 알츠하이머병과 마찬가지로 수년에 걸쳐 점진적입니다. ④ 만성 자가면역 뇌염 (Chronic Autoimmune Encephalitis): 자가면역 뇌염은 면역 세포가 뇌를 공격하여 발생하며, 급성 또는 아급성(수주~수개월)으로 심각한 기억 상실, 인지 저하, 경련 등의 증상을 일으킬 수 있는 가역적(치료 가능한) 원인 중 하나입니다. 치료하지 않으면 심각한 후유증을 유발하거나 사망에 이를 수 있어 RPD의 중요한 원인으로 간주됩니다. ⑤ CADASIL: 유전성 혈관성 치매로, 만성적인 뇌졸중과 백질변성(Leukoencephalopathy)을 일으키며, 치매는 보통 점진적으로 진행됩니다. (3) 진행속도에 따른 치매의 분류", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "④"}, {"id": "25-73", "keys": ["25-73"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음의 알츠하이머병의 진단에 사용되는 혈액검사항목 중 병의 시작과 진행과정을 모니터링하는데 도음이 될 것으로 생각되는 검사항목은 무엇인가?<\/div>", "o": ["혈중 베타 아밀로이드 단백", "혈중 인산화 타우 단백", "혈중 신경필라멘트 (Neurofilament light chain, NfL)", "혈중 교세포섬유질 산성 단백질 (glial fibrillary acidic protein, GFAP)", "혈중 수초염기성 단백 (myelin basic protein, MBP)"], "a": 1, "A": "②", "E": "아밀로이드의 경우에는 뇌에 일정량의 플라크가 쌓이고 나면 혈액이나 CSF로 배출되는 아밀로이드 단백이 감소한 채로 plateau를 이룬다고 합니다. 따라서 병의 시작을 확인하기에는 좋으나 진행과정을 모니터링하거나 치료효과를 확인하는 데에는 pTau나 NfL에 비해 민감도가 떨어진다고 합니다. pTau는 아밀로이드 다음으로 변화가 시작되어 이후 시점까지 지속적으로 증가하기 때문에 정답은 2번입니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": false, "ra": "②"}, {"id": "23-25", "keys": ["23-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 알츠하이머 치매에 대한 위험요소에 해당하는 것을 고르시오.<\/div>", "o": ["고령", "여성", "심혈관 위험요소(고혈압, 고지혈, 당뇨, 흡연, 음주 등)", "우울증", "이상 모두"], "a": 4, "A": "⑤", "E": "언급하지 않으신 부분에서 출제되었습니다. 기출도 없고 21피마만 있었는데 출제되었네요... 치매의 위험요소는 모두 해당하는 문제였습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "⑤"}, {"id": "23-26", "keys": ["23-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>파킨슨 관련 치매에 대한 설명으로 맞는 것은?<\/div>", "o": ["파킨슨관련 단백질은 alpha synuclein, 알츠하이머는 amyloid, tau로 서로 다른 병태생리를 보여 한 환자에서 같이 나타날 수 없다.", "세포 내의 특이 단백질이 뭉쳐서 나타난 것을 루이(소)체 라고 하는 데 뇌 전체에 걸쳐서 나타나는 것을 파킨슨 치매라고 하고 중뇌의 흑색질에만 나타나는 것을 파킨슨병이라고 한다.", "파킨슨병과 루이체 치매는 병태생리가 서로 다르다", "루이체 치매는 파킨슨 증상과 더불어 선명한 환시, 반복되는 낙상, 정신병적 모습, 수면장애 등 복합적인 증상을 보이고 심한 치매로 진행하는 속도가 알츠하이머 치매보다 빠른 편이다.", "루이체 치매는 인지장애에 더불어 파킨슨 증상을 동반하지 않으면 진단할 수 없다."], "a": 3, "A": "④", "E": "파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "23-44", "keys": ["23-44"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>기억과 관련된 뇌 구조는?<\/div>", "o": ["헤슬 회 Heschl gyrus", "각 회 angular gyrus", "쐐기앞엽 precuneus gyrus", "내후각피질 Entorhinal cortex", "대상 회 cingulate gyrus"], "a": 3, "A": "④", "E": "① Heschl‘s gyurs : Transverse temporal gyri라고 하며, primary auditory cortex를 포함한다. (17, 37 41) ② Angular gyrus : visual to auditory conversation (42쪽) ③ Precuneus gyrus : broaddmann area 17에 해당하며, 일차 시각 피질입니다. ④ Entorhinal cortex : Memory, associative component와 관련 (45쪽 ⑤ Cingulate gyrus : limbic system에 중요. Emotion에 관련 (45", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": false, "ra": "④"}, {"id": "22-21", "keys": ["22-21"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>24세의 여자가 반복적으로 의식을 잃는 모습을 보인다고 하여 내원하였다. 이상 증상은 약 2년 전부터 나왔는데 눈동자가 멍해지고 불러도 반응이 없는 모습이 보이며 입맛을 쩝쩝 다시고 손은 무엇을 만지는 듯한 모습을 보였다고 한다. 약 2~3분 정도 증상이 있다가 주변에 대한 반응을 보이고 이전과 같아지는데 그동안에 있었던 일을 기억하지 못한다고 한다. 과거력에서 어렸을 때 열이 나면서 경기가 몇 번 있었다고 하며 학교생활이나 운동능력도 정상적이었다. 신체검사나 신경학적 검사에서 이상은 없었고 혈액검사도 정상이며 뇌 MRI 사진과 뇌파검사는 다음과 같다. 이 환자에 대한 적절한 것을 고르면? (선명하게 캡쳐되지 않아 사진이 흐리나, 문제를 푸는데 지장은 없을듯 합니다.)<\/div><div class=\"small\" style=\"color:#b07a12\">[그림 누락: 원본 복원 파일의 그림을 아직 넣지 못했습니다]<\/div>", "o": ["뇌파의 화살표는 발작파로 좌측 내측 측두부에서 최대전위를 보인다.", "좌측 해마 경화증으로 인해 기억력에 문제가 생긴다.", "주된 발작은 부분복합발작으로 약물치료 후 예후가 좋다.", "여성이 더 많이 호발한다.", "어릴때 발생한 열경기가 성장해서 뇌전증으로 발전했다."], "a": 0, "A": "①", "E": "반복적으로 의식을 잃고, 멍해지고 불러도 반응이 없고, 입맛을 다시고 손은 무엇을 만지는 듯한 모습(=자동증)을 보이고, 그동안에 있었던 일을 기억하지 못하는 증상을 보입니다. 이것은 복합 부분발작의 증상이며 주로 측두엽에 문제가 있다는 특징이 있습니다. 뇌 MRI 소견) Lt. hippocampus에서 Sclerotic change 뇌파검사 소견) Lt. temporal area에서 뾰족한 발작파가 관찰 - EEG를 읽을 때 hint : 홀수-왼쪽 , 짝수-오른쪽 / F : Frontal, C : Central, P : Parietal, O : Occipital 1번 선지 – 맞는 설명 2번 선지 – 교수님) 좌측 해마 경화증이 있는 것은 맞지만, 발작 동안의 일을 기억하지 못하는 것은 기억력과는 직접적인 연관이 없다. 추가적으로 덧붙여 보자면 학교생활이 정상적이고, 신경학적 검사가 정상적이었기 때문에 기억력은 정상이라고 볼 수 있습니다. (신경학적 검사에 기억력 검사항목이 존재) 3번 선지 – 교수님) 발작을 일으키는 병변이 뇌에 있기 때문에 약 복용 시에는 발작 빈도를 낮출 수 있지만 약을 복용하지 않으면 다시 재발하기 때문에 예후가 좋다고 할 수 없다. 약물치료를 일정기간 한다고 해서 완치가 되는 것이 아니다. 추가적으로 제가 검색해본 바로는 ‘측두엽 간질은 측두엽 부위의 결함이나 상처가 있으면 약물 조절을 어렵게 만들며 이 경우 수술 치료의 대상이 된다’고 합니다. 4번 선지 – 성별이나 인종은 영향이 없습니다. 5번 선지 – 복합열성경련의 경우 뇌전증 확률이 증가하는 것은 맞지만, 복합 열성경련을 하는 아이들은 뇌기능 발달에 문제가 있거나 신경 발달 이상이 있는 경우가 많습니다. 즉, 열성 경련 자체가 뇌전증으로 발전하는 것이 아니라 원래 뇌에 병변이 있어서 뇌전증으로 발전", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "①"}, {"id": "22-23", "keys": ["22-23"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>syncope과 seizure의 가장 확실한 감별점은 무엇인가?<\/div>", "o": ["낙상(falling)", "의식소실", "기억상실", "사지경련", "가장 확실한 감별점은 없다"], "a": 4, "A": "⑤", "E": "1번은 둘다 spell시 나타날 수 있습니다. 두 질환의 특징적인 소견은 아니라서 표에 없습니다. 2번은 각각 <20sec, >60sec을 보입니다. 3번은 automatism을 고려한다면 둘다 기억상실이 동반될 수 있습니다. 4번은 sepll시 나타나는 movement안에 사지경련이 포함될 수 있습니다. 명확히 O, X로 나뉘는 소견이 없어 답이 5번 같습니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "⑤"}, {"id": "22-25", "keys": ["22-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>감정, 정서, 기억 등과 관련된 Papez 회로를 변연계에 포함되지 않는 것은? (문제가 좀 이상한데 원래 이랬습니다..)<\/div>", "o": ["해마", "유두체", "기저핵", "시상", "대상회"], "a": 2, "A": "③", "E": "바로 아래 기출과 같은 문제입니다. Papez circuit은 해마-유두체(시상하부)-전방 시상핵-대상회(=띠이랑)-내후각피질&해마주위고랑 순으로 진행합니다. 회로의 구조물을 모두 정리하시고 한글 term도 알고 있어야 합니다.", "B": "관련 강의: 강의 20 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": false, "ra": "③"}, {"id": "21-26", "keys": ["21-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>75세의 남자가 약 1년 전부터 발생한 기억력 저하를 주소로 내원하였다. 8년 전부터 왼손에 가만히 있을 때 떨림이 있었고 경부와 몸통의 경직이 있으며 걸음걸이가 느려지는 모습을 보이며 파킨슨병 진단하에 약물치료를 시작하였고 운동증상이 호전되어 문제없이 생활하였다. 4년 전부터 말을 시작할 때 첫 마디를 꺼내기 힘들었고 단어가 잘 떠오르지 않아 ‘이거저거’하는 말을 자주 사용하게 되었다. 3년 전부터는 기억이 예전만 못하다는 것을 느꼈고 2년 전에 공원에 갔다가 길을 잃고 헤맨 적도 있었다. 1년 전부터 기억력 저하가 뚜렷해져서 자주 물어보고 한 말을 또 하고 뜬금없는 말을 할 때도 있었다. 말귀를 못 알아듣거나 대화가 끊기는 경우도 생기고 성격도 변해서 우울하고 말수도 줄어들었다.
