const D=JSON.parse(document.getElementById('data').textContent);const M=D.meta;
const CIR='①②③④⑤⑥⑦';const K=k=>M.slug+'_'+k;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(K(k)))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}};
/* 기존 내분비 사이트의 오답노트(endo_wrong) 이어받기 */
if(M.slug==='endo'){try{for(const k of['wrong','wrong_dyn','mix'])if(localStorage.getItem('endo_'+k)!==null&&localStorage.getItem(K(k))===null)localStorage.setItem(K(k),localStorage.getItem('endo_'+k))}catch(e){}}
let wrong=new Set(LS.get('wrong',[]));let wdyn=LS.get('wrong_dyn',{});
const YEARS=[...new Set(D.q.flatMap(x=>x.y||[]))].sort((a,b)=>b-a);
const st={chs:new Set(M.ch.map(c=>c.id)),yrs:new Set(YEARS),kind:'all',fmt:LS.get('fmt','all'),order:'shuffle',n:20,mix:LS.get('mix',true)};
let run=null;
const $=s=>document.querySelector(s);const app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE=Object.fromEntries(M.ch.map(c=>[c.id,c.mode]));
const MODEL={repeat:'반복',minor:'소폭 변형',major:'대폭 변형'};
const LVL={minor:'소폭 변형',major:'대폭 변형'};
const isVary=m=>m==='minor'||m==='major';
const byId=Object.fromEntries(D.q.map(x=>[x.id,x]));
/* 주관식(t='s'): 답 = {txt, auto, ok}. auto는 acc(인정 답) 중 하나가 입력에 들어 있으면 true, acc가 비어 있으면(여러 항목을 써야 하는 문항) null → 스스로 채점 */
const isS=x=>x.t==='s';
const NRM=t=>String(t).toLowerCase().normalize('NFC').replace(/[\s\-–·.,'’"()\/_~:;]/g,'');
const autoGrade=(x,t)=>{if(!(x.acc||[]).length)return null;const n=NRM(t);return !!n&&x.acc.some(a=>{const m=NRM(a);return m&&n.includes(m)})};
const right=(x,a)=>isS(x)?!!(a&&a.ok):a===x.a;
const nS=D.q.filter(isS).length;
/* 변형 문항의 연도 = 원본 문항의 연도 */
const yrsOf=x=>x.v?((byId[x.base]||{}).y||[]):(x.y||[]);
function pool(){let q=D.q.filter(x=>st.chs.has(x.ch));
 if(st.yrs.size<YEARS.length)q=q.filter(x=>yrsOf(x).some(y=>st.yrs.has(y)));
 if(st.fmt==='mc')q=q.filter(x=>!isS(x));if(st.fmt==='s')q=q.filter(isS);
 if(st.kind==='past')q=q.filter(x=>!x.v);if(st.kind==='var')q=q.filter(x=>x.v);
 if(st.kind==='wrong')q=q.filter(x=>wrong.has(x.id)).concat(Object.values(wdyn).filter(x=>st.chs.has(x.ch)));return q}
const varyChs=()=>new Set([...st.chs].filter(c=>isVary(MODE[c])));
const hasGen=typeof dynamicQs==='function';
function build(){const p=pool();let q=st.order==='shuffle'?shuffle(p):p.slice();
 const dynOK=hasGen&&st.fmt!=='s'&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size;
 if(!dynOK){if(st.n)q=q.slice(0,st.n);return q}
 const total=st.n||(st.kind==='var'?q.length+30:q.length+40);
 const k=Math.max(st.kind==='var'?Math.ceil(total/2):Math.round(total*0.25),total-q.length);
 const dyn=dynamicQs(varyChs(),k);q=q.slice(0,total-dyn.length).concat(dyn);
 return st.order==='shuffle'?shuffle(q):q.sort((a,b)=>a.ch-b.ch)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 과목·교수님별 경향 분석 (data/<slug>/trends.json → D.trends). 교수님 순서는 파트 순서를 따른다 */
function trendsHtml(){const T=D.trends;if(!T)return'';
 const byP=Object.fromEntries((T.profs||[]).map(p=>[p.prof,p]));
 const profs=[...new Set(M.ch.map(c=>c.prof))].filter(p=>byP[p]);
 const cmp=p=>M.ch.filter(c=>c.prof===p).map(c=>`${MODEL[c.mode]||c.mode} — ${c.why||''}`)[0]||'';
 return `<div class="panel tr"><h2>과목·교수님별 경향 분석</h2><div class="src">${esc(T.sources||'')}${T.updated?` (${esc(T.updated)} 정리)`:''}</div>
 <ul>${(T.summary||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
 ${(T.analysis||[]).length?`<div class="an"><b>기출 비교로 본 판단</b><ul>${T.analysis.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
 ${profs.map(p=>{const x=byP[p];const md=M.ch.find(c=>c.prof===p);return `<details><summary>${esc(p)} 교수님 <small>${esc(x.lectures||'')} · <span class="md ${isVary(md.mode)?'vary':''}">${MODEL[md.mode]||md.mode}</span></small></summary>
 <ul>${(x.points||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${(x.analysis||[]).length?`<div class="an"><b>기출 비교로 본 판단</b><ul>${x.analysis.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}<div class="cmp">연도 비교: ${esc(cmp(p))}</div></details>`}).join('')}</div>`}
function home(){
 const p=pool();const nv=D.q.filter(x=>x.v).length;
 const rep=M.ch.filter(c=>c.mode==='repeat').map(c=>c.prof);const unv=D.q.filter(x=>!x.ok).length,dr=D.q.filter(x=>x.ok&&x.vb==='초안').length;
 app.innerHTML=`${unv?`<div class="warn"><b>미검증</b> 문항 ${unv}개: 2026년 강의 자료가 아직 없어 복원 해설의 답을 그대로 실었습니다. 강의 자료가 올라오면 다시 검증합니다.</div>`:''}${dr?`<div class="warn" style="border-color:#3b6fb6;background:#eef3fb"><b>초안으로 검증됨</b> 문항 ${dr}개: 검안본이 올라오면 다시 확인합니다.</div>`:''}<div class="panel"><div class="lbl">파트 (2026 담당)</div><div class="row" id="chs">
 <button class="chip ${st.chs.size===M.ch.length?'on':''}" data-all>전체</button>${M.ch.map(c=>`<button class="chip ${st.chs.has(c.id)?'on':''}" data-c="${c.id}" title="${esc(c.why||'')}">${esc(c.title.replace(/^[^.]+\.\s*/,''))} · ${esc(c.prof)} <small class="md ${isVary(c.mode)?'vary':''}">${MODEL[c.mode]||c.mode}</small></button>`).join('')}</div>
 ${YEARS.length>1?`<div class="lbl">출제 연도</div><div class="row">${YEARS.map(y=>`<button class="chip ${st.yrs.has(y)?'on':''}" data-y="${y}">${y}</button>`).join('')}</div>`:''}
 <div class="lbl">문제 종류</div><div class="row" id="kind">${[['all','기출+변형'],['past','기출(원본)만'],...(nv||hasGen?[['var','변형만']]:[]),['wrong',`오답노트 (${wrong.size+Object.keys(wdyn).length})`]].map(([k,t])=>`<button class="chip ${st.kind===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
 ${nS?`<div class="lbl">문제 형식</div><div class="row">${[['all','전체'],['mc','객관식만'],['s',`주관식만 (${nS})`]].map(([k,t])=>`<button class="chip ${st.fmt===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>`:''}
 <div class="lbl">순서 · 문항 수</div><div class="row" id="ord">${[['shuffle','무작위'],['seq','문제집 순서']].map(([k,t])=>`<button class="chip ${st.order===k?'on':''}" data-o="${k}">${t}</button>`).join('')}
 <span style="width:12px"></span>${[10,20,50,0].map(n=>`<button class="chip ${st.n===n?'on':''}" data-n="${n}">${n||'전부'}</button>`).join('')}</div>
 <div class="lbl">선지 순서</div><div class="row">${[[true,'섞기'],[false,'원래 순서']].map(([k,t])=>`<button class="chip ${st.mix===k?'on':''}" data-m="${k}">${t}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px;justify-content:space-between"><span class="small">선택된 고정 문항 ${p.length}개${hasGen&&(st.kind==='all'||st.kind==='var')&&st.yrs.size===YEARS.length&&varyChs().size?' + 매번 새로 만드는 변형 문항':''}</span><button class="go" id="start" ${p.length?'':'disabled'}>시작</button></div></div>
 <div class="panel small">${rep.length?`<b>반복</b> 표시 교수님(${esc([...new Set(rep)].join('·'))})은 해마다 같은 문항을 거의 그대로 내셔서 기출만 나옵니다. `:''}<b>소폭 변형</b> 표시 교수님은 보기·수치·발문만 바꿔 내시고, <b>대폭 변형</b> 표시 교수님은 같은 개념을 다른 증례나 형식으로 내셔서, 그 수준에 맞춘 예상 변형 문항을 함께 실었습니다.<br>기출 문항의 연도 태그는 같은 선지·정답으로 출제된 해를 모두 표시합니다. 보라색 <b style="color:var(--var)">변형</b> 문항은 기출을 바탕으로 만든 예상 문제이고, 원본 문항 번호를 함께 표시합니다. 틀린 문제는 이 브라우저의 오답노트에 저장됩니다.</div>${trendsHtml()}`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(st.chs.size===M.ch.length){st.chs=new Set([c])}else{st.chs.has(c)?st.chs.delete(c):st.chs.add(c);if(!st.chs.size)st.chs=new Set(M.ch.map(c=>c.id))}home()});
 app.querySelector('[data-all]').onclick=()=>{st.chs=new Set(M.ch.map(c=>c.id));home()};
 app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y;if(st.yrs.size===YEARS.length){st.yrs=new Set([y])}else{st.yrs.has(y)?st.yrs.delete(y):st.yrs.add(y);if(!st.yrs.size)st.yrs=new Set(YEARS)}home()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{st.order=b.dataset.o;home()});
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.fmt=b.dataset.f;LS.set('fmt',st.fmt);home()});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mix=b.dataset.m==='true';LS.set('mix',st.mix);home()});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
 $('#start').onclick=()=>{run={q:build(),i:0,ans:{}};show()};
}
function baseTag(x){const b=byId[x.base];return b?`원본 ${b.keys.map(k=>`20${k.slice(0,2)} #${k.slice(3).replace('-1','')}`).join(', ')}`:(x.N||'')}
/* 검증 표시: ok=false → 미검증, vb='초안'|'검안' → 그 자료로 검증, vb='교과서' → 강의 근거 없어 교과서·진료지침으로 확인, vb 없음(옛 데이터) → 검증 */
const VL=x=>x.ok===false?'미검증':(x.vb==='교과서'?'교과서로 확인함':(x.vb?x.vb+'으로 검증됨':'검증됨'));
function tags(x){const u=`<span class="${x.ok===false?'u':(x.vb==='초안'?'k1':'k2')}">${x.ok===false?'미검증':(x.vb==='교과서'?'교과서 확인':(x.vb?x.vb+' 검증':'검증'))}</span>`;
 if(x.v)return `<span class="v">${x.pred?'예상 주관식':'변형'+(x.lv?' · '+(LVL[x.lv]||x.lv):'')}</span>${u}<span class="g">${esc(x.dyn?x.N:baseTag(x))}</span>`;
 return x.keys.map(k=>`<span>20${k.slice(0,2)} #${k.slice(3).replace('-1','')}</span>`).join('')+'<span class="y">원본</span>'+(isS(x)?'<span class="s">주관식</span>':'')+u+`<span class="g">${esc(x.g)}</span>`}
function show(){
 const x=run.q[run.i],a=run.ans[x.id];const done=a!==undefined;
 if(isS(x))return showS(x,a);
 if(!run.perm)run.perm={};if(!run.perm[x.id])run.perm[x.id]=st.mix?shuffle(x.o.map((_,i)=>i)):x.o.map((_,i)=>i);
 const P=run.perm[x.id],moved=P.some((v,i)=>v!==i);
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${nOk()}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div>${P.map((i,pos)=>`<button class="opt ${done?(i===x.a?'ok':(i===a?'bad':'')):''}" data-i="${i}" ${done?'disabled':''}><b>${CIR[pos]}</b>${esc(x.o[i])}${done&&moved?`<span class="orig">원래 ${CIR[i]}</span>`:''}</button>`).join('')}</div>
 ${done?`<div class="ex ${a===x.a?'':'wrong'}"><div class="h">${a===x.a?'맞았습니다':'틀렸습니다'} · 정답 ${CIR[P.indexOf(x.a)]}${moved?` <span class="origh">(원래 번호 ${x.v?CIR[x.a]:esc(x.A)} · 해설의 선지 번호는 원래 순서 기준)</span>`:(x.v?'':(x.A&&x.A.length>1?` <span class="origh">${esc(x.A)}</span>`:''))}</div><div>${esc(x.E)}</div>${x.N&&!x.v?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.v&&!x.dyn&&x.N?`<div class="lv">${esc(x.N)}</div>`:''}${x.ok===false?'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>':(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb==='교과서'?'<div class="small">강의 자료에 근거가 없어 교과서·진료지침으로 확인함</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':'')))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;run.ans[x.id]=i;if(x.dyn){if(i===x.a)delete wdyn[x.id];else wdyn[x.id]=x;LS.set('wrong_dyn',wdyn)}else{if(i===x.a)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
const nOk=()=>Object.entries(run.ans).filter(([id,v])=>right(run.q.find(q=>q.id===id),v)).length;
function exFoot(x){return `${x.N&&!(x.pred&&x.N.startsWith('주관식 예상'))?`<div class="note">※ ${esc(x.N)}</div>`:''}${x.ok===false?(x.pred?'<div class="note">※ 미검증: 동기 정리본·교과서 기준 답이며 26 학습부와 대조하지 않았습니다.</div>':'<div class="note">※ 미검증: 복원 해설 기준 답입니다.</div>'):(x.vb==='초안'?'<div class="small">초안으로 검증됨 · 검안본이 올라오면 다시 확인합니다.</div>':(x.vb==='교과서'?'<div class="small">강의 자료에 근거가 없어 교과서·진료지침으로 확인함</div>':(x.vb?'<div class="small">검안으로 검증됨</div>':'')))}${x.B?`<div class="src">근거: ${esc(x.B)}</div>`:''}`}
function mark(x,ok){if(ok)wrong.delete(x.id);else wrong.add(x.id);LS.set('wrong',[...wrong])}
function showS(x,a){const done=a!==undefined;
 app.innerHTML=`<div class="panel"><div class="top"><span>${run.i+1} / ${run.q.length}</span><span>맞힌 문제 ${nOk()}</span></div>
 <div class="bar"><i style="width:${(run.i+1)/run.q.length*100}%"></i></div>
 <div class="tags">${tags(x)}</div><div class="stem">${x.stem}</div>
 ${(x.img||[]).map(s=>`<div class="img"><img src="${s}" alt="문항 그림"></div>`).join('')}
 <div class="sa">${done?`<div class="small">내 답</div><div class="mine">${esc(a.txt)||'<span class="small">(빈칸)</span>'}</div>`:`<textarea id="sa" placeholder="답을 적고 '답 확인'을 누르세요 (한글·영어 모두 가능)"></textarea><div class="row" style="justify-content:flex-end"><button class="ghost" id="skip">모르겠음</button> <button class="go" id="chk">답 확인</button></div>`}</div>
 ${done?`<div class="ex ${a.ok?'':'wrong'}"><div class="h">정답: <span class="ans">${esc(x.A)}</span></div>
 <div class="grade"><span class="small">${a.auto===null?'여러 항목을 쓰는 문항이라 직접 채점해 주세요.':(a.auto?'자동 채점: 인정 답과 일치':'자동 채점: 인정 답과 다름 (철자·표현 차이면 맞음으로 바꾸세요)')}</span>
 <button class="chip ${a.ok?'on':''}" data-g="1">맞음</button><button class="chip ${a.ok?'':'on'}" data-g="0">틀림</button></div>
 <div style="margin-top:8px">${esc(x.E)}</div>${exFoot(x)}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="prev" ${run.i?'':'disabled'}>이전</button> <button class="go" id="next" ${done?'':'disabled'}>${run.i+1<run.q.length?'다음':'결과 보기'}</button></span></div></div>`;
 const sub=t=>{const au=autoGrade(x,t);run.ans[x.id]={txt:t,auto:au,ok:au===true};mark(x,au===true);show()};
 if(!done){const ta=$('#sa');ta.focus();$('#chk').onclick=()=>sub(ta.value.trim());$('#skip').onclick=()=>sub('');
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))sub(ta.value.trim())}}
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{a.ok=b.dataset.g==='1';mark(x,a.ok);show()});
 $('#home').onclick=home;$('#prev').onclick=()=>{run.i--;show()};
 $('#next').onclick=()=>{if(run.i+1<run.q.length){run.i++;show();scrollTo(0,0)}else result()};
}
function result(){
 const ok=run.q.filter(x=>right(x,run.ans[x.id]));const bad=run.q.filter(x=>!right(x,run.ans[x.id]));
 app.innerHTML=`<div class="panel"><div class="score">${ok.length} / ${run.q.length}</div><div class="small">틀린 문제는 오답노트에 저장되었습니다.</div>
 ${bad.length?`<div class="lbl">틀린 문제 (눌러서 다시 보기)</div><div class="wl">${bad.map(x=>`<div data-id="${x.id}">${x.v?'[변형] ':''}${isS(x)?'[주관식] ':''}${esc(x.stem.replace(/<[^>]+>/g,' ').slice(0,70))}…</div>`).join('')}</div>`:''}
 <div class="nav"><button class="ghost" id="home">처음으로</button><span><button class="ghost" id="again">같은 설정으로 새로 풀기</button> ${bad.length?'<button class="go" id="retry">틀린 문제만 다시</button>':''}</span></div></div>`;
 $('#home').onclick=home;$('#again').onclick=()=>{run={q:build(),i:0,ans:{}};show();scrollTo(0,0)};
 if(bad.length){$('#retry').onclick=()=>{run={q:shuffle(bad),i:0,ans:{}};show()};
 app.querySelectorAll('.wl div').forEach(d=>d.onclick=()=>{run.i=run.q.findIndex(q=>q.id===d.dataset.id);show()})}
}
home();
</script></body></html>
