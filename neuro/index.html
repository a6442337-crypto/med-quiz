내원 2일 전 아침에 갑자기 발생한 일시적인 우측 마비감을 주소로 응급실에 왔다. 증상은 5분 정도 지속되었고 우측 팔과 다리가 힘이 없으면서 주위 사람들에게 소리를 지르고 싶었으나 말이 나오지 않았다고 했다. 이후 증상은 없었으나 불안해서 왔다고 했다. 작년부터 고혈압이 있었으나 약을 복용하지 않고 지냈으며 하루 한 갑씩 40여 년 피웠던 흡연자였다. 뇌 CT 검사에서는 이상이 없었다. 이 환자의 ABCD2 score는 몇 점인가?<\/div>", "o": [], "a": -1, "A": "4", "acc": ["4"], "E": "탈마 문제입니다. 가르치시지도 않으신 내용입니다. 다만 21년도에 ABCD2 score를 계산해서 답을 구하는 문제가 있었는데 그 문제를 보고 또 출제하실 수도 있었다는 것을 눈치챘어야 했을 것 같습니다. 안성환 교수님 파트는 배우지 않은 내용이라도 마에 조금이라도 있다면 공부해두시는 것을 추천드립니다. ABCD2 score는 연령(Age), 혈압(Blood pressure), 신경학적 임상증상(Clinical features), 지속기간(Duration of symptoms and Diabetes) score라는 뜻으로 일과성 허혈발작(TIA) 후 초기 뇌졸중의 위험성을 예측하기 위한 평가방법으로, 많은 연구에서 초기 뇌졸중 위험률을 평가하는 도구로써 그 유용성이 입증되었고 가장 보편적으로 사용되고 있습니다. ABCD2 score가 4점 이상인 환자에서 7일 이내 뇌졸중 예측도는 각각 86.4%와 91.7%의 높은 민감도와 음성 예측도를 보입니다. 계산 방법은 관련이론에 첨부하겠습니다. 위 환자의 ABCD2 score를 계산하면 77세(1점)+고혈압이 있으며 약을 복용하지 않음(1점)+Unilateral weakness(2점)+증상 5분 지속(0점)+당뇨 언급 없음(0점)=4점입니다. 관련 내용을 수업하시지 않아 21년도 해설에 있던 ABCD2 score에 대한 논문 자료를 첨부하겠습니다. https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiOrteView.kci?sereArticleSearchBean.artiId=ART001854723", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "4", "vb": "검안"}, {"id": "25-52", "keys": ["25-52"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 항목 중 hyperacute and acute ischemic stroke의 전산화 단층촬영(CT)의 소견이 아닌 것은?<\/div>", "o": ["Mass effect", "Hyperdense MCA sign", "Insular ribbon sign", "Encephalomalacic change", "Loss of cortical sulci"], "a": 3, "A": "④", "E": "초급성 뇌경색(6~8시간 이내) CT의 조기 소견은 종괴효과(실비우스 틈새 좁아짐·대뇌 고랑 소실), 회백질 저음영(insular ribbon sign·기저핵 저음영), 고음영 동맥(hyperdense MCA sign)이며, 급성기에는 출혈성 변환이 보일 수 있다. Encephalomalacic change(뇌연화)는 괴사 조직이 CSF·gliosis로 대체되어 CSF처럼 까맣게 보이고 위축으로 당기는 효과가 생기는 만성기(3주 이상) 소견이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-53", "keys": ["25-53"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 영상을 보고 진단명을 고르시오.<\/div>", "o": ["Acute infarction in left MCA territory", "Lacunar infarction", "Internal borderzone infarction", "Septic embolism", "External borderzone infarction"], "a": 2, "A": "③", "E": "센트룸 오발레·방사관(corona radiata) 백질에 경색이 염주처럼 일렬로 늘어선 모양은 internal borderzone infarction이다. 큰 혈관(경동맥 등)의 병변으로 생기며 회백질보다 백질에서 보이고, 더 큰 경색으로 진행할 수 있어 예후가 나쁘므로 치료·추적이 필요하다. Lacunar infarction은 작은 관통동맥 영역의 단일 작은 경색이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": ["figs/25-53.jpg"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-54", "keys": ["25-54"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 내용중 소아에서 spontaneous intracerebral hemorrhage(ICH)의 가장 많은 원인을 고르시오.<\/div>", "o": ["Hypertension", "Cerebral amyloid angiopathy", "Arteriovenous malformation", "Coagulopathy", "Tumor bleeding"], "a": 2, "A": "③", "E": "비외상성(자발성) 뇌내출혈의 흔한 원인은 연령에 따라 다르다. 40세 이상에서는 고혈압성(1순위), 아밀로이드 혈관병증(60세 이상, 2순위), 응고장애, 종양 출혈 순이고, 젊은 층·소아에서는 동정맥기형(AVM)이 가장 흔하다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-55", "keys": ["25-55"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 영상을 보고 진단명을 고르시오<\/div>", "o": ["Intracerebral hemorrhage", "Hemorrhagic contusion", "Subarachnoid hemorrhage", "Acute cerebral infarction", "Encephalomalacic change"], "a": 2, "A": "③", "E": "지주막하 공간은 CT에서 뇌조(cistern)와 고랑(sulcus)으로 보이며, 정상에서는 CSF가 차 있어 까맣다. 이 부위가 하얗게 차 있으면 지주막하출혈(SAH)이고, 외상을 제외하면 가장 흔한 원인은 동맥류 파열이다. 뇌실질 안의 덩어리 출혈은 뇌내출혈, 만성기에 CSF처럼 까매진 부위는 뇌연화다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": ["figs/25-55.jpg"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-31", "keys": ["23-31", "22-27"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>고혈압성 대뇌출혈(Hypertensive ICH)의 호발부위가 아닌것은?<\/div>", "o": ["pons", "cerebellum", "thalamus", "Basal ganglia", "cerebral cortex"], "a": 4, "A": "⑤", "E": "고혈압성 뇌내출혈은 피각/외포(putamen·external capsule) 약 60%, 시상 약 20%, 다리뇌·소뇌 약 20%로 이 네 곳에서 거의 대부분 생긴다. 대뇌 피질(lobar) 출혈은 5% 정도로 드물어, 엽성 출혈이면 고혈압보다 아밀로이드 혈관병증 등 다른 원인을 먼저 생각한다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-32", "keys": ["23-32", "22-29"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 초급성 뇌경색(hyperacute)의 CT소견이 아닌 것을 고르시오<\/div>", "o": ["mass effect", "hyperdense MCA sign", "hypoattenuation", "contrast enhancement", "정상"], "a": 3, "A": "④", "E": "초급성 뇌경색 CT 소견은 종괴효과(실비우스 틈새 좁아짐·고랑 소실), 회백질 저음영(insular ribbon sign·기저핵 저음영), 고음영 MCA 징후이며, 이 소견들이 모두 안 보이고 정상인 경우가 많아 MRI를 찍는다. 조영증강은 초급성기 소견이 아니라 아급성기 경색의 소견이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-33", "keys": ["23-33"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 ischemic stroke classification(TOAST classification)에 해당되지 않는 것은?<\/div>", "o": ["Large artery atherosclerosis", "Cardioembolism", "Small vessle occlusion:lacunar stroke", "Stroke of undetermined etiology", "Autoimmune encephalitis"], "a": 4, "A": "⑤", "E": "허혈성 뇌졸중의 TOAST 분류는 ① 대혈관 죽상경화 ② 심인성 색전 ③ 소혈관 폐색(열공경색) ④ 기타 원인(박리·혈관염·과응고 상태) ⑤ 원인 미상(원인 2개 이상, 검사 불충분 포함)의 다섯 가지다. 자가면역 뇌염은 뇌졸중 분류에 들어가지 않는다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-34", "keys": ["23-34"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음중 intracranial aneurysm의 호발 부위가 아닌것은?<\/div>", "o": ["anterior communicating artery", "middle cerebral artery bifurcation", "cervical internal carotid artery", "posterior communicating artery", "tip of basilar artery"], "a": 2, "A": "③", "E": "두개내 낭형(saccular) 동맥류는 Willis 고리(전교통동맥이 가장 흔함, 후교통동맥, 뇌바닥동맥 끝), 중대뇌동맥 분지부, 원위부 내경동맥(안동맥 분지·paraclinoid 부위)에 잘 생긴다. 혈관이 갈라지거나 만나는 곳에 호발하며, 두개 밖의 경부 내경동맥은 두개내 동맥류의 호발 부위가 아니다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "22-28", "keys": ["22-28", "21-40"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 ischemic stroke classification(TOAST classification)에 해당되지 않는 것은?<\/div>", "o": ["Vascular dissection", "Arteriovenous malformation", "Large artery atherosclerosis", "Cardioembolism", "Small vessel disease"], "a": 1, "A": "②", "E": "TOAST 분류는 대혈관 죽상경화, 심인성 색전, 소혈관 질환(열공경색), 기타 원인(혈관 박리·혈관염·과응고 상태), 원인 미상의 다섯 가지다. 동정맥기형(AVM)은 허혈성 뇌졸중이 아니라 젊은 층 뇌내출혈의 가장 흔한 원인이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-30", "keys": ["22-30"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 혈액(not clotted)의  hounsfield number를 고르시오.<\/div>", "o": ["0", "35-40", "40", "70-100", "100"], "a": 2, "A": "③", "E": "Hounsfield 수치는 높을수록 밝다: 공기 약 -1000, 지방 약 -250, CSF 0~5, 백질 25~30, 회백질 35~40, 혈액(응고 전) 약 40, 급성 혈종 70~100, 석회화 약 100, 뼈 200~300. 따라서 응고되지 않은 혈액은 40으로 회백질과 비슷하게 보이고, 응고되면 70~100으로 밝아진다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "③", "vb": "검안"}, {"id": "21-42", "keys": ["21-42"], "ch": 3, "g": "신경계 영상진단", "stem": "<div>다음 중 급성 혈종의 hounsfield number를 고르시오<\/div>", "o": ["0", "35-40", "40", "70-100", ">100"], "a": 3, "A": "④", "E": "혈액은 응고 전 약 40 HU로 회백질(35~40)과 비슷하지만, 응고되어 급성 혈종이 되면 70~100 HU까지 올라가 CT에서 밝게 보인다. 0은 물·CSF, 35~40은 회백질, 100 이상은 석회화·뼈에 해당한다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-56", "keys": ["25-56"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>다음 물질 및 구조물의 Hounsfield number를 낮은 것부터 높은순으로 순서대로 나열하시오 Bone, CSF, white matter, grey matter, fat<\/div>", "o": [], "a": -1, "A": "fat-CSF-white matter-grey matter-bone", "acc": [], "E": "암기하라고 하신 부분입니다. fat은 –250~0, CSF는 0-5, white matter는 25-30, grey matter는 35-40, bone은 200-300입니다. 3. Hounsfield number (= CT number) 22,23,21, CT의 근간이므로 암기하세요! X선 강의에서도 똑같이 적용된다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "fat-CSF-white matter-grey matter-bone", "vb": "검안"}, {"id": "25-57", "keys": ["25-57"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>다음 intracerebral hemorrhage의 stage는?<\/div>", "o": [], "a": -1, "A": "acute ICH, acute hemorrhage, acute stage", "acc": ["acute ICH", "acute stage", "acute hemorrhage"], "E": "엄청 강조하셨던 내용입니다. 출혈 경과 시기에 따른 T1, T2 이미지의 차이를 알아야합니다. T1, T2 image의 원리를 설명하기에는 내용이 너무 많으니 자세한 이론은 관련이론을 참고하시고 색깔 매칭만 한다면 조금 간단하게 풀 수 있습니다. hyperacute-acute-early subacute-late subacute-chronic 순으로 T1은 isointense-isointense-bright-bright-dark 이고 T2는 bright-dark-dark-bright-dark입니다. isointense는 회색으로 gray matter와 비슷하거나 좀 더 어두운 편이고 그 외에 검은색, 흰색은 확실히 눈에 띕니다. 위 사진에서 T1을 보면 주변 gray matter보다 조금 어두운 둥그런 병변이 보이는데 옆에 T2와 비교하면 T2가 훨씬 어둡습니다. (T2의 밝은 하얀색 테두리는 hemorrhage가 아닙니다.) 따라서 T1/T2 순서대로 isointense/dark이므로 acute stage에 해당합니다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": ["figs/25-57.jpg"], "v": false, "y": [2025], "ok": true, "ra": "acute ICH, acute hemorrhage, acute stage", "vb": "검안"}, {"id": "23-35", "keys": ["23-35"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>소아에서 intracerebral hemorrhage (ICH/IPH)의 가장 흔한 원인을 적으시오.<\/div>", "o": [], "a": -1, "A": "arteriovenous malformation", "acc": ["arteriovenous malformation"], "E": "마찬가지로 왕마입니다. ICH는 성인과 소아의 원인을 확실하게 구분해야 합니다. 관련이론 확인해주세요 1) ICH: Etiology", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "arteriovenous malformation", "vb": "검안"}, {"id": "23-36", "keys": ["23-36"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>다음 영상 (CT)의 진단명을 적으시오<\/div>", "o": [], "a": -1, "A": "subarachnoid hemorrhage", "acc": ["subarachnoid hemorrhage"], "E": "복원 해설에 따로 설명이 없습니다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": ["figs/23-36.jpg"], "v": false, "y": [2023], "ok": true, "ra": "subarachnoid hemorrhage", "vb": "검안"}, {"id": "22-57", "keys": ["22-57"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>비외상성 대뇌 출혈(nontraumatic intracerebral hemorrhage)의 소아에서 가장 많은 원인을 쓰시오.<\/div>", "o": [], "a": -1, "A": "arteriovenous malformation / AVM / 동정맥기형", "acc": ["AVM", "동정맥기형", "arteriovenous malformation"], "E": "비외상성 뇌내출혈의 원인: 40세 이상은 고혈압(1순위), 대뇌 아밀로이드 혈관병증(60세 이상, 2순위), 응고장애, 종양 출혈. 젊은 나이·소아에서는 동정맥기형(AVM)이 가장 흔합니다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "arteriovenous malformation / AVM / 동정맥기형", "vb": "검안"}, {"id": "22-58", "keys": ["22-58"], "ch": 3, "g": "신경계 영상진단", "t": "s", "stem": "<div>다음 대뇌 혈종의 stage는?<\/div>", "o": [], "a": -1, "A": "early subacute", "acc": ["early subacute"], "E": "MRI에서 T1 고신호(bright)·T2 저신호(dark)이면 early subacute(약 3일–1주, 세포 내 methemoglobin)입니다. hyperacute T1 iso/T2 bright, acute iso/dark, early subacute bright/dark, late subacute bright/bright, chronic dark/dark.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "", "img": ["figs/22-58.jpg"], "v": false, "y": [2022], "ok": true, "ra": "early subacute", "vb": "검안"}, {"id": "25-43", "keys": ["25-43"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>42세 남성이 경추 후궁 절제술(cervical laminectomy)을 받은 후 5일째부터 발열, 경부 통증, 상지 근력 저하를 호소하였다. 과거력상 류마티스 관절염으로 3년 이상 prednisolone을복용 중이며, 수술 전후로 특별한 합병증은 없었다. 검사에서 백혈구 증가와 CRP 상승이 있었고, 조영증강 경추 MRI에서 수술 부위 농양 형성이 확인되었다. 환자는 20갑년 이상의 흡연력이 있으며, 신장 162cm, 체중 48kg의 신체조건을 가지고 있었다. 이 환자의 수술 후 감염의 가장 중요한 위험요인은 무엇인가?<\/div>", "o": ["연령", "성별", "흡연력", "저체중", "장기간 스테로이드 복용"], "a": 4, "A": "⑤", "E": "26년 강의(감염성 척추질환): 척추 수술 후 감염의 고위험군은 영양결핍, 비만, 당뇨, 스테로이드 투여, 면역저하이며 주 원인균은 S. aureus다. 류마티스 관절염으로 3년 이상 prednisolone을 복용한 이 환자에서 가장 중요한 위험요인은 장기간 스테로이드 복용(⑤)이다. 연령·성별은 위험요인 목록에 들지 않는다. 2023년 66번과 같은 문항.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-44", "keys": ["25-44"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 척수 경막외 농양(Spinal epidural abscess)에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["당뇨병, 만성 신부전증, 손상된 면역 적응력, 알콜중독, 악성 종양 등은 발생 위험 을 높이는 요인이다.", "척수 경막외 농양은 대부분 바이러스 감염에 의해 발생한다.", "진단에는 단순 X선 검사가 가장 민감한 방법이다.", "감염이 확인되면 2주 이내의 항생제 치료만으로 대부분 호전된다.", "척수 압박 증상이 없는 경우에는 항생제 치료가 필요하지 않다."], "a": 0, "A": "①", "E": "26년 강의(척추 경막외 농양): 당뇨병·만성 신부전·면역저하·알코올중독·악성종양, 경막외 마취·요추천자 후 합병증이 소인이므로 ①만 옳은 진술이다. ② 대부분 세균(가장 흔한 균 S. aureus) ③ MRI가 진단의 기준(gold standard)이며 CT·MRI로 약 90% 진단, 단순 X선은 민감하지 않다 ④ 항생제는 골수염이 없으면 3~4주, 있으면 6~8주 ⑤ 척수 압박 증상과 관계없이 항생제를 쓴다. 실제 시험은 '옳은 것'을 '틀린 것'으로 잘못 내어 전원 정답 처리되었고, 의도한 정답은 ①이다.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-66", "keys": ["23-66"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>류마티스 관절염으로 prednisolone을 2년 이상 투여중인 45세의 여자가 요추간판탈출증에 대해 추간판절제술을 시행받고 3일 후부터 고열, 요통, 하지방사통이 발생하여, 검사한 요추부 MRI 조영증강 검사에서 수술 후 척추감염으로 진단되었다. 환자는 20갑년 이상의 흡연력이 있으며, 신장 162cm, 체중 48kg의 신체조건을 가지고 있었다. 다음 답가지 중 이 환자의 수술 후 감염의 주된 위험요인이라고 판단할 수 있는 것은 무엇인가?<\/div>", "o": ["연령", "성별", "흡연력", "Body mass index", "약물복용력"], "a": 4, "A": "⑤", "E": "26년 강의(감염성 척추질환): 척추 수술 후 감염 고위험군은 영양결핍, 비만, 당뇨, 스테로이드 투여, 면역저하다. 2년 이상 prednisolone을 쓴 이 환자에서 가장 직접적인 위험요인은 약물복용력(⑤, 스테로이드)이다. 흡연도 위험요인으로 꼽히지만 이 증례의 핵심은 장기간 스테로이드 투여다.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-68", "keys": ["23-68", "21-68"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 척수 경막외 농양(Spinal epidural abscess)에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["당뇨병, 만성 신부전증, 손상된 면역 적응력, 알콜중독, 악성 종양 등의 소인성 인자가 있다.", "최근 척추수술의 증가와 함께 급격히 증가하고 있다.", "병소 부위의 통증과 발열, 척수허혈, 척수 압박 증상이 나타날 수 있다.", "MRI로 가장 정확하게 진단 가능하다.", "항생제 치료기간은 골수염이 없는 경우 6~8주 이다."], "a": 4, "A": "⑤", "E": "26년 강의(척추 경막외 농양): 항생제 기간은 골수염이 없으면 3~4주, 골수염이 동반되면 6~8주이므로 ⑤가 틀렸다. 소인: 당뇨·만성 신부전·면역저하·알코올중독·악성종양, 경막외 마취·요추천자, 척추 수술. 증상: 통증·발열, 척수·신경근 압박과 허혈에 의한 감각저하·마비. 진단은 MRI가 기준(T1 조영 시 테두리 조영증강, T2 고신호). 농양이 크거나 신경학적 결손이 있으면 배농 수술을 더한다.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2021, 2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-01", "keys": ["22-01"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>71세 남자가 4시간 전부터 발생한 좌반신 편마비를 주소로 응급실에 내원하였다. 이 환자는 5년전 심방 세동을 진단 받은 적이 있으나, 약물치료를 하지 않고 있었다. 급성뇌경색이 의심되어, 뇌혈류(cerebral blood flow, CBF), 뇌 혈 (cerebral blood volume. CBV). 조영제 평균 통과시간(mean transit time. MTT)을 계산하 여 신속하게 뇌관류 평가를 가능한 뇌 영상검사법은 무엇인가?<\/div>", "o": ["Single photon emission computed tomography (SPECT)", "Magnetic resonance angiography (MRA)", "Computed tomographic angiography (CTA)", "Computed tomography perfusion (CT perfusion)", "Digital subtraction angiography (DSA)"], "a": 3, "A": "④", "E": "였습니다. cerebral infarction 의심 시 cbf, cbv, mtt를 계산하여 뇌관류 평가를 합니다. 뇌관류 평가를 통해 core와 penumbra를 감별하여 치료부위를 결정합니다. 2026 강의 03(검안, 김비오 교수님 보조검사 부분): 급성 뇌경색에서 CBF·CBV·MTT로 core와 penumbra를 가르는 검사는 CT perfusion.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-02", "keys": ["22-02"], "ch": 4, "g": "척추·척수 감염", "stem": "<div>다음 중 요추천자를 통한 뇌척수액압의 측정에 대한 설명 중 틀린 것은 무엇인가?<\/div>", "o": ["요추천자를 시행한 후 척추에 연결된 압력계로 측정된 수치가 뇌척수액압이며, 두개강내압으로 간주할 수 있다", "뇌척수액압의 측정은 복와위에서 시행한다.", "뇌척수액압의 정상범위는 50~180mmH,O 이다.", "뇌척수액압이 상승되어 있으면, 두 개강 내 공간점유병소, 수막염, 수두증 상태 등을 이 의심할 수 있다.", "뇌척수액압이 정상치보다 낮은 경우는 탈수 상태, 쇼크, 저혈압 중, 척수 지주막하강 의 폐쇄, 소뇌 편도 뇌탈출 상태 등을 의심할 수 있다."], "a": 1, "A": "②", "E": "강의안에 새로 추가된 부분에서 내셨습니다. ② 뇌척수액압의 측정은 측와위에서 시행한다. 2026 강의 03(검안): 뇌척수액압은 측와위에서 힘을 빼고 측정하며 정상 50~180 mmH2O.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-45", "keys": ["25-45"], "ch": 4, "g": "척추·척수 감염", "t": "s", "stem": "<div>55세 남자가 2주 전부터 지속되는 요통과 미열을 주소로 내원하였다. 혈액검사에서 백혈구 증가와 ESR, CRP 상승이 관찰되었으며, 조영증강 척추 MRI에서 요추 3–4번 부위 추체 사이의 감염성 병변이 확인되었다. 혈액배양 결과에서 가장 흔히 검출될 수 있는 원인균주는 무엇인가?<\/div>", "o": [], "a": -1, "A": "S.aureus, 황색포도상구균, staphylococcuss aureus", "acc": ["S. aureus", "황색포도상구균", "Staphylococcus aureus"], "E": "계속해서 강조하고 출제해오시던 부분이었습니다. 요통과 발열, ESR, CRP의 상승 백혈구의 증가를 통해 염증 소견을 확인가능하고, 요추 3-4번 부위의 추체 사이 감염을 통해 척추체와 추간판에 염증이 있음을 확인가능합니다. 화농성 척추 골수염으로 확인됩니다. m/c한 균은 황색포도상구균입니다. 1. 화농성 척추 골수염, Pyogenic Vertebral spondylitis(Osteomyelitis) ,,23 형성평가", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "S.aureus, 황색포도상구균, staphylococcuss aureus", "vb": "검안"}, {"id": "23-2Q-67", "keys": ["23-2Q-67"], "ch": 4, "g": "척추·척수 감염", "t": "s", "stem": "<div>척추와 척수 감염(Infection of the Spine and Spinal Cord)의 가장 흔한 원인균주는 무엇인가?<\/div>", "o": [], "a": -1, "A": "S. aureus / 황색포도상구균 / Staphylococcus aureus", "acc": ["황색포도상구균", "S. aureus", "Staphylococcus aureus"], "E": "화농성 척추 골수염·척수 경막외 농양 모두 가장 흔한 원인균은 그람양성 알균인 S. aureus(배양 양성의 약 60%)입니다. 형성평가에도 나온 문제입니다.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "S. aureus / 황색포도상구균 / Staphylococcus aureus", "vb": "검안"}, {"id": "22-2Q-61", "keys": ["22-2Q-61"], "ch": 4, "g": "척추·척수 감염", "t": "s", "stem": "<div>45세 남자가 요추 추간판 탈출증 수술을 시행 받은 3일 후부터 점차 심해지는 배부통, 주위 근육의 경련, 압통, 고열을 호소하였다. 임상 병리 소견에서 백혈구증가, ESR 상승을 보였다. 이 환자의 수술부위 상태를 진단하기 위해 필요한 가장 정확한 영상검사는 무엇인가?<\/div>", "o": [], "a": -1, "A": "MRI / 자기공명영상", "acc": ["MRI", "자기공명영상"], "E": "수술 후 척추 감염이 의심됩니다. 최종 진단은 MRI(T1 저신호, T2 고신호, 조영증강)로 하며 주위 조직 염증과 농양에 의한 신경 압박도 확인할 수 있습니다. 단순 X선은 추간판 높이 감소, CT는 뼈 파괴, 골스캔은 보조 검사입니다.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "MRI / 자기공명영상", "vb": "검안"}, {"id": "22-41", "keys": ["22-41"], "ch": 4, "g": "척추·척수 감염", "t": "s", "stem": "<div>근위부 뇌혈관의 폐쇄나 협착으로 뇌혈류가 감소하게 되면 원위부 뇌혈관의 보상작용으로 확장하게 되는데, 이와 같은 혈관예비능을 평가하기 위한 단일광자방출 전산화단층촬영(SPECT)의 검사법은 무엇인가?<\/div>", "o": [], "a": -1, "A": "아세타졸아미드 부하검사", "acc": ["아세타졸아미드", "acetazolamide", "diamox"], "E": "만성적으로 진행된 동맥경화일 경우 지속적으로 확장되어있는 상태이므로 아세타졸아미드로 인해 더 확장될 수 없음을 이용해 국소뇌혈류를 알 수 있는 검사입니다. 답은 아세타졸아미드 부하검사입니다. 2026 강의 03(검안): 아세타졸아미드 부하 SPECT로 혈관 예비능을 평가 — 만성 협착 쪽은 이미 확장돼 있어 투여 후 혈류가 오히려 떨어짐.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "아세타졸아미드 부하검사", "vb": "검안"}, {"id": "25-112", "keys": ["25-112"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>다음 중 중추신경계의 선천성 기형의 발생과정에 대한 설명 중 옳은 것을 고르세요.<\/div>", "o": ["신경계는 중배엽에서 분화되며, 피부외배엽의 분리가 실패하면 선천성 피부동 이 발생할 수 있다.", "신경계 정중선 유합 부전이 발생하게되면 무뇌증이나 척수수막류가 발생할 수 있다.", "척추 정중선 유합부전증이 머리 쪽에서 발생하면 척수수막류가 발생한다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다.", "이차 신경배형성으로 발생하는 종사 비후 (thick filum terminale)와 같은 기형 은 일차 신경배 형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고, 예후 도 훨씬 불량하다."], "a": 1, "A": "②", "E": "신경계와 피부는 모두 외배엽에서 분화하므로 신경계 기형에 피부 병변(선천성 피부동 등)이 흔히 동반된다. 정중선 유합 부전 가운데 앞쪽(전신경공) 이상은 무뇌증·뇌류, 뒤쪽(후신경공) 이상은 척수수막류를 일으킨다. 중앙부 병소가 측부보다 예후가 나쁘고, 이차 신경관 형성 이상(종사 비후·지방척수수막류 등)은 일차 신경관 이상보다 증상이 가볍고 수술 결과도 좋다.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-114", "keys": ["25-114"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>선천성 기형에서 Dandy-Walker anomaly를 나타내는 특징을 모두 고르세요. 1. 제4뇌실의 낭종성 확장 2. 소뇌 충부의 무형성이나 형성 저하증 3. 소뇌 천막 및 주위 정맥동의 상방 전위 4. 소뇌 편도가 대후두공을 통해 하방으로 전위<\/div>", "o": ["1, 2", "1, 2, 3", "1, 3, 4", "2, 3, 4", "3, 4"], "a": 1, "A": "②", "E": "Dandy-Walker 기형의 세 가지 특징은 제4뇌실의 낭종성 확장, 소뇌 충부(vermis)의 무형성·형성 저하, 소뇌 천막과 주위 정맥동의 상방 전위다. 수두증이 동반되면 VP·낭종-복강 단락술이나 내시경적 제3뇌실 개창술로 증상을 완화한다. 소뇌가 대후두공 아래로 내려오는 것은 Chiari 기형의 특징이다.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-113", "keys": ["25-113"], "ch": 5, "g": "중추신경계 선천성질환", "t": "s", "stem": "<div>선천성 신경계 기형 질환에서 소뇌가 후두대공을 통하여 경추 쪽으로 탈출된 현상을 말하는 질환으로 심한 경우 제４뇌실까지 탈출될 수 있다. 이러한 병변을 무엇이라고 하는가요？<\/div>", "o": [], "a": -1, "A": "Chiari malformation (Arnold-Chiari malformation, 아놀드키아리 기형)", "acc": ["Chiari malformation", "Arnold-Chiari malformation", "키아리 기형", "아놀드키아리 기형"], "E": "왕마입니다. 관련 이론에 Chiari malformation 이론 첨부할테니 스펠링 완벽하게 외워두세요.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "Chiari malformation of Arnold-chiari malformation or 아놀드키아리 기형", "vb": "검안"}, {"id": "25-109", "keys": ["25-109"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용중 옳은 것을 고르세요<\/div>", "o": ["약물 치료에도 불구하고 발작이 지속되는 난치성일 때", "발작의 시작 부위가 정확한 해부학적인 위치를 찾기어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장해가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "26년 강의 기준으로 수술 결과가 좋은 대상은 약물에도 발작이 계속되는 난치성(2가지 이상 약물을 최소 2년 써도 조절 안 됨), 발작 시작 부위(focus)를 정확히 알 수 있는 경우, 절제 부위가 기능적으로 안전한 경우다. 따라서 ①이 옳다. 시작 부위를 찾기 어렵거나 eloquent area처럼 기능적으로 중요한 부위면 결과가 나쁘고, 단일 약물로 안 되면 먼저 복합 항경련제 요법을 시도하므로 ④는 수술 적응이 아니다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-111", "keys": ["25-111"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>갑자기 발생한 간질 발작으로 내원한 42세 여자 환자로 도로를 걷다가 멍하니 전방을 주시한 후 입맛을 다신 후 갑자기 의식소실과 함께 좌측 손은 경직되면서 손을 비비는 증상을 보였으며, 발작 직후 혼돈 증세가 심하였다. 환자는 ５년이상 약물치료를 하였지만 간헐적인 발작이 지속되고 있었다. 이러한 환자에 대한 가장 적절한 수술적 치료는?<\/div>", "o": ["뇌반구 절제술（hemispherectomy）", "미주신경 자극술 (vagus nerve stimulation)", "뇌량 차단술 （corpus callosotomy)", "전방 측두엽 제거술 （anterior temporal lobectomy）", "감마나이프 수술 （Gamma knife surgery）"], "a": 3, "A": "④", "E": "멍하니 응시하며 입맛을 다시는 자동증, 한쪽 손 경직과 반대쪽 손 비비기, 발작 후 혼돈은 측두엽 뇌전증(복합 부분 발작)의 전형이다. 5년 이상 약물에 반응하지 않는 난치성이므로 성적이 가장 좋은 전방 측두엽 절제술(④, 70-90% seizure-free)을 시행한다. 뇌량 절개술은 Lennox-Gastaut 증후군의 drop attack, 반구 절제술은 한쪽 반구 전체 병변(Rasmussen 등), 미주신경 자극술은 다발성·절제 불가 병소의 보조 치료, Gamma knife는 효과가 아직 확립되지 않았다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-46", "keys": ["23-46"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료 에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용 중 옳은 것을 고르세요.<\/div>", "o": ["장기간 약물 치료에도 불구하고 효과없이 발작이 지속되는 난치성일 때 마지막으로 수술적 치료를 고려한다.", "발작의 시작 부위가 정확한 해부학적 위치를 찾기 어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장애가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "강의에서 정리한 수술 대상 기준은 약물 치료에도 발작이 지속되는 난치성, 발작 시작 부위를 잘 알 수 있음, 절제 부위가 기능적으로 안전함의 세 가지다. ①이 이에 해당한다. ②③은 기준과 반대이며, ④처럼 단일 약물에 실패한 정도로는 수술하지 않고 2가지 이상 약물을 최소 2년 사용해 본 뒤 고려한다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-47", "keys": ["23-47"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>갑자기 발생한 간질 발작으로 내원한 42세 여자 환자로 도로를 걷다가 멍하니 전방을 주시한 후 입맛을 다신 후 갑자기 의식소실과 함께 좌측 손은 경직되면서 손을 비비는 증상을 보였으며, 발작 직후 혼돈증세가 심하였다. 환자는 5년 이상 약물치료를 하였지만 간헐적인 발작이 지속되고 있었다. 더 이상 약물치료만으로는 간질 발작을 조절하기 어려워 수술적 치료를 고려하고자 한다. 이러한 환자에 대한 수술적 치료법 중 가장 효과적이라고 기대되는 수술방법은?<\/div>", "o": ["anterior temporal lobectomy", "vagus nerve stimulation", "corpus callosotomy", "hemispherectomy ➄ Gamma knife surgery"], "a": 0, "A": "①", "E": "응시·입맛 다시기 자동증, 초점 같은 쪽 손의 자동증과 반대쪽 손의 경직, 발작 후 혼돈은 측두엽 뇌전증을 시사한다. 약물로 5년 이상 조절되지 않으므로 가장 효과적인 수술은 anterior temporal lobectomy(①)다. corpus callosotomy는 전신성 drop attack, hemispherectomy는 한쪽 반구 전체 병변에 쓰고, vagus nerve stimulation은 절제가 어려울 때의 완화적 방법이다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-19", "keys": ["22-19"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 간질의 수술적 치료에 대하여 좋은 결과를 보일 수 있는 수술 대상자를 결정하는 기준에 대하여 설명한 내용 중 옳은 것을 고르세요.<\/div>", "o": ["약물 치료에도 불구하고 발작이 지속되는 난치성일 때", "발작의 시작 부위가 정확한 해부학적 위치를 찾기 어려울 때", "절제할 부분이 기능적으로 중요한 부위로 심각한 후유장애가 예상될 때", "약물에 효과가 있으나 단일 약물로 치료가 되지 않을 때"], "a": 0, "A": "①", "E": "수술 결과가 좋은 대상은 약물에 반응하지 않는 난치성이면서 focus 위치가 분명하고 절제 부위가 기능적으로 안전한 경우다. 따라서 ①이 옳다. 시작 부위를 찾기 어렵거나(②) 절제 시 심각한 후유장애가 예상되면(③) 결과가 나쁘고, 단일 약물 실패(④)는 아직 복합 요법 단계라 수술 적응이 아니다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-20", "keys": ["22-20"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>신생아중 뇌 발달장애를 가지는 신경계 선천성 기형 환아들 중에서도 정신지체, 여러 형태의 난치성 발작, 특징적인 뇌파를 가지는 Lannox-Gastaut syndrome은 뇌기형, 주산기 질환, 심한 두부 손상, 감염 등이 원인이 되는데, 이러한 환자의 80%가 성인이 되어도 발작이 지속되며 항경련제에도 효과를 보이지 않는다. 치료를 위해서는 간질 원발 병소부위를 제거하기 보다는 간질파의 확산을 막아 간질 증상을 줄이는 치료가 필요하게 되는데, 이러한 환자에 대하여 가장 효과적인 수술법은?<\/div>", "o": ["감마나이프 수술 Gamma knife surgery", "편도해마체 제거술 Amygdalohippocampectomy", "측두엽 절제술 Temporal lobectomy", "뇌반구 절제술 Hemispherectomy", "뇌량 절개술 Corpus callosotomy"], "a": 4, "A": "⑤", "E": "Lennox-Gastaut 증후군은 정신지체, 여러 형태의 난치성 발작(특히 atonic drop attack), 특징적 뇌파를 보이며 선천성 뇌기형 등이 원인이라 항경련제가 잘 듣지 않는다. 병소를 절제하기보다 발작파가 반대쪽 반구로 퍼지지 않게 차단하는 뇌량 절개술(⑤, 앞쪽 2/3 먼저 절개)이 가장 효과적이다. 측두엽 절제술·편도해마 절제술은 내측 측두엽 뇌전증, 반구 절제술은 한쪽 반구 병변에 쓰며 Gamma knife는 근거가 부족하다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "21-31", "keys": ["21-31"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>뇌전증을 수술적으로 치료하기 위해서는 간질의 발생병소를 정확히 찾는 것이 무엇보다 중요하다, 다음 내용중 뇌전증의 발생병소를 찾기 위한 설명 중 옳지 않은 것을 고르세요.<\/div>", "o": ["뇌 MRI는 가장 기본적인 검사로 모든 뇌전증 수술 환자에대하여 시행한다.", "비디오 뇌파 검사를 통하여 환자의 간질 양상을 비디오 촬영하고 뇌파검사를 분석한다.", "와다 테스트를 시행하여 수술시 언어 영역과 기억력을 담당하는 우성 반구를 확인한다.", "SPECT 검사를 통하여 발작이 발생한 부위를 확인할 수 있다.", "비짐습적 검사를 통하여 Epileptogenic zone이 확인되지 않으면, 침습적 검사는 시행하지 않고 바로 간질 수술을 시행한다."], "a": 4, "A": "⑤", "E": "수술 전 병소 확인에서 MRI는 모든 환자에게 시행하는 기본 검사이고, 장기 비디오 뇌파로 발작 양상과 뇌파를 함께 분석하며, Wada test(amobarbital 경동맥 주입)로 언어·기억 우성 반구를 확인하고, ictal/interictal SPECT로 발작 부위를 찾는다. 비침습적 검사로 epileptogenic zone이 확인되지 않거나 소견이 불일치하면 바로 수술하지 않고 경막하·심부 전극 등 침습적 검사를 시행하므로 ⑤가 틀렸다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "21-32", "keys": ["21-32"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>간질 발작으로 내원한 36세 남자 환자로 발작시 뱃속에서 치밀어 오르는 듯한 전조가 동반되며, 의식소실과 함께 멍하니 전방을 주시한 후 입맛을 다시고 우측 손은 경직되고 좌측 손은 비비는 증상을 보였으며, 발작 직후 혼돈 증세가 심하였다. 2년이상 약물치료에도 효과가 없다면 이러한 환자에 대한 가장 적절한 수술적 치료는?<\/div>", "o": ["anterior temporal lobectomy", "vagus nerve stimulation", "corpus callosotomy", "hemispherectomy"], "a": 0, "A": "①", "E": "상복부에서 치밀어 오르는 전조(aura), 의식 소실과 함께 응시·입맛 다시기, 한쪽 손 경직과 반대쪽 손 비비기, 발작 후 혼돈은 성인에서 가장 흔한 측두엽 뇌전증의 전형적 소견이다. 2년 이상 약물에 반응하지 않으면 anterior temporal lobectomy(①)를 시행한다. 뇌량 절개술은 Lennox-Gastaut 증후군, 반구 절제술은 한쪽 반구 전체 병변, 미주신경 자극술은 다발성·절제 불가 병소에 해당한다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-28", "keys": ["20-28"], "ch": 6, "g": "경련성질환의 수술적 치료", "stem": "<div>일반적으로 간질 치료는 약물치료를 먼저 시행한 후 수술을 고려하는데, 이러한 간질 수술에 대하여 좋은 결과를 보일 수 있는 수술 대상자에 대하여 설명한 내용 중 옳은 조합을 고르시오. 가) 약물 치료에도 불구하고 발작이 지속되는 난치성일 때 나) 발작의 시작 부위를 잘 알기 어려울 때 다) 절제할 부분이 기능적으로 안전한 부위일 때 라) 약물로 인한 부작용으로 약물의 선택이 어려울 때<\/div>", "o": ["가, 나, 다", "가, 다", "나, 라", "라", "가, 나, 다, 라"], "a": 1, "A": "②", "E": "강의의 수술 대상 기준은 약물에도 발작이 지속되는 난치성(가), focus를 잘 알 수 있음, 절제 부위가 기능적으로 안전함(다)이므로 정답은 가, 다(②)다. 나)는 시작 부위를 알기 어려운 경우라 기준과 반대이고, 라) 약물 부작용만으로는 수술 적응이 되지 않고 우선 다른 약물로 교체를 시도한다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-110", "keys": ["25-110", "23-48", "22-50"], "ch": 6, "g": "경련성질환의 수술적 치료", "t": "s", "stem": "<div>이론적으로 간질 발생 부위이며, 이 부위를 제거하면 간질을 치료할 수 있다는 간질의 수술적 치료의 대상을 무엇이라고 하는가？이것은 lesional zone, pacemaker zone, irritative zone일수도 있으며 이들을 합친 부분일수도 있다. (영문으로 정확히 기술하세요)<\/div>", "o": [], "a": -1, "A": "epileptogenic zone", "acc": ["epileptogenic zone"], "E": "교수님께서 강조하신 부분입니다. 앞으로도 주관식 출제 가능성 높아보이니 관련 이론 참고해서 완벽하게 암기해두세요.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "", "img": [], "v": false, "y": [2022, 2023, 2025], "ok": true, "ra": "epileptogenic zone", "vb": "검안"}, {"id": "25-106", "keys": ["25-106"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 요추 추간판 탈출에 대한 설명 중 옳은 것을 고르세요<\/div>", "o": ["요추 추간판의 퇴행성 변화는 주로 척추관 협착증을 일으키며, 추간판 탈출은 외상에 의하여 발생한다.", "일반적으로 제4-5번 요추 추간판 탈출이 척추관 내에서 발생하면 제5번 요수 신경근 압박에 의한 증상이 발생한다.", "제5번 요수 신경근이 압박을 받아 신경손상이 발생하면 발목을 밀어내는 힘이 감소하여, 발뒤꿈치를 들어 올리기 어렵다.", "환자의 하지방사통의 원인이 요추 추간판 탈출로 진단되면, 신경 손상을 예방하기 위해 빠른 시간내에 응급수술을 고려한다.", "척추관 협착증은 젊은 연령에서 많이 발생하는 반면에 추간판 탈출은 고령의 환자에 많이 발생한다."], "a": 1, "A": "②", "E": "② 정답: L4-5 추간판이 척추관 내(posterolateral)로 탈출하면 한 단계 아래 신경근인 L5가 눌린다(far lateral이면 L4). ① 추간판 탈출의 주된 원인도 퇴행성 변화이며, 외상은 일부 원인일 뿐이다. ③ L5 손상은 dorsiflexion 약화(foot drop, heel gait 장애)를 일으키고, 발목을 밀어내는 plantar flexion(까치발 장애)은 S1 담당이다. ④ 대부분 보존적 치료로 호전되며, 수술은 acute cauda equina syndrome, 근력 약화·foot drop 같은 신경 결손, 보존 치료에 반응하지 않는 견딜 수 없는 통증일 때 고려한다. ⑤ 추간판 탈출은 활동량이 많은 30-50대에, 척추관 협착증은 고령에 흔하다.", "B": "26 학습부 26번(검안) · 양성 척추질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-108", "keys": ["25-108"], "ch": 6, "g": "양성 척추질환", "stem": "<div>다음 중 요추 추간판 탈출에 대한 설명 중 옳은 것을 고르세요<\/div>", "o": ["1,2", "1,2,3", "1,2,3,4", "2,3,4,5", "4,5"], "a": 2, "A": "③", "E": "보기 1~4는 맞고 5만 틀려 ③(1,2,3,4)이 정답. 1) 나이가 들수록 수핵의 수분이 줄며 퇴행성 변화가 진행된다. 2) 체중 부하가 가장 큰 하부 요추(L4-5)에서 퇴행성 변화가 많다. 3) 황색인대·후관절 비후로 척추관이 좁아져 협착증이 생긴다. 4) 신경인성 파행은 요추 자세와 관련되고 근위부에서 원위부로 진행한다. 5) 경추 OPLL은 척수를 눌러 myelopathy(UMN 병변)를 일으키므로 radiculopathy와 달리 건반사가 항진된다.", "B": "26 학습부 26번(검안) · 양성 척추질환", "N": "", "img": ["figs/25-108.png"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-27", "keys": ["23-27"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>다음 중 수정란에서 신경계가 발달하는 과정에서 중추신경계의 선천성 기형에 대한 예후를 설명한 내용 중에서 옳은 것을 고르시오<\/div>", "o": ["병소의 크기가 크거나 재태 기간 중 진행성 병소의 경우 예후가 양호하다", "조기에 진단된 경우일수록 예후가 양호하다", "염색체 이상, 자궁 내 감염, 다른 장기 중요 기형이 동반된 경우에는 예후가 불량하다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다"], "a": 2, "A": "③", "E": "자비로우신 교수님께서 꽤나 많은 문제를 베푸셨습니다. 무조건 외우고 들어가시길,, 권합니다. ① 병소의 크기가 크거나 재태 기간 중 진행성 병소의 경우 예후가 불량합니다. ② 조기에 진단된 경우일수록 예후가 불량합니다. ④ 중앙부 병소보다 측부의 병소에서 예후가 양호합니다. 2026 강의 09(검안): 선천성 기형은 병변이 발생 초기·광범위·신경 실질에 생기거나 염색체 이상·자궁내 감염이 동반되면 예후가 나쁘고, 측부 병소가 중앙부보다 예후가 양호.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-28", "keys": ["23-28"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>Dandy-walker anomaly에 대한 특징이 틀린 것을 고르시오<\/div>", "o": ["제4뇌실의 낭종성 확장", "소뇌 충부의 무형성이나 형성 저하증", "소뇌 천막 및 주위 정맥동의 상방 전위", "소뇌 편도가 대후두공을 통해 하방으로 전위"], "a": 3, "A": "④", "E": "매년 출제되는 문제입니다. Dandy-walker anomaly의 특징 세가지는 ① 제 4 뇌실의 낭종성 확장 ② 소뇌 충부(Vermis)의 무형성(Aplasia)이나 형성 저하증(Hypoplasia) ③ 소뇌 천막 및 주위 정맥동의 상방 전위 입니다.. 따라서 정답은 ④ 2026 강의 09(검안): Dandy-Walker 특징 3가지(제4뇌실 낭종성 확장, 소뇌 충부 무형성·형성저하, 천막·정맥동 상방 전위). ④는 Chiari 기형.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-29", "keys": ["23-29"], "ch": 5, "g": "중추신경계 선천성질환", "stem": "<div>다음 중 중추신경계의 선천성 기형의 발생과정에 대한 설명 중 옳은 것을 고르세요.<\/div>", "o": ["신경계는 중배엽에서 분화되며, 피부외배엽의 분리가 실패하면 선천성 피부동이 발생 할 수 있다.", "신경계 정중선 유합부전이 발생하게 되면 무뇌증이나 척수수막류가 발생할 수 있다.", "척추 정중선 유합부전증이 머리 쪽에서 발생하면 척수수막류가 발생한다.", "중앙부 병소보다 측부의 병소에서 예후가 불량하다", "이차 신경배형성으로 발생하는 thick filum terminale 와 같은 기형은 일차신경배형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고 예후도 불량하다"], "a": 1, "A": "②", "E": "① 신경계는 외배엽에서 분화합니다. 피부외배엽과의 분리가 실패하면 선천성 피부동이 발생할 수 있다고 강조하셨습니다. ③ 척추 정중선 유합부전증이 머리쪽에서 발생하면 뇌류가 발생합니다. ④ 중앙부 병소보다 측부의 병소에서 예후가 양호합니다. ⑤ 이차 신경배형성으로 발생하는 총사 비후 (thick filum terminale)와 같은 기형은 일차 신경배형성으로 발생하는 기형에 비하여 수술적인 치료가 어렵고, 예후도 훨씬 불량하다. → 초기에 병변이 생기는 것이 예후가 불량하기 때문에 일차 신경배 형성 기형이 더 예후가 나쁩니다. 2026 강의 09(검안): 신경계는 외배엽에서 분화, 이차 신경관 기형은 일차보다 증상이 덜함.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-107", "keys": ["25-107"], "ch": 6, "g": "양성 척추질환", "t": "s", "stem": "<div>경추 추간판 탈출 환자에서 머리를 신전시킨 후 탈출된 추간판 방향으로 고개를 돌린후에 머리를 아래로 눌러주면 좁아진 추간공으로 인하여 상지 방사통이 유발되는지 여부를 확인하는 이학적 검사 이름은?<\/div>", "o": [], "a": -1, "A": "Spurling’s sign or Spurling sign", "acc": ["Spurling sign", "Spurling’s sign", "Spurling's sign", "Spurling test", "Spurling's test", "Spurling’s test", "Spurling maneuver", "스퍼링 검사"], "E": "경추 간판 탈출증 환자에서 신경근이 눌려 발생하는 척추 신경근 병증을 진단하기 위해 사용하는 이학적 검사입니다. 자세한 내용은 관련 이론을 확인해주세요. 참고로 척수 병증을 진단하기 위해 사용하는 검사는 Lhermitte‘s sign입니다. 구분해서 알아두세요 (3) 진단", "B": "26 학습부 26번(검안) · 양성 척추질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "Spurling’s sign or Spurling sign", "vb": "검안"}, {"id": "23-30-s", "keys": ["23-30", "22-63"], "ch": 5, "g": "중추신경계 선천성질환", "t": "s", "stem": "<div>선천성 신경계 기형 질환에서 소뇌가 후두대공을 통하여 경추쪽으로 탈출된 현상을 말하는 질환으로, 심한 경우 제 4뇌실까지 탈출 될 수 있다. 이러한 병변을 무엇이라고 하나요?<\/div>", "o": [], "a": -1, "A": "Chiari malformation", "acc": ["Chiari malformation"], "E": "Chiari malformation의 정의입니다. Foramen magnum쪽에 cerebellar vermis가 탈출하고 이 때문에 foramen magnum이 막혀서 CSF 순환이 멈춥니다. 이차적으로 뇌수두증이 발생할 수 있습니다.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "Chiari malformation", "vb": "검안"}, {"id": "25-58", "keys": ["25-58"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>감각기관에 대한 설명 중 옳은 것은?<\/div>", "o": ["망막에서 빛을 감지하는 세포는 간상세포와 원추세포가 있는데 빛의 명암을 주 로 감지하는 세포는 원추세포이다.", "달팽이관에서 고주파의 소리를 감지하는 부분은 이소골 중 등자뼈 (stapedius)가 붙어 있는 시작부 쪽이다.", "후각은 여러 감각기관 중 상대적으로 퇴화된 부분으로 감정 기억 언어 등 인지 기 능에 미치는 영향은 별로 없는 편이다.", "촉각은 고유감각과 통감으로 나누어져 서로 다른 경로로 대뇌피질에 전달된다.", "미각은 단 맛, 짠맛, 쓴맛, 매운 맛, 감칠맛, 신맛으로 나뉘고 각각의 맛에 따라 고 유한 분자가 따로 존재한다."], "a": 3, "A": "④", "E": "정답률 58퍼입니다. 2번을 많이 찍었다고 합니다. ① 빛의 명암을 주로 감지하는 세포는 간상세포입니다. 원추세포는 색을 구별하는 세포입니다. ② 이쪽 공부를 덜 하고 시험을 봐서 그런가 현장에서는 이상함을 잘 못 느꼈는데 해설을 쓰다보니 왜 틀렸는지 잘 모르겠네요.. 달팽이관의 기저부에서 고주파를, 첨부에서 저주파를 감지하는 것은 맞습니다. 최대한 오류를 지적해보자면 교수님의 특성 상, “소리를 감지하는 것은 진동하는 부위가 아니라 유모세포다!”라고 할 수도 있겠습니다. ③ 후각은 중요한 것 외에 나머지 receptor는 시각에 배분되어 시각에 비해 상대적으로 약한 모습이지만, 반대로 시각이 망가지면 다시 후각으로 재배분된다고 합니다. 따라서 퇴화라고 봐야할지 의문이고, 확실하게 틀린 부분은 후각이 감정과 기억에 중요하다는 점입니다. 관련 이론을 보니 매년 교수님의 설명이 조금씩 달라지는 것 같은데 초안자, 검안자의 첨언을 참고해주세요. gemini의 설명에 의하면 후각 정보는 다른 감각들과 달리 시상을 거치지 않고 바로 후각피질로 전달되고 후각피질은 기억과 감정과 관련된 해마, 편도체와 밀접한 연관이 있다고 합니다. ④ 촉각에는 진동, 고유감각, 통증, 온도 등이 있는데 fine touch, vibration, two-point discrimination, proprioception은 Dorsal column-medial lemniscus (DCML)를 통하고 pain, temperature은 spinothalamic tract를 통해 최종적으로 대뇌피질에 전달됩니다. (4) Seonsory pathway: Vision 2026 강의 12(검안): 간상세포는 명암, 원추세포는 색을 감지. 촉각(정밀촉각·진동·고유감각)은 후섬유단-내측섬유띠로, 통각·온도는 척수시상로로 전달.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-61", "keys": ["25-61"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>다음 중 조건화 기억에 관여한다고 알려진 뇌 부분은?<\/div>", "o": ["기저핵", "해마", "대뇌 신피질", "소뇌", "편도체"], "a": 3, "A": "④", "E": "기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니다. 2026 강의 12(검안): 비서술 기억 중 조건화 기억은 소뇌(감정 반응은 편도).", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-70", "keys": ["25-70"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 나이가 들어도 기능이 떨어지지 않는 인지영역은 무엇인가?<\/div>", "o": ["Speed of processing", "Working memory", "동의어 어휘 능력", "장기기억", "자유연상 기억"], "a": 2, "A": "③", "E": "나이가 들어도 유지되거나 오히려 늘어나는 것은 지식·어휘 같은 결정성 지능이다. 처리 속도, 작업기억, 장기기억(자유회상 포함)은 유동성 지능으로 나이와 함께 떨어지며, 50대와 70대에 크게 감소한다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-71", "keys": ["25-71"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 노쇠의 증상에 해당되지 않는 것은?<\/div>", "o": ["난청", "인지 저하", "근육 쇠퇴", "체중 감소", "모두 해당된다"], "a": 4, "A": "⑤", "E": "노쇠는 체중 감소, 탈진, 활동 저하, 느린 거동, 근력 약화가 기준이며 인지 저하도 흔히 동반된다. 감각(시각·청각) 저하 역시 노화에 따른 예비능 감소로 생활능력을 떨어뜨리는 요인이어서, 보기 모두 노쇠의 증상으로 본다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-72", "keys": ["25-72"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 급격히 진행하는 치매질환에 해당되는 것은?<\/div>", "o": ["알츠하이머", "파킨슨 병", "헌팅턴병", "만성 자가면역 뇌염", "CADASIL (Cerebral Autosomal Dominant Arteriopathy with Subcortical Infarcts and Leukoencephalopathy)"], "a": 3, "A": "④", "E": "강의의 진행 속도 분류에서 자가면역 변연계 뇌염은 수개월 안에 진행하는 급속진행성 치매의 원인에 속한다. 알츠하이머병, 헌팅턴병, CADASIL, 루이체 치매(파킨슨 관련)는 수년~십수 년에 걸친 서서히 진행하는 치매로 분류된다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-73", "keys": ["25-73"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음의 알츠하이머병의 진단에 사용되는 혈액검사항목 중 병의 시작과 진행과정을 모니터링하는데 도음이 될 것으로 생각되는 검사항목은 무엇인가?<\/div>", "o": ["혈중 베타 아밀로이드 단백", "혈중 인산화 타우 단백", "혈중 신경필라멘트 (Neurofilament light chain, NfL)", "혈중 교세포섬유질 산성 단백질 (glial fibrillary acidic protein, GFAP)", "혈중 수초염기성 단백 (myelin basic protein, MBP)"], "a": 1, "A": "②", "E": "혈중 인산화 타우(특히 p-Tau217)는 정밀도가 높고 뇌세포 손상 정도를 반영해 위험군을 해마다 추적하는 검사로 제시되었다. 아밀로이드는 일찍 변한 뒤 정체되어 진행 추적에는 덜 유용하고, NfL·GFAP은 신경 손상·염증의 비특이 지표이며 MBP는 탈수초 질환 지표다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-25", "keys": ["23-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>다음 중 알츠하이머 치매에 대한 위험요소에 해당하는 것을 고르시오.<\/div>", "o": ["고령", "여성", "심혈관 위험요소(고혈압, 고지혈, 당뇨, 흡연, 음주 등)", "우울증", "이상 모두"], "a": 4, "A": "⑤", "E": "강의의 알츠하이머병 위험요인은 고령, 가족력, 여성, 운동 부족·흡연·고혈압·고콜레스테롤·당뇨 같은 심혈관 요인이다. 우울증도 중년기 예방 가능 위험요인으로 제시되어 보기 모두 해당한다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-26", "keys": ["23-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>파킨슨 관련 치매에 대한 설명으로 맞는 것은?<\/div>", "o": ["파킨슨관련 단백질은 alpha synuclein, 알츠하이머는 amyloid, tau로 서로 다른 병태생리를 보여 한 환자에서 같이 나타날 수 없다.", "세포 내의 특이 단백질이 뭉쳐서 나타난 것을 루이(소)체 라고 하는 데 뇌 전체에 걸쳐서 나타나는 것을 파킨슨 치매라고 하고 중뇌의 흑색질에만 나타나는 것을 파킨슨병이라고 한다.", "파킨슨병과 루이체 치매는 병태생리가 서로 다르다", "루이체 치매는 파킨슨 증상과 더불어 선명한 환시, 반복되는 낙상, 정신병적 모습, 수면장애 등 복합적인 증상을 보이고 심한 치매로 진행하는 속도가 알츠하이머 치매보다 빠른 편이다.", "루이체 치매는 인지장애에 더불어 파킨슨 증상을 동반하지 않으면 진단할 수 없다."], "a": 3, "A": "④", "E": "루이체 치매는 파킨슨증, 선명한 환시, 낙상, 수면장애 등 복합 증상을 보이며 알츠하이머 치매보다 빨리 진행한다. 알츠하이머·루이체 병리는 한 환자에서 겹칠 수 있고, 루이체가 뇌 전반에 퍼진 것은 루이체 치매, 흑색질 위주는 파킨슨병이며, 둘은 같은 알파-시누클레인 병리다. 파킨슨 징후가 없어도 다른 핵심 소견 2가지로 진단할 수 있다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-44", "keys": ["23-44"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>기억과 관련된 뇌 구조는?<\/div>", "o": ["헤슬 회 Heschl gyrus", "각 회 angular gyrus", "쐐기앞엽 precuneus gyrus", "내후각피질 Entorhinal cortex", "대상 회 cingulate gyrus"], "a": 3, "A": "④", "E": "① Heschl‘s gyurs : Transverse temporal gyri라고 하며, primary auditory cortex를 포함한다. (17, 37 41) ② Angular gyrus : visual to auditory conversation (42쪽) ③ Precuneus gyrus : broaddmann area 17에 해당하며, 일차 시각 피질입니다. ④ Entorhinal cortex : Memory, associative component와 관련 (45쪽 ⑤ Cingulate gyrus : limbic system에 중요. Emotion에 관련 (45 2026 강의 12(검안): 내후각피질은 해마로 정보를 보내는 기억 관련 구조.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-21", "keys": ["22-21"], "ch": 7, "g": "경련성질환", "stem": "<div>24세의 여자가 반복적으로 의식을 잃는 모습을 보인다고 하여 내원하였다. 이상 증상은 약 2년 전부터 나왔는데 눈동자가 멍해지고 불러도 반응이 없는 모습이 보이며 입맛을 쩝쩝 다시고 손은 무엇을 만지는 듯한 모습을 보였다고 한다. 약 2~3분 정도 증상이 있다가 주변에 대한 반응을 보이고 이전과 같아지는데 그동안에 있었던 일을 기억하지 못한다고 한다. 과거력에서 어렸을 때 열이 나면서 경기가 몇 번 있었다고 하며 학교생활이나 운동능력도 정상적이었다. 신체검사나 신경학적 검사에서 이상은 없었고 혈액검사도 정상이며 뇌 MRI 사진과 뇌파검사는 다음과 같다. 이 환자에 대한 적절한 것을 고르면? (선명하게 캡쳐되지 않아 사진이 흐리나, 문제를 푸는데 지장은 없을듯 합니다.)<\/div>", "o": ["뇌파의 화살표는 발작파로 좌측 내측 측두부에서 최대전위를 보인다.", "좌측 해마 경화증으로 인해 기억력에 문제가 생긴다.", "주된 발작은 부분복합발작으로 약물치료 후 예후가 좋다.", "여성이 더 많이 호발한다.", "어릴때 발생한 열경기가 성장해서 뇌전증으로 발전했다."], "a": 0, "A": "①", "E": "반복적으로 의식을 잃고, 멍해지고 불러도 반응이 없고, 입맛을 다시고 손은 무엇을 만지는 듯한 모습(=자동증)을 보이고, 그동안에 있었던 일을 기억하지 못하는 증상을 보입니다. 이것은 복합 부분발작의 증상이며 주로 측두엽에 문제가 있다는 특징이 있습니다. 뇌 MRI 소견) Lt. hippocampus에서 Sclerotic change 뇌파검사 소견) Lt. temporal area에서 뾰족한 발작파가 관찰 - EEG를 읽을 때 hint : 홀수-왼쪽 , 짝수-오른쪽 / F : Frontal, C : Central, P : Parietal, O : Occipital 1번 선지 – 맞는 설명 2번 선지 – 교수님) 좌측 해마 경화증이 있는 것은 맞지만, 발작 동안의 일을 기억하지 못하는 것은 기억력과는 직접적인 연관이 없다. 추가적으로 덧붙여 보자면 학교생활이 정상적이고, 신경학적 검사가 정상적이었기 때문에 기억력은 정상이라고 볼 수 있습니다. (신경학적 검사에 기억력 검사항목이 존재) 3번 선지 – 교수님) 발작을 일으키는 병변이 뇌에 있기 때문에 약 복용 시에는 발작 빈도를 낮출 수 있지만 약을 복용하지 않으면 다시 재발하기 때문에 예후가 좋다고 할 수 없다. 약물치료를 일정기간 한다고 해서 완치가 되는 것이 아니다. 추가적으로 제가 검색해본 바로는 ‘측두엽 간질은 측두엽 부위의 결함이나 상처가 있으면 약물 조절을 어렵게 만들며 이 경우 수술 치료의 대상이 된다’고 합니다. 4번 선지 – 성별이나 인종은 영향이 없습니다. 5번 선지 – 복합열성경련의 경우 뇌전증 확률이 증가하는 것은 맞지만, 복합 열성경련을 하는 아이들은 뇌기능 발달에 문제가 있거나 신경 발달 이상이 있는 경우가 많습니다. 즉, 열성 경련 자체가 뇌전증으로 발전하는 것이 아니라 원래 뇌에 병변이 있어서 뇌전증으로 발전 2026 강의 13(검안) 기출 정리에 같은 문항이 실려 있음(측두엽 뇌전증 — 해마경화, 자동증).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": ["figs/22-21.jpg"], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-23", "keys": ["22-23"], "ch": 7, "g": "경련성질환", "stem": "<div>syncope과 seizure의 가장 확실한 감별점은 무엇인가?<\/div>", "o": ["낙상(falling)", "의식소실", "기억상실", "사지경련", "가장 확실한 감별점은 없다"], "a": 4, "A": "⑤", "E": "1번은 둘다 spell시 나타날 수 있습니다. 두 질환의 특징적인 소견은 아니라서 표에 없습니다. 2번은 각각 <20sec, >60sec을 보입니다. 3번은 automatism을 고려한다면 둘다 기억상실이 동반될 수 있습니다. 4번은 sepll시 나타나는 movement안에 사지경련이 포함될 수 있습니다. 명확히 O, X로 나뉘는 소견이 없어 답이 5번 같습니다. 2026 강의 13(검안): 실신과 뇌전증 발작 감별표 — 어느 항목도 한쪽에만 나타나지 않아 '가장 확실한 감별점은 없다'.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-25", "keys": ["22-25"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>감정, 정서, 기억 등과 관련된 Papez 회로를 변연계에 포함되지 않는 것은? (문제가 좀 이상한데 원래 이랬습니다..)<\/div>", "o": ["해마", "유두체", "기저핵", "시상", "대상회"], "a": 2, "A": "③", "E": "Papez 회로는 해마 → 뇌활 → 유두체 → 시상 앞핵 → 대상회 → 해마곁이랑·내후각피질 → 해마로 이어진다. 기저핵은 운동 조절 회로에 속하고 Papez 회로 구성물이 아니다. (교과서 보충)", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "③", "vb": "검안"}, {"id": "21-26", "keys": ["21-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>75세의 남자가 약 1년 전부터 발생한 기억력 저하를 주소로 내원하였다. 8년 전부터 왼손에 가만히 있을 때 떨림이 있었고 경부와 몸통의 경직이 있으며 걸음걸이가 느려지는 모습을 보이며 파킨슨병 진단하에 약물치료를 시작하였고 운동증상이 호전되어 문제없이 생활하였다. 4년 전부터 말을 시작할 때 첫 마디를 꺼내기 힘들었고 단어가 잘 떠오르지 않아 ‘이거저거’하는 말을 자주 사용하게 되었다. 3년 전부터는 기억이 예전만 못하다는 것을 느꼈고 2년 전에 공원에 갔다가 길을 잃고 헤맨 적도 있었다. 1년 전부터 기억력 저하가 뚜렷해져서 자주 물어보고 한 말을 또 하고 뜬금없는 말을 할 때도 있었다. 말귀를 못 알아듣거나 대화가 끊기는 경우도 생기고 성격도 변해서 우울하고 말수도 줄어들었다. 돈 관리나 복잡한 일은 하지 못하고 과거에 하던 낚시나 사진 같은 취미생활은 더 이상 할 수 없게 되었다. 이 환자의 치매 관련 검사 결과로 적절한 것은?<\/div>", "o": ["인지검사에서 기억력 장애 위주의 인지 이상이 관찰되고 실행 능력은 오랫동안 유지되는 편이다.", "FDG PET 검사에서 포도당 대사 감소는 측두엽보다는 주로 두정엽 위주로 나타나는 편이다.", "뇌 MRI에서 전형적인 해마 위축소견이 나온다.", "아밀로이드 PET 또는 뇌척수액 단백질 검사에서 아밀로이드 단백질 이상은 동반되지 않는다.", "APOE 유전자 이상이 흔히 동반된다."], "a": 3, "A": "④", "E": "2023년 26번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 파킨슨병관련 치매는 많이 기출되는 부분입니다. 기출선지가 조금씩 바뀌고 있으니 꼼꼼하게 공부하시면 좋을 것같습니다. 1) 한 환자에서 같이 나타날 수 있습니다. 2) 파킨슨 치매는 temporal lobe, parietal lobe, cingulate gyrus에서 나타납니다. 3) 둘다 루이소체 축적으로 나타나는 병입니다. 4) 맞는 선지입니다. 5) 관련 없습니다. 2026 강의 자료에 이 증례의 검사 소견이 직접 나오지 않아 교과서·리뷰로 확인함. 파킨슨병 치매(PDD)는 알츠하이머병보다 아밀로이드 침착이 드물어 아밀로이드 PET·CSF 아밀로이드가 대개 정상이다(④, 복원 답). FDG-PET 저대사는 두정·후두엽(후방) 위주로 보고되어 ②도 옳게 읽힐 여지가 있다. 기억 장애 위주가 아니라 실행·시공간 기능 장애가 두드러지고(①×), 해마 위축은 알츠하이머병에 전형적(③×), APOE ε4는 알츠하이머병 위험 유전자(⑤×).", "B": "교과서·의학 자료(PET 영상 리뷰) · 강의 16·19 범위", "N": "②(FDG-PET 두정엽 위주 저대사)도 옳다고 볼 여지가 있음 — 복원 답 ④ 유지", "img": [], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "교과서"}, {"id": "21-27", "keys": ["21-27"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>손상되었을 때 기억 장애를 동반할 수 있는 뇌 영역에 해당하는 것은? 가) 해마     나) 편도     다) 시상     라) 미상핵 (caudate nucleus)<\/div>", "o": ["가, 다", "나, 라", "가, 나, 다", "나, 다, 라", "가, 나, 다, 라"], "a": 4, "A": "⑤", "E": "해마는 서술기억, 편도는 감정 기억·조건화에 관여한다. 강의의 혈관성 치매 부분에서 시상·미상핵처럼 여러 경로가 만나는 주요 부위는 작은 경색 하나로도 지속적인 치매 증상을 일으킬 수 있다고 했다. 따라서 네 부위 모두 손상되면 기억 장애가 생길 수 있다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-16", "keys": ["20-16"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>Lewybody 치매 진단하는 주요항목 아닌 것?<\/div>", "o": ["낙상", "환시", "인지기능장애 있으나 기억력장애 없음", "렘수면 행동장애", "파킨슨 징후"], "a": 0, "A": "①", "E": "개정된 루이체 치매 진단에서 주요(핵심) 항목은 변동하는 인지장애, 반복되는 환시, 렘수면 행동장애, 파킨슨 징후이다. 기억력보다 주의·실행 기능 저하가 두드러지는 인지장애도 특징이다. 반복되는 낙상은 보조 소견이다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-26", "keys": ["20-26"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>75세의 남자가 약 1년 전부터 발생한 기억력 저하를 주소로 내원하였다. 8년 전부터 왼손에 가만히 있을 때 떨림 증상이 있었고 경부와 몸통의 경직이 있으며 걸을걸이가 느려지는 모습을 보이며 파킨슨병 진단하에 약물치료를 시작하였고 운동증상이 호전되어 문제없이 생활하였다. 4년 전부터 말을 시작할 때 첫 마디를 꺼내기 힘들었고 단어가 잘 떠오르지 않아 ‘이거, 저거’하는 말을 자주 사용하게 되었다. 3년 전부터는 기억이 예전만 못하다는 것을 느꼈고 2년 전에 공원에 갔다가 길을 잃고 헤맨 적도 있었다. 1년 전부터 기억력 저하가 뚜렷해져서 자주 물어보고 한 말을 또 하고뜬금없는 말을 할 때도 있었다. 말귀를 잘 못 알아듣거나 대화가 끊기는 경우도 생기고 성격도 변해서 우울하고 말수도 줄어들었다. 돈 관리나 복잡한 일은 하지 못하고 과거에 하던 낚시나 사진 같은 취미생활은 더 이상할 수 없게 되었다. 인지검사에서 기억, 언어, 시공간, 전두엽실행 능력 등 대부분의 인지검사에서 매우 낮은 점수를 보였으나 MRI 사진에서는 뇌의 경도 위축을 보였으나 대체로 큰 이상은 보이지 않았다.<\/div>", "o": ["경도인지장애(Mild Cognitive Impairment)", "알츠하이머 치매", "루이체 치매(Diffuse Lewy Body Disease)", "파킨슨병 치매(Parkinson’s Disease Dementia)", "전측두엽 치매(Frontotemporal Dementia)"], "a": 3, "A": "④", "E": "파킨슨병을 진단받고 수년이 지난 뒤 인지 저하가 생겨 일상 기능까지 떨어졌으므로 파킨슨병 치매다. 루이체 치매는 파킨슨 증상과 인지장애가 거의 동시에 나타난다. 경도인지장애는 일상 기능이 보존되고, 알츠하이머병은 해마 위축이 뚜렷하며, 전측두엽 치매는 행동·언어 장애로 시작한다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-30", "keys": ["20-30"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>기억과 관련된 설명이다. 옳은 것은?<\/div>", "o": ["후각, 기억, 감정, 동기화, 장기기억은 상당히 밀접한 연결을 가지고 있으며 이 기능에 공통적으로 작용하는 뇌구조의 모임을 limbic-system이라고 한다.", "기억을 구분하는데 언어로 표현될 수 있는 서술적 기억과 표현되기 어려운 비서술적 기억으로 나누고 서술적 기억에 주로 관여하는 부분이 해마를 포함하는 구조들이다.", "파블로프가 실험하여 유명한 조건화에 해마는 관여하지 않고 소뇌와 편도가 중요한 역할을 한다.", "기억은 단기기억과 장기기억으로 나누고 단기기억에서 초단기기억으로 작업 기억을 구부하는데 작업 기억은 전두엽에 단기기억은 측투엽에 그리고 장기기억의 저장부위는 뇌 전체에 분포하는 것으로 알려졌다.", "모두 옳다"], "a": 4, "A": "⑤", "E": "2025년 61번 문항과 같은 주제입니다. 복원 자료에 이 문항의 해설은 따로 없어 정답만 실었습니다. 같은 주제 해설: 기억은 declarative/non-declarative로 나눌 수 있는데 non-declarative에는 procedure memory와 classical conditioning이 있습니다. classical conditioning, 고전적 조건화에는 skeletal musculature과 관련된 cerebellum과 emotional responses와 연관된 amygdala가 있습니다. 기출된 문제 중에 ‘조건화에 ~ 소뇌와 편도가 중요한 역할을 한다.’는 선지가 있긴 하지만 정확히 이번 문제 상황에서 둘 중 무엇을 골라야하는지에 대한 증거는 찾지 못했습니다. 다만, 교수님의 문제를 쭉 보면 편도체는 ‘공포, 감정’같은 키워드와 같이 다니고 ‘조건화’ 자체만 묻는다면 소뇌를 답으로 하는게 맞다고 보입니 2026 강의 12(검안) 기출 정리에 같은 문항(답 ⑤)이 실려 있음.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-35", "keys": ["20-35"], "ch": 7, "g": "치매·퇴행성 질환", "stem": "<div>최근에 개정된 레비소체(루이소체)치매(DLBD) 진단기준은 이전의 기준과 다르게 핵심소견 4개, 암시소견 3개, 지지소견 10개에서 4개의 핵심소견과 3가지의 임상특징들로 바뀌었다. 다음 중 4가지 핵심소견에 해당되지 않는 것을 고르면?<\/div>", "o": ["치매", "주의 집중력과 각성의 현저한 변화", "세밀하게 잘 형상화된 반복되는 환시", "반복되는낙상과실신", "자연발생 양상의 파킨슨증"], "a": 3, "A": "④", "E": "개정 기준의 핵심 소견은 치매(필수 요소), 주의·각성의 뚜렷한 변동, 잘 형상화된 반복 환시, 자발적 파킨슨증 등이다. 반복되는 낙상과 실신은 지지(보조) 소견이다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-62", "keys": ["25-62"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>인간의 감정과 행동 기억과 관련된 체계로 일련의 다양한 뇌 구조로 이루어진 것을 무어라고 하나? 영어로 적으시오.<\/div>", "o": [], "a": -1, "A": "limbic system", "acc": ["limbic system", "limbic-system", "limbic systems"], "E": "감정, 행동, 기억과 관련된 여러 뇌 구조의 모임은 변연계(limbic system)이다. 해마-유두체-시상-대상회로 이어지는 '회로'를 묻는 경우에는 Papez circuit이 답이다. (교과서 보충)", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "limbic system", "vb": "검안"}, {"id": "25-74", "keys": ["25-74"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>알츠하이머의 질병 진행변경 치료제로 (disease modifying drug) 최근에 승인되어 사용중인 레켐비 주사제의 가장 잘 알려진 뇌 부작용을 영어로 적으시오.<\/div>", "o": [], "a": -1, "A": "ARIA (Amyloid-Related Imaging Abnormalities)", "acc": ["ARIA", "Amyloid-Related Imaging Abnormalities", "amyloid related imaging abnormalities", "ARIA-E", "ARIA-H"], "E": "레켐비(lecanemab)의 대표적인 뇌 부작용은 아밀로이드 관련 영상 이상(ARIA)이다. 이 때문에 치료 중 MRI를 반복해서 찍어야 한다. 부종형(ARIA-E)과 미세출혈·혈철소침착형(ARIA-H)을 포함하며, ARIA가 들어간 답은 모두 정답으로 인정되었다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "ARIA (Amyloid-Related Imaging Abnormalities)", "vb": "검안"}, {"id": "25-75", "keys": ["25-75"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>2024년에 유명한 의학잡지 란셋지에서 알츠하이머 치매의 예방으로 체계적인 리뷰를 통해 예방 가능 요소로 지적된 것 중 가장 비율이 높은 7%로 꼽은 두 가지 요소를 적으시오<\/div>", "o": [], "a": -1, "A": "청력 감퇴, 높은 LDL 콜레스테롤", "acc": [], "E": "2024년 Lancet 위원회는 치매의 수정 가능한 위험요인 14가지를 제시했다. 이 가운데 기여 비율이 7%로 가장 높은 것이 중년기 청력 감퇴와 높은 LDL 콜레스테롤이다. 모든 요인을 관리하면 치매의 약 45%를 줄일 수 있다고 강의에서 설명했다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "청력 감퇴, 높은 LDL 콜레스테롤", "vb": "검안"}, {"id": "23-2Q-22", "keys": ["23-2Q-22"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>최근에 개발된 알츠하이머 치매의 치료제로 특정 물질에 대한 표적 치료제가 미국에서 승인되었고 조만간에 국내에도 도입될 예정인데 어떤 물질을 타겟으로 하나?<\/div>", "o": [], "a": -1, "A": "amyloid, 아밀로이드", "acc": ["amyloid", "아밀로이드", "beta amyloid", "베타 아밀로이드", "amyloid beta", "beta-amyloid", "Aβ"], "E": "레카네맙 같은 항아밀로이드 항체(수동 면역치료)는 뇌에 쌓인 베타 아밀로이드를 표적으로 제거한다. 세포를 되살리지는 못하지만 병의 진행 속도를 늦춘다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "amyloid, 아밀로이드", "vb": "검안"}, {"id": "23-2Q-23", "keys": ["23-2Q-23"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>언어장애와 이상행동이 주된 초기 증상으로 나타나서 점차 기억, 시공간 능력, 실행 능력 등의 인지기능이 떨어지는 양상의 치매 유형을 무엇인가?<\/div>", "o": [], "a": -1, "A": "전측두엽 치매", "acc": ["전측두엽 치매", "전측두엽치매", "전두측두엽 치매", "전두측두엽치매", "frontotemporal dementia", "FTD"], "E": "전측두엽 치매는 타우 병리로 전두엽·측두엽이 위축된다. 초기에 기억장애보다 언어장애와 행동·성격 변화(탈억제, 무감동 등)가 먼저 나타난다. 알츠하이머병보다 젊은 나이(60대 초반)에 생기고 빨리 진행한다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "전측두엽 치매", "vb": "검안"}, {"id": "22-2Q-59", "keys": ["22-2Q-59"], "ch": 7, "g": "치매·퇴행성 질환", "t": "s", "stem": "<div>유전성 경향을 보이고 뇌경색 또는 뇌출혈과 더불어 점진적으로 진행되는 인지장애로 치매를 유발하는 질환은? (영어로)<\/div>", "o": [], "a": -1, "A": "cerebral amyloid angiopathy / CAA", "acc": ["CAA", "cerebral amyloid angiopathy"], "E": "대뇌 아밀로이드 혈관병증(CAA)은 아밀로이드가 피질·연수막의 작은 혈관벽에 침착하는 병으로, 뇌엽 출혈·백질뇌증·열공경색·치매를 일으킵니다. 대부분 산발성이지만 유전형(네덜란드형 등)도 있습니다. 고혈압 다음으로 흔한 비외상성 뇌내출혈의 원인입니다. 2026 강의에는 CAA가 60세 이상 비외상성 뇌내출혈의 2번째 원인으로만 나온다. 유전성 CAA(네덜란드형 등, APP·CST3 변이, 상염색체 우성)는 성인기에 뇌출혈·뇌경색과 진행성 치매를 일으킨다. 유전성 경향 + 뇌경색 → CADASIL도 떠올릴 수 있으나, 뇌출혈까지 함께 언급되면 CAA에 더 맞는다(복원 답 유지).", "B": "교과서·의학 자료(MedlinePlus 유전성 CAA, StatPearls CAA) · 강의 06 ICH 원인 참고", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "cerebral amyloid angiopathy / CAA", "vb": "교과서"}, {"id": "25-64", "keys": ["25-64"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 중 뇌전증이 치료되었다고 생각되어지는 사람은?<\/div>", "o": ["뇌전증 약 투약 후 2년 동안 발작이 다시 나타나지 않는 사람", "뇌전증 약물 중단 후 1년이 지났는데 발작이 재발되지 않은 사람", "뇌전증이 있어 뇌 사진을 찍었고 뇌종양이 발견되어 수술로 제거한 지 6개월 된 사람", "교통사고로 뇌출혈이 생겨 입원 도중 경련성 뇌전증 발작이 생겼고 뇌수술 후 혈종을 제거한 뒤 3개월이 지나 출혈이 완전히 흡수 완료된 사람", "뇌전증으로 약물복용을 오랫동안 해오는 사람으로 10년 전부터는 발작이 전혀 나타나지 않는 사람"], "a": 4, "A": "⑤", "E": "26년 강의(2014 뇌전증 종료 추정): 2014년 ILAE 정의에서 뇌전증이 resolved(완해)되었다고 보는 경우는 연령 의존 증후군에서 해당 나이가 지난 뒤 발작이 없을 때, 투약을 유지하며 10년 이상 발작이 없을 때, 투약 중단 후 5년 이상 발작이 없을 때다. 약을 계속 먹으며 10년간 발작이 없었던 ⑤가 이에 해당한다. ①(투약 중 2년)·②(중단 후 1년)는 기간이 모자라고(2014년 이전에는 약을 끊고 2년을 기준으로 봤다), ③은 병소 제거 후 6개월로 관찰 기간이 너무 짧으며, ④는 외상성 뇌출혈 급성기의 유발 발작이라 완해 개념을 적용하기 어렵다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-65", "keys": ["25-65"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증의 역학에 대해 옳은 설명은?<\/div>", "o": ["전세계 공통적으로 뇌전증은 나타나며 인종, 국가, 사회환경에 관계없이 비슷하 게 발병된다", "저개발 국가는 노년층이 선진국은 젊은 연령에서 빈도가 높다", "고령화로 인해서 전세계에서 점차 발생빈도가 증가하는 뇌질환이다.", "뇌전증 환자는 일반인에 비해 사망률이 그다지 높지 않다", "뇌전증의 최소 반 정도는 치료되는 편이다"], "a": 4, "A": "⑤", "E": "26년 강의(뇌전증의 역학·자연경과): 자연경과 그림에서 약물 난치성으로 남는 비율은 약 30%이고 나머지는 완화되며(일부 재발), 최소 절반 정도는 치료되는 편이라 ⑤가 옳다. 유병률은 저개발국(약 1%)이 선진국(약 0.5%)보다 높아 환경에 따라 다르고(①), 저개발국은 젊은 층, 선진국은 노년층에 많아 ②는 반대다. 노년층에 많은 것은 뇌졸중·퇴행성 질환에 따른 뇌손상 때문이지 고령화 자체 때문은 아니라는 것이 출제 교수의 설명이라 ③도 틀리고(가장 많이 고른 오답), 표준화 사망비(SMR)가 일반인보다 1.2~1.5배 높게 유지되므로 ④도 틀린다. (정답률 14%)", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-66", "keys": ["25-66"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌세포의 활성도가 증가하는 게 기본적인 뇌전증의 발병 기전으로 생각되는데 신경세포의 흥분도 증가를 일으키는 신경전달 물질은?<\/div>", "o": ["글루타메이트", "가바 (GABA)", "도파민", "세로토닌", "엔돌핀"], "a": 0, "A": "①", "E": "26년 강의(뇌전증 발생 기전): 뇌전증을 일으키는 두 핵심 신경전달물질은 흥분성 glutamate와 억제성 GABA이며, glutamate가 늘거나 GABA가 줄면 흥분도가 올라가 발작이 퍼진다. 따라서 흥분도 증가를 일으키는 물질은 glutamate(①)다. GABA는 반대로 억제성이며 많은 항경련제가 GABA 작용을 강화한다. 도파민·세로토닌·엔돌핀은 상황에 따라 흥분 또는 억제로 작용하며 뇌전증 기전의 핵심으로 다루지 않는다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-67", "keys": ["25-67"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 뇌사진과 뇌파검사를 보고 가장 관련된 질환은?<\/div>", "o": ["측두엽 종양", "해마경화증", "혈관종", "실질형성이상", "결절성 경화증(tuberous sclerosis)"], "a": 1, "A": "②", "E": "26년 강의(측두엽 뇌전증, 매년 출제되는 사진): MRI에서 한쪽 hippocampus가 반대쪽보다 위축되어 있고, 뇌파에서 같은 쪽 측두부 전극에 발작파가 보이는 것은 해마경화증(②)의 전형적 소견이다. 해마경화증은 focal epilepsy 중 가장 흔한 측두엽 뇌전증의 대표 원인이다. 측두엽 종양은 위축보다 주변을 누르는 종괴 효과를, 피질 이형성증은 피질 이상을, 결절성 경화증은 피질의 다발성 결절을 보여 영상 소견이 다르다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": ["figs/25-67.jpg"], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-37", "keys": ["23-37"], "ch": 7, "g": "경련성질환", "stem": "<div>다음 중 뇌전증 진단에 가장 합당한 환자를 고르시오<\/div>", "o": ["15세 남자 환자 수업 중 경련성 대발작으로 응급실에 내원하였다. 2달전 같은 증상으로 응급실에 내원하였다.", "50세 남자 환자 경련성 대발작으로 응급실에 내원하였다. 이 환자는 하루에 2병 이상 계속 술을 마셔왔고 마지막 술을 마신지 만 하루만에 증상이 나타났다. 첫 증상이었고 비협조적이고 과흥분상태였다.", "45세 환자 자전거를 타고 가다가 차에 치여 의식을 잃고 응급실에 내원하였다. 응급실에서 경련성 대발작을 보였다. 뇌 CT촬영에서 특별한 이상은 없었다.", "35세 여자 환자 이상 행동으로 응급실에 내원하였다. 모친상에서 울다가 과흥분 상태로 전신 움직임을 보이고 의식이 떨어졌다.", "75세 남자 환자 비닐하우스에서 일하다가 전신경련을 보이고 응급실에 내원하였다. 체온은 39.2도였다."], "a": 0, "A": "①", "E": "26년 강의(뇌전증의 정의): 뇌전증 진단의 기본 전제는 뚜렷하고 일시적인 유발 요인이 없는(unprovoked) 발작이 반복되는 것이다. ①은 유발 요인 없이 2달 간격으로 대발작이 재발했으므로 가장 합당하다. ②는 알코올 금단, ③은 급성 두부 외상, ⑤는 고열이라는 뚜렷한 유발 요인(seizure precipitant)이 있는 급성 증상 발작이고, ④는 감정 자극 뒤 나타난 심인성(히스테리) 발작에 가깝다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-38", "keys": ["23-38"], "ch": 7, "g": "경련성질환", "stem": "<div>유전적 소인이 있는 전신 특발성 뇌전증에 포함되지 않는 뇌전증 증후군은?<\/div>", "o": ["청소년근간대뇌전증 juvenile myoclonic epilepsy", "소아결신발작 childhood absence epilepsy", "라스무센 증후군 Rasmussen syndrome", "청소년결신뇌전증 juvenile absence epilepsy", "전신강직간대발작 단독 자간증 Epilepsy with generalized tonic-clonic seizure only"], "a": 2, "A": "③", "E": "26년 강의(특발성 전신 뇌전증): 유전적 소인이 있는 특발성 전신 뇌전증(idiopathic generalized epilepsy)으로 묶는 네 가지는 childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, GTCS 단독 뇌전증이다. Rasmussen syndrome(③)은 한쪽 대뇌반구에 만성 염증이 진행하는 후천성 국소 뇌전증으로 여기에 속하지 않는다. 여러 번 출제된 내용이라 네 가지를 외워 둔다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-39", "keys": ["23-39"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 발작과 감별 해야하는 질환은?<\/div>", "o": ["공황장애", "실신", "히스테리 발작", "틱 장애", "위의 모두 다"], "a": 4, "A": "⑤", "E": "26년 강의(뇌전증 발작과 감별할 질환): 실신, TIA, 공황장애, 저혈당 발작, 수면장애(cataplexy, somnambulism 등), 운동장애(tic, hemifacial spasm 등), 히스테리 발작을 감별해야 한다. 보기의 공황장애·실신·히스테리 발작·틱 장애가 모두 이 목록에 들어가므로 '모두 다'(⑤)가 정답이다. 이 교수는 '모두 다' 선지를 정답으로 자주 낸다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-40", "keys": ["23-40"], "ch": 7, "g": "경련성질환", "stem": "<div>뇌전증 환자의 투약에 대한 옳은 내용은?<\/div>", "o": ["대부분은 약물치료로 완치되는 병이다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "뇌전증 환자가 임신 중 발작이 나타나서 새로운 약을 추가로 투약하는 것은 위험하다.", "케톤식이요법은 소아 뇌전증 환자에게만 효과가 입증되었다.", "투약 중단 후 5년 이상 발작이 없거나 투약 이후 10년 이상 발작이 나타나지 않으면 완해되었다고 판단하는 경향이다."], "a": 4, "A": "⑤", "E": "26년 강의(2014 뇌전증 종료 추정·치료): 투약 중단 후 5년 이상, 또는 투약을 유지하며 10년 이상 발작이 없으면 완해로 판단하므로 ⑤가 옳다. 치료 목표는 완치가 아니라 seizure free 상태이므로 '대부분 완치'라는 ①은 틀리고, 수술로 병소를 제거해도 항경련제가 필요한 경우가 많다(②). 임신 중 발작이 생기면 적극적으로 약을 바꾸거나 추가하며(③), 케톤식이는 성인에게도 효과가 있으나 현실적으로 주로 소아에게 쓴다(④).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-22", "keys": ["22-22"], "ch": 7, "g": "경련성질환", "stem": "<div>알코올 관련발작에 대한 설명으로 옳은 것은?<\/div>", "o": ["acute alcoholism과 관련된 alcohol toxic seizure이다", "뇌파검사상 발작파 발견 가능성이 높다", "향후 뇌전증으로 발전하므로 조기에 예방적 항경련제 치료가 필요하다", "진전섬망으로 발전 가능성이 높다", "경련성 전신 대발작이 특징이다"], "a": 3, "A": "④", "E": "26년 학습부(알코올 금단증후군): 알코올 관련 발작(rum fits)은 급성 중독이 아니라 만성 음주자가 술을 끊은 뒤 6~48시간(흔히 하루 안)에 생기는 금단 발작이다(①은 틀림). 금단 증상은 떨림 → 알코올 환각증 → 금단 발작 → 진전섬망(delirium tremens) 순으로 진행할 수 있어 ④가 옳다. 뇌파에서 발작파는 대개 보이지 않고(②), 발작은 이틀 정도면 멈추므로 장기 예방적 항경련제는 필요 없고 재발 방지에는 IV lorazepam을 쓴다(③).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "알코올 금단 발작은 2026년 강의 본문에 직접 나오지 않아 학습부에 실린 관련 이론(다른 강의 자료)과 교과서로 판단했습니다(학습부에도 '대부분 전신강직간대발작'으로 적혀 있어 ⑤도 논란 가능, 복원 답 ④ 유지).", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-24", "keys": ["22-24"], "ch": 7, "g": "경련성질환", "stem": "<div>간질의 치료에 대해 옳은 것은?<\/div>", "o": ["약물로 완전한 회복을 기대하기는 어렵다.", "수술로 발작 병소를 제거하면 항경련제를 복용할 필요가 없다.", "자가면역성 뇌염으로 인한 뇌전증 중첩증은 약물이 잘 듣지 않고 예후가 좋지 않다.", "케톤식이요법은 소아 난치성 뇌전증에만 효과가 입증되었다.", "적극적인 약물치료로 뇌전증 중첩증의 사망률을 의미있게 낮출 수 있다."], "a": 2, "A": "③", "E": "26년 강의(치료·뇌전증 중첩증): 자가면역성 뇌염이나 중추신경계 감염처럼 원인 질환이 있는 중첩증은 항경련제에 잘 듣지 않고 근본 원인 때문에 예후가 나쁘므로 ③이 옳다. 뇌전증은 90% 이상 약물로 치료하며 약을 끊고 seizure free가 되기도 하므로 ①은 틀리고, 수술 후에도 호전되지 않아 약이 필요한 환자가 있어 ②도 틀린다. 케톤식이는 중환자 성인에게도 적용할 수 있고(④), 적극적 약물치료가 중첩증의 사망률을 의미 있게 낮춘다는 설명은 없다고 교수가 피드백했다(⑤).", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "③", "vb": "검안"}, {"id": "21-10", "keys": ["21-10"], "ch": 7, "g": "경련성질환", "stem": "<div>대뇌에 많은 신경전달물질 중 뇌전증 치료제의 효과에 가장 관련이 높은 물질은?<\/div>", "o": ["Dopamine", "GABA", "Glutamate", "Ach", "Serotonin"], "a": 1, "A": "②", "E": "26년 강의(뇌전증 기전·약물 표적): GABA는 아미노산에서 유래한 대표적 억제성 신경전달물질로, 항경련제는 흥분성을 낮추고 억제성을 높이는 방향으로 이온 채널과 신경전달물질을 조절한다. Phenobarbital, valproate, topiramate, vigabatrin, gabapentin 등 많은 약이 GABA와 관련되어 GABA(②)가 가장 관련이 높다. Glutamate는 흥분성 물질이고, dopamine·ACh·serotonin은 항경련제의 주된 표적이 아니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "2021년 10번은 같은 내용의 주관식(아미노산에서 유래한 억제성 신경전달물질, 답 GABA)이어서 같은 주제의 객관식 문항 형태로 실었습니다.", "img": [], "v": false, "y": [2021], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-68", "keys": ["25-68"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>청소년기에 주로 발생되며 발작양상은 결신발작, 근간대성발작, 대발작 양상을 보이며 약물 복용으로 재발이 잘 되지 않지만 중단하면 재발이 잘 생기는 모습을 주로 보이는 뇌전증 증후군을 뭐라고 하나?<\/div>", "o": [], "a": -1, "A": "청소년기 근간대성 뇌전증, juvenile myoclonic epilepsy", "acc": ["청소년기 근간대성 뇌전증", "juvenile myoclonic epilepsy"], "E": "청소년기에 주로 발생하며 ‘약물 복용으로 재발이 잘 되지 않지만 중단하면 재발이 잘 생기는 모습’의 특징을 보고 답을 쓸 수 있었습니다. 청소년기 발병, 3가지 발작 유형(근간대성, 결신, 대발작) 동반, 그리고 약물 중단 시 높은 재발률 이렇게 3가지가 중요한 특징이니 기억해주시면 되겠습니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "청소년기 근간대성 뇌전증, juvenile myoclonic epilepsy", "vb": "검안"}, {"id": "25-69", "keys": ["25-69"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>전두엽 뇌전증 특히 보조운동영역에서 시작하는 뇌전증 발작의 특징적인 모습을 일컫는 자세의 이름은?<\/div>", "o": [], "a": -1, "A": "펜싱 자세, pencing posture", "acc": ["펜싱 자세", "fencing posture", "pencing posture"], "E": "교수님이 보여주신 정답 사진에는 철자가 저렇게 나와있는데 발음만 맞으면 맞다고 해주실 것 같습니다. (검색해보면 fencing이네요) 딱히 강조했던 내용도 아니었고 기출에서도 보지 못한 개념이라 현장에서 떠오르지도 않았습니다. 관련 이론 참고하시고 맞출 수 있겠다는 분들은 이와 같은 개념들 외워주시고, 난 못 맞추겠다 싶으신 분들은 다른 문제를 확실히 맞출 수 있도록 합시다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "펜싱 자세, pencing posture", "vb": "검안"}, {"id": "23-41-s", "keys": ["23-41"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>측두엽 뇌전증에서 나타나는 대표적인 뇌 MRI의 이상 소견을 적으시오<\/div>", "o": [], "a": -1, "A": "hippocampus sclerosis", "acc": ["hippocampal sclerosis", "hippocampus sclerosis", "해마경화"], "E": "처음 출제된 내용입니다. 측두엽 뇌전증과 관련된 증상, 영상소견, 뇌파소견 등 확인하시면 되겠습니다. 1) Temporal lobe Epilepsy", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "hippocampus sclerosis", "vb": "검안"}, {"id": "23-42-s", "keys": ["23-42"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>뇌전증 발병 기전으로 흥분성 신경전달과 억제성 신경전달의 불균형을 드는 데 이와 관련된 대표적인 신경전달물질을 흥분성, 억제성 순서로 하나씩 적으시오.<\/div>", "o": [], "a": -1, "A": "흥분성 – glutamate, 억제성 – GABA (한글도 인정)", "acc": [], "E": "Neurotransmitter에는 흥분성과 억제성 물질들이 있고, 여러 가지 Neurotransmitter 중에서 epilepsy 형성 메커니즘에 관여하는 main factor는 glutamate와 GABA입니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "흥분성 – glutamate, 억제성 – GABA (한글도 인정)", "vb": "검안"}, {"id": "22-54", "keys": ["22-54"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>발작 양상 중 전신 또는 신체 일부에서 근육이 순간적으로 빠르게 수축하는 양상을 나타내는 발작은?<\/div>", "o": [], "a": -1, "A": "myoclonic seizure / myoclonus / 근간대발작 / 근육간대경련발작", "acc": ["근간대발작", "근육간대경련발작", "myoclonus", "myoclonic seizure"], "E": "짧고 전기충격 같은 근육(군)의 수축이 myoclonic seizure입니다. 잠들 때 움찔하는 양성 비뇌전증성 근간대와 구분하며, 뇌파는 전반적 4–6 Hz 다극파-서파입니다. 청소년기 근간대 뇌전증(JME)이 대표적입니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "myoclonic seizure / myoclonus / 근간대발작 / 근육간대경련발작", "vb": "검안"}, {"id": "22-55", "keys": ["22-55"], "ch": 7, "g": "경련성질환", "t": "s", "stem": "<div>임신부에서 특히 조심해야 할 항경련제로 중추신경계 기형아 발생이나 출생아 지능이 낮을 수 있다는 문제로 기피되는 항경련제는? (영어로)<\/div>", "o": [], "a": -1, "A": "valproate / valproic acid", "acc": ["valproate", "valproic acid"], "E": "Valproate는 다른 항경련제보다 기형(특히 신경관 결손) 발생률이 높고 태아 IQ 저하와도 관련됩니다. 가장 안전한 약은 lamotrigine(그 외 levetiracetam)이고, 임신 중 엽산 고용량, 36주 출혈 위험 시 비타민 K를 줍니다.", "B": "26 학습부 13번(검안) · 경련성질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "valproate / valproic acid", "vb": "검안"}, {"id": "25-59", "keys": ["25-59"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시신경교차부위의 병변으로 나타날 수 있는 시야장애의 양상 은 어느 것인가?<\/div>", "o": ["동측 반맹", "양측두부 반맹", "일측 전맹", "동측 사분맹", "양측두부 사분맹"], "a": 1, "A": "②", "E": "② 정답: 시신경교차에서는 양쪽 눈의 비측(내측) 망막 섬유가 교차한다. 비측 망막은 측두쪽 시야를 받으므로 교차부(예: 뇌하수체 종양) 병변은 양측두부 반맹을 일으킨다. ① 동측 반맹은 시각로·외측슬상체·시각부챗살·후두엽 등 교차 뒤 병변, ③ 일측 전맹은 교차 앞 시신경 병변, ④ 사분맹은 측두엽(상사분맹)·두정엽(하사분맹)을 지나는 시각부챗살 병변에서 나타난다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-60", "keys": ["25-60"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>브로드만 뇌 영역과 뇌 기능과의 연결이 옳은 것은<\/div>", "o": ["영역 4 – 일차 감각 영역", "영역 3,1,2 – 일차 운동 영역", "영역 8 – 전운동(premotor) 영역", "영역 6 – 보조운동영역", "영역 5,7 – 이차 감각 영역"], "a": 4, "A": "⑤", "E": "⑤ 정답: 영역 5·7은 1·2·3 영역의 체감각 정보와 시각 정보를 통합하는 후두정 피질로, 이차 감각 영역(S2)에 해당한다. ① 영역 4는 일차 운동 영역, ② 영역 3·1·2는 일차 감각 영역이다. ③ 영역 8은 frontal eye field이다. ④ 영역 6은 premotor cortex와 supplementary motor cortex를 함께 포함하는 이차 운동 영역(M2)이므로 '보조운동영역'만으로 짝지은 것은 정답으로 보지 않았다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-45", "keys": ["23-45"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>우리 몸의 생체시계를 담당하는 시상하부의 핵은?<\/div>", "o": ["supraoptic nucleus", "suprachiasmatic nucleus", "dorsomedial nucleus", "arcuate nucleus", "paraventricular nucleus"], "a": 1, "A": "②", "E": "② 정답: 생체시계(circadian rhythm)는 시상하부의 suprachiasmatic nucleus가 담당한다. 망막으로 들어온 빛 신호 일부가 이 핵으로 전달되어 낮과 밤을 구별하고, 멜라토닌 분비와 함께 수면-각성 주기를 맞춘다. supraoptic·paraventricular nucleus는 항이뇨호르몬 분비, paraventricular nucleus는 스트레스 호르몬·체온 조절, arcuate nucleus는 식욕 조절과 관련된다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-26", "keys": ["22-26"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체기능에 해당하지 않는 것은?<\/div>", "o": ["수면 각성", "호흡 주기", "산, 염기, 전해질", "에너지 대사", "식욕 및 체중"], "a": 1, "A": "②", "E": "② 정답: 강의에서 시상하부가 조절하는 기능은 수분 조절(Water regulation, ③), 음식 섭취·체중 조절(Food regulation, ⑤), 수면-각성 조절(Sleep-waking regulation, ①·④), 여러 호르몬 조절, 자율신경 조절, 체온 조절이다. 호흡 주기는 뇌간(연수·교뇌)의 호흡중추가 조절하므로 시상하부 기능에 해당하지 않는다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "21-28", "keys": ["21-28"], "ch": 7, "g": "신경계 구조와 기능", "stem": "<div>시상하부가 조절하는 신체 기능에 해당하는 것은? 가) 체중조절     나) 수면-각성 주기 조절     다) 전해질 균형     라) 산-염기 균형<\/div>", "o": ["가, 다", "나, 라", "가, 나, 다", "나, 다, 라", "가, 나, 다, 라"], "a": 4, "A": "⑤", "E": "⑤ 정답: 체중 조절(Food regulation), 수면-각성 주기 조절(Sleep-wake regulation), 전해질 균형(Water regulation·호르몬 조절)은 모두 시상하부가 조절한다. 산-염기 균형도 이 문항에서는 맞는 보기로 보아 ⑤가 정답이다(2022년 피드백에서는 전해질과 산-염기를 하나로 묶어 설명했다). 2022년 26번과 비교해 두면 좋다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-63", "keys": ["25-63"], "ch": 7, "g": "신경계 구조와 기능", "t": "s", "stem": "<div>뇌의 이 영역이 파괴되거나 유전적으로 부적절하게 형성이 되면 무서움을 모르는 사람이 된다고 하는데 이 부분을 뭐라 하는가?<\/div>", "o": [], "a": -1, "A": "편도체, amygdala", "acc": ["amygdala", "편도체", "편도"], "E": "정답: 편도체(amygdala). 공포 회로(circuitry of fear)의 중심 구조로, 자극이 시상을 거쳐 변연계에 전달되면 감정 행동·자율신경 반응·호르몬 반응이 나타난다. 편도체가 없거나 제대로 형성되지 않으면 무서움을 느끼지 못하며, 발달한 편도체는 생존에 도움이 된다고 설명했다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "편도체, amygdala", "vb": "검안"}, {"id": "23-43-s", "keys": ["23-43"], "ch": 7, "g": "신경계 구조와 기능", "t": "s", "stem": "<div>대뇌피질의 위치와 기능의 상관관계를 표현하는 말에 작은 난장이가 뇌 안에 산다는 표현을 영어로 표현하면?<\/div>", "o": [], "a": -1, "A": "Homunculus", "acc": ["Homunculus"], "E": "정답: Homunculus. 대뇌 피질의 일차 운동·감각 영역에서 신체 부위별 담당 위치와, 담당 피질 면적의 크기를 반영해 그린 '피질 속의 작은 사람'이다. 손과 얼굴(입술·혀)이 크게 그려진다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "Homunculus", "vb": "검안"}, {"id": "22-2Q-58", "keys": ["22-2Q-58"], "ch": 7, "g": "신경계 구조와 기능", "t": "s", "stem": "<div>대뇌의 퇴행성 질환과 관련되어 잘 알려진 수면장애는 무엇인가?<\/div>", "o": [], "a": -1, "A": "렘수면행동장애(REM sleep behavior disorder)", "acc": ["REM sleep behavior disorder", "렘수면행동장애", "RBD"], "E": "렘수면행동장애(RBD)는 렘수면 중 근긴장 소실이 일어나지 않아 꿈 내용을 행동으로 옮기는 수면장애로, 파킨슨병·루이체 치매·다계통위축증 같은 알파-시누클레인병증보다 수년 먼저 나타나는 전구 증상으로 잘 알려져 있다. (교과서 보충) 2026 강의 16(검안): 렘수면행동장애(RBD)는 후각저하·변비·우울과 함께 파킨슨병의 운동 전(premotor) 징후로 소개됨.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "렘수면행동장애(REM sleep behavior disorder)", "vb": "검안"}, {"id": "22-53", "keys": ["22-53"], "ch": 7, "g": "신경계 구조와 기능", "t": "s", "stem": "<div>다음 대뇌 영역 중 언어 중추 중 감각 영역에 해당되는 부분의 번호와 brodmann area number는? (숫자 두 개)<\/div>", "o": [], "a": -1, "A": "4, 22", "acc": [], "E": "정답: 4, 22. 언어 중추 가운데 감각 영역은 Wernicke's area(그림의 4번)로 Brodmann area 22이며, 손상되면 유창하지만 이해력이 떨어지는 감각성 실어증이 생긴다. 운동성 언어 중추인 Broca's area는 Brodmann 44·45이고, 둘을 잇는 arcuate fasciculus가 손상되면 따라 말하기가 안 되는 전도 실어증이 생긴다.", "B": "26 학습부 12번(검안) · 신경계 구조와 기능", "N": "", "img": ["figs/22-53.jpg"], "v": false, "y": [2022], "ok": true, "ra": "4, 22", "vb": "검안"}, {"id": "25-46", "keys": ["25-46"], "ch": 8, "g": "신경병리", "stem": "<div>Wallerian degeneration에 대한 설명으로 옳은 것은 무엇인가?<\/div>", "o": ["손상된 신경축삭(axon)의 세포체(cell body)에서 변성이 먼저 시작된다.", "말초신경보다 중추신경에서 더 효과적으로 재생이 일어난다.", "손상 부위의 원위부(distal part) 축삭과 수초가 파괴된다.", "신경세포가 손상되면 바로 세포사멸(apoptosis)이 일어난다.", "Wallerian degeneration은 감각신경에서만 일어나는 특이적 현상이다."], "a": 2, "A": "③", "E": "Wallerian degeneration은 말초신경이 절단·압궤되었을 때 절단 부위보다 원위부의 축삭과 수초가 변성되는 순행성(anterograde) 변화로, 대식세포가 수초 잔해(myelin figure)를 탐식한다(근위부는 가장 가까운 랑비에 결절까지만 변성). ① 세포체부터 죽어 올라가는 것은 대사 이상에 의한 axonal degeneration(dying back), ② 말초신경은 슈반세포 덕분에 중추신경보다 재생이 잘 되고, ④ 세포체는 central chromatolysis를 보일 뿐 바로 죽지 않으며, ⑤ 운동·감각 신경을 가리지 않고 축삭이 끊기면 일어난다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-47", "keys": ["25-47"], "ch": 8, "g": "신경병리", "stem": "<div>Werdnig-Hoffmann disease의 병리학적 특징에 대한 설명으로 옳은 것은?<\/div>", "o": ["중추신경계의 백질(white matter) 탈수초(demyelination)가 주된 병변이다.", "상위운동신경원(upper motor neuron)의 소실이 주된 원인이다.", "척수 전각(anterior horn)의 운동신경원(motor neuron) 손실이 특징이다.", "말초신경의 축삭 재생이 과도하게 일어나 근비대(hypertrophy)를 유발한다.", "골격근에서 거대핵을 가진 세포가 비정상적으로 증식하는 것이 관찰된다."], "a": 2, "A": "③", "E": "Werdnig-Hoffmann disease는 척수성 근위축증(SMA)의 가장 흔한 형으로, 척수 전각의 하위운동신경원이 선천적으로 소실되는 질환이다(floppy baby, 대개 3세 전 사망). 근생검에서 group(panfascicular) atrophy를 보이지만 작은 각진 섬유는 나오지 않는 것이 특징이다. ① 백질 탈수초는 다발성 경화증, ② 상위운동신경원이 아니라 하위운동신경원 질환, ④ 신경지배 소실로 위축되며 간혹 큰 섬유는 가성 비대일 뿐이고, ⑤는 SMA 소견이 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-48", "keys": ["25-48"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 Becker muscular dystrophy의 병리학적 특징으로옳은 것은?<\/div>", "o": ["디스트로핀(dystrophin) 단백질이 완전히 결실되어 면역조직화학염색에서 발 현이 관찰되지 않는다.", "근위축은 주로 상위운동신경원의 퇴화로 인해 발생한다.", "근육생검에서 섬유화 없이 일관된 근섬유 위축만 관찰된다.", "디스트로핀 단백질의 발현은 감소하거나 비정상적인 형태로 존재한다.", "임상적으로는 주로 소아기 초기에 빠르게 진행되는 전신 근력저하를 보인다."], "a": 3, "A": "④", "E": "Becker 근디스트로피는 Duchenne과 같은 X-연관 dystrophin 이상이지만 dystrophin이 일부 남아 있어 면역염색이 정상보다 약하게 되고, Western blot에서 양이 줄거나 비정상 크기의 band를 보인다. ① dystrophin이 완전히 없어 염색되지 않는 것은 Duchenne, ② 신경원성이 아니라 근병증(myopathy)이며, ③ 진행하면 근섬유 크기 변이와 섬유화가 나타나고, ⑤ Becker는 늦게 시작해 서서히 진행하며 성인까지 생존한다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-49", "keys": ["25-49"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 다발성 경화증(MS)의 병리학적 특징 및 병인기전에 관한 설명으로 가장 적절한 것은?<\/div>", "o": ["말초신경계의 schwann cell이 주로 손상되어 감각 및 운동기능저하가 나타난 다.", "병변에서는 Th2 세포와 IL-4의 분비가 우세하여 염증반응이 억제된다.", "병변의 초기단계에서 oligodendrocyte의 손실과 macrophage 및 microglia의 활성화가 관찰된다.", "병변은 주로 대뇌피질의 회백질에서 발견되며, 백색질 손상은 드물다.", "MS에서 형성되는 탈수초성 병변은 신경근 접합부의 아세칠콜린수용체 결손과 직접적인 연관이 있다."], "a": 2, "A": "③", "E": "다발성 경화증은 CNS에서 수초를 만드는 oligodendrocyte가 손상되는 자가면역성 탈수초 질환으로, 병변에서 oligodendrocyte와 수초는 줄고 대식세포(foamy macrophage)·미세아교세포·T 림프구와 astrocyte는 늘며 축삭은 보존된다. ① 말초 슈반세포가 아니라 중추 oligodendrocyte, ② CD4+ Th1 세포가 IFN-γ로 대식세포를 활성화해 염증이 진행되고, ④ 주로 뇌실 주위 백질 병변이며, ⑤ 아세틸콜린 수용체 결손은 중증근무력증이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-01", "keys": ["23-01"], "ch": 8, "g": "신경병리", "stem": "<div>22세 남자가 forearm의 deep laceration으로 median nerve의 tansection이 발생하였다면 이후 이 신경에 초래될 변화는?<\/div>", "o": ["Wallerian degeneration", "Fibrinoid necrosis", "Coagulative necrosis", "Segmental demyelination", "Chronic inflammation"], "a": 0, "A": "①", "E": "전완부 깊은 열상으로 정중신경이 완전히 절단되면 절단 부위 원위부의 축삭과 수초가 변성되는 Wallerian degeneration이 일어난다(세포체는 central chromatolysis). ④ segmental demyelination은 축삭은 남고 수초 분절만 소실되는 탈수초 질환 소견이며, 괴사(②③)나 만성 염증(⑤)은 신경 절단의 특징적 변화가 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-02", "keys": ["23-02"], "ch": 8, "g": "신경병리", "stem": "<div>Cerebral cortex가 조직학적으로 많은 neuritic plaques, neurofibrillary tangles, amyloid angiopathy가 관찰된다. 가장 관련 가능성이 높은 것은?<\/div>", "o": ["choreiform movement를 하는 48세 남자", "갑작스런 의식소실을 보이는 30세 여자", "progressive muscular weakness를 보이는 44세 여자", "Down's syndrome이 있는 40세 여자", "시력장애와 neurologic function 장애를 갖는 2세 소년"], "a": 3, "A": "④", "E": "Neuritic(senile) plaque, neurofibrillary tangle, cerebral amyloid angiopathy는 알츠하이머병의 대표 소견이다. Down 증후군은 APP 유전자가 있는 21번 염색체가 3개여서 Aβ가 많이 만들어지므로 40대 무렵부터 알츠하이머 병리가 나타난다. ① 무도병은 헌팅턴병, ③ 진행성 근력 약화는 운동신경원·근육 질환, ⑤ 소아의 시력·신경 기능 장애는 대사성 질환 등을 시사한다.", "B": "26 학습부 15번(검안) · 신경 병리 · 웹 자료(교과서)", "N": "Down 증후군과 알츠하이머병의 연관은 강의 자료에 없어 교과서 지식으로 보충함", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-03", "keys": ["23-03"], "ch": 8, "g": "신경병리", "stem": "<div>3세 여아가 사지를 모두 침범하는 점차적인 weakness로 움직이기가 어려워졌다. 부모의 말에 따르면 특별한 질환을 앓은 적이 없고, 만기 정상분만을 하였다고 한다. 열은 없었으며 laboratory finding상 특이 소견은 없었다. 근생검 소견상 근섬유의 grouped atrophy가 관찰되었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["Myasthenia gravis", "werdnig-hoffman disease", "Duchenne muscular dystrophy", "Polymyositis", "Pompe's disease"], "a": 1, "A": "②", "E": "정상 분만한 소아가 사지 전체의 진행성 근력 약화를 보이고 근생검에서 grouped atrophy가 보이면 선천적 탈신경 위축인 척수성 근위축증(SMA), 그중 가장 흔한 Werdnig-Hoffmann disease를 생각한다. ① 중증근무력증은 NMJ 질환으로 grouped atrophy가 특징이 아니고, ③ Duchenne은 근병증(dystrophin 결핍, 섬유화·가성 비대), ④ 다발근염은 염증성 근병증, ⑤ Pompe병은 당원축적병이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-04", "keys": ["23-04"], "ch": 8, "g": "신경병리", "stem": "<div>Charcot-Marie-Tooth disease의 주된 침범 부위로 알맞은 것은?<\/div>", "o": ["Peripheral sensory nerve", "Basal ganglia", "Substantia nigra", "Cerebral cortex", "Anterior horn of spinal cord"], "a": 0, "A": "①", "E": "Charcot-Marie-Tooth disease(HSMN type 1)는 가장 흔한 유전성 말초신경병증으로, 운동·감각 말초신경의 반복적인 분절성 탈수초와 재수초화로 onion bulb가 생기고 비골근 위축(거꾸로 선 샴페인 병 모양 다리)과 요족을 보인다. 선지 중 말초신경을 침범하는 것은 ①뿐이며, 기저핵·흑질·대뇌피질은 퇴행성 CNS 질환, 척수 전각은 ALS·SMA의 침범 부위다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-11", "keys": ["22-11"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 근육의 disuse atrophy에 대한 설명은?<\/div>", "o": ["type 1 muscle fiber의 angular atrophy", "type 2 muscle fiber의 angular atrophy", "type 1 and 2 muscle fiber의 angular atrophy", "target fiber", "fiber type grouping"], "a": 1, "A": "②", "E": "깁스나 장기 침상 생활로 근육을 쓰지 않으면(disuse atrophy) type 2 근섬유가 가장 먼저, 가장 빠르게 위축되어 작고 각진(angular) 섬유가 된다. target fiber(④)와 fiber type grouping(⑤)은 탈신경과 재신경지배의 증거이고, type 1만(①) 또는 두 type 모두(③)가 위축되는 것이 disuse atrophy의 특징은 아니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-13", "keys": ["22-13"], "ch": 8, "g": "신경병리", "stem": "<div>장년 여성이 눈꺼풀처짐증, 복시, 구음장애가 발생하였다. 증상은 아침에 경하나 저녁으로 갈수록 심해지는 경향이 있었다. 이 환자의 질환과 관련된 특징으로 가장 거리가 먼 것은?<\/div>", "o": ["thymoma", "anti-acetylcholine receptor antibodies", "호흡곤란", "type 1 muscle fiber 내의 작은 막대모양 과립", "cholinesterase inhibitor 투여로 증상 호전"], "a": 3, "A": "④", "E": "아침에 덜하고 저녁에 심해지는 안검하수·복시·구음장애는 중증근무력증으로, AChR에 대한 자가항체가 수용체를 차단·감소시키는 자가면역 질환이다. 흉선종·흉선증식과 관련되고(①), 항AChR 항체가 있으며(②), 호흡근 약화로 호흡곤란이 올 수 있고(③), cholinesterase 억제제(Tensilon 검사)로 증상이 좋아진다(⑤). type 1 근섬유 안의 막대 모양 과립은 nemaline(rod) myopathy 소견이라 거리가 멀다.", "B": "26 학습부 15번(검안) · 신경 병리 · 웹 자료(교과서)", "N": "④의 nemaline myopathy는 강의 자료에 없어 교과서 지식으로 보충함", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-14", "keys": ["22-14"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중 ALS에 대한 설명으로 옳지 않은 것은?<\/div>", "o": ["Papova virus와 연관되어 발생한다.", "Ant. motor horn cell이 감소한다.", "Lat. corticospinal tract 침범한다.", "대칭적 반사과다 및 경직", "대칭적 근위축"], "a": 0, "A": "①", "E": "ALS(루게릭병)는 척수 전각의 하위운동신경원(근위축)과 외측 피질척수로의 상위운동신경원(반사항진·경직)을 함께 침범하는 퇴행성 운동신경원 질환으로, 대칭적 근위축과 반사항진이 나타난다. 일부(5~10%)는 상염색체 우성 유전이고 TDP-43 단백 응집이 핵심 분자 병리이며, papova(JC) virus와는 관련이 없다(JC virus는 PML의 원인).", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-04", "keys": ["20-04"], "ch": 8, "g": "신경병리", "stem": "<div>다음 중에서 퇴행성 신경질환은?<\/div>", "o": ["Lou Gehrig disease", "multiple sclerosis", "Werdnig-Hoffmann disease", "Duchenne muscular dystrophy", "leukodystrophy"], "a": 0, "A": "①", "E": "퇴행성 신경질환은 특정 신경세포군이 원인 없이 선택적·점진적으로 소실되는 회백질 질환으로, 상·하위운동신경원이 소실되는 루게릭병(ALS)이 대표적이다. ② 다발성 경화증은 탈수초 질환(백질 병변), ③ Werdnig-Hoffmann은 선천성 탈신경 위축(SMA), ④ Duchenne은 근병증, ⑤ leukodystrophy는 수초의 선천성 대사 이상이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-50", "keys": ["25-50"], "ch": 8, "g": "신경병리", "t": "s", "stem": "<div>중증 근무력증의 주요 병리 기전으로, 신경근 접합부에서 자가항체가 공격하는 주요 수용체는 무엇인가요?<\/div>", "o": [], "a": -1, "A": "아세틸콜린 수용체 / acetylcholine receptor antibody", "acc": ["아세틸콜린 수용체", "acetylcholine receptor antibody"], "E": "중증 근무력증은 아세틸콜린 수용체에 대한 자가항체가 생성되어 발생합니다. (2) small neuromuscular junction ex) Myasthenia gravis : 정상인에 비해 neruomuscular junction이 작다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "아세틸콜린 수용체 / acetylcholine receptor antibody", "vb": "검안"}, {"id": "25-51", "keys": ["25-51"], "ch": 8, "g": "신경병리", "t": "s", "stem": "<div>루게릭병에서 주로 손상되는 신경세포는 무엇인가?<\/div>", "o": [], "a": -1, "A": "상위운동신경원과 하위운동신경원 / upper motor neuron과 lower motor neuron / 상하운동세포 / 상하운동뉴런", "acc": [], "E": "루게릭병(ALS)에서는 lower motor neuron과 upper motor neuron을 동시에 침범합니다. 위아래 다 적어야 정답입니다. (5) Degenerative disease affecting motor neurons", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "상위운동신경원과 하위운동신경원 / upper motor neuron과 lower motor neuron / 상하운동세포 / 상하운동뉴런", "vb": "검안"}, {"id": "23-05", "keys": ["23-05"], "ch": 8, "g": "신경병리", "t": "s", "stem": "<div>Amyotrophic lateral sclerosis (Lou Gehrig disease)의 대표적인 근생검 소견을 쓰시오.<\/div>", "o": [], "a": -1, "A": "grouped atrophy, small angulated fiber, fiber-type dropout of the type II fiber 중 하나", "acc": [], "E": "본래 후천적 denervation atrophy의 특징 4가지를 적으라는 주관식 문제로 자주 출제되었지만 특정한 질병을 언급하며 근생검 소견을 적으라는 문제는 처음 나왔습니다. 하지만 답은 거의 동일하니 어렵지 않게 풀 수 있을 것입니다. 루게릭 병의 대표적인 근생검 소견은 grouped atrophy, small angulated fiber, fiber-type dropout of the type II fiber입니다. (5) Degenerative disease affecting motor neurons", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "grouped atrophy, small angulated fiber, fiber-type dropout of the type II fiber 중 하나", "vb": "검안"}, {"id": "22-46", "keys": ["22-46"], "ch": 8, "g": "신경병리", "t": "s", "stem": "<div>척추 손상 후 하지근육이 위축되었다. 이때 하지근육생검시 나타나는 조직학적 특징 2개를 쓰시오. (2개 이상 쓰면 만점)<\/div>", "o": [], "a": -1, "A": "Pyknotic nuclear clumps, Target fiber, Grouped atrophy, Small angulated fiber", "acc": [], "E": "임성철교수님 왕마입니다. 후천적 denervation atrophy의 특징 4가지는 다음과 같습니다. - Pyknotic nuclear clumps - Target fiber - Grouped atrophy - Small angulated fiber", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "Pyknotic nuclear clumps, Target fiber, Grouped atrophy, Small angulated fiber", "vb": "검안"}, {"id": "22-47", "keys": ["22-47"], "ch": 8, "g": "신경병리", "t": "s", "stem": "<div>30세 남자분이 수년 전부터 slowly progressive muscle weakness가 진행되고 있다. 최근 보행하기가 힘들어지고, 무거운 물건을 들 수가 없으나 myalgia는 없다. deltoid biopsy상 muscle fiber size variation이 있고 Western blot에서 근육 내 dystrophin의 감소 소견이 보였다. 의심되는 질환은?<\/div>", "o": [], "a": -1, "A": "Becker’s muscular dystrophy", "acc": ["Becker muscular dystrophy", "Becker", "베커"], "E": "성인이 되어서 발병하는 dystrophin이 감소하는 질환은 Becker‘s muscular dystrophy입니다. 서서히 진행하며 근육통은 없는 것이 특징입니다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "Becker’s muscular dystrophy", "vb": "검안"}, {"id": "25-07", "keys": ["25-07"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 왼팔과 다리에서 dysmetria, kinetic tremor가 관찰되었다면 종양이 어디로 전이된 것으로 생각할 수 있나?<\/div>", "o": ["The right frontal lobe", "The cerebellar vermis", "The left frontal lobe", "The right cerebellar hemisphere", "The left cerebellar hemisphere"], "a": 4, "A": "⑤", "E": "왼쪽 팔·다리의 dysmetria(겨냥이상)와 kinetic(의도) tremor는 finger-to-nose 검사 등으로 확인되는 소뇌 협조운동 장애다. 소뇌 경로는 두 번 교차하므로 소뇌반구 병변의 증상은 같은 쪽에 나타나 왼쪽 소뇌반구 전이를 의심한다. 전두엽 병변은 반대쪽 운동마비를, 충부(vermis) 병변은 사지보다 몸통·평형 장애를 주로 일으킨다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-11", "keys": ["25-11", "22-05"], "ch": 9, "g": "운동장애", "stem": "<div>자세와 근긴장도에 영향을 주는 indirect activation pathway 중 lateral에 위치하며 대뇌제거경축과 피질제거경 축 자세 차이에 영향을 주로 미치는 tract는?<\/div>", "o": ["rubrospinal tract", "tectospinal tract", "reticulospinal tract", "vestibulospinal tract", "corticospinal tract"], "a": 0, "A": "①", "E": "Rubrospinal tract는 indirect activation pathway 중 lateral에 위치하며 상지 굽힘근을 담당한다. 적핵보다 위(사이뇌·upper midbrain) 병변에서는 이 경로가 남아 항진되어 상지 굽힘·하지 폄의 피질제거경축(decorticate)이 나타나고, 그 아래(midbrain~상부 pons) 병변에서는 소실되어 사지 모두 폄인 대뇌제거경축(decerebrate)이 된다. 두 자세 차이를 결정하는 것이 rubrospinal tract이다. vestibulospinal·reticulospinal tra
