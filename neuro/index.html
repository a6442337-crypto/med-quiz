 "이전 연도 같은 개념 문항과 비교 10쌍: 거의 그대로 3, 보기·수치·발문만 변경 6, 같은 개념을 다른 증례·형식으로 1"}, {"id": 12, "title": "ⅩⅢ. 뇌종양", "prof": "김종규", "mode": "minor", "why": "이전 연도 같은 개념 문항과 비교 3쌍: 거의 그대로 0, 보기·수치·발문만 변경 3, 같은 개념을 다른 증례·형식으로 0"}, {"id": 13, "title": "ⅩⅣ. 뇌혈관질환 2", "prof": "김재호", "mode": "repeat", "why": "이전 연도 같은 개념 문항과 비교 6쌍: 거의 그대로 6, 보기·수치·발문만 변경 0, 같은 개념을 다른 증례·형식으로 0"}], "extra_pdfs": [{"label": "주관식 기출+예상 PDF", "file": "extra/신경계학_주관식_기출+예상_문제집.pdf"}]}, "q": [{"id": "25-26", "keys": ["25-26"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>11개월 남아가 우측 팔 다리를 까닥거리는 증상으로 병원에 왔다. 경련이 멈춘 후 우측 팔, 다리에 마비가 발생하였고 1시간 이후 회복되는 양상 관찰되었다. 환자의 얼굴 피부 소견 및 뇌 자기 공명 영상은 다음과 같았다. 상기 환자의 진단과 나타날 수 있는 눈의 이상이 알맞게 짝지어진 것은?<\/div>", "o": ["Neurofibromatosis - Lisch 결절", "Tuberous sclerosis – 백내장", "Tuberous sclerosis – 녹내장", "Sturge weber syndrome – Lisch 결절", "Sturge weber syndrome - 녹내장"], "a": 4, "A": "⑤", "E": "얼굴의 port-wine stain, 한쪽 경련 뒤 일시적 편마비(Todd 마비), MRI의 연막 혈관종·편측 뇌위축 → Sturge-Weber 증후군. 세 가지 특징은 얼굴의 port-wine stain, 연막(뇌막) 혈관종, 눈 혈관 이상에 의한 녹내장(소눈증 동반 가능)이므로 안과 추적검사로 녹내장을 확인한다. Lisch 결절은 신경섬유종증 1형, 결절성 경화증은 망막 과오종이 특징이다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/25-26.jpg"], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-27", "keys": ["25-27"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>7개월 여아가 깜짝 놀라는 듯한 증상을 주소로 내원하였다. 주로 잠든 직후에 관찰되었으며, 여러 차례 반복되는 양상을 보였다. 이 환자의 뇌파와 피부 소견은 다음과 같다. 이 환자에게서 가장 먼저 나타날 수 있는 동반 질환은?<\/div>", "o": ["발작 (seizure)", "심장의 횡문근종 (rhabdomyoma)", "얼굴의 혈관섬유종 (facial angiofibroma)", "신장의 혈관근육지방종 (angiomyolipoma)", "폐의 림프혈관평활근종증 (pulmonary lymphangioleiomyomatosis)"], "a": 1, "A": "②", "E": "잠든 직후 반복되는 깜짝 놀라는 듯한 발작(영아연축)과 뇌파의 hypsarrhythmia, 피부의 탈색반 → 결절성 경화증. 결절성 경화증의 소견 중 심장 횡문근종은 태아기부터 보여 가장 먼저 나타나는 소견이다(태아 심장 횡문근종 + 출생 후 탈색반이면 결절성 경화증). 얼굴 혈관섬유종은 학령기, 신장 혈관근육지방종·폐 림프혈관평활근종증은 더 늦게 나타난다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/25-27.jpg"], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-32", "keys": ["25-32"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>10세 남아가 경련으로 병원에 왔다. 1주일 전 잠이 들고 30분후 우측 얼굴과 입 주변이 굳어지고 움찔거리는 양상의 경련을 했었다고 하며, 1일전 밤에도 같은 시간대에 비슷한 양상의 경련이 있었다. 시행한 뇌파검사는 다음과 같았다. 상기 환아 에서 가장 먼저 사용해 볼 수 있는 항경련제는?<\/div>", "o": ["발프로산", "페노바비탈", "클로나제팜", "에토숙시미드", "옥시카르바제핀"], "a": 4, "A": "⑤", "E": "26년 강의(소아 경련성 질환): 학령기 아이가 잠든 뒤 한쪽 얼굴·입 주위가 굳고 움찔거리는 부분발작(전신화되기도 함), 뇌파에서 수면 중 중심측두부(centrotemporal) 극파 → 중심측두 극파를 보이는 양성 소아 뇌전증(BCECTS, benign rolandic epilepsy). 3~13세에 생기고 사춘기 이후 저절로 소실되며 예후가 좋다. 부분발작에 잘 듣고 부작용이 적은 oxcarbazepine(⑤)이나 carbamazepine을 쓴다. ethosuximide는 소아기 소발작(CAE) 전용 약이다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/25-32.jpg"], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-33", "keys": ["25-33"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>4개월 여아가 경련을 했다가 병원에 왔다. 39도 고열과 함께좌측 팔 다리를 까닥거리는 양상으로 5분간 경련을 했다고 한다. 과거에 경련이나 신경학적 이상소견은 없었으며, 정상 발달 소견을 보였다. 가족력에서 2살 위의 오빠가 열성경련이2차례 있었다고 한다. 뇌척수액 검사 및 뇌파검사는 정상이었다. 이 환아의 병력 중 뇌전증 이행 확률을 높이는 소견은?<\/div>", "o": ["경련 발생 나이", "경련 지속시간", "경련 형태", "발달 상태", "열성 경련의 가족력"], "a": 2, "A": "③", "E": "26년 강의(열성 경련): 열성 경련에서 뇌전증으로 이행할 위험을 높이는 인자는 ① 복합 열성 경련(complex FS: 24시간 내 2회 이상, 부분발작, 15분 초과, 경련 후 신경학적 결손), ② 뇌전증 가족력, ③ 발달 지연, ④ 기저 신경질환이다. 이 환아는 한쪽 팔다리만 까딱거린 부분발작이므로 '경련 형태'(③)가 해당한다. 5분은 15분 기준에 미치지 않고, 가족력은 '열성 경련'이 아니라 '뇌전증' 가족력이어야 하며, 발달은 정상이다. simple FS의 뇌전증 이행률은 약 1%, complex FS는 9% 이상.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-23", "keys": ["23-23"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>8세 남아가 경련으로 병원에 왔다. 발달은 정상이었고 내원당시 39.1도의 열이 있었다. 편도 주위 발적과 삼출물이 있었다. 추후 뇌전증 가능성 가장 적은 것은?<\/div>", "o": ["4시간 전 같은 양상 경련", "20분 동안 전신강직간대 경련", "부모의 열성경련 가족력", "경련 후 오른팔 마비 1시간 지속", "왼쪽 얼굴과 팔다리 떨리는 경련"], "a": 2, "A": "③", "E": "26년 강의(열성 경련): 복합 열성 경련(complex FS)의 조건은 24시간 내 2회 이상(①), 15분 초과(②), 경련 후 신경학적 결손(④, Todd 마비), 부분발작(⑤)이며 하나라도 있으면 complex로 보고 뇌전증 이행 위험이 높다. 이행 위험을 높이는 가족력은 '뇌전증' 가족력이고, 부모의 '열성 경련' 가족력(③)은 해당하지 않으므로 뇌전증 가능성이 가장 적다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-24", "keys": ["23-24"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>12세 남아가 경련을 했다. 방문 당시 의식 상태는 양호하였고 밤에 잠을 자던 중 우측 얼굴과 입주변이 움찔거리더니 전신이 굳고 뻣뻣해지는 양상으로 3분간 경련이 있었다고 한다. 평가 위해 시행한 뇌 자기공명검사에서는 이상 없었고 시행한 뇌파검사는 다음과 같았다. 가장 먼저 사용해볼 수 있는 항뇌전증약은?<\/div>", "o": ["Diazepam", "Vigabatrin", "Ethosuximide", "Valproic acid", "Oxcarbazepine"], "a": 4, "A": "⑤", "E": "26년 강의(소아 경련성 질환): 학령기 아이가 밤에 잠든 뒤 한쪽 얼굴·입 주위가 움찔거리다 전신으로 퍼지는 발작, MRI 정상, 뇌파에서 중심측두부 극파 → 양성 소아 뇌전증(BCECTS). 치료는 oxcarbazepine(⑤) 또는 carbamazepine. vigabatrin은 결절성 경화증 동반 영아연축, ethosuximide는 소아기 소발작에 쓴다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/23-24.jpg"], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-17", "keys": ["22-17"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>9개월 여아가 자주 움찔거린다고 병원에 방문 하였다. 보호자가 가져온 비디오에서 환자는 누워 놀고 있는 상태에서 양측의 팔다리를 놀란 듯이 갑자기 뻗는 모습이 5-10초 간격으로 10번 이상 반복 되는 모습을 보였다. 주산기에 특별한 문제는 없었고, 4개월까지 목가누기, 뒤집기도 잘 하였으나 이후에 혼자 앉거나 기지는 못한다고 하였다. 뇌파는 다음과 같았다. 치료는?<\/div>", "o": ["oxcarbazepine", "prednisolone", "valproic acid", "ethosuximide", "clonazepam"], "a": 1, "A": "②", "E": "26년 강의(영아연축, West 증후군): 3~9개월에 시작해 팔다리를 갑자기 굽히거나 뻗는 연축이 5~10초 간격으로 묶음(cluster)으로 반복되고, 발달이 멈추거나 퇴행하며, 뇌파는 고진폭 부정뇌파(hypsarrhythmia)다. 일반 항경련제와 달리 ACTH·prednisolone(국내는 ACTH가 없어 prednisolone, ②)과 vigabatrin을 먼저 쓴다. 결절성 경화증이 있으면 vigabatrin → prednisolone, 없으면 prednisolone → vigabatrin 순서다. valproic acid·clonazepam·topiramate는 이들에 반응이 없을 때 쓴다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/22-17.jpg"], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-18", "keys": ["22-18"], "ch": 0, "g": "소아 경련성 질환", "stem": "<div>6세 남아가 자주 멍해지는 모습을 보여 병원에 방문하였다. 하루에도 자주 멍해지며 진료실에서 과호흡 2분간 유도할 때 호흡 멈추고 7초간 멍해지는 모습을 보이다가 이내 과호흡을 지속했다. 시행한 뇌파검사는 다음과 같았다. 진단은?<\/div>", "o": ["myoclonic atonic epilepsy", "landau-kleffener syndrome", "juvenile myoclonic epilepsy", "childhood absence epilepsy", "benign rolandic epilepsy"], "a": 3, "A": "④", "E": "26년 강의(소아기 소발작 증후군, CAE): 6~7세에 시작해 하루에도 여러 번 갑자기 멍해졌다가 곧 회복하는 소발작(absence seizure)이 과호흡으로 유발되고, 뇌파에서 3 Hz 극서파 복합(3 Hz spike-wave complex)이 보인다 → childhood absence epilepsy(④). 사춘기 무렵 사라지는 경우가 많고, 치료는 ethosuximide(CAE에만 쓰는 약)와 valproic acid다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/22-18.jpg"], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-39", "keys": ["25-39"], "ch": 0, "g": "소아 경련성 질환", "t": "s", "stem": "<div>6세 남아가 자주 멍해지는 모습이 관찰되어 병원에 방문하였다. 하루에도 수차례 멍해지는 모습이 관찰된다고 하였고, 진료실에서 과호흡 2분간 유도할 때 호흡을 멈추고 7초간 멍해지는 모습을 보이다가 이내 과호흡을 지속하였다. 시행한 뇌파검사는 다음과 같았다. 진단은? (약자 인정하지 않음)<\/div>", "o": [], "a": -1, "A": "Childhood absence epilepsy(소아기 소발작 증후군)", "acc": ["소아기 소발작 증후군", "Childhood absence epilepsy"], "E": "6세 남아가 하루에도 수차례 멍해지는 모습을 보이며, 과호흡을 유도할 때 호흡을 멈추고 멍해지는 모습을 보이다가 이내 과호흡을 지속하는 증상을 보입니다. 이는 CAE의 전형적인 증상으로 CAE의 특징적인 뇌파는 3Hz spike wave complex입니다. 치료는 Ethosuximide로 유일하게 CAE에서만 사용되는 항경련제입니다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/s25-39.jpg"], "v": false, "y": [2025], "ok": true, "ra": "Childhood absence epilepsy(소아기 소발작 증후군)", "vb": "검안"}, {"id": "23-26-s", "keys": ["23-26"], "ch": 0, "g": "소아 경련성 질환", "t": "s", "stem": "<div>14세 여자가 아침 등굣길에 5분동안 전신강직간대발작을 호소하여 내원했다. 지능과 발달은 정상이다. 최근 시험기간으로 잠을 2~3시간밖에 못잤으며 평소 밥을 먹거나 머리를 말릴 때 물건을 떨어뜨리곤 하였다. 신경학적 검사에 이상은 없었다. 뇌파검사 소견이다. 진단은?<\/div>", "o": [], "a": -1, "A": "Juvenile Myoclonic Epilepsy", "acc": ["Juvenile Myoclonic Epilepsy"], "E": "14세 여자, 청소년기이고 지능, 발달 정상입니다. 수면 박탈, 물건을 떨어뜨리는 양상이 있습니다. 아침에 일어났을 때 상지의 myoclonic seizure가 있어 물건을 잘 떨어뜨리는 것이 JME의 특징입니다. 따라서 정답은 청소년기에 가장 흔한 Juvenile Myoclonic Epilepsy입니다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/s23-26.jpg"], "v": false, "y": [2023], "ok": true, "ra": "Juvenile Myoclonic Epilepsy", "vb": "검안"}, {"id": "22-49", "keys": ["22-49"], "ch": 0, "g": "소아 경련성 질환", "t": "s", "stem": "<div>4세 남아가 경련으로 병원에 방문하였다. 6개월 전부터 자다가 온몸이 굳어지는 모습을 보이거나, 놀던 중 고개를 떨구며 머리를 다치거나, 갑자기 쓰러지는 경련을 한다고 했다. 9개월에 영아 연축 진단을 받아 항경련제 치료하였다고 하며, 이후 증상이 호전되어 약 중단하였으며, 이후로 발달 지연 있어 발달 치료받고 있다고 하였다. 시행한 뇌파의 소견은 다음과 같았다. 진단은?<\/div>", "o": [], "a": -1, "A": "Lennox-Gastaut syndrome", "acc": ["Lennox-Gastaut syndrome"], "E": "영아 연축의 과거력, 발달 지연, EEG에서 관찰되는 2Hz 정도의 slow spike and wave complex를 통해 Lennox-Gastaut syndrome임을 알 수 있습니다. 영아 연축 환자의 2/3는 Lennox-Gastaut syndrome으로 진행됩니다.", "B": "26 학습부 08번(검안) · 소아 경련성 질환", "N": "", "img": ["figs/s22-49.jpg"], "v": false, "y": [2022], "ok": true, "ra": "Lennox-Gastaut syndrome", "vb": "검안"}, {"id": "21-21", "keys": ["21-21"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>3세 남아가 두통으로 응급실에 왔다. 3일 전부터 열이 나고 목이 아픈 증상에 대한 치료를 받았으나 호전되지 않았다. 1일 전부터 심한 두통이 발생하였으며 토하기 시작하였다. 체온 39.4°c, 경부경직과 커니그(Kernig) 징후 양성이었다. 검사 결과는 다음과 같았다. 가장 가능성이 있는 진단은?<\/div><div>혈액: 혈색소 13.4g/dL, 백혈구 17,500/mm3(중성구 80%, 림프구 20%), 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL<\/div><div>뇌척수액: 압력 240mmH20, 단백질 212mg/dL, 포도당 25mg/dL 백혈구 1,450/mm3 (중성구 90%, 림프구 10%)<\/div>", "o": ["결핵 수막염", "세균 수막염", "바이러스 수막염", "뇌출혈", "열성경련"], "a": 1, "A": "②", "E": "발열·두통·구토, 경부강직·Kernig 징후 양성(뇌막자극징후), 뇌척수액 압력 상승(240), 단백 증가(212), 포도당 감소(25), 백혈구 1,450/mm³의 다핵구(중성구) 우세 → 세균 수막염. 정상 뇌척수액은 백혈구 5개 이하·림프구 우세, 단백 40~50 미만, 포도당 50 이상(혈당의 75% 이상)이다. 바이러스 수막염은 림프구 우세·포도당 정상, 결핵 수막염은 림프구 우세·포도당 감소가 아급성으로 나타난다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-29", "keys": ["25-29", "21-22"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>4개월 남아가 목을 가누지 못한다고 병원에 왔다. 신생아기에 호흡곤란과 수유장애가 있었다고 한다. 진찰실에서 다음과 같은 자세로 누워 있었고, 혀에서 연축이 관찰되었다. 신체검진에서 심부건 반사는 관찰되지 않았으며 근전도 및 혈청 크레아틴키나아제 (CK)는 정상이었다. 상기 환자의 질환에서 병변의 위치는?<\/div>", "o": ["근육(Muscle)", "말초신경(Peripheral nerve)", "피라미드로(pyramidal tract)", "신경근이음부(neuromuscular junction)", "척수앞뿔운동신경세포(Motor neurons of anterior horn)"], "a": 4, "A": "⑤", "E": "신생아기부터 호흡곤란·수유장애가 있고 목을 못 가누며, 개구리 다리 자세(frog-leg posture), 혀 섬유다발수축, 심부건반사 소실에 CK·신경전도가 정상이면 척수성 근위축증(SMA) 1형(Werdnig-Hoffmann)이다. SMN1 유전자 결실로 척수 앞뿔 운동신경세포가 퇴행한다. 근육병이면 CK가 오르고, 말초신경병이면 신경전도가 떨어지며, 피라미드로 병변이면 DTR이 항진되고, 중증근무력증(NMJ)은 피로에 따른 변동이 특징이다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ⑤, 2021 ⇒ ④", "img": ["figs/25-29.jpg"], "v": false, "y": [2021, 2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-30", "keys": ["25-30"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>13세 여아가 2일전부터 아침부터 걷지 않으려는 모습을 보여 병원을 방문하였다. 2주전에 설사 증상이 있었다고 하며, 병원 방문 당시 양측 다리 모두 근력이 약화 되었다. 신체 검진상 양측 다리의 심부건 반사가 소실되어 있었다. 다음날부터 상지 의 마비도 진행하였고, 음식을 삼킬 때 기침 증상이 발생하였다. 신경전도 검사에서 운동신경전도는 정상치의 25%로 감소하였다. 뇌척수액 검사 소견은 다음과 같다. 상기 환자의 질환에서 병변의 위치는? 백혈구 4/mm3, 적혈구 0/mm3, 포도당 70mg/dL(혈청치의 70%), 단백질 105mg/dL(참고치, 20~45mg/dL)<\/div>", "o": ["근육(Muscle)", "말초신경(Peripheral nerve)", "피라미드로(pyramidal tract)", "신경근이음부(neuromuscular junction)", "척수앞뿔운동신경세포(Motor neurons of anterior horn)"], "a": 1, "A": "②", "E": "2주 전 설사(선행 감염) 뒤 양측 하지에서 상지로 올라가는 대칭성 마비, 심부건반사 소실, 연하곤란, 운동신경전도 저하와 CSF 단백-세포 해리(WBC 정상, 단백 증가)는 길랑-바레 증후군(AIDP)이다. 자가항체가 말초신경 수초를 공격하는 말초신경 질환이므로 병변은 말초신경이다. 근육병은 CK 상승, 앞뿔세포(SMA)는 신경전도 정상, 피라미드로 병변은 반사항진, NMJ 질환은 일중 변동을 보인다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-31", "keys": ["25-31"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>11세 남아가 1개월 전부터 다리에 힘이 없어진다고 외래를 방문하였다. 아침에는 정상이었으나 오후가 되면 증상이 심해졌다. 눈이 저절로 감기고 1분 동안 위를 바라보게 하니 사물이두 개로 보인다고 하였고, 누운 자세로 머리를 들게 하니 수초를 버티지 못하였다. 주먹을 쥐었다 폈다 반복시키자 손에 힘이 쉽게 빠졌다. 상기 질환의 치료 중 기전이 다른 하나는?<\/div>", "o": ["IVIG", "Steroid", "Azathioprine", "Pyridostgmine", "Plasmapheresis"], "a": 3, "A": "④", "E": "오후에 심해지는 근력 약화, 안검하수, 지속 상방주시 시 복시, 반복 운동 시 빠른 피로는 중증근무력증이다. Pyridostigmine은 cholinesterase를 억제해 ACh 농도를 높이는 증상 치료제(1차 약)로, 기전이 다르다. IVIG·혈장교환술은 AChR 항체를 제거·중화하고, steroid·azathioprine은 면역을 억제하는 면역 조절 치료다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-41", "keys": ["23-41"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>5세 남아가 2일전부터 아침부터 걷지 않으려는 모습을 보여 병원을 방문하였다. 2주전에 설사 증상이 있었다고 하며, 병원 방문 당시 양측 다리 모두 근력이 약화 되었다. 신체 검진상 양측 다리의 심부건 반사가 소실되어 있었다. 다음날부터 상지 의 마비도 진행하였고, 음식을 삼킬 때 기침 증상이 발생하였다. 신경전도 검사에서 운동신경전도는 정상치의 25%로 감소하였다. 뇌척수액 검사 소견은 다음과 같다. 치료는? 백혈구 4/mm3, 적혈구 0/mm3, 포도당 70mg/dL(혈청치의 70%), 단백질 105mg/dL(참고치, 20~45mg/dL)<\/div>", "o": ["만니톨", "항생제", "항바이러스제", "정맥 내 스테로이드", "정맥 내 면역글로불린"], "a": 4, "A": "⑤", "E": "설사 뒤 하지에서 상지로 진행하는 대칭성 마비, DTR 소실, 연하곤란, 운동신경전도 저하와 CSF 단백-세포 해리는 길랑-바레 증후군이다. 호흡근 마비가 올 수 있어 의심되면 입원시키고, 빠르게 진행하면 IVIG(400 mg/kg × 5일)로 면역반응을 억제한다(소아는 혈장교환술과 효과가 비슷해 IVIG를 주로 씀). 스테로이드는 GBS에서 효과가 없고, 만니톨·항생제·항바이러스제는 적응증이 아니다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-15", "keys": ["22-15"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음의 영아기에 나타나는 반사 중 가장 늦게 나타나면서 영아의 운동 발달 중 대칭성을 확인해 볼 수 있는 반사는?<\/div>", "o": ["Rooting reflex", "Landau reflex", "Stepping reflex", "Sucking reflex", "Parachute reflex"], "a": 4, "A": "⑤", "E": "교수님께서 강조하신 신생아반사문제입니다. 대부분의 반사는 출생 시부터 존재하고, Landau reflex는 3-4개월 경에 나타나지만, Parachute reflex는 9개월 이후에 나타나 평생 지속하는 반사입니다. 아래로 보도록 공중에 들면 팔을 아래로 뻗는 반사이고, 대칭적인지 확인할 수 있습니다. 2026 강의 01(검안): 낙하산 반사는 9개월 이후에 나타나 평생 지속되며 대칭인지 확인하는 반사, Landau 반사는 3~4개월에 나타나 1~2년에 소실.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-16", "keys": ["22-16"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>5세 남아가 발열 및 두통이 있어 응급실에 방문하였다. 2일 전부터 발열이 있었고, 1일 전 부터는 잘 먹지 않으려는 모습이 보이면서 구토 2차례 있었다고 하였다. 진찰 시 경부 강직(neck stiffness) 및 커니그(Kernig) 징후에서 양성 보였다. 이후 점차 혼수 상태로 변화 되었다. 다음 환아에서 나타날 수 있는 증상 및 혈액 검사에서 바로 요추천자를 시행함에 있어 금기에 해당하지 않는 것은?<\/div>", "o": ["백혈구 수 30 x 10^3 /uL", "혈소판 수 15 x 10^3 /uL", "동공 반사의 좌우 차이", "겉질 제거 경직 자세", "지속적 흡입 호흡"], "a": 0, "A": "①", "E": "경부강직·Kernig 징후 양성, 발열·구토 후 의식 저하 → 세균성 수막염. 요추천자의 금기는 의식 저하를 동반해 뇌압 상승이 의심되는 경우(동공 반사의 좌우 차이, 겉질 제거 경직 자세, 지속적 흡입 호흡 등 뇌탈출 징후), 즉각적 소생술이 필요한 심폐 기능 악화(저혈압·쇼크), 천자 부위 피부 감염이며, 심한 혈소판 감소(출혈 경향)도 금기다. 말초 백혈구 증가는 금기가 아니다. 금기일 때는 천자 없이 경험적 항생제를 즉시 투여한다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "21-24", "keys": ["21-24"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>5세 남아가 발열 및 두통이 있어 응급실에 방문하였다. 2일 전부터 발열이 있었고, 1일 전 부터는 잘 먹지 않으려는 모습이 보이면서 구토 2차례 있었다고 하였다. 진찰 시 경부강직(neck stiffness) 및 커니그(Kernig) 징후에서 양성 보였다. 활력 징후 및 검사 결과는 다음과 같았다. 이 환자에서 가장 먼저 필요한 치료는?<\/div><div>활력 징후 : 혈압 90/50 mmHg, 맥박 130 회/분, 체온 39.5도<\/div><div>혈액 : 혈색소 10.4g/dL, 백혈구 19,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL,<\/div><div>뇌척수액 : 압력 240mmH2O, 단백질 240mg/dL, 포도당 25mg/dL 백혈구 2,050/mm3, 중성구 90%, 림프구 10%<\/div>", "o": ["만니톨", "적혈구 수혈", "항생제", "항바이러스제", "정맥 내 면역글로불린"], "a": 2, "A": "③", "E": "발열·두통·구토, 경부강직·Kernig 징후 양성, 뇌척수액 압력 상승·단백 증가·포도당 감소·중성구 우세 백혈구 증가 → 세균성 수막염. 세균성 수막염이 의심되면 경험적 항생제를 즉시 투여하는 것이 가장 먼저이며, 5세(신생아 이후)이므로 3세대 cephalosporin + vancomycin을 쓴다. 만니톨은 뇌압 상승 시 보조 치료이고, 항바이러스제·면역글로불린은 해당하지 않는다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "③", "vb": "검안"}, {"id": "21-38", "keys": ["21-38"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>3세 남아가 계단에 오르기 힘들어하는 모습을 보여 병원에 왔다. 환자는 14개월경 혼자 걷기 시작했고 20개월에 혼자 계단에 올라갔으나 최근 계단에 잘 오르려 하지 않았다. 환자의 장딴지는 단단했고, 앉혔다 일으킬 때 다음과 같은 소견을 보였다. 혈액 검사 소견은 다음과 같았다. 환자의 진단을 위해 가장 먼저 시행해야 할 검사는? 아스파르데이트 아미노전달효소 (AST) 300U/L 알라닌아미노전달효소(ALT) 120U/L 크레아틴키나아제(CK) 20,000U/U (참고치: 5~130) 젖산탈수소효소(LDH) 700U/U (참고치: 170~180)<\/div>", "o": ["하지 자기 공명 검사", "뇌척수액 검사", "신경전도 검사", "유전자 검사", "근 조직 검사"], "a": 3, "A": "④", "E": "걷기 시작한 뒤 계단을 잘 못 오르고, 장딴지 가성비대, Gower sign, CK 고도 상승(AST·ALT·LDH 동반 상승)은 Duchenne 근디스트로피(DMD)를 시사한다. 진단은 요즘 유전자 검사(MLPA로 DMD 유전자 결실·중복, 없으면 염기서열 분석)를 가장 먼저 하며, 근생검(dystrophin 면역염색)은 과거 방식으로 생략하기도 한다. 뇌척수액·신경전도·하지 MRI는 1차 확진 검사가 아니다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "", "img": ["figs/21-38.jpg"], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-15", "keys": ["20-15"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>마마, 빠빠 외에 한 단어를 할 수 있는 나이에 보일 수 있는 원시반사는?<\/div>", "o": ["rooting reflex", "sucking reflex", "stepping reflex", "parachute reflex", "grasp reflex"], "a": 3, "A": "④", "E": "26년 강의(소아신경계 진단, 원시반사): '마마·빠빠 외에 한 단어'를 말하는 시기는 생후 8~9개월 이후다. 대부분의 원시반사(rooting·sucking·Moro·grasp·tonic neck 등)는 출생 때 있다가 3개월 안팎에 사라지고, stepping 반사도 1~2개월에 사라진다. 낙하산 반사(parachute reflex)는 8~9개월에 나타나 평생 지속되므로 이 시기에 보이는 반사는 ④다.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-20", "keys": ["20-20"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 신생아에서 보일 수 있는 원시 반사아디. 이 중 혼자 걷기 시작하는 시기까지도 남아있는 반사는?<\/div>", "o": ["rooting reflex", "landau reflex", "stepping reflex", "sucking reflex", "tonic neck reflex"], "a": 1, "A": "②", "E": "26년 강의(소아신경계 진단, 원시반사): 혼자 걷기 시작하는 시기(돌 무렵)까지 남아 있는 반사는 Landau 반사다. Landau 반사는 생후 3~4개월에 나타나 1~2세에 사라진다(가장 늦게 사라지는 원시반사). rooting·sucking은 3개월, stepping은 1~2개월, tonic neck은 3~4개월에 소실된다. 낙하산 반사는 9개월에 나타나 평생 지속된다는 점과 함께 구분해 둔다.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-24", "keys": ["25-24", "21-23"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>8세 여아가 3개월 전부터 박동성 두통이 있어 병원에 방문하였다. 다음 중 신경계 영상 진단이 필요할 것으로 생각되는 경우는?<\/div>", "o": ["3개월 전부터 발생한 두통", "측두 주변부 통증", "빛 자극에 의해서 악화됨", "두통 시 우측 손힘 빠짐", "편두통의 가족력"], "a": 3, "A": "④", "E": "소아 두통에서 신경계 영상 검사가 필요한 경우: 국소 신경학적 징후(편측 위약 등)를 동반한 두통, 수면 중 깨거나 깨어나자마자 생기는 두통 등 원발 두통과 다른 양상, 점점 심해지는 두통 등. 따라서 두통 때 손 힘이 빠지는 ④가 정답이다. 3개월간의 박동성 두통, 빛 자극으로 악화, 편두통 가족력은 편두통에 합당한 소견이다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2021, 2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-21", "keys": ["23-21"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 신경 질환의 진단 특수 검사로서 뇌척수액 검사에 대한 설명이다. 다음 중 틀린 것은?<\/div>", "o": ["호흡장애의 위험이 있는 소아에서는 요추천자를 앉은 자세에서 시행하기도 한다.", "요추천자부위에 피부 세균 감염 있는 경우 금기이다.", "뇌척수액 정상 세포 수는 림프구의 경우 5/ul이지만 신생아에서는 15/ul까지 정상이다.", "뇌척수액 단백질 정상치는 신생아의 경우 120mg/dL까지 정상이다.", "뇌척수액 항산성 염색으로 세균성 수막염을, india ink 염색으로 cryptococcus 수막염 진단에 필수적이다."], "a": 4, "A": "⑤", "E": "26년 강의(소아신경계 진단): 뇌척수액 미생물 검사에서 Gram 염색은 세균, 항산성(AFB) 염색은 결핵균, India ink는 cryptococcus를 찾는 검사다. 항산성 염색으로 '세균성 수막염'을 진단한다는 ⑤가 틀렸다. ① 신생아·영아는 옆으로 누우면 구토·호흡마비 위험이 있어 앉아서 시행하기도 한다. ② 천자 부위 피부 감염은 금기(그 밖에 두개내압 상승·뇌탈출 임박 징후, 혈소판 20,000 이하). ③ 림프구 성인 5/㎕, 신생아 15/㎕까지 정상. ④ 신생아 단백 120 mg/dL 미만까지 정상.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-19", "keys": ["20-19"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 소아의 뇌척수액 검사에 대한 설명이다. 이 중 잘못된 것은?<\/div>", "o": ["호흡장애의 위험이 있는 소아에서는 호흡마비 위험 때문에 앉은 자세에서 시행하기도 한다.", "두개 내압의 상승, 심한 혈소판 감소증이 있을 때는 검사를 시행하지 않는다.", "뇌척수액에서 적혈구가 보이면 원심분리를 확인하여, 상층액이 밝으면 거미막하 출혈을 의미한다.", "심한 혼수상태에서 비정상 호흡을 보이면, 수막염이 의심되더라도 항생제 치료를 먼저 시행하기도 한다.", "뇌척수액의 당은 60%가 정상이나, 이보다 낮으면 세균 수막염이나 결핵 수막염을 의심해 볼 수 있다."], "a": 2, "A": "③", "E": "26년 강의(소아신경계 진단): 뇌척수액에 적혈구가 보이면 원심분리 후 상층액으로 천자 중 외상(traumatic tap)과 거미막하출혈을 구분한다. 상층액이 맑거나 검사 중 점점 맑아지면 천자 중 외상, 황색변조(xanthochromia)면 거미막하출혈이므로 ③이 틀렸다. ① 호흡마비 위험이 있으면 앉아서 시행하기도 한다. ② 두개내압 상승·심한 혈소판 감소증(20,000 이하)은 금기. ④ 의식 저하·뇌압 상승이 의심되면 천자 없이 경험적 항생제를 먼저 투여한다. ⑤ 뇌척수액 당은 혈당의 약 60%가 정상이며, 낮으면 세균·결핵·진균 수막염 등을 의심한다.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "③", "vb": "검안"}, {"id": "20-22", "keys": ["20-22"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>12세 여아가 1년 전부터 빛에 의해 악화되는 박동성 두통이 반복되어 외래를 방문하였다. 다음 중 영상학적 검사가 필요한 경우는?<\/div>", "o": ["낮의 두통", "두통 때문에 자다가 깸", "빛 자극에 의해 악화", "1년 전부터 두통", "한 달에 5번"], "a": 1, "A": "②", "E": "소아 두통에서 영상 검사가 필요한 경고 징후(red flag)로 두통 때문에 자다가 깨거나 깨어나자마자 생기는 두통이 있다. 낮의 두통, 빛 자극으로 악화, 1년간 반복, 월 5회 정도의 박동성 두통은 편두통에 합당하다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "②", "vb": "검안"}, {"id": "20-23", "keys": ["20-23"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>9세 여아가 머리 한쪽에 반복되는 두통이 있어 외래를 방문하였다. 두통은 박동성으로 휴식 후 소실되었다. 재발이 잦을 때 예방적으로 투여할 수 있는 약물은?<\/div>", "o": ["Sumatriptan", "Ketorolac", "Propranolol", "Acetaminophen", "Ibuprofen"], "a": 2, "A": "③", "E": "반복되는 편측 박동성 두통이 휴식 후 소실 → 편두통. 편두통 치료는 급성기 치료(acetaminophen·ibuprofen 등 진통제, sumatriptan 등 triptan)와 예방 치료로 나뉜다. 예방 치료는 진통제에 반응이 없거나 일상생활(등교 등)에 지장이 큰 경우에 하며, amitriptyline·propranolol·flunarizine 등을 쓴다. 나머지 선지는 급성기 약물이다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-22", "keys": ["25-22"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 신생아에서 관찰되는 신경학적 검사 및 뇌척수액에 대한 설명이다. 다음 중 정상 소견이 아닌 것은?<\/div>", "o": ["뇌척수액의 단백질이 100mg/㎗ 이다.", "뇌척수액의 세포수가 림프구 10/㎕ 이다.", "바빈스키 검사에서 양성이다.", "앉은 자세에서 머리부터 떨어뜨리려 하니 낙하산처럼 팔을 쫙 펼친다.", "누운 자세에서 머리를 오른쪽으로 돌리니, 오른쪽 팔과 다리를 펼친다."], "a": 3, "A": "④", "E": "26년 강의(소아신경계 진단): 신생아(출생~1개월) 정상 소견을 묻는 문항이다. 신생아 뇌척수액 단백은 120 mg/dL 미만까지 정상(3개월이면 성인 수준), 림프구는 15/㎕까지 정상(성인 5 이하)이므로 ①·②는 정상이다. Babinski 징후는 생후 1~2개월까지 양성일 수 있고(③), 고개를 돌린 쪽 팔다리를 펴는 tonic neck reflex(⑤)도 신생아 원시반사다. 반면 낙하산 반사(parachute reflex)는 생후 8~9개월에 나타나 평생 지속되므로 신생아에서는 볼 수 없다(④).", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-23", "keys": ["25-23"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음은 중추신경계의 발달 과정에서 이상이 발생할 때 생길 수 있는 질환이다. 이 뇌 기형 중 가장 이른 시기에서 결함이 발생하는 질환은?<\/div>", "o": ["뇌갈림증", "반큰뇌증", "통앞뇌증", "다소뇌회증", "신경세포이소증"], "a": 2, "A": "③", "E": "26년 강의(중추신경계 발달 이상): 발달 단계별 기형 — ① 신경관 형성기(~4주): 이분척추·수막류·척수수막류·뇌류, ② 신경관 분절기(~8주): 통앞뇌증(holoprosencephaly), ③ 대뇌 겉질 발달기: 증식 이상(작은머리증·큰뇌증·반큰뇌증), 이주 이상(뇌이랑없음증·신경세포이소증), 조직화 이상(다소뇌회증·뇌갈림증). 선지 중 가장 이른 시기의 결함은 분절기 이상인 통앞뇌증(③)이다.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-25", "keys": ["25-25"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>23일 남아가 3일 전부터 발생한 발열로 병원에 왔다. 2일전부터 수유가 절반 이하로 줄었고 쳐짐이 지속되었고 1일 전부터 분출성 구토 있다고 하였다. 활력징후에서 혈압 70/40mmHg, 맥박 150 회/분, 체온 39.5 ℃ 관찰되었고, 신체 검진 상 앞 숫구멍이 팽창 되었고, 자극에도 반응 보이지 않고 계속 자려고만 하였다. 혈액 검사 및 뇌척수액 검사는 다음과 같았다. 가장 적절한 치료는?<\/div><div>혈액: 혈색소 10.4g/dL, 백혈구 23,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL, C 반응성 단백 24mg/dL (참고치0~ 0.5)<\/div><div>뇌척수액: 압력 220mmH20, 단백질 180mg/dL, 포도당 20mg/dL 백혈구 5,050/mm3, 중성구 95%, 림프구 5%<\/div>", "o": ["Ampicillin + Cefotaxime", "Ampicilin + Ceftazidime", "Vancomycin + Gentamycin", "Vancomycin + Cefotaxime", "Vancomycin + Ceftazidime"], "a": 0, "A": "①", "E": "발열·수유 감소·처짐·분출성 구토, 뇌척수액 압력 상승·단백 증가·포도당 감소·중성구 우세 백혈구 증가 → 세균성 수막염. 환아는 생후 23일 신생아이므로 신생아 수막염의 경험적 항생제인 Ampicillin(Listeria) + 3세대 cephalosporin(cefotaxime; GBS·E. coli)을 쓴다(가끔 Ampicillin + gentamicin). 생후 1개월 이후라면 3세대 cephalosporin + vancomycin이므로 신생아인지 아닌지를 구분하는 것이 핵심이다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-28", "keys": ["25-28"], "ch": 0, "g": "소아 말초신경·근육질환", "stem": "<div>다음 중 floppy infant(늘어진 영아)에서 볼 수 있는 신체 검진 소견으로 볼 수 없는 것은?<\/div>", "o": ["Scarf sign", "Frog leg posture", "Scissoring posture", "Inverted U sign", "Double folding sign"], "a": 2, "A": "③", "E": "Floppy infant(근긴장 저하 영아)에서는 개구리 다리 자세(frog-leg posture), 앉혔을 때 앞으로 접히는 double folding sign, 팔을 반대쪽 목까지 둘러도 저항이 없는 scarf sign, 수평으로 들었을 때 늘어지는 inverted U sign을 볼 수 있다. Scissoring posture는 경직(hypertonia)이 있는 강직형 뇌성마비 소견이므로 floppy infant 소견이 아니다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-37", "keys": ["25-37"], "ch": 0, "g": "소아 말초신경·근육질환", "t": "s", "stem": "<div>5세 남아가 계단에 오르기 힘들어 하는 모습을 보여 병원에 왔다. 환자는 14개월경 혼자 걷기 시작했고 20개월에 혼자 계단에 올라갔으나 최근 계단에 잘 오르려 하지 않았다. 외삼촌도같은 증상을 보였고, 16세에 사망하였다고 하였다. 환자의 장딴지는 딱딱하고 비대하며, 양 무릎에서 깊은 힘줄 반사는 감소되어 있었다. 혈액 검사 소견은 다음과 같았다. 진단은? 아스파르데이트 아미노전달효소 (AST) 400U/L 알라닌아미노전달효소 (ALT) 140U/L 크레아틴키나아제(CK) 40,000U/L 참고치(5~130) 젖산탈수소효소(lDH) 700U/U  참고치(170~580)<\/div>", "o": [], "a": -1, "A": "Duchenne muscular dystrophy / 듀센형 근 이영양증", "acc": ["Duchenne", "듀센", "DMD"], "E": "5세 남아가 최근 계단을 잘 오르지 못하고 장딴지의 pseudohypertrophy를 보이며 혈액검사소견에서 CK의 고도 증가를 보입니다. 해당 소견은 듀센형 근 이영양증을 나타냅니다.", "B": "26 학습부 17번(검안) · 소아 말초신경·근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "Duchenne muscular dystrophy / 듀센형 근 이영양증", "vb": "검안"}, {"id": "25-38", "keys": ["25-38"], "ch": 0, "g": "소아 말초신경·근육질환", "t": "s", "stem": "<div>5세 남아가 계단에 오르기 힘들어 하는 모습을 보여 병원에 왔다. 환자는 14개월경 혼자 걷기 시작했고 20개월에 혼자 계단에 올라갔으나 최근 계단에 잘 오르려 하지 않았다. 외삼촌도같은 증상을 보였고, 16세에 사망하였다고 하였다. 환자의 장딴지는 딱딱하고 비대하며, 양 무릎에서 깊은 힘줄 반사는 감소되어 있었다.위 문제의 환아에게 3세 된 여동생이 있었다. 환아의 어머니가 여동생도 유전자 검사를 원했다. 환아의 어머니가 보인자가될 확률(A%)과 여동생이 보인자가 될 확률(B%)을 더하면(A+B)?<\/div>", "o": [], "a": -1, "A": "150", "acc": ["150"], "E": "환자는 DMD의 전형적 임상 소견을 보입니다. DMD는 성염색체 열성으로 유전되는 질환입니다. 질병 유전자를 r, 정상 유전자를 R로 나타내겠습니다. 1. 먼저 환아의 유전자형은 rY입니다. 환아의 X염색체는 어머니에게서 왔기 때문에 어머니는 반드시 r유전자를 가집니다. 따라서 어머니가 보인자가 될 확률은 100%입니다. 2. 환아의 여동생은 아버지, 어머니에게서 각각 X염색체 하나씩을 받습니다. 따라서 어머니에게서 r유전자를 받을 확률은 50%입니다. 해당 해설은 엄마와 아빠의 표현형이 정상일 때의 설명입니다. DMD 환자의 경우 평균 10대 말~20대 초 에 사망하기 때문에 문제에서 부모의 표현형 정보는 주어지지 않았지만 정상이라고 유추할 수 있습니다.", "B": "26 학습부 17번(검안) · 소아 말초신경·근육질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "150", "vb": "검안"}, {"id": "23-2Q-34", "keys": ["23-2Q-34"], "ch": 0, "g": "소아 말초신경·근육질환", "t": "s", "stem": "<div>다음 (가) 안에 공통적으로 들어가는 유전자는? 척수 근육 위축(Spinal muscular atrophy)은 태아기에서 시작하여 영아기와 소아기 중에도 지속적으로 진행하는 운동 신경세포의 퇴행질환으로서) 듀센형 근 디스트로피 제외한 소아의 말초신경근육 질환 중 가장 흔한 질환이다. 90% 이상에서 MLPA법으로 (가) 유전자의 결실을 진단할 수 있다. 얼마 전까지는 병의 진행을 늦출 수 있는 치료법이 없었으나 최근 AAV-9 vector를 이용하여 결실된 (가) 유전자를 대체하는 유전자 치료제인 Onasemnogene abepavovec(Zolgensma)이 개발되었다.<\/div>", "o": [], "a": -1, "A": "SMN1", "acc": ["SMN1"], "E": "SMA은 Survivor motor neuron protein의 부족으로 발생하는 병으로 관련 유전자는 SMN1, SMN2입니다. 그 중에서도 중요한 SMN protein은 거의 SMN1이 생성합니다. 최근에 개발된 zolgensma는 결실된 SMN1 gene을 대체하는 약입니다.", "B": "26 학습부 17번(검안) · 소아 말초신경·근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "SMN1", "vb": "검안"}, {"id": "23-2Q-35", "keys": ["23-2Q-35"], "ch": 0, "g": "소아 말초신경·근육질환", "t": "s", "stem": "<div>4세 남아가 점점 걷기가 서툴러져서 병원에 방문하였다. 15개월에 혼자 걷기 시작하였으나, 4개월 전부터 점차 다리를 넓게 벌리고 허리를 흔들며 걷고 자주 넘어졌다. 이른 아침과 오후에 증상의 차이는 없었다. 혼자 일어서기 힘들어하며, 배를 내밀고 서있었다. 장딴지 근육이 딱딱하고 비대해져 있었다. 외삼촌도 어릴 때 비슷한 증상으로 진단된 후 20세경 사망하였다고 한다. 남동생이 태어나면 환아와 같은 병에 이환될 확률은?<\/div>", "o": [], "a": -1, "A": "50%", "acc": ["50%"], "E": "‘혼자 일어나기 힘들어 하며; gower sign‘ , ‘배를 내밀고 서있었다. ; lordosis‘ , ‘장딴지 근육이 딱딱해지고 비대해져 있었다.; pseudohypertrophy‘, ’20세 경 사망; 평균 10대~20대 초 사망‘으로 DMD의 특징들을 보이고 있습니다. DMD는 XR유전으로 외삼촌의 유병을 통해 어머니가 보인자임을 알 수 있습니다. 따라서 어머니의 유전자를 무엇을 받느냐에 따라 50%의 확률로 이환되게 됩니다.", "B": "26 학습부 17번(검안) · 소아 말초신경·근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "50%", "vb": "검안"}, {"id": "22-2Q-57", "keys": ["22-2Q-57"], "ch": 0, "g": "소아 말초신경·근육질환", "t": "s", "stem": "<div>7세 여아가 2주 전 위장관 감염 후 아침부터 걷지 않으려는 모습을 보여 응급실을 방문하였다. 양측 하지 마비 관찰되었으며, 다음 날부터 상지로 진행하였고, 심부 건반사는 소실되었으며, 신경전도 검사에서 운동신경전도는 정상치의 20%로 감소하였다. 뇌척수액 검사 소견은 다음과 같다. 진단은? 백혈구 1/mm3, 적혈구 0/mm3, 포도당 70mg/dL (혈청치의 70%), 단백질 120mg/dL (참고치, 20~45mg/dL)<\/div>", "o": [], "a": -1, "A": "Guillain-Barre syndrome, 길랑바레 증후군", "acc": ["Guillain-Barre", "길랑바레", "길랑-바레", "GBS"], "E": "Guillain-Barre syndrome에 대한 설명입니다. 예방접종이나 선행 감염의 과거력, 대칭적으로 하지에서 상지로 진행되는 마비, DTR의 소실, CSF 검사에서 나타나는 단백-해리 소견이 중요한 임상 양상입니다. 호흡근 마비가 나타날 수 있기 때문에 질환 의심 시 무조건 입원시키고 IVIG를 투여해야 합니다. 영어와 한글 모두 답으로 인정해주셨습니다.", "B": "26 학습부 17번(검안) · 소아 말초신경·근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "Guillain-Barre syndrome, 길랑바레 증후군", "vb": "검안"}, {"id": "23-22", "keys": ["23-22"], "ch": 0, "g": "신경계 발달·소아신경 진단", "stem": "<div>다음의 중추신경계 발달 이상으로 나타날 수 있는 기형 중 임신 중 가장 이른 시기에 결함이 발생하여 나타나는 기형을 고르시오.<\/div>", "o": ["큰뇌증", "뇌이랑없음증", "뇌갈림증", "수막류", "통앞뇌증"], "a": 3, "A": "④", "E": "26년 강의(중추신경계 발달 이상): 수막류는 신경관 형성기(~4주) 이상으로 가장 이르다(④). 통앞뇌증은 신경관 분절기(~8주), 큰뇌증은 겉질 발달 중 증식 이상, 뇌이랑없음증은 이주 이상, 뇌갈림증은 조직화 이상이다.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-25-s", "keys": ["23-25"], "ch": 0, "g": "신경계 발달·소아신경 진단", "t": "s", "stem": "<div>영아기에 나타나는 원시 반사 중 아이를 들어서 떨어뜨리려고 하면 아이가 머리를 보호하듯이 팔을 쭉 뻗는 모습을 보이는 반사로, 가장 늦게 나타나 평생 지속되는 다음 원시반사는?<\/div>", "o": [], "a": -1, "A": "Parachute reflex", "acc": ["Parachute reflex"], "E": "22, 21년도에도 parachute reflex에 대한 문제를 출제하셨습니다. parachute reflex는 9개월 이후에 나타나서 평생 지속되는 원시반사로 대칭성을 확인할 수 있습니다. # 영아 (1개월~24개월) 2026 강의 01(검안): 낙하산 반사는 9개월 이후 나타나 평생 지속, 대칭성 확인.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": ["figs/23-25-s.jpg"], "v": false, "y": [2023], "ok": true, "ra": "Parachute reflex", "vb": "검안"}, {"id": "23-2Q-36", "keys": ["23-2Q-36"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>9개월 남아가 발달이 느리다고 외래에 왔다. 뒤집기는 가능했으나 혼자 잘 앉지 못하고, 양쪽 팔은 정상적으로 사용하나 양쪽 다리를 질질 끌면서 기는 모습을 보였다. 환자는 28주에 출생하였고, 신생아 중환자실에 3개월간 입원치료 받았다고 하 였다. 신체검사에서 하지의 심부건반사가 항진되어 있었고, 발목 간대와 babinski 징후를 보였다. 뇌 자기공명에서 다음과 같은 소견을 보였다. 진단은? 백혈구 1/mm3, 적혈구 0/mm3, 포도당 70mg/dL(혈청치의 70%), 단백질 120mg/dL(참고치, 20~45mg/dL)<\/div>", "o": [], "a": -1, "A": "강직성 하지마비, 강직성 양측마비, spastic diplegia", "acc": ["강직성 양측마비", "강직성 하지마비", "spastic diplegia"], "E": "7개월이 지난 영아가 기기 시작할 때 양쪽팔은 정상적으로 사용하지만 양쪽다리가 끌려가는 양상을 보이면 강직 양측마비를 의심할 수 있습니다. 이 외에도 강직 양측마비에 해당되는 소견으로 발목간대, 바빈스키 양성과 사진에서의 뇌실 주위 뇌연화증 소견 (corticospinal tract) 소견이 보입니다. 작년과 동일한 문제이나 주관식으로 바뀌었습니다. 2026 강의 02(검안, 뇌성마비): 강직성 양측마비는 7개월 이후 기기 시작할 때 팔은 정상·다리를 끄는 양상, 미숙아 과거력, 뇌실주위 백질연화증.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/23-2Q-36.jpg"], "v": false, "y": [2023], "ok": true, "ra": "강직성 하지마비, 강직성 양측마비, spastic diplegia", "vb": "검안"}, {"id": "23-42", "keys": ["23-42"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>4개월 남아가 3일 전부터 발생한 발열로 병원에 왔다. 2일전부터 수유가 절반 이하로 줄었고 쳐짐이 지속되었고 1일전부터 분출성 구토 있다고 하였다. 활력징후에서 혈압 70/40mmHg, 맥박 150 회/분, 체온 39.5 ℃ 관찰되었고, 신체 검진 상 앞 숫구멍이 팽창 되었고, 자극에도 반응 보이지 않고 계속 자려고만 하였다. 혈액 검사 및 뇌척수액 검사는 다음과 같았다. 가장 먼저 할 치료는?<\/div><div>혈액: 혈색소 10.4g/dL, 백혈구 19,500/mm3, 중성구 80%, 림프구 20% 나트륨 134meq/L, 포도당 94mg/dL, 칼슘 9.7mg/dL, C 반응성 단백 24mg/dL(정상치 &lt;0.5 mg/dL)<\/div><div>뇌척수액: 압력 240mmH20, 단백질 300mg/dL, 포도당 25mg/dL 백혈구 3,050/mm3, 중성구 90%, 림프구 10%<\/div>", "o": ["만니톨", "항생제", "항바이러스제", "정맥 내 스테로이드", "정맥 내 면역글로불린"], "a": 1, "A": "②", "E": "발열·수유 감소·처짐·저혈압, 숫구멍 팽창, 뇌척수액 압력 상승·단백 증가·포도당 감소·중성구 우세 백혈구 증가 → 세균성 수막염. 세균성 수막염이 의심되면 경험적 항생제를 즉시 투여하는 것이 가장 먼저이며, 4개월(신생아 이후)이므로 3세대 cephalosporin + vancomycin을 쓴다(Listeria 의심 시 cephalosporin 대신 ampicillin). dexamethasone은 항생제 직전(1~2시간 전)에 보조적으로 쓰고, mannitol은 뇌압 상승 시 보조 치료다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-43", "keys": ["23-43"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "stem": "<div>14세 여아가 간헐적인 좌측 손의 힘 빠짐으로 병원에 방문 하였다. 뜨거운 라면을 먹을 때나 100m 달리기 등 격한 운동을 한 이후이면 증상이 유발되고 곧 회복되는 모습이 관찰되었다. 상기 환자에서 시행한 뇌 자기공명 혈관 조영술은 다음과 같았다. 상기 질환의 병인과 가장 거리가 먼 경우는?<\/div>", "o": ["다운 증후군", "신경 섬유종증", "갑상선 기능 저하증", "낫 모양 적혈구 빈혈", "이전 방사선 치료 병력"], "a": 2, "A": "③", "E": "뜨거운 음식을 먹거나 격한 운동(과호흡) 뒤 한쪽 손 힘 빠짐이 생겼다가 곧 회복 → 모야모야병(ICA 말단부·MCA/ACA 근위부가 서서히 좁아짐). 기저질환 때문에 같은 혈관 소견이 생기는 모야모야 증후군의 원인으로 신경섬유종증 1형, 낫적혈구병, 다운 증후군(21번 세염색체), 방사선 치료, 갑상선 기능항진증, PHACE 증후군이 있다. 갑상선 기능 '저하'증은 해당하지 않는다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/23-43.jpg"], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-34", "keys": ["25-34", "22-48"], "ch": 0, "g": "신경계 발달·소아신경 진단", "t": "s", "stem": "<div>5개월 여아가 경련 증상이 있어 병원에 방문하였다. 신체검진에서 이마가 튀어나오고, 얼굴 중심부형성이 저하 되어 있으며, 코가 작고 들려 있었다. 두위는 35cm 였고, 아직까지 목가누기를 하지 못한다고 하였다. 출생시에 시행한 염색체 미세중복 검사에서 17번 단완의 결실(17p13.3 deletion)을 진단받았다고 하였다. 뇌 자기공명검사에서 다음과 같은 모습을보였다. 이 대뇌 겉질 발달 기형은?<\/div>", "o": [], "a": -1, "A": "Lissencephaly / 뇌이랑없음증 / agyria", "acc": ["lissencephaly", "뇌이랑없음증", "agyria"], "E": "25피마에서 출제되었고 야마입니다. 17번 염색체 단완 결실로 나타나는 lissencephaly입니다. sylvian fissure가 잘 형성되지 않습니다. 2026 강의 01(검안): Lissencephaly는 신경세포 이주 이상, LIS-1(17p13.3) 결실, Miller-Dieker 증후군의 특징적 얼굴 소견.", "B": "26 학습부 01번(검안) · 신경계발달,소아신경진단", "N": "", "img": ["figs/25-34.jpg"], "v": false, "y": [2022, 2025], "ok": true, "ra": "Lissencephaly / 뇌이랑없음증 / agyria", "vb": "검안"}, {"id": "25-35", "keys": ["25-35"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>7세 남아가 발열 및 기면, 숫구멍 팽창으로 방문하였고, 뇌척수액 검사에서 S. pneumonia 균이 동정되어 vancomycin및 3세대 cephalosporin 투여 시작하였다. 치료 이후 발열은호전되었으나 입원 3일째 갑자기 경련과 함께 의식이 저하되는 모습이 관찰되었다. 당시 시행한 혈액검사에서 나트륨128meq/L, 오스몰 260mg/dL, 포도당 94mg/dL, 칼슘9.5mg/dL 관찰되었다. 상기 환아에서 의심되는 합병증은?<\/div>", "o": [], "a": -1, "A": "항이뇨 호르몬 분비 이상 증후군 / 항이뇨 호르몬 부적절 분비 증후군", "acc": ["SIADH", "항이뇨호르몬 부적절 분비 증후군", "항이뇨 호르몬 분비 이상 증후군"], "E": "환자 혈액검사에서 hyponatremia 소견이 보입니다. 뇌수막염으로 합병증으로 SIADH가 발생할 수 있으며 뇌압상승이 ADH분비를 유발한다고 알려져있습니다. SIADH에서는 저나트륨 혈증, 혈청삼투압 감소가 나타나고 저나트륨성 경련이 발생할 수 있습니다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "항이뇨 호르몬 분비 이상 증후군 / 항이뇨 호르몬 부적절 분비 증후군", "vb": "검안"}, {"id": "25-36", "keys": ["25-36"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>10세 여아가 뜨거운 라면을 먹은 후 오른쪽 팔 힘이 빠졌다가다시 호전되는 양상이 반복적으로 관찰되어 외래를 방문하였다. 신경학적 진찰은 정상이었다. 뇌혈관 조영술 사진이다. 진단은?<\/div>", "o": [], "a": -1, "A": "Moyamoya disease(모야모야병)", "acc": ["moyamoya", "모야모야"], "E": "모야모야병은 ICA의 supraclinoid portion, MCA/ACA의 proximal part가 서서히 좁아지거나 막히는 질환으로 과호흡을 하거나 뜨거운 음식을 먹을 때 한쪽 팔이 마비증상이 10~20분 뒤에 호전되는 특징적인 증상을 보입니다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/25-36.jpg"], "v": false, "y": [2025], "ok": true, "ra": "Moyamoya disease(모야모야병)", "vb": "검안"}, {"id": "23-2Q-37", "keys": ["23-2Q-37"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>6개월 여아가 움찔거리는 양상의 모습을 보여 병원에 왔다. 한번 시작하면 10번 정도 5-10초 간격으로 지속한다고 하였고 점차 횟수가 늘고, 뒤집기를 아직도 못한다고 하였다. 산전 초음파에서 심장에 종양이 있었다는 이야기를 들었으나 3개월경 추적한 심장초음파에서는 소실되었다고 한다. 신체검진에서 다음과 같은 피부 소견이 보였고, 진단을 위해 시행한 뇌파 검사에서 다음 소견을 보였다. 상기 환아의 뇌전증과 동반된 피부 신경 증후군은?(*약자 인정 안 됨)<\/div>", "o": [], "a": -1, "A": "결절성 경화증, tuberous sclerosis complex, tuberous sclerosis, 결절 경화증", "acc": ["tuberous sclerosis", "결절성 경화증", "결절 경화증", "TSC"], "E": "사진은 hypomelanotic maculed며 EKG는 hypsarrythmia입니다. 결절성 경화증은 중추신경계소견이 가장 특징적인데 subepedymal nodule, SEGA, 뇌전증 (영아 연축)을 보입니다. 문제에서 산전 초음파에서 심장에 종양을 발견했으나 추적 초음파에서 사라졌다고 나왔는데, 결절셩 경화증 특징 증 cardiac rhabdomyoma가 있습니다. 50%에서 관찰되고 태아기에서부터 발생하나 보통2세 경 자연소실 된다고 합니다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/23-2Q-37.jpg", "figs/23-2Q-37-2.jpg"], "v": false, "y": [2023], "ok": true, "ra": "결절성 경화증, tuberous sclerosis complex, tuberous sclerosis, 결절 경화증", "vb": "검안"}, {"id": "22-2Q-55", "keys": ["22-2Q-55"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>11개월 남아가 우측 팔 다리를 까닥거리는 증상으로 병원에 왔다. 경련이 멈춘 후 우측 팔, 다리에 마비가 발생하였고 1시간 이후 회복되는 양상 관찰되었다. 환자의 얼굴 피부 소견 및 뇌 자기 공명 영상은 다음과 같았다. 진단은?<\/div>", "o": [], "a": -1, "A": "Sturge-Weber syndrome", "acc": ["Sturge-Weber", "스터지-웨버", "스터지웨버"], "E": "MRI에서 확인되는 한쪽 뇌의 백색질 이상 및 석회화, 병변 동측 얼굴의 제5 뇌신경 눈 분지 부위에 나타나는 port-wine stain 및 경련과 편마비는 Sturge-Weber syndrome의 대표적인 임상양상입니다. 다만 Sturge-Weber syndrome에서는 뇌 병변의 반대측 신체에서 경련과 편마비가 나타나는데, 문제에서는 두 소견 모두 오른쪽인 것을 보면 방향을 딱히 신경쓰시지 않고 출제하신 것 같습니다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/22-2Q-55.jpg"], "v": false, "y": [2022], "ok": true, "ra": "Sturge-Weber syndrome", "vb": "검안"}, {"id": "22-2Q-56", "keys": ["22-2Q-56"], "ch": 0, "g": "신경피부증후군·중추신경계질환", "t": "s", "stem": "<div>6세 여아가 간헐적인 좌측 손의 힘 빠짐으로 병원에 방문하였다. 뜨거운 음식을 먹을 때나 울고 나서 자주 좌측 손이 힘이 빠졌다가 회복되는 모습이 관찰되었다. 상기 환자에서 시행한 뇌동맥 조영술은 다음과 같았다. 진단은?<\/div>", "o": [], "a": -1, "A": "Moyamoya disease, 모야모야병", "acc": ["moyamoya", "모야모야"], "E": "모야모야병에 대한 설명입니다. 뇌동맥 조영술에서 작은 혈관들이 확장되어 연기처럼 보이는 소견이 나타나고, 과호흡 시 한쪽 팔에 마비증상이 나타나는 임상 양상을 보입니다. MCA, ACA 등 뇌의 주요 혈관이 좁아지거나 막히면서 증상이 나타납니다. 안지예 교수님께서는 영어와 한글 모두 정답으로 인정해주시기 때문에 편한 쪽으로 쓰시면 될 것 같습니다.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "", "img": ["figs/22-2Q-56.jpg"], "v": false, "y": [2022], "ok": true, "ra": "Moyamoya disease, 모야모야병", "vb": "검안"}, {"id": "25-105", "keys": ["25-105"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>수두증의 수술적 치료법에 해당되지 않는 것은?<\/div>", "o": ["L-P shunt", "V-P shunt", "Intrathecal pump implantation", "V-A shunt", "Endoscopic third ventriculostomy"], "a": 2, "A": "③", "E": "26년 강의(수두증 치료): 수두증은 약물로는 의미가 없고 수술로 CSF를 다른 곳으로 돌려야 하며, 방법은 내시경적 제3뇌실 개창술(ETV)과 V-P, V-A, L-P shunt다. 현재는 V-P shunt가 주로 쓰이고, V-A shunt는 성장하는 소아에서 가장 짧은 경로로, L-P shunt는 효과가 떨어져 거의 쓰지 않는다. Intrathecal pump implantation은 척수강 내로 약물을 넣는 장치로 CSF 우회 수술이 아니다(③).", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-101", "keys": ["25-101", "21-50", "20-08"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>두개강 내압 상승으로 인하여 두통, 의식저하, 유두부종 등의 증상이 나타나는 환자에서 두개강 내압 조절을 위해 시행할 수 있는 방법이 아닌것은?<\/div>", "o": ["hypothermia", "Head elevation", "Hypoventilation", "Mannitol", "Ventriculostomy (EVD)"], "a": 2, "A": "③", "E": "26년 강의(ICP control algorithm): 단계별로 intubation과 PaCO2 32~36 mmHg의 약간 낮은 환기(가벼운 hyperventilation) → 30도 head elevation → ventriculostomy(EVD) → mannitol 등 고삼투 치료 → mild/moderate hypothermia(32~34도) → decompressive craniectomy → barbiturate coma 순이다. CO2는 강력한 뇌혈관 확장 인자이므로 hypoventilation은 뇌혈류와 ICP를 오히려 올린다(③). 나머지는 모두 알고리즘에 포함된 ICP 감소 방법이다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "연도별 선지 순서가 달라 원래 번호는 2025 ⇒ ③, 2021 ⇒ ⑤, 2020 ⇒ ⑤", "img": [], "v": false, "y": [2020, 2021, 2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-102", "keys": ["25-102"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>Cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오<\/div>", "o": ["MR image상 white matter만 involve하며, gray matter는 spare 된다.", "Steroid에는 effect가 없다.", "DKA, Anoxia, Hypothermia, Infarction, Trauma등에 의해서 발생할 수 있다.", "ECF volume은 감소한다.", "Na+, K+-ATPase pump의 metabolic failure에서 기인한다"], "a": 0, "A": "①", "E": "26년 강의(brain edema): cytotoxic edema는 허혈·무산소로 에너지가 떨어져 Na+-K+ ATPase pump가 실패하고, 세포 안에 Na와 물이 쌓여 세포 자체가 붓는 부종이므로 ECF는 감소한다. 신경세포체가 있는 gray matter와 축삭인 white matter를 모두 침범하므로, white matter만 침범한다는 ①이 틀렸다(이는 BBB 손상에 의한 vasogenic edema의 특징). 원인은 anoxia, DKA, hypothermia, infarction, trauma 등이고 steroid는 효과가 없다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-103", "keys": ["25-103"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>CSF circulation 에 관하여 빈칸에 맞는 조합은? lat. ventricle → (A) → 3rd V. → (B) → 4th V. → (C) → subarachnoid space → (D) → venous sinus<\/div><div>&lt;1&gt; : cerebral aqueduct (시험 중간에 3rd ventricle에서 cerebral aqueduct로 수정)<\/div><div>&lt;2&gt; : arachnoid villi, granulation<\/div><div>&lt;3&gt; : foramen of Magendie, Luschka<\/div><div>&lt;4&gt; : foramen of Monro<\/div>", "o": ["A-<1>, B-<2>, C-<3>, D-<4>", "A-<3>, B-<4>, C-<1>, D-<2>", "A-<2>, B-<4>, C-<3>, D-<1>", "A-<4>, B-<1>, C-<3>, D-<2>", "A-<3>, B-<1>, C-<2>, D-<4>"], "a": 3, "A": "④", "E": "26년 강의(CSF 순환, 괄호넣기 출제 언급): lateral ventricle의 choroid plexus에서 생성된 CSF는 foramen of Monro를 지나 3rd ventricle로, cerebral aqueduct를 지나 4th ventricle로 간 뒤 foramen of Magendie·Luschka로 subarachnoid space에 나오고, arachnoid villi/granulation을 통해 superior sagittal sinus 등 venous sinus로 흡수된다. 따라서 A-<4>, B-<1>, C-<3>, D-<2>(④).", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-97", "keys": ["25-97"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>Corneal reflex의 반사궁에 관여하는 뇌신경 조합은?<\/div>", "o": ["optic nerve - oculomotor nerve", "optic nerve – trigeminal nerve", "oculomotor nerve – trigeminal nerve", "trigeminal nerve – facial nerve", "facial nerve – vestibulocochlear nerve"], "a": 3, "A": "④", "E": "26년 강의(신경계 질환의 검사): Corneal reflex(blink reflex)는 면봉·깃털로 각막을 자극하면 감각신경인 삼차신경(CN V)으로 들어가 운동신경인 안면신경(CN VII)으로 나와 눈을 감는 반사다. 따라서 trigeminal – facial 조합(④). 시신경(CN II)–동안신경(CN III)은 동공 대광반사(light reflex)의 경로이므로 혼동하지 않는다. 2023·2025년에 같은 문항이 그대로 나왔다.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-98", "keys": ["25-98"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>다음 중 신경근 질환(root disease)를 확인하기 위한 검사가 아닌 것은?<\/div>", "o": ["Spurling’s sign", "Shoulder abduction test", "Neck distraction test", "Compression test", "Lhermitte’s test"], "a": 4, "A": "⑤", "E": "26년 강의(신경계 질환의 검사): Lhermitte's sign은 앉은 자세에서 목을 최대한 굴곡시키면 등줄기·사지로 전기가 흐르는 듯한 느낌이 드는 것으로, 다발성 경화증·척수 종양·Chiari I 기형 등 척수(cord) 병변을 시사한다(corticospinal tract에 인접한 dorsal column 이상). 신경근 질환 검사가 아니므로 ⑤. Spurling's sign(목 신전·회전 후 압박 시 상지 방사통), shoulder abduction test(팔을 들면 방사통 감소), neck distraction test(견인 시 통증 감소), compression test(머리 압박 시 통증 유발)는 경추 신경근병증 검사다.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-18", "keys": ["23-18"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>corneal reflex의 반사궁에 해당하는 뇌신경의 조합은?<\/div>", "o": ["optic n.-oculomotor n.", "optic n.-trigeminal n.", "oculomotor n.-trigeminal n.", "trigeminal n.-facial n.", "trigeminal n.-vestibulocochlear n."], "a": 3, "A": "④", "E": "26년 강의(신경계 질환의 검사): Corneal reflex는 각막 자극 → 삼차신경(CN V, 구심) → 안면신경(CN VII, 원심)으로 눈을 감는 반사이므로 ④. 시신경–동안신경은 대광반사 경로다. 2025년에도 같은 문항이 출제되었다.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-19", "keys": ["23-19"], "ch": 1, "g": "신경계질환 검사", "stem": "<div>다음 중 신경근 질환(root disease)을 확인하기 위한 검사가 아닌 것은?<\/div>", "o": ["Spruling sign", "Shoulder abduction test", "Neck distraction test", "Compression test", "Lhermitte's test"], "a": 4, "A": "⑤", "E": "26년 강의(신경계 질환의 검사): Lhermitte's sign은 목 굴곡 시 척추·사지로 전기가 흐르는 느낌으로, 다발성 경화증·척수 종양·Chiari I 기형 등 척수 질환을 시사한다. 신경근 질환 검사가 아니므로 ⑤. 나머지(Spurling, shoulder abduction, neck distraction, compression test)는 경추 신경근 압박을 확인하는 검사다.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-99", "keys": ["25-99"], "ch": 1, "g": "신경계질환 검사", "t": "s", "stem": "<div>34세 남자 환자가 자동차 교통사고로 수상하여 응급실에 내원했다. 시행한 검사상 뇌출혈 소견은 없었으며, 신경학적 검진상 의식은 명료하였고 실어증 소견 외에는 특이 소견은 없었다. 환자는 스스로 말하기는 유창하고 질문에 알아듣기는 정상이었으나, 따라 말하기가 비정상이었다. 환자의 소견과 관련하여 손상이 의심되는 해부학적 구조의 명칭은 무엇인가? (그림의 번호와 명칭을 적을 것)<\/div>", "o": [], "a": -1, "A": "2, Arcuate fasciculus", "acc": [], "E": "23년도와 동일한 문제가 출제되었습니다. 스스로 말하기도 유창했고, 질문에 대한 이해도 정상이었으므로 Broca‘s area, Wernicke‘s area는 정상입니다. 유일하게 따라 말하기에 문제가 있으므로 broca‘s area와 Wernicke‘s area를 연결하는 arcuate fasciculus에 문제가 생긴 condunction aphasia입니다. 손상 부위는 그림상 ②에 해당합니다. 3. Aphasia – 딱 3개만 알고 넘어가세요! 23*P", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": ["figs/25-99.jpg"], "v": false, "y": [2025], "ok": true, "ra": "2, Arcuate fasciculus", "vb": "검안"}, {"id": "23-20-s", "keys": ["23-20"], "ch": 1, "g": "신경계질환 검사", "t": "s", "stem": "<div>34세 남자 환자가 자동차 교통사고로 수상하여 응급실에 내원했다. 환자는 뇌출혈 소견은 없었으며 검사상 의식은 명료하였으며 신경학적 검진상 실어증 외에는 특이사항 없었다. 환자는 스스로 말하기가 유창했고 질문에 대한 이해도 정상이었지만 따라 말하기를 하지 못했다. 환자의 소견과 관련해 손상된 것으로 의심되는 해부학적 부위의 명칭을 쓰시오. (그림의 번호와 명칭을 적을 것)<\/div>", "o": [], "a": -1, "A": "②, arcuate fasciculus", "acc": [], "E": "스스로 말하기도 유창했고, 질문에 대한 이해도 정상이었으므로 Broca‘s area, Wernicke‘s area는 정상입니다. 그러나 따라 말하기를 하지 못하므로 condunction에 문제가 생긴 aphasia입니다. 손상 부위는 broca‘s area와 Wernicke‘s area를 연결하는 arcuate fasciculus입니다. 그림상 ②에 해당합니다.", "B": "26 학습부 03번(검안) · 신경계질환 검사", "N": "", "img": ["figs/23-20-s.jpg"], "v": false, "y": [2023], "ok": true, "ra": "②, arcuate fasciculus", "vb": "검안"}, {"id": "21-07", "keys": ["21-07"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>Cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오.<\/div>", "o": ["MR image 상 white matter만 involve하며, gray matter는 spare 된다.", "Steroid에는 effect가 없다.", "DKA, Anoxia, Hypothermia, Infarction, Trauma 등에 의해서 발생할 수 있다.", "ECF volume은 감소한다."], "a": 0, "A": "①", "E": "26년 강의(brain edema): cytotoxic edema는 Na+-K+ ATPase pump의 대사성 실패로 세포 내 Na와 물이 늘어 ECF가 줄어드는 세포 내 부종이다. 세포가 직접 붓기 때문에 gray·white matter를 모두 침범하며, white matter만 침범하고 gray matter를 보존하는 것은 vasogenic edema의 소견이다(①). 원인은 ischemic infarct, anoxia, DKA, hypothermia, trauma 등이고 steroid에는 반응하지 않는다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "①", "vb": "검안"}, {"id": "21-33", "keys": ["21-33"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>두개강 내압 상승으로 인하여 두통, 의식저하, 유두부종 등의 증상이 나타나는 환자에서 두개강 내압 조절을 위해 시행할 수 있는 방법이 아닌 것은?<\/div>", "o": ["hypothermia", "head elevation", "ventriculostomy (EVD)", "mannitol", "hydration"], "a": 4, "A": "⑤", "E": "26년 강의(ICP control algorithm): ICP 조절은 약간 낮은 PaCO2 유지(가벼운 hyperventilation), 30도 head elevation, EVD를 통한 CSF 배액, mannitol 등 고삼투 치료, hypothermia, decompressive craniectomy, barbiturate coma로 이루어진다. hypothermia·head elevation·ventriculostomy·mannitol은 모두 이에 포함된다. 수액을 많이 주는 hydration은 뇌에서 물을 빼는 고삼투 치료와 반대 방향이라 뇌부종과 ICP를 악화시킬 수 있다(⑤).", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-09", "keys": ["20-09"], "ch": 1, "g": "두개내압항진·수두증", "stem": "<div>cytotoxic edema에 대한 설명이다. 옳지 않은 것을 고르시오.<\/div>", "o": ["MR image 상 white matter만 involve하여 gray matter는 spare된다.", "steroid에는 effect가 없다.", "DKA, anoxia, hypothermia, infarction, trauma 등에 의해서 발생할 수 있다.", "ECF volume은 감소한다.", "Na-K ATPase pump의 metabolic failure에서 기인한다."], "a": 0, "A": "①", "E": "26년 강의(brain edema): cytotoxic edema는 에너지(산소) 부족으로 Na-K ATPase pump가 멈춰 세포 안으로 Na와 물이 들어가는 부종이며 ECF volume은 감소한다. 세포 자체가 붓기 때문에 gray·white matter를 모두 침범하고, white matter에만 국한되는 것은 vasogenic edema다(①). 원인은 DKA, anoxia, hypothermia, infarction, trauma 등이고 steroid는 효과가 없어 mannitol·이뇨제를 쓴다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-100", "keys": ["25-100"], "ch": 1, "g": "두개내압항진·수두증", "t": "s", "stem": "<div>두개강 내 내용물의 양은 일정하며,  세가지(Blood, CSF, Brain) 중 하나가 증가하면 나머지 요소들의 부피가 감소함으로써, 압력을 일정하게 유지하려고 한다. 이처럼 두개강 내압이 이들 세 요소의 부피에 비례한다는 것을 뜻하는 것은 무엇인가?<\/div>", "o": [], "a": -1, "A": "Monro-Kellie doctrine 혹은 Monro Kellie doctrine", "acc": ["Monro Kellie doctrine", "Monro-Kellie doctrine"], "E": "하상우 교수님이 수업하셨던 두개내압항진과 수두증 파트를 올해 김학성 교수님이 수업하셨는데 감사하게도 모두 야마를 타주셨습니다. 세 요소의 부피의 합이 일정하다는 법칙은 Monro-Kellie doctrine입니다. (1) Intracranial pressure (ICP) (10~20cm 외우세요) 이 정도는 기억해 주세요", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "Monro-Kellie doctrine 혹은 Monro Kellie doctrine", "vb": "검안"}, {"id": "25-104", "keys": ["25-104"], "ch": 1, "g": "두개내압항진·수두증", "t": "s", "stem": "<div>아래 그림에서 표시된 ①~⑤ 부위 중, 이 부위의 협착으로 인해 폐쇄성 수두증이 흔히 발생하는 부위를 고르고, 그 명칭을 영어로 쓰시오.<\/div>", "o": [], "a": -1, "A": "3번 cerebral aqueduct 혹은 3 cerebral aqueduct", "acc": [], "E": "폐쇄성 수두증이 흔히 발생하는 부위는 3번에 해당하는 cerebral aqueduct입니다. 피드백상 답변에는 쉼표가 따로 없긴한데 어차피 직접 보시고 채점하신다하니 쉼표여부까지는 크게 신경쓰지 않으셔도 될 것 같습니다. 하지만 교수님의 수고를 덜어드리고 싶다면 쉼표없이 적어주시는것도,,,", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "", "img": ["figs/25-104.jpg"], "v": false, "y": [2025], "ok": true, "ra": "3번 cerebral aqueduct 혹은 3 cerebral aqueduct", "vb": "검안"}, {"id": "25-85", "keys": ["25-85"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>41세 남자가 내원 전날부터 시작된 몸살 감기 증상 후 고열(내원 시 37.2도), 오한 및 심한 두통을 주소로 응급실을 방문하였다. 구역과 구토가 동반되었으며, 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 다른 국소 신경학적 이상 소견은 없었다. 뇌 CT는 다음과 같다. 응급 혈액검사는 정상범위였으며, 뇌척수액 검사는 다음과 같다. 뇌척수액 검사<\/div><div>뇌압: 240 mmH₂O<\/div><div>색깔: 투명함<\/div><div>WBC: 130/μL<\/div><div>RBC: 10/μL<\/div><div>Glucose: 52 mg/dL (serum 109 mg/dL)<\/div><div>Protein: 45 mg/dL 임상 및 뇌척수액 결과를 바탕으로 가장 합당한 진단과 초기 관리 원칙은 무엇인가?<\/div>", "o": ["바이러스성 수막염이며, 대부분 자연 치유되므로 특별한 항바이러스제나 항생제 없이 대증적 치료와 경과 관찰이 표준이다.", "아급성 경과와 림프구 우세 증가는 결핵성 수막염을 시사하므로, 항결핵제(4제 요법)를 투여하고 CSF 결핵균 PCR 검사 결과를 기다린다", "CSF 백혈구 증가가 있으므로, 경험적 3세대 cephalosporin 항생제 투여 후 호전 여부를 관찰한다.", "HSV 뇌염의 가능성을 배제할 수 없으므로 뇌척수액 검사 즉시 Acyclovir를 투여하고 HSV PCR 결과를 기다린다.", "환자는 고열과 경부 강직이 있으므로, 급성 세균성 수막염을 가정하고 뇌척수액 배양 결과가 나오기 전에 3세대 cephalosporin과 Vancomycin을 즉시 투여해야 한다."], "a": 0, "A": "①", "E": "전날 시작된 감기 증상 뒤 경미한 발열·두통·경부 강직이 있고, CSF는 투명하며 WBC가 소폭(200 이하) 증가, 당·단백은 정상 범위여서 바이러스성(무균성) 수막염에 맞는다. 대부분 enterovirus가 원인이고 1~2주 내 자연 호전되므로 뇌압 조절 등 대증 치료가 원칙이다. ② 결핵성은 아급성 경과에 단백 현저 증가·당 감소, ④ HSV 뇌염은 이상행동·경련·측두엽 병변, ⑤ 세균성은 혼탁한 CSF·수천 개 WBC·당 감소를 보인다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/25-85.jpg"], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-86", "keys": ["25-86"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>응급실로 내원한 60세 환자가 급격한 고열, 심한 두통, 의식 변화 및 경부 강직(목이 뻣뻣함)을 호소하며, 의료진은 급성 세균성 뇌막염을 강력하게 의심하고 있다. 이 환자에게 가장 신속하고 정확하게 취해야 할 초기 조치 및 치료 원칙으로 가장 옳은 것은?<\/div>", "o": ["뇌척수액 검사를 먼저 시행하여 원인균이 확인된 후에, 지연 없이 적절한 광범위 항생제를 투여한다.", "혈액 배양 검체를 채취한 직후, CT검사 결과 또는 뇌척수액 검사 여부와 관계없이 즉시 경험적 광범위 항생제 및 덱사메타손 투여를 시작한다.", "뇌압 상승 위험이 있으므로, 항생제 투여 전 반드시 뇌 CT 통해 뇌부종과 수두증 유무를 확인한 후 뇌척수액 검사를 진행한다.", "항생제 치료는 환자의 열이 떨어지고 의식 상태가 완전히 회복될 때까지는 지속하며, 일반적으로 7일 이내에 종료하는 것이 원칙이다.", "덱사메타손과 같은 스테로이드 치료는 모든 세균성 뇌막염 환자에게서 치료 기간 내내 필수적으로 지속해야 한다."], "a": 1, "A": "②", "E": "급성 세균성 수막염이 의심되면 가능하면 혈액배양을 먼저 채취하되, CT나 CSF 검사를 기다리지 말고 즉시 경험적 광범위 항생제를 IV 최대용량으로 시작한다(CT를 먼저 찍더라도 항생제는 CT 전에 투여). 덱사메타손은 첫 항생제 15~20분 전 또는 동시에 4일간 짧게 쓴다. ① 원인균 확인을 기다리면 안 되고, ④ 치료 기간은 보통 10~14일이며, ⑤ 스테로이드를 오래 쓰면 오히려 면역이 저하된다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-87", "keys": ["25-87"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>20세 남자 환자가 2주 전부터 저녁만 되면 발생하는 발열 및 두통이 있었고, 내원 당일 한차례 전신 경련 후 의식 회복이 되지 않아 응급실에 왔다. 생체징후<\/div><div>BP: 130/90 mmHg, BT: 37.4℃, RR: 22회, PR: 96회 신경학적 진찰에서 의식은 혼미 상태였고, 뇌간 반사는 정상이었다. 통증 자극에 피하려고 하였으며 편측 마비는 관찰되지 않았다. 응급실에서 시행한 chest PA와 CT 및 응급검사는 다음과 같다. 혈액검사<\/div><div>WBC: 10.3×10³/μL (정상 416)<\/div><div>RBC: 4.10×10⁶/μL (정상 4.2120) BUN/Creatinine: 18/0.6 mg/dL<\/div><div>CPK: 448 U/L (정상 26100 / 35~45) 뇌척수액 검사<\/div><div>압력: 300 mmH₂O<\/div><div>색깔: yellow<\/div><div>Cell: WBC 650/mm³ (lymphocyte 80%)<\/div><div>RBC: 53/mm³<\/div><div>Glucose: 62 mg/dL<\/div><div>Protein: 320 mg/dL 이 환자의 치료로 합당한 것은?<\/div>", "o": ["Albendazole P.O.", "INH + Rifampin + Ethambutol + Pyrazinamide P.O.", "IV Acyclovir", "IV Vancomycin + Ceftriaxone", "IV Amphotericin B + Flucytosine"], "a": 1, "A": "②", "E": "2주간 저녁마다 나는 열·두통의 아급성 경과, 노란 CSF, 림프구 우세 WBC 증가, 단백 현저 증가(320)와 흉부 사진의 폐결핵 소견은 결핵성 수막염을 시사한다. 치료는 초기 2개월 INH+RFP+PZA+EMB 4제 요법 후 INH+RFP 유지(국내는 1년 이상)이며, 초기 염증 억제를 위해 스테로이드를 함께 쓴다. ① albendazole은 뇌유낭종증, ③ acyclovir는 HSV 뇌염, ④는 세균성, ⑤는 크립토코쿠스 수막염 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/25-87.jpg"], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-88", "keys": ["25-88"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>군복무 중인 21세 남자가 내원 2일 전 발생한 고열과 의식장애로 군병원에서 전원되었다. 평소 건강하였으며, 내원 시 의식상태는 혼미(stupor), 유두부종이 관찰되었고, 뇌막 자극 증상이 뚜렷했다. 신체 검진에서 피부의 광범위한 소자반 발진 및 반상출혈이 확인되었다. 뇌 CT소견은 정상이었다. 뇌 척수액 검사 결과는 다음과 같다.<\/div><div>뇌압: 270 mmH2O, WBC count: 1200/uL, protein: 170mg/dL, glucose: 27mg/dL 이 환자의 임상 및 뇌척수액 소견을 바탕으로 가장 의심되는 질환의 관리 방안에 대한 설명으로 옳은 것은?<\/div>", "o": ["이 질환은 주로 면역이 억제된 환자에서 발생하는 기회 감염성 질환으로, 산발적인 발생 양상을 보인다.", "피부 병변이 광범위하게 나타나므로, 예후 개선을 위해 치료 시작 시점에서 스테로이드제(덱사메타손)를 반드시 병용 투여해야 한다.", "환자와 같은 생활 공간을 공유한 밀접 접촉자들에게 화학 예방 요법이 반드시 권장 된다.", "뇌척수액 압력이 높고 유두 부종이 있으므로, 뇌 탈출 위험을 줄이기 위해 mannitol 등의 약제를 사용하며, 항생제 치료 후에는 뇌척수액 검사를 반복할 필요는 없다.", "급성 질환이며 타 장기 침범은 흔하지 않으므로, 광범위한 항생제 투여없이 예방적 약물 치료를 시작해야한다."], "a": 2, "A": "③", "E": "군부대에서 생긴 급성 세균성 수막염(CSF WBC·단백 증가, 당 감소)에 광범위한 점상 출혈·반상출혈이 있으면 수막구균(N. meningitidis)을 생각한다. 수막구균·인플루엔자균 수막염은 전염성이 있어 밀접 접촉자(동거인 등)에게 ciprofloxacin·ceftriaxone·rifampin으로 화학 예방을 한다. ① 면역저하자의 기회감염은 Listeria, ② 덱사메타손은 초기 4일 정도 보조적으로 쓰는 것이지 피부 병변 때문에 필수인 것은 아니며, ④ 경과에 따라 CSF 추적이 필요하고, ⑤ 즉시 광범위 항생제 치료가 원칙이다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-54", "keys": ["23-54"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>47세 남자 환자가 의식저하로 응급실로 전원되었다. 2주전부터 몸이 좋지 않다고 했고, 일주일 전부터 잠이 많아지고, 그제부터는 말을 거의 하지 않았고 식사도 잘 하지 않아서 집 근처 병원에 어제 입원했다고 했다. 내원시 신경학적 진찰에서 경부 강직이 있었다. 가져온 뇌 영상 검사는 다음과 같았다. 환자에서 시행한 뇌척수액 검사에서 압력은 210mmH2O였으며, 색깔은 yellowish 했고, WBC 176/mm3(lymphocyte 90%), RBC 0/mm3, protein 460 mg/dL, glucose 34mg/dL(serum 148 mg) 였다. 다음 중 이 환자의 치료 중 가장 맞는 것은?<\/div>", "o": ["IV Acyclovir", "IV Vancomycin + Ceftriaxon", "P.O. INH+RIF+PZA+ETH", "IV Amphotericin B", "CT guided Stereotactic aspiration"], "a": 2, "A": "③", "E": "2주에 걸친 아급성 의식 저하, 경부 강직, 노란 CSF, 림프구 우세(90%) WBC 증가, 단백 현저 증가(460), 당 감소(34/148)와 영상의 결핵종은 결핵성 수막염 소견이다. 치료는 일반 결핵과 같이 INH+RIF+PZA+EMB 경구 4제 요법(스테로이드 병용)이다. ① acyclovir는 HSV 뇌염, ② vancomycin+ceftriaxone은 세균성, ④ amphotericin B는 진균성, ⑤ 정위흡인술은 뇌농양 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/23-54.jpg"], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-55", "keys": ["23-55"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>53세 남자가 내원 당일 발생한 경련과 이상 행동을 주소로 병원에 왔다. 일주일 전부터 몸살이 있고 두통이 있어 약을 복용했다. 그제부터는 외출하지 않고 집에서 쉬었다고 하며, 전날 저녁에는 돌아가신 ‘어머니가 왔다.’ 고 부인에게 엉뚱한 이야기를 했다. 당일 새벽에 환자가 갑자기 이상한 소리를 지르며 발작하는 소리에 부인이 잠이 깨어 발견하여 응급실로 왔다. 뇌척수액검사 소견, CT검사는 다음과 같다. 이 환자에서 추가 검사결과가 나오기 전에 바로 사용할 수 있는 가장 합당한 치료제를 고르시오.<\/div>", "o": ["IV Dexamethasone", "IV Acyclovir", "IV Vancomycin + Ceftriaxon", "IV Amphotericin B", "IV Penicillin G (aqueous crystalline)"], "a": 1, "A": "②", "E": "일주일 전 몸살 뒤 경련, 환각('돌아가신 어머니가 왔다') 같은 이상 행동이 생기고 영상에서 측두엽 병변이 보이면 단순포진(HSV-1) 뇌염이다. 초기 CSF PCR이 위음성일 수 있으므로 PCR 결과를 기다리지 않고 즉시 acyclovir 10 mg/kg q8h IV를 시작한다. ① 덱사메타손은 뇌부종이 심할 때 보조적으로, ③은 세균성 수막염, ④는 진균성, ⑤는 신경매독 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/23-55.jpg"], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-56", "keys": ["23-56"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>34세 여자가 열감과 두통을 주소로 응급실에 왔다. 내원 3일 전부터 몸살 감기 증상이 있어 약국에서 약을 복용하였으나 호전이 없고 점차 심해지면서 구역, 구토가 발생하였다. 체온은 37.2°C였고 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 특별한 이상 소견은 관찰되지 않았다. 뇌 전산화 단층촬영은 다음 그림과 같았다. 뇌척수액 검사상 압력은 280mmH2O였으며 색깔은 투명하였고 WBC 84/mm3 (lymphocyte 80%), RBC 3/mm3, glucose 52 mg/dl (serum 98 mg/dl), protein 52 mg/dl 이었다. 이 환자에서 필요한 것을 고르시오<\/div>", "o": ["대증 치료", "항결핵제 경구투여", "덱사메타손 정맥 투여", "3세대 cephalosporin과 vancomycin 정맥투여", "amphotericin-B 정맥투여"], "a": 0, "A": "①", "E": "몸살 감기 뒤 경미한 발열·두통·경부 강직만 있고, CSF가 투명하며 림프구 우세 WBC 소폭 증가, 당·단백 정상이면 바이러스성(무균성) 수막염이다. 대개 자연 호전되므로 대증 치료가 원칙이다. ② 항결핵제는 결핵성(단백 현저 증가·당 감소), ④는 세균성, ⑤는 진균성 수막염 치료이며, ③ 덱사메타손은 세균성·결핵성에서 보조적으로 쓴다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/23-56.jpg"], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-63", "keys": ["23-63"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>52세 남자 환자가 한달전부터 지속되는 두통으로 내원했다. 뒤머리가 조이는 듯한 통증이 주로 오후가 되면 심해지고 잠을 자고 나면 나아지는 양상이다. 머리를 만지면 더 아픈 것 같고, 머리카락이 예민한 느낌이라고 했다. 평소 고혈압으로 약을 복용하는 것 말고는 지금까지 건강했다고 한다. 집 근처 병원에서 MRI 촬영을 했고, 상급병원 진료권유 받아왔다고 했다. 환자의 뇌 영상 사진은 다음과 같다. 이 환자를 위한 조언으로 가장 알맞은 것은?<\/div>", "o": ["두통약으로 타이레놀을 드셔보세요.", "뇌경색의 흔적이 있으므로 아스피린을 드세요.", "혈관에 동맥경화예방을 위해 스타틴 처방을 추가합니다.", "고혈압 때문에 두통이 있으니 고혈압 약물 조절이 필요합니다.", "다발성 경화증이 의심되어 뇌척수액 검사가 필요할 것 같습니다."], "a": 0, "A": "①", "E": "26년 강의(뇌졸중의 정의): 뇌졸중은 갑자기 생긴 국소 신경학적 증상이 혈관 원인으로 설명되고 24시간 이상 지속되거나 영상에서 병변이 확인될 때 진단한다. 한 달간 지속된 조이는 뒷머리 두통이 오후에 심하고 자고 나면 나아지는 것은 긴장형 두통 양상이고, 뇌실 주위 백질 고신호는 고령·편두통 환자에서 흔한 비특이 소견이라 진통제(타이레놀)가 답이다(①). 고혈압 자체는 두통을 일으키지 않고, 경색·동맥경화·다발성 경화증 근거는 없다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "소단원 '중추신경계 감염' → '뇌혈관질환' (2026 강의 05 학습부의 2023 기출)", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-72", "keys": ["23-72"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>세균성 뇌막염 환자의 치료에 관련된 내용 중 가장 맞는 것은?<\/div>", "o": ["항생제는 최대용량으로 정맥내로 사용해야 한다.", "어린이 뇌막염 중, 가장 흔한 균은 Hemophilus influenza이다.", "3세대 세파계 항생제 투여 후 48시간이 지나도 호전이 없으면 vancomycin을 추가한다.", "면역억제자 뇌막염 환자 중 페니실린 알러지가 있는 경우, ampicillin을 추가한다.", "정맥내 스테로이드 치료는 환자의 임상경과에 도움이 되지 않는다."], "a": 0, "A": "①", "E": "세균성 수막염의 항생제는 BBB를 충분히 통과해야 하므로 최대용량을 정맥으로 투여한다(①). ② 소아·성인에서 가장 흔한 원인균은 S. pneumoniae이며 H. influenzae는 백신 도입 후 드물다. ③ 내성균 때문에 처음부터 3세대 cephalosporin과 vancomycin을 함께 쓰며 cephalosporin 단독으로 시작하지 않는다. ④ 면역저하자에는 Listeria를 덮기 위해 ampicillin을 추가하고, 페니실린 알레르기가 있으면 TMP-SMX로 대신한다. ⑤ 덱사메타손은 첫 항생제 직전 또는 동시에 4일간 짧게 쓰며, 염증성 사이토카인 분비를 억제해 열과 증상을 빨리 가라앉히고 청력 소실 같은 합병증을 줄이므로 임상경과에 도움이 된다. 오래 쓰면 오히려 면역이 떨어지므로 초기에만 쓴다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "21-02", "keys": ["21-02"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>24세 남자가 오한과 두통을 주소로 응급실을 방문하였다. 환자는 내원 3일전부터 몸살 감기 증상이 있어 감기약을 먹었으나, 내원 당일에는 두통 및 오한이 발생하고 점차 심해지면서 구역, 구토가 동반되어 응급실에 왔다. 체온은 37.2℃였고 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 특별한 이상 소견은 관찰되지 않았다. 두부 전산화 단층촬영을 하였으나 정상이었다. 응급혈액검사는 정상범위였고 뇌척수액 검사상 압력은 220mmH2O였으며, 색깔은 투명하였고 WBC 230/mm3 (lymphocyte 80%), RBC 0/mm3, glucose 62mg/dL (Serum 98mg/dL), protein 48mg/dL였다. 이 환자에 대한 설명 중 가장 합당한 것은?<\/div>", "o": ["대증적 치료를 하며 경과를 관찰한다.", "결핵균에 대한 척수액 배양 검사를 실시하고 항결핵제를 투여한다.", "무균성 수막염이지만, 경험적 3세대 cephalosporin 항생제를 투여한다.", "경험적 3세대 cephalosporin과 vancomycin을 투여하면서 혈액 배양검사를 기다린다.", "진균성 수막염일 가능성이 높으므로 amphotericin-B를 투여한다."], "a": 0, "A": "①", "E": "감기 증상 뒤 경미한 발열·두통·경부 강직, CT 정상, CSF 투명·림프구 우세 WBC 230·당과 단백 정상은 바이러스성(무균성) 수막염 소견이다. 대증 치료하며 경과를 관찰한다. ② 결핵성은 단백 현저 증가·당 감소, ③④ 경험적 항생제는 세균성이 의심될 때, ⑤ 진균성은 면역저하자에서 단백 증가·당 감소를 보인다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "①", "vb": "검안"}, {"id": "21-03", "keys": ["21-03", "20-03"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>급성세균성 뇌막염이 의심이 될 때, 해야 할 조치 중 맞는 것은?<\/div>", "o": ["뇌척수액 검사는 항생제 치료 후 호전이 없을 때 시행한다.", "CT나 MRI검사보다도 항생제 치료를 먼저 시작한다.", "혈액배양검사 결과가 나온 후, 바로 항생제 치료를 시작한다.", "항생제 사용은 증상 호전 (의식의 호전 등)이 있을 때까지 사용한다.", "추가적인 스테로이드 치료는 최소 4주이상 지속되어야 합병증을 막을 수 있다."], "a": 1, "A": "②", "E": "급성 세균성 수막염이 의심되면 CT·MRI나 검사 결과를 기다리지 말고 항생제를 먼저 시작한다(가능하면 혈액배양은 먼저 채취). ① CSF 검사는 초기 진단에 필수로 치료 반응을 보기 전 시행하고, ③ 배양 결과를 기다리면 안 되며, ④ 증상이 좋아져도 정해진 기간(10~14일)을 채우고, ⑤ 스테로이드는 초기 4일 정도만 쓴다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2020, 2021], "ok": true, "ra": "②", "vb": "검안"}, {"id": "21-15", "keys": ["21-15"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>52세 여자 환자가 의식저하 및 30분전 발생한 경련으로 전원되었다. 환자는 10일 전부터 발열, 근육통, 기침, 가래 등으로 집 근처 병원에서 입원 중이었다. 과거력  상 건강했다. 다음은 가져온 MRI 검사 사진과 응급실에서 시행한 응급 혈액검사 결과다 (그림). 이 환자의 뇌척수액 검사 소견은 다음과 같다. 이 환자의 다음 시행해야 할 치료로 가장 알맞은 것은?<\/div><div>&lt;뇌척수액 소견&gt;<\/div><div>Color: turbid color, ICP: 230mmH20, Cell: 980/L (poly 95%), Glucose 34mg/dl(serum 108), Protein 152mg/dl<\/div>", "o": ["정맥내 로라제팜", "정맥내 덱사메타손", "정맥내 아시클로버", "정맥내 3세대 세파계 항생제 + 반코마이신", "정맥내 암포테리신 B + 플루사이토신"], "a": 3, "A": "④", "E": "10일간의 호흡기 감염 뒤 의식 저하·경련이 생겼고 CSF가 혼탁하며 WBC 980(중성구 95%), 단백 증가, 당 감소(34/108)이므로 급성 세균성 수막염이다. 즉시 경험적으로 3세대 cephalosporin과 vancomycin을 정맥 투여한다(면역저하·고령이면 ampicillin 추가). ① lorazepam은 경련 조절용 보조, ② 덱사메타손은 보조 치료, ③ acyclovir는 HSV 뇌염, ⑤는 크립토코쿠스 수막염 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/21-15.jpg"], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-01", "keys": ["20-01"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>27세 여자가 열감과 두통을 주소로 응급실에 왔다. 내원 3일전부터 몸살 감기 증상이 있어 약국에서 약을 복용하였으나 호전이 없고 점차 심해지면서 구역, 구토가 발생하였다. 체온은 37.2℃였고 신경학적 검사상 경미한 경부 강직이 의심되는 것 외에는 특별한 이상 소견은 관찰되지 않았다. 뇌 전산화 단층촬영은 다음 그림과 같았다. 뇌척수액 검사상 압력은 220mmH2O 였으며 색깔은 투명하였고 WBC 230/mm3 (lymphocyte 80%), RBC 0/mm3, glucose 62mg/dl (serum 98mg/dl), protein 48mg/dl 이었다. 이 환자에서 바로 시행할 치료법으로 가장 맞는 것은?<\/div>", "o": ["대증 치료", "항결핵제 경구투여", "2세대 cephalosporin 경구 투여", "3세대 cephalosporin과 vancomycin 정맥투여.", "amphotericin-B 정맥투여"], "a": 0, "A": "①", "E": "감기 증상 뒤 경미한 발열·두통·경부 강직, CSF 투명·림프구 우세 WBC 230·당과 단백 정상이면 바이러스성(무균성) 수막염이므로 대증 치료한다. ② 항결핵제는 결핵성, ③ 경구 항생제는 수막염 치료에 쓰지 않으며, ④는 세균성, ⑤는 진균성 수막염 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/20-01.jpg"], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-02", "keys": ["20-02"], "ch": 2, "g": "중추신경계 감염", "stem": "<div>52세 여자가 의식저하 및 30분전 발생한 경련으로 전원 되었다. 환자는 10일 전부터 발열, 근육통, 기침, 가래 등으로 집 근처 병원에서 입원중 이었다. 과거력 상 건강했다. 다음은 가져온 MRI 검사 사진과 응급실에서 시행한 응급 혈액검사 결과다. 이 환자의 다음 시행해야 할 조치는?<\/div>", "o": ["Intravenous rtPA", "Intravenous lorazepam", "Intravenous Acyclovir", "Intravenous Vancomycin + Ceftriaxone + Ampicillin", "Intravenous Amphotericin B + Flucytosine"], "a": 3, "A": "④", "E": "호흡기 감염 뒤 의식 저하·경련으로 온 52세 환자의 급성 세균성 수막염이다. 50세 이상에서는 S. pneumoniae·N. meningitidis 외에 Listeria까지 덮기 위해 3세대 cephalosporin(ceftriaxone)+vancomycin+ampicillin을 정맥 투여한다. ① rtPA는 뇌경색, ② lorazepam은 경련 조절, ③ acyclovir는 HSV 뇌염, ⑤는 크립토코쿠스 수막염 치료다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/20-02.jpg"], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-89", "keys": ["25-89"], "ch": 2, "g": "중추신경계 감염", "t": "s", "stem": "<div>신경매독의 진단을 위한 뇌척수액 검사 중 가장 specificity가 높은 검사는? 4단어 영자로 쓰시오(약자X)<\/div>", "o": [], "a": -1, "A": "venereal disease research laboratory", "acc": ["venereal disease research laboratory"], "E": "정답률 0프로입니다. 피드백 시간에 정지연 교수님도 수업시간에 수업하신 내용이냐고 물어보시네요.. (안성환 교수님 강의안에 나오는 영어단어는 거의 다 외워야 하나 싶습니다)", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "venereal disease research laboratory", "vb": "검안"}, {"id": "25-90", "keys": ["25-90"], "ch": 2, "g": "중추신경계 감염", "t": "s", "stem": "<div>58세 남자 환자가 급격히 진행하는 기억력 저하 및 이상 행동을 주소로 내원하였다. 환자는 내원 2달 전부터 우울감을 호소하며 외출을 피했고, 1달 전부터는 전화를 받고도 잊어버리거나 안절부절못하는 증상을 보였다. 내원 7일 전부터는 인지 기능이 급격히 악화되어 가족은 알아보지만 친구를 못 알아보는 등의 실인증 증상과 함께 수면 패턴이 완전히 바뀌어 밤에 일어나 아침이라고 주장하며 부인과 다투는 등의 이상 행동을 보였다. 내원 후부터 근간대성 경련(Myoclonus)이 관찰되어 시행한 뇌 MRI검사에서 다음과 같이 보였다. 이 환자에게 가장 의심되는 질환의 확정적인 임상 진단(Probable diagnosis)을 위해 뇌척수액(CSF)에서 검출되는 신경세포 손상의 가장 유용한 생화학적 표지자(Biomarker) 한 가지만 쓰시오.<\/div>", "o": [], "a": -1, "A": "14-3-3 protein", "acc": ["14-3-3"], "E": "2달전부터 내원직전까지 급격하게 진행되는 치매양상, 내원 후 근간대성 경련, MRI상 caudate 및 putamen 부위의 고신호 병변 등을 통해 prion 질환, 특히 CJD Creuzfeldt-Jakob diseas를 의심할 수 있습니다. 진단을 확정하기 위한 추가적인 검사로는 뇌척수액내 14-3-3 protein 검사가 있습니다. 14-3-3 protein은 신경손상시 방출되는 단백질로, CJD에서 90%의 특이도를 보입니다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/25-90.jpg"], "v": false, "y": [2025], "ok": true, "ra": "14-3-3 protein", "vb": "검안"}, {"id": "23-2Q-52", "keys": ["23-2Q-52", "22-2Q-53"], "ch": 2, "g": "중추신경계 감염", "t": "s", "stem": "<div>43세 남자환자가 2달전부터 있어오는 두통으로 내원하였다. 2주전부터 주로 밤에 심해지는 두통이 있었으나 지켜 보다 3일전부터는 두통약을 먹어도 호전이 없고 참을 수 없다고 했다. 과거력상 매독을 앓은 적이 있으나 보건소에서 항생제를 한번 맞은 것 같으나 잘 모르겠다고 했다. 신경학적 진찰상 특이소견은 없었다. 뇌 CT검사도 이상이 없었다. CSF검사는 다음과 같았다. 이 환자의 치료로 가장 추천되는 치료법을 영자로 쓰시오 (4단어)<\/div><div>CSF color : clear, Pressure:130mmH2O<\/div><div>WBC: 9개/mm3, Protein: 66mg/dL, Glucose: 45mg/dL (serum 90mg/dL) CSF ELISA for cysticercosis: negative<\/div><div>CSF VDRL: positive (serum VDRL: positive), CSF Gram stain: negative<\/div><div>India ink smear: negative<\/div>", "o": [], "a": -1, "A": "Aqueous crystalline penicillin G", "acc": ["penicillin G", "페니실린"], "E": "기출 그대로 나온 문제입니다. 매독을 잘 치료하지 않은 과거력이 있고 CSF VDRL과 serum VDRL 결과가 positive이므로 신경매독임을 알 수 있습니다. 특히 CSF VDRL이 positive인 경우 100% 신경매독으로 진단할 수 있습니다. 신경매독의 치료는 일반 매독의 치료와 같이 penicillin G이지만 IV로 투여한다는 점이 다릅니다. 10) Treatment 17,22, 치료는 반드시 알고 있을 것", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "Aqueous crystalline penicillin G", "vb": "검안"}, {"id": "22-2Q-54", "keys": ["22-2Q-54"], "ch": 2, "g": "중추신경계 감염", "t": "s", "stem": "<div>44세 외국인 노동자가 일을 하던 중, 어지럼증과 의식 소실을 주소로 응급실에 왔다. 7년 전 AIDS 진단을 받았다고 했다. 응급실에 내원하여 시행한 CSF 검사에서 WBC 43/mm3였으며 JC virus, CMV, EBV 항체검사에서는 음성이었다. Brain MRI 확산강조영상은 다음과 같았다. 가장 가능성이 있는 감염체를 영자로 쓰시오. (2단어)<\/div>", "o": [], "a": -1, "A": "Toxoplasma gondii", "acc": ["Toxoplasma gondii"], "E": "잠깐 언급만 하고 지나가셨던 케이스를 그대로 출제하셨습니다. MRI 소견상 multiple한 병변이 확인됩니다. 환자가 AIDS를 앓고 있다는 것이 중요한 점이었는데, AIDS가 있으면 toxoplasmosis에 더 susceptible 해진다고 합니다. 수업시간에 보여주셨던 원래 케이스에서는 Toxoplasma IgG(+) 결과와 어지럼증의 원인이 된 소뇌 병변에 대한 MRI 사진이 있었으나 문제에서는 따로 주지 않으셨습니다. 케이스 자체를 꼼꼼히 공부하지 않았다면 풀 수 없는 문제였을 것으로 생각됩니다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/22-2Q-54.jpg"], "v": false, "y": [2022], "ok": true, "ra": "Toxoplasma gondii", "vb": "검안"}, {"id": "25-76", "keys": ["25-76"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>다음 중 40대 미만 청년층에서 발생하는 허혈성 뇌졸중의 주요 생활 습관 관련 위험인자들을 고려할 때, 집단 기여위험도(Population Attributable Risk,PAR)가 가장 높은 것으로 알려진 인자는 무엇인가?<\/div>", "o": ["흡연(smoking)", "고혈압(hypertension)", "심방세동(atrial fibrilation)", "당뇨(diabetes mellitus)", "이상지혈증(dyslipidemia)"], "a": 0, "A": "①", "E": "26년 강의(연령대별 주요 기여 위험인자): 국내 연구에서 45세 미만 청년층 허혈성 뇌졸중에 가장 크게 기여하는 위험인자는 흡연(①)이며, 최근에는 비만도 중요해지고 있다. 고혈압·당뇨는 중년기(55~74세), 심방세동은 80세 이상 초고령기의 대표 기여 위험인자이므로 청년층에서는 답이 아니다. 흡연은 그 자체로 혈전 형성을 촉진한다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-77", "keys": ["25-77"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>72세 남자가 일주일 전부터 엉뚱한 소리를 하는 등 급격한 인지 기능 저하를 주소로 부인과 함께 내원하였다. 환자는 고혈압과 만성 심방세동(Atrial Fibrillation)으로 10년 이상 항응고제와 고혈압 약물을 복용 중 이었다. 신경학적 검사상 사지 근력 저하나 감각 이상과 같은 국소 운동신경학적 결손은 관찰되지 않았다. 환자에게 시계 그리기 검사(Clock Drawing Test)를 시행한 결과는 다음과 같았다 .환자의 뇌 병변 부위는?<\/div>", "o": ["우측 전대뇌동맥 (Right ACA) 영역", "우측 중대뇌동맥 (Right MCA) 영역", "우측 후대뇌동맥 (Right PCA) 영역", "우측 중뇌 (Right midbrain) 영역", "우측 뇌교 (Right pons) 영역"], "a": 1, "A": "②", "E": "26년 강의(혈관 영역별 뇌졸중 특징): 시계 그리기에서 한쪽(왼쪽)을 비워 두는 것은 hemineglect로, non-dominant hemisphere인 우측 MCA 영역(parietal 포함) 경색의 특징이다(②). 심방세동에 의한 심장색전성 뇌경색이 MCA로 가는 경우가 흔하다. ACA는 다리 위주 마비·abulia, PCA는 반맹 등 시야 문제, 중뇌·뇌교 병변은 뇌신경·의식 이상이 주된 소견이라 맞지 않는다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/25-77.jpg"], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-78", "keys": ["25-78"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>다음은 그래프는 급성 허혈성 뇌졸중 환자에서 정맥내 혈전용해제(rtPA, alteplase) 치료를 시행한 624명의 환자 데이터를 분석한 임상연구 결과를 나타낸다. 히스토그램(A)는 환자들의 뇌졸중 발생시점부터 rt-PA 치료 시작까지의 시간분포를 보여주며, 상관그래프 (B)는 뇌졸중 발생 시점부터 치료시작까지의 시간지연에 따른 3개월째 임상 결과를 얻을 상대적 이득 (Odds Ratio, OR)의 변화를 보여준다. 제시된 두 그래프를 정확하게 해석한 설명으로 가장 옳은 것은?<\/div>", "o": ["히스토그램(A)를 볼 때, 대다수 환자들은 발생부터 180분 지나서 병원에 도착했음을 알 수 있다.", "상관관계 그래프(B)에 따르면, 뇌졸중 발생시간과 치료까지 180분을 넘어가도 OR가 1보다 높게 유지되므로, 치료의 이득은 유지된다.", "rt-PA 치료의 상대적 이득(OR)은 치료시간이 늦어질수록 점진적으로 감소하여, 90분 이내에 치료했을 떄의 OR은 약 1.5배정도이다.", "뇌졸중 발생부터 치료까지 120분째 환자의 치료효과가 가장 좋으므로, 모든 환자를 120분 이내에 치료하도록 시간을 맞추는 것이 핵심목표가 되어야 한다.", "뇌졸중 발생부터 치료까지 60분이내 환자가 180분째 환자에 비해 우수한 임상결과를 얻을 확률이 약 4배 더 높다."], "a": 4, "A": "⑤", "E": "26년 강의(급성기 재관류 치료): 정맥 내 혈전용해제(rt-PA)는 빨리 줄수록 오즈비(OR)가 높아 병원에 빨리 오는 것이 핵심이다(time is brain). 그래프에서 60분 무렵 OR은 4에 가깝고 180분 무렵은 1에 가까워 60분 이내 치료가 약 4배 유리하다(⑤). ① 대부분은 180분 이내에 치료받았다 ② 180분을 넘으면 OR이 1 아래로 내려가 이득이 유지되지 않는다 ③ 시간이 갈수록 OR이 줄어드는 것은 맞지만 90분 이내 OR은 1.5보다 크다 ④ 120분보다 더 일찍 치료할수록 효과가 좋다. 현재 정맥 내 rt-PA는 CT 소견과 함께 발생 4.5시간 이내에 쓴다.", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "", "img": ["figs/25-78.jpg", "figs/25-78-2.jpg"], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-79", "keys": ["25-79"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>67세 남자 환자가 급성 우측 편마비를 주소로 응급실에 내원하여 뇌 영상 검사에서 좌측 중대뇌동맥(MCA) 영역의 급성 뇌경색 진단을 받았다. 환자는 평소 심계항진(두근거림)을 종종 느꼈다고 진술하였다. 응급실에서 시행한 검사 결과는 다음과 같다. 이 환자의 향후 뇌졸중 재발을 예방하기 위해 2차 예방 목적으로 가장 우선적으로 선택되어야 하는 항혈전제(antithrombotic agent) 계열과 구체적인 약물은 무엇인가?<\/div>", "o": ["항혈소판제: Aspirin", "항혈소판제: Clopidogrel", "항혈소판제: Ticagrelor", "항응고제(DOACs): Rivaroxaban(또는 Apixaban, Edoxaban)", "항응고제(Vitamin K antagonist): Warfarin"], "a": 4, "A": "⑤", "E": "26년 강의(심방세동·2차 예방): 심계항진과 심전도·심초음파 소견은 좌심방 혈전(LA thrombus)을 동반한 심방세동으로, 심장색전성 뇌경색이다. 2차 예방은 항혈소판제가 아닌 항응고제이며, 좌심방 혈전이 있는 경우 가이드라인상 warfarin(⑤)이 우선이다. 판막 질환이 없는 일반 심방세동에서는 NOAC도 쓴다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/25-79.jpg"], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-80", "keys": ["25-80"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>53세 남자가 내원 3시간 전 발생하여 약 30분 만에 완전히 회복된 우측 팔/다리 근력 약화 및 구음 장애를 주소로 응급실을 방문하였다. 환자는 평소 특이 기저질환은 없으나, 하루 한 갑 흡연과 주 3회 소주 1병 음주를 20여 년간 지속해왔다. 내원 당시 신경학적 검사상 특이 소견은 없었으며, 환자 역시 증상이 완전히 소실되었다고 진술하였다. 환자의 비조영 CT 및 뇌 CT혈관 사진은 다음과 같았다. 환자의 임상 양상과 검사 결과를 바탕으로 가장 절절한 진단 및 이에 따른 응급실에서의 초기 관리 원칙은 무엇인가?<\/div>", "o": ["진단은 일과성 허혈 발작이며, 뇌졸중 재발 위험을 줄이기 위해 응급실에서 즉시 항혈소판제(아스피린) 투여를 시작한다.", "증상이 이미 3시간 전에 소실되었고 CT상 병변이 없으므로, 치료 없이 귀가 조치 후 외래에서 위험인자 관리를 시작한다.", "증상은 완전히 회복되었으나 뇌경색의 가능성을 배제할 수 없으므로, 정맥 내 혈전용해제 tPA를 투여한다.", "증상이 단시간 내에 회복되었더라도, 흡연 등 위험인자가 높아 혈괸 내 혈전제거술(Mechanical Thrombectomy) 및 스텐트 삽입술을 시행한다.", "환자는 TIA 고위험군이므로, 향후 뇌졸증 예방을 위해 즉시 정맥 내 헤파린(Hepain)투여를 시작하고 항응고제로 전환한다."], "a": 0, "A": "①", "E": "26년 강의(TIA): 증상이 30분 만에 완전히 사라지고 CT에 출혈·경색이 없으면 TIA로 진단한다. 치료는 발생 후 가능한 한 빨리 항혈소판제(아스피린)를 시작하는 것이다(①). 증상이 없어진 환자에게 tPA·혈전제거술은 적응증이 아니고, 심방세동 등 근거 없이 헤파린을 쓰지 않으며 치료 없이 귀가시키지 않는다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/25-80.jpg"], "v": false, "y": [2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-81", "keys": ["25-81"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>뇌졸중 발생 후 2차예방을 위해 환자에게 제공해야 하는 약물 사용 및 위험인자 관리지침에 대한 설명중, 현재 가이드라인에 가장 맞는 것은?<\/div>", "o": ["항혈소판제(예: 아스피린)는 매일 복용하는 것이 원칙이지만, 일주일에 한 번만 복용해도 뇌졸중 예방 효과는 충분히 기대할 수 있다.", "출혈 위험이 높은 수술을 앞둔 경우, 항응고제(예: 와파린)는 반드시 7일간 중단해야 하며, 대체 요법(Bridge Therapy)은 필요하지 않다.", "고혈압이 동반된 뇌졸중 환자의 경우, 뇌혈류 유지를 위해 수축기 목표 혈압은 160mmHg이하로 다소 높게 유지하는 것이 권장된다.", "당뇨병을 동반한 뇌졸중 환자에서 장기적인 혈당 조절의 목표는 당화혈색소(HbA1c) 8.0% 이하로 설정하는 것이 일반적이다.", "동맥경화성 기전의 뇌졸중 환자에서 강력한 지질 저하 요법은 필수적이며, LDL 콜레스테롤 목표는 70mg/dL 미만이 권장된다."], "a": 4, "A": "⑤", "E": "26년 강의(2차 예방, best medical therapy): 동맥경화성 뇌졸중의 2차 예방에서 LDL 콜레스테롤 목표는 과거 100 mg/dL 미만에서 현재 70 mg/dL 미만으로 강화되었다(⑤). ① 혈소판이 매일 새로 만들어지므로 아스피린은 매일 복용한다 ② 수술로 warfarin을 끊어야 하면 약 5일 전 중단하고 INR을 확인해 필요 시 헤파린으로 bridging한다 ③ 2차 예방에서는 혈압을 낮게(수축기 140 mmHg 미만) 유지할수록 좋다 ④ 당뇨 동반 시 당화혈색소 목표는 7% 이하. ①②는 강의안보다 대한뇌졸중학회 진료지침에 근거한다.", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-91", "keys": ["25-91", "23-51", "22-39"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>76세 여자가 1시간 30분 전부터 왼쪽 팔다리의 힘이 빠져서 병원에 왔다. 밭에서 일하던 중 증상이 발생하면서 동시에 발음도 어둔해졌다고 한다. 3년 전부터 고혈압과 고지혈증 진단하에 약물 복용중이었다. 혈압 150/90 mmHg, 맥박 100회/분, 호흡 20회/분, 체온 36.8도씨이다. 신경학적 진찰에서 왼쪽의 같은쪽 반맹(homonymous hemianopsia), 구음 장애가 있으며, 왼쪽 상지와 하지는 근력등금 (MRC grade) III로 확인되고, 왼쪽에서 바빈스키 반사가 양성이다. 응급실에서 시행한 뇌 컴퓨터단층촬영 및 혈관조영술 사진이며, 출혈 소견은 관찰되지 않았고, 우측 중대뇌동맥의 폐색이 관찰되었다. 조직플라스미노겐활성화제(tPA) 사용 이후 우선적으로 필요한 치료는?<\/div>", "o": ["만니톨 투여", "혈압강하제 투여", "뇌실 외 배액술", "동맥 내 혈전제거술", "뇌 감압술"], "a": 3, "A": "④", "E": "26년 강의(급성 뇌졸중 치료 time line): 발생 1시간 30분의 급성 뇌경색이고 혈관조영에서 오른쪽 중대뇌동맥 폐색이 보인다. 치료 순서는 정맥 내 tPA(4.5시간 이내) → 동맥 내 혈전제거술(endovascular recanalization, 24시간 이내) → 뇌부종이 심하면 감압 개두술(48시간 이내)이므로 tPA 다음은 동맥 내 혈전제거술(④)이다. 급성기에는 측부순환 유지를 위해 혈압을 낮추지 않으며, 만니톨·뇌실 외 배액·감압술은 이 단계의 치료가 아니다. 2022·2023년과 같은 문항.", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "", "img": ["figs/25-91.jpg"], "v": false, "y": [2022, 2023, 2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-60", "keys": ["23-60"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>62세 남자가 내원 1시간 전 발생한 30분 정도 지속되는 우측 위약감 및 말이 어눌했다고 119로 병원에 왔다. 평소 건강했으며 술은 하지 않으나 하루 한갑씩 40여년 정도의 담배를 피웠다고 했다. 신경학적 검사에서 특이소견은 없었고, 환자의 CT혈관 사진은 다음과 같았다. 이 환자에게 가장 적절한 치료는?<\/div>", "o": ["경과관찰", "아스피린 300mg P.O.", "항응고제(헤파린2000U) IV", "혈전용해제 (tissue plasminogen activator)IV", "두개강 내 스텐트 삽입술"], "a": 1, "A": "②", "E": "26년 강의(TIA): 30분 만에 완전히 회복된 우측 위약·구음장애는 일과성 허혈 발작(TIA)이다. TIA는 뇌경색의 경고 신호이므로 가능한 빨리 항혈소판제(아스피린, ②)를 시작한다. 증상이 이미 없어져 혈전용해제·스텐트 대상이 아니며, 색전 근거 없이 헤파린을 쓰지 않는다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/23-60.jpg", "figs/23-60-2.jpg"], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-61", "keys": ["23-61"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>뇌경색 2차 예방을 위한 항혈전제 사용에 대한 내용중 가장 맞는 것은?<\/div>", "o": ["과거 뇌경색이 없었던 심방세동 환자는 아스피린을 복용하면 된다.", "심장판막 (기계판막) 수술을 환자는 반드시 와파린을 복용해야 한다.", "죽상동맥경화에 의한 뇌경색을 예방하기 위해 와파린을 복용해야 한다.", "과거 뇌출혈이 있었던 심방세동 환자는 항응고제보다 아스피린이 더 권장된다.", "신장기능이 좋지 않은 환자는 와파린보다 NOAC(novel oral anticoagulant) 이 권장된다."], "a": 1, "A": "②", "E": "26년 강의(2차 예방 항혈전제): 기계판막 환자는 반드시 warfarin을 써야 한다(②). 판막성 심방세동은 warfarin, 비판막성은 최근 NOAC을 쓰며, NOAC은 신장 배설이 많아 신기능이 나쁘면 주의한다. 죽상동맥경화성 뇌경색은 항혈소판제, 심방세동은 뇌경색 병력과 상관없이 항응고제가 기본이다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-62", "keys": ["23-62"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>70세 남자 환자가 우측편마비로 입원하여 뇌경색 진단을 받았다. 과거 20여년간 고혈압, 당뇨병으로 약물복용했었다. 심전도 검사 및 심장 초음파 검사에서는 특이소견은 없어 항혈소판제인 아스피린을 투여받았다. 입원 후 5일 째, 우측 하지 부종과 함께 숨이 답답하다고 하여 하지 정맥 초음파 및 chest Xray를 찍었다. 이 환자의 다음 치료로 가장 적합한 것은?<\/div>", "o": ["Lasix P.O.", "Ceftriaxone IV", "Clopidogrel P.O.", "Rivaroxaban P.O.", "rtPA (tissue plasminogen activator) IV"], "a": 3, "A": "④", "E": "26년 강의(급성기 합병증 DVT·PE): 뇌경색으로 움직이지 못하는 환자에게 마비된 쪽 다리 부종과 호흡곤란이 생기면 심부정맥혈전증(DVT)과 폐색전증(PE)을 의심한다. 정맥 혈전은 fibrin이 주성분이므로 항혈소판제가 아니라 fibrin을 겨냥하는 항응고제(warfarin·NOAC)로 치료하고, 선지 중 NOAC인 rivaroxaban(④)이 답이다. clopidogrel은 항혈소판제, rtPA는 급성 뇌경색 초기 재관류 치료, Lasix·ceftriaxone은 원인 치료가 아니다. (정답률 33%)", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "앞부분 문장 일부는 2020년 같은 문항으로 보완", "img": [], "v": false, "y": [2023], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-64", "keys": ["23-64"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>65세 남자가 갑자기 눈앞이 침침하면서 뒤머리가 아프다고 안과에서 의뢰되었다. 최근 1년전부터 심장 부정맥이 있다고 약을 복용해왔다고 했다. 환자가 안과에서 시행한 시야검사는 다음과 같았다. 이 환자에서 의심되는 뇌병터는?<\/div>", "o": ["왼쪽 관자엽 (temporal lobe)", "오른쪽 관자엽", "왼쪽 마루엽 (parietal lobe)", "오른쪽 마루엽", "왼쪽 뒤통수엽 (occipital lobe)"], "a": 2, "A": "③", "E": "26년 강의(시각 경로·PCA/MCA 시야 장애): 갑자기 생긴 양안 시야 장애는 뇌졸중을 의심한다. optic chiasm 뒤 병변은 반대쪽 시야 결손을 만들고, optic radiation이 지나는 parietal 병변은 quadrantanopia, occipital 병변은 hemianopia(macular sparing)를 일으킨다. 시야검사의 오른쪽 하사분맹은 왼쪽 마루엽 병변이다(③). 관자엽 병변은 상사분맹, 오른쪽 병변은 왼쪽 시야 결손을 만든다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "그림(시야검사)은 원본 파일에서 가져오지 못함", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-65", "keys": ["23-65"], "ch": 2, "g": "뇌혈관질환", "stem": "<div>38세 여자 환자가 어지러우면서 물체가 겹쳐 보이는 증상으로 내원하였다. 환자의 신경학적 검사 중 안구 운동은 다음과 같았다. 환자의 뇌 병변 부위로 가장 합당한 부위는?<\/div>", "o": ["medulla", "pons", "mid brain", "cerebellum", "cerebral hemisphere"], "a": 1, "A": "②", "E": "26년 강의(INO): 옆을 볼 때 한쪽 눈이 안쪽으로 모이지 않고 반대쪽 눈에 외전 안진이 생기는 핵간안근마비(INO)다. 다리뇌(pons) 뒤쪽의 내측세로다발(MLF)이 손상되어 CN VI 핵의 신호가 반대쪽 CN III 핵으로 전달되지 않으며, 작은 경색으로도 복시가 생긴다(②). 학생들이 많이 고른 중뇌 병변이면 CN III 자체가 마비되어 눈이 외하방으로 치우친다. (정답률 71%)", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "그림(안구 운동)은 원본 파일에서 가져오지 못함", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-82", "keys": ["25-82"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>뇌경색의 원인이 되는 혈전이 만들어지는 과정 중, fibrinogen이 fibrin으로 변환되는 데 중요한 역할을 하는 응고인자 이름을 한 단어 영자로 쓰시오<\/div>", "o": [], "a": -1, "A": "thrombin", "acc": ["thrombin"], "E": "fibrinogen을 fibrin으로 전환시키는 응고인자는 thrombin입니다. 관련이론 참고하시기 바랍니다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "thrombin", "vb": "검안"}, {"id": "25-83", "keys": ["25-83"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>뇌혈관이 갑작스럽게 혈전에 의해서 혈관이 막히면,뇌관류압(cerebral perfusion pressure)이 떨어지는데, 뇌혈류를 유지하기 위해(cerebral blood flow), 뇌혈류용적(cerebral blood flow)을 증가시켜 뇌세포로 가는 산소와 대사율을 유지시키는 능력(ability)을 무엇이라고 하는 지 2단어로 영자로 쓰시오<\/div>", "o": [], "a": -1, "A": "cerebral autoregulation", "acc": ["cerebral autoregulation"], "E": "이전에는 cerebral autoregulation 작용에 대한 변화를 나타내는 그래프와 관련된 해석을 묻는 문제가 출제되었다면, 직접적으로 cerebral autoregulation을 물어보는 문제는 처음 출제되었습니다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "cerebral autoregulation", "vb": "검안"}, {"id": "25-84", "keys": ["25-84"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>급성기 뇌졸중환자에서 다양한 합병증이 발생하는데, 뇌졸중 발생 초기 (2일째~5일째) 사망 첫번째 원인을 3단어 영자로 쓰시오<\/div>", "o": [], "a": -1, "A": "malignant cerebral edema", "acc": ["brain edema", "cerebral edema", "malignant cerebral edema", "뇌부종"], "E": "급성 뇌졸중시 brain의 collateral circulation이 잘 발달되지 않게되며, 혈관이 막히는 순간부터 뇌의 손상이 시작되어 12시간 이내에 brain edema로 인해 심하게 악화됩니다. 2026 강의 04(검안) Kahoot 문제: 급성 뇌졸중 발생 첫 주 사망 원인은 뇌부종(brain edema).", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "malignant cerebral edema", "vb": "검안"}, {"id": "23-2Q-53", "keys": ["23-2Q-53"], "ch": 2, "g": "중추신경계 감염", "t": "s", "stem": "<div>48세 남자 환자가 우측 다리 저림 증상으로 내원하였다. 환자 의 뇌영상 사진 및 Pelvis X-ray사진은 다음과 같다. 이 환자의 가장 합당한 치료 약물의 일반명을 영어로 쓰시오.<\/div>", "o": [], "a": -1, "A": "Albendazole", "acc": ["Albendazole"], "E": "기출 그대로 나온 문제입니다. 신경계 기생충 감염은 일반적으로 수술보다는 약물치료로 치료하며 약물중에서도 Albendazole이 효과가 좋습니다. 한글로 ‘알벤다졸’ 도 정답인정해주셨습니다. # Case 48/M Rt. leg tingling sensation - case Q3 22, 2026 강의 14(검안): 뇌유낭종증(neurocysticercosis)은 구충제 albendazole(또는 praziquantel) 1~2주 투여.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "", "img": ["figs/23-2Q-53.jpg"], "v": false, "y": [2023], "ok": true, "ra": "Albendazole", "vb": "검안"}, {"id": "23-2Q-57", "keys": ["23-2Q-57"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>72세 남자가 내원 당일 아침부터 잘 걷지 않고 누우려고만 한다고 119로 응급실에 왔다. 고혈압으로 10여년전부터 약을 복용하는 것 말고는 건강했으며 아침마다 산행을 3시간씩 해왔다고 했다. 구급대원은 응급차에서 환자가 요실금이 있었다고 했다. 신경학적 진찰에서 의사의 묻는 말에 대답을 거의 하지 않고 비협조적으로 “아이..왜..어이”라고 하면서 매우 귀찮은 표정만 지었다. 오른쪽 팔의 근력은 4등급(grade4), 오른쪽 다리의 근력은 2등급(grade2) 였고 깊은 힘줄반사 (deep tendon reflex) 는 오른쪽에서 모두 항진돼있었다. 이 환자에서 추정되는 병변 부위 혈관 이름을 좌, 우측 포함 영자 (4단어)로 쓰시오.<\/div>", "o": [], "a": -1, "A": "left anterior cerebral artery", "acc": ["left anterior cerebral artery"], "E": "뇌졸중 환자이며, 오른쪽 팔에 비해 오른쪽 다리의 근력이 떨어졌으므로 ant. cerebral a. 병변입니다. DTR이 오른쪽에서 항진되어있으니 왼쪽 병변입니다. 안성환 교수님 파트에서는 객관식으로 출제된 문항이 주관식으로 나올 수 있으니 객관식도 꼼꼼히 익혀주세요 ) Clinical Presentation : ACA", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "left anterior cerebral artery", "vb": "검안"}, {"id": "23-2Q-58", "keys": ["23-2Q-58"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>뇌경색 환자의 2차예방을 위해서 LDL cholesterol level 의 적정값 (숫자)를 쓰시오. _________mg/dL 이하 (단위는 mg/dL)<\/div>", "o": [], "a": -1, "A": "70", "acc": ["70"], "E": "피마에서 출제해주셨습니다. 관련 이론을 보면 LDL 70이하 유지해야합니다! Best medical therapy 강의 자료에는 2차 예방 목표 혈압만 글로 남아 있고 LDL 목표치는 슬라이드 그림에만 있어 진료지침으로 확인함. 2021 AHA/ASA 뇌졸중 2차 예방 지침은 죽상경화성 뇌경색·TIA 후 LDL <70 mg/dL를 권고(Treat Stroke to Target 시험에서 <70 목표가 100±10보다 심혈관 사건을 줄임).", "B": "26 학습부 04번(검안) · 뇌혈관질환 1 · 진료지침(AHA/ASA 2021)", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "70", "vb": "교과서"}, {"id": "23-2Q-59", "keys": ["23-2Q-59", "22-2Q-48"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>27세 남자가 갑작스러운 두통과 어지럼증으로 응급실에 왔다. 신경학적 검사에서 운동기능은 괜찮았으나 다음과 같이 통증감각이 떨어진다고 하였다. 환자에서 뇌병변 부위에서 가장 가능성이 있는 부위를 영자 (좌,우측 포함 3단어)로 쓰시오.<\/div>", "o": [], "a": -1, "A": "right lateral medulla", "acc": ["right lateral medulla"], "E": "medulla의 통증 감각은 병변 동측에서 떨어진다는 걸 기억하면 그림에서 얼굴만 보고 쉽게 방향을 정할 수 있습니다. 과거 기출 해설 첨부합니다. 동측의 안면감각마비 및 반대측의 통각 및 온도각의 감각 소실을 증상으로 하는 lateral medullar infarction (Wallenberg syndrome)입니다. 전정로를 침범하여 어지럼과 안진이 나타나며 교감신경 침범 시에는 동측의 호르너 증후군도 나타납니다. Vertebral a.의 분지인 PICA 폐색 시 발생합니다. 과거 마로 출제되기도 했었고 매년 피마이므로 원인과 증상, 진단명까지 꼼꼼히 알아두시면 좋을 것 같습니다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/23-2Q-59.jpg"], "v": false, "y": [2022, 2023], "ok": true, "ra": "right lateral medulla", "vb": "검안"}, {"id": "22-2Q-49", "keys": ["22-2Q-49"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>다음은 혈관에서 혈전이 만들어지는 과정을 모식화 한 것이다. 조직인자에 의해 활성화된 혈액응고과정에서, 섬유소원이 섬유소로 전환할 때 영향을 주는 응고인자를 영자로 쓰시오 (1단어).<\/div>", "o": [], "a": -1, "A": "Thrombin", "acc": ["Thrombin"], "E": "교수님께서 피드백 시간에 강의안을 잘 보는지 확인하기 위해 내신 문제라고 하셨습니다. 수업에서는 언급하지 않으셨지만 21년도에 똑같이 출제하셨어서 어렵지 않게 풀 수 있었습니다. Thrombin은 fibrinogen을 fibrin으로 전환시킵니다.", "B": "26 학습부 04번(검안) · 뇌혈관질환 1", "N": "", "img": ["figs/22-2Q-49.jpg"], "v": false, "y": [2022], "ok": true, "ra": "Thrombin", "vb": "검안"}, {"id": "22-2Q-50", "keys": ["22-2Q-50"], "ch": 2, "g": "뇌혈관질환", "t": "s", "stem": "<div>77세 남자 환자가
