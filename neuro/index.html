ct은 사지 폄, tectospinal tract은 머리 위치 조절을 맡는다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022, 2025], "ok": true, "ra": "①", "vb": "검안"}, {"id": "25-13", "keys": ["25-13"], "ch": 9, "g": "운동장애", "stem": "<div>Brain reticular formation이 관여하는 기능이 아닌 것은?<\/div>", "o": ["Arousal", "coordination", "Muscle tone", "Pain", "Homeostasis"], "a": 1, "A": "②", "E": "뇌간 망상체는 의식(각성, 상행 망상체 활성계)에 가장 깊게 관여하고, reticulospinal tract으로 근긴장도·자세에 관여하며 통증 조절, 자율신경·항상성 유지에도 관여한다. Coordination(협조운동)은 소뇌의 핵심 기능으로 망상체 기능이 아니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 / 16번(검안) · 운동장애", "N": "통증 조절·항상성 관여는 강의 18 검안에 덧붙은 그물체 기능 자료로 확인", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-16", "keys": ["25-16"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병의 증상과 징후에 대한 설명이다. 적절한 표현은?<\/div>", "o": ["농촌거주자보다 도시거주자에 많이 발생된다.", "떨림은 주로 손, 머리, 목소리에서 주로 관찰된다.", "진전 서동증 등 운동 증상은 초기에는 일측성으로 관찰된다.", "도파민 신경세포 소실이 20-30% 정도 소실시 운동장애 현상을 일으킨다.", "사립체에서 호흡사슬복합체 I의 기능을 저해되어 주로 콜린세포 손상 초래된다."], "a": 2, "A": "③", "E": "파킨슨병 운동 증상(떨림·서동증·경직)은 한쪽에서 시작해 나중에 양쪽으로 퍼지는 asymmetric onset이 가장 중요한 특징이다. ① 농약·우물물 등으로 농촌이 도시보다 많고, ② 손·머리·목소리 떨림은 본태떨림이며 파킨슨 떨림은 손·다리에 주로 나타난다. ④ 도파민 세포가 약 80% 소실되어야 운동 증상이 나타나고, ⑤ 미토콘드리아 complex I 장애로 손상되는 것은 콜린세포가 아니라 도파민 세포다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-17", "keys": ["25-17"], "ch": 9, "g": "운동장애", "stem": "<div>불규칙한 움찔거리는(jerky) 불수의 운동이 신체의 여러 부분에서 불규칙(random)하고 순서로 나타나거나 한 부분에서 다른 부분으로 물 흐르듯이(flowing) 이동하는 이상 운동은?<\/div>", "o": ["진전", "무도증", "틱", "이긴장증", "연축"], "a": 1, "A": "②", "E": "무도증(chorea)은 짧고 불규칙한 움찔거리는 불수의 운동이 정해진 패턴 없이 신체 여러 부위에 무작위로 나타나거나 한 부위에서 다른 부위로 물 흐르듯(flowing) 끊임없이 이어지는 것이 핵심 특징이다. 진전은 규칙적 진동, 틱은 일시적 억제가 가능한 정형화된 운동, 이긴장증은 작용근·대항근 동시 수축에 의한 꼬인 자세다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "25-19", "keys": ["25-19"], "ch": 9, "g": "운동장애", "stem": "<div>MRI 소견에서 다음과 같은 소견이 관찰되며 경직과 운동완만은 파킨슨병과 비슷하나 자세 불안정과 안구의 수직운동장애가 특징인 비전형 파킨슨증은?<\/div>", "o": ["윌슨병", "진행핵상마비", "다계통위축", "겉질바닥핵변성", "Lewy소체치매"], "a": 1, "A": "②", "E": "경직·운동완만은 파킨슨병과 비슷하지만 초기부터 잘 넘어지고(자세 불안정) 안구 수직운동, 특히 하방주시가 안 되며 놀란 토끼눈 표정을 보이는 비전형 파킨슨증은 진행핵상마비(PSP)다. MRI에서 중뇌 위축으로 hummingbird sign이 보이며 tau 병리에 속한다. 다계통위축은 자율신경·소뇌 증상과 hot cross bun sign, 겉질바닥핵변성은 alien limb 현상이 특징이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": ["figs/25-19.jpg"], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-06", "keys": ["23-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜰 때는 중심을 잡으나 감으면 중심 잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "posterior column", "frontal lobe", "peripheral nerve"], "a": 2, "A": "③", "E": "Romberg 검사에서 눈을 뜨면 균형을 유지하지만 눈을 감으면 시각 보상이 사라져 넘어지는 경우(Romberg 양성)는 고유감각 경로인 후섬유단(posterior/dorsal column) 장애, 즉 sensory ataxia다. 소뇌 질환이면 눈을 뜨거나 감거나 모두 중심을 잡기 어렵다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-08", "keys": ["23-08"], "ch": 9, "g": "운동장애", "stem": "<div>뇌간에서 발생한 혈관 병변에 의해 환자의 팔다리에 광범위하고 심한 경축(rigidity)이 나타났다. 이 경축과 가장 관련이 높은 신경로는?<\/div>", "o": ["적색척수로(rubrospinal tract)", "덮개척수로(tectospinal tract)", "내측세로다발(Medial longitudinal fasciculus ; MLF)", "외측그물척수로(Lateral reticulospinal tract)", "외측진정척수로(Lateral vestibulospinal tract)"], "a": 4, "A": "⑤", "E": "팔다리 전체의 광범위하고 심한 경축은 대뇌제거경축(사지 모두 폄)에 해당하며, 사지 폄근을 항진시키는 lateral vestibulospinal tract의 과다 항진이 주된 원인이다. 상지 굽힘이 있는 피질제거경축이었다면 rubrospinal tract을 생각해야 하므로 rubrospinal tract(①)은 이 문제에서 오답이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-11", "keys": ["23-11"], "ch": 9, "g": "운동장애", "stem": "<div>Ankle clonus 영상. 다음 비디오와 같이 corticospinal tract 손상시 작용근과 대항근 관계의 근육 중 한 근육을 빠르게 펴면 작용근과 대항근이 번갈아 수축과 이완을 반복하는 현상이 나타나는데 이 경우 심부건 반사의 grade는?<\/div>", "o": ["0", "+", "++", "+++", "++++"], "a": 4, "A": "⑤", "E": "상위운동신경세포(corticospinal tract) 손상에서는 심부건반사가 항진되고 발목 클로누스가 나타난다. 근육을 빠르게 늘였을 때 작용근과 대항근이 율동적으로 수축·이완을 반복하는 클로누스는 심부건반사 등급에서 가장 높은 ++++로 기록한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "심부건반사 등급(++++=클로누스)은 강의 18 검안에 덧붙은 반사 등급표로 확인", "img": ["figs/23-11.jpg"], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-13", "keys": ["23-13"], "ch": 9, "g": "운동장애", "stem": "<div>말기 폐암 환자에서 우측 손과 발에서 겨냥이상과 의도떨림이 관찰되었다. 종양이 전이된 것으로 추정되는 곳은?<\/div>", "o": ["우측 소뇌 반구", "좌측 소뇌 반구", "우측 전두엽", "좌측 전두엽", "소뇌 중부"], "a": 0, "A": "①", "E": "오른쪽 손·발의 겨냥이상(dysmetria)과 의도떨림(intention tremor)은 소뇌반구 병변의 협조운동 장애다. 소뇌 병변의 증상은 같은 쪽에 나타나므로 우측 소뇌반구 전이를 의심한다. 전두엽 병변은 반대쪽 증상을, 소뇌 중부(충부) 병변은 주로 몸통 실조·평형 장애를 보인다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-30", "keys": ["23-30"], "ch": 9, "g": "운동장애", "stem": "<div>다음 video에서 관찰되는 운동은?<\/div><div>동영상 : 20231103111140261.mp4<\/div>", "o": ["떨림", "근긴장이상", "근간대경련", "무도증", "실조증"], "a": 1, "A": "②", "E": "근긴장이상(dystonia)은 작용근과 대항근의 지속적 동시 수축으로 힘이 센 쪽으로 몸이 뒤틀리며 꼬인 비정상 자세를 보이는 운동장애다. 영상에서 뒤틀린 자세가 관찰되어 근긴장이상에 해당한다. 떨림은 규칙적 진동, 근간대경련은 순간적인 충격 같은 움찔임, 무도증은 부위를 옮겨 다니는 흐르는 듯한 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "동영상 문항 — 영상 원본 없이 복원 설명 기준으로 판단", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-06", "keys": ["22-06"], "ch": 9, "g": "운동장애", "stem": "<div>두 발을 모은 상태에서 똑바로 서게 할 때, 눈을 뜨거나 감거나 중심잡기가 어려운 경우는 어느 부위 장애인가?<\/div>", "o": ["optic nerve", "cerebellum", "proprioception", "frontal lobe", "peripheral nerve"], "a": 1, "A": "②", "E": "Romberg 검사에서 눈을 뜨거나 감거나 모두 중심을 잡기 어려우면 소뇌 장애다. 눈을 뜨면 유지되지만 감으면 넘어지는 경우는 고유감각(후섬유단) 장애로 구분한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-07", "keys": ["22-07"], "ch": 9, "g": "운동장애", "stem": "<div>근긴장도 검사에서 옳은 사항은?<\/div>", "o": ["경축은 피라미드질환에서 자주 관찰된다.", "경직은 관절 움직임 진찰 시작에서 끝까지 저항이 고루 느껴진다.", "경축은 upper motor neuron 손상에서 관찰되며 반사항진이 동반된다.", "경직은 상지에서 폄근(extensor) 하지에서 굽힘근(flexor)에서 더 잘 관찰된다.", "파킨슨병에서 관절 운동검사에서 톱니바퀴가가 맞물려 돌아가는 경축이 관찰된다."], "a": 4, "A": "⑤", "E": "경축(rigidity)은 바닥핵(추체외로) 병변에서 관절 운동 범위 전체에 걸쳐 저항이 일정하며, 파킨슨병에서는 떨림이 겹쳐 톱니바퀴가 걸리듯 끊기는 cogwheel rigidity가 나타난다. 경직(spasticity)은 상위운동신경세포(추체로) 손상에서 반사 항진과 함께 처음 저항이 크다가 갑자기 풀리는 clasp-knife 양상을 보이며 상지 굽힘근·하지 폄근에서 두드러진다. 따라서 ①~④는 경축과 경직을 바꾸어 쓴 오답이다.", "B": "26 학습부 16번(검안) · 운동장애 / 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-09", "keys": ["22-09"], "ch": 9, "g": "운동장애", "stem": "<div>본태떨림을 의심할 수 있는 흔한 떨림 부위는?<\/div>", "o": ["손, 다리, 머리", "손, 목소리, 턱", "다리, 머리, 턱", "손, 목소리, 다리", "손, 목소리, 머리"], "a": 4, "A": "⑤", "E": "본태떨림은 주로 팔을 들거나 자세를 유지할 때 나타나는 양측·대칭성 자세떨림으로 손(상지)에 가장 흔하고 머리와 목소리에도 잘 나타난다. 다리는 잘 떨지 않으며, 손·다리 떨림은 파킨슨 떨림의 분포다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-12", "keys": ["22-12"], "ch": 9, "g": "운동장애", "stem": "<div>다음 운동장애의 이름은?<\/div><div>동영상 : 20221102085855337.mp4<\/div>", "o": ["틱", "진전", "무도증", "이긴장증", "근간대경련"], "a": 3, "A": "④", "E": "평소 검진에서는 이상이 없다가 글씨 쓰기 같은 특정 동작을 할 때만 손이 굳어 수행이 어려운 것은 특정 과제로 유발되는 국소 근긴장이상(writer's cramp, limb dystonia)이다. 틱·무도증·근간대경련·진전은 특정 과제와 무관하게 나타나는 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "동영상 문항 — 영상 원본 없이 복원 설명 기준으로 판단", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "21-06", "keys": ["21-06"], "ch": 9, "g": "운동장애", "stem": "<div>근육긴장이상을 보인 신체 부분에 감각자극을 줄 경우 근육긴장이상이 일시적으로 호전되는 현상은?<\/div>", "o": ["torticollis", "athetosis", "focal dystonia", "sensory trick", "psychogenic tremor"], "a": 3, "A": "④", "E": "근긴장이상 부위에 일정한 감각 자극(예: 목 뒤나 턱을 손으로 만짐)을 주면 근긴장이상이 일시적으로 호전되는 현상을 sensory trick(gestes antagonistes, 감각계교)이라 하며 근긴장이상을 강하게 시사하는 소견이다. torticollis는 경부 근긴장이상, focal dystonia는 국소 근긴장이상이라는 분류 이름이고 athetosis는 느리게 꿈틀거리는 운동이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-14", "keys": ["20-14"], "ch": 9, "g": "운동장애", "stem": "<div>파킨슨병(PD)과 진행성핵상마비(PSP)를 감별하는 가장 특징적인 임상소견은?<\/div>", "o": ["tremor", "bradykinesia", "rigidity", "impaired upward conjugate gaze", "impaired downward conjugate gaze"], "a": 4, "A": "⑤", "E": "진행핵상마비(PSP)는 파킨슨병처럼 서동증·경직이 있지만 안구 수직운동, 특히 하방주시(downward gaze)가 가장 먼저·두드러지게 장애되고 초기부터 잘 넘어진다. 따라서 파킨슨 증상 환자에서는 안구운동을 반드시 확인해야 한다. 떨림·서동증·경직은 두 질환에 공통이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-20", "keys": ["25-20", "23-2Q-28"], "ch": 9, "g": "운동장애", "t": "s", "stem": "<div>근긴장이상이 있는 신체부분에 일정한 감각자극을 주면 근긴장이상이 일시적으로 호전되는 특징적인 현상은?<\/div>", "o": [], "a": -1, "A": "감각계교 / sensory trick", "acc": ["감각계교", "sensory trick"], "E": "매년 똑같이 기출되는 문제입니다. 아래 이론 참고해주시면 되겠습니다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2023, 2025], "ok": true, "ra": "감각계교 / sensory trick", "vb": "검안"}, {"id": "25-21", "keys": ["25-21"], "ch": 9, "g": "운동장애", "t": "s", "stem": "<div>Wilson병이 의심되는 환자에서 진단의 강력한 근거가 되는 눈 징후는?<\/div>", "o": [], "a": -1, "A": "카이셔 플라이셔 고리 / 카이셔-플라이셔 고리", "acc": ["Kayser-Fleischer ring", "카이저-플라이셔 고리", "카이셔-플라이셔 고리", "Kayser Fleischer"], "E": "이 문제 역시 매년 똑같이 기출되는 문제입니다. 스펠링 진짜 외우기 힘든데, 올해는 한글까지 전부 정답 처리 해주셨습니다. 참고하시면 되겠습니다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "카이셔 플라이셔 고리 / 카이셔-플라이셔 고리", "vb": "검안"}, {"id": "23-2Q-29", "keys": ["23-2Q-29", "22-2Q-51"], "ch": 9, "g": "운동장애", "t": "s", "stem": "<div>파킨슨병 환자의 변성이 발생한 흑질부위에서 발견되는 세포 내 포함체의 이름은?<\/div>", "o": [], "a": -1, "A": "루이소체, 레비소체, Lewy body", "acc": ["Lewy body", "루이소체", "레비소체"], "E": "파킨슨병에서 발견되는 세포 내 포함체는 루이소체입니다. 김후원 교수님께서도 강조하신 부분이고 앞서 1큐에서도 나왔던 부분이니 꼭 기억해주세요.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "루이소체, 레비소체, Lewy body", "vb": "검안"}, {"id": "22-2Q-52", "keys": ["22-2Q-52"], "ch": 9, "g": "운동장애", "t": "s", "stem": "<div>특발성 진전증의 가장 대표적인 치료약물 2개를 쓰시오.<\/div>", "o": [], "a": -1, "A": "Primidone, Propranolol", "acc": [], "E": "특발성 진전증(Essential tremor)의 일차 선택 약물은 propranolol과 primidone입니다. 이 중 propranolol은 천식과 심질환 환자에서 주의해야 합니다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "Primidone, Propranolol", "vb": "검안"}, {"id": "25-12", "keys": ["25-12"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>다음 중 Glasgow coma scale의 최저 점수는?<\/div>", "o": ["0", "1", "2", "3", "4"], "a": 3, "A": "④", "E": "Glasgow coma scale은 눈뜨기(1~4점), 운동 반응(1~6점), 언어 반응(1~5점) 세 항목의 합으로, 각 항목의 최저점이 1점이므로 최저 점수는 3점, 최고(정상)는 15점이다. 최소점이 0점이 아니라는 점을 강의에서 반복 강조했다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-07", "keys": ["23-07"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 4, "A": "⑤", "E": "Ciliospinal reflex는 목(SCM 부위) 피부를 꼬집으면 경신경과 제1흉수 중간외측핵의 교감신경을 거쳐 같은 쪽 동공이 커지는 반사다. 구심·원심 경로가 모두 척수에 있어 뇌간이 아닌 척수 기능을 평가하는 반사이므로 답은 척수다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-09", "keys": ["23-09"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>57세 여자가 복시와 오른눈의 안검하수 동공 확장 및 아래 바깥으로 편위된 안구를 보이며 원근 조절반사 장애를 보이는 경우 이 환자의 병변의 부위는?<\/div>", "o": ["oculomotor nerve", "trochlear nerve", "abducens nerve", "superior colliculus", "lateral tegmentum"], "a": 0, "A": "①", "E": "복시, 같은 쪽 안검하수, 동공 확대, 안구의 외하방 편위, 조절반사 장애는 외직근(CN VI)·상사근(CN IV)을 제외한 외안근과 부교감 섬유를 지배하는 동안신경(CN III) 마비 소견이다. 활차신경 마비는 하방 주시 시 수직 복시, 외전신경 마비는 외전 장애만 보인다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-10", "keys": ["23-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>전정 기능검사 중 바른 사항은?<\/div>", "o": ["머리 회전운동에 대해 눈의 움직임이 고정되어 있으면 정상이다.", "혼수 환자에서 인형눈현상이 정상이면 대사질환의 가능성이 크다.", "인형안현상의 구심신경은 안구운동에 관여하는 신경이며 원심신경은 전정신경이다.", "혼수 환자에서 머리회전의 반대 방향으로 편위되면 뇌 줄기의 기질적 이상을 시사한다.", "온도안진검사의 평가는 정상의 경우 온수로 자극시 자극 반대 방향으로 향하는 안진이, 냉수로 지극시 동측으로 향하는 안진이 관찰된다."], "a": 1, "A": "②", "E": "인형눈현상(oculocephalic reflex)이 정상이면(머리를 돌린 반대 방향으로 눈이 감) 뇌간 기능이 보존된 것이므로 혼수 원인으로 구조적 뇌간 병변보다 대사성 원인 가능성이 크다. ① 눈이 고정되어 머리와 함께 돌아가면 비정상, ③ 구심신경이 전정신경이고 원심신경이 안구운동신경, ④ 머리 회전과 같은 방향으로 편위될 때 뇌간 이상, ⑤ 정상에서는 냉수 자극 시 반대쪽, 온수 자극 시 같은 쪽으로 안진이 향한다(COWS).", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-03", "keys": ["22-03"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>67세 남자가 의식저하로 응급실에 왔다. 호흡은 과호흡을 보이고, 양측 동공은 6mm로 대광반사가 소실되 었고, oculocephalic reflex에서 안구의 움직임이 없고, 다음과 같은 자세로 누워 있었다. 병변으로 추정되는 부위는?<\/div>", "o": ["pons", "midbrain", "lower medulla", "diencephalon", "upper medulla"], "a": 1, "A": "②", "E": "과호흡(중추성 신경인성 과호흡), 양측 6mm로 커지고 대광반사가 없는 동공, 인형눈반사 소실, 사지 모두 신전된 대뇌제거경축 자세는 rostro-caudal deterioration의 중뇌(midbrain) 단계 소견이다. 동공이 커지고 고정된 것은 중뇌 동안신경핵 손상을 시사한다. pons 병변은 바늘끝 동공, 연수 병변은 실조성 호흡·무호흡, 사이뇌 병변은 Cheyne-Stokes 호흡·작은 반응성 동공·피질제거경축을 보인다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "복원 답 ①과 다름 — 2026년 강의 기준 ②", "img": ["figs/22-03.jpg"], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "22-04", "keys": ["22-04"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>뇌사 판정의 진찰에 포함되는 ciliospinal reflex에서 확인되는 중추신경부위는?<\/div>", "o": ["간뇌", "중뇌", "뇌교", "연수", "척수"], "a": 4, "A": "⑤", "E": "Ciliospinal reflex는 목 피부 자극이 경신경과 제1흉수 중간외측핵의 교감신경을 거쳐 같은 쪽 동공을 확대시키는 반사로, 경로가 척수에 있어 척수 기능을 확인하는 반사다. 2023년에 같은 문항이 척수를 정답으로 출제되었고 2026년 강의 자료도 뇌가 아닌 척수를 평가하는 반사라고 정리한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "복원 답 ②과 다름 — 2026년 강의 기준 ⑤", "img": [], "v": false, "y": [2022], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-10", "keys": ["22-10"], "ch": 9, "g": "혼수·의식장애", "stem": "<div>섬망에 대한 임상적 특징으로 올바른 것은?<\/div>", "o": ["집중력은 잘 유지된다", "증세 변동이 흔하지 않다", "비교적 지속적으로 나타난다", "자율신경계 이상증상이 흔하다", "서서히 시작하는 경우가 대부분이다"], "a": 3, "A": "④", "E": "섬망(delirium)은 혼동이 더 심해진 상태로 갑자기 발생하고 하루 중 증상 변동이 크며 주의력·지남력 저하, 불안·흥분, 환각, 안절부절을 보이고 빈맥·발한 등 자율신경계 이상이 흔하다. 따라서 집중력 유지(①), 변동이 적음(②), 지속적(③), 서서히 시작(⑤)은 모두 틀린 설명이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "급성 발생·변동성·자율신경 증상은 강의 18 검안에 덧붙은 섬망 자료로 확인", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "23-15-s", "keys": ["23-15"], "ch": 9, "g": "혼수·의식장애", "t": "s", "stem": "<div>가까운 대상을 명확히 보기 위한 렌즈의 반사 능력을 변화시키는 과정인 조절(accomodation)반사 or 근접반사 나타나는 현상으로 렌즈의 굽이(curvature) 증가, 동공수축과 더불어 나타나는 현상은?<\/div>", "o": [], "a": -1, "A": "눈모음, convergence", "acc": ["눈모음", "convergence"], "E": "전혀 가르치지 않으신 곳에서 나왔습니다.. 무려 정답률 0%입니다.. 답은 피드백 때 답을 보여주신대로 적었습니다. 영어와 한글 둘 중 하나만 쓰면 정답으로 인정됩니다. 어디서 나온 문제인가 하여 찾아보니 감각계학의 안과 파트에서 잠깐 언급하고 넘어가십니다. 해당 부분 감각계학 이론 싣겠습니다. 2) 이향운동 (vergence, disjugate movement) : 두 눈이 반대 방향으로 운동", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "눈모음, convergence", "vb": "검안"}, {"id": "22-42", "keys": ["22-42"], "ch": 9, "g": "혼수·의식장애", "t": "s", "stem": "<div>외부자극 없이도 각성수준은 유지되나 사고가 부적절하고 주의력과 지남력이 떨어지고 심한 과다 활동과 생생한 환각이 자주 동반되는 의식 상태는?<\/div>", "o": [], "a": -1, "A": "섬망", "acc": ["섬망"], "E": "각성수준은 유지되지만 부적절한 사고, 주의력 지남력 떨어짐, 심한 과다 활동과 환각이 자주 동반되는 의식상태는 섬망입니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "섬망", "vb": "검안"}, {"id": "25-04", "keys": ["25-04"], "ch": 9, "g": "신경학적 검사", "stem": "<div>환자가 반대 측 반신마비와 함께 동측 내측주시마비를 보일 때 병변은 어디에 위치하는가?<\/div>", "o": ["연수(medulla)", "간뇌(diencepahalon)", "중뇌(midbrain)", "입쪽교뇌(rostral pons)", "꼬리쪽 교뇌(caudal pons)"], "a": 2, "A": "③", "E": "반대쪽 반신마비는 교차 전 피라미드로(대뇌다리) 손상, 같은 쪽 내측주시마비는 내직근을 지배하는 동안신경(CN III) 손상을 뜻한다. 동안신경핵과 신경 섬유가 대뇌다리를 지나는 곳은 중뇌이므로 병변은 중뇌(Weber 증후군)다. 교뇌 병변은 외전신경·안면신경 증상을, 연수 병변은 하부 뇌신경 증상을 동반한다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단 · 웹 자료(교과서)", "N": "Weber 증후군 자체는 강의 자료에 없어 동안신경 해부·피라미드로 내용과 교과서 지식으로 판단", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-05", "keys": ["25-05"], "ch": 9, "g": "신경학적 검사", "stem": "<div>일반적으로 반대쪽의 모든 기본 감각에 손상을 보일수 있고 감각이상이나 감각저하, 감각과민 등을 보일 수 있는 병터는?<\/div>", "o": ["마루터 병터", "시상 병터", "뇌줄기 병터", "척수 병터", "신경뿌리 병터"], "a": 1, "A": "②", "E": "시상은 모든 감각정보가 거쳐가는 sensory centor입니다. 고유감각을 관장하는 dorsal column pathway와 pain, temperature를 관장하는 spinothalamic tract 모두 thalamus를 거쳐 cortex로 정보를 전달합니다. 이전까지는 기본 감각에 이상이 없다는 것을 전제, 손에 쥔 동전 등을 인식하지 못하는 대뇌 피질의 문제인 Agnosia에 대해 주로 출제하셨는데, 기본 감각 자체에 대해 물어보신 문제는 처음입니다. 2026 강의 18 검안본에는 이 문항이 없어 교과서로 확인함. 시상(VPL·VPM)은 후섬유단과 척수시상로가 모두 거쳐 가는 중계핵이라, 병변 시 반대쪽 얼굴·몸통·팔다리의 모든 기본 감각이 저하되고 이후 감각과민·통증(Dejerine-Roussy 증후군)이 올 수 있다. 마루엽 병변은 기본 감각은 보존되고 피질 감각(입체인지 등)이 떨어진다.", "B": "교과서·의학 자료 · 강의 18 범위(감각 경로)", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "②", "vb": "교과서"}, {"id": "25-10", "keys": ["25-10"], "ch": 9, "g": "신경학적 검사", "stem": "<div>혈중 이산화탄소의 농도에 따라 숨을 몰아 쉬다가는 일시적으로 숨이 멎는 호흡을 주기적으로 할 때, 병변부위는?<\/div>", "o": ["medulla", "midbrain", "basis pontis", "tegmentum pontis", "forebrain"], "a": 4, "A": "⑤", "E": "혈중 CO2 농도에 따라 과호흡과 무호흡이 점강-감쇠 양상으로 주기적으로 반복되는 호흡은 Cheyne-Stokes 호흡이다. 병터는 양쪽 대뇌반구와 사이뇌(또는 대사성 원인)이며, 사이뇌는 앞뇌(forebrain)에 속하므로 답은 forebrain이다. 중추성 신경인성 과호흡은 중뇌·교뇌, 지속흡식호흡은 하부 교뇌, 실조성 호흡은 연수 병변이다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-18", "keys": ["25-18"], "ch": 9, "g": "신경학적 검사", "stem": "<div>당뇨 고혈압 고지혈증 약을 투약중인 62세 남자가 우측 팔 다리의 거칠고 불수의적인 빠른 움직임을 보여 응급실로 내원하였다. 이 환자의 증상을 설명할 수 있는 병변은?<\/div>", "o": ["Ipsilateral subthalamic nucleus(STN)", "Ipsilateral medulla", "Contralateral STN", "Contralateral medulla", "Ipsilateral frontal lobe"], "a": 2, "A": "③", "E": "당뇨 등 대사 이상이 있는 노인에서 갑자기 한쪽 팔다리가 크고 거칠게 휘젓듯 움직이는 것은 hemiballism이다. 무도증이 사지 근위부에 크고 격렬하게 나타난 형태로 시상밑핵(subthalamic nucleus) 병변이 원인이며, 바닥핵 회로의 증상은 반대쪽에 나타나므로 우측 증상이면 반대쪽(좌측) STN 병변이다.", "B": "26 학습부 16번(검안) · 운동장애", "N": "강의 18번 자료가 아닌 16번(운동장애) 2026 자료로 검증", "img": [], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-12", "keys": ["23-12"], "ch": 9, "g": "신경학적 검사", "stem": "<div>의삭장애 환자에서 짧은 주기로 무호흡과 과호흡이 점강-감쇠 양상으로 반복되는 호흡 패턴을 보이는 경우 가장 많은 병터는?<\/div>", "o": ["연수", "사이뇌", "하부교뇌", "중뇌와 교뇌", "하부교뇌와 상부연수"], "a": 1, "A": "②", "E": "짧은 주기로 과호흡과 무호흡이 점강-감쇠 양상을 반복하는 호흡은 Cheyne-Stokes 호흡이며, 병터는 양쪽 대뇌반구와 사이뇌(또는 대사성 원인)다. 연수는 실조성 호흡, 하부 교뇌는 지속흡식호흡, 중뇌·교뇌는 중추성 신경인성 과호흡, 하부 교뇌·상부 연수는 군발호흡과 연관된다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-08", "keys": ["22-08"], "ch": 9, "g": "신경학적 검사", "stem": "<div>Foster-kennedy 증후군 에 대한 기술 중 옳지 않은 사항은?<\/div>", "o": ["후각상실증을 나타낸다.", "종양과 같은 쪽에 후각상실증 나타낸다.", "종양의 반대 측에 유두부종을 나타낸다.", "종양의 반대 측에 시신경위축을 나타낸다.", "전두엽 하부의 수막종에 의해 드물게 발생한다."], "a": 3, "A": "④", "E": "Foster-kennedy syndrome은 ➄frontal lobe base의 문제로 ➁동측의 ➀후각장애, 동측의 visual atrophy, ➃ 동측의 optic atrophy ➂반대측의 papilledema를 보입니다. 따라서 종양의 반대 측에 시신경위축을 나타낸다는 ➃번이 틀린 보기입니다. 2026 강의 18(검안) 기출 정리에 같은 문항과 해설이 실려 있음.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-09", "keys": ["25-09"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>소리굽쇠를 울린 후 피검자의 우측 mastoid process에 접촉시켜 놓은 후 소리가 안울린다고 할 때 즉시 소리굽쇠를 우측 외이도 입구로 옮겨 소리가 들리는지를 확인하는 검사는 무슨 검사인가?<\/div>", "o": [], "a": -1, "A": "Rinne test / 린네 테스트", "acc": ["린네 테스트", "Rinne test"], "E": "tuning fork를 진동시켜 mastoid process(bone conduction)에 올려놓고 더 이상 들리지 않을 때, 소리굽쇠를 동측 귀 가까이 대어(air conduction) 들리는지 물어보는 검사를 Rinne test라고 합니다. 정상인에게는 공기전도가 뼈전도보다 오래 지속되므로 소리가 안 들린다고 하는 시점에서 즉시 소리굽쇠를 외이도 입구에 옮기면 소리가 계속 들리게 됩니다. 이를 ‘Rinne 양성’이라고 합니다. 그러나 전도난청인 경우 공기전도시간이 뼈전도시간보다 짧아지게 되어 ‘Rinne 음성’이 됩니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "Rinne test / 린네 테스트", "vb": "검안"}, {"id": "25-14", "keys": ["25-14"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>환자는 외부 환경을 완벽히 인식할 수 있으나 양쪽 배쪽교뇌 의 손상으로 하위뇌신경과 사지가 마비된 상태는?<\/div>", "o": [], "a": -1, "A": "감금증후군 / Locked-in syndrome", "acc": ["감금증후군", "locked-in syndrome", "lock in syndrome"], "E": "작년과 동일한 문제가 출제되었습니다. pons base 또는 midbrain peduncle의 병변으로 efferent motor pathway의 양측성 침범으로 움직일 수는 없지만 감각은 살아 있는 상태를 감금중후군(Lock-in syndrome)이라고 합니다. 식물인간(vegetative state)와의 차이점도 잘 알아두시면 좋을 것 같습니다. Vegetative state – Awakeness without awareness Lock-in syndrome – Awareness O, Cognition O", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "감금증후군 / Locked-in syndrome", "vb": "검안"}, {"id": "25-15", "keys": ["25-15"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>수동적으로 머리를 좌우로 돌려 검사할 때 두 눈은 모두 머리를 돌린 반대방향으로 돌아가는 것이 정상인 검사의 이름은?<\/div>", "o": [], "a": -1, "A": "인형눈검사 / 인형안검사 / Doll's eye maneuver / 눈머리반사 / oculocephalic reflex", "acc": ["눈머리반사", "인형안검사", "인형눈검사", "Doll's eye maneuver", "oculocephalic reflex"], "E": "고개를 돌릴 때 눈이 고개를 돌리는 방향과 반대 방향으로 가는지 확인해 뇌줄기(brainstem) 기능을 평가하는 검사가 Doll's eye maneuver(oculocephalic reflex)입니다. 뇌줄기에 문제가 있으면 눈이 고개를 돌리는 방향과 같은 방향으로 갑니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "인형눈검사 / 인형안검사 / Doll's eye maneuver / 눈머리반사 / oculocephalic reflex", "vb": "검안"}, {"id": "23-14", "keys": ["23-14"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>환자는 깨어있어 주위 환경을 완벽히 인식하지만, 양쪽 배쪽교뇌 손상으로 하위 뇌신경과 사지가 마비되어 수직안구운동과 눈깜빡임으로 외부와 소통하는 상태는?<\/div>", "o": [], "a": -1, "A": "lock in syndrome, 감금증후군", "acc": ["감금증후군", "locked-in syndrome", "lock in syndrome"], "E": "감금증후군이란, pons base 또는 midbrain peduncle 병변으로 efferent motor pathway의 양측성 침범으로 발생합니다. 식물인간은 의식은 있지만 주위를 ‘인식’할 수 없으나, 감금증후군은 의식도 있고 주위를 ‘인식’할 수도 있습니다. 하지만 움직일수가 없고 수직 안구운동 및 눈 깜빡거림을 제외한 모든 motor function이 기능하지 않습니다. 따라서 답은 lock in syndrome, 감금증후군입니다. 답은 영어나 한글 둘 중에 하나로 아무거나 쓰면 정답으로 인정되었습니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "lock in syndrome, 감금증후군", "vb": "검안"}, {"id": "23-16-s", "keys": ["23-16"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>반신마비가 약하게 있는 경우에 손바닥을 위로 하고 팔을 펴서 눈을 감게 하면 약한 쪽 손이 서서히 처지거나 손바닥이 아래로 향하게 되는 징후는?<\/div>", "o": [], "a": -1, "A": "엎침처짐징후, pronator drift sign, pronator drift", "acc": ["엎침처짐징후", "pronator drift", "pronator drift sign"], "E": "운동계 검사에서 근육이 마비된 정도를 나타내는 지표는 MRC grade입니다. 피검자에게 눈을 감고 손과 팔을 앞으로 뻗어 손바닥이 위로 향하게 supination 되도록 유지시킵니다. 근력 약화가 있으면 약한 쪽의 팔이 아래로 떨어지고 pronation 되는데, 이를 pronator drift라고 하며 MRC grage 4에 해당합니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "엎침처짐징후, pronator drift sign, pronator drift", "vb": "검안"}, {"id": "23-17-s", "keys": ["23-17"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>안면 신경마비 환자에게서 중추성과 말초성을 구분하기 위해 외래에서 시행하는 검사는?<\/div>", "o": [], "a": -1, "A": "이마에 주름잡기", "acc": ["이마에 주름잡기"], "E": "안면신경(facial nerve) 마비 시 central or peripheral 마비인지 감별하기 위해 이마 주름잡기를 시행합니다. central type인 경우 이마로 가는 안면 신경은 양측에서 지배하므로 한쪽이 마비되었다 하더라도 다른 쪽에서 지배하므로 양측 모두 이마 주름잡기가 가능합니다. peripheral type은 양측에서 오는 모든 신경이 한쪽으로 모여있는 루트에서 손상이 생겨 마비되었으므로 병변쪽 이마 주름잡기가 불가능합니다. 이 문제도 고대야마에서 출제되었습니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "이마에 주름잡기", "vb": "검안"}, {"id": "22-43", "keys": ["22-43"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>뇌손상이 발생한 시점을 기준으로 발병 전의 사건을 기억하지 못하는 기억장애는?<\/div>", "o": [], "a": -1, "A": "역행성 기억상실", "acc": ["역행성 기억상실"], "E": "역핵성 기억상실(Retrograde amnesia):뇌손상 시점 기준 이전 사건 기억상실 선행성 기억상실(Anterograde amnesia):뇌손상 시점 기준 이후 사건 기억상실", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "역행성 기억상실", "vb": "검안"}, {"id": "22-44", "keys": ["22-44"], "ch": 9, "g": "신경학적 검사", "t": "s", "stem": "<div>거짓국소화징후의 대표적인 외전신경장애가 흔한 원인은?<\/div>", "o": [], "a": -1, "A": "두개 내 긴 주행경로를 가지기 때문", "acc": [], "E": "외전신경은 두 개 내 긴 주행경로를 가지기 때문에 간접적인 원인에 의해 국소징후가 잘 나타납니다. 신경 자체의 병터가 아닌 간접적인 원인에 의해 마비가 일어나므로 거짓국소화징후라고 합니다.", "B": "26 학습부 18번(검안) · 신경학적 검사 혼수진단", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "두개 내 긴 주행경로를 가지기 때문", "vb": "검안"}, {"id": "25-40", "keys": ["25-40"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>다음은 두부 손상의 진단에 대한 설명이다. 다음 설명 중 옳은 것을 고르시오.<\/div>", "o": ["단순 방사선촬영을 통해서는 두개골의 선상골절을 확인하기 어렵다.", "전산화 단층촬영(CT)를 통해서는 급성 뇌출혈과 같은 병변을 자세히 확인하기 어렵다.", "자기공명영상(MRI)은 전산화 단층촬영(CT)에 비해 뇌실질의 병변을 예민하게 발견할 수 없는 검사이다.", "자발적으로 눈을 뜨고, 적절하고 지남력이 있는 언어반응을 보이며, 명령에 따르는 운동반응을 보인다면, 글라스고우 혼수계수(Glasgow coma scale) 평가에서 총 15점에 해당한다.", "의식 수준 평가에서 반혼수는 외부 자극에 눈을 감거나, 자극부위로 손을 움직이는 등의 간단한 행동을 보이는 상태를 뜻한다."], "a": 3, "A": "④", "E": "GCS는 눈 뜨기(자발적 4점)·언어반응(지남력 있음 5점)·운동반응(명령 수행 6점)을 더하므로 세 항목이 모두 최고점이면 15점이다(④ 정답). ① 두개관의 선상골절은 단순 방사선촬영으로도 잘 보인다. ② CT는 급성 두부 손상에서 가장 먼저 하는 검사로 급성 출혈을 빠르게 확인한다. ③ MRI는 CT보다 뇌실질 미세 병변(미만성 축삭손상 등)에 더 민감하다. ⑤ 자극 부위로 손을 가져가는(localization) 반응은 혼미(stupor)이고, 반혼수는 localization 없이 굴곡·신전 정도의 반응만 남은 상태다.", "B": "26 학습부 21번(검안) · 외상(두부, 척추)", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-41", "keys": ["25-41"], "ch": 10, "g": "두부·척추 외상", "stem": "<div>65세 남자가 의식이 없는 상태로 응급실로 내원하였다. 의식 수준 평가에서 반혼수(Semicoma)에 해당되었고, 두부 전산화 단층촬영 검사를 시행한 결과 다음 그림과 같다. 다음 질환에 대한 설명 중 옳은 것을 고르시오.<\/div>", "o": ["적절한 치료를 받는다면 예후가 좋은 편이다.", "생존한 경우 심각한 후유증 없이 회복되는 경우가 많다.", "주로 외력에 의해 발생하고 뇌실질 표면의 혈관이 손상된 경우가 많다.", "두부 전산화 단층촬영에서 볼록한 렌즈 모양의 고밀도 음영을 확인할 수 있다.", "의식상태가 나쁘지만 수술적 치료보다는 보존적 치료를 시행하는 것이 좋다."], "a": 2, "A": "③", "E": "반혼수 환자에서 대뇌 표면을 따라 퍼지는 초승달 모양 고밀도 병변은 급성 경막하혈종이다. 외상으로 교정맥이나 피질 혈관 등 뇌 표면 혈관이 손상되어 생긴다(③ 정답). ①② 뇌좌상 등 기저 뇌실질 손상이 동반되어 경막외혈종보다 예후가 나쁘고 생존해도 후유장애가 크다. ④ 볼록 렌즈 모양은 경막외혈종이다. ⑤ 의식 저하나 정중선 편위(두께 >10 mm 또는 편위 >5 mm)가 있으면 굳은 혈종을 빨리 제거하기 위해 응급 개두술을 한다.", "B": "26 학습부 21번(검안) · 외상(두부, 척추)", "N": "", "img": ["figs/25-41.jpg"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-42", "keys": ["25-42"], "ch": 10, "g": "두부·척추 외상", "t": "s", "stem": "<div>척추는 경추, 흉추, 요추, 천추, 미추로 이루어져 있다. 척추를 구성하는 뼈는 모두 몇 개인가?<\/div>", "o": [], "a": -1, "A": "24개", "acc": ["24개"], "E": "서종훈 교수님께서 처음 출제하시는 문제였습니다. 저는 경추 7개 흉추 12개 요추 5개 천추 5개 미추 4개 라는 생각에 33개라고 답을 적었는데요..? 척추 및 척수손상 2026 강의 21 검안본에 언급이 없다. 해부학적으로 척추뼈는 출생 시 33개(경7·흉12·요5·천5·미4)이고 성인은 천추·미추가 각각 하나로 붙어 26개로 센다. 교수님 2025 피드백 답은 '움직이는 척추뼈' 기준 24개(경7+흉12+요5)여서 복원 답을 유지하되, 시험에서는 문제 문구를 보고 판단할 것.", "B": "교과서(해부학) · 2025 피드백 답", "N": "해부학적 개수(33개, 성인 26개)와 다름 — 2025 피드백 답 24개(움직이는 척추뼈) 유지", "img": [], "v": false, "y": [2025], "ok": true, "ra": "24개", "vb": "교과서"}, {"id": "23-16", "keys": ["23-16"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>60세 남자. 5년 전부터 서서히 계단 오르는 것이 힘들어서 내원하였다. 신경계 진찰시 손가락 및 손목 굽힘근 (finger and wrist flexors muscle)과 넙다리네갈래근 (quadriceps femoris muscle)이 양쪽 모두에서 근력이 감소되었으나 우측이 더 심하였다. 혈액 검사에서 CK 수치가 54U/L였고, 근전도 검사에서는 크기가 작은 활동근전위가 관찰 되었다. 다음은 근육조직검사 결과이다. 진단은?<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "면역-연관 괴사성근염"], "a": 1, "A": "②", "E": "고령 남성에서 수년에 걸쳐 서서히 진행하고, 손가락·손목 굽힘근과 넙다리네갈래근을 비대칭적으로 먼저 침범하는 것은 포함체근염(sIBM)의 전형이다. 진행이 느려 CK 상승이 경미하고, 근생검에서 근섬유 안의 vacuole과 근내막(endomysium) 염증세포 침윤이 특징이다. 피부근염은 피부 발진과 혈관 주위 염증·perifascicular atrophy, 면역-연관 괴사성근염은 매우 높은 CK와 근섬유 괴사가 특징이다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": ["figs/23-16.jpg"], "v": false, "y": [2023], "ok": true, "ra": "②", "vb": "검안"}, {"id": "22-34", "keys": ["22-34", "21-34"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>52세 남자 환자가 약 3개월전부터 발생하여 서서히 진행하는 상하지 근력 저하 주소로 내원하였다. 평지를 걸을 때는 비교적 괜찮았으나, 계단을 오 르고 내릴 때 특히 불편감이 있었으며, 2개월 전부터는 양측 손톱을 스스 로 자를 수 없었다고 한다. 양측 손발의 저린감도 있었다. 신경학적 검사에 서 양측 상하지에서 비교적 대칭적인 근력 저하 및 양측 상하지 원위부에 서 경미한 감각저하가 확인되었다. 상하지 심부건반사는 소실되었다. 신경 전도검사에서 탈수초성 운동-감각 다발신경병증 소견이 보였으며, 뇌척수 액 검사 소견상 세포수는 2/mm3, 단백은 73mg/dL의 소견을 보였으며, 당화혈색소를 포함한 혈액 검사는 모두 정상이였다. 진단은?<\/div>", "o": ["중증근무력증", "저칼륨주기마비", "길랑-바레 증후군", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 4, "A": "⑤", "E": "3개월에 걸쳐 서서히 진행한 대칭성 근위부·원위부 근력 저하와 원위부 감각 저하, 심부건반사 소실, 신경전도검사의 탈수초성 운동-감각 다발신경병증, 뇌척수액 단백 증가(세포수 정상)는 CIDP에 해당한다. CIDP는 GBS와 양상이 비슷하지만 8주 이상 진행하거나 재발하는 만성 경과가 다르다(GBS는 4주 이내 진행). 중증근무력증·주기마비는 건반사 소실과 감각 저하를 설명하지 못하고, ALS는 감각이 정상이며 반사가 항진된다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2021, 2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "22-37", "keys": ["22-37", "21-45", "20-39"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>32세 남자 환자가 주먹을 쥐고 나서 잘 펴지지 않는 증상을 주소로 내원하 였다. 이 증상은 10대 후반부터 발생하였으며, 최근 들어서는 양 손에 힘 이 약해져 젓가락질이 불편해졌다. 신체 검사 상, 측두근과 저작근의 위축 이 관찰되며, 앞머리 탈모가 관찰되었다. 근전도 검사에서는 근긴장방전 (myotonic discharge)가 관찰되었다. 이 환자에게서 이상이 관찰될 수 있 는 유전자는?<\/div>", "o": ["EMD gene", "SOD1 gene", "DMPK gene", "SNCA gene", "RNF213 gene"], "a": 2, "A": "③", "E": "주먹을 쥔 뒤 잘 펴지지 않는 grip myotonia, 근전도의 근긴장방전, 측두근·저작근 위축과 앞머리 탈모(hatchet face)는 근긴장디스트로피 1형의 소견이다. 1형은 19번 염색체 DMPK 유전자의 CTG 반복 확장으로 생기는 상염색체 우성 질환으로, 성인에서 가장 흔한 유전 근육질환이다. 2형은 CNBP(ZNF9) 유전자의 CCTG 반복 확장이 원인이다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "연도별 선지 순서가 달라 원래 번호는 2022 ⇒ ③, 2021 ⇒ ①, 2020 ⇒ ①", "img": [], "v": false, "y": [2020, 2021, 2022], "ok": true, "ra": "③", "vb": "검안"}, {"id": "22-38", "keys": ["22-38"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>55세 여자 환자가 수개월 전부터 발생한 사지 근력 저하를 주소로 내원하 였다. 양 팔을 들어올리기 힘들어 머리를 묶을 수 없으며, 계단을 오를 때 특히 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전부위에서 관찰 되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으 며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었<\/div><div>다. 가장 가능성이 높은 질환은?<\/div>", "o": ["피부근염", "포함체근염", "중증근무력증", "근긴장근디스트로피", "얼굴어깨위팔근디스트로피"], "a": 0, "A": "①", "E": "아급성으로 진행하는 대칭적 근위부 근력저하에 shawl sign과 손가락 관절 신전부의 Gottron 구진이 동반되면 피부근염이다. 염증근육병 중 피부 발진을 동반하는 것은 피부근염뿐이며, 다발근염·면역-연관 괴사성근염은 발진이 없다. 피부근염은 암 동반이 10-30%로 높아 진단 후 첫 3년간 매년 암 검진이 필요하다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "①", "vb": "검안"}, {"id": "21-43", "keys": ["21-43", "20-37"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>44세 여자환자가 안검 하수 및 사지 근력 저하 주소로 내원하였다. 주로 오후로 갈수록 심해지고, 자고 일어나면 좀 더 호전되는 양상을 보였다. 초기에 환자는 눈꺼풀의 쳐짐 현상이 주된 증상 이었으나, 이제는 음식, 특히 고기를 씹지 못할 정도로 심해졌다. 신체 검사상 사지의 근력이 감소하였으나 deep tendon reflexes는 정상이었다. 근생검상 특별한 조직학적 이상 소견은 없었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["만성염증탈수초 다발신경병 (chronic inflammatory demyelinating polyneuropathy, CIDP)", "길랑-바레 증후군 (Guillain-Barre syndrome)", "근위축성측삭경화증 (amyotrophic lateral sclerosis, ALS)", "중증근무력증 (myasthenia gravis)", "베커 근디스트로피 (Becker muscular dystrophy)"], "a": 3, "A": "④", "E": "안검하수로 시작해 저작·사지 근력저하로 진행하고, 오후로 갈수록 심해지며 자고 나면 호전되는 일중변동(fatigue phenomenon)은 중증근무력증의 특징이다. 시냅스후 AChR 자가항체 질환이라 심부건반사는 정상이고 근생검에서도 이상이 없다. CIDP·길랑-바레 증후군은 건반사가 소실되고, 베커 근디스트로피는 근생검 이상과 CK 상승을 보인다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020, 2021], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-27", "keys": ["20-27"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>55세 여자환자가 수년간 쉽게 피로함을 호소하였는데, 주로 오후로 갈수록 심해지고, 자고 일어나면 종 더 호전되는 양상을 보였다. 초기에 환자는 눈꺼풀의 쳐짐 현상이 주된 증상이었으나 이제는 음식 특히 고기를 씹지 못할 정도로 심해졌다. 신체검사상 사지의 근력이 감소하였으나 deep tendon reflexes는 정상이었다. 근생검상 특별한 조직학적 이상소견은 없었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["중증근무력증", "근위축성 측삭경화증", "길랑바레증후군", "베커 근위축증", "다발성 말초신경병증"], "a": 0, "A": "①", "E": "눈꺼풀 처짐으로 시작해 고기를 씹기 힘들 정도로 진행하고, 오후에 악화되고 자고 나면 호전되는 일중변동은 중증근무력증의 특징이다. AChR 항체에 의한 시냅스후 신경근접합부 질환이므로 심부건반사와 근생검은 정상이다. 길랑-바레 증후군·다발성 말초신경병증은 건반사 소실, 베커 근위축증은 근생검 이상을 보인다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "①", "vb": "검안"}, {"id": "20-40", "keys": ["20-40"], "ch": 11, "g": "근접합부·근육질환", "stem": "<div>60세 여자가 수개월 전부터 발생한 사지 근력저하를 주소로 내원하였다. 양 팔에 힘이 없어 헤어드라이기 사용이 어려우며, 계단을 오를 때 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전부위에서 관찰되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["포함체근염", "피부근염", "다발근염", "얼굴어깨위팔근디스트로피", "중증근무력증"], "a": 1, "A": "②", "E": "대칭적 근위부 근력저하에 shawl sign과 Gottron 구진(손가락 관절 신전부 구진)이 동반되므로 피부근염이다. 다발근염은 피부 병변이 없는 배제 진단이고, 포함체근염은 고령 남성에서 손가락 굽힘근·넙다리네갈래근을 비대칭적으로 침범한다. 피부근염은 암 동반이 많아 처음 3년간 매년 암 검진이 필요하다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "②", "vb": "검안"}, {"id": "23-2Q-13", "keys": ["23-2Q-13"], "ch": 11, "g": "근접합부·근육질환", "t": "s", "stem": "<div>50세 남자 환자. 30갑년의 흡연력이 있다. 3개월전부터 발생한 팔다리 위약 및 입마름 주소로 내원하였다. 환자의 우측 새끼외전근에서 시행한 반복신경자극검사 시 고빈도 자극에서 다음과 같은 소견이 관찰되었다. 환자에서 양성인 항체는?(약어인정)<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": [], "a": -1, "A": "anti voltage gated calcium channel 항체(anti-VGCC 항체)", "acc": ["anti-VGCC 항체", "anti voltage gated calcium channel 항체", "anti-VGCC", "VGCC 항체", "anti-VGCC antibody", "VGCC antibody", "항VGCC항체", "전압개폐칼슘통로 항체", "전압의존칼슘통로 항체"], "E": "흡연력, 근위부 위약, 입마름(자율신경 증상)과 고빈도 반복신경자극에서 복합근활동전위가 100% 이상 증가하는 증가반응(incremental response)은 램버트-이튼 근무력증후군(LEMS)의 소견이다. LEMS는 시냅스전 전압개폐 칼슘통로(VGCC)에 대한 IgG 항체로 ACh 방출이 줄어 생긴다. 성인 LEMS의 약 60%가 암과 관련되고 그중 80%가 소세포폐암이므로 흉부 CT·PET-CT로 암을 찾아야 한다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": ["figs/23-2Q-13.jpg"], "v": false, "y": [2023], "ok": true, "ra": "anti voltage gated calcium channel 항체(anti-VGCC 항체)", "vb": "검안"}, {"id": "23-2Q-14", "keys": ["23-2Q-14"], "ch": 11, "g": "근접합부·근육질환", "t": "s", "stem": "<div>30세 여자환자. 3개월 전부터 발생한 간헐적인 안검하수를 주소로 내원하였다. 오후로 갈수록 심해지고, 자고 일어나면 호전되는 양상을 보였다. 신경학적 진찰 결과 윗쪽을 주시하도록 했을 때, 25초가 지난 후 안검하수가 발생했다. 필요한 전기적진단검사는?<\/div>", "o": [], "a": -1, "A": "반복신경자극검사, repetitive nerve stimulation test, RNST, Jolly test", "acc": ["RNST", "반복신경자극검사", "Jolly test", "repetitive nerve stimulation test", "repetitive nerve stimulation", "RNS test", "RNS", "졸리 검사", "반복신경자극검사(RNST)"], "E": "오후에 악화되고 자고 나면 호전되는 안검하수, 위쪽 주시 지속 시 유발되는 안검하수는 중증근무력증을 시사한다. 중증근무력증 진단의 객관적 전기진단검사는 반복신경자극검사(RNST, Jolly test)로, 저빈도(약 3Hz) 반복 자극 시 복합근활동전위가 10% 이상 감소하는 감쇄반응(decremental response)을 보이면 양성이다. 다만 안구형은 RNST 양성률이 낮다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "반복신경자극검사, repetitive nerve stimulation test, RNST, Jolly test", "vb": "검안"}, {"id": "22-2Q-62", "keys": ["22-2Q-62"], "ch": 11, "g": "근접합부·근육질환", "t": "s", "stem": "<div>22세 여자 환자가 아침에 깨어보니 사지마비가 나타나 응급실로 내원하였다. 환자는 전날 헬스 운동 이후 야식을 먹고 잠들었다. 1년 전에도 이런 증상이 있었으나 그날로 회복되었다고 한다. 신경학적 검사상 의식은 명료하였으며, 감각 기능은 정상이었다. 사지마비는 근위부의 마비(proximal weakness)가 더 심했고, 호흡, 안면, 인후두의 마비는 없었다. 응급실 내원 당시 혈청칼륨농도는 2.2mEq/L로 측정되었다. 진단은?<\/div>", "o": [], "a": -1, "A": "저칼륨주기마비 / hypokalemic periodic paralysis / HPP", "acc": ["HPP", "저칼륨주기마비", "hypokalemic periodic paralysis", "저칼륨성 주기마비", "저칼륨성주기마비", "저칼륨성 주기 마비", "저칼륨 주기마비", "hypokalemic periodic paralysis(HPP)"], "E": "젊은 성인이 격한 운동·고탄수화물 식사 다음 날 새벽에 근위부 우세 사지마비로 깨고, 감각·의식이 정상이며 혈청 칼륨이 낮으면 저칼륨주기마비이다. 운동·탄수화물 섭취 뒤 칼륨이 세포 안으로 급격히 이동해 생기며, 원발성은 주로 칼슘통로(CACNA1S) 이상인 채널병증이다. 갑상샘항진증에 의한 이차성이 더 흔하므로 먼저 갑상샘기능검사를 하고, 치료는 KCl 보충과 유발 요인 회피이다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "저칼륨주기마비 / hypokalemic periodic paralysis / HPP", "vb": "검안"}, {"id": "22-2Q-63", "keys": ["22-2Q-63"], "ch": 11, "g": "근접합부·근육질환", "t": "s", "stem": "<div>60세 남자 환자가 2개월 전부터 발생한 양측 하지 근력 저하 및 심한 입마름 주소로 내원하였다. 바닥에 앉았다가 일어나는 게 특히 어려우며, 양측 허벅지에 통증이 있었다. 신경학적 검사에서 양측 상하지의 근위부 근력저하가 관찰되었으며, 특히 하지의 근력 저하가 심했다. 감각 이상은 동반되지 않았다. 무릎 반사(knee jerk)는 감소되어 있었으나, knee extension을 시킨 후 다시 시행한 무릎 반사는 처음보다 증가된 소견을 보였다. 반복신경자극검사 시 고빈도 자극에서 복합근활동전위의 크기가 2배 이상 증가하는 증가 반응이 관찰되었다. 진단은? (약어 인정)<\/div>", "o": [], "a": -1, "A": "램버트-이튼 근무력증후군 / Lambert-Eaton myasthenic syndrome / LEMS", "acc": ["LEMS", "램버트-이튼 근무력증후군", "Lambert-Eaton myasthenic syndrome", "Lambert-Eaton syndrome", "램버트-이튼 증후군", "램버트이튼증후군", "램버트이튼근무력증후군", "램버트-이튼근무력증후군"], "E": "하지 근위부 위약과 입마름(자율신경 이상), 감소된 건반사가 운동 후 일시적으로 좋아지는 post-exercise facilitation, 고빈도 반복신경자극에서 100% 이상의 증가반응은 램버트-이튼 근무력증후군(LEMS)의 소견이다. 시냅스전 VGCC 항체로 ACh 방출이 줄어든 질환이며, 성인 환자의 약 60%가 암(주로 소세포폐암)과 관련되어 흉부 CT·PET-CT로 암 평가를 해야 한다. 치료는 암 치료가 우선이고 3,4-DAP 등을 쓴다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "램버트-이튼 근무력증후군 / Lambert-Eaton myasthenic syndrome / LEMS", "vb": "검안"}, {"id": "23-15", "keys": ["23-15"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>62세 여자 환자. 1개월 전부터 간헐적인 복시 발생하여 내원 하였다. 5일 전부터는 좌측 안검하수도 동반되었으며, 증상에는 일중변동이 있었다. 좌측 눈꺼풀에 3분 동안 아이스팩을 올려 놓은 후 안검하수가 호전되는 소견 보였다. 의심되는 질환에서 가장 흔하게 동반하는 암을 발견하기 위한 검사는?<\/div>", "o": ["thorax CT", "brain MRI", "colonoscopy", "abdomen CT", "bone marrow biopsy"], "a": 0, "A": "①", "E": "일중변동이 있는 복시·안검하수가 ice pack test로 호전되므로 중증근무력증이다. 중증근무력증 환자의 대부분에서 흉선 이상(흉선증식 65-75%, 흉선종 10-15%)이 동반되므로 진단되면 반드시 흉부(thorax) CT로 흉선종을 찾아야 하고, 흉선종이 있으면 크기와 관계없이 수술한다. 뇌 MRI, 대장내시경, 복부 CT, 골수검사는 중증근무력증의 동반 종양 평가와 관계가 없다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "①", "vb": "검안"}, {"id": "23-17", "keys": ["23-17"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>25세 여자 환자. 주먹을 쥐고 나서 잘 펴지지 않는 증상을 주소로 내원하였다. 이 증상은 10대 후반부터 발생하였으며, 최근 들어서는 양 손에 힘이 약해져 젓가락질이 불편해졌다. 신체검사 상, 측두근과 저작근의 위축이 관찰되었고, 함께 내원한 환자의 아버지도 비슷한 증상이 있었다. 이 환자에게서 이상이 관찰될 수 있는 유전자는?<\/div>", "o": ["EMD gene", "SOD1 gene", "DMPK gene", "SNCA gene", "RNF213 gene"], "a": 2, "A": "③", "E": "주먹을 쥔 뒤 잘 펴지지 않는 grip myotonia, 원위부부터 시작하는 근력 저하, 측두근·저작근 위축(hatchet face), 상염색체 우성 가족력은 근긴장디스트로피 1형(DM1)이다. 강의에서 DM1의 원인은 19번 염색체 DMPK 유전자의 CTG 반복 확장이며 성인에서 가장 흔한 유전 근육질환이라고 강조했다(DM2는 CNBP/ZNF9의 CCTG 반복). SOD1은 가족성 ALS, SNCA는 파킨슨병, RNF213은 모야모야병, EMD는 Emery-Dreifuss 근디스트로피와 관련된다.", "B": "26 학습부 24번(검안) · 신경근접합부 질환, 근육 질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "③", "vb": "검안"}, {"id": "22-31", "keys": ["22-31"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>70세 여자 환자가 4일 전부터 발생한 상하지 위약감 및 양측 손발끝 저림 을 주소로 응급실로 내원하였다. 내원 2주 전 심한 설사를 하여 내과에서 치료를 받았다. 활력 징후는 정상 이였으며, 신경학적 검사에서 양측 상지 MRC grade 4, 양측 하지 MRC grade 2의 근력 저하가 관찰되었고, 상하 지 심부건반사는 관찰되지 않았다. 뇌척수액 검사 소견상 압력은 130mmH20, 세포수는 8/mm3, 단백은 150mg/dL의 소견을 보였으며, 혈액 및 소변 검사에서 다른 특이 소견은 관찰되지 않았다. 적절한 치료는?<\/div>", "o": ["항생제", "면역억제제", "항바이러스제", "면역글로불린", "고용량스테로이드"], "a": 3, "A": "④", "E": "설사(선행 감염) 2주 뒤 급성으로 진행한 하지 우세 사지 위약, 심부건반사 소실, 뇌척수액 단백 증가와 세포수 정상(albuminocytologic dissociation)은 길랑-바레 증후군이다. 의심되면 지체 없이 IVIg(또는 혈장교환술)를 시작하며, 둘을 함께 쓰지는 않는다. 스테로이드는 GBS에 효과가 없고, 자가면역 기전이므로 항생제·항바이러스제도 의미 없다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-35", "keys": ["22-35"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>62세 여자 환자가 수년 간 쉽게 피로함을 호소하였는데, 주로 오후로 갈수 록 심해지고, 자고 일어나면 좀 더 호전되는 양상을 보였다. 초기에 환자는 눈꺼풀의 쳐짐 현상이 주된 증상이었으나, 이제는 음식, 특히 고기를 씹지 못할 정도로 심해졌다. 신경계진찰 결과, 윗 쪽을 주시하도록 하였을 때 25초 지나면서 좌측 눈꺼풀 쳐짐이 나타났다. 필요한 혈액 검사는?<\/div>", "o": ["Anti Jo 1 antibody", "Anti platelet antibody", "Anti ganglioside antibody", "Anti acetylcholine receptor antibody", "Anti myelin-associated glycoprotein antibody"], "a": 3, "A": "④", "E": "오후에 악화되고 자고 나면 호전되는 안검하수·저작장애, 위쪽 주시를 지속하면 유발되는 안검하수는 중증근무력증의 소견이다. 진단에 가장 중요한 혈액검사는 항아세틸콜린수용체(AChR) 항체로 80-90%에서 양성이며, 음성이면 MuSK 항체를 검사한다. Anti-Jo-1은 염증근육병, 항강글리오사이드 항체는 길랑-바레 증후군 아형, 항MAG 항체는 탈수초 말초신경병과 관련된다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "④", "vb": "검안"}, {"id": "22-36", "keys": ["22-36"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>30세 남자 환자가 기상 시 사지마비가 발생하여 응급실로 내원하였다. 환 자는 전날 축구시합을 하였고, 잘 때 까지는 특별한 이상 없었다. 신경계진 찰 결과, 의식은 명료하였고, 사지마비는 근위부의 마비가 더 심했고, 안면 마비나 호흡마비는 없었다. 감각 기능도 정상 이였다. 필요한 혈액 검사는?<\/div>", "o": ["요산", "암모니아", "당화혈색소", "비타민 B12", "갑상선기능검사"], "a": 4, "A": "⑤", "E": "전날 격한 운동 후 새벽에 발생한 근위부 우세 사지마비에 의식·감각·안면·호흡근이 정상이면 저칼륨 주기마비를 의심한다. 강의에서는 이차성 원인인 갑상선기능항진증(thyrotoxicosis)이 더 흔하므로 혈청 칼륨과 함께 갑상선기능검사(TFT)를 먼저 확인하고, 반복되면 일차성을 의심해 유전자 검사를 한다고 여러 번 강조했다. 요산·암모니아·당화혈색소·비타민 B12는 이 임상상과 관련이 적다.", "B": "26 학습부 24번(검안) · 신경근접합부 질환, 근육 질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-41", "keys": ["20-41"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>52세 남자가 약 1주간에 걸쳐 진행된 보행 장애와 복시를 주소로 응급실로 내원하였다. 활력 징후는 정상이었다. 신경학적 검사상 양측 미소짓기와 이마주름잡기에 경한 장애소견이 나타났으며, 양측 하지근력 저하가 관찰되었다. 통각, 진동각, 위치각은 정상이었으며, 병적반사는 나타나지 않았으나 DTR이 소실되었다. 뇌자기 공명영상술을 시행하였으나 뇌간, 소뇌에는 비정상적인 음영이 관찰되지 않았다. 뇌척수액 검사 소견상 압력은 150mmH2O, 세포수는 1/mm3, 단백은 75mg/dL의 소견을 보였으며, 혈액 및 뇨검사 등에서 다른 특이 소견은 없었다. 이 환자의 적절한 치료는 다음 중 어느 것인가?<\/div>", "o": ["고용량의 스테로이드 요법", "항바이러스제제 (acyclovir) 투여", "혈전용해술을 시도", "페니실린계의 항생제를 투여", "면역글로불린을 정맥 투여"], "a": 4, "A": "⑤", "E": "1주에 걸쳐 진행한 하지 위약과 양측 안면 약화(facial diparesis), 심부건반사 소실, 뇌 MRI 정상, 뇌척수액 단백 증가와 세포수 정상(albuminocytologic dissociation)은 길랑-바레 증후군이다. 강하게 의심되면 검사 소견을 기다리지 말고 IVIg를 투여한다. 스테로이드는 GBS에 효과가 없고, 항바이러스제·혈전용해술·항생제도 해당하지 않는다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "20-46", "keys": ["20-46"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>60세 여자가 수개월 전부터 발생한 사지 근력저하를 주소로 내원하였다. 양 팔에 힘이 없 어 헤어드라이기 사용이 어려우며, 계단을 오를 때 힘이 들었다. 신체검사 결과 어깨와 견갑부에 홍반성 발진(shawl sign)이 관찰되었으며, 붉은색의 구진이 손가락 관절의 신전 부위에서 관찰되었다. 신경학적 검사에서 양측 상하지의 근위부 근력 저하가 관찰되었으며, 감각 이상은 동반되지 않았고 심부건 반사는 저하된 소견이 관찰되었다. 이환자의 일차 치료로 가장 적절한 것은?<\/div>", "o": ["광범위 항생제 투여", "항-바이러스제 (acyclovir)투여", "면역글로블린 정맥 투여", "스테로이드 요법", "인터베론 베타 투여"], "a": 3, "A": "④", "E": "근위부 근력 저하에 shawl sign과 손가락 관절 신전부의 붉은 구진(Gottron papule)이 동반되면 피부근염이다. 염증근육병증은 치료 가능한 후천성 근병증으로, 강의 기준 치료는 corticosteroid를 4~6주 유지한 뒤 서서히 감량하는 것이며 반응이 부족하면 면역억제제·IVIg를 더한다. 피부근염은 암 동반이 10~30%라 진단 후 처음 3년은 매년 암 검진이 필요하다. 항생제·항바이러스제·인터페론 베타는 해당하지 않는다.", "B": "26 학습부 24번(검안) · 신경근접합부 질환, 근육 질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-53", "keys": ["20-53"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>32세 여성이 최근에 피곤함을 주소로 내원하였다. 오전 보다 오후에 더 피곤하다고 하며, 진찰시 환자는 의자에서 일어나는 것을 힘들어 했고, 왼쪽 눈꺼풀 쳐짐이 있었으며, 시력 검사 시 물체가 두개로 겹쳐 보인다고 호소했다. 이 환자의 진단에 가장 도움이 될 검사는?<\/div>", "o": ["CBC", "TSH Level", "PTH Level", "Ach Rc Antibody Assay", "CPK, Myoglobin"], "a": 3, "A": "④", "E": "오후에 심해지는 피로, 안검하수, 복시와 근위부 근력저하(의자에서 일어나기 어려움)는 중증근무력증을 시사한다. 진단에는 AChR 항체 검사가 가장 도움이 되며 환자의 80-90%에서 양성이다. 중증근무력증은 신경근접합부 질환이라 CK·myoglobin은 정상이고, CBC·PTH는 진단과 관계가 없다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "④", "vb": "검안"}, {"id": "20-94", "keys": ["20-94"], "ch": 11, "g": "척수·말초신경질환", "stem": "<div>1년전부터 발생한 양측 안검하수 (ptosis)를 주소로 내원한 50세 남자환자로 자고 일어   나면 안검 하수가 거의 없으나 오후가 되면 안검하수가 발생하여 머리를 뒤로 젖혀야    사물이 잘 보인다고한다. 진단에 도움이 되는 검사가 아닌 것은?<\/div>", "o": ["Chest CT", "Edrophonium Chloride test", "Repetitive nerve stimulation (RNS) test", "Single-fiber EMG", "Brain MRI/A"], "a": 4, "A": "⑤", "E": "아침에는 거의 없다가 오후에 심해지는 양측 안검하수는 중증근무력증이다. 흉부 CT(흉선종 확인), edrophonium 등 cholinesterase inhibitor test, 반복신경자극검사(감쇄반응)는 모두 진단·평가에 쓰이지만, 중증근무력증은 뇌가 아닌 말초(신경근접합부) 질환이므로 뇌 MRI/A는 필요 없다. 단일섬유근전도(single-fiber EMG)도 중증근무력증에서 민감도가 가장 높은 전기진단검사다(교과서 보충).", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "", "img": [], "v": false, "y": [2020], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-2Q-07", "keys": ["23-2Q-07", "22-2Q-65"], "ch": 11, "g": "척수·말초신경질환", "t": "s", "stem": "<div>43세 여자가 1년 전부터 우측 손이 저려 내원하였다. 우측 엄지 손가락부터 가운데 손가락까지 남의 살 같이 먹먹하고 저리나 새끼손가락은 괜찮았다. 밤에 더 심해져 새벽에 손이 저려 종종 잠에서 깨어날 때도 있다고 한다. 신경학적 진찰에서 근력 저하는 관찰되지 않았고, 우측 Tinel’s sign at wrist가 양성으로 확인되었다. 진단은?(약어 불인정)<\/div>", "o": [], "a": -1, "A": "carpal tunnel syndrome, 손목터널증후군", "acc": ["손목터널증후군", "carpal tunnel syndrome", "손목 터널 증후군", "수근관증후군", "수근관 증후군"], "E": "엄지~가운데손가락의 저림(새끼손가락은 정상), 밤에 저려 잠에서 깨는 nocturnal paresthesia, 손목 Tinel 징후 양성은 손목터널에서 정중신경이 눌린 손목터널증후군(carpal tunnel syndrome)이다. Tinel(두드리기)과 Phalen(손목 굽히기)은 터널을 자극해 증상을 유발하는 검사다. 교수님이 철자를 정확히 쓰라고 강조했으며 약어(CTS)는 인정하지 않는다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra": "carpal tunnel syndrome, 손목터널증후군", "vb": "검안"}, {"id": "23-2Q-08", "keys": ["23-2Q-08"], "ch": 11, "g": "척수·말초신경질환", "t": "s", "stem": "<div>32세 남자 환자. 내원 1주 전 독감 예방 접종하였으며, 2일 전부터 발생한 양측 상하지 위약감 및 안면마비 주소로 응급실로 내원하였다. 신경학적 검사에서 양측 상지 MRC grade 4, 양측 하지 MRC grade 2의 근력 저하 및 말초성 안면마비가 관찰되었다. 상하지 심부건반사는 소실되었다. 뇌척수액 검사 소견상 백혈구는 6/mm3, 단백은 150mg/dL의 소견을 보였다. 적절한 치료는?<\/div>", "o": [], "a": -1, "A": "면역글로불린, 혈장교환술", "acc": [], "E": "독감 예방접종 1주 뒤 급성으로 발생한 하지 우세 사지 위약, 말초성 안면마비, 심부건반사 소실, 뇌척수액 단백 증가와 백혈구 정상은 길랑-바레 증후군이다. 치료는 정맥 면역글로불린(IVIg) 또는 혈장교환술로 효과는 같으며, 사용이 쉬운 IVIg를 먼저 쓰고 둘을 병용하지는 않는다. 스테로이드는 효과가 없다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "면역글로불린, 혈장교환술", "vb": "검안"}, {"id": "22-2Q-64", "keys": ["22-2Q-64"], "ch": 11, "g": "척수·말초신경질환", "t": "s", "stem": "<div>68세 여자 환자가 2년 전부터 발생하여 서서히 진행하는 상하지 위약감 및 구음 장애 주소로 내원하였다. 처음에는 왼쪽 손에만 힘이 없었다가 점차 오른쪽 손을 사용하는 것이 힘들어졌고, 6개월 전부터는 오른쪽 하지에도 힘이 없어 걷기가 힘들었다. 신경계 진찰에서 knee jerk이 항진된 소견 관찰되었으며 양측 상지 GIII, 우측 하지 GIV의 근력 저하를 보였다. 감각 검사는 정상이었다. Tongue fasciculation이 관찰되었으며 호프만 징후가 양측에서 관찰되었다. 신체 진찰에서는 양측 손의 내재근에서 근 위축이 확인되었고 근전도검사에서는 뇌줄기, 경부, 흉부, 요천부 모든 분절에서 신경병성 변화가 관찰되었다. 진단은? (약어 불인정)<\/div>", "o": [], "a": -1, "A": "근위축측삭경화증 / Amyotrophic lateral sclerosis", "acc": ["근위축측삭경화증", "Amyotrophic lateral sclerosis", "근위축성측삭경화증", "근위축성 측삭경화증", "근위축축삭경화증"], "E": "한쪽 손에서 시작해 퍼지는 비대칭 근력 저하와 손 내재근 위축·혀 섬유다발수축(하위운동신경원 징후), 무릎반사 항진·Hoffmann 징후(상위운동신경원 징후)가 함께 있고 감각은 정상이므로 근위축측삭경화증(ALS)이다. 근전도에서 여러 분절의 신경병성 변화도 이를 뒷받침한다. 강의에서 '축삭'이 아니라 '측삭'(lateral column)임을 강조했고, 교수님 답안은 영문명과 한글명만 인정(루게릭병 불인정)했다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "근위축측삭경화증 / Amyotrophic lateral sclerosis", "vb": "검안"}, {"id": "25-01", "keys": ["25-01"], "ch": 12, "g": "뇌종양", "stem": "<div>49세 여자가 시야장애를 주소로 내원하였다. 시야검사, Brain MRI는 다음과 같다. 호르몬 검사상 prolactin 400ng/mL 이상 측정되었으며 다른 호르몬 검사 수치는 정상이었다. 가장 선호되는 치료 방법은?<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": ["경과관찰", "방사선치료", "약물치료", "경접형동종양제거술", "방사선수술"], "a": 2, "A": "③", "E": "양측두 반맹과 함께 prolactin이 400 ng/mL 이상으로 크게 올라 있으므로 프로락틴 분비 뇌하수체 샘종이다. 뇌하수체 샘종 중 프로락틴 분비 샘종만 bromocriptine 같은 도파민 작용제 약물치료가 1차 치료이고, 약물에 반응하지 않을 때 수술(경접형동 접근)을 고려한다. prolactin이 40 ng/mL 정도로 조금만 높고 시야장애가 있으면 경접형동 종양제거술이 답이 되므로 수치를 꼭 확인한다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "", "img": ["figs/25-01.jpg"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "25-02", "keys": ["25-02"], "ch": 12, "g": "뇌종양", "stem": "<div>우측 위약감 이 있어 검사한 조영 증강 T1 image MRI 에서 가장 의심되는 병명에 대한 설명으로 옳은 것은?<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": ["DTI tractogram 에서 종양 부분의 피의 관류를 확인 한다", "PWI에서 종양과 피질 척수로의 관계를 평가 한다", "MRS에서 NAA/choline 이 감소 한다", "1p/19q 동시 결실이 있다", "IDH 변이가 있으면 생존율이 상대적으로 낮아진다"], "a": 2, "A": "③", "E": "사진의 종양은 교모세포종(IDH 야생형, WHO 4등급)이다. MRS는 조직의 대사 정보를 보여 주며 악성 뇌종양에서는 NAA/choline 비가 감소한다. ①·② DTI tractogram은 피질척수로 같은 백질 경로를, PWI는 관류를 평가하므로 서로 바뀌었다. ④ 1p/19q 동시 결실은 핍지교종의 진단 표지이고, ⑤ IDH 변이가 있으면 오히려 예후가 좋다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "", "img": ["figs/25-02.jpg"], "v": false, "y": [2025], "ok": true, "ra": "③", "vb": "검안"}, {"id": "23-20", "keys": ["23-20"], "ch": 12, "g": "뇌종양", "stem": "<div>우측 위약감 이 있어 검사한 조영 증강 T1 image MRI 에서 가장 의심되는 병명에 대한 설명으로 틀린 것은?<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": ["DTI tractogram 으로 종양과 피질 척수로의 관계를 평가 한다", "PWI에서 종양 부분의 피의 관류가 증가 한다", "MRS에서 NAA/choline 이 감소 한다", "PCV가 효과적인 항암제로 사용 된다", "IDH 변이가 있으면 생존율이 상대적으로 높다"], "a": 3, "A": "④", "E": "사진의 종양은 교모세포종이다. 교모세포종의 표준 항암제는 경구제인 temozolomide이며, PCV(procarbazine·CCNU·vincristine)는 핍지교종·성상세포종에서 방사선치료와 함께 쓰는 요법이므로 ④가 틀린 설명이다. DTI로 종양과 피질척수로의 관계를, PWI로 종양의 증가된 관류를 평가하고, MRS에서는 NAA/choline이 감소한다. IDH 변이가 있는 종양(성상세포종·핍지교종)은 IDH 야생형 교모세포종보다 생존율이 높으므로 ⑤는 옳은 설명이다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "복원 답 ⑤과 다름 — 2026년 강의 기준 ④", "img": ["figs/23-20.jpg"], "v": false, "y": [2023], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "25-03", "keys": ["25-03"], "ch": 12, "g": "뇌종양", "t": "s", "stem": "<div>현재 신경 교모 세포종의 표준 치료에 사용되는 약제는?<\/div>", "o": [], "a": -1, "A": "테모졸라마이드(temozolamide), 테모달", "acc": ["temozolomide", "temozolamide", "테모졸로마이드", "테모졸라마이드", "테모달", "temodal", "TMZ"], "E": "교모세포종의 표준 치료는 최대 안전 절제 후 방사선치료와 temozolomide를 함께 쓰고(동시 항암방사선치료), 이후 temozolomide 보조 항암치료를 이어가는 것이다. temozolomide는 뇌종양에서 효과가 인정된 경구 항암제로, 방사선 단독 대비 중앙 생존기간을 12.1개월에서 14.6개월로 늘렸다. 상품명 테모달도 정답으로 인정되었다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "테모졸라마이드(temozolamide), 테모달", "vb": "검안"}, {"id": "23-2Q-19", "keys": ["23-2Q-19"], "ch": 12, "g": "뇌종양", "t": "s", "stem": "<div>수막종 제거 수술당시 경막내 종양의 완전 제거 및 경막의 전기 소작술을 의미 하는 grade는?<\/div>", "o": [], "a": -1, "A": "2", "acc": ["2", "grade 2", "Grade 2", "2등급", "II", "Simpson grade 2"], "E": "Simpson grade는 수막종 수술의 절제 정도와 재발률을 나타낸다. Grade 1은 종양과 붙은 경막·두개골까지 완전 제거(재발 약 9%), grade 2는 종양 완전 제거와 경막의 전기 소작(약 19%), grade 3은 경막 내 종양만 제거(약 29%), grade 4는 아전 제거(약 39%), grade 5는 단순 감압이다. 경막이 정맥동에 붙어 있어 경막을 떼기 어려울 때 grade 2로 마무리한다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "", "img": [], "v": false, "y": [2023], "ok": true, "ra": "2", "vb": "검안"}, {"id": "22-2Q-60", "keys": ["22-2Q-60"], "ch": 12, "g": "뇌종양", "t": "s", "stem": "<div>뇌하수체 종양에서 가장 많은 빈도로 사용되는 수술 접근법은?<\/div>", "o": [], "a": -1, "A": "경접형동접근법 / trans-sphenoidal approach / transsphenoidal approach / TSA", "acc": ["TSA", "경접형동접근법", "경접형동 접근법", "경접형동 접근", "transsphenoidal approach", "trans-sphenoidal approach", "transsphenoidal", "trans-sphenoidal"], "E": "뇌하수체 샘종 수술은 코를 통해 접형동으로 들어가 터키안장 바닥을 열고 종양을 제거하는 경접형동 접근법(TSA)이 가장 많이 쓰인다. 머리를 여는 개두술(transcranial approach)보다 합병증이 적어, 개두술은 TSA로 접근하기 어려운 경우에만 쓴다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "경접형동접근법 / trans-sphenoidal approach / transsphenoidal approach / TSA", "vb": "검안"}, {"id": "25-92", "keys": ["25-92"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>뇌동맥류에 대한 치료 방법에 대한 설명으로, 알맞은 것을 고르시오.<\/div>", "o": ["일반적으로 코일 색전술은 클립 색전술에 비해서 재발율이 낮다.", "경부가 넓은 뇌동맥류는 단순 코일 색전술이 용이하다.", "뇌동맥류에서 동맥 분지가 나오는 경우는 코일 색전술을 우선적으로 고려한다.", "일반적으로 후순환계의 동맥에 발생한 동맥류는 코일 색전술을 우선적으로 고려한다.", "코일 색전술은 다량의 뇌내 출혈이 동반된 경우 혈종 제거가 가능하다."], "a": 3, "A": "④", "E": "뇌동맥류 치료는 개두술 후 클립 결찰술과 대퇴동맥으로 접근하는 코일 색전술(혈관 내 수술) 두 가지다. 후순환계(척추·기저동맥) 동맥류는 개두술로 접근하기 어려워 코일 색전술을 먼저 고려한다(④). ① 코일 색전술은 클립 결찰술보다 재발(재개통)이 많다. ② 경부가 넓으면 코일이 빠져나오기 쉬워 클립 결찰술(또는 스텐트·풍선 보조 코일)을 먼저 고려한다. ③ 동맥류에서 동맥 분지가 나오면 클립 결찰술을 먼저 고려한다. ⑤ 다량의 뇌내 출혈이 동반되어 혈종을 제거할 수 있는 것은 개두술(클립 결찰술)이다.", "B": "26 학습부 27번(검안) · 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2025], "ok": true, "ra": "④", "vb": "검안"}, {"id": "25-96", "keys": ["25-96", "22-46"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>13세 여자 환아로 풍선을 불 때나 뜨거운 음식을 식히려고 입으로 불 때 팔 다리의 일시적인 마비 증상을 주소로 내원하였다. 뇌 MRI 소견과 DSA 영상은 아래와 같다. 상기 환아의 수술적 처치로 알맞은 것은?<\/div><div class=\"small\" style=\"color:#b07a12\"><\/div>", "o": ["미세 수술적 제거술", "혈관 내 색전술", "정위적 방사선 수술(감마나이프)", "동맥류 클립 결찰술", "간접 재관류 수술"], "a": 4, "A": "⑤", "E": "과호흡(풍선 불기, 음식 식히기) 때 일시적 마비가 생기고 혈관조영에서 'puff of smoke' 모양의 가는 이상혈관이 보이면 모야모야병이다. 수술 목적은 부족한 뇌혈류를 보충하는 것으로, 성인은 천측두동맥(STA)을 중대뇌동맥(MCA)에 직접 잇는 직접 재관류 수술(직접 문합술)을, 혈관이 가는 소아는 STA와 주변 조직을 뇌 표면에 덮어 주는 간접 재관류 수술(간접 문합술)을 주로 한다. 이 환아는 13세 소아이므로 간접 재관류 수술(⑤)이다.", "B": "26 학습부 27번(검안) · 뇌혈관 질환 2", "N": "", "img": ["figs/25-96.jpg"], "v": false, "y": [2022, 2025], "ok": true, "ra": "⑤", "vb": "검안"}, {"id": "23-50", "keys": ["23-50", "22-40"], "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "stem": "<div>뇌동맥류에 대한 치료 방법에 대한 설명으로, 알맞은 것을 고르시오.<\/div>", "o": ["코일 색전술은 클립 색전술에 비해서 재발율이 낮다.", "경부가 넓은 뇌동맥류는 단순 코일 색전술이 용이하다.", "뇌동맥류에서 동맥 분지가 나오는 경우는 코일 색전술을 우선적으로 고려한다.", "일반적으로 후순환계의 동맥에 발생한 동맥류는 코일 색전술을 우선적으로 고려 한다.", "코일 색전술은 다량의 뇌내 출혈이 동반된 경우 혈종 제거가 가능하다."], "a": 3, "A": "④", "E": "뇌동맥류 치료는 개두술 후 클립 결찰술과 대퇴동맥으로 접근하는 코일 색전술(혈관 내 수술) 두 가지다. 후순환계(척추·기저동맥) 동맥류는 개두술로 접근하기 어려워 코일 색전술을 먼저 고려한다(④). ① 코일 색전술은 클립 결찰술보다 재발(재개통)이 많다. ② 경부가 넓으면 코일이 빠져나오기 쉬워 클립 결찰술을 먼저 고려한다. ③ 동맥류에서 동맥 분지가 나오면 클립 결찰술을 먼저 고려한다. ⑤ 다량의 뇌내 출혈이 동반되어 혈종을 제거할 수 있는 것은 개두술(클립 결찰술)이다.", "B": "26 학습부 27번(검안) · 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2022, 2023], "ok": true, "ra nic hypertension", "acc": ["고혈압", "만성 고혈압", "hypertension", "chronic hypertension"], "E": "뇌실질내 출혈(ICH)의 가장 흔한 원인은 만성 고혈압이며 '고혈압'도 정답으로 인정되었다. 고혈압성 뇌출혈이 가장 흔한 부위는 기저핵(피각)이다.", "B": "26 학습부 27번(검안) · 뇌혈관 질환 2", "N": "", "img": [], "v": false, "y": [2022], "ok": true, "ra": "만성 고혈압 / 고혈압 / hypertension / chronic hypertension", "vb": "검안"}, {"id": "V01", "ch": 0, "base": "25-29", "lv": "minor", "stem": "<div>6개월 여아가 목을 가누지 못하고 팔을 중력에 대항해 들지 못해 병원에 왔다. 누우면 개구리 다리 자세(frog-leg posture)를 보이고 혀에 섬유다발수축(fasciculation)이 있다. 심부건반사는 소실되었고 혈청 CK와 감각신경전도는 정상이다. 이 질환의 원인 유전자는?<\/div>", "o": ["SMN1", "DMD", "PMP22", "DMPK", "NF1"], "a": 0, "E": "개구리 다리 자세, 혀 섬유다발수축, 심부건반사 소실, 정상 CK·감각신경전도는 척수성 근위축증(SMA)으로, 척수 앞뿔 운동신경세포가 소실된다. 원인은 5번 염색체(5q)의 SMN1 유전자 결실이며 MLPA로 확진하고, SMN2 copy 수가 많을수록 증상이 가볍다. DMD는 Duchenne/Becker, PMP22는 Charcot-Marie-Tooth 1A, DMPK는 근긴장디스트로피 1형과 관련된다.", "B": "26 학습부 17번(검안) · 소아 말초신경, 근육질환", "N": "2025년 29번 변형", "vn": "증례 틀은 같고 발문을 '병변 위치'에서 '원인 유전자'로 바꾸고 선지 전부 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V02", "ch": 0, "base": "25-24", "lv": "minor", "stem": "<div>10세 남아가 2개월 전부터 반복되는 두통으로 병원에 왔다. 다음 중 뇌 영상 검사가 필요하다고 판단되는 소견은?<\/div>", "o": ["이마 양쪽의 박동성 두통", "빛과 소리에 의해 두통이 악화됨", "잠을 자고 나면 두통이 좋아짐", "새벽에 두통으로 잠에서 깨고 아침에 구토가 동반됨", "어머니의 편두통 가족력"], "a": 3, "E": "소아 두통의 경고 징후(red flag): 수면 중 깨는 두통, 아침 구토, 점점 심해지는 양상, 국소 신경학적 이상(편측 위약 등), 성격·학업 변화 → 두개내압 상승·종괴를 의심해 영상 검사. 양측 박동성·빛 과민·수면 후 호전·가족력은 편두통에 합당한 소견.", "B": "26 학습부 02번(검안) · 소아신경, 중추신경계질환", "N": "2025년 24번 변형", "vn": "나이·기간과 정답 소견(손 힘 빠짐 → 새벽 각성·아침 구토)을 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V03", "ch": 1, "base": "25-101", "lv": "minor", "stem": "<div>두개내압 상승으로 의식이 저하된 환자의 두개내압 조절 방법으로 옳은 것은?<\/div>", "o": ["과환기로 PaCO2를 25 mmHg 이하로 수일간 유지한다", "침상 머리를 30도 정도 올리고 목이 꺾이지 않게 한다", "저장성(hypotonic) 수액을 충분히 투여한다", "발열은 뇌대사를 줄이므로 해열하지 않는다", "기도 흡인과 기침 유발 처치를 자주 반복한다"], "a": 1, "E": "26년 강의(ICP control algorithm): 신경계 중환자실에서는 모두 30도 head elevation을 해 jugular venous return을 원활하게 하고 ICP를 낮춘다(②). 과환기는 PaCO2를 32~36 mmHg 정도로 약간만 낮추고 급성기에 일시적으로 하며, 지나치면 뇌혈류가 줄어 hypoxic damage가 생긴다. 저장성 수액은 뇌부종을 악화시키고, 열은 뇌 대사를 늘리므로 오히려 체온을 낮추는 hypothermia가 치료 단계에 들어가며, 잦은 흡인·기침 유발은 ICP를 올린다.", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "2025년 101번 변형", "vn": "'아닌 것'을 '옳은 것'으로 발문 방향을 바꾸고 선지 수치(PaCO2) 제시", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V04", "ch": 1, "base": "25-105", "lv": "minor", "stem": "<div>다음 중 수두증의 수술적 치료법이 아닌 것은?<\/div>", "o": ["V-P shunt (뇌실-복강 단락술)", "V-pleural shunt (뇌실-흉막 단락술)", "Endoscopic third ventriculostomy", "L-P shunt (요추-복강 단락술)", "척수강 내 baclofen 펌프 삽입술"], "a": 4, "E": "26년 강의(수두증 치료): 수두증은 약물로는 효과가 없고 ETV나 shunt(V-P, V-A, L-P)로 CSF를 다른 체강으로 우회시키는 수술로 치료한다. 뇌실-흉막 단락술도 같은 원리의 shunt다. 척수강 내 baclofen 펌프는 척수강으로 약물을 넣어 강직(spasticity)을 치료하는 장치로 수두증 수술이 아니다(⑤).", "B": "26 학습부 11번(검안) · 두개내압항진과 수두증", "N": "2025년 105번 변형", "vn": "선지 2개(V-A shunt → V-pleural shunt, 펌프 → baclofen 펌프)와 순서만 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V05", "ch": 2, "base": "25-91", "lv": "minor", "stem": "<div>68세 남자가 5시간 전 갑자기 발생한 왼쪽 팔다리 위약과 구음장애로 응급실에 왔다. 고혈압과 심방세동이 있다. 혈압 160/95 mmHg이며, 뇌 CT에서 출혈은 없고 CT 혈관조영술에서 오른쪽 중대뇌동맥 M1 폐색이 확인되었다. 가장 적절한 치료는?<\/div>", "o": ["만니톨 투여", "아스피린 투여 후 경과관찰", "동맥 내 혈전제거술", "혈압강하제로 수축기혈압 120 mmHg 미만 유지", "뇌 감압술"], "a": 2, "E": "26년 강의(급성 뇌졸중 치료 time line): 정맥 내 tPA는 발생 4.5시간 이내에만 쓸 수 있어 5시간이 지난 이 환자는 대상이 아니다. 그러나 큰 혈관(중대뇌동맥 M1) 폐색이 확인되었으므로 24시간 이내 가능한 동맥 내 혈전제거술(endovascular recanalization)이 적절하다. 급성기에 혈압을 낮추면 측부순환과 반음영(penumbra) 관류가 줄어 경색이 커지고, 만니톨은 효과가 없으며 감압술은 악성 뇌부종이 생겼을 때 고려한다. 아스피린은 재관류 치료 후 재발 예방 약이다.", "B": "26 학습부 05번(검안) · 뇌혈관질환 2", "N": "2025년 91번 변형", "vn": "증상 발생 시간(1.5시간→5시간)과 혈관 폐색 정보를 바꾸고 오답 선지 2개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V06", "ch": 2, "base": "21-03", "lv": "minor", "stem": "<div>급성 세균성 뇌막염이 의심되는 성인 환자의 처치로 옳지 않은 것은?<\/div>", "o": ["CT·MRI 결과가 나오기 전이라도 경험적 항생제를 시작한다", "가능하면 항생제 투여 전에 혈액배양 검체를 채취한다", "경험적 항생제로 3세대 cephalosporin과 vancomycin을 정맥 투여한다", "의식이 회복되는 등 증상이 좋아지면 바로 항생제를 끊는다", "항생제와 함께 초기에 dexamethasone을 쓰면 청력 손실 등 합병증을 줄일 수 있다"], "a": 3, "E": "세균성 수막염이 의심되면 영상·검사 결과를 기다리지 않고, 가능하면 혈액배양 후 바로 3세대 cephalosporin+vancomycin(면역저하·50세 이상이면 ampicillin 추가)을 최대용량 정맥 투여한다. 치료는 보통 10~14일을 채우며 의식이 회복됐다고 바로 끊지 않는다(④가 틀림). 덱사메타손은 첫 항생제 15~20분 전 또는 동시에 4일간 짧게 쓰며, 염증 반응을 줄여 청력 소실 같은 합병증을 예방하는 데 도움이 된다.", "B": "26 학습부 14번(검안) · 감염성 질환1", "N": "2021년 3번 변형", "vn": "'맞는 것'을 '옳지 않은 것'으로 발문을 뒤집고 선지 3개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V07", "ch": 3, "base": "23-31", "lv": "minor", "stem": "<div>고혈압성 뇌내출혈(hypertensive ICH)이 가장 흔하게 발생하는 부위는?<\/div>", "o": ["시상(thalamus)", "소뇌(cerebellum)", "피각(putamen, 기저핵)", "다리뇌(pons)", "대뇌 피질하 엽(lobar)"], "a": 2, "E": "고혈압성 뇌내출혈은 관통동맥(렌즈핵선조체동맥 등) 손상으로 피각(기저핵) > 시상 > 다리뇌·소뇌 순으로 흔하다. 대뇌 피질하 엽 출혈은 노인에서 아밀로이드 혈관병증을 먼저 생각한다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "2023년 31번 변형", "vn": "'호발부위가 아닌 것'을 '가장 흔한 부위'로 바꾸고 선지 일부 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V08", "ch": 3, "base": "23-32", "lv": "minor", "stem": "<div>발생 3시간 된 초급성 뇌경색의 비조영 CT 소견으로 볼 수 없는 것은?<\/div>", "o": ["중대뇌동맥 고밀도 징후(hyperdense MCA sign)", "섬엽 띠(insular ribbon) 소실", "렌즈핵 경계가 불분명해짐", "고리 모양 조영증강(ring enhancement)", "정상 소견"], "a": 3, "E": "초급성 뇌경색 CT는 정상일 수 있고, 조기 소견으로 고밀도 MCA 징후, 섬엽 띠 소실, 렌즈핵 경계 소실, 회백질-백질 경계 소실이 보인다. 고리 모양 조영증강은 농양·종양 소견이며, 경색의 조영증강은 아급성기(수일~수주)의 이랑 모양이다.", "B": "26 학습부 06번(검안) · 신경계 영상진단", "N": "2023년 32번 변형", "vn": "시간 정보를 넣고 선지 3개(mass effect·hypoattenuation·contrast enhancement)를 다른 조기 소견과 고리 조영증강으로 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V09", "ch": 4, "base": "23-68", "lv": "minor", "stem": "<div>다음 중 척수 경막외 농양(spinal epidural abscess)에 대한 설명으로 틀린 것은?<\/div>", "o": ["당뇨병, 면역저하, 알코올중독, 정맥 약물 사용이 소인이 된다", "골수염이 동반된 경우에도 항생제는 3~4주면 충분하다", "배부통, 발열과 함께 척수 압박에 의한 신경학적 결손이 생길 수 있다", "MRI 조영증강에서 테두리 조영증강을 보이는 경막외 종괴로 보인다", "신경학적 결손이 진행하면 감압·배농 수술을 시행한다"], "a": 1, "E": "항생제 기간은 골수염이 없으면 3~4주, 골수염이 동반되면 6~8주. 소인: 당뇨·만성신부전·면역저하·알코올중독·악성종양·척추 시술. MRI가 진단의 기준이며 T1 조영 시 테두리 조영증강. 신경학적 결손이 진행하거나 크기가 크면 감압·배농.", "B": "26 학습부 07번(검안) · 감염성 질환2", "N": "2023년 68번 변형", "vn": "틀린 선지를 '골수염 없을 때 6~8주'에서 '골수염 있을 때 3~4주'로 수치 방향만 바꾸고 나머지 선지 표현 변경", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V10", "ch": 5, "base": "25-114", "lv": "minor", "stem": "<div>선천성 기형에서 Chiari 1형 기형을 나타내는 특징을 모두 고르세요.<br>1. 소뇌 편도가 대후두공을 통해 하방으로 전위<br>2. 척수공동증(syringomyelia)이 동반될 수 있음<br>3. 제4뇌실의 낭종성 확장<br>4. 소뇌 충부의 무형성이나 형성 저하<\/div>", "o": ["1, 2", "1, 2, 3", "1, 3, 4", "2, 3, 4", "3, 4"], "a": 0, "E": "Chiari 1형: 소뇌 편도가 대후두공 아래로 내려오고 척수공동증이 흔히 동반된다. 제4뇌실 낭종성 확장과 소뇌 충부 형성 저하는 Dandy-Walker 기형의 특징.", "B": "26 학습부 09번(검안) · 중추신경계, 선천성질환", "N": "2025년 114번 변형", "vn": "같은 보기 묶음·선지 형식으로 묻는 질환만 Dandy-Walker에서 Chiari 1형으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V11", "ch": 6, "base": "25-111", "lv": "minor", "stem": "<div>8세 남아가 Lennox-Gastaut 증후군으로 여러 항경련제를 복용하고 있지만 하루에도 수차례 갑자기 힘이 빠지며 넘어지는 무긴장 발작(drop attack)으로 자주 다친다. 이 발작을 줄이기 위해 고려할 수 있는 수술은?<\/div>", "o": ["뇌반구 절제술(hemispherectomy)", "선택적 편도해마 절제술", "전방 측두엽 절제술(anterior temporal lobectomy)", "감마나이프 수술", "뇌량 절제술(corpus callosotomy)"], "a": 4, "E": "Lennox-Gastaut 증후군의 drop attack처럼 양쪽 반구로 퍼지는 전신성 무긴장 발작에는 발작파의 반구 간 전파를 끊는 완화적 뇌량 절개술(corpus callosotomy)이 가장 효과적이다. 측두엽 절제술과 편도해마 절제술은 내측 측두엽 뇌전증의 절제 수술이고, 반구 절제술은 한쪽 반구 전체 병변(Rasmussen 뇌염, Sturge-Weber 등)에 시행하며, Gamma knife는 효과가 아직 확립되지 않았다.", "B": "26 학습부 10번(검안) · 경련성질환의 수술적 치료", "N": "2025년 111번 변형", "vn": "증례(측두엽 뇌전증 성인 → 무긴장 발작 소아)와 정답 수술을 바꾸고 선지 1개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V12", "ch": 10, "base": "25-41", "lv": "minor", "stem": "<div>25세 남자가 오토바이 사고 후 잠시 의식을 잃었다가 깨어나 대화를 하던 중 2시간 뒤 다시 의식이 나빠져 응급실에 왔다. 두부 CT에서 측두부에 볼록 렌즈 모양의 고밀도 음영이 보인다. 이 질환에 대한 설명으로 옳은 것은?<\/div>", "o": ["주로 뇌 표면의 교정정맥(bridging vein)이 찢어져 발생한다", "CT에서 초승달 모양으로 보인다", "의식 명료기(lucid interval)가 있을 수 있다", "급성 경막하출혈보다 예후가 나쁘다", "혈종이 커도 수술보다 보존적 치료를 우선한다"], "a": 2, "E": "볼록 렌즈 모양의 고밀도 병변은 급성 경막외혈종이다. 두개골절에 동반된 중경막동맥 손상이 대표 기전이고, 의식이 잠시 좋아지는 명료기가 있을 수 있으나 항상 나타나지는 않는다(③ 정답). ①② 교정맥 손상과 초승달 모양은 급성 경막하혈종의 특징이다. ④ 경막외혈종은 기저 뇌손상이 적어 보통 경막하혈종보다 예후가 좋다. ⑤ 혈종 용적 >30 cm³이거나 신경학적 악화·동공 변화가 있으면 응급 수술한다.", "B": "26 학습부 21번(검안) · 외상(두부, 척추)", "N": "2025년 41번 변형", "vn": "증례를 경막하출혈에서 경막외출혈로 바꾸고 같은 형식의 진술형 선지를 그에 맞게 다시 구성", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V13", "ch": 11, "base": "22-34", "lv": "minor", "stem": "<div>45세 여자가 2주 전 심한 설사를 앓은 뒤 5일 전부터 양다리에 힘이 빠지기 시작해 팔까지 진행하였다. 상하지 심부건반사가 소실되었고 감각은 비교적 보존되었다. 뇌척수액 검사에서 세포 3/mm3, 단백 95 mg/dL이었다. 가장 가능성이 높은 질환은?<\/div>", "o": ["중증근무력증", "길랑-바레 증후군", "저칼륨주기마비", "근위축성측삭경화증", "만성염증성탈수초다발신경병"], "a": 1, "E": "설사(선행 감염) 2주 뒤 하지에서 상지로 수일 만에 올라가는 대칭성 위약, 심부건반사 소실, 뇌척수액 단백 증가와 세포수 정상(albuminocytologic dissociation)은 길랑-바레 증후군이다. Campylobacter jejuni 장염이 대표 선행 감염이고, 치료는 지체 없이 IVIg 또는 혈장교환술이다. 같은 양상이 8주 이상 서서히 진행하거나 재발하면 CIDP를 생각한다.", "B": "26 학습부 23번(검안) · 척수, 말초 신경질환", "N": "2022년 34번 변형", "vn": "진행 기간(3개월 서서히 → 수일 급성)과 선행 감염을 바꿔 정답이 CIDP에서 길랑-바레로 바뀌게 함", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V14", "ch": 11, "base": "22-37", "lv": "minor", "stem": "<div>22세 남자가 주먹을 쥔 뒤 잘 펴지지 않는 증상으로 왔다. 측두근·저작근 위축, 앞머리 탈모가 있고 근전도에서 근긴장방전이 보인다. 아버지도 비슷한 증상이 있으나 환자보다 늦게 시작되었다. 이 질환의 유전학적 기전은?<\/div>", "o": ["HTT 유전자의 CAG 반복 확장", "PMP22 유전자 중복", "SMN1 유전자 결실", "DMPK 유전자의 CTG 반복 확장", "Dystrophin 유전자 결실"], "a": 3, "E": "grip myotonia, 근긴장방전, 측두근·저작근 위축과 앞머리 탈모는 근긴장디스트로피 1형이며, 원인은 DMPK 유전자의 CTG 삼핵산 반복 확장(상염색체 우성)이다. 아버지보다 환자에서 일찍 시작한 것은 대를 거듭할수록 반복이 늘어나 일찍·심하게 나타나는 표현촉진(anticipation) 때문이다(교과서 보충). CAG 반복은 헌팅턴병, PMP22 중복은 CMT1A, SMN1 결실은 척수성 근위축증, dystrophin 결실은 뒤센·베커 근디스트로피의 기전이다.", "B": "26 학습부 24번(검안) · 근접합부, 근육질환", "N": "2022년 37번 변형", "vn": "같은 증례에 가족력을 더하고 발문을 '유전자'에서 '유전학적 기전'으로 바꾸고 선지 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V15", "ch": 12, "base": "25-01", "lv": "minor", "stem": "<div>45세 남자가 시야장애로 왔다. 5년 전부터 손발이 커지고 턱이 나왔다고 한다. 시야검사에서 양측두 반맹이 있고 MRI에서 2.5 cm의 뇌하수체 대샘종이 보이며, 포도당 부하 후에도 GH가 억제되지 않았다. 가장 우선 고려할 치료는?<\/div>", "o": ["경접형동 종양제거술", "경과관찰", "약물치료(bromocriptine)", "방사선치료", "방사선수술"], "a": 0, "E": "말단비대증 증상과 포도당 부하 후 GH가 억제되지 않는 소견으로 GH 분비 뇌하수체 샘종이다. GH 분비 샘종은 경접형동 수술로 제거하는 것이 1차 치료이고, octreotide는 수술 후 보조 치료로 쓴다. 도파민 작용제(bromocriptine)를 1차로 쓰는 것은 프로락틴 분비 샘종이며, 방사선치료는 완전 제거가 안 되거나 재발했을 때 드물게 쓴다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "2025년 1번 변형", "vn": "같은 시야장애 증례에서 호르몬(PRL 400 → GH 과다)을 바꿔 정답이 약물치료에서 수술로 바뀌게 함", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V16", "ch": 12, "base": "25-02", "lv": "minor", "stem": "<div>오른쪽 위약감으로 시행한 조영증강 MRI에서 가운데가 괴사된 고리 모양 조영증강 종양이 보였고, 수술 후 IDH 야생형 교모세포종으로 진단되었다. 이 종양과 검사에 대한 설명으로 옳은 것은?<\/div>", "o": ["DTI tractogram은 종양의 혈류 관류를 보여준다", "PWI는 종양과 피질척수로의 위치 관계를 보여준다", "MRS에서 NAA/choline 비가 증가한다", "IDH 변이형 성상세포종보다 예후가 나쁘다", "1p/19q 동시 결실이 진단의 필수 소견이다"], "a": 3, "E": "IDH 야생형 교모세포종은 WHO 4등급으로, IDH 변이형 성상세포종이나 핍지교종보다 예후가 나쁘다(기대 여명 약 1년). DTI tractogram은 피질척수로 같은 백질 경로, PWI는 관류를 보여 주므로 ①·②는 서로 바뀌었다. MRS에서 악성 뇌종양은 NAA/choline 비가 감소하며, 1p/19q 동시 결실은 핍지교종 진단에 필요한 소견이다.", "B": "26 학습부 20번(검안) · 뇌종양", "N": "2025년 2번 변형", "vn": "같은 영상 검사 진술형에서 정답 진술을 MRS에서 IDH 예후로 바꾸고 선지 2개 교체", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V17", "ch": 7, "base": "25-61", "lv": "major", "stem": "<div>기억의 종류와 주로 관여하는 뇌 구조를 옳게 짝지은 것을 모두 고르시오.<br>ㄱ. 일화기억 - 해마<br>ㄴ. 절차기억 - 기저핵<br>ㄷ. 공포 조건화 - 편도체<br>ㄹ. 작업기억 - 후두엽<\/div>", "o": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "a": 1, "E": "일화기억은 해마·내측 측두엽, 절차기억은 기저핵(과 소뇌), 공포 조건화는 편도체가 주로 담당한다. 작업기억은 전전두엽의 기능이고 후두엽은 시각 처리 영역이므로 ㄹ은 틀린 짝이다. (교과서 보충)", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "2025년 61번 변형", "vn": "단일 구조를 묻던 형식을 기억 종류-구조 짝짓기 조합형으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V18", "ch": 7, "base": "25-70", "lv": "major", "stem": "<div>78세 여자가 건강검진에서 인지 상태를 물어보았다. 다음 중 정상 노화로 설명하기 어려워 추가 평가가 필요한 소견은?<\/div>", "o": ["정보 처리 속도가 느려졌다", "여러 일을 동시에 기억하며 처리하기 어렵다", "새로 만난 사람의 이름이 바로 떠오르지 않는다", "어휘력과 상식은 예전과 같다", "20년 동안 다니던 동네에서 길을 잃는다"], "a": 4, "E": "정상 노화에서는 처리 속도, 작업기억, 이름 떠올리기 같은 유동성 지능이 떨어지지만 어휘·상식 같은 결정성 지능은 유지된다. 오래 다닌 동네에서 길을 잃는 것은 시간·장소 지남력과 시공간 기능의 저하로, 치매 초기 증상일 수 있어 평가가 필요하다.", "B": "26 학습부 19번(검안) · 치매, 퇴행성 질환", "N": "2025년 70번 변형", "vn": "'떨어지지 않는 인지영역'을 묻던 개념형을 노인 증례에서 '비정상 소견'을 고르는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V19", "ch": 8, "base": "25-46", "lv": "major", "stem": "<div>30세 남자가 유리에 손목을 베여 정중신경이 완전히 절단되었다. 2주 뒤 절단부보다 원위부 신경을 조직검사했을 때 예상되는 소견은?<\/div>", "o": ["절단부 근위부 축삭 전체가 세포체까지 소실된다", "신경세포체가 즉시 괴사해 사라진다", "원위부 축삭과 수초가 분절되고 대식세포가 이를 탐식한다", "수초만 선택적으로 소실되고 축삭은 보존된다", "중추신경보다 재생이 불량해 재생 시도가 보이지 않는다"], "a": 2, "E": "정중신경이 완전히 절단되면 절단부 원위부에서 Wallerian degeneration이 일어나 축삭과 수초가 분절·변성되고 대식세포가 수초 잔해를 탐식한다. 근위부는 가장 가까운 랑비에 결절까지만 변성되고(①), 세포체는 central chromatolysis를 보일 뿐 즉시 죽지 않는다(②). 수초만 선택적으로 소실되는 것은 탈수초 질환이며(④), 말초신경은 슈반세포 덕분에 중추신경보다 재생이 잘 된다(⑤).", "B": "26 학습부 15번(검안) · 신경 병리", "N": "2025년 46번 변형", "vn": "개념 진술형을 신경 절단 증례의 조직 소견을 묻는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V20", "ch": 8, "base": "25-48", "lv": "major", "stem": "<div>12세 남아가 2년 전부터 계단 오르기가 힘들다. 종아리가 굵고 단단하며 아직 혼자 걸을 수 있다. 혈청 CK는 4,500 U/L이고, 근육생검의 dystrophin 면역염색에서 염색이 약하고 불규칙하게 보였다. 가장 가능성이 높은 진단은?<\/div>", "o": ["뒤센 근디스트로피", "근긴장디스트로피", "척수성 근위축증", "다발근염", "베커 근디스트로피"], "a": 4, "E": "서서히 진행하는 근위부 근력 약화, 종아리 가성 비대, CK 상승에 dystrophin 면역염색이 약하고 불규칙하게 보이며 12세에도 보행이 가능하면 Becker 근디스트로피다(dystrophin 감소·비정상 형태). Duchenne은 dystrophin이 완전히 없어 염색되지 않고 5세 전 발병, 10~12세경 휠체어에 의존한다. SMA는 신경원성 위축, 다발근염은 염증성 근병증이다.", "B": "26 학습부 15번(검안) · 신경 병리", "N": "2025년 48번 변형", "vn": "병리 진술형을 증례와 면역염색 소견으로 진단하는 형식으로 바꿈", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "V21", "ch": 9, "base": "25-07", "lv": "major", "stem": "<div>55세 남자가 걸을 때 몸통이 흔들리고 다리를 넓게 벌려 걷는다. 앉은 자세에서도 몸통이 흔들리지만, 손가락-코 검사와 발꿈치-정강이 검사는 양쪽 모두 정상이다. 병변 위치로 가장 가능 l, "lv": "minor", "pred": true, "t": "s", "stem": "<div>요추 추간판 탈출 환자를 눕힌 채 다리를 펴서 들어 올릴 때 방사통이 유발되는 검사는?<\/div>", "o": [], "a": -1, "A": "하지 직거상 검사 (straight leg raising test)", "acc": ["하지 직거상 검사", "straight leg raising test"], "E": "양성 척추질환 범위 정리 항목입니다. 정답: 하지 직거상 검사 (straight leg raising test)", "B": "26 학습부 26번(검안) · 양성 척추질환", "N": "주관식 예상 · 26번", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "P201", "ch": 6, "g": "양성 척추질환", "base": null, "lv": "minor", "pred": true, "t": "s", "stem": "<div>요추 추간판 탈출에서 침범 신경근을 쓰시오. ① L3-4 탈출로 슬개건 반사 저하·무릎 신전 약화 ② L4-5 후외측 탈출로 족하수 ③ L4-5 극외측(far lateral) 탈출 ④ L5-S1 탈출로 아킬레스건 반사 저하·족저굴곡 약화<\/div>", "o": [], "a": -1, "A": "① L4 ② L5 ③ L4 ④ S1", "acc": [], "E": "후외측 탈출은 아래 신경근, 극외측 탈출은 같은 높이(위) 신경근을 누릅니다.", "B": "26 학습부 26번(검안) · 양성 척추질환", "N": "주관식 예상 · 26번", "img": [], "v": true, "ok": true, "y": [], "vb": "검안"}, {"id": "P202", "ch": 13, "g": "뇌혈관질환 2 (출혈성·혈관기형)", "base": "25-94", "lv": "minor", "pred": true, "t": "s", "stem": "<div>지주막하 출혈로 클립 결찰술을 받은 3개월 후 종종걸음, 배뇨장애, 기억력 저하가 생겼다. CT는 다음과 같다. 진단은?<\/div>", "o": [], "a": -1, "A": "수두증 (hydrocephalus)", "acc": ["수두증", "hydrocephalus"], "E": "지주막하 출혈의 주요 합병증입니다.", "B": "26 학습부 27번(검안) · 뇌혈관질환 2 (출혈성)", "N": "주관식 예상 · 27번", "img": ["figs/p-i-015-063.jpg"], "v": true, "ok": true, "y": [], "vb": "검안"}], "trends": {"updated": "2026-11-26", "sources": "선배들의 과목설명회(2025년 수강 기준), 2025년 수업 기록, 2020~2025 복원 기출의 연도별 비교를 종합했습니다. 「기출 비교로 본 판단」은 이 사이트에 실린 최근 5개년 기출을 문항·개념 단위로 서로 비교해 Claude가 정리한 의견입니다.", "summary": ["양이 많고 주관식 비중이 커서 학습 부담이 큰 과목입니다. 2025년에는 시험을 한 번(1Q·2Q 분리 없이) 봤고, 주관식 스펠링은 사소한 실수면 인정해 준 사례가 있었습니다.", "대부분의 교수님이 기출을 그대로 또는 조금 바꿔 다시 내고, 수업 중 \"중요하다·시험에 낸다\"고 강조한 부분에서 새 문제를 냅니다. 새로 맡으신 파트나 새로 추가된 슬라이드에서는 처음 보는 문제가 나옵니다.", "2026년 바뀐 점: 봉정빈 교수님이 두통·척수/말초신경·근접합부/근육·탈수초/독성대사성질환을 다시 맡으십니다(2025년에는 정지연 교수님이 대신 강의). 두개내압·수두증은 김학성 교수님, 두부·척추 외상은 서종훈 교수님, 선천성 질환은 김치호 교수님이 이어서 맡으십니다.", "공부 순서 추천: ① 교수님별 기출 → ② 수업 중 강조 부분 → ③ 새로 추가된 강의안 내용. 아래 '연도 비교'는 이 사이트의 기출을 연도별로 비교한 결과입니다."], "profs": [{"prof": "안지예", "lectures": "강의 01·02·08·17", "points": ["2021년부터 담당. 강의안이 깔끔하고 강조 부분이 확실해서 수업을 듣는 것이 가장 효율적인 파트로 꼽힙니다.", "시간당 3문제 정도, 영역별로 골고루 출제한다고 하셨습니다(2025년 기준). 2026년 강의 02 수업 기록에는 시간당 2문제로 이 강의에서 4문제 정도(2025년: 신경피부증후군 2·중추신경계 감염 1·소아 두통 1)가 나올 것으로 적혀 있습니다. 강의 01 수업에서도 수업당 2문제를 낸다고 하셨고, 요추천자 금기사항과 뇌척수액 정상 수치가 시험에 많이 나온다며 꼭 기억하라고 하셨습니다. 기출 반복·변형과 강조 부분의 새 문제가 섞여 나옵니다.", "수치까지 정확히 외우는 것이 좋고, 용어·선지는 소아과학 교과서(홍창의) 기준입니다. 병변 위치를 찾는 문제가 자주 나옵니다. 신경피부증후군 세 질환(신경섬유종증 1형·결절성 경화증·Sturge-Weber)의 구분과, 세균성 수막염 항생제의 신생아/신생아 이후(생후 1개월) 구분이 중요합니다.", "2026년 강의 17 수업 기록에는 이 강의 범위에서 4문제를 내고, 한 문제만 낸다면 Duchenne 근디스트로피에서 내겠다고 강조하신 것으로 적혀 있습니다. 최근 2년 연속 X-연관 열성 유전 확률 계산 문제가 나왔습니다."], "analysis": ["2020~2025년 50문항(2025년 18문항)이고, 2025년 문항 중 3개는 그대로, 8개는 증례 틀을 유지하고 묻는 것만 바꿨으며, 7개가 새 문항입니다.", "해마다 빠지지 않는 단원은 신경피부증후군(Sturge-Weber·결절성 경화증), 소아 근육·말초신경질환(Duchenne·SMA·GBS), 소아 경련(결신발작·롤란딕 뇌전증 약물), 신생아 수막염 항생제입니다. 같은 증례에 다른 질문을 붙이는 방식(Sturge-Weber → 눈 이상, Duchenne → CK 수치)이 많습니다.", "판단: 2026년에도 위 단원에서 증례형으로 15~18문항 정도 나올 가능성이 높습니다. 증례마다 '진단 → 동반 소견 → 치료·검사'를 모두 정리해 두면 질문이 바뀌어도 풀 수 있습니다."]}, {"prof": "김학성", "lectures": "강의 03·11", "points": ["2023년부터 담당. 수업이 짧고 강조할 내용만 다뤄 강조 부분이 확실합니다. 기출과 강조 부분에서 출제합니다. 2025년 문항은 2023년과 같게 나와 2023년 이후 기출을 우선 보는 것이 좋습니다.", "GCS, 뇌신경 12쌍의 기능, 시야결손 부위, 피질제거·대뇌제거 경축(적핵 기준)을 강조하셨습니다. 2026년 강의 03에서는 중추성/말초성 안면마비(이마 주름 대칭 여부), 동안신경 마비와 후교통동맥 동맥류도 다시 강조하셨고, 새로 넣은 추체로·추체외로 슬라이드는 시험에 내지 않는다고 하셨습니다.", "두개내압·수두증은 이전 담당 교수님 강의안을 그대로 쓰고 강조 부분도 같아서, 그 기출(대부분 반복 출제)과 마지막 take home message를 보면 됩니다.", "2026년 강의 11 수업 기록에는 이 범위에서 6문제를 내고, Monro-Kellie doctrine은 주관식, 뇌척수액 순환 경로는 빈칸 채우기로 내겠다고 하신 것으로 적혀 있습니다(2025년에도 이 범위에서 6문제)."], "analysis": ["2025년 9문항 중 5개가 이전 기출(2023년 본인 문항 3개 + 이전 담당 교수님의 두개내압 문항 2개)과 같거나 거의 같습니다. 새 4문항은 Monro-Kellie 원리, 뇌척수액 순환, 수두증 수술처럼 강의의 기본 정의를 묻는 문항입니다.", "판단: 기출을 거의 그대로 반복하는 교수님입니다. 2025년 9문항이 2026년에 그대로 또는 선지만 바뀌어 나올 가능성이 가장 높습니다."]}, {"prof": "안성환", "lectures": "강의 04·05·14", "points": ["객관식은 기출을 많이 반복하지만, 증례를 바꾸거나 논문 그래프 해석 같은 새 형식도 냅니다.", "주관식이 까다롭습니다. 정확한 용어와 풀 스펠링을 요구한 사례가 있습니다(VDRL 풀네임, 14-3-3, 'malignant' cerebral edema).", "감염 파트는 기출 반복이 많습니다. 증례를 보고 병변 위치와 증상을 감별하는 연습을 하세요.", "2026년 강의 05 수업 기록에는 2025년 기출 78~84·91번이 이 강의에서 나왔고, 수업하지 않은 내용이라도 예전 기출에 나왔으면 다시 낼 수 있다고 적혀 있습니다. 급성기 치료 순서(정맥 혈전용해 4.5시간 → 혈전제거술 24시간 → 감압술 48시간)와 2차 예방 약 선택(심방세동·좌심방 혈전은 항응고제, TIA는 즉시 아스피린)을 기출로 정리해 두세요.", "2026년 강의 14(감염)는 새로 만든 강의안으로 진행했고, 2025년 이 범위 기출은 85~90번 6문제로 대체로 강조 내용에서 나왔습니다."], "analysis": ["2020~2023년에는 같은 문항을 여러 해 반복했지만(뇌경색 시간대별 치료는 2022·2023·2025 3번), 2025년 16문항 중 15개는 새 문항이었습니다(신경매독 VDRL, 14-3-3, 결핵 수막염 치료, 수막구균 접촉자 예방, rtPA 그래프, TIA, 2차 예방, 악성 뇌부종).", "개념 자체는 늘 '세균성·결핵성·바이러스성 수막염 감별과 치료', '뇌경색 시간대별 치료와 2차 예방'입니다. 문항을 새로 쓰고 주관식은 정확한 용어를 요구합니다.", "판단: 2025년만 보면 대폭 변형에 가깝습니다. 2026년에도 같은 개념을 새 증례로 낼 가능성이 높으니, 수막염 뇌척수액 소견 표와 뇌졸중 치료 시간 기준을 숫자까지 외우세요."]}, {"prof": "김현철", "lectures": "강의 06", "points": ["\"외우라고 한 곳에서 낸다\"고 하셨고, 영상 판독보다 암기형 문제가 대부분입니다.", "뇌내출혈 시기별 MRI 신호 변화는 매년 나옵니다. 수업 중 강조한 영상 소견을 눈에 익혀 두세요.", "2023년에는 6문제 중 2문제가 새 문제였는데, 모두 수업 중 강조한 부분에서 나왔습니다.", "2026년 강의 06은 2025년과 크게 바뀌지 않았습니다. Hounsfield 수치는 실습·인턴 때 꼭 필요하니 외우라고 하면서도 이번 시험에는 내지 않는다고 하셨고, 뇌내출혈 시기별 MRI 신호(T1/T2)는 다시 크게 강조하셨습니다."], "analysis": ["매년 6문항 정도로 일정하고, 2025년 6문항 중 5개가 2022·2023년과 같은 영상 개념(뇌경색 시기별 소견, 경계부 경색, 지주막하출혈, 뇌내출혈 시기, 소아 뇌출혈 원인 AVM)을 사진만 바꿔 냈습니다. 새 문항은 HU 순서 1개였습니다.", "판단: 반복에 가까운 소폭 변형입니다. 뇌내출혈 시기별 CT·MRI 신호와 뇌경색 시기별 소견 표는 2026년에도 거의 확실히 나옵니다."]}, {"prof": "김비오", "lectures": "강의 07", "points": ["2020년부터 담당. 쉽고 반복되는 개념 위주로 출제합니다. \"강조한 부분에서, 기존 기출을 약간만 틀어서 냈다\"고 하셨습니다.", "변형 방식은 발문 뒤집기(틀린 것→옳은 것)와 증례 수치·선지 일부 교체입니다(2023 #66 → 2025 #43).", "\"책 위주로 보고 슬라이드는 참고만\"이라고 하셨습니다. 기출 내용을 정확히 암기하면 됩니다.", "2026년 강의 07은 약 30분으로 짧았고, 수업 전후로 '중요한 부분은 정해져 있다, 시험은 기출을 보라'고 하셨습니다. 척추 경막외 농양의 항생제 기간(골수염 없으면 3~4주, 있으면 6~8주)과 수술 후 감염 위험요인(스테로이드·당뇨·비만·영양결핍·면역저하)이 반복해서 나옵니다."], "analysis": ["매년 3~4문항이고 개념이 거의 고정입니다(척추 수술 후 감염 위험요인 증례, 척수 경막외 농양, 화농성 척추염 원인균). 2025년 3문항 모두 이 세 개념이었고, 증례 수치나 발문 방향만 바꿨습니다.", "판단: 2026년에도 같은 세 개념이 나올 가능성이 매우 높습니다. 항생제 기간(골수염 동반 6~8주, 없으면 3~4주), MRI 진단, 황색포도상구균 정도는 정확히 외우세요."]}, {"prof": "김치호", "lectures": "강의 09", "points": ["2024년부터 담당(이전 주창일 교수님 파트). 수업이 짧고 강조점이 뚜렷하지 않지만, 시험은 이전 교수님 기출을 그대로 따랐습니다.", "이전 기출을 꼭 풀고, 설명하신 선천 기형의 특징적인 사진을 기억해 두세요.", "2026년 강의 09에서도 Chiari 기형(감압 수술), Dandy-Walker 기형의 세 가지 특징, 신경관 형성 단계별 기형을 다시 다루셨습니다. 2025년 두 문항은 정답률이 매우 높았던 기출 반복 문제였습니다."], "analysis": ["2025년에 처음 출제한 3문항(선천 기형의 발생 원리, Dandy-Walker, Chiari)은 모두 새 문항이었습니다. 비교할 연도가 없어 근거는 약합니다.", "판단: 첫해 문항을 다음 해에 반복하는 경향이 있는 파트라, 2025년 3문항과 이전 담당 교수님 기출을 그대로 볼 것을 권합니다."]}, {"prof": "주창일", "lectures": "강의 10·26", "points": ["경련성 질환의 수술적 치료는 주관식까지 기출을 많이 반복합니다.", "양성 척추질환은 2025년에 처음 맡으셨고(이전 이승명 교수님 파트), 개념을 이해했는지 묻는 새 문제를 냈습니다. 2026년에는 2025년 문제를 비슷하게 또는 조금 바꿔 낼 가능성이 높습니다.", "내시경 수술에 관심이 많아 수업에서 비중 있게 다루십니다.", "2026년 강의 10 수업 기록에는 '크게 중요한 영역은 아니니 편하게 들으라'고 하셨고, 수업 중 강조 부분이 예전 기출과 거의 겹친다고 적혀 있습니다. 수술 대상 기준, 측두엽 뇌전증 → 전방 측두엽 절제술, Lennox-Gastaut 증후군 → 뇌량 절개술이 매년 나옵니다."], "analysis": ["뇌전증 수술 3문항(수술 대상 기준, 측두엽 뇌전증의 전방 측두엽 절제, epileptogenic zone 주관식)은 2022·2023·2025년에 거의 그대로 나왔습니다.", "양성 척추질환 3문항(요추·경추 추간판 탈출, Spurling 징후)은 2025년에 처음 맡아 새로 냈습니다.", "판단: 2026년 뇌전증 수술은 그대로, 척추는 2025년 문항을 비슷하게 반복할 가능성이 높습니다."]}, {"prof": "김후원", "lectures": "강의 12·13·19", "points": ["강의가 난해하고 강조가 적은 편이지만, 기출을 변형해서 내고 지나가듯 언급한 부분에서도 주관식을 냅니다(예: 펜싱 자세, 치매 예방 연구, ARIA).", "새로 추가된 슬라이드에서 강조 문제가 나왔습니다(예: 알츠하이머 혈액검사 p-Tau217).", "신경계 구조와 기능은 뒷부분의 뇌 영역에서 주로 냅니다. 강의안 구석구석을 보는 것이 교과서보다 낫다는 평입니다.", "2026년 강의 13 수업 기록에 따르면 2025년 이 범위 6문제(64~69번)는 수업 중 강조점과 겹치지 않았습니다. 강의 자료 전반을 고르게 보고, 새로 추가된 슬라이드와 '모두 다' 선지에 주의하세요.", "2026년 강의 19 자료에 따르면 수업 내용은 작년과 거의 같고 강조점이 적었으며, 문제가 어렵고 수업에서 언급하지 않은 부분도 나옵니다(2025년 이 강의에서 6문제). 주관식은 단답형으로, 되도록 영어로 쓰고 철자에 주의하라고 하셨습니다."], "analysis": ["2020~2025년 50문항이고, 여러 해에 그대로 나온 문항이 0개입니다. 2025년 18문항 중 17개가 새 문항이었습니다(조건화 기억, 노화와 인지, 급속진행 치매, p-Tau 혈액검사, ARIA, 란셋 위험인자, 펜싱 자세, 해마경화증, 청소년 근간대 뇌전증 등).", "다만 단원은 매년 같습니다(신경계 구조와 기능, 뇌전증, 치매·퇴행성 질환). 강의안의 표나 한 줄 언급에서 그대로 문항을 만드는 경향이 보입니다.", "판단: 대폭 변형이 확실하고, 기출로 대비할 수 있는 비중이 가장 낮은 교수님입니다. 기출은 유형만 익히고, 강의안 전체(특히 새 슬라이드와 표)를 보는 데 시간을 쓰세요."]}, {"prof": "임성철", "lectures": "강의 15", "points": ["기출을 그대로 내기보다 조금씩 바꿔 내서, 관련 내용을 이해해야 풀 수 있습니다.", "수업 마지막에 단골 문제와 자주 나오는 함정을 짚어 주셨습니다. 그 부분과 강조 부분을 챙기세요.", "2026년 강의 15는 2025년과 거의 같았고 새 내용은 ALS의 TDP-43 분자병리입니다. 2025년 이 범위에서는 객관식 4문제·주관식 2문제가 나왔습니다."], "analysis": ["2025년 6문항이 모두 새 문항이었지만 형식은 같습니다. 신경 질환 하나를 정해 '병리학적 특징으로 옳은 것'을 묻습니다(Waller 변성, SMA, Becker, 다발성 경화증, 중증근무력증, ALS).", "판단: 2026년에도 다른 질환으로 같은 형식이 나올 가능성이 높습니다. 강의에 나온 질환마다 '손상 부위·핵심 병리 소견' 한 줄씩을 정리하세요."]}, {"prof": "김진호", "lectures": "강의 16·18", "points": ["기출을 반복하면서도 한동안 안 내던 오래된 기출을 다시 가져오는 경향이 있습니다. 오래된 기출까지 보세요.", "수업에서 다루지 않은 신경해부(교과서)에서 새 문제를 내기도 했고, 같은 개념의 정답 표현을 바꾼 사례가 있습니다(체인-스토크스 호흡: 사이뇌 → forebrain).", "운동이상은 수업 동영상의 특징적인 움직임을 정리해 두면 좋습니다.", "2026년 강의 16은 앞부분 슬라이드 몇 장만 새로 추가되었고, 떨림 종류별(본태성·파킨슨) 차이, sensory trick, 무도증의 특징, PSP의 하방 주시 마비, 윌슨병 선별을 반복 강조하셨습니다. 강의 18은 혼수 위주로 강의하고 신경학적 검사는 영상으로 대신했습니다(2025년: 혼수 6·신경학적 검사 3문제). GCS 최저점, 호흡 패턴별 병터, 경축 자세 차이를 강조하셨습니다."], "analysis": ["2025년 16문항 중 2개는 그대로(적핵척수로, 감각 트릭), 2개는 비슷, 12개가 새 문항이었습니다. 운동장애(파킨슨·무도증·진행핵상마비·Wilson·근긴장이상·편측발리즘)는 2020년부터 매년 나왔습니다. 뇌간 병변 위치, 혼수 진찰(인형눈 검사·호흡 양상·감금증후군)도 2022년부터 매년 나왔습니다.", "판단: 단원은 고정이고 문항은 대부분 새로 씁니다. 병변 위치 찾기와 운동장애 감별의 특징 소견을 표로 정리해 두면 새 문항에도 대응할 수 있습니다. 오래된 기출을 다시 가져오는 경우도 있습니다."]}, {"prof": "서종훈", "lectures": "강의 21", "points": ["2024년부터 담당. 이전 교수님 강의안과 거의 같아 시험도 이전 기출과 비슷하게 나왔습니다.", "강의안 밑줄 부분을 강조하십니다. 주관식에서 강의안의 숫자를 그대로 물은 사례가 있습니다(척추뼈 개수).", "경막외출혈 사진과 수술을 묻는 문제가 나왔으니, 경막하출혈의 사진과 수술도 함께 보세요.", "2026년 강의 21에서는 강조한 부분과 수업 중 사례 문제(의식 악화 두부외상, 명료기 뒤 의식 저하 경막외혈종, 골절 없는 중심척수증후군) 위주로 준비하라고 하셨습니다. 강조점: GCS(운동반응), CT가 정상인데 의식장애가 심하면 MRI로 미만성 축삭손상 확인, 경막외/경막하 혈종 비교, sacral sparing, 불완전 척수손상 증후군."], "analysis": ["2025년 첫 3문항(두부 손상 진단과 GCS, 경막외·경막하 출혈 감별, 척추뼈 개수)만 있어서 비교 근거가 없습니다.", "판단: 강의안이 이전 담당 교수님과 같았으니, 2025년 3문항이 반복되거나 비슷한 형식으로 나올 가능성이 높습니다."]}, {"prof": "봉정빈", "lectures": "강의 22·23·24·25", "points": ["강조가 확실한 교수님입니다. \"시험에 낸다\"고 강조한 부분에서 출제해 정답률이 높았습니다.", "길랑-바레 증후군은 매년 비슷한 선지로 나옵니다. 수업 초반 척수 해부와 관련 질환, 손목터널증후군도 출제됐습니다.", "2025년에는 대신 강의한 교수님도 봉정빈 교수님 기출을 그대로 냈으니, 2022·2023년 기출을 우선 보세요.", "2026년 강의 23·24 자료: 길랑-바레 증후군(치료 IVIg, 스테로이드는 효과 없음)을 시험에 나오는 질환으로 강조했고 CIDP·ALS·압박신경병증도 강조했습니다. 근접합부는 중증근무력증(진단·치료)과 RNST(MG 감쇄 vs LEMS 증가)를 가장 중요하다고 하셨고, 근육병 유전자 표는 올해 외우지 않아도 된다고 하셨습니다."], "analysis": ["2020~2023년 28문항입니다. 중증근무력증(반복신경자극검사), 근긴장디스트로피(DMPK), 길랑-바레(치료), 손목터널증후군, Lambert-Eaton이 여러 해 같거나 비슷하게 나왔습니다. 2023년 7문항 중 4개가 이전 기출과 같거나 비슷했습니다.", "판단: 2026년에 다시 맡으시니 2022·2023년 문항을 중심으로 반복될 가능성이 높습니다. 두통·탈수초 파트는 2025년 다른 교수님 문항도 참고하세요."]}, {"prof": "김종규", "lectures": "강의 20", "points": ["수업에서는 \"몰라도 된다\"고 하시지만 시험은 꼼꼼히 냅니다. 조금씩 새 문제를 넣는 경향이 있습니다(약물 이름 주관식 첫 출제).", "뇌하수체 샘종: 프로락틴 분비 샘종은 시야장애가 있어도 약물이 1차, 프로락틴이 낮고 시야장애면 수술. 2023·2025년에 이 차이를 물었습니다.", "2026년 강의 20 수업에서 이 강의에서 2~3문제를 낸다고 예고하셨습니다. 강의안이 신경외과학 5판 기준으로 바뀌어 핍지교종, 2021 수막종 분류가 새로 들어갔으니 새 슬라이드에서 새 문제가 나올 가능성이 높습니다."], "analysis": ["매년 1~3문항이고 교모세포종(MRS·IDH·표준 항암제)과 뇌하수체 샘종이 반복 주제입니다. 2025년 3문항 중 교모세포종 MRS는 2023년과 거의 같았고, 프로락틴종 약물과 temozolomide는 새로 냈습니다.", "판단: 2026년에도 이 두 종양에서 나올 가능성이 높습니다. 프로락틴 수치에 따른 약물/수술 선택을 정확히 구분하세요."]}, {"prof": "김재호", "lectures": "강의 27", "points": ["2022년부터 담당. 강의안에 별표한 부분에서 해마다 거의 같은 문제를 냅니다(객관식 3·주관식 2).", "쉽게 출제하시니 지엽적인 내용보다 굵직한 내용과 기출 위주로 공부하면 됩니다."], "analysis": ["2022·2023·2025년 문항이 거의 같습니다. 2025년 4문항 중 3개가 그대로였고(모야모야 간접 재관류, 지주막하출혈 후 수두증, 뇌내출혈 원인), 1개는 거의 같았습니다(뇌동맥류 치료).", "판단: 반복 출제 교수님입니다. 2025년 4문항을 그대로 외우면 됩니다."]}], "analysis": ["2025년 문항 111개 중 이전 기출과 같거나 거의 같은 문항은 약 37개(1/3)입니다. 나머지 2/3는 같은 단원에서 새로 쓴 문항이라, 기출 암기만으로는 절반을 넘기기 어렵습니다.", "교수님마다 차이가 큽니다. 김재호·김비오·주창일(뇌전증 수술)·김학성·김현철 교수님은 2025년 문항 대부분이 이전 기출과 같거나 비슷합니다. 반면 김후원·안성환·임성철·김진호 교수님은 2025년 문항 대부분이 새 문항입니다.", "새 문항도 단원은 해마다 같습니다(예: 치매·뇌전증, 중추신경계 감염, 운동장애, 신경피부증후군). 그래서 '어느 단원에서 몇 문제'는 기출로 예측하고, 그 단원 강의 내용을 넓게 보는 것이 맞습니다.", "출제 문항 수가 늘고 있습니다(2022 → 2023 → 2025). 2025년에는 1·2큐를 나누지 않고 한 번에 봐서 교수님별 문항 수가 많아졌으니, 2026년도 2025년과 비슷한 분량으로 대비하세요."]}}</script>
